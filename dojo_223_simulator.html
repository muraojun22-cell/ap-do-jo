.png\" style=\"max-width: 100%; height: auto;\" width=\"535\"/></div></div>", "past_history": [], "hist_count": 1}, {"id": "sc_02_aki_q19", "session": "支援士 R2秋", "gap": 9, "num": 19, "topic": "認証プロトコル", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "リモートアクセス環境において，認証情報やアカウンティング情報をやり取りするプロトコルはどれか。", "mondai_html": "<div id=\"mondai\">リモートアクセス環境において，認証情報やアカウンティング情報をやり取りするプロトコルはどれか。</div>", "choices": {"ア": "CHAP", "イ": "PAP", "ウ": "PPTP", "エ": "RADIUS"}, "choices_html": {"ア": "CHAP", "イ": "PAP", "ウ": "PPTP", "エ": "RADIUS"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">Challenge Handshake Authentication Protocolの略。PPPで利用できる認証プロトコルで、チャレンジレスポンス方式で認証を受ける方式です。<br/>認証情報をやり取りしますが、アカウンティング情報に関しては規定されていません。</li><li class=\"lii\">Password Authentication Protocolの略。PPPで利用できる認証プロトコルで、IDとパスワードを平文で送って認証を受ける方式です。<br/>CHAPと同様に認証情報をやり取りしますが、アカウンティング情報に関しては規定されていません。</li><li class=\"liu\">Point-to-Point Tunneling Protocolの略。PPPパケットをIPデータグラムでカプセル化してVPNを作り出す技術です。</li><li class=\"lie\">正しい。<strong>RADIUS</strong>(Remote Authentication Dial In User Service)は、認証および利用ログの記録を単一のサーバに一元化することを目的としたプロトコルです。<br/>常時接続方式のインターネット接続サービス、無線LAN、VLAN、コンテンツ提供サービスなどのサービス提供者側設備において、認証とアカウンティング(利用の事実の記録)を実現するプロトコルとして広く利用されています。</li></ul></div>", "past_history": ["情報セキュリティ H26秋期 問19"], "hist_count": 2}, {"id": "sc_02_aki_q21", "session": "支援士 R2秋", "gap": 9, "num": 21, "topic": "コミット処理完了とみなすタイミング", "subcat": "トランザクション処理", "category": "情報セキュリティ", "mondai": "DBMSがトランザクションのコミット処理を完了するタイミングはどれか。", "mondai_html": "<div id=\"mondai\">DBMSがトランザクションのコミット処理を完了するタイミングはどれか。</div>", "choices": {"ア": "プリケーションの更新命令完了時点", "イ": "チェックポイント処理完了時点", "ウ": "ログバッファへのコミット情報書込み完了時点", "エ": "ログファイルへのコミット情報書込み完了時点"}, "choices_html": {"ア": "プリケーションの更新命令完了時点", "イ": "チェックポイント処理完了時点", "ウ": "ログバッファへのコミット情報書込み完了時点", "エ": "ログファイルへのコミット情報書込み完了時点"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">トランザクションが正常終了したときはCOMMITコマンドによってトランザクションを確定させますが、COMMITを発行したからといって即座に補助記憶に更新内容が反映されるわけではありません。これはデータベースの更新が主記憶を介して①～⑤の手順で行われるからです。<ol><li class=\"maru1\">トランザクション開始</li><li class=\"maru2\">データベースから主記憶にデータを読み込む</li><li class=\"maru3\">主記憶上のデータを更新する</li><li class=\"maru4\">コミット～トランザクション終了</li><li class=\"maru5\">書出しのタイミング(チェックポイント)ごとに、それまでに主記憶上で更新されたデータをまとめて補助記憶に書き込む</li></ol>補助記憶への書出しは効率化のために一定時間ごとにまとめて行われるため、COMMIT文を実行したからといってその内容が補助記憶に書き出されている保証はありません。主記憶は揮発メモリなので、もしコミット文実行と補助記憶への書出しの間に障害が発生した場合は、トランザクションの情報が失われてしまうことになります。これではトランザクションの永続性(耐久性)を満たすことはできません。<br/><br/>このような理由からトランザクションは、コミット文が実行された時点ではなくWALプロトコルに従って<em class=\"r\">更新後ログが物理的記憶装置に書き込まれた瞬間</em>にコミットしたとみなします。一旦ログが安定記憶上(二重化されたディスクなど)に書き込まれたならば、たとえコミット文に実行以後に障害が発生しても、そのトランザクションを再現することが可能になるためです。<br/><br/>したがって正解は「エ」です。<dl><dt>WALプロトコル</dt><dd>トランザクションがログを安定記憶に書き出すタイミングについての取り決めで、\"Write Ahead Log\"(まずログを書け)という意味のとおり、実際の操作に先行してログの書き出すことを求めるもの</dd></dl></div>", "past_history": ["情報セキュリティ H28秋期 問21", "安全確保支援士 H30春期 問21"], "hist_count": 3}, {"id": "sc_02_aki_q22", "session": "支援士 R2秋", "gap": 9, "num": 22, "topic": "利用者を役割ごとに描いた仮想の人物", "subcat": "ソフトウェア要件定義", "category": "情報セキュリティ", "mondai": "ソフトウェアの要件定義における利用者の分析で活用される，ソフトウェアの利用者を役割ごとに典型的な姿として描いた仮想の人物を何と呼ぶか。", "mondai_html": "<div id=\"mondai\">ソフトウェアの要件定義における利用者の分析で活用される，ソフトウェアの利用者を役割ごとに典型的な姿として描いた仮想の人物を何と呼ぶか。</div>", "choices": {"ア": "エピック", "イ": "ステークホルダ", "ウ": "プロダクトオーナー", "エ": "ペルソナ"}, "choices_html": {"ア": "エピック", "イ": "ステークホルダ", "ウ": "プロダクトオーナー", "エ": "ペルソナ"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">エピックは、粒度の粗いユーザーストーリーです。ユーザーストーリーの集合とも言えます。</li><li class=\"lii\">ステークホルダは、プロジェクトメンバー、プロジェクトマネージャ、取引先、顧客、株主、経営者、地域などのように、プロジェクトの意思決定、活動、もしくは成果に影響を受ける可能性のあるすべての人やグループです。</li><li class=\"liu\">プロダクトオーナーは、プロダクトの価値を最大化するためにチームを牽引し、構築されるプロダクトに最終的な責任を負う人物です。</li><li class=\"lie\">正しい。<strong>ペルソナ</strong>は、目的、動機、行動パターン等の代表的な個人的特性を具体的に設定した典型的な利用者像のことです。ソフトウェアをデザインする際にペルソナを定義することで、ターゲットのニーズに沿ったプロダクトとなることが期待できます。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_02_aki_q23", "session": "支援士 R2秋", "gap": 9, "num": 23, "topic": "ふりかえりを行う適切なタイミング", "subcat": "開発プロセス・手法", "category": "情報セキュリティ", "mondai": "アジャイル開発のプラクティスの一つである\"ふりかえり(レトロスペクティブ)\"を行う適切なタイミングはどれか。", "mondai_html": "<div id=\"mondai\">アジャイル開発のプラクティスの一つである\"ふりかえり(レトロスペクティブ)\"を行う適切なタイミングはどれか。</div>", "choices": {"ア": "\"タスクボード\"に貼ったタスクカードが移動されたとき", "イ": "各\"イテレーション\"の最後", "ウ": "毎日行う\"朝会\"", "エ": "毎日メンバーの気持ちを見える化する\"ニコニコカレンダー\"に全チームメンバーが記入し終えたとき"}, "choices_html": {"ア": "\"タスクボード\"に貼ったタスクカードが移動されたとき", "イ": "各\"イテレーション\"の最後", "ウ": "毎日行う\"朝会\"", "エ": "毎日メンバーの気持ちを見える化する\"ニコニコカレンダー\"に全チームメンバーが記入し終えたとき"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">\"<strong>ふりかえり</strong>\"は、イテレーション内で実施したことや起きたことを、最後にチーム全員でふりかえり、開発プロセス、コミュニケーション、その他様々な活動をよりよくする改善案を皆で考えることをいいます。<br/><br/>したがって、適切な実施タイミングは各イテレーションの最後です。<ul><li class=\"lia\">\"タスクボード\"とは、タスクを付箋などに書き出して皆から見えるボードに貼ることで、チームの抱えるタスクを見える化するものです。</li><li class=\"lii\">正しい。</li><li class=\"liu\">\"朝会\"とは、毎朝、時間を決めて行われる関係者同士の短いミーティングのことです。チーム内のこまめな情報共有を目的とします。</li><li class=\"lie\">\"ニコニコカレンダー\"とは、カレンダーにその日の気持ちを表すシールを貼るなどして、チームのムードやメンバーの気持ちを見える化するものです。</li></ul><dl><dt>イテレーション(Iteration)</dt><dd>アジャイル開発における反復の単位で、分析、設計、実装、テストの一連の活動を含みます。アジャイル開発では、概ね数週間程度ごとにこの開発サイクルを繰り返して次第に完成度を高めていきます。</dd></dl></div>", "past_history": [], "hist_count": 1}, {"id": "sc_02_aki_q24", "session": "支援士 R2秋", "gap": 9, "num": 24, "topic": "TCOが最小のものはどれか", "subcat": "サービスの設計・移行", "category": "情報セキュリティ", "mondai": "新システムの開発を計画している。提案された4案の中で，TCO(総所有費用)が最小のものはどれか。ここで，このシステムは開発後，3年間使用されるものとする。", "mondai_html": "<div id=\"mondai\">新システムの開発を計画している。提案された4案の中で，TCO(総所有費用)が最小のものはどれか。ここで，このシステムは開発後，3年間使用されるものとする。<div class=\"img_margin\"><img alt=\"24.png/image-size:336×191\" height=\"191\" src=\"https://www.sc-siken.com/kakomon/02_aki/img/24.png\" style=\"max-width: 100%; height: auto;\" width=\"336\"/></div></div>", "choices": {"ア": "A案", "イ": "B案", "ウ": "C案", "エ": "D案"}, "choices_html": {"ア": "A案", "イ": "B案", "ウ": "C案", "エ": "D案"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>TCO</strong>(Total Cost of Ownership)は、ある設備・システムなどを取得してから廃棄に至るまでのライフサイクル全体で発生するコストの総額を表します。総所有コストとも呼ばれます。<br/><br/>表中の費用はすべてシステムの保有に関連して生じるものですので、合計額を案ごとに比較します。3年間の運用が前提となっているので、毎年かかる費用は3倍する点に気を付ける必要があります。<ul><li class=\"lia\">30＋30＋5＋(20＋6＋6)×3＝65＋96＝161</li><li class=\"lii\">30＋50＋5＋(20＋5＋4)×3＝85＋87＝172</li><li class=\"liu\">40＋30＋5＋(15＋5＋6)×3＝75＋78＝<em class=\"r\">153</em></li><li class=\"lie\">40＋40＋5＋(15＋5＋4)×3＝85＋72＝157</li></ul>計算結果より「C案」のTCOが最小であることがわかります。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_02_aki_q25", "session": "支援士 R2秋", "gap": 9, "num": 25, "topic": "個人情報管理台帳の内部監査", "subcat": "システム監査", "category": "情報セキュリティ", "mondai": "プライバシーマークを取得しているA社は，個人情報管理台帳の取扱いについて内部監査を行った。判明した状況のうち，監査人が指摘事項として監査報告書に記載すべきものはどれか。", "mondai_html": "<div id=\"mondai\">プライバシーマークを取得しているA社は，個人情報管理台帳の取扱いについて内部監査を行った。判明した状況のうち，監査人が指摘事項として監査報告書に記載すべきものはどれか。</div>", "choices": {"ア": "個人情報管理台帳に，概数でしかつかめない個人情報の保有件数は概数だけで記載している。", "イ": "個人情報管理台帳に，ほかの項目に加えて，個人情報の保管場所，保管方法，保管期限を記載している。", "ウ": "個人情報管理台帳の機密性を守るための保護措置を講じている。", "エ": "個人情報管理台帳の見直しは，新たな個人情報の取得があった場合にだけ行っている。"}, "choices_html": {"ア": "個人情報管理台帳に，概数でしかつかめない個人情報の保有件数は概数だけで記載している。", "イ": "個人情報管理台帳に，ほかの項目に加えて，個人情報の保管場所，保管方法，保管期限を記載している。", "ウ": "個人情報管理台帳の機密性を守るための保護措置を講じている。", "エ": "個人情報管理台帳の見直しは，新たな個人情報の取得があった場合にだけ行っている。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">A社はプライバシーマークを取得しているので、プライバシーマーク制度への適合性を確認するため、JIS Q 15001:2017および一般財団法人日本情報経済社会推進協会(JIPDEC)のプライバシーマーク付与適格性審査基準に基づいて、適正な状況かどうかを判断します。<ul><li class=\"lia\">台帳管理の主旨は、1件残らず漏れなく管理していることの証明ではなく、事業者内での個人情報の取扱状況を把握することであるため、個人情報管理台帳に件数を含める場合、概数でよいとされています。したがって適切な状況であると判断できます。</li><li class=\"lii\">個人情報管理台帳には、個人情報の項目、利用目的、<em class=\"r\">保管場所</em>、<em class=\"r\">保管方法</em>、アクセス権を管理する者、利用期限、<em class=\"r\">保管期限</em>が少なくとも含まれていることとされています。したがって、保管場所、保管方法、保管期限が記載されているのは適切な状況であると判断できます。</li><li class=\"liu\">文書化した情報は、機密性の喪失、不適切な使用および完全性の喪失から十分に保護されていることが求められます。したがって、個人情報管理台帳に機密性保護措置を講じているのは適切な状況であると判断できます。</li><li class=\"lie\">正しい。個人情報管理台帳の内容を少なくとも年一回、適宜に確認し、最新の状態で維持していることとされています。新たな取得がなくても台帳を定期的に見直す必要があるので、指摘事項に該当します。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q1", "session": "支援士 R1秋", "gap": 10, "num": 1, "topic": "FIDO1.1に基づいた認証処理", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "認証処理のうち，FIDO(Fast IDentity Online) UAF(Universal Authentication Framework)1.1に基づいたものはどれか。", "mondai_html": "<div id=\"mondai\">認証処理のうち，FIDO(Fast IDentity Online) UAF(Universal Authentication Framework)1.1に基づいたものはどれか。</div>", "choices": {"ア": "SaaS接続時の認証において，PINコードとトークンが表示したワンタイムパスワードとをPCから認証サーバに送信した。", "イ": "SaaS接続時の認証において，スマートフォンで顔認証を行った後，スマートフォン内の秘密鍵でデジタル署名を生成して，そのデジタル署名を認証サーバに送信した。", "ウ": "インターネットバンキング接続時の認証において，PCに接続されたカードリーダーを使って，利用者のキャッシュカードからクライアント証明書を読み取って，そのクライアント証明書を認証サーバに送信した。", "エ": "インターネットバンキング接続時の認証において，スマートフォンを使い指紋情報を読み取って，その指紋情報を認証サーバに送信した。"}, "choices_html": {"ア": "SaaS接続時の認証において，PINコードとトークンが表示したワンタイムパスワードとをPCから認証サーバに送信した。", "イ": "SaaS接続時の認証において，スマートフォンで顔認証を行った後，スマートフォン内の秘密鍵でデジタル署名を生成して，そのデジタル署名を認証サーバに送信した。", "ウ": "インターネットバンキング接続時の認証において，PCに接続されたカードリーダーを使って，利用者のキャッシュカードからクライアント証明書を読み取って，そのクライアント証明書を認証サーバに送信した。", "エ": "インターネットバンキング接続時の認証において，スマートフォンを使い指紋情報を読み取って，その指紋情報を認証サーバに送信した。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>FIDO</strong>(Fast IDentity Online，ファイド)は、公開鍵暗号方式を使用したクライアント認証技術の1つで、オンラインサービスがクライアントを認証する際に用いられます。FIDO Allianceにより推進されています。<br/><br/>FIDOには、パスワード不要のUAF、パスワードなしに加えて二要素認証を行うCTAP1、パスワードなしに加えて多要素認証を行うCTAP2という仕様があります。本問では単純にパスワードなしの認証を行うUAFの認証処理について問うています。<br/><br/>FIDOの仕組みは次の通りです。<br/><br/>[登録時]<ul><li class=\"li1\">利用者はオンラインサービスの要求に応じ、顔認証、指紋認証及び安全なPIN入力等によってデバイスのロックを解除する</li><li class=\"li2\">利用者のデバイスは新しい公開鍵ペアを作成する</li><li class=\"li3\">公開鍵はオンラインサービスに登録され、秘密鍵は利用者のデバイスに格納される</li></ul>[認証時]<ul><li class=\"li1\">サーバは利用者にチャレンジを送信する</li><li class=\"li2\">利用者は登録時と同じ方法を使ってデバイスのロックを解除する</li><li class=\"li3\">利用者のデバイスは秘密鍵でチャレンジにデジタル署名を行い、サーバに応答する</li><li class=\"li4\">サーバは対応する公開鍵で応答を検証し、認証の可否を判断する</li></ul>FIDOでは秘密鍵の所持を確認することで認証するので、利用者がID・パスワードを覚えておく必要がないという特長があります。<br/><br/>FIDO UAFの認証手順を踏まえると、デバイス内の秘密鍵でデジタル署名を作成し、そのデジタル署名をサーバに送信している「イ」が適切です。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q2", "session": "支援士 R1秋", "gap": 10, "num": 2, "topic": "サイドチャネル攻撃に該当するもの", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "暗号機能を実装したIoT機器において脅威となるサイドチャネル攻撃に該当するものはどれか。", "mondai_html": "<div id=\"mondai\">暗号機能を実装したIoT機器において脅威となるサイドチャネル攻撃に該当するものはどれか。</div>", "choices": {"ア": "暗号化関数を線形近似する式を導き，その線形近似式から秘密情報の取得を試みる。", "イ": "機器が発する電磁波を測定することによって秘密情報の取得を試みる。", "ウ": "二つの平文の差とそれぞれの暗号文の差の関係から，秘密情報の取得を試みる。", "エ": "理論的にあり得る復号鍵の全てを機器に入力して秘密情報の取得を試みる。"}, "choices_html": {"ア": "暗号化関数を線形近似する式を導き，その線形近似式から秘密情報の取得を試みる。", "イ": "機器が発する電磁波を測定することによって秘密情報の取得を試みる。", "ウ": "二つの平文の差とそれぞれの暗号文の差の関係から，秘密情報の取得を試みる。", "エ": "理論的にあり得る復号鍵の全てを機器に入力して秘密情報の取得を試みる。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>サイドチャネル攻撃</strong>は、対象の動作状況を観察し、漏洩電磁波・電力消費等のサイドチャネル情報から暗号鍵推定等を行う非破壊型解析攻撃の総称です。サイドチャネル(Side Channel)には、非正規の入出力経路という意味があります。<br/><br/>具体的な攻撃方法としては、故障利用攻撃、タイミング攻撃や電力解析攻撃、電磁波解析攻撃などがあります。<dl><dt>故障利用攻撃</dt><dd>デバイスに限定的な障害を故意に与え、デバイスの計算誤りから秘密情報を解析する手法</dd><dt>タイミング攻撃</dt><dd>暗号処理のタイミングが暗号鍵の論理値に依存して変化することに着目し、暗号化や復号に要する時間の差異を統計的に解析して暗号鍵を推定する手法</dd><dt>電力解析攻撃</dt><dd>消費電力の変化に着目して鍵や処理内容の解析を試みる手法</dd><dt>電磁波解析攻撃（テンペスト攻撃）</dt><dd>機器が発する電磁波を測定することによって秘密情報の取得を試みる手法</dd></dl><ul><li class=\"lia\">暗号化関数の線形近似式を発見することを基本とした「線形解読法」の説明です。</li><li class=\"lii\">正しい。サイドチャネル攻撃の一つである「電磁波解析攻撃」の説明です。</li><li class=\"liu\">入力値の差分が出力値の差分にどのような影響を与えるかを分析して解読を試みる「差分解読法」の説明です。</li><li class=\"lie\">ブルートフォース攻撃(総当たり攻撃)の説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q5", "session": "支援士 R1秋", "gap": 10, "num": 5, "topic": "ダイナミックパケットフィルタリング", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "ファイアウォールにおけるダイナミックパケットフィルタリングの特徴はどれか。", "mondai_html": "<div id=\"mondai\">ファイアウォールにおけるダイナミックパケットフィルタリングの特徴はどれか。</div>", "choices": {"ア": "IPアドレスの変換が行われるので，内部のネットワーク構成を外部から隠蔽できる。", "イ": "暗号化されたパケットのデータ部を復号して，許可された通信かどうかを判断できる。", "ウ": "過去に通過したリクエストパケットに対応付けられる戻りのパケットを通過させることができる。", "エ": "パケットのデータ部をチェックして，アプリケーション層での不正なアクセスを防止できる。"}, "choices_html": {"ア": "IPアドレスの変換が行われるので，内部のネットワーク構成を外部から隠蔽できる。", "イ": "暗号化されたパケットのデータ部を復号して，許可された通信かどうかを判断できる。", "ウ": "過去に通過したリクエストパケットに対応付けられる戻りのパケットを通過させることができる。", "エ": "パケットのデータ部をチェックして，アプリケーション層での不正なアクセスを防止できる。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ダイナミックパケットフィルタリング</strong>は、通信の状況に応じて動的にフィルタリングテーブルの更新を行うファイアウォールの方式です。<br/><br/>静的なフィルタリングテーブルでは、1つの通信に対して発信パケットと戻りパケットの両方を登録しておかなければなりませんが、ダイナミックパケットフィルタリングの初期フィルタリングテーブルには、内部から外部に向けて通信の開始時に開始させるパケットのみを通過許可ルールとして設定しておきます。<br/>実際に通信要求があると、接続要求に対する応答、それに付随するコネクションなどの通信を許可する一時的なルールが自動的にフィルタリングテーブルに追加されます。さらに通信後のセッション終了に伴い、追加された一時的ルールは破棄されます。<br/><br/>この仕組みにより、ルール設定の平易化、およびフィルタリングテーブルの不備を悪用した不正アクセスや順序関係の矛盾したパケットの通過を防止するセキュリティ効果が期待できます。したがって適切な記述は「ウ」です。<ul><li class=\"lia\">NAT機能及びNAPT機能の特徴です。</li><li class=\"lii\">復号機能は持ちません。</li><li class=\"liu\">正しい。ダイナミックパケットフィルタリングの特徴です。</li><li class=\"lie\">アプリケーションゲートウェイ型ファイアウォールやWAFの特徴です。パケットフィルター型はデータ部のチェックを行いません。</li></ul></div>", "past_history": ["安全確保支援士 R3秋期 問6", "情報セキュリティ H24秋期 問6", "情報セキュリティ H26春期 問6", "情報セキュリティ H28秋期 問5", "安全確保支援士 H30春期 問6"], "hist_count": 6}, {"id": "sc_01_aki_q7", "session": "支援士 R1秋", "gap": 10, "num": 7, "topic": "ガバナンスプロセスのおけるモニター", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "JIS Q 27014:2015(情報セキュリティガバナンス)における，情報セキュリティを統治するために経営陣が実行するガバナンスプロセスのうちの\"モニター\"はどれか。", "mondai_html": "<div id=\"mondai\">JIS Q 27014:2015(情報セキュリティガバナンス)における，情報セキュリティを統治するために経営陣が実行するガバナンスプロセスのうちの\"モニター\"はどれか。</div>", "choices": {"ア": "情報セキュリティの目的及び戦略について，指示を与えるガバナンスプロセス", "イ": "戦略的目的の達成を評価することを可能にするガバナンスプロセス", "ウ": "独立した立場からの客観的な監査，レビュー又は認証を委託するガバナンスプロセス", "エ": "利害関係者との間で，特定のニーズに沿って情報セキュリティに関する情報を交換するガバナンスプロセス"}, "choices_html": {"ア": "情報セキュリティの目的及び戦略について，指示を与えるガバナンスプロセス", "イ": "戦略的目的の達成を評価することを可能にするガバナンスプロセス", "ウ": "独立した立場からの客観的な監査，レビュー又は認証を委託するガバナンスプロセス", "エ": "利害関係者との間で，特定のニーズに沿って情報セキュリティに関する情報を交換するガバナンスプロセス"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">JIS Q 27014は、情報セキュリティガバナンスの概念及び原則を示したJIS規格です。<br/><br/>この規格では、情報セキュリティガバナンスを「組織の情報セキュリティ活動を指導し，管理するシステム」と定義し、情報セキュリティガバナンスの目的を3つ挙げています。<dl><dt>戦略の整合</dt><dd>情報セキュリティの目的及び戦略を，事業の目的及び戦略に合わせる。</dd><dt>価値の提供</dt><dd>経営陣及び利害関係者に価値を提供する。</dd><dt>説明責任</dt><dd>情報リスクに対して適切に対処されていることを確実にする。</dd></dl>そして、情報セキュリティを統治するためのプロセスとして、評価、指示、モニター、コミュニケーション及び保証の5つを定義しています。これが設問に記載されているガバナンスプロセスです。<dl><dt>評価</dt><dd>現在のプロセス及び予測される変化に基づくセキュリティ目的の現在及び予想される達成度を考慮し，将来の戦略的目的の達成を最適化するために必要な調整を決定するプロセス</dd><dt>指示</dt><dd>経営陣が，実施する必要がある情報セキュリティの目的及び戦略についての指示を与えるプロセス</dd><dt>モニター</dt><dd>経営陣が戦略的目的の達成を評価することを可能にするプロセス</dd><dt>コミュニケーション</dt><dd>経営陣及び利害関係者が，双方の特定のニーズに沿った情報セキュリティに関する情報を交換する双方向のプロセス</dd><dt>保証</dt><dd>経営陣が独立した客観的な監査，レビュー又は認証を委託するプロセス</dd></dl>選択肢の各記述とガバナンスプロセスは次のように対応します。<ul><li class=\"lia\">\"指示\"の説明です。</li><li class=\"lii\">正しい。\"モニター\"の説明です。</li><li class=\"liu\">\"保証\"の説明です。</li><li class=\"lie\">\"コミュニケーション\"の説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q8", "session": "支援士 R1秋", "gap": 10, "num": 8, "topic": "CRYPTREC暗号リスト", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "総務省及び経済産業省が策定した\"電子政府における調達のために参照すべき暗号のリスト(CRYPTREC暗号リスト)\"を構成する暗号リストの説明のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">総務省及び経済産業省が策定した\"電子政府における調達のために参照すべき暗号のリスト(CRYPTREC暗号リスト)\"を構成する暗号リストの説明のうち，適切なものはどれか。</div>", "choices": {"ア": "推奨候補暗号リストとは，CRYPTRECによって安全性及び実装性能が確認された暗号技術のうち，市場における利用実績が十分であるか今後の普及が見込まれると判断され，当該技術の利用を推奨するもののリストである。", "イ": "推奨候補暗号リストとは，候補段階に格下げされ，互換性維持目的で利用する暗号技術のリストである。", "ウ": "電子政府推奨暗号リストとは，CRYPTRECによって安全性及び実装性能が確認された暗号技術のうち，市場における利用実績が十分であるか今後の普及が見込まれると判断され，当該技術の利用を推奨するもののリストである。", "エ": "電子政府推奨暗号リストとは，推奨段階に格下げされ，互換性維持目的で利用する暗号技術のリストである。"}, "choices_html": {"ア": "推奨候補暗号リストとは，CRYPTRECによって安全性及び実装性能が確認された暗号技術のうち，市場における利用実績が十分であるか今後の普及が見込まれると判断され，当該技術の利用を推奨するもののリストである。", "イ": "推奨候補暗号リストとは，候補段階に格下げされ，互換性維持目的で利用する暗号技術のリストである。", "ウ": "電子政府推奨暗号リストとは，CRYPTRECによって安全性及び実装性能が確認された暗号技術のうち，市場における利用実績が十分であるか今後の普及が見込まれると判断され，当該技術の利用を推奨するもののリストである。", "エ": "電子政府推奨暗号リストとは，推奨段階に格下げされ，互換性維持目的で利用する暗号技術のリストである。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CRYPTREC暗号リスト</strong>は、暗号技術検討会および関連委員会（CRYPTREC：クリプトレック）により、電子政府での使用に際しての安全性および実装性能が確認された暗号のリストです。<br/><br/>\"政府機関の情報セキュリティ対策のための統一基準\"では、政府機関の情報システムに使用する電子暗号および電子署名のアルゴリズムとして、可能な限りCRYPTREC暗号リストにあるアルゴリズムを採用する運用ルールを定めることが必要とされています。<br/><br/>CRYPTREC暗号リストには次の3つの種別があります。<dl><dt>電子政府推奨暗号リスト</dt><dd>CRYPTRECにより安全性および実装性能が確認された暗号技術について、市場における利用実績が十分であるか今後の普及が見込まれると判断され、当該技術の利用を推奨するもののリスト</dd><dt>推奨候補暗号リスト</dt><dd>CRYPTRECにより安全性および実装性能が確認され、今後、電子政府推奨暗号リストに掲載される可能性のある暗号技術のリスト</dd><dt>運用監視暗号リスト</dt><dd>実際に解読されるリスクが高まるなど、推奨すべき状態ではなくなった暗号技術のうち、互換性維持のために継続利用を容認するもののリスト。互換性維持以外の目的での利用は推奨しない</dd></dl><ul><li class=\"lia\">推奨候補暗号リストは、今後の電子政府推奨候補であるアルゴリズムのリストです。</li><li class=\"lii\">互換性維持目的で利用する暗号技術のリストは、運用監視暗号リストです。</li><li class=\"liu\">正しい。電子政府推奨暗号リストの説明です。</li><li class=\"lie\">互換性維持目的で利用する暗号技術のリストは、運用監視暗号リストです。</li></ul></div>", "past_history": ["情報セキュリティ H27春期 問8"], "hist_count": 2}, {"id": "sc_01_aki_q9", "session": "支援士 R1秋", "gap": 10, "num": 9, "topic": "脆弱性の深刻さを評価するもの", "subcat": "セキュリティ技術評価", "category": "情報セキュリティ", "mondai": "基本評価基準，現状評価基準，環境評価基準の三つの基準で情報システムの脆弱性の深刻度を評価するものはどれか。", "mondai_html": "<div id=\"mondai\">基本評価基準，現状評価基準，環境評価基準の三つの基準で情報システムの脆弱性の深刻度を評価するものはどれか。</div>", "choices": {"ア": "CVSS", "イ": "ISMS", "ウ": "PCI DSS", "エ": "PMS"}, "choices_html": {"ア": "CVSS", "イ": "ISMS", "ウ": "PCI DSS", "エ": "PMS"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CVSS</strong>(Common Vulnerability Scoring System：共通脆弱性評価システム)は、情報システムの脆弱性を評価するためのフレームワークです。ベンダーに依存しない共通かつ汎用的な方法が提供されているため、脆弱性の深刻度を同一の基準のもとで定量的に比較することが可能です。<br/><br/>CVSSでは、次の3つの基準を順番に評価していき、最終的に脆弱性の深刻度を0（低）から10.0（高）のスコアで表します。算出されたスコアをもとに深刻度レベルを分類します。<dl><dt>基本評価基準（Base Metrics）</dt><dd>脆弱性自体の深刻度を評価する指標。機密性・可用性・完全性への影響の大きさや、攻撃に必要な条件などの項目から算出され、時間の経過や利用者の環境で変化しない。ベンダーや脆弱性を公表する組織などが、脆弱性の固有の深刻度を表すために評価する基準となる</dd><dt>現状評価基準（Temporal Metrics）</dt><dd>脆弱性の現在の深刻度を評価する指標。攻撃を受ける可能性や利用可能な対応策のレベルなどの項目から算出され、時間の経過により変化する。ベンダーや脆弱性を公表する組織などが、脆弱性の現状を表すために評価する基準となる</dd><dt>環境評価基準（Environmental Metrics）</dt><dd>製品利用者の利用環境も含め、最終的な脆弱性の深刻度を評価する指標。二次被害の可能性や影響を受ける範囲などの項目から算出され、製品利用者ごとに変化する。利用者が脆弱性への対応を決めるために評価する基準となる</dd></dl><div class=\"img_margin\"><img alt=\"09.png/image-size:219×199\" height=\"199\" src=\"https://www.sc-siken.com/kakomon/01_aki/img/09.png\" style=\"max-width: 100%; height: auto;\" width=\"219\"/></div><ul><li class=\"lia\">正しい。CVSSは、基本評価基準・現状評価基準・環境評価基準の3つで脆弱性の深刻度を評価するフレームワークです。</li><li class=\"lii\">Information Security Management Systemの略。情報セキュリティマネジメントシステムの整備・管理・運用に関する仕組みでJIS Q 27001(ISO/IEC 27001)の基となっています。</li><li class=\"liu\">Payment Card Industry(PCI)データセキュリティ基準(DSS)は、カード会員のデータセキュリティを強化し、均一なデータセキュリティ評価基準の採用をグローバルに推進するためにクレジットカードの国際ブランド大手5社共同（VISA・MasterCard・JCB・AmericanExpress・Diners Club）により策定された基準です。</li><li class=\"lie\">Personal information protection Management Systemの略。個人情報保護マネジメントシステムの整備・管理・運用に関する仕組みです。</li></ul>参考URL:　共通脆弱性評価システムCVSS概説<br/>　<a href=\"http://www.ipa.go.jp/security/vuln/CVSS.html\" target=\"_blank\" title=\"CVSS概説\">http://www.ipa.go.jp/security/vuln/CVSS.html</a></div>", "past_history": ["情報セキュリティ H25春期 問10", "情報セキュリティ H26秋期 問7", "安全確保支援士 H29秋期 問13"], "hist_count": 4}, {"id": "sc_01_aki_q10", "session": "支援士 R1秋", "gap": 10, "num": 10, "topic": "BlueBorneの説明はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "BlueBorneの説明はどれか。", "mondai_html": "<div id=\"mondai\">BlueBorneの説明はどれか。</div>", "choices": {"ア": "Bluetoothを悪用してデバイスを不正に操作したり，情報を窃取したりする，複数の脆弱性の呼称", "イ": "感染したPCの画面の背景を青1色に表示させた上，金銭の支払を要求するランサムウェアの一種", "ウ": "攻撃側(Red Team)と防御側(Blue Team)に分かれて疑似的にサイバー攻撃を行う演習における，防御側の戦術の一種", "エ": "ブルーレイディスクを経由して感染を拡大した，日本の政府機関や重要インフラ事業者を標的としたAPT攻撃の呼称"}, "choices_html": {"ア": "Bluetoothを悪用してデバイスを不正に操作したり，情報を窃取したりする，複数の脆弱性の呼称", "イ": "感染したPCの画面の背景を青1色に表示させた上，金銭の支払を要求するランサムウェアの一種", "ウ": "攻撃側(Red Team)と防御側(Blue Team)に分かれて疑似的にサイバー攻撃を行う演習における，防御側の戦術の一種", "エ": "ブルーレイディスクを経由して感染を拡大した，日本の政府機関や重要インフラ事業者を標的としたAPT攻撃の呼称"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_10.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>BlueBorne</strong>(ブルーボーン)は、2017年に明らかになったBluetoothの実装における複数の脆弱性の略称です。この脆弱性は、Android、iOS、Windows、Linuxなどの主要なOSに存在し、古いバージョンを利用し続けている場合にBluetoothを使用可能なデバイスが影響を受けます。攻撃者がこの脆弱性を突く攻撃を仕掛けると、Bluetoothの通信範囲からデバイス上で任意のコードを実行され、情報が窃取されたりデバイスが操作されたりするなどの被害が発生するおそれがあります。<br/><br/>したがって「ア」が正解です。<ul><li class=\"lia\">正しい。BlueBorneの説明です。</li><li class=\"lii\">ランサムウェア「PETYA」の説明です。BlueBorneはランサムウェアではありません。</li><li class=\"liu\">演習参加者が仮の攻撃チームとなり、実際の組織やシステムに対して、攻撃者が用いる手法やツールを使って疑似的な攻撃を試みることで、脆弱性の有無やセキュリティ対策の実効性を確認することをレッドチーム演習といいます。防御側はブルーチームと呼ばれますが、BlueBorneという戦術はありません。</li><li class=\"lie\">ブルーレイディスクを経由して感染が拡大したランサムウェアは存在しません。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q11", "session": "支援士 R1秋", "gap": 10, "num": 11, "topic": "Secure属性を付けたときの動作", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "CookieにSecure属性を設定しなかったときと比較した，設定したときの動作として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">CookieにSecure属性を設定しなかったときと比較した，設定したときの動作として，適切なものはどれか。</div>", "choices": {"ア": "Cookieに設定された有効期間を過ぎると，Cookieが無効化される。", "イ": "JavaScriptによるCookieの読出しが禁止される。", "ウ": "URL内のスキームがhttpsのときだけ，WebブラウザからCookieが送出される。", "エ": "WebブラウザがアクセスするURL内のパスとCookieに設定されたパスのプレフィックスが一致するときだけ，WebブラウザからCookieが送出される。"}, "choices_html": {"ア": "Cookieに設定された有効期間を過ぎると，Cookieが無効化される。", "イ": "JavaScriptによるCookieの読出しが禁止される。", "ウ": "URL内のスキームがhttpsのときだけ，WebブラウザからCookieが送出される。", "エ": "WebブラウザがアクセスするURL内のパスとCookieに設定されたパスのプレフィックスが一致するときだけ，WebブラウザからCookieが送出される。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_11.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>Secure属性</strong>は、cookieの動作を制御する属性のひとつで、これが付与されたcookieは<em class=\"r\">HTTPS</em>による暗号化通信、すなわちアクセス先のURLが「https://～」である場合のみWebブラウザからサーバに送信されるようになります。平文でやり取りされるHTTP通信「http://～」ではcookie送信を禁止することで、cookie情報の漏えい、セッションIDの盗聴によるセッションハイジャックなど被害を防ぎます。<br/><br/>したがって適切な動作は「ウ」です。<br/><br/>また、cookieを発行する際に指定できる属性には\"Secure\"の他に以下の属性があります。<ul><li><b>Domain</b> - cookieを送信するドメインを指定する</li><li><b>Path</b> - cookieを送信するURLディレクトリを指定する</li><li><b>Expires</b> - cookieの有効期限を指定する</li><li><b>HttpOnly</b> - JavaScriptからのアクセスを禁止する</li><li><b>SameSite</b> - サイトをまたがるリクエストの際のcookie送信を制御する</li></ul><ul><li class=\"lia\">Expires属性の動作です。</li><li class=\"lii\">HttpOnly属性の動作です。</li><li class=\"liu\">正しい。Secure属性の動作です。</li><li class=\"lie\">Path属性の動作です。</li></ul></div>", "past_history": ["安全確保支援士 R3秋期 問10", "情報セキュリティ H28秋期 問9", "安全確保支援士 H30春期 問11"], "hist_count": 4}, {"id": "sc_01_aki_q13", "session": "支援士 R1秋", "gap": 10, "num": 13, "topic": "マルチベクトル型DDoS攻撃", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "マルチベクトル型DDoS攻撃に該当するものはどれか。", "mondai_html": "<div id=\"mondai\">マルチベクトル型DDoS攻撃に該当するものはどれか。</div>", "choices": {"ア": "DNSリフレクタ攻撃によってDNSサービスを停止させ，複数のPCでの名前解決を妨害する。", "イ": "Webサイトに対して，SYN Flood攻撃とHTTP POST Flood攻撃を同時に行う。", "ウ": "管理者用IDのパスワードを初期設定のままで利用している複数のIoT機器を感染させ，それらのIoT機器から，WebサイトにUDP Flood攻撃を行う。", "エ": "ファイアウォールでのパケットの送信順序を不正に操作するパケットを複数送信することによって，ファイアウォールのCPUやメモリを枯渇させる。"}, "choices_html": {"ア": "DNSリフレクタ攻撃によってDNSサービスを停止させ，複数のPCでの名前解決を妨害する。", "イ": "Webサイトに対して，SYN Flood攻撃とHTTP POST Flood攻撃を同時に行う。", "ウ": "管理者用IDのパスワードを初期設定のままで利用している複数のIoT機器を感染させ，それらのIoT機器から，WebサイトにUDP Flood攻撃を行う。", "エ": "ファイアウォールでのパケットの送信順序を不正に操作するパケットを複数送信することによって，ファイアウォールのCPUやメモリを枯渇させる。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>マルチベクトル型DDoS攻撃</strong>は、複数のDDoS攻撃手法を組み合わせて標的のサービス停止を狙う攻撃です。<br/>DoS攻撃には、サーバのリソースを枯渇させる攻撃、ネットワーク帯域を溢れさせる攻撃、アプリケーション層の脆弱性を突く攻撃、フラッド系、スロー系など様々な種類がありますが、マルチベクトル型DDoS攻撃では、これらを2つ以上同時に行うことで防御を難しくします。<br/><br/>したがって、2つのDDoS攻撃を組み合わせている「イ」が正解です。<ul><li class=\"lia\">DNSアンプ攻撃の説明です。</li><li class=\"lii\">正しい。マルチベクトル型DDoS攻撃の例です。</li><li class=\"liu\">ボットネットを使った単体のDDoS攻撃です。</li><li class=\"lie\">TCPのACKメッセージを悪用した、Optimistic Ack、Duplicate Ack、Partial Ackという3つの攻撃の説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q14", "session": "支援士 R1秋", "gap": 10, "num": 14, "topic": "常時SSL/TLSのセキュリティ上の効果", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "Webサイトにおいて，全てのWebページをTLSで保護するよう設定する常時SSL/TLSのセキュリティ上の効果はどれか。", "mondai_html": "<div id=\"mondai\">Webサイトにおいて，全てのWebページをTLSで保護するよう設定する常時SSL/TLSのセキュリティ上の効果はどれか。</div>", "choices": {"ア": "WebサイトでのSQL組立て時にエスケープ処理が施され，SQLインジェクション攻撃による個人情報などの非公開情報の漏えいやデータベースに蓄積された商品価格などの情報の改ざんを防止する。", "イ": "Webサイトへのアクセスが人間によるものかどうかを確かめ，Webブラウザ以外の自動化されたWebクライアントによる大量のリクエストへの応答を避ける。", "ウ": "Webサイトへのブルートフォース攻撃によるログイン試行を検出してアカウントロックし，Webサイトへの不正ログインを防止する。", "エ": "WebブラウザとWebサイトとの間における中間者攻撃による通信データの漏えい及び改ざんを防止し，サーバ証明書によって偽りのWebサイトの見分けを容易にする。"}, "choices_html": {"ア": "WebサイトでのSQL組立て時にエスケープ処理が施され，SQLインジェクション攻撃による個人情報などの非公開情報の漏えいやデータベースに蓄積された商品価格などの情報の改ざんを防止する。", "イ": "Webサイトへのアクセスが人間によるものかどうかを確かめ，Webブラウザ以外の自動化されたWebクライアントによる大量のリクエストへの応答を避ける。", "ウ": "Webサイトへのブルートフォース攻撃によるログイン試行を検出してアカウントロックし，Webサイトへの不正ログインを防止する。", "エ": "WebブラウザとWebサイトとの間における中間者攻撃による通信データの漏えい及び改ざんを防止し，サーバ証明書によって偽りのWebサイトの見分けを容易にする。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">一般的にHTTPSといえば、WebブラウザとWebサーバとの間の通信を暗号化する特長が際立っていますが、TLSにはサーバ認証や改ざん防止の機能もあります。暗号化機能には通信経路上での漏えい・改ざんを防止する効果が期待できますが、認証機能には接続先のWebサーバが意図したWebサーバであることを確認し、フィッシングサイトなどの悪意のある第三者がなりすましたWebサイトに誘導されることを防止する効果が期待できます。<br/><br/>中間者攻撃では攻撃者がWebブラウザとWebサーバとの間に介入し、通信内容の改ざんによって偽の公開鍵の使用をWebブラウザに強制しますが、認証局のデジタル署名を含むサーバ証明書は偽装できません。このためサーバ証明書(サーバの公開鍵証明書)を使用すれば、サーバ認証のプロセスで中間者攻撃をブロックできることになります。TLSではサーバ証明書の使用が必須です。<br/><br/>秘密情報を扱うWebページではSSL/TLSで保護することが当然ですが、秘密情報を特に扱わないWebページについても常時SSL/TLSにより中間者攻撃を防ぐセキュリティ効果が期待できます。Webサイトでは、GoogleやMozillaなどの先導もあり常時SSL/TLS(完全HTTPS化)の動きが加速しています。<ul><li class=\"lia\">SQLインジェクションを防ぐバインド機構の効果です。</li><li class=\"lii\">ボットによるリクエストをブロックするCaptchaの効果です。</li><li class=\"liu\">ロックアウト機構の効果です。</li><li class=\"lie\">正しい。常時SSL/TLS化の効果です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q15", "session": "支援士 R1秋", "gap": 10, "num": 15, "topic": "エクスプロイトキット", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "攻撃者に脆弱性に関する専門の知識がなくても，OSやアプリケーションソフトウェアの脆弱性を悪用した攻撃ができる複数のプログラムや管理機能を統合したものはどれか。", "mondai_html": "<div id=\"mondai\">攻撃者に脆弱性に関する専門の知識がなくても，OSやアプリケーションソフトウェアの脆弱性を悪用した攻撃ができる複数のプログラムや管理機能を統合したものはどれか。</div>", "choices": {"ア": "Exploit Kit", "イ": "iLogScanner", "ウ": "MyJVN", "エ": "Remote Access Tool"}, "choices_html": {"ア": "Exploit Kit", "イ": "iLogScanner", "ウ": "MyJVN", "エ": "Remote Access Tool"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>エクスプロイトキット</strong>は、複数のエクスプロイトコードをまとめ、ソフトウェアやOSに内在する脆弱性を確認したり、攻撃者がその脆弱性を悪用したりするツール群です。エクスプロイト(exploit)には、悪用という意味があります。<dl><dt>エクスプロイトコード</dt><dd>ソフトウェアの脆弱性を悪用した不正な動作を再現するために作成されたスクリプトやプログラムの断片</dd></dl>エクスプロイトキットが仕掛けられたWebサイトにアクセスすると、PC上の脆弱性が調べられ、その脆弱性を突く攻撃が行われます。最終的にはマルウェアがダウンロードされ、ランサムウェアやクリプトジャッキングの被害を受ける可能性があります。被害を受けないためにはPCで使用しているOSやソフトウェアを常に最新バージョンに更新しておくことが重要です。<br/><br/>したがって「ア」が正解です。<ul><li class=\"lia\">正しい。</li><li class=\"lii\">iLogScannerは、WebサーバのログからWebサイトに対する攻撃の痕跡を検出するためのツールです。IPAが公開しています。</li><li class=\"liu\">MyJVNは、JVN iPediaの情報を、利用者が効率的に活用できるように脆弱性対策情報を効率的に収集したり、利用者のPC上にインストールされたソフトウェア製品のバージョンを容易にチェックする等の機能を提供する仕組み（フレームワーク）です。<br/>※MyJVN Webサイトより引用</li><li class=\"lie\">Remote Access Tool(RAT)は、通信回線を介して離れたところにあるコンピュータを遠隔操作するツールです。感染するとC&amp;Cサーバから遠隔操作可能にしてしまうバックドア型マルウェアを指すこともあります。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q18", "session": "支援士 R1秋", "gap": 10, "num": 18, "topic": "DNSSECの説明として適切なもの", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "DNSSECに関する記述として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">DNSSECに関する記述として，適切なものはどれか。</div>", "choices": {"ア": "DNSサーバへのDoS攻撃を防止できる。", "イ": "IPsecによる暗号化通信が前提となっている。", "ウ": "代表的なDNSサーバの実装であるBINDの代替として使用する。", "エ": "デジタル署名によってDNS応答の正当性を確認できる。"}, "choices_html": {"ア": "DNSサーバへのDoS攻撃を防止できる。", "イ": "IPsecによる暗号化通信が前提となっている。", "ウ": "代表的なDNSサーバの実装であるBINDの代替として使用する。", "エ": "デジタル署名によってDNS応答の正当性を確認できる。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>DNSSEC</strong>は、DNS Security Extensionsの略で、DNSにおける応答の正当性を保証するための拡張仕様です。DNSSECでは名前解決の応答パケットにデジタル署名を付加することで、①正当な管理者によって生成された応答レコードであること、②応答レコードが改ざんされていないことの検証が可能になります。<br/><br/>DNSキャッシュポイズニング攻撃では、攻撃者が偽の応答パケットをキャッシュサーバに送り込み、それをキャッシュサーバが登録してしまうことによって攻撃が成立するので、DNSSECの導入はDNSキャッシュポイズニング攻撃への有効な対策となります。<br/><br/>したがって適切な記述は「エ」です。</div>", "past_history": ["情報セキュリティ H22秋期 問19", "情報セキュリティ H24秋期 問18", "情報セキュリティ H26秋期 問18"], "hist_count": 4}, {"id": "sc_01_aki_q19", "session": "支援士 R1秋", "gap": 10, "num": 19, "topic": "IPパケットの分割・再構築処理", "subcat": "ネットワーク方式", "category": "情報セキュリティ", "mondai": "IPv4ネットワークにおいて，IPパケットの分割処理と，分割されたパケットを元に戻す再構築処理に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">IPv4ネットワークにおいて，IPパケットの分割処理と，分割されたパケットを元に戻す再構築処理に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "IPパケットの再構築処理は宛先のホストで行われる。", "イ": "IPパケットの再構築処理は中継するルータで行われる。", "ウ": "IPパケットの分割処理は送信元のホストだけで行われる。", "エ": "IPパケットの分割処理は中継するルータだけで行われる。"}, "choices_html": {"ア": "IPパケットの再構築処理は宛先のホストで行われる。", "イ": "IPパケットの再構築処理は中継するルータで行われる。", "ウ": "IPパケットの分割処理は送信元のホストだけで行われる。", "エ": "IPパケットの分割処理は中継するルータだけで行われる。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">まず、IPパケットの分割処理について簡単に説明します。<br/><br/>IPは1パケットで最大65,535オクテットのペイロードを格納できます。しかし、データリンク層のプロトコルは、イーサネット:1,500オクテット、FDDI:4,352オクテットというように、IPパケットよりも最大転送単位(MTU:Maximum Transfer Unit)が小さくなっています。このため、IPパケットのサイズが送出先データリンクのMTUより大きい場合には、IPパケットを幾つかのフレームに分割して送信することになります。この分割処理をIPパケットのフラグメント化といいます。<div class=\"img_margin\"><img alt=\"19.png/image-size:548×145\" height=\"145\" src=\"https://www.sc-siken.com/kakomon/01_aki/img/19.png\" style=\"max-width: 100%; height: auto;\" width=\"548\"/></div>IPパケットの分割処理は、通信経路となるデータリンクに応じて「送信元ホスト」や「中継するルータ」で行われます。そして、分割されたIPパケットの再構築処理は「宛先ホスト」だけで行われます。再構築処理が宛先ホストだけで行われるのは中継するルータに負荷を掛けないためです。<ul><li class=\"lia\">正しい。再構築処理は宛先ホストで行います。</li><li class=\"lii\">再構築処理は宛先ホストで行います。</li><li class=\"liu\">分割処理は中継するルータでも行います。</li><li class=\"lie\">分割処理は送信元ホストでも行います。</li></ul>※実際には通信経路上のルータの負荷を軽減するため、IPパケットのフラグメント化は送信側ホストだけで行われることが多くなっています。このとき分割サイズを決めるのに「経路MTU探索」という技術が使われています。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q20", "session": "支援士 R1秋", "gap": 10, "num": 20, "topic": "TCPに関する記述", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "TCPに関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">TCPに関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "OSI基本参照モデルのネットワーク層の機能である。", "イ": "ウインドウ制御の単位は，バイトではなくビットである。", "ウ": "確認応答がない場合は再送処理によってデータ回復を行う。", "エ": "データの順序番号をもたないので，データは受信した順番のままで処理する。"}, "choices_html": {"ア": "OSI基本参照モデルのネットワーク層の機能である。", "イ": "ウインドウ制御の単位は，バイトではなくビットである。", "ウ": "確認応答がない場合は再送処理によってデータ回復を行う。", "エ": "データの順序番号をもたないので，データは受信した順番のままで処理する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">TCPは、OSI基本参照モデルのトランスポート層に位置します。</li><li class=\"lii\">TCPでは「ウィンドウ」と呼ばれるバッファメモリを用意することで、効率的な通信を実現しています。ウィンドウ制御は、通信の状況によって刻々と変化するウィンドウサイズを制御する仕組みです。<br/>TCPヘッダーにはウィンドウサイズを指定するフィールドがありますが、単位はビットではなくバイトです。</li><li class=\"liu\">正しい。再送タイムアウト時間を過ぎても確認応答を受信できなかった場合、送信側は「送信データが失われた」と判断して当該データを再送します。</li><li class=\"lie\">TCPヘッダーにはデータの順序を管理するためのシーケンス番号というフィールドがあり、受信側はこの情報をもとに正しい順序に復元できます。</li></ul></div>", "past_history": ["情報セキュリティ H28秋期 問20"], "hist_count": 2}, {"id": "sc_01_aki_q21", "session": "支援士 R1秋", "gap": 10, "num": 21, "topic": "適切なデータベース方式", "subcat": "データベース方式", "category": "情報セキュリティ", "mondai": "JSON形式で表現される図1，図2のような商品データを複数のWebサービスから取得し，商品データベースとして蓄積する際のデータの格納方法に関する記述のうち，適切なものはどれか。ここで，商品データの取得元となるWebサービスは随時変更され，項目数や内容は予測できない。したがって，商品データベースの検索時に使用するキーにはあらかじめ制限を設けない。", "mondai_html": "<div id=\"mondai\">JSON形式で表現される図1，図2のような商品データを複数のWebサービスから取得し，商品データベースとして蓄積する際のデータの格納方法に関する記述のうち，適切なものはどれか。ここで，商品データの取得元となるWebサービスは随時変更され，項目数や内容は予測できない。したがって，商品データベースの検索時に使用するキーにはあらかじめ制限を設けない。<div class=\"img_margin\"><img alt=\"21.png/image-size:502×206\" height=\"206\" src=\"https://www.sc-siken.com/kakomon/01_aki/img/21.png\" style=\"max-width: 100%; height: auto;\" width=\"502\"/></div></div>", "choices": {"ア": "階層型データベースを使用し，項目名を上位階層とし，値を下位階層とした2階層でデータを格納する。", "イ": "グラフ型データベースを使用し，商品データの項目名の集合から成るノードと値の集合から成るノードを作り，二つのノードを関係づけたグラフとしてデータを格納する。", "ウ": "ドキュメント型データベースを使用し，項目構成の違いを区別せず，商品データ単位にデータを格納する。", "エ": "リレーショナルデータベースを使用し，商品データの各項目名を個別の列名とした表を定義してデータを格納する。"}, "choices_html": {"ア": "階層型データベースを使用し，項目名を上位階層とし，値を下位階層とした2階層でデータを格納する。", "イ": "グラフ型データベースを使用し，商品データの項目名の集合から成るノードと値の集合から成るノードを作り，二つのノードを関係づけたグラフとしてデータを格納する。", "ウ": "ドキュメント型データベースを使用し，項目構成の違いを区別せず，商品データ単位にデータを格納する。", "エ": "リレーショナルデータベースを使用し，商品データの各項目名を個別の列名とした表を定義してデータを格納する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">階層型データベースは、会社の組織図のようにデータをツリー構造(親子関係)で管理するデータベースです。項目名と値は親子関係に当たらないため不適切です。</li><li class=\"lii\">グラフ型データベースは、グラフ理論に基づき、「ノード」「エッジ」「プロパティ」の3要素でデータ間の関係性を表現するデータベースです。もし、グラフ型データベースで実装するなら、商品ごとにノードを作成し、項目名と値をキーバリューストア形式で格納し、商品同士の関連をエッジで表現します。<br/>しかし、この設問では商品を一意に特定する\"_id\"も含め、Webサービス同士で値が重複したり、将来変更されたりする可能性があるため不適切です。</li><li class=\"liu\">正しい。ドキュメント型データベースは、XMLやJSONなどの構造でデータを格納するデータベースです。保存するデータ形式が自由なので、複雑なデータ構造をもつデータを扱うときに用いられます。1つのXMLやJSONごとに1件のデータとして保存されます。<br/>本問では、どちらもJSON形式のデータであり、入れ子構造を含む複雑な形式であること、項目数や内容が変化する可能性があることから、スキーマレスのドキュメント型データベースが適しています。</li><li class=\"lie\">リレーショナルデータベースは2次元の表形式でデータを管理するデータベースです。商品データは、項目数、項目名及び値のドメインが統一されていないこと、将来項目数や内容が変化する可能性があることから適していません。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q22", "session": "支援士 R1秋", "gap": 10, "num": 22, "topic": "追加すべき遷移はどれか", "subcat": "ソフトウェア要件定義", "category": "情報セキュリティ", "mondai": "次の仕様で動作する装置がある。未完成の状態遷移図を完成させるために，追加すべき遷移はどれか。〔仕様〕レディでStartボタンが押された場合，運転開始して低速運転に遷移する。低速運転でUpボタンが押された場合，加速して高速運転に遷移する。低速運転でDownボタンが押された場合，運転休止して一時停止に遷移する。高速運転でDownボタンが押された場合，減速して低速運転に遷移する。一時停止でUpボタンが押された場合，運転再開して低速運転に遷移する。レディ以外の状態でStopボタンが押された場合，運転停止してレディに遷移する。〔来完成の状態遷移図〕", "mondai_html": "<div id=\"mondai\">次の仕様で動作する装置がある。未完成の状態遷移図を完成させるために，追加すべき遷移はどれか。<br/><br/>〔仕様〕<ul><li>レディでStartボタンが押された場合，運転開始して低速運転に遷移する。</li><li>低速運転でUpボタンが押された場合，加速して高速運転に遷移する。</li><li>低速運転でDownボタンが押された場合，運転休止して一時停止に遷移する。</li><li>高速運転でDownボタンが押された場合，減速して低速運転に遷移する。</li><li>一時停止でUpボタンが押された場合，運転再開して低速運転に遷移する。</li><li>レディ以外の状態でStopボタンが押された場合，運転停止してレディに遷移する。</li></ul>〔来完成の状態遷移図〕<div class=\"img_margin\"><img alt=\"22.png/image-size:352×229\" height=\"229\" src=\"https://www.sc-siken.com/kakomon/01_aki/img/22.png\" style=\"max-width: 100%; height: auto;\" width=\"352\"/></div></div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表\" src=\"https://www.sc-siken.com/kakomon/01_aki/img/22a.png\" style=\"max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">〔仕様〕の各遷移が、状態遷移図の矢印として表現されているかどうかを確認し、追加する必要のある遷移を特定します。わかりやすいように各矢印に番号を振っておきます。<div class=\"img_margin\"><img alt=\"22_1.png/image-size:352×229\" height=\"229\" src=\"https://www.sc-siken.com/kakomon/01_aki/img/22_1.png\" style=\"max-width: 100%; height: auto;\" width=\"352\"/></div><dl><dt>レディでStartボタンが押された場合，運転開始して低速運転に遷移する。</dt><dd>②で記述されています。</dd><dt>低速運転でUpボタンが押された場合，加速して高速運転に遷移する。</dt><dd>⑦で記述されています。</dd><dt>低速運転でDownボタンが押された場合，運転休止して一時停止に遷移する。</dt><dd>⑤で記述されています。</dd><dt>高速運転でDownボタンが押された場合，減速して低速運転に遷移する。</dt><dd>⑥で記述されています。</dd><dt>一時停止でUpボタンが押された場合，運転再開して低速運転に遷移する。</dt><dd>④で記述されています。</dd><dt>レディ以外の状態でStopボタンが押された場合，運転停止してレディに遷移する。</dt><dd>低速運転でStopボタンが押されたときの遷移は③、一時停止状態でStopボタンが押されたときの遷移は①で記述されていますが、高速運転でStopボタンが押されたときの遷移は記述されていません。よって、これが追加すべき遷移とわかります。</dd></dl>追加すべき遷移は「<em class=\"r\">高速運転</em>で<em class=\"r\">Stop</em>ボタンが押された場合，<em class=\"r\">運転停止</em>して<em class=\"r\">レディ</em>に遷移する」なので、遷移元\"高速運転\"、条件部／動作部\"Stop／運転停止\"、遷移先\"レディ\"となる「エ」の組合せが適切です。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_01_aki_q23", "session": "支援士 R1秋", "gap": 10, "num": 23, "topic": "マッシュアップの例", "subcat": "開発プロセス・手法", "category": "情報セキュリティ", "mondai": "マッシュアップを利用してWebコンテンツを表示する例として，最も適切なものはどれか。", "mondai_html": "<div id=\"mondai\">マッシュアップを利用してWebコンテンツを表示する例として，最も適切なものはどれか。</div>", "choices": {"ア": "Webブラウザにプラグインを組み込み，動画やアニメーションを表示する。", "イ": "地図上のカーソル移動に伴い，Webページを切り替えずにスクロール表示する。", "ウ": "鉄道経路の探索結果上に，各鉄道会社のWebページへのリンクを表示する。", "エ": "店舗案内のWebページ上に，他のサイトが提供する地図探索機能を利用して出力された情報を表示する。"}, "choices_html": {"ア": "Webブラウザにプラグインを組み込み，動画やアニメーションを表示する。", "イ": "地図上のカーソル移動に伴い，Webページを切り替えずにスクロール表示する。", "ウ": "鉄道経路の探索結果上に，各鉄道会社のWebページへのリンクを表示する。", "エ": "店舗案内のWebページ上に，他のサイトが提供する地図探索機能を利用して出力された情報を表示する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>マッシュアップ</strong>とは、Web上に公開されている様々なWebサービスを組み合わせて、新しいWebサービスを作り出す手法のことを指します。Web上には様々なWebサービスのAPIが公開されているため、自社開発をしなくてもそれらのWebサービスを積極的に活用することで、短期間でサービスを開発し、リリースすることができます。「マッシュアップ(Mashup)」は、異なる音源からトラックの一部をそれぞれ取り出してミックスし、ひとつの曲にする音楽の手法が語源です。<br/><br/>公開されているWebサービスには、SNSやサイトの情報を取得できるAPIをはじめ、Google Mapに代表される地図情報、AI技術を用いた画像認識、音声認識、動画関連、翻訳、EC情報など様々なものがあり、誰でもAPIを介してサービスを操作することができます。その機能を自分で一から開発して自サイトに実装するのに比べて、簡単に目的の機能をサービスに搭載できます。<br/><br/><em class=\"r\">他のサイトのWebサービス</em>を利用して得られる情報を自サイトのコンテンツとして掲載しているのは「エ」だけなので、これが正解です。<ul><li class=\"lia\">プラグインは、Webブラウザなどのソフトウェアに後付けで追加機能を付加するものであり、Webサービスとは無関係です。</li><li class=\"lii\">Ajaxなどにより、自サーバから動的にデータを取得することで実現している機能なので不適切です。</li><li class=\"liu\">リンク先の情報取得などに他サイトのWebサービスを利用していないので例としては不適切です。</li><li class=\"lie\">正しい。マッシュアップの例として適切です。</li></ul></div>", "past_history": ["情報セキュリティ H27春期 問23"], "hist_count": 2}, {"id": "sc_01_aki_q25", "session": "支援士 R1秋", "gap": 10, "num": 25, "topic": "システム移行におけるチェックポイント", "subcat": "システム監査", "category": "情報セキュリティ", "mondai": "システムの本番移行が失敗するリスクに対するコントロールを監査するときのチェックポイントはどれか。", "mondai_html": "<div id=\"mondai\">システムの本番移行が失敗するリスクに対するコントロールを監査するときのチェックポイントはどれか。</div>", "choices": {"ア": "システム運用段階で新システムの稼働状況がレビューされ，その結果についてシステム開発部門及び利用部門の責任者の承認が得られていること", "イ": "システム開発段階で抽出された問題への対策が，次期システム改善計画に反映されていること", "ウ": "システム企画段階で，システムの投資対効果が評価されていること", "エ": "利用部門を含めた各部門の役割と責任を明確にした本番移行計画が作成されていること"}, "choices_html": {"ア": "システム運用段階で新システムの稼働状況がレビューされ，その結果についてシステム開発部門及び利用部門の責任者の承認が得られていること", "イ": "システム開発段階で抽出された問題への対策が，次期システム改善計画に反映されていること", "ウ": "システム企画段階で，システムの投資対効果が評価されていること", "エ": "利用部門を含めた各部門の役割と責任を明確にした本番移行計画が作成されていること"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/01_aki/am2_25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>移行</strong>とは、システム／ソフトウェアを新しい運用環境に移すことを言います。円滑な移行を実現するためには、移行手順、必要な資源、リスク、対策を明確にした<strong>移行計画</strong>を作成する必要があります。移行計画は、関連部門の責任者及びプロジェクト委員会等に承認された後、関係者全員に通知されます。<br/><br/>移行には運用部門や保守部門の協力も必要であり、予想外の事態に至った場合も含めて、それぞれが担う役割と責任の所在を明確にしておかなければなりません。誰が何を行うのかが曖昧な状況では移行が失敗するリスクが高まります。<ul><li class=\"lia\">システム運用のチェックポイントです。</li><li class=\"lii\">システム開発のチェックポイントです。</li><li class=\"liu\">システム化計画のチェックポイントです。</li><li class=\"lie\">正しい。システム移行では、適切な移行計画が作成されていることがチェックポイントとなります。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_31_haru_q1", "session": "支援士 H31春", "gap": 11, "num": 1, "topic": "CRLに掲載されるものはどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "CRL(Certificate Revocation List)に掲載されるものはどれか。", "mondai_html": "<div id=\"mondai\">CRL(Certificate Revocation List)に掲載されるものはどれか。</div>", "choices": {"ア": "有効期限切れになったデジタル証明書の公開鍵", "イ": "有効期限切れになったデジタル証明書のシリアル番号", "ウ": "有効期限内に失効したデジタル証明書の公開鍵", "エ": "有効期限内に失効したデジタル証明書のシリアル番号"}, "choices_html": {"ア": "有効期限切れになったデジタル証明書の公開鍵", "イ": "有効期限切れになったデジタル証明書のシリアル番号", "ウ": "有効期限内に失効したデジタル証明書の公開鍵", "エ": "有効期限内に失効したデジタル証明書のシリアル番号"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CRL</strong>(証明書失効リスト)は、<em class=\"r\">有効期限内</em>であるにも関わらず、秘密鍵の漏えい、紛失、証明書の被発行者の規則違反などの理由で認証の役に立たなくなったため、失効した、又は停止状態である(信用性のない)公開鍵証明書が列挙されたリストです。<br/>CRLには公開鍵証明書の<em class=\"r\">シリアル番号</em>と、その証明書が失効した日時が登録されています。またCRLは短い間隔(通常は24時間以内)で随時更新されています。<br/><br/>したがって「エ」が適切な説明です。</div>", "past_history": ["情報セキュリティ H28春期 問1", "安全確保支援士 H29秋期 問1"], "hist_count": 3}, {"id": "sc_31_haru_q3", "session": "支援士 H31春", "gap": 11, "num": 3, "topic": "認証，属性及び認可のフレームワーク", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "標準化団体OASISが，Webサイトなどを運営するオンラインビジネスパートナ間で認証，属性及び認可の情報を安全に交換するために策定したものはどれか。", "mondai_html": "<div id=\"mondai\">標準化団体OASISが，Webサイトなどを運営するオンラインビジネスパートナ間で認証，属性及び認可の情報を安全に交換するために策定したものはどれか。</div>", "choices": {"ア": "SAML", "イ": "SOAP", "ウ": "XKMS", "エ": "XML Signature"}, "choices_html": {"ア": "SAML", "イ": "SOAP", "ウ": "XKMS", "エ": "XML Signature"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">正しい。<strong>SAML</strong>(Security Assertion Markup Language：サムエル)は、XMLベースのメッセージのやり取りによって、複数のシステムやサービスの間で認証情報、属性情報、権限の認可情報を交換するための仕様です。標準化団体OASISによって策定されていて、2022年現在の最新バージョンは2005年にリリースのSAML2.0です。主に複数のドメインにまたがったセキュアなシングルサインオンを実現するための仕組みとして使用されています。</li><li class=\"lii\">SOAPは、ネットワークを介して、他のコンピュータ上にあるアプリケーションやサービスを遠隔呼出しするためのXMLベースのRPCプロトコルです。</li><li class=\"liu\">XML Key Management Specificationの略。W3Cで標準化された、PKIの機能をWebサービスとして利用するための方法が規定された仕様です。</li><li class=\"lie\">XML Signature(XML署名)は、XML文書にデジタル署名を埋め込むための標準化仕様です。</li></ul></div>", "past_history": ["安全確保支援士 R4秋期 問3", "安全確保支援士 R6春期 問4", "情報セキュリティ H24秋期 問11", "情報セキュリティ H26秋期 問10", "情報セキュリティ H28春期 問4", "安全確保支援士 H29秋期 問3"], "hist_count": 7}, {"id": "sc_31_haru_q5", "session": "支援士 H31春", "gap": 11, "num": 5, "topic": "クリプトジャッキングはどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "仮想通貨環境において，報酬を得るために行われるクリプトジャッキングはどれか。", "mondai_html": "<div id=\"mondai\">仮想通貨環境において，報酬を得るために行われるクリプトジャッキングはどれか。</div>", "choices": {"ア": "他人のPC又はサーバに侵入して計算資源を不正に利用し，台帳への追記の計算を行う。", "イ": "他人のPC又はサーバに保存された顧客情報を不正に取得して，販売する。", "ウ": "他人のPC又はサーバのキーボードからの入力値を不正に取得して，攻撃者のサーバに送信する。", "エ": "他人のPC又はサーバのファイルを暗号化して利用できなくし，警告文を表示して報酬を要求する。"}, "choices_html": {"ア": "他人のPC又はサーバに侵入して計算資源を不正に利用し，台帳への追記の計算を行う。", "イ": "他人のPC又はサーバに保存された顧客情報を不正に取得して，販売する。", "ウ": "他人のPC又はサーバのキーボードからの入力値を不正に取得して，攻撃者のサーバに送信する。", "エ": "他人のPC又はサーバのファイルを暗号化して利用できなくし，警告文を表示して報酬を要求する。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">正しい。クリプトジャッキングの説明です。</li><li class=\"lii\">盗聴行為の説明です。</li><li class=\"liu\">キーロガーの説明です。</li><li class=\"lie\">ランサムウェアの説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_31_haru_q7", "session": "支援士 H31春", "gap": 11, "num": 7, "topic": "サイドチャネル攻撃に該当するもの", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "サイドチャネル攻撃に該当するものはどれか。", "mondai_html": "<div id=\"mondai\">サイドチャネル攻撃に該当するものはどれか。</div>", "choices": {"ア": "暗号化装置における暗号化処理時の消費電力などの測定や統計処理によって，当該装置内部の秘密情報を推定する攻撃", "イ": "攻撃者が任意に選択した平文とその平文に対応した暗号文から数学的手法を用いて暗号鍵を推測し，同じ暗号鍵を用いて作成された暗号文を解読する攻撃", "ウ": "操作中の人の横から，入力操作の内容を観察することによって，利用者IDとパスワードを盗み取る攻撃", "エ": "無線LANのアクセスポイントを不正に設置し，チャネル間の干渉を発生させることによって，通信を妨害する攻撃"}, "choices_html": {"ア": "暗号化装置における暗号化処理時の消費電力などの測定や統計処理によって，当該装置内部の秘密情報を推定する攻撃", "イ": "攻撃者が任意に選択した平文とその平文に対応した暗号文から数学的手法を用いて暗号鍵を推測し，同じ暗号鍵を用いて作成された暗号文を解読する攻撃", "ウ": "操作中の人の横から，入力操作の内容を観察することによって，利用者IDとパスワードを盗み取る攻撃", "エ": "無線LANのアクセスポイントを不正に設置し，チャネル間の干渉を発生させることによって，通信を妨害する攻撃"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>サイドチャネル攻撃</strong>は、対象の動作状況を観察し、漏洩電磁波・電力消費等のサイドチャネル情報から暗号鍵推定等を行う非破壊型解析攻撃の総称です。サイドチャネル(Side Channel)には、非正規の入出力経路という意味があります。<br/><br/>具体的な攻撃方法としては、故障利用攻撃、タイミング攻撃や電力解析攻撃、電磁波解析攻撃などがあります。<dl><dt>故障利用攻撃</dt><dd>デバイスに限定的な障害を故意に与え、デバイスの計算誤りから秘密情報を解析する手法</dd><dt>タイミング攻撃</dt><dd>暗号処理のタイミングが暗号鍵の論理値に依存して変化することに着目し、暗号化や復号に要する時間の差異を統計的に解析して暗号鍵を推定する手法</dd><dt>電力解析攻撃</dt><dd>消費電力の変化に着目して鍵や処理内容の解析を試みる手法</dd><dt>電磁波解析攻撃（テンペスト攻撃）</dt><dd>機器が発する電磁波を測定することによって秘密情報の取得を試みる手法</dd></dl><ul><li class=\"lia\">正しい。サイドチャネル攻撃の一つである電力解析攻撃の説明です。</li><li class=\"lii\">関連平文攻撃の説明です。</li><li class=\"liu\">ショルダーハッキングの説明です。</li><li class=\"lie\">ジャミング(Jamming)の説明です。</li></ul></div>", "past_history": ["安全確保支援士 R3春期 問5", "情報セキュリティ H26秋期 問13"], "hist_count": 3}, {"id": "sc_31_haru_q8", "session": "支援士 H31春", "gap": 11, "num": 8, "topic": "トランザクション署名の効果", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "インターネットバンキングサービスを提供するWebサイトを利用する際に，トランザクション署名の機能をもつハードウェアトークンを利用する。次の処理を行うとき，(4)によってできることはどれか。ここで，ハードウェアトークンは利用者ごとに異なり，本人だけが利用する。〔処理〕ハードウェアトークンに振込先口座番号と振込金額を入力し，メッセージ認証符号(MAC)を生成する。Webサイトの振込処理画面に振込先口座番号，振込金額及び(1)で生成されたMACを入力し，Webサイトに送信する。Webサイトでは，本人に発行したハードウェアトークンと同じ処理手順によって振込先口座番号と振込金額からMACを生成する。Webサイトでは，(2)で入力されたMACと，(3)で生成したMACを比較する。", "mondai_html": "<div id=\"mondai\">インターネットバンキングサービスを提供するWebサイトを利用する際に，トランザクション署名の機能をもつハードウェアトークンを利用する。次の処理を行うとき，(4)によってできることはどれか。ここで，ハードウェアトークンは利用者ごとに異なり，本人だけが利用する。<br/><br/>〔処理〕<ul><li class=\"li1\">ハードウェアトークンに振込先口座番号と振込金額を入力し，メッセージ認証符号(MAC)を生成する。</li><li class=\"li2\">Webサイトの振込処理画面に振込先口座番号，振込金額及び(1)で生成されたMACを入力し，Webサイトに送信する。</li><li class=\"li3\">Webサイトでは，本人に発行したハードウェアトークンと同じ処理手順によって振込先口座番号と振込金額からMACを生成する。</li><li class=\"li4\">Webサイトでは，(2)で入力されたMACと，(3)で生成したMACを比較する。</li></ul></div>", "choices": {"ア": "通信経路において盗聴されていないことを確認できる。", "イ": "通信経路における盗聴者を特定できる。", "ウ": "振込先口座番号と振込金額が改ざんされていないことを確認できる。", "エ": "振込先口座番号と振込金額の改ざんされた箇所を訂正できる。"}, "choices_html": {"ア": "通信経路において盗聴されていないことを確認できる。", "イ": "通信経路における盗聴者を特定できる。", "ウ": "振込先口座番号と振込金額が改ざんされていないことを確認できる。", "エ": "振込先口座番号と振込金額の改ざんされた箇所を訂正できる。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>トランザクション署名</strong>(Transaction Signature)とは、振込先口座番号や振込金額などの取引内容そのものに対して、利用者専用のハードウェアトークン内でメッセージ認証符号(MAC)などの電子署名を生成し、その値をWebサイト側で検証する仕組みです。これによって、誰がログインしたかだけでなく、どの内容の取引を正当に依頼したかを確認できる点が特徴で、MITB攻撃による不正送金の対策として有効です。<br/><br/>ハードウェアトークンは、振込先口座番号・振込金額をORコードなどで読取り、そのトランザクションに対応する署名（本問ではMAC）を表示します。利用者はWebブラウザの画面で振込先口座番号・振込金額を確認し、署名を入力してWebサーバに送信します。Webサーバ側では同じ振込先口座番号と振込金額を用いて、利用者に発行したハードウェアトークンと同じ処理手順で署名を計算し、受信した署名と比較します。一致すれば、<em class=\"m\">改ざんされていない</em>正当な取引と判断できます。<br/><br/>もしPC内部のマルウェアが通信を書き換えて不正送金を仕掛けたとしても、マルウェアには不正送金に対応するトランザクション署名の値を知ることができません。このため、WebブラウザやPC内部でMITB攻撃が行われたとしても、Webサーバ側でこれを検知し、被害発生を防ぐことができます。<br/><br/>したがって「ウ」が正解です。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_31_haru_q10", "session": "支援士 H31春", "gap": 11, "num": 10, "topic": "クロスサイトリクエストフォージェリ対策", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "クロスサイトリクエストフォージェリ攻撃の対策として，効果がないものはどれか。", "mondai_html": "<div id=\"mondai\">クロスサイトリクエストフォージェリ攻撃の対策として，<b>効果がない</b>ものはどれか。</div>", "choices": {"ア": "Webサイトでの決済などの重要な操作の都度，利用者のパスワードを入力させる。", "イ": "Webサイトへのログイン後，毎回異なる値をHTTPレスポンスに含め，Webブラウザからのリクエストごとに送付されるその値を，Webサーバ側で照合する。", "ウ": "Webブラウザからのリクエスト中のRefererによって正しいリンク元からの遷移であることを確認する。", "エ": "WebブラウザからのリクエストをWebサーバで受け付けた際に，リクエストに含まれる\"<\"や\">\"などの特殊文字を，タグとして認識されない\"&lt;\"や\"&gt;\" などの文字列に置き換える。"}, "choices_html": {"ア": "Webサイトでの決済などの重要な操作の都度，利用者のパスワードを入力させる。", "イ": "Webサイトへのログイン後，毎回異なる値をHTTPレスポンスに含め，Webブラウザからのリクエストごとに送付されるその値を，Webサーバ側で照合する。", "ウ": "Webブラウザからのリクエスト中のRefererによって正しいリンク元からの遷移であることを確認する。", "エ": "WebブラウザからのリクエストをWebサーバで受け付けた際に，リクエストに含まれる\"<\"や\">\"などの特殊文字を，タグとして認識されない\"&lt;\"や\"&gt;\" などの文字列に置き換える。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_10.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>クロスサイトリクエストフォージェリ</strong>(CSRF)は、悪意のあるスクリプトを埋め込んだWebページを訪問者に閲覧させて、利用者認証やセッション管理の脆弱性のある別のWebサイトで、その訪問者が意図しない操作（ショッピングでの決済・退会等）を行わせる攻撃です。<br/><br/>CSRF被害を回避するには、不正なリクエストを退ける次のような手順を処理確定前に組み込むことが求められます。<ul><li class=\"li1\">秘密情報（CSRFページトークン）による認証</li><li class=\"li2\">重要操作前にパスワードの再入力を求める</li><li class=\"li3\">参照元情報（Referrer：リファラー）の検証</li></ul>「ア」「イ」「ウ」の対策はCSRF対策として有効ですが、「エ」はXSS(クロスサイトスクリプティング)対策であるためCSRFには効果がありません。</div>", "past_history": ["安全確保支援士 R6春期 問1", "安全確保支援士 R7秋期 問16"], "hist_count": 3}, {"id": "sc_31_haru_q11", "session": "支援士 H31春", "gap": 11, "num": 11, "topic": "DNSキャッシュポイズニング対策", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "DNSキャッシュポイズニング攻撃に対して有効な対策はどれか。", "mondai_html": "<div id=\"mondai\">DNSキャッシュポイズニング攻撃に対して有効な対策はどれか。</div>", "choices": {"ア": "DNSサーバにおいて，侵入したマルウェアをリアルタイムに隔離する。", "イ": "DNS問合せに使用するDNSヘッダー内のIDを固定せずにランダムに変更する。", "ウ": "DNS問合せに使用する送信元ポート番号を53番に固定する。", "エ": "外部からのDNS問合せに対しては，宛先ポート番号53のものだけに応答する。"}, "choices_html": {"ア": "DNSサーバにおいて，侵入したマルウェアをリアルタイムに隔離する。", "イ": "DNS問合せに使用するDNSヘッダー内のIDを固定せずにランダムに変更する。", "ウ": "DNS問合せに使用する送信元ポート番号を53番に固定する。", "エ": "外部からのDNS問合せに対しては，宛先ポート番号53のものだけに応答する。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_11.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>DNSキャッシュポイズニング攻撃</strong>は、DNSキャッシュサーバのキャッシュに偽の情報を登録させ、そのキャッシュを参照した利用者を悪意のあるサイトに誘導する攻撃です。<br/><br/>DNSキャッシュポイズニング攻撃の一般的な攻撃手順は次のとおりです（参考URLからの転載）。<ol><li class=\"maru1\">攻撃者は、偽の情報を送り込みたいドメイン名について、ターゲットとなるキャッシュサーバに問い合わせを送る</li><li class=\"maru2\">問い合わせを受けたキャッシュサーバは、外部の権威サーバに問い合わせる</li><li class=\"maru3\">攻撃者は、権威サーバから正しい応答が返ってくる前に、偽の応答パケットをキャッシュサーバに送り込む</li><li class=\"maru4\">キャッシュサーバが②で送った問い合わせメッセージのIDと、攻撃者が③で送った偽のメッセージのIDが一致すれば攻撃成功</li></ol><div class=\"img_margin\"><img alt=\"11.png/image-size:355×183\" height=\"183\" src=\"https://www.sc-siken.com/kakomon/31_haru/img/11.png\" style=\"max-width: 100%; height: auto;\" width=\"355\"/></div><ul><li class=\"lia\">DNSキャッシュポイズニング攻撃は、マルウェアによって引き起こされる攻撃ではないため不適切です。</li><li class=\"lii\">正しい。DNSメッセージには\"ID\"という16ビットの識別子が付与されていて、DNS応答を受信したときに、それがどのDNS問合せに対応するものかを判断できるようになっています。IDは16ビット(=65,536通り)しかないため、固定化されていると総当りや推測で一致してしまうおそれがあります。したがって、DNS問合せごとに異なるIDを設定することが、攻撃成立の可能性を下げるために有効な対策となります。</li><li class=\"liu\">DNS問合せで使用されるポート番号は53/UDPが標準です。仕様どおりの53番に固定されていると応答パケットの偽装が簡単になるため、ランダムに選択したポート番号を通信に使用することが対策となります（<b>ソースポートランダマイゼーション</b>）。</li><li class=\"lie\">宛先ポート番号53はDNSサービスに対するパケットです。外部からのDNS問合せに無制限に応答している状態だと、攻撃対象にされたり、攻撃の踏み台に悪用されたりするリスクが高まります。再帰的なDNS問合せは、イントラネットからのアクセスのみを許可し、インターネットからの再帰的な問合せは拒否することが推奨されます。</li></ul>参考URL: DNSキャッシュポイズニング(JPNIC)<br/>　<a href=\"https://www.nic.ad.jp/ja/newsletter/No40/0800.html\" target=\"_blank\">https://www.nic.ad.jp/ja/newsletter/No40/0800.html</a></div>", "past_history": ["情報セキュリティ H28春期 問12"], "hist_count": 2}, {"id": "sc_31_haru_q12", "session": "支援士 H31春", "gap": 11, "num": 12, "topic": "VLAN機能のセキュリティ効果", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "VLAN機能をもった1台のレイヤー3スイッチに複数のPCを接続している。スイッチのポートをグループ化して複数のセグメントに分けると，スイッチのポートをセグメントを分けない場合に比べて，どのようなセキュリティ上の効果が得られるか。", "mondai_html": "<div id=\"mondai\">VLAN機能をもった1台のレイヤー3スイッチに複数のPCを接続している。スイッチのポートをグループ化して複数のセグメントに分けると，スイッチのポートをセグメントを分けない場合に比べて，どのようなセキュリティ上の効果が得られるか。</div>", "choices": {"ア": "スイッチが，PCから送出されるICMPパケットを全て遮断するので，PC間のマルウェア感染のリスクを低減できる。", "イ": "スイッチが，PCからのブロードキャストパケットの到達範囲を制限するので，アドレス情報の不要な流出のリスクを低減できる。", "ウ": "スイッチが，PCのMACアドレスから接続可否を判別するので，PCの不正接続のリスクを低減できる。", "エ": "スイッチが，物理ポートごとに，決まったIPアドレスをもつPCの接続だけを許可するので，PCの不正接続のリスクを低減できる。"}, "choices_html": {"ア": "スイッチが，PCから送出されるICMPパケットを全て遮断するので，PC間のマルウェア感染のリスクを低減できる。", "イ": "スイッチが，PCからのブロードキャストパケットの到達範囲を制限するので，アドレス情報の不要な流出のリスクを低減できる。", "ウ": "スイッチが，PCのMACアドレスから接続可否を判別するので，PCの不正接続のリスクを低減できる。", "エ": "スイッチが，物理ポートごとに，決まったIPアドレスをもつPCの接続だけを許可するので，PCの不正接続のリスクを低減できる。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_12.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>VLAN</strong>(Virtual LAN)は、スイッチに接続された端末を物理的な構成に関係なくグループ化する機能、またはその機能で形成されたネットワークのことです。VLANにはセグメントの分割を基準により幾つかの方式があります。<dl><dt>ポートベースVLAN</dt><dd>スイッチの接続ポート単位でグルーピング</dd><dt>アドレスベースVLAN</dt><dd>MACアドレスやIPアドレスを基準にグルーピング</dd><dt>ポリシーベースVLAN</dt><dd> IP、IPX、AppleTalkなどのネットワークプロトコルごとにグルーピング</dd><dt>タグVLAN</dt><dd>パケット内の拡張タグに指定された情報によってグルーピング</dd></dl>ポートベースVLANでは以下のように同一のグループにするポートに\"VLAN ID\"を設定することで、ネットワークの分割を行います。<div class=\"img_margin\"><img alt=\"12.png/image-size:289×229\" height=\"229\" src=\"https://www.sc-siken.com/kakomon/31_haru/img/12.png\" style=\"max-width: 100%; height: auto;\" width=\"289\"/></div>通常であれば、同じスイッチに接続されているPCは同じブロードキャストドメインに属しますが、VLAN同士は異なるセグメントとして扱われるため直接の通信ができません。この仕組みによりブロードキャストパケットの到達範囲が同じVLAN内のみに限定されることになり、内部の情報が異なるVLANへ不用意に流出するのを防止するセキュリティ効果が期待できます。<ul><li class=\"lia\">ICMPパケットは、インターネット層(OSI参照モデル第3層のネットワーク層)で動作します。設問ではPCはレイヤー3スイッチで接続されているので、ICMPパケットはレイヤー3スイッチの内部ルータを介して異なるVLAN同士に伝達されます。</li><li class=\"lii\">正しい。</li><li class=\"liu\">アドレスベースVLANにおけるセキュリティ効果です。</li><li class=\"lie\">「ウ」と同じくアドレスベースVLANにおけるセキュリティ効果です。ポートベースVLANでは、アドレス情報をセグメント分割の判断基準に使用しません。</li></ul></div>", "past_history": ["情報セキュリティ H27秋期 問11"], "hist_count": 2}, {"id": "sc_31_haru_q13", "session": "支援士 H31春", "gap": 11, "num": 13, "topic": "無線LANの情報セキュリティ対策", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "無線LANの情報セキュリティ対策に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">無線LANの情報セキュリティ対策に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "EAPは，クライアントPCとアクセスポイントとの間で，あらかじめ登録した共通鍵による暗号化通信を実装するための規格である。", "イ": "RADIUSは，クライアントPCとアクセスポイントとの間で公開鍵暗号方式による暗号化通信を実装するための規格である。", "ウ": "SSIDは，クライアントPCごとの秘密鍵を定めたものであり，公開鍵暗号方式による暗号化通信を実装するための規格で規定されている。", "エ": "WPA2-Enterpriseは，IEEE802.1Xの規格に沿った利用者認証及び動的に配布される暗号化鍵を用いた暗号化通信を実装するための方式である。"}, "choices_html": {"ア": "EAPは，クライアントPCとアクセスポイントとの間で，あらかじめ登録した共通鍵による暗号化通信を実装するための規格である。", "イ": "RADIUSは，クライアントPCとアクセスポイントとの間で公開鍵暗号方式による暗号化通信を実装するための規格である。", "ウ": "SSIDは，クライアントPCごとの秘密鍵を定めたものであり，公開鍵暗号方式による暗号化通信を実装するための規格で規定されている。", "エ": "WPA2-Enterpriseは，IEEE802.1Xの規格に沿った利用者認証及び動的に配布される暗号化鍵を用いた暗号化通信を実装するための方式である。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">EAP(Extensible Authentication Protocol)は、PPPの機能を拡張した認証プロトコルです。EAPはデジタル証明書、メッセージダイジェスト、OTPなど様々な認証方式をサポートしていますが、暗号化通信の機能は規定されていません。</li><li class=\"lii\">RADIUS(Remote Authentication Dial In User Service)は、認証および利用ログの記録を単一のサーバに一元化することを目的としたプロトコルで、暗号化通信の機能はありません。</li><li class=\"liu\">SSID(Service Set Identifier)は、無線LANの規格であるIEEE802.11シリーズにおいて「混信」を避けるためにアクセスポイントと端末に設定するネットワーク識別子です。</li><li class=\"lie\">正しい。WPA2にはパーソナルモードとエンタープライズモードが規定されており、<strong>WPA2-Enterprise</strong>は、認証にIEEE802.1Xを用いる方式です。IEEE802.1Xでは、クライアント－アクセスポイント－認証サーバの3者間で認証情報がやり取りされます。認証に成功すると、認証サーバはPMK(Pairwise Master Key)と呼ばれる暗号化鍵の種を動的に生成し、アクセスポイントと認証された端末に配布します。暗号化鍵は、このPMKから生成されるのでセッションごとに異なる仕組みになっています。<br/>ちなみに<strong>WPA2-personal</strong>は、個人や小規模企業などの認証サーバを用意できないネットワーク向けの方式で、端末に設定された事前共有鍵(PSK)を用いて認証を行います。</li></ul></div>", "past_history": ["安全確保支援士 R3秋期 問15", "安全確保支援士 R5春期 問14", "情報セキュリティ H22秋期 問14", "情報セキュリティ H26春期 問13", "安全確保支援士 H29秋期 問17", "情報セキュリティ H18春期 問49", "情報セキュリティ H20春期 問48"], "hist_count": 8}, {"id": "sc_31_haru_q14", "session": "支援士 H31春", "gap": 11, "num": 14, "topic": "OP25Bを導入する目的はどれか", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "インターネットサービスプロバイダ(ISP)が，OP25Bを導入する目的はどれか。", "mondai_html": "<div id=\"mondai\">インターネットサービスプロバイダ(ISP)が，OP25Bを導入する目的はどれか。</div>", "choices": {"ア": "ISP管理外のネットワークに対するISP管理下のネットワークからのICMPパケットによるDDoS攻撃を遮断する。", "イ": "ISP管理外のネットワークに向けてISP管理下のネットワークから送信されるスパムメールを制限する。", "ウ": "ISP管理下のネットワークに対するISP管理外のネットワークからのICMPパケットによるDDoS攻撃を遮断する。", "エ": "ISP管理下のネットワークに向けてISP管理外のネットワークから送信されるスパムメールを制限する。"}, "choices_html": {"ア": "ISP管理外のネットワークに対するISP管理下のネットワークからのICMPパケットによるDDoS攻撃を遮断する。", "イ": "ISP管理外のネットワークに向けてISP管理下のネットワークから送信されるスパムメールを制限する。", "ウ": "ISP管理下のネットワークに対するISP管理外のネットワークからのICMPパケットによるDDoS攻撃を遮断する。", "エ": "ISP管理下のネットワークに向けてISP管理外のネットワークから送信されるスパムメールを制限する。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>OP25B</strong>(Outbound Port 25 Blocking)は、外部のメールサーバと直接TCPコネクションを確立することで送信されるスパムメールをISP側で防ぐための対策です。<br/><br/>正規のメールは、契約するISPのメールサーバを経由して送信されるため、SMTPの接続先としてISPのメールサーバがセットされています。しかし、スパムメールの送信を続ければ、いずれはISPのブラックリストに登録されてしまいますから、スパムメールの送信には外部の脆弱性のあるメールサーバと直接接続してメールを送信する手段が使われます。このようなスパムメールの送信を防止するための対策がOP25Bであり、その名のとおり、<ul><li><em class=\"r\">ISP管理下</em>の動的IPアドレスから</li><li>ISPのメールサーバを経由せずに<em class=\"r\">外向き</em>(インターネット方向)に発信される</li><li><em class=\"r\">SMTP</em>通信(ポート<em class=\"r\">25</em>番)</li></ul>という3つのすべてに合致する通信をISP側で遮断する仕組みです。<br/><br/>したがって適切な記述は「イ」です。<ul><li class=\"lia\">遮断するのはSMTP通信です。</li><li class=\"lii\">正しい。</li><li class=\"liu\">遮断するのは外向き(Outbound)のSMTP通信のみです。</li><li class=\"lie\">遮断するのは外向き(Outbound)のSMTP通信のみです。</li></ul></div>", "past_history": ["安全確保支援士 R3春期 問14", "安全確保支援士 R5春期 問16", "安全確保支援士 R7春期 問17", "安全確保支援士 H29春期 問15"], "hist_count": 5}, {"id": "sc_31_haru_q15", "session": "支援士 H31春", "gap": 11, "num": 15, "topic": "SPFの導入時に行う設定", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "SPF(Sender Policy Framework)によるドメイン認証を実施する場合，SPFの導入時に，電子メール送信元アドレスのドメイン所有者側で行う必要がある設定はどれか。", "mondai_html": "<div id=\"mondai\">SPF(Sender Policy Framework)によるドメイン認証を実施する場合，SPFの導入時に，電子メール送信元アドレスのドメイン所有者側で行う必要がある設定はどれか。</div>", "choices": {"ア": "DNSサーバにSPFレコードを登録する。", "イ": "DNSの問合せで使用するポート番号を変更する。", "ウ": "メールサーバにデジタル証明書を導入する。", "エ": "メールサーバのTCPポート25番を利用不可にする。"}, "choices_html": {"ア": "DNSサーバにSPFレコードを登録する。", "イ": "DNSの問合せで使用するポート番号を変更する。", "ウ": "メールサーバにデジタル証明書を導入する。", "エ": "メールサーバのTCPポート25番を利用不可にする。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SPF</strong>(Sender Policy Framework)は、メールを送信しようとしてきたメールサーバのIPアドレス情報を検証することで、正規のサーバからのメール送信であるかどうか確認することができる技術です。<br/><br/>SPFを用いた送信元IPアドレスの検証手順は以下のようになっています。<ol><li class=\"maru1\"><em class=\"m\">送信側は、送信側ドメインのDNSサーバのSPFレコード(またはTXTレコード)に正当なメールサーバのIPアドレスやホスト名を登録し、公開しておく</em></li><li class=\"maru2\">送信側から受信側へ、SMTPメールが送信される</li><li class=\"maru3\">受信側メールサーバは、受信側ドメインのDNSサーバを通じて、MAIL FROMコマンドに記載された送信者メールアドレスのドメインを管理するDNSサーバに問い合わせ、SPF情報を取得する</li><li class=\"maru4\">SPF情報との照合でSMTP接続してきたメールサーバのIPアドレスの確認に成功すれば、正当なドメインから送信されたと判断する</li></ol>SPFでは、送信側のDNSサーバに登録されたSPF情報を基に認証を行うため、送信側ドメインの所有者はあらかじめDNSサーバにSPFレコードを登録しておく必要があります。したがって「ア」が適切です。<br/><div class=\"pre\">//SPFレコードの例<br/>IN TXT v=spf1 +ip4:219.94.200.28 ~all</div><div class=\"img_margin\"><img alt=\"15.png/image-size:577×280\" height=\"280\" src=\"https://www.sc-siken.com/kakomon/31_haru/img/15.png\" style=\"max-width: 100%; height: auto;\" width=\"577\"/></div><ul><ul><li class=\"lia\">正しい。SPFの導入時に行うべき設定です。</li><li class=\"lii\">DNSキャッシュポイズニング対策で行うべき設定です。</li><li class=\"liu\">DKIM(Domainkeys Identified Mail)の導入時に行うべき設定です。</li><li class=\"lie\">25/TCPを利用不可にするとメールを受信できなくなるため不適切です。</li></ul></ul></div>", "past_history": ["安全確保支援士 R4秋期 問15"], "hist_count": 2}, {"id": "sc_31_haru_q17", "session": "支援士 H31春", "gap": 11, "num": 17, "topic": "ステートフルインスペクション方式", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "ステートフルインスペクション方式のファイアウォールの特徴はどれか。", "mondai_html": "<div id=\"mondai\">ステートフルインスペクション方式のファイアウォールの特徴はどれか。</div>", "choices": {"ア": "WebクライアントとWebサーバとの間に配置され，リバースプロキシサーバとして動作する方式であり，Webクライアントからの通信を目的のWebサーバに中継する際に，通信に不正なデータがないかどうかを検査する。", "イ": "アプリケーションプロトコルごとにプロキシソフトウェアを用意する方式であり，クライアントからの通信を目的のサーバに中継する際に，通信に不正なデータがないかどうかを検査する。", "ウ": "特定のアプリケーションプロトコルだけを通過させるゲートウェイソフトウェアを利用する方式であり，クライアントからのコネクションの要求を受け付けて，目的のサーバに改めてコネクションを要求することによって，アクセスを制御する。", "エ": "パケットフィルタリングを拡張した方式であり，過去に通過したパケットから通信セッションを認識し，受け付けたパケットを通信セッションの状態に照らし合わせて通過させるか遮断するかを判断する。"}, "choices_html": {"ア": "WebクライアントとWebサーバとの間に配置され，リバースプロキシサーバとして動作する方式であり，Webクライアントからの通信を目的のWebサーバに中継する際に，通信に不正なデータがないかどうかを検査する。", "イ": "アプリケーションプロトコルごとにプロキシソフトウェアを用意する方式であり，クライアントからの通信を目的のサーバに中継する際に，通信に不正なデータがないかどうかを検査する。", "ウ": "特定のアプリケーションプロトコルだけを通過させるゲートウェイソフトウェアを利用する方式であり，クライアントからのコネクションの要求を受け付けて，目的のサーバに改めてコネクションを要求することによって，アクセスを制御する。", "エ": "パケットフィルタリングを拡張した方式であり，過去に通過したパケットから通信セッションを認識し，受け付けたパケットを通信セッションの状態に照らし合わせて通過させるか遮断するかを判断する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ステートフルインスペクション方式</strong>は、ダイナミックパケットフィルター方式とも呼ばれ、ファイアウォールを通過する個々のセッションの状態を管理し、その情報に基づき動的にポートを開閉することで詳細なアクセス制御を行うファイアウォールです。<br/>個々のセッションごとに過去の通信を保持しているため「順序の矛盾した攻撃パケットを遮断することができる」ことや、常に最小限の許可ルールが追加されるため「アクセス制御リストの設定不備を突く攻撃を受けにくい」という優れた点があり、多くのファイアウォール製品に採用されています。<br/><br/><b>ステートフル</b>(stateful)とは、システムが一連のセッション状態を保持し、個々の通信とセッション情報を照らし合わせて処理を決定する方式や考え方をいいます。<ul><li class=\"lia\">Web Application Firewall(WAF)の特徴です。</li><li class=\"lii\">アプリケーションゲートウェイ方式の特徴です。</li><li class=\"liu\">サーキットレベルゲートウェイ方式の特徴です。</li><li class=\"lie\">正しい。ステートフルインスペクション方式(又はダイナミックパケットフィルター方式)の特徴です。</li></ul></div>", "past_history": ["安全確保支援士 R3春期 問6", "情報セキュリティ H27秋期 問3", "安全確保支援士 H29秋期 問9"], "hist_count": 4}, {"id": "sc_31_haru_q18", "session": "支援士 H31春", "gap": 11, "num": 18, "topic": "無線LANの隠れ端末問題", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "無線LANの隠れ端末問題の説明として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">無線LANの隠れ端末問題の説明として，適切なものはどれか。</div>", "choices": {"ア": "クセスポイントがSSIDステルス機能を用いてビーコン信号を止めることによって，端末から利用可能なSSIDが分からなくなる問題", "イ": "端末がアクセスポイントとは通信できるが，他の端末のキャリアを検出できない状況にあり，送信フレームが衝突を起こしやすくなる問題", "ウ": "端末が別のアクセスポイントとアソシエーションを確立することによって，その端末が元のアクセスポイントからは見えなくなる問題", "エ": "複数の端末が同時にフレームを送信したとき，送信した端末が送信フレームの衝突を検出できない問題"}, "choices_html": {"ア": "クセスポイントがSSIDステルス機能を用いてビーコン信号を止めることによって，端末から利用可能なSSIDが分からなくなる問題", "イ": "端末がアクセスポイントとは通信できるが，他の端末のキャリアを検出できない状況にあり，送信フレームが衝突を起こしやすくなる問題", "ウ": "端末が別のアクセスポイントとアソシエーションを確立することによって，その端末が元のアクセスポイントからは見えなくなる問題", "エ": "複数の端末が同時にフレームを送信したとき，送信した端末が送信フレームの衝突を検出できない問題"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">無線LANでは、アクセス制御方式としてCSMA/CAを採用しています。CSMA/CAでは、自分以外の端末の送信フレームを検出した場合、各端末は、その送信時間が満了するまでフレームの送信を待つことで衝突を回避するようになっています。<br/><br/>CSMA/CAでは、各端末が互いに送信フレームを受信できることが前提になっていますが、2つの端末間の遮蔽物や位置関係によっては送信フレームを受信できないことがあります。このとき、互いに他方の端末の送信を検知できないことになるため、同時送信による衝突が起こりやすくなります。これを「隠れ端末問題」といいます。<br/><br/>したがって「イ」が適切です。<br/><br/>なお「エ」についてですが、すべての端末はアクセスポイントとは通信できるため、送信側は、アクセスポイントからのフレームが一定時間内に返ってこないことによって衝突を検出できます。<div class=\"img_margin\"><img alt=\"18.png/image-size:468×205\" height=\"205\" src=\"https://www.sc-siken.com/kakomon/31_haru/img/18.png\" style=\"max-width: 100%; height: auto;\" width=\"468\"/></div></div>", "past_history": [], "hist_count": 1}, {"id": "sc_31_haru_q19", "session": "支援士 H31春", "gap": 11, "num": 19, "topic": "PPPoE", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "シリアル回線で使用するものと同じデータリンクのコネクション確立やデータ転送を，LAN上で実現するプロトコルはどれか。", "mondai_html": "<div id=\"mondai\">シリアル回線で使用するものと同じデータリンクのコネクション確立やデータ転送を，LAN上で実現するプロトコルはどれか。</div>", "choices": {"ア": "MPLS", "イ": "PPP", "ウ": "PPPoE", "エ": "PPTP"}, "choices_html": {"ア": "MPLS", "イ": "PPP", "ウ": "PPPoE", "エ": "PPTP"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">Multi Protocol Label Switchingの略。IP-VPNで使用される技術で、IPルーティングによるパケット転送よりも高速な転送処理を実現します。</li><li class=\"lii\">Point-to-Point Protocolの略。電話回線を通じてコンピュータをネットワークに接続するダイヤルアップ接続でよく使われる、2点間を接続してデータ通信を行うための通信プロトコルです。</li><li class=\"liu\">正しい。<strong>PPPoE</strong>(PPP over Ethernet)は、電話回線やISDNでインターネットを接続する際に使われるPPPをイーサネット上で利用できるようにしたものです。PPPの機能であるユーザー認証やIPアドレスの割り当て等をイーサネット上で実現することができます。</li><li class=\"lie\">Point-to-Point Tunneling Protocolの略。第2層のPPPパケットをIPパケットでトンネリングする方式で、暗号化機能や独自の利用者認証機能をもちます。マイクロソフト社によって開発されました。</li></ul></div>", "past_history": ["情報セキュリティ H24春期 問18"], "hist_count": 2}, {"id": "sc_31_haru_q20", "session": "支援士 H31春", "gap": 11, "num": 20, "topic": "SNMPのメッセージ", "subcat": "ネットワーク管理", "category": "情報セキュリティ", "mondai": "ネットワーク管理プロトコルであるSNMPv3で使われるPDUのうち，事象の発生をエージェントが自発的にマネージャに知らせるために使用するものはどれか。ここで，エージェントとはエージェント相当のエンティティ，マネージャとはマネージャ相当のエンティティを指す。", "mondai_html": "<div id=\"mondai\">ネットワーク管理プロトコルであるSNMPv3で使われるPDUのうち，事象の発生をエージェントが自発的にマネージャに知らせるために使用するものはどれか。ここで，エージェントとはエージェント相当のエンティティ，マネージャとはマネージャ相当のエンティティを指す。</div>", "choices": {"ア": "GetRequest-PDU", "イ": "Response-PDU", "ウ": "SetRequest-PDU", "エ": "SNMPv2-Trap-PDU"}, "choices_html": {"ア": "GetRequest-PDU", "イ": "Response-PDU", "ウ": "SetRequest-PDU", "エ": "SNMPv2-Trap-PDU"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SNMP</strong>(Simple Network Management Protocol)は、TCP/IPネットワーク上でネットワーク上の機器の情報を収集して、監視や制御を行うためのプロトコルです。<br/><br/>SNMPv3では、エージェント(管理対象の機器)とマネージャ(ネットワーク管理ステーション)間で、PDU(Protocol Data Unit)フォーマットを使用した7種類のメッセージをやり取りすることで機器の監視・制御を行います。<dl><dt>GetRequest</dt><dd>マネージャからエージェントへの参照要求</dd><dt>Response</dt><dd>エージェントからマネージャへの参照応答</dd><dt>SetRequest</dt><dd>マネージャからエージェントへの設定要求</dd><dt>SNMPv2-Trap</dt><dd>エージェントからマネージャへのイベント通知</dd><dt>GetNextRequest、GetBulkRequest、Report</dt><dd>(内容省略)</dd></dl>したがって正解は「エ」の Trap になります。</div>", "past_history": ["情報セキュリティ H24春期 問19", "情報セキュリティ H18春期 問25"], "hist_count": 3}, {"id": "sc_31_haru_q22", "session": "支援士 H31春", "gap": 11, "num": 22, "topic": "ファジング", "subcat": "セキュリティ技術評価", "category": "情報セキュリティ", "mondai": "問題を引き起こす可能性があるデータを大量に入力し，そのときの応答や挙動を監視することによって，ソフトウェアの脆弱性を検出するテスト手法はどれか。", "mondai_html": "<div id=\"mondai\">問題を引き起こす可能性があるデータを大量に入力し，そのときの応答や挙動を監視することによって，ソフトウェアの脆弱性を検出するテスト手法はどれか。</div>", "choices": {"ア": "限界値分析", "イ": "実験計画法", "ウ": "ファジング", "エ": "ロードテスト"}, "choices_html": {"ア": "限界値分析", "イ": "実験計画法", "ウ": "ファジング", "エ": "ロードテスト"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ファジング</strong>(fuzzing)とは、検査対象のソフトウェア製品に「ファズ（英名：fuzz）」と呼ばれる問題を引き起こしそうなデータを大量に送り込み、その応答や挙動を監視することで(未知の)脆弱性を検出する検査手法です。<div class=\"img_margin\"><img alt=\"22.png/image-size:454×224\" height=\"224\" src=\"https://www.sc-siken.com/kakomon/31_haru/img/22.png\" style=\"max-width: 100%; height: auto;\" width=\"454\"/></div>ファジングは、ファズデータの生成、検査対象への送信、挙動の監視を自動で行うファジングツール(ファザー)と呼ばれるソフトウェアを使用して行います。開発ライフサイクルにファジングを導入することで「バグや脆弱性の低減」「テストの自動化・効率化によるコスト削減」が期待できるため、大手企業の一部で徐々に活用され始めています。<br/><br/>したがって「ウ」が正解です。<ul><li class=\"lia\">限界値分析は、一般的に問題が発生する可能性の高い限界値や境界値を入力して、問題が発生しないかどうかを検証する手法です。</li><li class=\"lii\">実験計画法は、確認すべき複数の要因をうまく組み合わせることによって、なるべく少ない実験回数で効率的に検証する手法です。</li><li class=\"liu\">正しい。ファジングは、様々な不正確なデータを入力として送り、ソフトウェアが意図しない動作をしないかどうか検証する手法です。</li><li class=\"lie\">ロードテストは、通常想定される運用条件下の高負荷をかけた状態でソフトウェアを動作させ、問題が発生しないかどうかを検証する手法です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_31_haru_q23", "session": "支援士 H31春", "gap": 11, "num": 23, "topic": "マッシュアップに該当するもの", "subcat": "開発プロセス・手法", "category": "情報セキュリティ", "mondai": "マッシュアップに該当するものはどれか。", "mondai_html": "<div id=\"mondai\">マッシュアップに該当するものはどれか。</div>", "choices": {"ア": "既存のプログラムから，そのプログラムの仕様を導き出す。", "イ": "既存のプログラムを部品化し，それらの部品を組み合わせて，新規プログラムを開発する。", "ウ": "クラスライブラリを利用して，新規プログラムを開発する。", "エ": "公開されている複数のサービスを利用して，新たなサービスを提供する。"}, "choices_html": {"ア": "既存のプログラムから，そのプログラムの仕様を導き出す。", "イ": "既存のプログラムを部品化し，それらの部品を組み合わせて，新規プログラムを開発する。", "ウ": "クラスライブラリを利用して，新規プログラムを開発する。", "エ": "公開されている複数のサービスを利用して，新たなサービスを提供する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>マッシュアップ</strong>(Mashup)は、他サイトで公開されているWebサービスのAPIを組み合わせて一つの新しいWebサービスのように機能させることです。ITの深い知識がなくても、既存のWebサービスや提供されている大量のデータを組み合わせて、短期間でWebアプリケーションの開発ができることから、新しい開発技法として注目されています。<br/><br/>公開されているWebサービスには、SNSやサイトの情報を取得できるAPIをはじめ、Google Mapに代表される地図情報や画像認識、音声認識、動画関連、翻訳、EC情報など様々なものがあり、誰でもAPIを介してサービスを操作することができます。一からその機能を自サイトに実装するのに比べて、簡単に目的の機能を自サイトに掲載できる利点があります。<ul><li class=\"lia\">リバースエンジニアリングの説明です。</li><li class=\"lii\">コンポーネント指向プログラミングの説明です。</li><li class=\"liu\">オブジェクト指向開発手法の説明です。</li><li class=\"lie\">正しい。マッシュアップの説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_31_haru_q24", "session": "支援士 H31春", "gap": 11, "num": 24, "topic": "DBのバックアップ・復旧時間", "subcat": "サービスの運用", "category": "情報セキュリティ", "mondai": "データの追加・変更・削除が，少ないながらも一定の頻度で行われるデータベースがある。このデータベースのフルバックアップを磁気テープに取得する時間間隔を今までの2倍にした。このとき，データベースのバックアップ又は復旧に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">データの追加・変更・削除が，少ないながらも一定の頻度で行われるデータベースがある。このデータベースのフルバックアップを磁気テープに取得する時間間隔を今までの2倍にした。このとき，データベースのバックアップ又は復旧に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "復旧時に行うログ情報の反映の平均処理時間が約2倍になる。", "イ": "フルバックアップ取得1回当たりの磁気テープ使用量が約2倍になる。", "ウ": "フルバックアップ取得1回当たりの磁気テープ使用量が約半分になる。", "エ": "フルバックアップ取得の平均処理時間が約2倍になる。"}, "choices_html": {"ア": "復旧時に行うログ情報の反映の平均処理時間が約2倍になる。", "イ": "フルバックアップ取得1回当たりの磁気テープ使用量が約2倍になる。", "ウ": "フルバックアップ取得1回当たりの磁気テープ使用量が約半分になる。", "エ": "フルバックアップ取得の平均処理時間が約2倍になる。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">バックアップを使用した復旧処理では、フルバックアップを正常な記憶媒体にロードした後に、ジャーナル情報(トランザクションログ)を用いたロールフォワード(前進復帰)を行ってデータベースを障害発生直前の状態まで回復させます。<br/>フルバックアップ取得時点から次回フルバックアップまでにコミットされたトランザクションについては、ジャーナル情報をもとに復旧処理を行います。このためフルバックアップ取得の時間間隔が2倍になると、ロールフォワードで用いるジャーナル情報が平均して約2倍に増加し、ロールフォワードに要する時間も平均して約2倍になります。<br/><br/>したがって正しい記述は「ア」です。<br/><br/>その他の記述ですが、フルバックアップを実施する時間間隔が2倍になっても、記録するデータ量は変わらないため誤りです。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_31_haru_q25", "session": "支援士 H31春", "gap": 11, "num": 25, "topic": "監査調書の説明はどれか", "subcat": "システム監査", "category": "情報セキュリティ", "mondai": "システム監査における監査調書の説明として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">システム監査における監査調書の説明として，適切なものはどれか。</div>", "choices": {"ア": "監査対象部門が，監査報告後に改善提案への対応方法を記入したもの", "イ": "監査対象部門が，予備調査前に当該部門の業務内容をとりまとめたもの", "ウ": "監査人が， 実施した監査のプロセスを記録したもの", "エ": "監査人が，年度の監査計画を監査対象ごとに詳細化して作成したもの"}, "choices_html": {"ア": "監査対象部門が，監査報告後に改善提案への対応方法を記入したもの", "イ": "監査対象部門が，予備調査前に当該部門の業務内容をとりまとめたもの", "ウ": "監査人が， 実施した監査のプロセスを記録したもの", "エ": "監査人が，年度の監査計画を監査対象ごとに詳細化して作成したもの"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/31_haru/am2_25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>監査調書</strong>は、監査手続の実施内容や発見した問題点、収集した情報およびそれらの分析結果、監査人の結論などをまとめた文書です。監査調書は、監査報告書に記載される監査結果、監査意見、改善勧告などの根拠となります。<br/><br/>システム監査基準(平成30年)では「監査調書は、システム監査人が実施した監査のプロセスを記録したものであり、かつ、監査の結論の基礎となるものである」と定義されています。<ul><li class=\"lia\">改善計画書や改善実施状況報告書の説明です。</li><li class=\"lii\">監査調書ではありません。</li><li class=\"liu\">正しい。監査調書の説明です。</li><li class=\"lie\">個別監査計画書の説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_30_aki_q1", "session": "支援士 H30秋", "gap": 12, "num": 1, "topic": "AESの特徴はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "AESの特徴はどれか。", "mondai_html": "<div id=\"mondai\">AESの特徴はどれか。</div>", "choices": {"ア": "鍵長によって，段数が決まる。", "イ": "段数は，6回以内の範囲で選択できる。", "ウ": "データの暗号化，復号，暗号化の順に3回繰り返す。", "エ": "同一の公開鍵を用いて暗号化を3回繰り返す。"}, "choices_html": {"ア": "鍵長によって，段数が決まる。", "イ": "段数は，6回以内の範囲で選択できる。", "ウ": "データの暗号化，復号，暗号化の順に3回繰り返す。", "エ": "同一の公開鍵を用いて暗号化を3回繰り返す。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>AES</strong>(Advanced Encryption Standard)は、アメリカ合衆国の次世代暗号方式として規格化された共通鍵暗号方式です。<br/>暗号化に用いるブロック長は128ビット，使用する鍵の長さは128/192/256ビットから選択が可能となっています。<ul><li class=\"lia\">正しい。段数(ラウンド数)は鍵長によって10段、12段、14段と3種類に変化します。</li><li class=\"lii\">段数は10段以上です。</li><li class=\"liu\">暗号化の際には段数の分だけ暗号化処理を繰り返し、復号処理は行われません。</li><li class=\"lie\">AESは共通鍵暗号方式ですので、公開鍵は使用しません。</li></ul></div>", "past_history": ["情報セキュリティ H23特別 問1", "情報セキュリティ H27秋期 問1", "安全確保支援士 H29春期 問1"], "hist_count": 4}, {"id": "sc_30_aki_q2", "session": "支援士 H30秋", "gap": 12, "num": 2, "topic": "CVE識別子の説明はどれか", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "JVNなどの脆弱性対策情報ポータルサイトで採用されているCVE(Common Vulnerabilities and Exposures)識別子の説明はどれか。", "mondai_html": "<div id=\"mondai\">JVNなどの脆弱性対策情報ポータルサイトで採用されているCVE(Common Vulnerabilities and Exposures)識別子の説明はどれか。</div>", "choices": {"ア": "コンピュータで必要なセキュリティ設定項目を識別するための識別子", "イ": "脆弱性が悪用されて改ざんされたWebサイトのスクリーンショットを識別するための識別子", "ウ": "製品に含まれる脆弱性を識別するための識別子", "エ": "セキュリティ製品を識別するための識別子"}, "choices_html": {"ア": "コンピュータで必要なセキュリティ設定項目を識別するための識別子", "イ": "脆弱性が悪用されて改ざんされたWebサイトのスクリーンショットを識別するための識別子", "ウ": "製品に含まれる脆弱性を識別するための識別子", "エ": "セキュリティ製品を識別するための識別子"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CVE</strong>(共通脆弱性識別子)は、情報セキュリティに関して一般公表されている脆弱性ごとに割り振られる識別子です。各脆弱性に一意の識別番号を付けることにより、ベンダーやセキュリティ機関で共通の脆弱性情報を参照することを可能としています。<br/><br/>CVEは、JVN(Japan Vulnerability Notes)などの脆弱性情報を取り扱うサイトで公開されており、ベンダーやセキュリティ機関で共通の脆弱性情報を参照することが可能です。識別子の形式は<span class=\"code\">CVE-&lt;西暦年号&gt;-&lt;4桁以上の数字&gt;</span>です。例えば CVE-2021-44228 は、Log4jというJavaのロギングライブラリに関する脆弱性を指します。<br/><br/>したがって正しい記述は「ウ」になります。<br/><br/>脆弱性対策関連情報には似たような英語略字の用語があります。次の5つは押さえておきましょう。<ul><li>CVE … 共通脆弱性識別子</li><li>CCE … 共通セキュリティ設定一覧</li><li>CWE … 共通脆弱性タイプ一覧</li><li>CPE … 共通プラットフォーム一覧</li><li>CVSS … 共通脆弱性評価システム</li></ul><ul><li class=\"lia\">CCE(Common Configuration Enumeration)の説明です。</li><li class=\"lii\">該当する識別子は存在しません。</li><li class=\"liu\">正しい。CVEの説明です。</li><li class=\"lie\">CPE(Common Platform Enumeration)の説明です。</li></ul></div>", "past_history": ["安全確保支援士 R3春期 問8", "情報セキュリティ H25秋期 問5", "情報セキュリティ H27春期 問7", "安全確保支援士 H29春期 問10"], "hist_count": 5}, {"id": "sc_30_aki_q5", "session": "支援士 H30秋", "gap": 12, "num": 5, "topic": "FIPS PUB 140-2の記述内容はどれか", "subcat": "セキュリティ技術評価", "category": "情報セキュリティ", "mondai": "FIPS PUB 140-2の記述内容はどれか。", "mondai_html": "<div id=\"mondai\">FIPS PUB 140-2の記述内容はどれか。</div>", "choices": {"ア": "暗号モジュールのセキュリティ要求事項", "イ": "情報セキュリティマネジメントシステムの要求事項", "ウ": "デジタル証明書や証明書失効リストの技術仕様", "エ": "無線LANセキュリティの技術仕様"}, "choices_html": {"ア": "暗号モジュールのセキュリティ要求事項", "イ": "情報セキュリティマネジメントシステムの要求事項", "ウ": "デジタル証明書や証明書失効リストの技術仕様", "エ": "無線LANセキュリティの技術仕様"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>FIPS 140</strong>(Federal Information Processing Standardization 140)は、米国連邦政府の省庁等各機関が利用する、ハードウェア及びソフトウェア両方を含む \"暗号モジュール\" に関する要件を規定した米国連邦政府標準規格で、2014年1月現在の最新版は「FIPS 140-2」です。FIPS 140-2では、レベル1からレベル4までの4段階のレベルを規定しています。<br/><br/>したがって正しい記述は「ア」です。<ul><li class=\"lia\">正しい。FIPS PUB 140-2の記述内容です。</li><li class=\"lii\">JIS Q 27001の記述内容です。</li><li class=\"liu\">ITU-T X.509の記述内容です。</li><li class=\"lie\">IEEE802.11iの記述内容です。</li></ul></div>", "past_history": ["安全確保支援士 R3秋期 問7", "安全確保支援士 R6春期 問10", "情報セキュリティ H22秋期 問3", "情報セキュリティ H24秋期 問8", "情報セキュリティ H26秋期 問5", "安全確保支援士 H29春期 問7"], "hist_count": 7}, {"id": "sc_30_aki_q7", "session": "支援士 H30秋", "gap": 12, "num": 7, "topic": "UDPの性質を悪用したDDoS攻撃", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "UDPの性質を悪用したDDoS攻撃に該当するものはどれか。", "mondai_html": "<div id=\"mondai\">UDPの性質を悪用したDDoS攻撃に該当するものはどれか。</div>", "choices": {"ア": "DNSリフレクタ攻撃", "イ": "SQLインジェクション攻撃", "ウ": "ディレクトリトラバーサル攻撃", "エ": "パスワードリスト攻撃"}, "choices_html": {"ア": "DNSリフレクタ攻撃", "イ": "SQLインジェクション攻撃", "ウ": "ディレクトリトラバーサル攻撃", "エ": "パスワードリスト攻撃"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>DNSリフレクタ攻撃</strong>(DNS amp)は、脆弱性のある公開DNSキャッシュサーバを踏み台として悪用することで行われる反射型DDoS攻撃の一種です。<br/><br/>攻撃者は、以下の手順で攻撃対象をサービス不能状態に追い込みます。<ol><li>攻撃者は、脆弱性のある複数の公開DNSキャッシュサーバに対して、送信元IPアドレスに攻撃対象を設定したDNSクエリをボットを介して発行する(このとき、応答パケットのサイズができるだけ多くなるようにする)</li><li>クエリを受け取ったDNSキャッシュサーバは、クエリの送信元に設定されている攻撃対象に対して応答パケットを一斉に送信する</li><li>大量の応答パケットを受け取った攻撃対象やそれが属するネットワークは過負荷状態となり正常なサービスの提供ができなくなる</li></ol><div class=\"img_margin\"><img alt=\"07.png/image-size:493×334\" height=\"334\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/07.png\" style=\"max-width: 100%; height: auto;\" width=\"493\"/></div>DNSリフレクタ攻撃では、攻撃の起点として送信元IPアドレスを偽装したパケットを使用します。DNSクエリには 53/UDP が使われますが、UDPは、TCPとは異なりコネクションレスなのでIPアドレスの偽装が容易です。DNSリフレクタ攻撃をはじめとするUDPベースの攻撃は、この性質を悪用しています。<br/><br/>したがって「ア」が正解です。<ul><li class=\"lia\">正しい。</li><li class=\"lii\">SQLインジェクション攻撃は、Webアプリケーションの入力データとしてデータベースへの命令文を構成するデータを与え、Webアプリケーションが想定していないSQL文を意図的に実行させる攻撃です。</li><li class=\"liu\">ディレクトリトラバーサル攻撃は、入力文字列からアクセスするファイル名を組み立てるアプリケーションに対して、上位のディレクトリを意味する文字列(\"../\"など)を使って、非公開のファイルにアクセスする攻撃です。</li><li class=\"lie\">パスワードリスト攻撃は、あるサイトに対する攻撃などによって得られたIDとパスワードのリストを用いて、別のサイトへの不正ログインを試みる攻撃です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_30_aki_q8", "session": "支援士 H30秋", "gap": 12, "num": 8, "topic": "EDSA認証における評価対象と評価項目", "subcat": "セキュリティ技術評価", "category": "情報セキュリティ", "mondai": "EDSA認証における評価対象と評価項目について，適切な組みはどれか。", "mondai_html": "<div id=\"mondai\">EDSA認証における評価対象と評価項目について，適切な組みはどれか。</div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/08.png\" style=\"max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>EDSA認証</strong>(制御機器認証)は、組込み機器のセキュリティ保証に関する認証制度です。PLC、フィールドセンサーデバイス、SISコントローラー、DCSコントローラーなどが本認証の対象となります。<br/><br/>EDSA認証では、次の3点から制御機器の評価を行います。<ul><li>セキュリティ開発ライフサイクルプロセス評価(SDLPA)、組込み機器セキュリティ開発成果物(SDA-E)</li><li>組込み機器機能セキュリティ評価(FSA-E)</li><li>組込み機器ロバストネス試験(ERT)<br/>※組込み機器ロバストネス試験とは、デバイスの堅牢性を評価する試験です。</li></ul>また、評価項目の数によって3段階のセキュリティ保証レベルを規定しています。<div class=\"img_margin\"><img alt=\"08_1.png/image-size:562×400\" height=\"400\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/08_1.png\" style=\"max-width: 100%; height: auto;\" width=\"562\"/></div>EDSA認証は、<em class=\"r\">組込み機器</em>のセキュリティレベルを評価する認証制度であり、どのレベルの認証でも<em class=\"r\">組込み機器ロバストネス試験</em>におけるデバイスの堅牢性を評価項目とします。したがって「ア」が適切な組合せです。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_30_aki_q13", "session": "支援士 H30秋", "gap": 12, "num": 13, "topic": "OSコマンドインジェクション", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "Webアプリケーションの脆弱性を悪用する攻撃手法のうち，Webページ上で入力した文字列がPerlのsystem関数やPHPのexec関数などに渡されることを利用し，不正にシェルスクリプトを実行させるものは，どれに分類されるか。", "mondai_html": "<div id=\"mondai\">Webアプリケーションの脆弱性を悪用する攻撃手法のうち，Webページ上で入力した文字列がPerlのsystem関数やPHPのexec関数などに渡されることを利用し，不正にシェルスクリプトを実行させるものは，どれに分類されるか。</div>", "choices": {"ア": "HTTPヘッダーインジェクション", "イ": "OSコマンドインジェクション", "ウ": "クロスサイトリクエストフォージェリ", "エ": "セッションハイジャック"}, "choices_html": {"ア": "HTTPヘッダーインジェクション", "イ": "OSコマンドインジェクション", "ウ": "クロスサイトリクエストフォージェリ", "エ": "セッションハイジャック"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>OSコマンドインジェクション</strong>は、ユーザーから受け付けた入力値をOSに対する命令文の一部として使用するシステムに対して、OSへ
