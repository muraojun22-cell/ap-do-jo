こで，コントローラーの処理時間は平均シーク時間に含まれるものとする。", "choices": {"ア": "15.1", "イ": "16.0", "ウ": "20.1", "エ": "21.0"}, "ans": "ア", "hist_count": 1, "past_history": ["基本情報技術者 H22秋期 問14"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q11.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">磁気ディスク装置のデータ読取りに要する時間は「①平均シーク時間＋②平均回転待ち時間＋③データ転送時間」で求めます。<dl><dt>①平均シーク時間（シークタイム）</dt><dd>磁気ディスクのヘッドが、目的のデータが保存されている位置まで移動するのにかかる時間の平均</dd><dt>②平均回転待ち時間（サーチタイム）</dt><dd>ヘッドの移動が完了した後、読み出すレコードの先頭が磁気ヘッドの位置まで磁気ディスクが回転してくるのを待つ時間の平均。目的のデータがどの位置に存在するかはランダムなので、ディスクが1回転するのにかかる時間の半分が平均回転待ち時間となる</dd><dt>③データ転送時間</dt><dd>目的のデータを読み出すのに要する時間</dd></dl>この問題では平均シーク時間がわかっているので、平均回転待ち時間とデータ転送時間がわかればデータの読取り時間が計算できることになります。<br/><br/>平均回転待ち時間は、1回転に要する時間の半分なので、<br/><br/>　1分÷6,000回転÷2<br/>＝60,000ミリ秒÷6,000回転÷2<br/>＝5ミリ秒<br/><br/>転送速度が10Mバイト／秒なので、1,000バイトのデータ転送に要する時間は、<br/><br/>　1,000バイト÷10Mバイト＝0.1ミリ秒<br/><br/>以上より、データ読取りに要する時間は、<br/><br/>　10＋5＋0.1＝15.1ミリ秒<br/><br/>したがって「ア」が正解となります。<br/><br/>情報処理技術者試験で磁気ディスク装置のアクセス時間が出題される場合、回転数は4800、5400、6000、7200とほぼ決まった値で出題されます。基準となる6,000回転／分の場合の平均回転待ち時間を覚えておけばスムーズに計算することが可能です。<div class=\"img_margin\"><img alt=\"11a.png/image-size:300×134\" height=\"134\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/11a.png\" style=\"max-width: 100%; height: auto;\" width=\"300\"/></div></div>", "mondai_html": "表に示す仕様の磁気ディスク装置において，1,000バイトのデータの読取りに要する平均時間は何ミリ秒か。ここで，コントローラーの処理時間は平均シーク時間に含まれるものとする。<div class=\"img_margin\"><img alt=\"11.png/image-size:232×77\" height=\"77\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/11.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"232\"/></div>", "choices_html": {"ア": "15.1", "イ": "16.0", "ウ": "20.1", "エ": "21.0"}}, {"id": "03_aki_q17", "session": "R3秋", "gap": 7, "num": 17, "topic": "ページフォールトの許容発生率", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "主記憶へのアクセスを1命令当たり平均2回行い，ページフォールトが発生すると1回当たり40ミリ秒のオーバーヘッドを伴うシステムがある。ページフォールトによる命令実行の遅れを1命令当たり平均0.4マイクロ秒以下にするために許容できるページフォールト発生率は最大幾らか。ここで，ほかのオーバーヘッドは考慮しないものとする。", "choices": {"ア": "5×10-6", "イ": "1×10-5", "ウ": "5×10-5", "エ": "1×10-4"}, "ans": "ア", "hist_count": 1, "past_history": ["ソフトウェア開発技術者 H19秋期 問24"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">仮に、1命令における2回の主記憶へのアクセスの両方でページフォールトが発生した（発生率100%だった）とすると、命令実行の遅れは80ミリ秒になります。この時間を0.4マイクロ秒以下にしたいので、次のような式を立てて条件を満たす発生率(n)を計算します。<br/><br/>　80ミリ秒×n≦0.4マイクロ秒<br/>　80×10<sup>-3</sup>×n≦0.4×10<sup>-6</sup><br/>　n≦<span class=\"frac\"><span>0.4×10<sup>-6</sup></span>80×10<sup>-3</sup></span><br/>　n≦<span class=\"frac\"><span>0.4</span>80</span>×10<sup>-3</sup><br/>　n≦0.005×10<sup>-3</sup>＝5×10<sup>-6</sup><br/><br/>上記の計算から、ページフォールト発生率(n)は<em class=\"r\">5×10<sup>-6</sup></em>以下にすればよいとわかります。したがって「ア」が正解です。</div>", "mondai_html": "主記憶へのアクセスを1命令当たり平均2回行い，ページフォールトが発生すると1回当たり40ミリ秒のオーバーヘッドを伴うシステムがある。ページフォールトによる命令実行の遅れを1命令当たり平均0.4マイクロ秒以下にするために許容できるページフォールト発生率は最大幾らか。ここで，ほかのオーバーヘッドは考慮しないものとする。", "choices_html": {"ア": "5×10<sup>-6</sup>", "イ": "1×10<sup>-5</sup>", "ウ": "5×10<sup>-5</sup>", "エ": "1×10<sup>-4</sup>"}}, {"id": "03_aki_q22", "session": "R3秋", "gap": 7, "num": 22, "topic": "半加算器の論理回路図", "subcat": "ハードウェア", "category": "テクノロジ系", "mondai": "1桁の2進数A，Bを加算し，Xに桁上がり，Yに桁上げなしの和(和の1桁目)が得られる論理回路はどれか。", "choices": {}, "ans": "ア", "hist_count": 1, "past_history": ["応用情報技術者 H30秋期 問23"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">入力A、Bと出力X、Yの適切な関係は次のようになります。<div class=\"img_margin\"><img alt=\"22_1.png/image-size:349×121\" height=\"121\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/22_1.png\" style=\"max-width: 100%; height: auto;\" width=\"349\"/></div>上表を見ると、2つの入力とXの関係はANDの真理値表と一致し、2つの入力とYの関係はXORの真理値表と一致していることに気が付きます。したがって、X＝A AND B、Y＝A XOR B となっている「ア」の論理回路図が正解です。<div class=\"img_margin\"><img alt=\"22_2.png/image-size:160×72\" height=\"72\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/22_2.png\" style=\"max-width: 100%; height: auto;\" width=\"160\"/></div></div>", "mondai_html": "1桁の2進数A，Bを加算し，Xに桁上がり，Yに桁上げなしの和(和の1桁目)が得られる論理回路はどれか。", "choices_html": {"ア": "<img alt=\"22a.png/image-size:163×73\" height=\"73\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/22a.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"163\"/>", "イ": "<img alt=\"22i.png/image-size:162×73\" height=\"73\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/22i.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"162\"/>", "ウ": "<img alt=\"22u.png/image-size:163×74\" height=\"74\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/22u.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"163\"/>", "エ": "<img alt=\"22e.png/image-size:162×74\" height=\"74\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/22e.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"162\"/>"}}, {"id": "03_aki_q27", "session": "R3秋", "gap": 7, "num": 27, "topic": "データベースの障害回復処理", "subcat": "トランザクション処理", "category": "テクノロジ系", "mondai": "データベースの障害回復処理に関する記述のうち，適切なものはどれか。", "choices": {"ア": "異なるトランザクション処理プログラムが，同一データベースを同時更新することによって生じる論理的な矛盾を防ぐために，データのブロック化が必要になる。", "イ": "システムが媒体障害以外のハードウェア障害によって停止した場合，チェックポイントの取得以前に終了したトランザクションについての回復作業は不要である。", "ウ": "データベースの媒体障害に対して，バックアップファイルをリストアした後，ログファイルの更新前情報を使用してデータの回復処理を行う。", "エ": "トランザクション処理プログラムがデータベースの更新中に異常終了した場合には，ログファイルの更新後情報を使用してデータの回復処理を行う。"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 H21秋期 問32"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q27.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">同時更新によるデータの不整合を防ぐためには、トランザクションの排他制御を行います。</li><li class=\"lii\">正しい。DBMSは、ディスクに対する入出力効率を向上させるために、トランザクションの更新をメモリ上のバッファとログファイルに記憶しておき、一定の間隔ごとにまとめてディスクに反映させるという方式をとっています。このディスクと同期を取るタイミングをチェックポイントといいます。チェックポイントまでのトランザクションはディスクに反映済みなので、媒体障害以外の障害（システム障害やトランザクション障害）のときにはチェックポイント以前にコミットしたトランザクションについて回復作業は行う必要はありません。</li><li class=\"liu\">媒体障害が発生したときには、バックアップファイルを用いてバックアップ時点の状態にした後に、更新<em class=\"r\">後</em>ログを使用してコミット済トランザクションをデータベースに適用するロールフォワードを行います。</li><li class=\"lie\">トランザクション障害が発生したときには、更新<em class=\"r\">前</em>ログを使用してデータベースをトランザクション以前の状態に戻すロールバックを行います。</li></ul></div>", "mondai_html": "データベースの障害回復処理に関する記述のうち，適切なものはどれか。", "choices_html": {"ア": "異なるトランザクション処理プログラムが，同一データベースを同時更新することによって生じる論理的な矛盾を防ぐために，データのブロック化が必要になる。", "イ": "システムが媒体障害以外のハードウェア障害によって停止した場合，チェックポイントの取得以前に終了したトランザクションについての回復作業は不要である。", "ウ": "データベースの媒体障害に対して，バックアップファイルをリストアした後，ログファイルの更新前情報を使用してデータの回復処理を行う。", "エ": "トランザクション処理プログラムがデータベースの更新中に異常終了した場合には，ログファイルの更新後情報を使用してデータの回復処理を行う。"}}, {"id": "03_aki_q34", "session": "R3秋", "gap": 7, "num": 34, "topic": "UDPヘッダーになくTCPヘッダーにある情報", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "UDPのヘッダーフィールドにはないが，TCPのヘッダーフィールドには含まれる情報はどれか。", "choices": {"ア": "宛先ポート番号", "イ": "シーケンス番号", "ウ": "送信元ポート番号", "エ": "チェックサム"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 R7秋期 問33"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q34.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">TCPヘッダーとUDPヘッダーの構造は以下のようになっています。TCPは信頼性の高い通信を提供するためのプロトコルのため様々なフィールドがありますが、UDPは軽量かつリアルタイム性を重視した通信を提供するプロトコルのため非常に単純な構造です。<div class=\"img_margin\"><img alt=\"34.png/image-size:480×344\" height=\"344\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/34.png\" style=\"max-width: 100%; height: auto;\" width=\"480\"/></div>宛先／送信元ポート番号、チェックサムは両方にありますが、「シーケンス番号」はTCPのみにあり、UDPにはありません。シーケンス番号は送信したデータの位置を示す情報で、順序保証や再送制御などを行うTCPでは必要な情報ですが、届けるだけのUDPでは不要な情報だからです。<br/><br/>したがって「イ」が正解となります。</div>", "mondai_html": "UDPのヘッダーフィールドにはないが，TCPのヘッダーフィールドには含まれる情報はどれか。", "choices_html": {"ア": "宛先ポート番号", "イ": "シーケンス番号", "ウ": "送信元ポート番号", "エ": "チェックサム"}}, {"id": "03_aki_q39", "session": "R3秋", "gap": 7, "num": 39, "topic": "否認防止の特性に関する記述", "subcat": "情報セキュリティ", "category": "テクノロジ系", "mondai": "JIS Q 27000:2019(情報セキュリティマネジメントシステム－用語)において定義されている情報セキュリティの特性に関する記述のうち，否認防止の特性に関する記述はどれか。", "choices": {"ア": "ある利用者があるシステムを利用したという事実が証明可能である。", "イ": "認可された利用者が要求したときにアクセスが可能である。", "ウ": "認可された利用者に対してだけ，情報を使用させる又は開示する。", "エ": "利用者の行動と意図した結果とが一貫性をもつ。"}, "ans": "ア", "hist_count": 1, "past_history": ["情報セキュマネ H29秋期 問11"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q39.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>否認防止</strong>(Non-Repudiation)は、情報セキュリティマネジメントの付加的な要素で、行った操作や発生した事象を後になって否認されないように証明できる能力のことです。ログの取得で必要な項目を確実に記録するとともに、完全性が損なわれないように保管することで確保できます。デジタル署名やタイムスタンプは否認防止に活用される技術です。<br/>JIS Q 27000では「主張された事象又は処理の発生、及びそれを引き起こしたエンティティを証明する能力」と定義されています。<ul><li class=\"lia\">正しい。否認防止の説明です。</li><li class=\"lii\">可用性の説明です。</li><li class=\"liu\">機密性の説明です。</li><li class=\"lie\">信頼性の説明です。</li></ul></div>", "mondai_html": "JIS Q 27000:2019(情報セキュリティマネジメントシステム－用語)において定義されている情報セキュリティの特性に関する記述のうち，否認防止の特性に関する記述はどれか。", "choices_html": {"ア": "ある利用者があるシステムを利用したという事実が証明可能である。", "イ": "認可された利用者が要求したときにアクセスが可能である。", "ウ": "認可された利用者に対してだけ，情報を使用させる又は開示する。", "エ": "利用者の行動と意図した結果とが一貫性をもつ。"}}, {"id": "03_haru_q20", "session": "R3春", "gap": 8, "num": 20, "topic": "Hadoopの説明はどれか", "subcat": "ミドルウェア", "category": "テクノロジ系", "mondai": "Hadoopの説明はどれか。", "choices": {"ア": "JavaEE仕様に準拠したアプリケーションサーバ", "イ": "LinuxやWindowsなどの様々なプラットフォーム上で動作するWebサーバ", "ウ": "機能の豊富さが特徴のRDBMS", "エ": "大規模なデータセットを分散処理するためのソフトウェアライブラリ"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H29秋期 問19"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>Hadoop</strong>(ハドゥープ)は、ペタバイト級の大規模データの蓄積・処理の<em class=\"r\">分散処理</em>を実現するミドルウェアです。Googleが論文として発表した分散処理フレームワーク「MapReduce」および分散ファイルシステム「Google File System」を基盤技術に、オープンソースとしてJavaで実装したものです。分散ファイルシステムのHDFS(Hadoop Distributed File System)と、分散処理のフレームワークであるHadoop MapReduceの2つから構成されます。<div class=\"img_margin\"><img alt=\"20.png/image-size:347×83\" height=\"83\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/20.png\" style=\"max-width: 100%; height: auto;\" width=\"347\"/></div>したがって「エ」が適切な説明です。<ul><li class=\"lia\">WildFlyの説明です。</li><li class=\"lii\">ApacheやNginxなどの説明です。</li><li class=\"liu\">PostgreSQLなどの説明です。</li><li class=\"lie\">正しい。Hadoopは大規模なデータの分散処理基盤を提供するソフトウェアライブラリです。</li></ul></div>", "mondai_html": "Hadoopの説明はどれか。", "choices_html": {"ア": "JavaEE仕様に準拠したアプリケーションサーバ", "イ": "LinuxやWindowsなどの様々なプラットフォーム上で動作するWebサーバ", "ウ": "機能の豊富さが特徴のRDBMS", "エ": "大規模なデータセットを分散処理するためのソフトウェアライブラリ"}}, {"id": "03_haru_q34", "session": "R3春", "gap": 8, "num": 34, "topic": "ホストアドレスを求める式はどれか", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "IPv4ネットワークで使用されるIPアドレスaとサブネットマスクmからホストアドレスを求める式はどれか。ここで，\"～\"はビット反転の演算子，\"｜\"はビットごとの論理和の演算子，\"＆\"はビットごとの論理積の演算子を表し，ビット反転の演算子の優先順位は論理和，論理積の演算子よりも高いものとする。", "choices": {"ア": "～a＆m", "イ": "～a｜m", "ウ": "a＆～m", "エ": "a｜～m"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 H27秋期 問34"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q34.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">サブネットマスクはネットワーク部のビットが「1」、ホストアドレス部が「0」になっているビット列です。通常サブネットマスクはネットワークアドレスを取り出すために使用されますが、このビットを反転させると逆にホストアドレス部を取り出すためのビットマスクとなることがわかります。<br/><br/>あるビット列から特定範囲のビットを取り出すには、取り出す位置のビットを「1」としたビットマスクとの論理積(AND)をとるので、ホストアドレス部を取り出すためにはサブネットマスクを反転させたビット列とIPアドレスの論理積を求めます。<br/><br/>IPアドレスが「a」、サブネット(m)を反転させたものが「～m」、論理積が「＆」なので、正しい式は「a＆～m」です。<div class=\"img_margin\"><img alt=\"34.png/image-size:416×400\" height=\"400\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/34.png\" style=\"max-width: 100%; height: auto;\" width=\"416\"/></div></div>", "mondai_html": "IPv4ネットワークで使用されるIPアドレスaとサブネットマスクmからホストアドレスを求める式はどれか。ここで，\"～\"はビット反転の演算子，\"｜\"はビットごとの論理和の演算子，\"＆\"はビットごとの論理積の演算子を表し，ビット反転の演算子の優先順位は論理和，論理積の演算子よりも高いものとする。", "choices_html": {"ア": "～a＆m", "イ": "～a｜m", "ウ": "a＆～m", "エ": "a｜～m"}}, {"id": "03_haru_q35", "session": "R3春", "gap": 8, "num": 35, "topic": "SDNの説明はどれか", "subcat": "ネットワーク管理", "category": "テクノロジ系", "mondai": "ONF(Open Networking Foundation)が標準化を進めているOpenFlowプロトコルを用いたSDN(Software-Defined Networking)の説明として，適切なものはどれか。", "choices": {"ア": "管理ステーションから定期的にネットワーク機器のMIB(Management Information Base)情報を取得して，稼働監視や性能管理を行うためのネットワーク管理手法", "イ": "データ転送機能をもつネットワーク機器同士が経路情報を交換して，ネットワーク全体のデータ転送経路を決定する方式", "ウ": "ネットワーク制御機能とデータ転送機能を実装したソフトウェアを，仮想環境で利用するための技術", "エ": "ネットワーク制御機能とデータ転送機能を論理的に分離し，コントローラーと呼ばれるソフトウェアで，データ転送機能をもつネットワーク機器の集中制御を可能とするアーキテクチャ"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H29秋期 問35"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q35.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SDN</strong>(Software-Defined Networking)は、ソフトウェア制御によって物理的なネットワーク構成にとらわれない動的で柔軟なネットワークを実現する技術全般を意味します。<br/><br/>SDNを実現するための技術標準が<strong>OpenFlow</strong>プロトコルであり、既存のネットワーク機器がもつ制御処理(コントロールプレーン)と転送処理(データプレーン)を分離することで、OpenFlowコントローラーが中央集権的に複数のスイッチの転送制御を管理します。OpenFlowではパケットやフレームをフローとして扱い、フローの様々な情報を使って柔軟に転送制御できるようになっています。スイッチはOpenFlowコントローラーと通信を行いながら、OpenFlowコントローラーから提供されるフローテーブルや直接の転送指示により転送先を判断します。<div class=\"img_margin\"><img alt=\"35.png/image-size:341×190\" height=\"190\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/35.png\" style=\"max-width: 100%; height: auto;\" width=\"341\"/></div><ul><li class=\"lia\">SNMP(Simple Network Management Protocol)の説明です。</li><li class=\"lii\">従来のルーティングの仕組みです。</li><li class=\"liu\">ネットワーク仮想化(VNF:Virtual Network Function)の説明です。</li><li class=\"lie\">正しい。SDNの説明です。</li></ul></div>", "mondai_html": "ONF(Open Networking Foundation)が標準化を進めているOpenFlowプロトコルを用いたSDN(Software-Defined Networking)の説明として，適切なものはどれか。", "choices_html": {"ア": "管理ステーションから定期的にネットワーク機器のMIB(Management Information Base)情報を取得して，稼働監視や性能管理を行うためのネットワーク管理手法", "イ": "データ転送機能をもつネットワーク機器同士が経路情報を交換して，ネットワーク全体のデータ転送経路を決定する方式", "ウ": "ネットワーク制御機能とデータ転送機能を実装したソフトウェアを，仮想環境で利用するための技術", "エ": "ネットワーク制御機能とデータ転送機能を論理的に分離し，コントローラーと呼ばれるソフトウェアで，データ転送機能をもつネットワーク機器の集中制御を可能とするアーキテクチャ"}}, {"id": "03_haru_q42", "session": "R3春", "gap": 8, "num": 42, "topic": "JPCERT/CCの説明はどれか", "subcat": "情報セキュリティ管理", "category": "テクノロジ系", "mondai": "JPCERTコーディネーションセンターの説明はどれか。", "choices": {"ア": "産業標準化法に基づいて経済産業省に設置されている審議会であり，産業標準化全般に関する調査・審議を行っている。", "イ": "電子政府推奨暗号の安全性を評価・監視し，暗号技術の適切な実装法・運用法を調査・検討するプロジェクトであり，総務省及び経済産業省が共同で運営する暗号技術検討会などで構成される。", "ウ": "特定の政府機関や企業から独立した組織であり，国内のコンピュータセキュリティインシデントに関する報告の受付，対応の支援，発生状況の把握，手口の分析，再発防止策の検討や助言を行っている。", "エ": "内閣官房に設置され，我が国をサイバー攻撃から防衛するための司令塔機能を担う組織である。"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 H27春期 問40"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q42.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>JPCERTコーディネーションセンター</strong>(JPCERT/CC)は、インターネットを介して発生する侵入やサービス妨害等のコンピュータセキュリティインシデントについて、日本国内のサイトに関する報告の受け付け、対応の支援、発生状況の把握、手口の分析、再発防止のための対策の検討や助言などを、技術的な立場から行なっています。<br/>特定の政府機関や企業からは独立した中立の組織として、日本における情報セキュリティ対策活動の向上に積極的に取り組んでいます。<br/><br/>引用元:JPCERTコーディネーションセンター「JPCERT/CCについて」<br/>https://www.jpcert.or.jp/about/<ul><li class=\"lia\">日本産業標準調査会(JISC)の説明です。</li><li class=\"lii\">CRYPTRECの説明です。</li><li class=\"liu\">正しい。JPCERT/CCの説明です。</li><li class=\"lie\">国家サイバー統括室(NCO)の説明です。</li></ul></div>", "mondai_html": "JPCERTコーディネーションセンターの説明はどれか。", "choices_html": {"ア": "産業標準化法に基づいて経済産業省に設置されている審議会であり，産業標準化全般に関する調査・審議を行っている。", "イ": "電子政府推奨暗号の安全性を評価・監視し，暗号技術の適切な実装法・運用法を調査・検討するプロジェクトであり，総務省及び経済産業省が共同で運営する暗号技術検討会などで構成される。", "ウ": "特定の政府機関や企業から独立した組織であり，国内のコンピュータセキュリティインシデントに関する報告の受付，対応の支援，発生状況の把握，手口の分析，再発防止策の検討や助言を行っている。", "エ": "内閣官房に設置され，我が国をサイバー攻撃から防衛するための司令塔機能を担う組織である。"}}, {"id": "03_haru_q44", "session": "R3春", "gap": 8, "num": 44, "topic": "セッションハイジャック対策", "subcat": "セキュリティ実装技術", "category": "テクノロジ系", "mondai": "Webシステムにおいて，セッションの乗っ取りの機会を減らすために，利用者のログアウト時にWebサーバ又はWebブラウザにおいて行うべき処理はどれか。ここで，利用者は自分専用のPCにおいて，Webブラウザを利用しているものとする。", "choices": {"ア": "WebサーバにおいてセッションIDを内蔵ストレージに格納する。", "イ": "WebサーバにおいてセッションIDを無効にする。", "ウ": "WebブラウザにおいてキャッシュしているWebページをクリアする。", "エ": "WebブラウザにおいてセッションIDを内蔵ストレージに格納する。"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 H30春期 問43"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q44.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">IPAで公開されているセキュアプログラミング講座では、セッション乗っ取りの機会を低減させるための予防策として「セッションタイムアウト」と「明示的なログアウト機能」を挙げています。<dl><dt>セッションタイムアウト</dt><dd>Webアプリケーションにはセッションタイムアウト機能を設ける。ユーザーはログアウト操作をすることを忘れてしまうことがある。</dd><dt>明示的なログアウトの機能</dt><dd>Webアプリケーションには明示的なログアウトの機能を設ける。できれば、各ページでログアウト操作が行えると良い。</dd></dl>そして利用者がログアウトを要求した場面では、Webアプリケーションは次のような操作を行うべきとしています。<ul><li>Webサーバ側でセッションIDを確実に無効にする。その後同じセッションIDがクライアントから送られてきても受け付けない</li><li>Webブラウザ側のセッションIDを消去する</li></ul>一般的なWebページのセッション管理方式では、WebブラウザとWebサーバでセッションIDを共有することで同じ利用者かどうかを判断しています。セッションIDさえ一致すれば、第三者からのアクセスを正規のアクセスとして判断してしまう可能性があるということですから、不要なセッションIDを有効なままにしておくのはセキュリティ上のリスクになります。<br/>セッションIDを必要とするのはログイン中だけですから、ログアウトが要求された（セッションIDが不要になった）時点でWebサーバ側（可能であればWebブラウザも）のセッションIDを無効化し、それ以降は無効化されたセッションIDを拒否することで、セッション乗っ取りの機会を最小限に減らせます。<br/><br/>したがって適切な処理は「イ」です。</div>", "mondai_html": "Webシステムにおいて，セッションの乗っ取りの機会を減らすために，利用者のログアウト時にWebサーバ又はWebブラウザにおいて行うべき処理はどれか。ここで，利用者は自分専用のPCにおいて，Webブラウザを利用しているものとする。", "choices_html": {"ア": "WebサーバにおいてセッションIDを内蔵ストレージに格納する。", "イ": "WebサーバにおいてセッションIDを無効にする。", "ウ": "WebブラウザにおいてキャッシュしているWebページをクリアする。", "エ": "WebブラウザにおいてセッションIDを内蔵ストレージに格納する。"}}, {"id": "03_aki_q55", "session": "R3秋", "gap": 7, "num": 55, "topic": "バックアップに必要な媒体数", "subcat": "サービスの運用", "category": "マネジメント系", "mondai": "次の処理条件で磁気ディスクに保存されているファイルを磁気テープにバックアップするとき，バックアップの運用に必要な磁気テープは最少で何本か。 〔処理条件〕 毎月初日(1日)にフルバックアップを取る。フルバックアップは1本の磁気テープに1回分を記録する。 フルバックアップを取った翌日から次のフルバックアップを取るまでは，毎日，差分バックアップを取る。差分バックアップは，差分バックアップ用としてフルバックアップとは別の磁気テープに追記録し，1本に1カ月分を記録する。 常に6か月前の同一日までのデータについて，指定日の状態にファイルを復元できるようにする。ただし，6か月前の月に同一日が存在しない場合は，当該月の末日までのデータについて，指定日の状態にファイルを復元できるようにする (例：本日が10月31日の場合は，4月30日までのデータについて，指定日の状態にファイルを復元できるようにする)。", "choices": {"ア": "12", "イ": "13", "ウ": "14", "エ": "15"}, "ans": "ウ", "hist_count": 4, "past_history": ["応用情報技術者 H22秋期 問56", "応用情報技術者 H28秋期 問57", "応用情報技術者 H31春期 問56", "基本情報技術者 H17秋期 問50"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q55.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">設問の例「10月31日の場合は、4月30日までのデータについて、指定日の状態にファイルを復元できるようにする」ために何本の磁気テープが必要かを考えます。<br/><br/>差分バックアップ方式ではフルバックアップの適用後、差分バックアップを使ってフルバックアップ以後の変更箇所を反映することで復元を行います。このため指定日の状態に復元するためには、指定日の属する月の初日に取ったフルバックアップと、その月の毎日の差分を記録した差分バックアップの2つが必要となります。各月フル用と差分用で2本の磁気テープが必要であり、4月、5月、…、10月までには全部で7つの月が存在するので、必要となる磁気テープ数は「2本×7月＝<em class=\"r\">14本</em>」となります。<br/><br/>したがって「ウ」が正解です。</div>", "mondai_html": "次の処理条件で磁気ディスクに保存されているファイルを磁気テープにバックアップするとき，バックアップの運用に必要な磁気テープは最少で何本か。<br/><br/>〔処理条件〕<ul><li class=\"li1\">毎月初日(1日)にフルバックアップを取る。フルバックアップは1本の磁気テープに1回分を記録する。</li><li class=\"li2\">フルバックアップを取った翌日から次のフルバックアップを取るまでは，毎日，差分バックアップを取る。差分バックアップは，差分バックアップ用としてフルバックアップとは別の磁気テープに追記録し，1本に1カ月分を記録する。</li><li class=\"li3\">常に6か月前の同一日までのデータについて，指定日の状態にファイルを復元できるようにする。ただし，6か月前の月に同一日が存在しない場合は，当該月の末日までのデータについて，指定日の状態にファイルを復元できるようにする (例：本日が10月31日の場合は，4月30日までのデータについて，指定日の状態にファイルを復元できるようにする)。</li></ul>", "choices_html": {"ア": "12", "イ": "13", "ウ": "14", "エ": "15"}}, {"id": "03_haru_q59", "session": "R3春", "gap": 8, "num": 59, "topic": "マスタファイル管理に関する監査", "subcat": "システム監査", "category": "マネジメント系", "mondai": "マスタファイル管理に関するシステム監査項目のうち，可用性に該当するものはどれか。", "choices": {"ア": "マスタファイルが置かれているサーバを二重化し，耐障害性の向上を図っていること", "イ": "マスタファイルのデータを複数件まとめて検索・加工するための機能が，システムに盛り込まれていること", "ウ": "マスタファイルのメンテナンスは，特権アカウントを付与された者だけに許されていること", "エ": "マスタファイルへのデータ入力チェック機能が，システムに盛り込まれていること"}, "ans": "ア", "hist_count": 4, "past_history": ["応用情報技術者 H27春期 問59", "応用情報技術者 H30春期 問60", "基本情報技術者 H22春期 問59", "基本情報技術者 H24秋期 問60"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q59.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>可用性</strong>(Availability)とは、情報セキュリティマネジメントの概念の一要素で、障害が発生しても安定したサービスを提供でき、ユーザーが必要な時にシステムを利用可能である特性を示します。可用性は、ハードウェアやソフトウェアの障害を未然に防ぐ施策の実施や、修理時間の短縮、機器の冗長化を行うことで高まります。<ul><li class=\"lia\">正しい。障害が起きてもサービスの提供を維持できるような対策が実施されているかどうかが、可用性の監査項目になります。</li><li class=\"lii\">効率性に該当する項目です。</li><li class=\"liu\">機密性に該当する項目です。</li><li class=\"lie\">完全性に該当する項目です。</li></ul></div>", "mondai_html": "マスタファイル管理に関するシステム監査項目のうち，可用性に該当するものはどれか。", "choices_html": {"ア": "マスタファイルが置かれているサーバを二重化し，耐障害性の向上を図っていること", "イ": "マスタファイルのデータを複数件まとめて検索・加工するための機能が，システムに盛り込まれていること", "ウ": "マスタファイルのメンテナンスは，特権アカウントを付与された者だけに許されていること", "エ": "マスタファイルへのデータ入力チェック機能が，システムに盛り込まれていること"}}, {"id": "04_aki_q53", "session": "R4秋", "gap": 5, "num": 53, "topic": "スケジュール管理", "subcat": "プロジェクトの時間", "category": "マネジメント系", "mondai": "あるシステムの設計から結合テストまでの作業について，開発工程ごとの見積工数を表1に，開発工程ごとの上級技術者と初級技術者の要員割当てを表2に示す。上級技術者は，初級技術者に比べて，プログラム作成・単体テストにおいて2倍の生産性を有する。表1の見積工数は，上級技術者の生産性を基に算出している。 全ての開発工程に対して，上級技術者を1人追加して割り当てると，この作業に要する期間は何か月短縮できるか。ここで，開発工程の期間は重複させないものとし，要員全員が1カ月当たり1人月の工数を投入するものとする。", "choices": {"ア": "1", "イ": "2", "ウ": "3", "エ": "4"}, "ans": "エ", "hist_count": 3, "past_history": ["応用情報技術者 H23特別 問52", "応用情報技術者 H27春期 問53", "ソフトウェア開発技術者 H15春期 問58"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q53.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">追加要員を加える前と後で、工程ごとに作業完了に要する期間を求めて比較します。「表1の見積工数は，上級技術者の生産性を基にしている」及びプログラム作成・単体テスト工程において「上級技術者は、初級技術者の2倍の生産性である」という条件があるので、プログラム作成・単体テスト工程だけは初級技術者1人を0.5人として計算します。<br/><br/>[要員追加前]<br/>設計 … 6人月÷2人＝3か月<br/>プログラム作成・単体テスト … 12人月÷(2人＋(2人×0.5))＝12人月÷3人＝4か月<br/>結合テスト … 12人月÷2人＝6か月<br/><br/>要員の追加前の開発期間は「3＋4＋6＝<u>13か月</u>」です。<br/><br/>[上級技術者1人追加後]<br/>設計 … 6人月÷3人＝2か月<br/>プログラム作成・単体テスト … 12人月÷(3人＋(2人×0.5))＝12人月÷4人＝3か月<br/>結合テスト … 12人月÷3人＝4か月<br/><br/>要員の追加後の開発期間は「2＋3＋4＝<u>9カ月</u>」です。<br/><br/>よって、各工程に上級技術者を1人追加することで短縮できる期間は、<br/><br/>　13カ月－9カ月＝<em class=\"r\">4カ月</em><br/><br/>したがって「エ」が正解です。</div>", "mondai_html": "あるシステムの設計から結合テストまでの作業について，開発工程ごとの見積工数を表1に，開発工程ごとの上級技術者と初級技術者の要員割当てを表2に示す。上級技術者は，初級技術者に比べて，プログラム作成・単体テストにおいて2倍の生産性を有する。表1の見積工数は，上級技術者の生産性を基に算出している。<br/>全ての開発工程に対して，上級技術者を1人追加して割り当てると，この作業に要する期間は何か月短縮できるか。ここで，開発工程の期間は重複させないものとし，要員全員が1カ月当たり1人月の工数を投入するものとする。<div class=\"img_margin\"><img alt=\"53.png/image-size:505×188\" height=\"188\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/53.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"505\"/></div>", "choices_html": {"ア": "1", "イ": "2", "ウ": "3", "エ": "4"}}, {"id": "04_aki_q59", "session": "R4秋", "gap": 5, "num": 59, "topic": "監査手続はどれか", "subcat": "システム監査", "category": "マネジメント系", "mondai": "システム監査における\"監査手続\"として，最も適切なものはどれか。", "choices": {"ア": "監査計画の立案や監査業務の進捗管理を行うための手順", "イ": "監査結果を受けて，監査報告書に監査人の結論や指摘事項を記述する手順", "ウ": "監査項目について，十分かつ適切な証拠を入手するための手順", "エ": "監査テーマに合わせて，監査チームを編成する手順"}, "ans": "ウ", "hist_count": 3, "past_history": ["応用情報技術者 R7春期 問59", "応用情報技術者 H22秋期 問58", "応用情報技術者 H31春期 問58"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q59.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>監査手続</strong>とは、システム監査人が監査意見を裏付けるための十分かつ適切な<em class=\"m\">監査証拠を入手するために実施する手続</em>のことです。予備調査と本調査に分けて実施されます。<br/><br/>監査手続に際しては、チェックリスト法、ドキュメントレビュー法、インタビュー法、突合・照合法、現場調査法、コンピュータ支援監査技法などがあり、一般的には複数の手法を組み合わせて実施します。監査手続で入手した監査証拠は、システム監査報告書に記載する監査結論の裏付けとなります。<br/><br/>したがって正解は「ウ」です。<ul><li class=\"lia\">\"監査計画の策定\"に該当します。</li><li class=\"lii\">\"監査報告書の作成\"に該当します。</li><li class=\"liu\">正しい。監査手続は、監査の結論を裏付けるための監査証拠を入手するプロセスです。</li><li class=\"lie\">\"監査業務の体制構築\"に該当します。</li></ul></div>", "mondai_html": "システム監査における\"監査手続\"として，最も適切なものはどれか。", "choices_html": {"ア": "監査計画の立案や監査業務の進捗管理を行うための手順", "イ": "監査結果を受けて，監査報告書に監査人の結論や指摘事項を記述する手順", "ウ": "監査項目について，十分かつ適切な証拠を入手するための手順", "エ": "監査テーマに合わせて，監査チームを編成する手順"}}, {"id": "04_haru_q51", "session": "R4春", "gap": 6, "num": 51, "topic": "アーンドバリューマネジメント", "subcat": "プロジェクトの時間", "category": "マネジメント系", "mondai": "ある組織では，プロジェクトのスケジュールとコストの管理にアーンドバリューマネジメントを用いている。期間10日間のプロジェクトの，5日目の終了時点の状況は表のとおりである。この時点でのコスト効率が今後も続くとしたとき，完成時総コスト見積り(EAC)は何万円か。", "choices": {"ア": "110", "イ": "120", "ウ": "135", "エ": "150"}, "ans": "エ", "hist_count": 3, "past_history": ["応用情報技術者 H21秋期 問51", "応用情報技術者 H29春期 問51", "応用情報技術者 H31春期 問52"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q51.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>アーンドバリューマネジメント</strong>(EVM:Earned Value Management)は、プロジェクトにおける作業を金銭の価値に置き換えて定量的に実績管理をする進捗管理手法で、PV、EV、ACという3つの指標を用いることが特徴です。<dl><dt>PV（Planned Value）</dt><dd>プロジェクト開始当初、現時点までに計画されていた作業に対する予算</dd><dt>EV（Earned Value）</dt><dd>現時点までに完了した作業に割り当てられていた予算</dd><dt>AC（Actual Cost）</dt><dd>現時点までに完了した作業に対して実際に投入した総コスト</dd></dl>各指標を比較して、EV－ACがマイナス値であれば完了済み作業に対する予算よりも投入コストが多いのでコスト超過、EV－PVがマイナス値であれば完了済み作業に対する予算が当初の予算よりも少ないので進捗遅れ、と判断することができます。<br/><br/><strong>完成時総コスト見積り</strong>(EAC:Estimate At Completion)は、完了済作業に要した総コスト(AC)に残作業に要するコスト(ETC:Estimate To Complete)を足した、プロジェクト終了時の総コストの予測値です。<br/>設問の事例では、5日目終了時点で、EV(完了済み作業に対する予算)40万円の作業に対してAC(実コスト)60万円となっていて、プロジェクト予算の1.5倍の実コストが発生しています。このため現状のコスト効率が完成時まで続くならば、完成時総コスト見積り(EAC)は表にある完成時総予算100万円の1.5倍である<em class=\"r\">150</em>万円になると見込めます。よって「エ」が正解です。<br/><br/>なお、EVMには完成時総コスト見積り(EAC)を求める公式があるため、厳密にはこれに従って計算します。<br/><br/>　完成時総コスト見積り(EAC)＝AC＋ETC<br/>　残作業のコスト見積り(ETC)＝(BAC－EV)÷CPI<br/>　コスト効率指数(CPI)＝EV÷AC<br/><br/>設問では、BAC＝100万円、EV＝40万円、AC＝60万円なので、<br/><br/>　BAC＝100万円<br/>　CPI＝EV÷AC＝40÷60＝2／3<br/>　ETC＝(100－40)÷2／3＝90万円<br/>　EAC＝60＋90＝150万円<br/><br/>また、この設問の事例のように現時点までのコスト効率がプロジェクト終了まで続くのであれば、「EAC＝BAC÷CPI」で単純に求められるので、<br/><br/>　CPI＝40÷60＝2／3<br/>　EAC＝100÷2／3＝150万円</div>", "mondai_html": "ある組織では，プロジェクトのスケジュールとコストの管理にアーンドバリューマネジメントを用いている。期間10日間のプロジェクトの，5日目の終了時点の状況は表のとおりである。この時点でのコスト効率が今後も続くとしたとき，完成時総コスト見積り(EAC)は何万円か。<div class=\"img_margin\"><img alt=\"51.png/image-size:281×150\" height=\"150\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/51.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"281\"/></div>", "choices_html": {"ア": "110", "イ": "120", "ウ": "135", "エ": "150"}}, {"id": "04_haru_q57", "session": "R4春", "gap": 6, "num": 57, "topic": "データ管理者の役割", "subcat": "サービスの運用", "category": "マネジメント系", "mondai": "基幹業務システムの構築及び運用において，データ管理者(DA)とデータベース管理者(DBA)を別々に任命した場合のDAの役割として，適切なものはどれか。", "choices": {"ア": "業務データ量の増加傾向を把握し，ディスク装置の増設などを計画して実施する。", "イ": "システム開発の設計工程では，主に論理データベース設計を行い，データ項目を管理して標準化する。", "ウ": "システム開発のテスト工程では，主にパフォーマンスチューニングを担当する。", "エ": "システム障害が発生した場合には，データの復旧や整合性のチェックなどを行う。"}, "ans": "イ", "hist_count": 3, "past_history": ["応用情報技術者 H21秋期 問55", "応用情報技術者 H23特別 問56", "ソフトウェア開発技術者 H19春期 問48"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q57.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>データ管理者</strong>（DA）と<strong>データベース管理者</strong>（DBA）は、データベースの管理を専門的に扱う職種です。<dl><dt>データ管理者（DA:Data Administrator）</dt><dd>業務の実世界から概念設計、システム化の範囲で論理設計などデータそのものの管理を行う。</dd><dt>データベース管理者（DBA:DataBase Administrator）</dt><dd>DAが設計した論理データモデルから物理設計を行い、データベースを構築したり、構築後のデータベースの運用設計および運用保守などデータベースの管理を行う。</dd></dl>選択肢の中では、「主に論理データベース設計を行い」という部分から「イ」がデータ管理者(DA)の役割であることがわかります。その他の選択肢はデータベース管理者(DBA)の役割です。</div>", "mondai_html": "基幹業務システムの構築及び運用において，データ管理者(DA)とデータベース管理者(DBA)を別々に任命した場合のDAの役割として，適切なものはどれか。", "choices_html": {"ア": "業務データ量の増加傾向を把握し，ディスク装置の増設などを計画して実施する。", "イ": "システム開発の設計工程では，主に論理データベース設計を行い，データ項目を管理して標準化する。", "ウ": "システム開発のテスト工程では，主にパフォーマンスチューニングを担当する。", "エ": "システム障害が発生した場合には，データの復旧や整合性のチェックなどを行う。"}}, {"id": "04_haru_q58", "session": "R4春", "gap": 6, "num": 58, "topic": "事業継続計画(BCP)についての監査", "subcat": "システム監査", "category": "マネジメント系", "mondai": "事業継続計画(BCP)について監査を実施した結果，適切な状況と判断されるものはどれか。", "choices": {"ア": "従業員の緊急連絡先リストを作成し，最新版に更新している。", "イ": "重要書類は複製せずに，1か所で集中保管している。", "ウ": "全ての業務について，優先順位なしに同一水準のBCPを策定している。", "エ": "平時にはBCPを従業員に非公開としている。"}, "ans": "ア", "hist_count": 3, "past_history": ["応用情報技術者 H24秋期 問58", "応用情報技術者 H27春期 問60", "基本情報技術者 H28秋期 問60"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q58.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>BCP</strong>(Business Continuity Plan)は、予期せぬ重大災害が発生した場合に、必要最低限の事業を継続しつつ、業務を早期に復旧・再開できるようにするための行動計画です。事業継続計画(BCP)の監査では、中小企業庁の「中小企業BCP策定運用指針」や経済産業省の「事業継続計画策定ガイドライン」を判断の尺度として使うことができます。<ul><li class=\"lia\">正しい。緊急連絡網の構築は、災害発生後に迅速に行動を開始するための情報伝達手段として必要です。よって、適切な状況です。</li><li class=\"lii\">企業の存続に関わる文書や代替情報が他に求められない文書(バイタルレコードと呼ばれる)は、複製化や分散管理を行い緊急時にすぐに参照できるようにする必要があります。</li><li class=\"liu\">通常、災害により何らかの被害が発生すれば、すべての業務を行うことは困難となるため、重要な業務から優先順位をつけて継続するように策定することが実践的です。</li><li class=\"lie\">事業継続を実践するためには、経営者をはじめとする全従業員が事業継続の重要性を共通の認識として持つこと、つまり「文化」として定着していることが大切です。こういった観点からも平時から教育・訓練を継続的に実施する必要があります。</li></ul></div>", "mondai_html": "事業継続計画(BCP)について監査を実施した結果，適切な状況と判断されるものはどれか。", "choices_html": {"ア": "従業員の緊急連絡先リストを作成し，最新版に更新している。", "イ": "重要書類は複製せずに，1か所で集中保管している。", "ウ": "全ての業務について，優先順位なしに同一水準のBCPを策定している。", "エ": "平時にはBCPを従業員に非公開としている。"}}, {"id": "05_haru_q53", "session": "R5春", "gap": 4, "num": 53, "topic": "プロジェクトの進捗管理", "subcat": "プロジェクトの時間", "category": "マネジメント系", "mondai": "過去のプロジェクトの開発実績に基づいて構築した作業配分モデルがある。システム要件定義からシステム内部設計までをモデルどおりに228日で完了し，プログラム開発を開始した。現在，200本のプログラムのうち100本のプログラムの開発を完了し，残り100本は未着手の状況である。プログラム開発以降もモデルどおりに進捗すると仮定するとき，プロジェクト全体の完了まで，あと何日掛かるか。ここで，各プログラムの開発に掛かる工数及び期間は，全てのプログラムで同一であるものとする。 〔作業配分モデル〕", "choices": {"ア": "140", "イ": "150", "ウ": "161", "エ": "172"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 H25秋期 問52", "応用情報技術者 H28秋期 問53"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q53.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">プロジェクト全期間に占めるシステム要件定義からシステム内部設計までの期間の割合は、作業配分モデルの期間比より、<br/><br/>　0.25＋0.21＋0.11＝0.57<br/><br/>システム内部設計が完了した時点で228日なので、プロジェクト全体の期間は以下のように計算できます。<br/><br/>　228日÷0.57＝400日<br/><br/>プログラム開発は200本中100本分が完了するまで進んでいるため、期間比0.57にプログラム開発の完了分を加えます。<br/><br/>　0.57＋(0.11÷2)＝0.625<br/><br/>現時点で全体の62.5%の作業期間を消化していることになるので、完了までの残り日数は以下のように求めることができます。<br/><br/>　400日×(1－0.625)＝<em class=\"r\">150</em>日<br/><br/>したがって正解は「イ」です。</div>", "mondai_html": "過去のプロジェクトの開発実績に基づいて構築した作業配分モデルがある。システム要件定義からシステム内部設計までをモデルどおりに228日で完了し，プログラム開発を開始した。現在，200本のプログラムのうち100本のプログラムの開発を完了し，残り100本は未着手の状況である。プログラム開発以降もモデルどおりに進捗すると仮定するとき，プロジェクト全体の完了まで，あと何日掛かるか。ここで，各プログラムの開発に掛かる工数及び期間は，全てのプログラムで同一であるものとする。<br/><br/>〔作業配分モデル〕<div class=\"img_margin left\"><img alt=\"53.png/image-size:523×97\" height=\"97\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/53.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"523\"/></div>", "choices_html": {"ア": "140", "イ": "150", "ウ": "161", "エ": "172"}}, {"id": "04_haru_q52", "session": "R4春", "gap": 6, "num": 52, "topic": "所要期間を短縮する技法はどれか", "subcat": "プロジェクトの時間", "category": "マネジメント系", "mondai": "プロジェクトのスケジュールを短縮するために，アクティビティに割り当てる資源を増やして，アクティビティの所要期間を短縮する技法はどれか。", "choices": {"ア": "クラッシング", "イ": "クリティカルチェーン法", "ウ": "ファストトラッキング", "エ": "モンテカルロ法"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 R1秋期 問53", "基本情報技術者 H28秋期 問52"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q52.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">プロジェクトの所要時間を短縮する方法は「クラッシング」と「ファストトラッキング」に大別されます。<dl><dt>クラッシング</dt><dd>メンバーの時間外勤務を増やしたり、業務内容に精通したメンバーを新たに増員するなど、クリティカルパス上のアクティビティに資源を追加投入して短縮を図る方法<div class=\"img_margin\"><img alt=\"52_1.png/image-size:430×234\" height=\"234\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/52_1.png\" style=\"max-width: 100%; height: auto;\" width=\"430\"/></div></dd><dt>ファストトラッキング</dt><dd>全体の設計が完了する前に仕様が固まっているモジュールの開発を開始するなど、当初の計画では順番に行う予定だったアクティビティを並行して行うことによって短縮を図る方法<div class=\"img_margin\"><img alt=\"52_2.png/image-size:430×260\" height=\"260\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/52_2.png\" style=\"max-width: 100%; height: auto;\" width=\"430\"/></div></dd></dl><ul><li class=\"lia\">正しい。<strong>クラッシング</strong>は、プロジェクトのスコープはそのままに、コストを追加投入することでプロジェクト全体のスケジュールを短縮させる方法です。業務内容に精通したメンバーの増員や時間外勤務の拡大などがこれに該当します。</li><li class=\"lii\">クリティカルチェーン法は、クリティカルパス法をベースに人員・設備などのリソース制限の考慮を加えたスケジュール技法です。</li><li class=\"liu\">ファストトラッキングは、開始当初の計画では直列に並んでいた作業を分割し、同時並行的に行うことで期間短縮を図る方法です。</li><li class=\"lie\">モンテカルロ法は、プロジェクトコストや所要期間の確率分布をもとに乱数を用いて反復的にシミュレーションを行うことで、コストや所要日数を予測する手法です。</li></ul></div>", "mondai_html": "プロジェクトのスケジュールを短縮するために，アクティビティに割り当てる資源を増やして，アクティビティの所要期間を短縮する技法はどれか。", "choices_html": {"ア": "クラッシング", "イ": "クリティカルチェーン法", "ウ": "ファストトラッキング", "エ": "モンテカルロ法"}}, {"id": "04_haru_q56", "session": "R4春", "gap": 6, "num": 56, "topic": "保守性を表す指標", "subcat": "サービスマネジメントプロセス", "category": "マネジメント系", "mondai": "ITIL 2011 editionでは，可用性管理における重要業績評価指標(KPI)の例として，\"保守性を表す指標値\"の短縮を挙げている。保守性を表す指標に該当するものはどれか。", "choices": {"ア": "一定期間内での中断の数", "イ": "平均故障間隔", "ウ": "平均サービス・インシデント間隔", "エ": "平均サービス回復時間"}, "ans": "エ", "hist_count": 2, "past_history": ["基本情報技術者 H27春期 問56", "基本情報技術者 H28秋期 問57"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q56.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>保守性</strong>とは、ITサービスその他の構成アイテムをどの程度迅速かつ効果的に通常の稼働状態に戻せるのかを表す指標です。ダウン状態から早く回復できる構成要素ほど、保守性が高いと表現します。簡単に言うとダウンタイムがどれだけ短いかということです。<br/><br/>ITサービスマネジメントでは、通常、システムが停止してからユーザーが利用できるようになるまでの平均時間である「平均サービス回復時間（MTRS）」が保守性を測る指標として使用されます。<br/><br/>したがって正解は「エ」です。<ul><li class=\"lia\">可用性を表す指標です。</li><li class=\"lii\">信頼性を表す指標です。</li><li class=\"liu\">信頼性を表す指標です。</li><li class=\"lie\">正しい。保守性を表す指標です。</li></ul></div>", "mondai_html": "ITIL 2011 editionでは，可用性管理における重要業績評価指標(KPI)の例として，\"保守性を表す指標値\"の短縮を挙げている。保守性を表す指標に該当するものはどれか。", "choices_html": {"ア": "一定期間内での中断の数", "イ": "平均故障間隔", "ウ": "平均サービス・インシデント間隔", "エ": "平均サービス回復時間"}}, {"id": "03_haru_q60", "session": "R3春", "gap": 8, "num": 60, "topic": "フォローアップとして適切なものはどれか", "subcat": "システム監査", "category": "マネジメント系", "mondai": "システム監査人が行う改善提案のフォローアップとして，適切なものはどれか。", "choices": {"ア": "改善提案に対する改善の実施を監査対象部門の長に指示する。", "イ": "改善提案に対する監査対象部門の改善実施プロジェクトの管理を行う。", "ウ": "改善提案に対する監査対象部門の改善状況をモニタリングする。", "エ": "改善提案の内容を監査対象部門に示した上で改善実施計画を策定する。"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 R7秋期 問59", "応用情報技術者 H28秋期 問59"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q60.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">システム監査人は、監査報告書に改善提案を記載した場合、その提案に基づいて必要な措置が講じられているかを確認するとともに、改善状況を継続的にモニタリングしなければなりません。このシステム監査後の活動を「フォローアップ」と呼びます。<br/><br/>フォローアップは、監査対象部門が主体となって実施される改善を、監査人が事後的に確認するという性質のものです。このため、監査人が改善活動を自ら実施することはなく、また実施に関して責任を負いません。改善計画の策定やその実行への関与は、監査人の独立性と客観性を損なうことに留意しなければなりません。<br/><br/>監査人の役割は被監査側が実施する改善計画を見守り、改善計画が適切に遂行されるように助言を行うことです。したがって、監査人が行うフォローアップとして適切なのは、「ウ」の\"改善状況をモニタリングする\"です。 <br/><br/>「ア」改善の実施を指示する、「イ」実施状況の管理を行う、「エ」改善実施計画を策定する、はいずれも監査対象部門が主体となって実施すべきことであり、監査人の関与は不適切です。</div>", "mondai_html": "システム監査人が行う改善提案のフォローアップとして，適切なものはどれか。", "choices_html": {"ア": "改善提案に対する改善の実施を監査対象部門の長に指示する。", "イ": "改善提案に対する監査対象部門の改善実施プロジェクトの管理を行う。", "ウ": "改善提案に対する監査対象部門の改善状況をモニタリングする。", "エ": "改善提案の内容を監査対象部門に示した上で改善実施計画を策定する。"}}, {"id": "05_haru_q51", "session": "R5春", "gap": 4, "num": 51, "topic": "プロジェクト憲章", "subcat": "プロジェクトマネジメント", "category": "マネジメント系", "mondai": "プロジェクトマネジメントにおける\"プロジェクト憲章\"の説明はどれか。", "choices": {"ア": "プロジェクトの実行，監視，管理の方法を規定するために，スケジュール，リスクなどに関するマネジメントの役割や責任などを記した文書", "イ": "プロジェクトのスコープを定義するために，プロジェクトの目標，成果物，要求事項及び境界を記した文書", "ウ": "プロジェクトの目標を達成し，必要な成果物を作成するために，プロジェクトで実行する作業を階層構造で記した文書", "エ": "プロジェクトを正式に認可するために，ビジネスニーズ，目標，成果物，プロジェクトマネージャ，及びプロジェクトマネージャの責任・権限を記した文書"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 R7春期 問51"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q51.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>プロジェクト憲章</strong>は、プロジェクトの背景や目的、実施要綱、方針などを最上位レベルで明記し、当該プロジェクトを正式に立ち上げる際に作成される文書です。<br/><br/>プロジェクト憲章は、プロジェクトに対する組織のコミットメントを示します。プロジェクトマネージャに任命された人が草案を作成し、関係各所に申請して承認を受けます。この承認によりプロジェクト活動が正式に認可され、組織の資源を使用する権限がプロジェクトマネージャに与えられます。<br/><br/>したがって「エ」が正解です。<ul><li class=\"lia\">プロジェクトマネジメント計画書の説明です。</li><li class=\"lii\">プロジェクトスコープ記述書の説明です。</li><li class=\"liu\">WBS(Work Breakdown Structure)の説明です。</li><li class=\"lie\">正しい。プロジェクト憲章の説明です。</li></ul></div>", "mondai_html": "プロジェクトマネジメントにおける\"プロジェクト憲章\"の説明はどれか。", "choices_html": {"ア": "プロジェクトの実行，監視，管理の方法を規定するために，スケジュール，リスクなどに関するマネジメントの役割や責任などを記した文書", "イ": "プロジェクトのスコープを定義するために，プロジェクトの目標，成果物，要求事項及び境界を記した文書", "ウ": "プロジェクトの目標を達成し，必要な成果物を作成するために，プロジェクトで実行する作業を階層構造で記した文書", "エ": "プロジェクトを正式に認可するために，ビジネスニーズ，目標，成果物，プロジェクトマネージャ，及びプロジェクトマネージャの責任・権限を記した文書"}}, {"id": "05_haru_q59", "session": "R5春", "gap": 4, "num": 59, "topic": "監査手続の実施に際して利用する技法", "subcat": "システム監査", "category": "マネジメント系", "mondai": "システム監査基準(平成30年)における監査手続の実施に際して利用する技法に関する記述のうち，適切なものはどれか。", "choices": {"ア": "インタビュー法とは，システム監査人が，直接，関係者に口頭で問い合わせ，回答を入手する技法をいう。", "イ": "現地調査法は，システム監査人が監査対象部門に直接赴いて，自ら観察・調査する技法なので，当該部門の業務時間外に実施しなければならない。", "ウ": "コンピュータ支援監査技法は，システム監査上使用頻度の高い機能に特化した，しかも非常に簡単な操作で利用できる専用ソフトウェアによらなければならない。", "エ": "チェックリスト法とは，監査対象部門がチェックリストを作成及び利用して，監査対象部門の見解を取りまとめた結果をシステム監査人が点検する技法をいう。"}, "ans": "ア", "hist_count": 1, "past_history": ["応用情報技術者 R1秋期 問59"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q59.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">システム監査基準(平成30年)には監査技法の代表例として、チェックリスト法、ドキュメントレビュー法、インタビュー法、ウォークスルー法、突合・照合法、現地調査法、コンピュータ支援技法の7つが記載されています。<ul><li class=\"lia\">正しい。インタビュー法は、監査対象の実態を確かめるために、システム監査人が、直接、関係者に口頭で問い合わせ、回答を入手する技法です。</li><li class=\"lii\">現地調査法とは、システム監査人が、被監査部門等に直接赴き、対象業務の流れ等の状況を、自ら観察・調査する技法です。実際の業務の流れを確認するには業務時間内に実施しなければなりません。</li><li class=\"liu\">コンピュータ支援監査技法は、監査対象ファイルの検索、抽出、計算等、システム監査上使用頻度の高い機能に特化し、簡単な操作で利用できるシステム監査を支援する専用ソフトウェアや表計算ソフトウェア等を利用してシステム監査を実施する技法です。それ以外にもコンピュータを利用した監査技法として、テストデータ法、監査モジュール法、ペネトレーションテスト法(情報セキュリティ監査時)などが利用されることもあります。</li><li class=\"lie\">チェックリスト法は、システム監査人が、あらかじめ監査対象に応じて調整して作成したチェックリスト(チェックリスト形式の質問書が通例)に対して、関係者から回答を求める技法です。チェックリストは監査対象部門ではなく、システム監査人が作成します。</li></ul></div>", "mondai_html": "システム監査基準(平成30年)における監査手続の実施に際して利用する技法に関する記述のうち，適切なものはどれか。", "choices_html": {"ア": "インタビュー法とは，システム監査人が，直接，関係者に口頭で問い合わせ，回答を入手する技法をいう。", "イ": "現地調査法は，システム監査人が監査対象部門に直接赴いて，自ら観察・調査する技法なので，当該部門の業務時間外に実施しなければならない。", "ウ": "コンピュータ支援監査技法は，システム監査上使用頻度の高い機能に特化した，しかも非常に簡単な操作で利用できる専用ソフトウェアによらなければならない。", "エ": "チェックリスト法とは，監査対象部門がチェックリストを作成及び利用して，監査対象部門の見解を取りまとめた結果をシステム監査人が点検する技法をいう。"}}, {"id": "04_aki_q51", "session": "R4秋", "gap": 5, "num": 51, "topic": "スコープコントロールの活動はどれか", "subcat": "プロジェクトのスコープ", "category": "マネジメント系", "mondai": "プロジェクトマネジメントにおけるスコープコントロールの活動はどれか。", "choices": {"ア": "開発ツールの新機能の教育が不十分と分かったので，開発ツールの教育期間を2日間延長した。", "イ": "要件定義が完了した時点で再見積りをしたところ，当初見積もった開発コストを超過することが判明したので，追加予算を確保した。", "ウ": "連携する計画であった外部システムのリリースが延期になったので，この外部システムとの連携に関わる作業は別プロジェクトで実施することにした。", "エ": "割り当てたテスト担当者が期待した成果を出せなかったので，経験豊富なテスト担当者と交代した。"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 H30春期 問51"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q51.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">プロジェクトにおける<b>スコープ</b>とは、プロジェクトの成果物と成果物を作成するために行わなければならない全作業を定義したものです。<strong>スコープコントロール</strong>は、プロジェクトを実行している間、プロジェクトスコープと成果物スコープの状況を監視し、スコープの差異や変更が、WBSやスコープ記述書に適切に反映されるように管理するプロセスです。<br/><br/>「ウ」の事例では、元々スコープ内であった作業をスコープ外に変更しているので、スコープコントロールの活動であると判断できます。よって「ウ」が正解です。<ul><li class=\"lia\">スケジュールコントロールの活動です。</li><li class=\"lii\">コストコントロールの活動です。</li><li class=\"liu\">正しい。スコープコントロールの活動です。</li><li class=\"lie\">プロジェクトチームマネジメントの活動です。</li></ul></div>", "mondai_html": "プロジェクトマネジメントにおけるスコープコントロールの活動はどれか。", "choices_html": {"ア": "開発ツールの新機能の教育が不十分と分かったので，開発ツールの教育期間を2日間延長した。", "イ": "要件定義が完了した時点で再見積りをしたところ，当初見積もった開発コストを超過することが判明したので，追加予算を確保した。", "ウ": "連携する計画であった外部システムのリリースが延期になったので，この外部システムとの連携に関わる作業は別プロジェクトで実施することにした。", "エ": "割り当てたテスト担当者が期待した成果を出せなかったので，経験豊富なテスト担当者と交代した。"}}, {"id": "04_aki_q52", "session": "R4秋", "gap": 5, "num": 52, "topic": "プレシデンスダイアグラム法", "subcat": "プロジェクトの時間", "category": "マネジメント系", "mondai": "図は，実施する三つのアクティビティについて，プレシデンスダイアグラム法を用いて，依存関係及び必要な作業日数を示したものである。全ての作業を完了するための所要日数は最少で何日か。", "choices": {"ア": "11", "イ": "12", "ウ": "13", "エ": "14"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 R2秋期 問53"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q52.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>プレシデンスダイアグラム法</strong>(PDM法)は、個々の作業を四角で囲み、作業同士を矢印で結ぶことで作業順序や依存関係を表現する図法です。<br/><br/>作業同士の関係を表すという意味ではアローダイアグラムと同じですが、アローダイアグラムでは作業を矢印で結合点を丸のノードで示すので、記述方法が根本的に異なります。またアローダイアグラムでは、ある作業の終了が別の作業の開始条件となる「終了-開始」(FS：Finish to Start)の依存関係しか表現できませんが、プレシデンスダイアグラムでは「開始」と「終了」を組み合わせた4つの依存関係を記述することができます。<dl><dt>FF関係（Finish-to-Finish，終了-終了）</dt><dd>「受付が終了したら試験会場への入場を終了する」というように、あるアクティビティの終了が、他方のアクティビティの終了条件になっている関係</dd><dt>FS関係（Finish-to-Start，終了-開始）</dt><dd>「受付が終了してから試験を開始する」というように、あるアクティビティの終了が、他方のアクティビティの開始条件になっている関係</dd><dt>SF関係（Start-to-Finish，開始-終了）</dt><dd>「試験が開始されたら受付を終了する」というように、あるアクティビティの開始が、他方のアクティビティの終了条件になっている関係</dd><dt>SS関係（Start-to-Start，開始-開始）</dt><dd>「受付が開始されたら試験会場への入場を開始する」というように、あるアクティビティの開始が、他方のアクティビティの開始条件になっている関係</dd></dl>また「リード」と「ラグ」は、先行アクティビティに対して、後続アクティビティの開始を前倒しや後ろ倒しする制約がある場合にその時間を表すものです。<dl><dt>リード</dt><dd>先行アクティビティに対して、後続アクティビティの開始を前倒しできる時間</dd><dt>ラグ</dt><dd>先行アクティビティに対して、後続アクティビティの開始を遅らせる時間</dd></dl>以上を踏まえて、アクティビティ間の依存関係を整理すると次のことがわかります。<dl><dt>アクティビティAとアクティビティB</dt><dd>・「終了-開始」関係なので、アクティビティAが終了するとアクティビティBを開始できる。<br/>・リード2日なので、アクティビティBの開始は2日前倒しできる。<br/>→<em class=\"m\">アクティビティBは、アクティビティA終了日の2日前から開始できる</em></dd><dt>アクティビティBとアクティビティC</dt><dd>・「開始-開始」関係なので、アクティビティBが開始するとアクティビティCを開始できる。<br/>・ラグ3日なので、アクティビティCの開始は3日遅らせる。<br/>→<em class=\"m\">アクティビティCは、アクティビティB開始日の3日後から開始できる</em></dd></dl>このスケジュールを図で表すと、以下のように「12日」が最低所要日数となります。したがって「イ」が正解です。<div class=\"img_margin\"><img alt=\"52_1.png/image-size:451×160\" height=\"160\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/52_1.png\" style=\"max-width: 100%; height: auto;\" width=\"451\"/></div></div>", "mondai_html": "図は，実施する三つのアクティビティについて，プレシデンスダイアグラム法を用いて，依存関係及び必要な作業日数を示したものである。全ての作業を完了するための所要日数は最少で何日か。<div class=\"img_margin\"><img alt=\"52.png/image-size:341×244\" height=\"244\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/52.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"341\"/></div>", "choices_html": {"ア": "11", "イ": "12", "ウ": "13", "エ": "14"}}, {"id": "04_aki_q55", "session": "R4秋", "gap": 5, "num": 55, "topic": "問題管理プロセスの目的はどれか", "subcat": "サービスマネジメントプロセス", "category": "マネジメント系", "mondai": "サービスマネジメントにおける問題管理の目的はどれか。", "choices": {"ア": "インシデントの解決を，合意したサービス目標の時間枠内に達成することを確実にする。", "イ": "インシデントの未知の根本原因を特定し，インシデントの発生又は再発を防ぐ。", "ウ": "合意した目標の中で，合意したサービス継続のコミットメントを果たすことを確実にする。", "エ": "変更の影響を評価し，リスクを最小とするように実施し，レビューすることを確実にする。"}, "ans": "イ", "hist_count": 1, "past_history": ["情報セキュマネ H29春期 問42"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q55.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>問題管理</strong>は、インシデントのデータと傾向を分析することで根本原因を特定し、インシデントの発生または再発を防止するための処置を決めるプロセスです。問題管理では、主に次のような活動を行います。<ul><li>インシデントの根本原因と潜在的な予防処置を特定する</li><li>問題解決のための変更要求を提起する</li><li>サービスへの影響を低減又は除去するための処置を特定する</li><li>既知の誤りを記録する</li></ul>したがって、問題管理の目的として適切なのは「イ」です。<ul><li class=\"lia\">インシデント管理の目的です。</li><li class=\"lii\">正しい。問題管理の目的です。</li><li class=\"liu\">サービス継続管理の目的です。</li><li class=\"lie\">変更管理の目的です。</li></ul></div>", "mondai_html": "サービスマネジメントにおける問題管理の目的はどれか。", "choices_html": {"ア": "インシデントの解決を，合意したサービス目標の時間枠内に達成することを確実にする。", "イ": "インシデントの未知の根本原因を特定し，インシデントの発生又は再発を防ぐ。", "ウ": "合意した目標の中で，合意したサービス継続のコミットメントを果たすことを確実にする。", "エ": "変更の影響を評価し，リスクを最小とするように実施し，レビューすることを確実にする。"}}, {"id": "04_aki_q58", "session": "R4秋", "gap": 5, "num": 58, "topic": "監査報告書に記載すべきものはどれか", "subcat": "システム監査", "category": "マネジメント系", "mondai": "JIS Q 27001:2014(情報セキュリティマネジメントシステム－要求事項)に基づいてISMS内部監査を行った結果として判明した状況のうち，監査人が指摘事項として監査報告書に記載すべきものはどれか。", "choices": {"ア": "USBメモリの使用を，定められた手順に従って許可していた。", "イ": "個人情報の誤廃棄事故を主務官庁などに，規定されたとおりに報告していた。", "ウ": "マルウェアスキャンでスパイウェアが検知され，駆除されていた。", "エ": "リスクアセスメントを実施した後に，リスク受容基準を決めた。"}, "ans": "エ", "hist_count": 1, "past_history": ["基本情報技術者 H30秋期 問58"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q58.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">\"資産の取扱いに関する手順は、組織が採用した情報分類体系に従って策定し、実施する\"こととされているので問題ありません。</li><li class=\"lii\">関係当局との適切な連絡体制を維持し、\"法が破られたと疑われる場合に、特定した情報セキュリティインシデントをいかにして時機を失せずに報告するかの手順を備える\"こととされているので問題ありません。</li><li class=\"liu\">\"組織は、不適合が発生した場合、不適合の是正のための処置を取る\"こととされているので問題ありません。</li><li class=\"lie\">正しい。リスク受容基準の決定時期が遅いので指摘事項に該当します。<br/>JIS Q 27001に基づくリスクマネジメントプロセスでは、リスクアセスメントを実施する前にリスク受容基準を確立することになっています。リスクアセスメントに含まれるリスク評価プロセスにおいて、リスク分析の結果とリスク受容基準を比較することになっているからです。<div class=\"img_margin\"><img alt=\"58.png/image-size:375×171\" height=\"171\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/58.png\" style=\"max-width: 100%; height: auto;\" width=\"375\"/></div></li></ul></div>", "mondai_html": "JIS Q 27001:2014(情報セキュリティマネジメントシステム－要求事項)に基づいてISMS内部監査を行った結果として判明した状況のうち，監査人が指摘事項として監査報告書に記載すべきものはどれか。", "choices_html": {"ア": "USBメモリの使用を，定められた手順に従って許可していた。", "イ": "個人情報の誤廃棄事故を主務官庁などに，規定されたとおりに報告していた。", "ウ": "マルウェアスキャンでスパイウェアが検知され，駆除されていた。", "エ": "リスクアセスメントを実施した後に，リスク受容基準を決めた。"}}, {"id": "04_haru_q60", "session": "R4春", "gap": 6, "num": 60, "topic": "監査証拠の入手と評価", "subcat": "システム監査", "category": "マネジメント系", "mondai": "監査証拠の入手と評価に関する記述のうち，システム監査基準(平成30年)に照らして， 適切でないもの はどれか。", "choices": {"ア": "アジャイル手法を用いたシステム開発プロジェクトにおいては，管理用ドキュメントとしての体裁が整っているものだけが監査証拠として利用できる。", "イ": "外部委託業務実施拠点に対する監査において，システム監査人が委託先から入手した第三者の保証報告書に依拠できると判断すれば，現地調査を省略できる。", "ウ": "十分かつ適切な監査証拠を入手するための本調査の前に，監査対象の実態を把握するための予備調査を実施する。", "エ": "一つの監査目的に対して，通常は，複数の監査手続を組み合わせて監査を実施する。"}, "ans": "ア", "hist_count": 1, "past_history": ["応用情報技術者 R2秋期 問60"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q60.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\"><em class=\"m\">適切ではないものなので正解肢です</em>。<br/>アジャイル開発では精密な管理ドキュメントの作成が重視されないので、システム監査を行う際に監査証拠の入手が困難なことがあります。<br/>システム監査基準では「必ずしも管理用ドキュメントとしての体裁が整っていなくとも監査証拠として利用できる場合があることに留意する」とし、ホワイトボードに記載されたスケッチの画像データや開発現場で作成された付箋紙などの体裁が整っていないものを、必要に応じて監査証拠とする例を挙げています。</li><li class=\"lii\">システム監査基準では、外部委託業務実施拠点に対する現地調査について「委託先が第三者による保証又は認証を受けており、当該保証等報告書に依拠し、上記手続の一部を省略する場合、当該第三者の能力、客観性及び専門職としての正当な注意について検討を行った上で、委託業務の重要性とリスクを勘案する必要がある」としています。<br/>外部委託業務実施拠点に監査を行った第三者の能力等、委託業務の重要性とリスクに問題がなければ、保証等報告書を根拠に当該拠点の現地調査の全部または一部を省略できます。</li><li class=\"liu\">予備調査(事前調査)は「監査対象の実態を把握するため」、本調査は「予備調査で得た情報を踏まえて、十分かつ適切な監査証拠を入手するため」に実施されます。</li><li class=\"lie\">システム監査基準では「監査手続は、それぞれ単独で実施される場合もあるが、通常は、一つの監査目的に対して複数の監査手続の組み合わせによって構成される」としています。</li></ul></div>", "mondai_html": "監査証拠の入手と評価に関する記述のうち，システム監査基準(平成30年)に照らして，<u>適切でないもの</u>はどれか。", "choices_html": {"ア": "アジャイル手法を用いたシステム開発プロジェクトにおいては，管理用ドキュメントとしての体裁が整っているものだけが監査証拠として利用できる。", "イ": "外部委託業務実施拠点に対する監査において，システム監査人が委託先から入手した第三者の保証報告書に依拠できると判断すれば，現地調査を省略できる。", "ウ": "十分かつ適切な監査証拠を入手するための本調査の前に，監査対象の実態を把握するための予備調査を実施する。", "エ": "一つの監査目的に対して，通常は，複数の監査手続を組み合わせて監査を実施する。"}}, {"id": "03_aki_q52", "session": "R3秋", "gap": 7, "num": 52, "topic": "プレシデンスダイアグラム", "subcat": "プロジェクトの時間", "category": "マネジメント系", "mondai": "次のプレシデンスダイアグラムで表現されたプロジェクトスケジュールネットワーク図を，アローダイアグラムに書き直したものはどれか。ここで，プレシデンスダイアグラムの依存関係は全てFS関係とする。", "choices": {}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 H29秋期 問53"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q52.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>プレシデンスダイアグラム法</strong>(PDM法)は、個々の作業を四角で囲み、作業同士を矢印で結ぶことで作業順序や依存関係を表現する図法です。<br/><br/>作業同士の関係を表すという意味ではアローダイアグラムと同じですが、アローダイアグラムでは作業を矢印で結合点を丸のノードで示すので、記述方法が根本的に異なります。またアローダイアグラムでは、ある作業の終了が別の作業の開始条件となる「終了－開始」(FS：Finish to Start)の依存関係しか表現できませんが、プレシデンスダイアグラムではこの他に、「開始-開始」(SS：Start to Start)、「開始-終了」(SF：Start to Finish)、「終了-終了」(FF：Finish to Finish)の関係を記述できることが特徴です。<br/><br/>上記の説明でも触れましたが、本設問のFS関係とは「ある作業の終了が別の作業の開始条件となっている関係」を意味しており、アローダイアグラムの矢印で示される依存関係がこれに相当します。<br/><br/>選択肢の各図は基本的には同じ造りであり、異なるのはダミー作業を表す点線のみです。プレシデンスダイアグラムの矢印に注目すると、作業Aと作業Dからの矢印が作業Fに向かって伸びています。これは、作業Fの開始条件が作業Aおよび作業Dの両方の完了であることを示しています。すなわちアローダイアグラムの中で、作業Aの結合点からのダミー作業線および作業Dの矢印が、作業F開始の結合点に向かって記述されている「イ」が適切です。<ul><li class=\"lia\">作業Aと作業FのFS関係が表現されていないので誤りです。</li><li class=\"lii\">正しい。</li><li class=\"liu\">プレシデンスダイアグラムに存在しない作業Aと作業HのFS関係が記述されているため誤りです。</li><li class=\"lie\">この図のダミー作業線は、作業Aと作業HのFS関係を表すため誤りです。</li></ul></div>", "mondai_html": "次のプレシデンスダイアグラムで表現されたプロジェクトスケジュールネットワーク図を，アローダイアグラムに書き直したものはどれか。ここで，プレシデンスダイアグラムの依存関係は全てFS関係とする。<div class=\"img_margin\"><img alt=\"52.png/image-size:518×174\" height=\"174\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/52.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"518\"/></div>", "choices_html": {"ア": "<img alt=\"52a.png/image-size:290×102\" height=\"102\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/52a.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"290\"/>", "イ": "<img alt=\"52i.png/image-size:289×101\" height=\"101\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/52i.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"289\"/>", "ウ": "<img alt=\"52u.png/image-size:289×101\" height=\"101\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/52u.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"289\"/>", "エ": "<img alt=\"52e.png/image-size:289×101\" height=\"101\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/52e.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"289\"/>"}}, {"id": "03_aki_q57", "session": "R3秋", "gap": 7, "num": 57, "topic": "保証型の監査と助言型の監査", "subcat": "システム監査", "category": "マネジメント系", "mondai": "経済産業省\"情報セキュリティ監査基準 実施基準ガイドライン(Ver1.0)\" における，情報セキュリティ対策の適切性に対して一定の保証を付与することを目的とする監査(保証型の監査)と情報セキュリティ対策の改善に役立つ助言を行うことを目的とする監査(助言型の監査)の実施に関する記述のうち，適切なものはどれか。", "choices": {"ア": "同じ監査対象に対して情報セキュリティ監査を実施する場合，保証型の監査から手がけ，保証が得られた後に助言型の監査に切り替えなければならない。", "イ": "情報セキュリティ監査において，保証型の監査と助言型の監査は排他的であり，監査人はどちらで監査を実施するかを決定しなければならない。", "ウ": "情報セキュリティ監査を保証型で実施するか助言型で実施するかは，監査要請者のニーズによって決定するのではなく，監査人の責任において決定する。", "エ": "不特定多数の利害関係者の情報を取り扱う情報システムに対しては，保証型の監査を定期的に実施し，その結果を開示することが有用である。"}, "ans": "エ", "hist_count": 1, "past_history": ["情報セキュマネ H31春期 問40"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q57.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>情報セキュリティ監査</strong>は、監査対象が情報セキュリティ対策に係る一定の条件を満たしているか否か、あるいは情報セキュリティ対策の実施状況が適切であるかを独立かつ専門的な立場のシステム監査人が検証又は評価することです。<br/><br/>設問でも触れられているように、情報セキュリティ監査の目的には「保証型」と「助言型」の2つのタイプがあります。<dl><dt>保証型の監査</dt><dd>監査対象の情報セキュリティマネジメント体制又は管理策が、監査実施の時点で適切であったことを監査意見として表明する形態の監査</dd><dt>助言型の監査</dt><dd>今後の改善を目的として、監査対象の情報セキュリティマネジメント体制又は管理策の欠陥や懸念事項等の問題点を検出し、必要に応じて監査意見として改善提言を表明する形態の監査</dd></dl><ul><li class=\"lia\">助言型の監査から手がけ、被監査側の情報セキュリティ対策が一定水準に達した段階で保証型の監査に切り替える流れが適切です。</li><li class=\"lii\">2つの目的は排他的なものではないため、保証と助言の2つを監査の目的とすることができます。</li><li class=\"liu\">情報セキュリティ監査の目的は、基本的には監査依頼者又は被監査側のニーズによって決定されます。監査人は、事前にどちらを目的とするかについて監査依頼者又は被監査側と調整しておく必要があります。</li><li class=\"lie\">正しい。不特定多数の利害関係者が関与する事業やシステムで、公共性の高い場合や高い機密性が求められる場合については、保証型の監査を定期的に行うことで利害関係者の信頼を得ることが推奨されます。</li></ul></div>", "mondai_html": "経済産業省\"情報セキュリティ監査基準 実施基準ガイドライン(Ver1.0)\" における，情報セキュリティ対策の適切性に対して一定の保証を付与することを目的とする監査(保証型の監査)と情報セキュリティ対策の改善に役立つ助言を行うことを目的とする監査(助言型の監査)の実施に関する記述のうち，適切なものはどれか。", "choices_html": {"ア": "同じ監査対象に対して情報セキュリティ監査を実施する場合，保証型の監査から手がけ，保証が得られた後に助言型の監査に切り替えなければならない。", "イ": "情報セキュリティ監査において，保証型の監査と助言型の監査は排他的であり，監査人はどちらで監査を実施するかを決定しなければならない。", "ウ": "情報セキュリティ監査を保証型で実施するか助言型で実施するかは，監査要請者のニーズによって決定するのではなく，監査人の責任において決定する。", "エ": "不特定多数の利害関係者の情報を取り扱う情報システムに対しては，保証型の監査を定期的に実施し，その結果を開示することが有用である。"}}, {"id": "03_aki_q59", "session": "R3秋", "gap": 7, "num": 59, "topic": "システム監査手続きの技法", "subcat": "システム監査", "category": "マネジメント系", "mondai": "データの生成から入力，処理，出力，活用までのプロセス，及び組み込まれているコントロールを，システム監査人が書面上で又は実際に追跡する技法はどれか。", "choices": {"ア": "インタビュー法", "イ": "ウォークスルー法", "ウ": "監査モジュール法", "エ": "ペネトレーションテスト法"}, "ans": "イ", "hist_count": 1, "past_history": ["情報セキュマネ R1秋期 問39"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q59.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">インタビュー法は、監査対象の実態を確かめるために、システム監査人が、直接、関係者に口頭で問い合わせ、回答を入手する技法です。</li><li class=\"lii\">正しい。ウォークスルー法は、データの生成から入力、処理、出力、活用までのプロセス、及び組み込まれているコントロールを、書面上で、又は実際に追跡する技法です。</li><li class=\"liu\">監査モジュール法は、コンピュータ支援監査技法の1つで、システム監査人が指定した抽出条件に合致したデータをシステム監査人用のファイルに記録し、レポートを出力するモジュールを、本番プログラムに組み込む技法です。</li><li class=\"lie\">ペネトレーションテスト法は、システム監査人が一般ユーザーのアクセス権限又は無権限で、テスト対象システムへの侵入を試み、システム資源がそのようなアクセスから守られているかどうかを確認する技法です。</li></ul>システム監査基準(平成30年)では、選択肢の4つの監査技法の他に、チェックリスト法、ドキュメントレビュー法、突合・照合法、現地調査法、テストデータ法などを定義しています。</div>", "mondai_html": "データの生成から入力，処理，出力，活用までのプロセス，及び組み込まれているコントロールを，システム監査人が書面上で又は実際に追跡する技法はどれか。", "choices_html": {"ア": "インタビュー法", "イ": "ウォークスルー法", "ウ": "監査モジュール法", "エ": "ペネトレーションテスト法"}}, {"id": "03_aki_q60", "session": "R3秋", "gap": 7, "num": 60, "topic": "指摘事項への対応のうち不適切なもの", "subcat": "システム監査", "category": "マネジメント系", "mondai": "システム監査基準(平成30年)に基づいて，監査報告書に記載された指摘事項に対応する際に， 不適切なもの はどれか。", "choices": {"ア": "監査対象部門が，経営者の指摘事項に対するリスク受容を理由に改善を行わないこととする。", "イ": "監査対象部門が，自発的な取組によって指摘事項に対する改善に着手する。", "ウ": "システム監査人が，監査対象部門の改善計画を作成する。", "エ": "システム監査人が，監査対象部門の改善実施状況を確認する。"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 H31春期 問59"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q60.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">システム監査基準(平成30年)には、「フォローアップは、監査対象部門の責任において実施される改善をシステム監査人が事後的に確認するという性質のものであり、システム監査人による改善計画の策定及びその実行への関与は、独立性と客観性を損なうことに留意すべきである」という記載があります。改善計画は、監査対象部門や改善責任部門が主体となって実施するため、システム監査人は、改善の実施そのものに責任をもつことはありません。あくまで、独立性かつ客観的な視点で改善の実施が適切であるかどうかを監視し、指導する立場になります。<br/><br/>したがって、システム監査人自らが改善計画を作成している「ウ」が<u>不適切な</u>対応です。<ul><li class=\"lia\">指摘されたリスクを受容し、追加的措置を実施しない場合もあります。</li><li class=\"lii\">改善計画は、監査対象部門が主体となって実施します。</li><li class=\"liu\">正しい。システム監査人として不適切な対応です。</li><li class=\"lie\">システム監査人は、監査対象部門による改善活動が適切であるかどうかをフォローアップする必要があります。</li></ul></div>", "mondai_html": "システム監査基準(平成30年)に基づいて，監査報告書に記載された指摘事項に対応する際に，<b>不適切なもの</b>はどれか。", "choices_html": {"ア": "監査対象部門が，経営者の指摘事項に対するリスク受容を理由に改善を行わないこととする。", "イ": "監査対象部門が，自発的な取組によって指摘事項に対する改善に着手する。", "ウ": "システム監査人が，監査対象部門の改善計画を作成する。", "エ": "システム監査人が，監査対象部門の改善実施状況を確認する。"}}, {"id": "03_haru_q51", "session": "R3春", "gap": 8, "num": 51, "topic": "計画のプロセス群に属するプロセス", "subcat": "プロジェクトマネジメント", "category": "マネジメント系", "mondai": "JIS Q 21500:2018(プロジェクトマネジメントの手引)によれば，プロジェクトマネジメントのプロセスのうち，計画のプロセス群に属するプロセスはどれか。", "choices": {"ア": "スコープの定義", "イ": "品質保証の遂行", "ウ": "プロジェクト憲章の作成", "エ": "プロジェクトチームの編成"}, "ans": "ア", "hist_count": 1, "past_history": ["基本情報技術者 H28秋期 問51"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q51.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">JIS Q 21500は、PMBOKをベースにしたISO規格\"ISO 21500\"のJIS規格です。プロジェクトマネジメントに関するいくつかの用語を定義するとともに、プロジェクトマネジメントの全体像、PMBOK第6版まででお馴染みの5つのプロセス群（立上げ、計画、実行、管理、終結)、10つの対象群で行うべき作業の大枠を規定しています。<br/><br/>計画のプロセス群は、スコープ、スケジュール、コスト等の各対象群ごとに計画の詳細を作成するプロセスの集まりで、いわゆる\"○○マネジメント計画の作成\"で実施すべき作業が含まれます。JIS Q 21500によれば、計画のプロセス群では対象群ごとに以下の作業を実施することとされています。<div class=\"img_margin\"><img alt=\"51.png/image-size:469×336\" height=\"336\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/51.png\" style=\"max-width: 100%; height: auto;\" width=\"469\"/></div>選択肢のうち計画のプロセス群に属するプロセスは、「ア」の\"スコープの定義\"が適切です。<ul><li class=\"lia\">正しい。\"スコープの定義\"は、プロジェクトの最終状態を定義することによって、目標、成果物、要求事項及び境界を含むプロジェクト・スコープの明確さを達成することを目的とするプロセスで、計画のプロセス群に属しています。</li><li class=\"lii\">\"品質保証の遂行\"は、確定したプロジェクトの目標、品質要求事項及び規格を満たしそうかどうかを明らかにし、不満足なパフォーマンスの原因及びそれを取り除くための方法を特定することを目的とするプロセスで、実行のプロセス群に属しています。</li><li class=\"liu\">\"プロジェクト憲章の作成\"は、プロジェクトを正式に許可する文書であるプロジェクト憲章を作成することを目的とするプロセスで、立上げのプロセス群に属しています。</li><li class=\"lie\">\"プロジェクトチームの編成\"は、プロジェクトの完遂に必要な人的資源を得ることを目的とするプロセスで、立上げのプロセス群に属しています。</li></ul></div>", "mondai_html": "JIS Q 21500:2018(プロジェクトマネジメントの手引)によれば，プロジェクトマネジメントのプロセスのうち，計画のプロセス群に属するプロセスはどれか。", "choices_html": {"ア": "スコープの定義", "イ": "品質保証の遂行", "ウ": "プロジェクト憲章の作成", "エ": "プロジェクトチームの編成"}}, {"id": "03_haru_q55", "session": "R3春", "gap": 8, "num": 55, "topic": "延べ何時間の顔合わせ会が必要か", "subcat": "プロジェクトのコミュニケーション", "category": "マネジメント系", "mondai": "プロジェクトメンバーが16人のとき，1対1の総当たりでプロジェクトメンバー相互の顔合わせ会を行うためには，延べ何時間の顔合わせ会が必要か。ここで，顔合わせ会1回の所要時間は0.5時間とする。", "choices": {"ア": "8", "イ": "16", "ウ": "30", "エ": "60"}, "ans": "エ", "hist_count": 1, "past_history": ["基本情報技術者 H28春期 問54"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q55.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">組合せ数を求める公式を利用して答えを導きます。<dl><dt>n個の中から異なるr個を取り出す組合せの場合の数</dt><dd><sub>n</sub>C<sub>r</sub>＝<span class=\"frac\"><span>n!</span>(n－r)!r!</span></dd></dl>16人がいるとき、異なる2人の組合せが何通りあるかは以下のように計算できます。<br/><br/>　<sub>16</sub>C<sub>2</sub>＝<span class=\"frac\"><span>16×15</span>2×1</span>＝120組<br/><br/>顔合わせ会1回の所要時間は0.5時間のため、<br/><br/>　120組×0.5時間＝60時間<br/><br/>よって、顔合わせ会に要する総時間は<em class=\"r\">60時間</em>が適切です。<br/><br/>また煩雑にはなりますが別の解法として、全ての組合せを列挙していく方法も考えられます。16人をそれぞれA、B、…、Pとすると、<br/><ul class=\"none\"><li>AとB、AとC、…、AとP(15通り)</li><li>BとC、BとD、…、BとP(14通り)</li><li>CとD、CとE、…、CとP(13通り)</li><li>(省略)</li><li>NとO、NとP(2通り)</li><li>OとP(1通り)</li></ul>となるため、<br/><br/>　15＋14＋13＋…＋2＋1＝120組<br/>　120組×0.5時間＝60時間</div>", "mondai_html": "プロジェクトメンバーが16人のとき，1対1の総当たりでプロジェクトメンバー相互の顔合わせ会を行うためには，延べ何時間の顔合わせ会が必要か。ここで，顔合わせ会1回の所要時間は0.5時間とする。", "choices_html": {"ア": "8", "イ": "16", "ウ": "30", "エ": "60"}}];
const AM2_QUESTIONS = [{"id": "sc_05_aki_q1", "session": "支援士 R5秋", "gap": 3, "num": 1, "topic": "OSコマンドインジェクション", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "Webアプリケーションソフトウェアの脆弱性を悪用する攻撃手法のうち，入力した文字列がPHPのexec関数などに渡されることを利用し，不正にシェルスクリプトを実行させるものは，どれに分類されるか。", "mondai_html": "<div id=\"mondai\">Webアプリケーションソフトウェアの脆弱性を悪用する攻撃手法のうち，入力した文字列がPHPのexec関数などに渡されることを利用し，不正にシェルスクリプトを実行させるものは，どれに分類されるか。</div>", "choices": {"ア": "HTTPヘッダーインジェクション", "イ": "OSコマンドインジェクション", "ウ": "クロスサイトリクエストフォージェリ", "エ": "セッションハイジャック"}, "choices_html": {"ア": "HTTPヘッダーインジェクション", "イ": "OSコマンドインジェクション", "ウ": "クロスサイトリクエストフォージェリ", "エ": "セッションハイジャック"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>OSコマンドインジェクション</strong>は、ユーザー入力をOSに発行するコマンドの一部として使用しているWebアプリケーションに対して、OSコマンドを含む不正な入力を与えることで、サーバ上で不正なOSコマンドを実行させる攻撃手法です。本来は許可されないコマンドが実行されることにより、不正なファイル操作、外部プログラムの実行、重要情報の窃取などの被害が発生するおそれがあります。<div class=\"img_margin\"><img alt=\"01.png/image-size:569×304\" height=\"304\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/01.png\" style=\"max-width: 100%; height: auto;\" width=\"569\"/></div>多くのプログラミング言語には、引数として指定された文字列をOSのシェルに渡して実行させる関数等が存在します。例えば、PHPの<span class=\"code\">exec</span>、Perlの<span class=\"code\">open</span>、Pythonの<span class=\"code\">subprocess.call</span>などが該当します。外部からの入力値を適切に検証せずにこれらの関数を使用している場合、攻撃者に任意のコマンドを実行されるリスクがあります。<ul><li class=\"lia\">HTTPヘッダーインジェクションは、動的にHTTPヘッダーを生成するシステムにおいて、HTTPヘッダー内に改行コードなどを不正挿入することによって、不正なヘッダー情報を挿入したり、任意の記述をメッセージボディに挿入したりする攻撃です。</li><li class=\"lii\">正しい。OSコマンドインジェクションは、入力値としてOSコマンドとして解釈される文字列を紛れ込ませることにより、システムに不正なOSコマンドを実行させる攻撃です。</li><li class=\"liu\">クロスサイトリクエストフォージェリは、Webサイトに設置されたハイパーリンクや実行されるスクリプトなどを通じて、別のサイトで閲覧者に意図しない不正操作を行わせる攻撃です。引き起こされる被害例としては、会員情報の変更、商品の購入などがあります。</li><li class=\"lie\">セッションハイジャックは、TCPコネクションやクライアント－サーバ間の正規のセッションを奪い取る行為です。</li></ul></div>", "past_history": ["情報セキュリティ H23秋期 問16", "情報セキュリティ H26春期 問15", "安全確保支援士 H29春期 問12", "安全確保支援士 H30秋期 問13"], "hist_count": 5}, {"id": "sc_05_aki_q2", "session": "支援士 R5秋", "gap": 3, "num": 2, "topic": "TLS1.3の暗号スイート", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "TLS1.3の暗号スイートに関する説明のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">TLS1.3の暗号スイートに関する説明のうち，適切なものはどれか。</div>", "choices": {"ア": "AEAD(Authenticated Encryption with Associated Data)とハッシュアルゴリズムの組みで構成されている。", "イ": "TLS1.2で規定されている共通鍵暗号AES-CBCをサポート必須の暗号アルゴリズムとして継続利用できるようにしている。", "ウ": "Wi-Fiアライアンスにおいて規格化されている。", "エ": "サーバとクライアントのそれぞれがお互いに別の暗号アルゴリズムを選択できる。"}, "choices_html": {"ア": "AEAD(Authenticated Encryption with Associated Data)とハッシュアルゴリズムの組みで構成されている。", "イ": "TLS1.2で規定されている共通鍵暗号AES-CBCをサポート必須の暗号アルゴリズムとして継続利用できるようにしている。", "ウ": "Wi-Fiアライアンスにおいて規格化されている。", "エ": "サーバとクライアントのそれぞれがお互いに別の暗号アルゴリズムを選択できる。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>暗号スイート</strong>は、通信に使う暗号アルゴリズム、鍵長、鍵交換方式、ハッシュ関数の組合せのことです。TLS1.2以前ではこれら4つを個別に組み合わせた「鍵交換_署名_暗号化_ハッシュ関数」形式だったので100種類以上の暗号スイートが指定可能でした。しかし、特定の組み合わせがセキュリティを弱める可能性があるなどの理由から、TLS1.3では、署名と鍵交換を暗号スイートから独立させ「暗号化_ハッシュ関数」だけの構成に変更となりました。TLS1.3として定義されている暗号スイートは、次の5種類です。<ul><li>TLS_AES_128_GCM_SHA256</li><li>TLS_AES_256_GCM_SHA384</li><li>TLS_CHACHA20_POLY1305_SHA256</li><li>TLS_AES_128_CCM_SHA256</li><li>TLS_AES_128_CCM_8_SHA256</li></ul><ul><li class=\"lia\">正しい。TLS1.3の暗号スイートは、AEAD(認証付き暗号)とハッシュアルゴリズムの組となります。</li><li class=\"lii\">TLS1.3では、TLS1.2で選択可能だった2つのハッシュ方式（SHA1、MD5）と4つの暗号アルゴリズム（RC4、DES、3DES、AES-CBC）が、セキュリティリスクの観点から削除されています。</li><li class=\"liu\">Wi-Fiアライアンスではありません。IETF(Internet Engineering Task Force)によりRFC8446として規格化されています。</li><li class=\"lie\">サーバとクライアントは同じ暗号スイートを使います。クライアントが ClientHello で利用可能な暗号スイートを示し、サーバがそれを選択します。</li></ul></div>", "past_history": ["安全確保支援士 R3秋期 問17"], "hist_count": 2}, {"id": "sc_05_aki_q3", "session": "支援士 R5秋", "gap": 3, "num": 3, "topic": "VAの役割はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "VA(Validation Authority)の役割はどれか。", "mondai_html": "<div id=\"mondai\">VA(Validation Authority)の役割はどれか。</div>", "choices": {"ア": "属性証明書の発行を代行する。", "イ": "デジタル証明書にデジタル署名を付与する。", "ウ": "デジタル証明書の失効状態についての問合せに応答する。", "エ": "本人確認を行い，デジタル証明書の発行を指示する。"}, "choices_html": {"ア": "属性証明書の発行を代行する。", "イ": "デジタル証明書にデジタル署名を付与する。", "ウ": "デジタル証明書の失効状態についての問合せに応答する。", "エ": "本人確認を行い，デジタル証明書の発行を指示する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>VA</strong>(Validation Authority：証明書有効性検証局)は、PKIを構成する機関であり、以下の方法で公開鍵証明書の有効性を検証し、クライアントからの証明書の有効性に関する問い合わせに応答する役割を担っています。<ul><li>CAの公開鍵で署名を検証</li><li>証明書の有効期限を確認</li><li>CRLの集中管理</li><li>CRLを確認</li></ul>クライアントからのリアルタイムの問合せには<b>OCSP</b>(Online Certificate Status Protocol)や<b>SCVP</b>が用いられ、VAにはレスポンダ(サーバ)の機能が実装されます。<br/><br/>したがって「ウ」が適切です。<ul><li class=\"lia\">AA(Attribute Authority：属性認証局)の役割です。</li><li class=\"lii\">CA(Certificate Authority：認証局)の役割です。</li><li class=\"liu\">正しい。VAの役割です。</li><li class=\"lie\">RA(Registration Authority：登録局)の役割です。</li></ul></div>", "past_history": ["安全確保支援士 R1秋期 問3", "情報セキュリティ H27春期 問4"], "hist_count": 3}, {"id": "sc_05_aki_q4", "session": "支援士 R5秋", "gap": 3, "num": 4, "topic": "XMLデジタル署名の特徴", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "XMLデジタル署名の特徴として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">XMLデジタル署名の特徴として，適切なものはどれか。</div>", "choices": {"ア": "XML文書中の任意のエレメントに対してデタッチ署名(Detached Signature)を作成し，同じXML文書に含めることができる。", "イ": "エンベローピング署名(Enveloping Signature)では一つの署名対象に複数の署名を付与する。", "ウ": "署名の書式として，CMS(Cryptographic Message Syntax)を用いる。", "エ": "デジタル署名では，署名対象と署名アルゴリズムをASN.1によって記述する。"}, "choices_html": {"ア": "XML文書中の任意のエレメントに対してデタッチ署名(Detached Signature)を作成し，同じXML文書に含めることができる。", "イ": "エンベローピング署名(Enveloping Signature)では一つの署名対象に複数の署名を付与する。", "ウ": "署名の書式として，CMS(Cryptographic Message Syntax)を用いる。", "エ": "デジタル署名では，署名対象と署名アルゴリズムをASN.1によって記述する。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_4.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>XMLデジタル署名</strong>は、XML文書にデジタル署名を埋め込むための仕様で、RFC 3075として標準化されています。デジタル署名と同様に完全性・認証・否認防止などのセキュリティ機能を提供します。<div class=\"img_margin\"><img alt=\"04_1.png/image-size:300×240\" height=\"240\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/04_1.png\" style=\"max-width: 100%; height: auto;\" width=\"300\"/></div>XMLデジタル署名には、署名と署名対象の関係性によって3つがあります。<dl><dt>デタッチ署名（Detached Signature）</dt><dd>署名と署名対象が独立している方式。別の文書や同じ文書内の任意の要素を署名対象にできる</dd><dt>エンベロープ署名（Enveloped Signature）</dt><dd>署名対象の内部に署名を埋め込む方式</dd><dt>エンベローピング署名（Enveloping Signature）</dt><dd>署名の内部に署名対象を埋め込む方式</dd></dl><div class=\"img_margin\"><img alt=\"04_2.png/image-size:400×317\" height=\"317\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/04_2.png\" style=\"max-width: 100%; height: auto;\" width=\"400\"/></div><ul><li class=\"lia\">正しい。デタッチ署名では署名と署名対象が分離しています。そのため、別のファイルや同じ文書中の任意のXML要素を署名対象とすることができます。</li><li class=\"lii\">エンベローピング署名は、署名データの内部に署名対象のデータを埋め込む形態です。そのため署名と署名対象データの関係は1対1となります。</li><li class=\"liu\">XMLデジタル署名は、XMLDSigというXMLベースの書式で記述します。CMS(Cryptographic Message Syntax)は、S/MIMEなどで使われるメッセージカプセル化のフォーマットです。</li><li class=\"lie\">署名対象と署名アルゴリズムは、XML要素の属性値にURI形式で記述します。ASN.1(Abstract Syntax Notation One)は、デジタル証明書などに使用される、プロトコルを規定するために使われるデータ構造の定義言語です。</li></ul></div>", "past_history": ["安全確保支援士 R1秋期 問4", "安全確保支援士 R7秋期 問6", "情報セキュリティ H22春期 問2", "情報セキュリティ H25秋期 問2", "情報セキュリティ H28秋期 問4", "安全確保支援士 H30春期 問3", "情報セキュリティ H19春期 問38"], "hist_count": 8}, {"id": "sc_05_aki_q5", "session": "支援士 R5秋", "gap": 3, "num": 5, "topic": "クリプトジャッキングはどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "クリプトジャッキングに該当するものはどれか。", "mondai_html": "<div id=\"mondai\">クリプトジャッキングに該当するものはどれか。</div>", "choices": {"ア": "PCに不正アクセスし，そのPCのリソースを利用して，暗号資産のマイニングを行う攻撃", "イ": "暗号資産取引所のWebサイトに不正ログインを繰り返し，取引所の暗号資産を盗む攻撃", "ウ": "巧妙に細工した電子メールのやり取りによって，企業の担当者をだまし，攻撃者の用意した暗号資産口座に送金させる攻撃", "エ": "マルウェア感染したPCに制限を掛けて利用できないようにし，その制限の解除と引換えに暗号資産を要求する攻撃"}, "choices_html": {"ア": "PCに不正アクセスし，そのPCのリソースを利用して，暗号資産のマイニングを行う攻撃", "イ": "暗号資産取引所のWebサイトに不正ログインを繰り返し，取引所の暗号資産を盗む攻撃", "ウ": "巧妙に細工した電子メールのやり取りによって，企業の担当者をだまし，攻撃者の用意した暗号資産口座に送金させる攻撃", "エ": "マルウェア感染したPCに制限を掛けて利用できないようにし，その制限の解除と引換えに暗号資産を要求する攻撃"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>クリプトジャッキング</strong>は、暗号資産を入手するために必要なマイニング作業（膨大な量のハッシュ値の計算）を、他人のコンピュータに秘密裏に行わせる行為です。被害者のハードウェアを搾取する形のリソース窃盗型攻撃に該当し、暗号資産が世界的に注目を浴びた後に急増した攻撃の形です。<br/><br/>攻撃の方法としては、コードを仕込んだマルウェアをPCに感染させる、利用者のWebページ閲覧中にスクリプトに仕込んだコードで計算させるなどが典型例です。計算資源や電気代の窃取であるとともに、過負荷によるPC動作の遅延やCPUの熱暴走を生じさせる点が問題となりますが、明確な金銭的被害が表面化しない場合も多く、発見が難しいという側面があります。<br/><br/>したがって「ア」が適切な記述です。<ul><li class=\"lia\">正しい。クリプトジャッキングの説明です。</li><li class=\"lii\">クリプトジャッキングは、暗号資産を直接的に盗み取るわけではありません。</li><li class=\"liu\">ビジネスメール詐欺（BEC：Business Email Compromise）の説明です。</li><li class=\"lie\">ランサムウェアの説明です。</li></ul></div>", "past_history": ["安全確保支援士 R7春期 問5"], "hist_count": 2}, {"id": "sc_05_aki_q6", "session": "支援士 R5秋", "gap": 3, "num": 6, "topic": "マルウェアMiraiの動作はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "マルウェアMiraiの動作はどれか。", "mondai_html": "<div id=\"mondai\">マルウェアMiraiの動作はどれか。</div>", "choices": {"ア": "IoT機器などで動作するWebサーバプログラムの脆弱性を悪用して感染を広げ，Webページを改ざんし，決められた日時に特定のIPアドレスに対してDDoS攻撃を行う。", "イ": "Webサーバプログラムの脆弱性を悪用して企業のWebページに不正なJavaScriptを挿入し，当該Webページを閲覧した利用者を不正なWebサイトへと誘導する。", "ウ": "ファイル共有ソフトを使っているPC内でマルウェアの実行ファイルを利用者が誤って実行すると，PC内の情報をインターネット上のWebサイトにアップロードして不特定多数の人に公開する。", "エ": "ランダムな宛先IPアドレスを使用してIoT機器などに感染を広げるとともに，C&Cサーバからの指令に従って標的に対してDDoS攻撃を行う。"}, "choices_html": {"ア": "IoT機器などで動作するWebサーバプログラムの脆弱性を悪用して感染を広げ，Webページを改ざんし，決められた日時に特定のIPアドレスに対してDDoS攻撃を行う。", "イ": "Webサーバプログラムの脆弱性を悪用して企業のWebページに不正なJavaScriptを挿入し，当該Webページを閲覧した利用者を不正なWebサイトへと誘導する。", "ウ": "ファイル共有ソフトを使っているPC内でマルウェアの実行ファイルを利用者が誤って実行すると，PC内の情報をインターネット上のWebサイトにアップロードして不特定多数の人に公開する。", "エ": "ランダムな宛先IPアドレスを使用してIoT機器などに感染を広げるとともに，C&Cサーバからの指令に従って標的に対してDDoS攻撃を行う。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_6.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>Mirai</strong>(ミライ)は、ネットワークカメラや家庭用ルータやスマート家電などのIoT機器に感染してボット化するマルウェアです。<br/><br/>Miraiは、感染した端末上でIPアドレスをランダムに検索し、新たな標的を見つけようとします。標的のIoT機器が見つかると、工場出荷時のデフォルト値や単純なID/パスワードの組みによる辞書攻撃によって、標的IoT端末のtelnetポートへのログインを試みます。この動作を繰り返して、ボットネットを拡大していきます。Miraiが構築したボットネットは、過去最大級の規模のDDoS攻撃を引き起こしています。<br/><br/>また、Miraiはソースコードが公開されているため様々な亜種が生まれており、IoT機器におけるセキュリティ上の脅威となっています。侵入を防ぐために最も効果的な対策は、初期設定のままではなくTelnetなどの通信ポートを閉じること、<em class=\"m\">IoT機器に強力なID/パスワードを設定すること</em>です。<br/><br/>したがって「エ」が適切な説明です。<ul><li class=\"lia\">IoT機器を攻撃対象とすることは合っていますが、Miraiは、IoT機器の既定認証情報（Telnet/SSHのデフォルトパスワード）を突いて感染を広げます。Webサーバの脆弱性攻撃やWebページは改ざんは行わないので誤りです。</li><li class=\"lii\">ガンブラーなどのリダイレクト型マルウェアの動作です。</li><li class=\"liu\">Antinnyや山田オルタネイティブなどの情報漏えい型マルウェアの動作です。</li><li class=\"lie\">正しい。マルウェアMiraiの動作です。</li></ul></div>", "past_history": ["安全確保支援士 R7春期 問7", "安全確保支援士 H30秋期 問11"], "hist_count": 3}, {"id": "sc_05_aki_q7", "session": "支援士 R5秋", "gap": 3, "num": 7, "topic": "トランザクション署名の説明はどれか", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "インターネットバンキングでのMITB攻撃による不正送金について，対策として用いられるトランザクション署名の説明はどれか。", "mondai_html": "<div id=\"mondai\">インターネットバンキングでのMITB攻撃による不正送金について，対策として用いられるトランザクション署名の説明はどれか。</div>", "choices": {"ア": "携帯端末からの送金取引の場合，金融機関から利用者の登録メールアドレスに送金用のワンタイムパスワードを送信する。", "イ": "特定認証業務の認定を受けた認証局が署名したデジタル証明書をインターネットバンキングでの利用者認証に用いることによって，ログインパスワードが漏えいした際の不正ログインを防止する。", "ウ": "利用者が送金取引時に，\"送金操作を行うPCとは別のデバイスに振込先口座番号などの取引情報を入力して表示された値\"をインターネットバンキングに送信する。", "エ": "ログイン時に，送金操作を行うPCとは別のデバイスによって，一定時間だけ有効なログイン用のワンタイムパスワードを算出し，インターネットバンキングに送信する。"}, "choices_html": {"ア": "携帯端末からの送金取引の場合，金融機関から利用者の登録メールアドレスに送金用のワンタイムパスワードを送信する。", "イ": "特定認証業務の認定を受けた認証局が署名したデジタル証明書をインターネットバンキングでの利用者認証に用いることによって，ログインパスワードが漏えいした際の不正ログインを防止する。", "ウ": "利用者が送金取引時に，\"送金操作を行うPCとは別のデバイスに振込先口座番号などの取引情報を入力して表示された値\"をインターネットバンキングに送信する。", "エ": "ログイン時に，送金操作を行うPCとは別のデバイスによって，一定時間だけ有効なログイン用のワンタイムパスワードを算出し，インターネットバンキングに送信する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>トランザクション署名</strong>(Transaction Signature)とは、マルウェアの影響を受けないハードウェアトークンが、振込先口座番号や振込金額といった取引内容を入力として専用の署名コードを生成し、そのコードを用いて取引の正当性を確認する仕組みです。MITB(Man-in-the-Browser)攻撃の対策として使用されます。<br/><br/>金融機関から提供されるハードウェアトークンは、利用者が振込先口座番号や振込金額を入力すると、その内容に基づいた署名を生成する仕組みになっています。利用者は、Webブラウザ上で振込先情報と金額に加えて、トークンが作成した署名文字列を入力し、Webサーバに送信します。Webサーバ側では、送信された情報と署名の整合性を確認し、正しい場合にのみ振込処理を実施します。マルウェアはトークンが生成する署名を入手できないため、もし通信途中で内容が書き換えられても、Webサーバが不正と判断して処理を拒否することでMITB攻撃を防止できます。<div class=\"img_margin\"><img alt=\"07.png/image-size:550×279\" height=\"279\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/07.png\" style=\"max-width: 100%; height: auto;\" width=\"550\"/></div>トランザクション署名は、振込金額・振込先口座等のトランザクション情報からトークンによって生成される署名であるため、正しい説明は「ウ」です。<ul><li class=\"lia\">二要素認証の説明です。</li><li class=\"lii\">クライアント認証の説明です。トランザクション署名は不正ログインを防止する技術ではありません。</li><li class=\"liu\">正しい。トランザクション署名の説明です。</li><li class=\"lie\">トークンを使ったワンタイムパスワードの仕組みです。トランザクション署名は利用者からの要求を認証するための技術であり、不正ログインを防止する技術ではありません。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q8", "session": "支援士 R5秋", "gap": 3, "num": 8, "topic": "SAMLの説明はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "SAML(Security Assertion Markup Language)の説明はどれか。", "mondai_html": "<div id=\"mondai\">SAML(Security Assertion Markup Language)の説明はどれか。</div>", "choices": {"ア": "Webサーバにある利用者のリソースに，Webサーバに限らない他のサーバが利用者に代わってアクセスすることを許可するための認証プロトコル", "イ": "異なるインターネットドメイン間でセキュリティ情報を共有してシングルサインオンに利用するための，XMLをベースにした標準規格", "ウ": "利用者IDとしてURL又はXRI(Extensible Resource Identifier)だけを使用することができ，一つの利用者IDで様々なWebサイトにログインできる仕組み", "エ": "利用者が文書やデータの属性情報や論理構造を定義する言語であるSGMLを，インターネット用に最適化したもの"}, "choices_html": {"ア": "Webサーバにある利用者のリソースに，Webサーバに限らない他のサーバが利用者に代わってアクセスすることを許可するための認証プロトコル", "イ": "異なるインターネットドメイン間でセキュリティ情報を共有してシングルサインオンに利用するための，XMLをベースにした標準規格", "ウ": "利用者IDとしてURL又はXRI(Extensible Resource Identifier)だけを使用することができ，一つの利用者IDで様々なWebサイトにログインできる仕組み", "エ": "利用者が文書やデータの属性情報や論理構造を定義する言語であるSGMLを，インターネット用に最適化したもの"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SAML</strong>(Security Assertion Markup Language：サムエル)は、XMLベースのメッセージのやり取りによって、複数のシステムやサービスの間で認証情報、属性情報、権限の認可情報を交換するための仕様です。標準化団体OASISによって策定されていて、2022年現在の最新バージョンは2005年にリリースのSAML2.0です。主に複数のドメインにまたがったセキュアなシングルサインオンを実現するための仕組みとして使用されています。<br/><br/>XMLをベースとシングルサインオンいう2点からから「イ」がSAMLの説明だと判断できます。<ul><li class=\"lia\">OAuthの説明です。</li><li class=\"lii\">正しい。SAMLの説明です。</li><li class=\"liu\">OpenIDの説明です。</li><li class=\"lie\">HTML(Hypertext Markup Language)の説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q9", "session": "支援士 R5秋", "gap": 3, "num": 9, "topic": "公開鍵基盤におけるCPSに該当するもの", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "公開鍵基盤におけるCPS(Certification Practice Statement)に該当するものはどれか。", "mondai_html": "<div id=\"mondai\">公開鍵基盤におけるCPS(Certification Practice Statement)に該当するものはどれか。</div>", "choices": {"ア": "認証局が発行するデジタル証明書の所有者が策定したセキュリティ宣言", "イ": "認証局でのデジタル証明書発行手続を代行する事業者が策定したセキュリティ宣言", "ウ": "認証局の認証業務の運用などに関する詳細を規定した文書", "エ": "認証局を監査する第三者機関の運用などに関する詳細を規定した文書"}, "choices_html": {"ア": "認証局が発行するデジタル証明書の所有者が策定したセキュリティ宣言", "イ": "認証局でのデジタル証明書発行手続を代行する事業者が策定したセキュリティ宣言", "ウ": "認証局の認証業務の運用などに関する詳細を規定した文書", "エ": "認証局を監査する第三者機関の運用などに関する詳細を規定した文書"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">デジタル証明書を発行する認証局では、CP(Certificate Policy)とCPS(Certification Practice Statement)を作成して管理し、必要に応じて利用者に公開しています。CPは「証明書ポリシー」、CPSは「認証局運用規定」です。<dl><dt>CP（Certificate Policy）</dt><dd>認証局の運用方式、信頼性・安全性を対外的に示す文書</dd><dt>CPS（Certification Practice Statement）</dt><dd>運用方針の実施手順を定めた認証局運用規程。デジタル証明書の利用者、適用範囲、証明書申請手続方法、失効や効力停止手続方法、キーペア生成方法、秘密鍵の受渡方法などが記載される</dd></dl>CPは方針を示すのに対して、CPSは手順を示します。CPSのほうがより具体的に記載されているとイメージしてください。また、CPとCPSを合わせてCAの認証業務に関する運営方針として位置付けている組織もあります。なお、Certificationは「認証」、Practiceは「訓練、練習」、Statement「声明、計算書」と訳されるため、これらの言葉を合わせると、「認証練習書」とも訳せるため単語一つひとつの訳を繋げて言葉にしてみると正解に近づけるかと思います。<br/><br/>したがって「ウ」の説明が適切です。<ul><li class=\"lia\">CPSは認証局が作成・公表する文書です。デジタル証明書の所有者が作成するものではありません。</li><li class=\"lii\">CPSは認証局が作成・公表する文書です。代行事業者が作成するものではありません。</li><li class=\"liu\">正しい。CPSは、ポリシー(CP)に基づき認証局がどのようにして証明書を発行・管理するかを詳細に説明した文書です。</li><li class=\"lie\">CPSは認証局自身の運用を規定した文書です。認証局を監査する第三者機関の運用について規定したものではありません。</li></ul></div>", "past_history": ["安全確保支援士 R7春期 問9"], "hist_count": 2}, {"id": "sc_05_aki_q10", "session": "支援士 R5秋", "gap": 3, "num": 10, "topic": "NOTICEに関する記述", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "総務省及び国立研究開発法人情報通信研究機構(NICT)が2019年2月から実施している取組\"NOTICE\"に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">総務省及び国立研究開発法人情報通信研究機構(NICT)が2019年2月から実施している取組\"NOTICE\"に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "NICTが運用するダークネット観測網において，マルウェアに感染したIoT機器から到達するパケットを分析した結果を当該機器の製造者に提供し，国内での必要な対策を促す。", "イ": "国内のグローバルIPアドレスを有するIoT機器に対して，容易に推測されるパスワードを入力することなどによって，サイバー攻撃に悪用されるおそれのある機器を調査し，インターネットサービスプロバイダを通じて当該機器の利用者に注意喚起を行う。", "ウ": "国内の利用者からの申告に基づき，利用者の所有するIoT機器に対して無料でリモートから，侵入テストやOSの既知の脆弱性の有無の調査を実施し，結果を通知するとともに，利用者が自ら必要な対処ができるよう支援する。", "エ": "製品のリリース前に，不要にもかかわらず開放されているポートの存在，パスワードの設定漏れなど約200項目の脆弱性の有無を調査できるテストベッドを国内のIoT機器製造者向けに公開し，市場に流通するIoT機器のセキュリティ向上を目指す。"}, "choices_html": {"ア": "NICTが運用するダークネット観測網において，マルウェアに感染したIoT機器から到達するパケットを分析した結果を当該機器の製造者に提供し，国内での必要な対策を促す。", "イ": "国内のグローバルIPアドレスを有するIoT機器に対して，容易に推測されるパスワードを入力することなどによって，サイバー攻撃に悪用されるおそれのある機器を調査し，インターネットサービスプロバイダを通じて当該機器の利用者に注意喚起を行う。", "ウ": "国内の利用者からの申告に基づき，利用者の所有するIoT機器に対して無料でリモートから，侵入テストやOSの既知の脆弱性の有無の調査を実施し，結果を通知するとともに，利用者が自ら必要な対処ができるよう支援する。", "エ": "製品のリリース前に，不要にもかかわらず開放されているポートの存在，パスワードの設定漏れなど約200項目の脆弱性の有無を調査できるテストベッドを国内のIoT機器製造者向けに公開し，市場に流通するIoT機器のセキュリティ向上を目指す。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_10.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>NOTICE</strong>(National Operation Towards IoT Clean Environment)は、総務省、国立研究開発法人情報通信研究機構(NICT)およびインターネットプロバイダが連携し、IoT機器へのアクセスによる、サイバー攻撃に悪用されるおそれのある機器の調査及び当該機器の利用者への注意喚起を行う取組です（※NOTICE Webサイトより引用、以下4つの取組も同じ）。<br/><br/>\"NOTICE\"の取り組みは、次の手順に基づいて行われています。<dl><dt>機器調査</dt><dd>NICTは、インターネット上のIoT機器に容易に推測されるパスワードを入力することなどにより、サイバー攻撃に悪用されるおそれのある機器を調査し、当該機器の情報をインターネットプロバイダに通知する</dd><dt>注意喚起</dt><dd>インターネットプロバイダは、NICTから受け取った情報を元に当該機器の利用者を特定し、電子メールや郵送などにより注意喚起を行う</dd><dt>設定変更等</dt><dd>注意喚起を受けた利用者は、注意喚起の内容やNOTICEサポートセンターサイトの説明などに従い、パスワード設定の変更、ファームウェアの更新など適切なセキュリティ対策を行う</dd><dt>ユーザーサポート</dt><dd>NOTICEサポートセンターは、ウェブサイトや電話による問合せ対応を通じて利用者に適切なセキュリティ対策等を案内する</dd></dl>\"NOTICE\"は、インターネット上からアクセス可能なルータ、ウェブカメラ、センサーなどのIoT機器に対して、\"admin\"や\"root\"のような容易に推測可能なID・パスワード（約600通り）を入力し、脆弱性が見つかった場合に利用者にそれを通知する取り組みです。したがって「イ」の記述が適切です。<ul><li class=\"lia\">DAEDALUS（ダイダロス）の取組です。</li><li class=\"lii\">正しい。NOTICEの取組です。</li><li class=\"liu\">セキュリティベンダーが提供するリモート診断ツールの説明です。NOTICEでは利用者からの依頼がなくても、国立研究開発法人情報通信研究機構法に基づき対象のIPアドレス範囲を勝手に調査します。</li><li class=\"lie\">NICTが提供する総合テストベッドの説明です。</li></ul>参考URL: ABOUT NOTICE<br/><a href=\"https://notice.go.jp/\" target=\"_blank\">https://notice.go.jp/</a></div>", "past_history": ["安全確保支援士 R2秋期 問6", "安全確保支援士 R4春期 問8"], "hist_count": 3}, {"id": "sc_05_aki_q12", "session": "支援士 R5秋", "gap": 3, "num": 12, "topic": "脆弱性管理，測定，評価を自動化する基準", "subcat": "セキュリティ技術評価", "category": "情報セキュリティ", "mondai": "脆弱性管理，測定，評価を自動化するためにNISTが策定した基準はどれか。", "mondai_html": "<div id=\"mondai\">脆弱性管理，測定，評価を自動化するためにNISTが策定した基準はどれか。</div>", "choices": {"ア": "FIPS(Federal Information Processing Standards)", "イ": "SCAP(Security Content Automation Protocol)", "ウ": "SIEM(Security Information and Event Management)", "エ": "SOAR(Security Orchestration，Automation and Response)"}, "choices_html": {"ア": "FIPS(Federal Information Processing Standards)", "イ": "SCAP(Security Content Automation Protocol)", "ウ": "SIEM(Security Information and Event Management)", "エ": "SOAR(Security Orchestration，Automation and Response)"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_12.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">FIPSは、NISTが制定しているアメリカ合衆国の情報処理標準規格群です。領域ごとに様々なセキュリティ対策基準が規定されています。支援士試験では、暗号モジュールに関する要求事項であるFIPS 140-3がよく登場します。</li><li class=\"lii\">正しい。<strong>SCAP</strong>(エスキャップ)とは、NIST策定によるセキュリティ設定共通化手順のことで、セキュリティ情報をマシンや人が伝達する際のフォーマットを標準化したものです。2024年3月現在で利用可能な最新バージョンは「SCAP1.3」です。脆弱性識別子であるCVE、セキュリティ設定の識別子であるCCE、脆弱性の深刻度を評価するCVSSなど、①言語、②レポート形式、③識別スキーム、④測定および採点システム、⑤完全性の5つのカテゴリ、12の要素で構成されています。</li><li class=\"liu\">SIEMは、FWやプロキシサーバ、CASBなどのログデータを収集・分析して、攻撃を検知する機能を高度化したセキュリティ機器です。主要機能として、①統合ログ管理サーバと同等の機能・ログの検索、②異常検知、③アラート通知／レポート出力機能があります。</li><li class=\"lie\">SOARは、サイバー攻撃を監視する専任組織であるSOCにおける、監視業務やインシデント対応手順の自動化、効率化を進める体制や技術、ソリューションのことを言います。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q13", "session": "支援士 R5秋", "gap": 3, "num": 13, "topic": "DNSSEC", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "DNSSECに関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">DNSSECに関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "権威DNSサーバが，DNS問合せに対する応答時に，リソースレコードを公開鍵暗号方式で暗号化することによって，通信経路上の盗聴を防ぐ。", "イ": "権威DNSサーバが，リソースレコードの受信時にデジタル署名を検証することによって，データの作成元の正当性とデータの完全性を確認する。", "ウ": "リゾルバが，DNS問合せに対する応答時に，リソースレコードを公開鍵暗号方式で暗号化することによって，通信経路上の盗聴を防ぐ。", "エ": "リゾルバが，リソースレコードの受信時にデジタル署名を検証することによって，データの作成元の正当性とデータの完全性を確認する。"}, "choices_html": {"ア": "権威DNSサーバが，DNS問合せに対する応答時に，リソースレコードを公開鍵暗号方式で暗号化することによって，通信経路上の盗聴を防ぐ。", "イ": "権威DNSサーバが，リソースレコードの受信時にデジタル署名を検証することによって，データの作成元の正当性とデータの完全性を確認する。", "ウ": "リゾルバが，DNS問合せに対する応答時に，リソースレコードを公開鍵暗号方式で暗号化することによって，通信経路上の盗聴を防ぐ。", "エ": "リゾルバが，リソースレコードの受信時にデジタル署名を検証することによって，データの作成元の正当性とデータの完全性を確認する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>DNSSEC</strong>とは、DNSのセキュリティを強化するための拡張仕様で、権威DNSサーバ側で保存しているリソースレコードにデジタル署名を施し、リゾルバ側で送られてきたデジタル署名の検証を行うことで、リソースレコードの作成元とデータの完全性を証明する仕組みです。<ol><li class=\"maru1\">ゾーンの管理者は、秘密鍵と
