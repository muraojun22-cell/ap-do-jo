"lie\">パスワードリスト攻撃の説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q7", "session": "支援士 R4秋", "gap": 5, "num": 7, "topic": "シングルサインオンに関する記述", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "シングルサインオン(SSO)に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">シングルサインオン(SSO)に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "SAML方式では，インターネット上の複数のWebサイトにおけるSSOを，IdP(Identity Provider)で自動生成されたURL形式の1人一つの利用者IDで実現する。", "イ": "エージェント方式では，クライアントPCに導入したエージェントがSSOの対象システムのログイン画面を監視し，ログイン画面が表示されたら認証情報を代行入力する。", "ウ": "代理認証方式では，SSOの対象サーバにSSOのモジュールを組み込む必要があり，システムの改修が必要となる。", "エ": "リバースプロキシ方式では，SSOを利用する全てのトラフィックがリバースプロキシサーバに集中し，リバースプロキシサーバが単一障害点になり得る。"}, "choices_html": {"ア": "SAML方式では，インターネット上の複数のWebサイトにおけるSSOを，IdP(Identity Provider)で自動生成されたURL形式の1人一つの利用者IDで実現する。", "イ": "エージェント方式では，クライアントPCに導入したエージェントがSSOの対象システムのログイン画面を監視し，ログイン画面が表示されたら認証情報を代行入力する。", "ウ": "代理認証方式では，SSOの対象サーバにSSOのモジュールを組み込む必要があり，システムの改修が必要となる。", "エ": "リバースプロキシ方式では，SSOを利用する全てのトラフィックがリバースプロキシサーバに集中し，リバースプロキシサーバが単一障害点になり得る。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">ユーザー認証を一度受けるだけで許可された複数サービスへのアクセスを認証するシングルサインオン(Single Sign On：SSO)には、エージェント方式、代理認証方式、リバースプロキシ方式、認証連携を用いる方式などがあります。<dl><dt>エージェント方式</dt><dd>SSOの対象となるサーバすべてにエージェントと呼ばれるモジュールをインストールする必要があります。利用者は認証サーバから認証済資格情報が含まれたcookieを受け取り、その後はSSOの対象サーバ内のエージェントが利用者の認証済みcookieを確認してサービスを許可します。ただしそのcookieが有効な同一ドメイン内でしか利用できません</dd><dt>代理認証方式</dt><dd>クライアントPCにインストールしたエージェントにIDやパスワードを保持させておき、利用するサービスのログイン画面が起動した時にエージェントが必要な認証情報を代理で入力する方式です</dd><dt>リバースプロキシ方式</dt><dd>リバースプロキシと呼ばれる中継サーバをサーバ群の前段に設置し、すべての認証をこのサーバを経由して行う方式です。ただしアクセスが集中するため、このリバースプロキシ自体がシステム全体に障害が波及する単一障害点となるおそれがあります。そのため同一機能を持つサーバを複数台用意するなどの冗長化を施す必要があります</dd><dt>認証連携方式</dt><dd>認証連携では、ID等の発行者とサービス提供者との間で利用者の認証情報や付随する属性情報をやり取りし、運用ポリシーが異なる組織やドメイン間でSSOを行います。認証連携を実現する技術にはSAML(Security Assertion Markup Language)やOpenID、OpenID Connectなどがあります</dd></dl><ul><li class=\"lia\">OpenID方式の説明です。</li><li class=\"lii\">代理認証方式の説明です。</li><li class=\"liu\">エージェント方式の説明です。</li><li class=\"lie\">正しい。</li></ul>参考：SAML、OPENID、OpenID Connectの違い<dl><dt>SAML方式</dt><dd>認証・認可の情報を提供するIdP(Identity Provider)が、ユーザーの認証結果をもとにSAMLアサーション（IDなどの認証情報や属性情報をXMLで記載したもの）を発行し、そのSAMLアサーションをサービスの提供を行うSP(Service Provider)とやり取りしてSSOを行う</dd><dt>OpenID方式</dt><dd>OP(OpenID Provider)が利用者のアカウント管理や認証を行い、URL形式の利用者ID(Claimed Identifier)などOpenIDで使用する識別子を発行する。これらをもとにOPから利用者の認証情報を取得したRP(Relying Party)がサービスを提供することでSSOを行う</dd><dt>OpenID Connect方式</dt><dd>OPから利用者に発行された認可コードがRPに送られ、RPはこの認可コードでOPにアクセスする。認可コードの検証後RPはOPからアクセストークンと、認証に関する情報をJWT(JSON Web Token)で記載したIDトークンを受け取り、これらをやり取りしてサービスを提供することでSSOを行う。APIアクセス認可のフレームワークであるOAuth2.0をベースとした、OpenIDの後継仕様です。</dd></dl></div>", "past_history": ["安全確保支援士 R6秋期 問8"], "hist_count": 2}, {"id": "sc_04_aki_q8", "session": "支援士 R4秋", "gap": 5, "num": 8, "topic": "前方秘匿性の性質はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "前方秘匿性(Forward Secrecy)の説明として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">前方秘匿性(Forward Secrecy)の説明として，適切なものはどれか。</div>", "choices": {"ア": "鍵交換に使った秘密鍵が漏えいしたとしても，それより前の暗号文は解読されない。", "イ": "時系列データをチェーンの形で結び，かつ，ネットワーク上の複数のノードで共有するので，データを改ざんできない。", "ウ": "対となる二つの鍵の片方の鍵で暗号化したデータは，もう片方の鍵でだけ復号できる。", "エ": "データに非可逆処理をして生成される固定長のハッシュ値からは，元のデータを推測できない。"}, "choices_html": {"ア": "鍵交換に使った秘密鍵が漏えいしたとしても，それより前の暗号文は解読されない。", "イ": "時系列データをチェーンの形で結び，かつ，ネットワーク上の複数のノードで共有するので，データを改ざんできない。", "ウ": "対となる二つの鍵の片方の鍵で暗号化したデータは，もう片方の鍵でだけ復号できる。", "エ": "データに非可逆処理をして生成される固定長のハッシュ値からは，元のデータを推測できない。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>前方秘匿性</strong>とは、暗号化鍵の共有に使われている秘密鍵が漏えいしたとしても、過去に暗号化された通信データは解読されないという鍵交換プロトコルに求められる性質です。<br/><br/>暗号通信において暗号鍵の元となる情報を共有する場合に、送信側は受信側の公開鍵で暗号化して送信し、受信側で秘密鍵で送って鍵を共有する方式を考えると、秘密鍵が漏えいした際に過去の通信データより暗号通信に使われた鍵を割り出すことができ、過去の通信データが解読されてしまうおそれがあります。公開鍵暗号でなくても長期的に同じ鍵ペアを使う場合も同様です。過去のデータの安全性が脅かされることになるため、鍵交換には前方秘匿性を有するプロトコルを使用するのが推奨されます。<br/><br/>前方秘匿性をもつ鍵交換プロトコルには以下の2点が要求されます。<ul><li>データを暗号するための鍵から別の鍵を生成しない</li><li>暗号鍵の基となる情報は一度だけの使い捨てとする</li></ul>実際に2014年にはOPEN SSLの脆弱性を突いて秘密鍵が漏えいし得るバグ「ハートブリード」が確認されたため、前方秘匿性が強く求められるようになっています。その流れを受けて、TLS1.3で使用できる鍵交換プロトコルは、前方秘匿性を有するDHE（ディフィー・ヘルマン鍵共有・一時的）とECDHE（楕円曲線ディフィー・ヘルマン鍵共有・一時的）に限定されています。<ul><li class=\"lia\">正しい。前方秘匿性の性質です。</li><li class=\"lii\">ブロックチェーンで構築された分散型台帳の性質です。</li><li class=\"liu\">公開鍵暗号方式の性質です。</li><li class=\"lie\">ハッシュ関数に求められる原像計算困難性（一方向性）の説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q9", "session": "支援士 R4秋", "gap": 5, "num": 9, "topic": "セキュリティ評価の標準規格", "subcat": "セキュリティ技術評価", "category": "情報セキュリティ", "mondai": "IT製品及びシステムが，必要なセキュリティレベルを満たしているかどうかについて，調達者が判断する際に役立つ評価結果を提供し，独立したセキュリティ評価結果間の比較を可能にするための規格はどれか。", "mondai_html": "<div id=\"mondai\">IT製品及びシステムが，必要なセキュリティレベルを満たしているかどうかについて，調達者が判断する際に役立つ評価結果を提供し，独立したセキュリティ評価結果間の比較を可能にするための規格はどれか。</div>", "choices": {"ア": "ISO/IEC 15408", "イ": "ISO/IEC 27002", "ウ": "ISO/IEC 27017", "エ": "ISO/IEC 30147"}, "choices_html": {"ア": "ISO/IEC 15408", "イ": "ISO/IEC 27002", "ウ": "ISO/IEC 27017", "エ": "ISO/IEC 30147"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">正しい。ISO/IEC 15408は、IT関連製品や情報システムのセキュリティ機能の適切性・確実性について客観的に評価するための基準です。日本ではJIS X 5070として定められています。IPAが認証機関として運営しているITセキュリティ評価及び認証制度(JISEC)は、このISO/IEC 15408に基づいて評価・認証が行われ、政府調達などで利用されています。</li><li class=\"lii\">ISO/IEC 27002は、情報セキュリティマネジメントシステム(ISMS)に関する規格群ISO/IEC 27000シリーズの一つです。ISMSの確立・実施・維持・継続的な改善を行うための要求事項をまとめたのがISO/IEC 27001であり、このISO/IEC 27001に基づいて実施されるISMSの過程で選定・実践すべき情報セキュリティ管理策の規範がISO/IEC 27002です。ISO/IEC 15408がセキュリティ機能の技術的側面を対象としているのに対し、ISO/IEC 27002はセキュリティ運用管理面を対象としています。</li><li class=\"liu\">ISO/IEC 27017は、ISO/IEC 27002をベースとしたクラウド環境における情報セキュリティ管理策を実践するための規範です。</li><li class=\"lie\">ISO/IEC 30147は、IoT製品やサービスの安全・安心を確保するための日本発の国際規格で、システムのライフサイクルプロセスについての規格であるISO/IEC/IEEE 15288を適用・補完して策定されました。セキュリティ・信頼性・プライバシー保護・レジリエンス（脅威予測・攻撃に対する適切な対応・迅速な回復等を行いリスクに適応する能力）などにおいて関係者の期待に応える能力（これをトラストワージネス：Trustworthinessという）を、IoT製品やサービスに実装し維持するためのライフサイクルプロセスの規格となっています。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q10", "session": "支援士 R4秋", "gap": 5, "num": 10, "topic": "CASBを利用した際の効果はどれか", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "セキュリティ対策として，CASB(Cloud Access Security Broker)を利用した際の効果はどれか。", "mondai_html": "<div id=\"mondai\">セキュリティ対策として，CASB(Cloud Access Security Broker)を利用した際の効果はどれか。</div>", "choices": {"ア": "クラウドサービスプロバイダが，運用しているクラウドサービスに対して，CASBを利用してDDoS攻撃対策を行うことによって，クラウドサービスの可用性低下を緩和できる。", "イ": "クラウドサービスプロバイダが，クラウドサービスを運用している施設に対して，CASBを利用して入退室管理を行うことによって，クラウドサービス運用環境への物理的な不正アクセスを防止できる。", "ウ": "クラウドサービス利用組織の管理者が，従業員が利用しているクラウドサービスに対して，CASBを利用して脆弱性診断を行うことによって，脆弱性を特定できる。", "エ": "クラウドサービス利用組織の管理者が，従業員が利用しているクラウドサービスに対して，CASBを利用して利用状況の可視化を行うことによって，許可を得ずにクラウドサービスを利用している者を特定できる。"}, "choices_html": {"ア": "クラウドサービスプロバイダが，運用しているクラウドサービスに対して，CASBを利用してDDoS攻撃対策を行うことによって，クラウドサービスの可用性低下を緩和できる。", "イ": "クラウドサービスプロバイダが，クラウドサービスを運用している施設に対して，CASBを利用して入退室管理を行うことによって，クラウドサービス運用環境への物理的な不正アクセスを防止できる。", "ウ": "クラウドサービス利用組織の管理者が，従業員が利用しているクラウドサービスに対して，CASBを利用して脆弱性診断を行うことによって，脆弱性を特定できる。", "エ": "クラウドサービス利用組織の管理者が，従業員が利用しているクラウドサービスに対して，CASBを利用して利用状況の可視化を行うことによって，許可を得ずにクラウドサービスを利用している者を特定できる。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_10.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CASB</strong>(Cloud Access Security Broker：キャスビー)は、利用者とクラウドサービスプロバイダとの間に単一のコントロールポイントを設けて、クラウドサービス利用の「可視化」「コンプライアンス」「データセキュリティ」「脅威防御」を提供する仕組みです。近年は働き方改革やテレワークの促進でクラウドサービスを活用する流れが加速していますが、それに伴いシャドーIT（承認を経ずに使われている端末やサービス）がセキュリティ上の問題となっています。CASBを導入することで、組織の管理者は、<em class=\"m\">組織の許可を得ずに業務にクラウドサービスを利用している者を発見し、管理することが可能となります</em>。<br/><br/>利用者の端末にインストールし、それを介してクラウドサービスを利用させるタイプや、インターネットアクセスの際には必ず経由してアクセスさせるプロキシ型、クラウドサービスプロバイダ側に設置することで管理対象外の端末の使用をも検知できるリバースプロキシ型などの種類があります。<br/><br/>したがって「エ」が適切です。</div>", "past_history": ["安全確保支援士 R3春期 問11", "安全確保支援士 R6春期 問11"], "hist_count": 3}, {"id": "sc_04_aki_q11", "session": "支援士 R4秋", "gap": 5, "num": 11, "topic": "クリックジャッキング攻撃対策", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "クリックジャッキング攻撃に有効な対策はどれか。", "mondai_html": "<div id=\"mondai\">クリックジャッキング攻撃に有効な対策はどれか。</div>", "choices": {"ア": "cookieに，HttpOnly属性を設定する。", "イ": "cookieに，Secure属性を設定する。", "ウ": "HTTPレスポンスヘッダーに，Strict-Transport-Securityを設定する。", "エ": "HTTPレスポンスヘッダーに，X-Frame-Optionsを設定する。"}, "choices_html": {"ア": "cookieに，HttpOnly属性を設定する。", "イ": "cookieに，Secure属性を設定する。", "ウ": "HTTPレスポンスヘッダーに，Strict-Transport-Securityを設定する。", "エ": "HTTPレスポンスヘッダーに，X-Frame-Optionsを設定する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_11.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>クリックジャッキング攻撃</strong>は、攻撃者が用意したWebページの前面に透明化した別のWebページを重ねることでユーザーを視覚的にだまし、正常に視認できるWebページ上をクリックさせることで、透明化したWebページのコンテンツを操作させる攻撃です。<div class=\"img_margin\"><img alt=\"11.png/image-size:184×210\" height=\"210\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/11.png\" style=\"max-width: 100%; height: auto;\" width=\"184\"/></div>攻撃者が用意したページに利用されるおそれがあるのは、ログイン機能のある登録制サイトのユーザー情報の設定変更を行うページやユーザーが投稿を行うページなどです。攻撃者はクリックにより操作が行われる外部サイトのページをiframe要素やframe要素（以下、フレーム要素という）などで読み込み、不透明度を設定するCSSのopacityプロパティなどで透明化し、悪意のあるページに覆いかぶさるように表示します。見かけ上はアクション操作を行うページには見えないので、ユーザーは単なる閲覧ページでクリックを行っただけのつもりが、フレーム上のクリックと判定され意図しない操作（会員情報の変更や投稿サイトへの投稿）が行われる被害を受けることになります。<br/><br/>クリックジャッキング攻撃を防ぐために用意されているHTTPレスポンスヘッダー―が「X-Frame-Options」です。X-Frame-Optionsが設定されたWebページは、他ドメインサイト内のフレーム要素に読み込まれることが禁止されます。フレーム要素に埋め込まれることを想定していないWebページでは、X-Frame-Optionsを設定しておくことがクリックジャッキング攻撃で不正操作されることへの対策となります。<br/><br/>なお、X-Frame-Optionsに設定することのできる値は次の2つです。<dl><dt>SAMEORIGIN</dt><dd>同じオリジン（スキーム、ホスト名、ポート番号の組合せ）のページに限りフレーム内に表示することを許可する</dd><dt>DENY</dt><dd>フレーム内に表示することを許可しない</dd></dl><ul><li class=\"lia\">HttpOnly属性はcookieに指定する属性で、そのcookieがHTML内のスクリプトからアクセスできないように制限するものです。クロスサイトスクリプティングによるcookieの漏えいを防ぐことができますが、cookie漏えい以外の被害を防ぐことはできません。</li><li class=\"lii\">Secure属性はcookieに指定する属性で、HTTPS通信であるときのみブラウザからサーバにそのcookieが送信されるように制限するものです。盗聴や改ざんの可能性があるHTTPのURLでアクセスした場合にcookieを送信しないようにSecure属性を指定します。</li><li class=\"liu\">Strict-Transport-Securityは、WebサイトにHTTPSで接続することをWebブラウザに強制するHTTPレスポンスヘッダーです。HSTS(HTTP Strict Transport Security)とも呼ばれます。HTTPアクセス(非暗号化通信)してきた人に対する中間者攻撃を防ぐために指定されます。</li><li class=\"lie\">正しい。X-Frame-Optionsは、Webページがフレーム要素に読み込まれることを禁止するためのHTTPレスポンスヘッダーです。</li></ul></div>", "past_history": ["安全確保支援士 R6秋期 問14"], "hist_count": 2}, {"id": "sc_04_aki_q12", "session": "支援士 R4秋", "gap": 5, "num": 12, "topic": "ブロックチェーンに関する記述", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "ブロックチェーンに関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">ブロックチェーンに関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "RADIUSを必須の技術として，参加者の利用者認証を一元管理するために利用する。", "イ": "SPFを必須の技術として，参加者間で電子メールを送受信するときに送信元の真正性を確認するために利用する。", "ウ": "楕円曲線暗号を必須の技術として，参加者間のP2P(Peer to Peer)通信を暗号化するために利用する。", "エ": "ハッシュ関数を必須の技術として，参加者がデータの改ざんを検出するために利用する。"}, "choices_html": {"ア": "RADIUSを必須の技術として，参加者の利用者認証を一元管理するために利用する。", "イ": "SPFを必須の技術として，参加者間で電子メールを送受信するときに送信元の真正性を確認するために利用する。", "ウ": "楕円曲線暗号を必須の技術として，参加者間のP2P(Peer to Peer)通信を暗号化するために利用する。", "エ": "ハッシュ関数を必須の技術として，参加者がデータの改ざんを検出するために利用する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_12.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ブロックチェーン</strong>は、仮想通貨(暗号資産)の基盤技術であり、いくつかの取引データをまとめた\"ブロック\"という単位をハッシュ関数で鎖のように繋ぐことによって、台帳を形成し、P2Pネットワークで管理する技術です。<strong>分散型台帳技術</strong>とも呼ばれます。<br/><br/>日本ブロックチェーン協会では、(広義の)ブロックチェーンを次のように定義しています。<br/>「電子署名とハッシュポインタを使用し改竄検出が容易なデータ構造を持ち、且つ、当該データをネットワーク上に分散する多数のノードに保持させることで、高可用性及びデータ同一性等を実現する技術を広義のブロックチェーンと呼ぶ」<br/><br/>ブロックには、取引(トランザクション)データ、前ブロックのハッシュ値、ナンス(nonce)値などが含まれ、鎖のように連結されています。<div class=\"img_margin\"><img alt=\"12.png/image-size:564×162\" height=\"162\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/12.png\" style=\"max-width: 100%; height: auto;\" width=\"564\"/></div>あるブロックのハッシュ値は、①前ブロックのハッシュ値、②取引データ及び③ナンス値を基に生成されるため、1か所の取引データを改ざんすると、それ以降のすべてのブロックのハッシュ値が変わってきます（これら全てを正しく書き換えることはほぼ不可能な仕組みになっています）。参加者は、ハッシュ値の整合性を確認することによって、改ざんの有無を検知できるようになっています。ブロックチェーンでは、ハッシュ関数の強度が台帳の堅牢性に直結するのでSHA-256/SHA-512などの十分に強度のある方式が使用されています。<br/><br/>したがって「エ」が適切な記述です。</div>", "past_history": ["安全確保支援士 R2秋期 問5", "安全確保支援士 H30秋期 問3"], "hist_count": 3}, {"id": "sc_04_aki_q13", "session": "支援士 R4秋", "gap": 5, "num": 13, "topic": "IPsec", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "PCからサーバに対し，IPv6を利用した通信を行う場合，ネットワーク層で暗号化を行うのに利用するものはどれか。", "mondai_html": "<div id=\"mondai\">PCからサーバに対し，IPv6を利用した通信を行う場合，ネットワーク層で暗号化を行うのに利用するものはどれか。</div>", "choices": {"ア": "IPsec", "イ": "PPP", "ウ": "SSH", "エ": "TLS"}, "choices_html": {"ア": "IPsec", "イ": "PPP", "ウ": "SSH", "エ": "TLS"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>IPv6</b>は、IPv4に代わるものとして策定された次世代版となる通信プロトコルです。IPv4では2<sup>32</sup>(＝約42億)個であったIPアドレスが、2<sup>128</sup>(＝約340澗)個まで使えるようなったのが大きな特徴の一つですが、それ以外にも、これまでは上位の層で補完しなければならなかったユーザー認証およびパケットの暗号化をIP層で行う<b>IPsec</b>(Security Architecture for IP)の機能がサポートされているなど機能強化が図られています。<ul><li class=\"lia\">正しい。IPsecは、IP(Internet Protocol)を拡張してセキュリティを高め、改ざんの検知、通信データの暗号化、送信元の認証などの機能をOSI基本参照モデルのネットワーク層レベル(TCP/IPモデルではインターネット層)で提供するプロトコルです。</li><li class=\"lii\">Point-to-PointProtocolの略。電話回線を通じてコンピュータをネットワークに接続するダイヤルアップ接続でよく使われる、2点間を接続してデータ通信を行うための通信プロトコルです。</li><li class=\"liu\">Secure Shellの略。公開鍵暗号や認証の技術を用いて、遠隔地にあるコンピュータ（リモートコンピュータ）との間で安全にリモート通信をするためのプロトコルです。POP3やFTPなどネットワーク上に平文のパスワードが流れてしまう既存のプロトコルを安全に利用する技術として広く利用されています。</li><li class=\"lie\">Transport Layer Securityの略。通信の暗号化、デジタル証明書を利用した改ざん検知、ノード認証を含む統合セキュアプロトコルです。「Transport Layer」の名称通りトランスポート層のプロトコルです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q14", "session": "支援士 R4秋", "gap": 5, "num": 14, "topic": "SMTP-AUTHの特徴はどれか", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "SMTP-AUTHの特徴はどれか。", "mondai_html": "<div id=\"mondai\">SMTP-AUTHの特徴はどれか。</div>", "choices": {"ア": "ISP管理下の動的IPアドレスから管理外ネットワークのメールサーバへのSMTP接続を禁止する。", "イ": "電子メール送信元のメールサーバが送信元ドメインのDNSに登録されていることを確認してから，電子メールを受信する。", "ウ": "メールクライアントからメールサーバへの電子メール送信時に，利用者IDとパスワードによる利用者認証を行う。", "エ": "メールクライアントからメールサーバへの電子メール送信は，POP接続で利用者認証済みの場合にだけ許可する。"}, "choices_html": {"ア": "ISP管理下の動的IPアドレスから管理外ネットワークのメールサーバへのSMTP接続を禁止する。", "イ": "電子メール送信元のメールサーバが送信元ドメインのDNSに登録されていることを確認してから，電子メールを受信する。", "ウ": "メールクライアントからメールサーバへの電子メール送信時に，利用者IDとパスワードによる利用者認証を行う。", "エ": "メールクライアントからメールサーバへの電子メール送信は，POP接続で利用者認証済みの場合にだけ許可する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">電子メール送信・転送のプロトコルであるSMTPは、策定されたのが1982年と歴史が古く、電子メール送信に当たって以下の脆弱性があることが広く知られています。<ul><li>送信処理と転送処理を同一の仕組みで扱っている</li><li>電子メールの投稿をするユーザーを認証する仕組みがない</li><li>暗号化機能が標準で実装されていないため、通信経路上を平文のメッセージが流れる</li></ul>特に上記2つの仕様が原因となり、複数のメールサーバの第三者中継を利用したスパムメールの温床となっていました。<br/><br/><strong>SMTP-AUTH</strong>(SMTP Authentication)は、元来は電子メール送信にあたってユーザー認証の仕組みがないSMTPを拡張し、ユーザー認証機能を追加したものです。使用するにはメールサーバとメールクライアント(メールソフト)の双方が対応していることが必要ですが、メール送信するときにユーザー名とパスワードで認証を行い、認証されたユーザーのみからのメール送信を許可することで不正な送信要求を防止することができます。<ul><li class=\"lia\">OP25B(Outbound Port 25 Blocking)の説明です。</li><li class=\"lii\">SPF(Sender Policy Framework)の説明です。</li><li class=\"liu\">正しい。SMTP-AUTHの説明です。</li><li class=\"lie\">POP before SMTPの説明です。</li></ul></div>", "past_history": ["安全確保支援士 R2秋期 問16", "情報セキュリティ H22春期 問15", "情報セキュリティ H24春期 問15", "情報セキュリティ H27春期 問16", "情報セキュリティ H28秋期 問16", "安全確保支援士 H30秋期 問14"], "hist_count": 7}, {"id": "sc_04_aki_q15", "session": "支援士 R4秋", "gap": 5, "num": 15, "topic": "SPFの導入時に行う設定", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "SPFによるドメイン認証を実施する場合，SPFの導入時に，電子メール送信元アドレスのドメイン所有者側で行う必要がある設定はどれか。", "mondai_html": "<div id=\"mondai\">SPFによるドメイン認証を実施する場合，SPFの導入時に，電子メール送信元アドレスのドメイン所有者側で行う必要がある設定はどれか。</div>", "choices": {"ア": "DNSサーバにSPFレコードを登録する。", "イ": "DNSの問合せを受け付けるポート番号を変更する。", "ウ": "メールサーバにデジタル証明書を導入する。", "エ": "メールサーバのTCPポート25番を利用不可にする。"}, "choices_html": {"ア": "DNSサーバにSPFレコードを登録する。", "イ": "DNSの問合せを受け付けるポート番号を変更する。", "ウ": "メールサーバにデジタル証明書を導入する。", "エ": "メールサーバのTCPポート25番を利用不可にする。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SPF</strong>(Sender Policy Framework)は、メールを送信しようとしてきたメールサーバのIPアドレス情報を検証することで、正規のサーバからのメール送信であるかどうか確認することができる技術です。<br/><br/>SPFを用いた送信元IPアドレスの検証手順は以下のようになっています。<ol><li class=\"maru1\"><em class=\"m\">送信側は、送信側ドメインのDNSサーバのSPFレコード(またはTXTレコード)に正当なメールサーバのIPアドレスやホスト名を登録し、公開しておく</em></li><li class=\"maru2\">送信側から受信側へ、SMTPメールが送信される</li><li class=\"maru3\">受信側メールサーバは、受信側ドメインのDNSサーバを通じて、MAIL FROMコマンドに記載された送信者メールアドレスのドメインを管理するDNSサーバに問い合わせ、SPF情報を取得する</li><li class=\"maru4\">SPF情報との照合でSMTP接続してきたメールサーバのIPアドレスの確認に成功すれば、正当なドメインから送信されたと判断する</li></ol>SPFでは、送信側のDNSサーバに登録されたSPF情報を基に認証を行うため、送信側ドメインの所有者はあらかじめDNSサーバにSPFレコードを登録しておく必要があります。したがって「ア」が適切です。<br/><div class=\"pre\">//SPFレコードの例<br/>IN TXT v=spf1 +ip4:219.94.200.28 ~all</div><div class=\"img_margin\"><img alt=\"15.png/image-size:577×280\" height=\"280\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/15.png\" style=\"max-width: 100%; height: auto;\" width=\"577\"/></div><ul><ul><li class=\"lia\">正しい。SPFの導入時に行うべき設定です。</li><li class=\"lii\">DNSキャッシュポイズニング対策で行うべき設定です。</li><li class=\"liu\">DKIM(Domainkeys Identified Mail)の導入時に行うべき設定です。</li><li class=\"lie\">25/TCPを利用不可にするとメールを受信できなくなるため不適切です。</li></ul></ul></div>", "past_history": ["安全確保支援士 H31春期 問15"], "hist_count": 2}, {"id": "sc_04_aki_q16", "session": "支援士 R4秋", "gap": 5, "num": 16, "topic": "電子メールの暗号化プロトコル", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "電子メール又はその通信を暗号化する三つのプロトコルについて，公開鍵を用意する単位の組合せのうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">電子メール又はその通信を暗号化する三つのプロトコルについて，公開鍵を用意する単位の組合せのうち，適切なものはどれか。</div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/16.png\" style=\"max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">3つのプロトコルの特徴について簡単に説明します。<dl><dt>PGP(Pretty Good Privacy)</dt><dd>米国のPhilip Zimmermann氏によって開発された公開鍵暗号方式を使用してファイルや電子メールの「暗号化」「認証」「改ざん検知」を行うツール。RFC 4880として標準化されている。<br/>S/MIMEと同様に、暗号化メールを送受信するには通信を行う両者のメールソフトがこの規格に対応していることが必要となる。公開鍵の検証にフィンガープリント(電子指紋)というハッシュ値を使用し、さらに使用者が公開鍵に信頼度を設定し合う仕組み(web of trust:信頼の輪)で公開鍵の正当性を確保しているため認証局を必要としないことが特徴。<br/></dd><dt>S/MIME(Secure/Multipurpose Internet Mail Extensions)</dt><dd>電子メールを盗聴や改ざんなどから守るために米国RSA Data Security社によって開発された技術で、公開鍵暗号技術を使用して「認証」「改ざん検出」「暗号化」などの機能を電子メールソフトに提供する仕組み。<br/>ただし、S/MIMEを使用するにあたり、送受信する当事者同士のメールソフトがこの規格に対応していること、およびデジタル証明書を通信当事者同士で共有しておく必要がある。</dd><dt>SMTP over TLS(SMTP over Transport Layer Security)</dt><dd>TLSによって確立された安全な伝送路上で電子メールを送信・転送するプロトコル。導入により「送信者」から「送信者のメールサーバ」までの通信の暗号化が保証される。さらに、相手のメールサーバもこの方式に対応していればインターネット上でも暗号化した電子メールやり取りすることができる。</dd></dl>どの方式もデジタル証明書(公開鍵証明書)を使用した技術ですが、使用する証明書が異なります。PGPとS/MIMEでは、電子メール自体を暗号化し送信者－受信者間でエンドツーエンドの暗号化通信を行うため<em class=\"r\">メールアドレスごとの証明書</em>を使用します。一方、SMTP over TLSでは「メールソフトと送信元メールサーバ」及び「送信元メールサーバと送信先メールサーバ」のそれぞれで安全なセッションを確立し、その通信路上でSMTP通信を行うため<em class=\"r\">メールサーバの証明書</em>を使用します。<div class=\"img_margin\"><img alt=\"16a.png/image-size:486×298\" height=\"298\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/16a.png\" style=\"max-width: 100%; height: auto;\" width=\"486\"/></div>したがって正しい組合せは「ア」です。</div>", "past_history": ["安全確保支援士 R6春期 問16", "情報セキュリティ H28春期 問17", "安全確保支援士 H30秋期 問16"], "hist_count": 4}, {"id": "sc_04_aki_q17", "session": "支援士 R4秋", "gap": 5, "num": 17, "topic": "プライバシーセパレータ機能", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "無線LANのアクセスポイントがもつプライバシーセパレータ機能(アクセスポイントアイソレーション)の説明はどれか。", "mondai_html": "<div id=\"mondai\">無線LANのアクセスポイントがもつプライバシーセパレータ機能(アクセスポイントアイソレーション)の説明はどれか。</div>", "choices": {"ア": "クセスポイントの識別子を知っている利用者だけに機器の接続を許可する。", "イ": "同じアクセスポイントに無線で接続している機器同士の通信を禁止する。", "ウ": "事前に登録されたMACアドレスをもつ機器だけに無線LANへの接続を許可する。", "エ": "建物外への無線LAN電波の漏れを防ぐことによって第三者による盗聴を防止する。"}, "choices_html": {"ア": "クセスポイントの識別子を知っている利用者だけに機器の接続を許可する。", "イ": "同じアクセスポイントに無線で接続している機器同士の通信を禁止する。", "ウ": "事前に登録されたMACアドレスをもつ機器だけに無線LANへの接続を許可する。", "エ": "建物外への無線LAN電波の漏れを防ぐことによって第三者による盗聴を防止する。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>プライバシーセパレータ</strong>は、同一の無線LANに接続されたデバイス同士の通信を抑制する機能です。店舗内Wi-fiや公衆無線LANサービスのように見知らぬ他人同士が同じ無線LANに接続する場面で、利用者のセキュリティ保護のために設定されます。<div class=\"img_margin\"><img alt=\"17.png/image-size:290×208\" height=\"208\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/17.png\" style=\"max-width: 100%; height: auto;\" width=\"290\"/></div><ul><li class=\"lia\">SSIDステルス機能の説明です。</li><li class=\"lii\">正しい。プライバシーセパレータの説明です。</li><li class=\"liu\">MACアドレスフィルタリングの説明です。</li><li class=\"lie\">無線LANの電波漏れには、設置スペースに適合する無線LAN親機の選択や電波遮蔽シートの設置が対策となります。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q18", "session": "支援士 R4秋", "gap": 5, "num": 18, "topic": "IPv6の特徴", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "IPv6の特徴として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">IPv6の特徴として，適切なものはどれか。</div>", "choices": {"ア": "IPv6アドレスからMACアドレスを調べる際にARPを使う。", "イ": "アドレス空間はIPv4の2128倍である。", "ウ": "経路の途中でフラグメンテーションを行うことが可能である。", "エ": "ヘッダーは固定長であり，拡張ヘッダー長は8オクテットの整数倍である。"}, "choices_html": {"ア": "IPv6アドレスからMACアドレスを調べる際にARPを使う。", "イ": "アドレス空間はIPv4の2128倍である。", "ウ": "経路の途中でフラグメンテーションを行うことが可能である。", "エ": "ヘッダーは固定長であり，拡張ヘッダー長は8オクテットの整数倍である。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">IPv4ではARP(Address Resolution Protocol)を用いて対応する機器のMACアドレスを取得していましたが、IPv6ではIPv4でエラー通知などに使われているICMP(Internet Control Message Protocol)を拡張したICMPv6を使用します。</li><li class=\"lii\">アドレス長が32ビットから128ビットへ拡大され、表現可能なアドレス空間が2<sup>32</sup>から2<sup>128</sup>となりました。計算上IPv4の「2<sup>128</sup>／2<sup>32</sup>＝2<sup>96</sup>倍」となっています。またIPアドレスの表記法もIPv4では8ビットごとにピリオドで区切り10進数表記するのに対し、IPv6では16ビットごとにコロンで区切り16進数表記します。</li><li class=\"liu\">IPv4では経路途中のルータでのフラグメンテーションが可能でしたが、IPv6では送信元でのみ行い経路途中では行いません。フラグメンテーションに関する情報もIPv4ではIPヘッダー部分に設定しましたが、IPv6では拡張ヘッダーを利用して設定します。</li><li class=\"lie\">正しい。IPv4ではIPヘッダーの中に可変長のオプションフィールドを設定するためIPヘッダーが可変長でしたが、IPv6では必須の基本情報のみを設定する固定長ヘッダーに変わっています。フラグメンテーションやIPsecを実現するための機能（認証やペイロード部分の暗号化）などのオプション情報は、独立した拡張ヘッダーに設定します。拡張ヘッダー長は8オクテットの整数倍で、必要な数だけIPv6ヘッダーに連結する仕様となっています。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q19", "session": "支援士 R4秋", "gap": 5, "num": 19, "topic": "クラスDのIPアドレスを使用する場合", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "クラスDのIPアドレスを使用するのはどの場合か。", "mondai_html": "<div id=\"mondai\">クラスDのIPアドレスを使用するのはどの場合か。</div>", "choices": {"ア": "端末数が250台程度までの比較的小規模なネットワークのホストアドレスを割り振る。", "イ": "端末数が65,000台程度の中規模なネットワークのホストアドレスを割り振る。", "ウ": "プライベートアドレスを割り振る。", "エ": "マルチキャストアドレスを割り振る。"}, "choices_html": {"ア": "端末数が250台程度までの比較的小規模なネットワークのホストアドレスを割り振る。", "イ": "端末数が65,000台程度の中規模なネットワークのホストアドレスを割り振る。", "ウ": "プライベートアドレスを割り振る。", "エ": "マルチキャストアドレスを割り振る。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">IPアドレス空間は、IPアドレスの先頭ビットによってクラスA～Eに分類されます。クラスDのIPアドレスの範囲は、先頭ビットが「1110」である 224.0.0.0～239.255.255.255 です。<br/><br/>クラスA～Cはホストアドレスの割り振りに使用されますが、クラスDは、特定のグループに所属する全てのホストに同時送信を行う<strong>マルチキャスト</strong>通信用に予約されたアドレスです。32ビットのうち先頭4ビットがクラスDを表す「1110」で、残りの28ビットが送信対象となるグループ番号を指定する部分として使われます。<div class=\"img_margin\"><img alt=\"19.png/image-size:392×78\" height=\"78\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/19.png\" style=\"max-width: 100%; height: auto;\" width=\"392\"/></div>したがって正解は「エ」です。<ul><li class=\"lia\">クラスCのIPアドレスの用途です。</li><li class=\"lii\">クラスBのIPアドレスの用途です。</li><li class=\"liu\">クラスDのIPアドレスは、全32ビットがネットワーク部でありホストアドレス部はありません。このため、プライベートIPアドレスとして割り当てることはできません。</li><li class=\"lie\">正しい。クラスDはマルチキャスト通信専用のアドレスです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q20", "session": "支援士 R4秋", "gap": 5, "num": 20, "topic": "障害を回避するプロトコル", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "IPネットワークにおいて，クライアントの設定を変えることなくデフォルトゲートウェイの障害を回避するために用いられるプロトコルはどれか。", "mondai_html": "<div id=\"mondai\">IPネットワークにおいて，クライアントの設定を変えることなくデフォルトゲートウェイの障害を回避するために用いられるプロトコルはどれか。</div>", "choices": {"ア": "RARP", "イ": "RSTP", "ウ": "RTSP", "エ": "VRRP"}, "choices_html": {"ア": "RARP", "イ": "RSTP", "ウ": "RTSP", "エ": "VRRP"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>VRRP</strong>(Virtual Router Redundancy Protocol)は、ネットワークのデフォルトゲートウェイとなるルータやL3スイッチの冗長構成を実現するプロトコルです。<br/><br/>VRRPでは複数台のルータに共通して使える仮想IPアドレス・仮想MACアドレスを用意し、障害発生時には2つのアドレスをフェールオーバーで待機系に移すことで継ぎ目なく処理を続行します。この仕組みによってホストのデフォルトゲートウェイの設定値などを変更することなしに、送信先の装置を正常稼働するものに置き換えることが可能になっています。<ul><li class=\"lia\">Reverse Address Resolution Protocolの略。ARPがIPアドレスから機器のMACアドレスを得るのとは逆に、機器固有のMACアドレスから対応するIPアドレスを取得するためのプロトコルです。</li><li class=\"lii\">Rapid Spanning Tree Protocolの略。データリンク層でのブロードキャストストームを防止するためのスパニングツリープロトコル(STP)の改良版で、ツリー構造を構築するのに必要な時間を1秒程度に短縮したものです。</li><li class=\"liu\">Real Time Streaming Protocolの略。リアルタイム性のあるストリーミングデータの配信制御を行うためのプロトコルです。</li><li class=\"lie\">正しい。VRRPは、ルータを冗長化する技術です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q21", "session": "支援士 R4秋", "gap": 5, "num": 21, "topic": "SQL文", "subcat": "データ操作", "category": "情報セキュリティ", "mondai": "表Rと表Sに対して，次のSQL文を実行した結果はどれか。〔SQL文〕SELECT R.X AS A, R.Y AS B, S.X AS C, S.Z AS DFROM R LEFT OUTER JOIN S ON R.X = S.X", "mondai_html": "<div id=\"mondai\">表Rと表Sに対して，次のSQL文を実行した結果はどれか。<div class=\"img_margin\"><img alt=\"21.png/image-size:305×152\" height=\"152\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/21.png\" style=\"max-width: 100%; height: auto;\" width=\"305\"/></div>〔SQL文〕<br/><div class=\"code\">SELECT R.X AS A, R.Y AS B, S.X AS C, S.Z AS D<br/>　　FROM R LEFT OUTER JOIN S ON R.X = S.X</div></div>", "choices": {"ア": "（画像参照）", "イ": "（画像参照）", "ウ": "（画像参照）", "エ": "（画像参照）"}, "choices_html": {"ア": "<span id=\"select_a\"><img alt=\"21a.png/image-size:231×62\" height=\"62\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/21a.png\" style=\"max-width: 100%; height: auto;\" width=\"231\"/></span>", "イ": "<span id=\"select_i\"><img alt=\"21i.png/image-size:231×86\" height=\"86\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/21i.png\" style=\"max-width: 100%; height: auto;\" width=\"231\"/></span>", "ウ": "<span id=\"select_u\"><img alt=\"21u.png/image-size:231×111\" height=\"111\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/21u.png\" style=\"max-width: 100%; height: auto;\" width=\"231\"/></span>", "エ": "<span id=\"select_e\"><img alt=\"21e.png/image-size:231×135\" height=\"135\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/21e.png\" style=\"max-width: 100%; height: auto;\" width=\"231\"/></span>"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">設問のSQL文は、<br/><div class=\"pre\">FROM R LEFT OUTER JOIN S ON R.X = S.X</div>R表とS表を属性Xで左外部結合した結果から、<br/><div class=\"pre\">SELECT R.X AS A, R.Y AS B, S.X AS C, S.Z AS D</div>4つの列を抽出するものです。<br/><br/>左外部結合(LEFT OUTER JOIN)とは、基準となる左表の行を全て抽出し、右表からは左表の行と自然結合できる行のみを抽出する結合です。左表の行と結合する行が右表に無い場合は右表の列の値をNULLとして結合します。したがって、R表とS表を左外部結合すると、両方に共通しているA002とA003の行は結合され、S表に存在しないA001とA005の行は値がNULLである行として結合されることとなります。<div class=\"img_margin\"><img alt=\"21_1.png/image-size:262×152\" height=\"152\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/21_1.png\" style=\"max-width: 100%; height: auto;\" width=\"262\"/></div>この結果表から、R表の属性XをA、R表の属性YをB、S表の属性XをC、S表の属性ZをDと命名して列を抽出するので「ウ」の結果となります。<div class=\"img_margin\"><img alt=\"21u.png/image-size:231×111\" height=\"111\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/21u.png\" style=\"max-width: 100%; height: auto;\" width=\"231\"/></div></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q22", "session": "支援士 R4秋", "gap": 5, "num": 22, "topic": "分岐網羅のテストケース", "subcat": "ソフトウェア構築", "category": "情報セキュリティ", "mondai": "あるプログラムについて，流れ図で示される部分に関するテストケースを，判定条件網羅(分岐網羅)によって設定する。この場合のテストケースの組合せとして，適切なものはどれか。ここで，( )で囲んだ部分は，一組みのテストデータを表すものとする。", "mondai_html": "<div id=\"mondai\">あるプログラムについて，流れ図で示される部分に関するテストケースを，判定条件網羅(分岐網羅)によって設定する。この場合のテストケースの組合せとして，適切なものはどれか。ここで，( )で囲んだ部分は，一組みのテストデータを表すものとする。<div class=\"img_margin\"><img alt=\"22.png/image-size:165×257\" height=\"257\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/22.png\" style=\"max-width: 100%; height: auto;\" width=\"165\"/></div></div>", "choices": {"ア": "(A＝1，B＝1)，(A＝7，B＝1)", "イ": "(A＝4，B＝0)，(A＝8，B＝1)", "ウ": "(A＝4，B＝1)，(A＝6，B＝1)", "エ": "(A＝7，B＝1)，(A＝1，B＝0)"}, "choices_html": {"ア": "(A＝1，B＝1)，(A＝7，B＝1)", "イ": "(A＝4，B＝0)，(A＝8，B＝1)", "ウ": "(A＝4，B＝1)，(A＝6，B＝1)", "エ": "(A＝7，B＝1)，(A＝1，B＝0)"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">判定条件網羅(分岐網羅)は、各分岐について判定条件の真偽を少なくとも1回は実行するという網羅性のレベルです。したがって、\"Yes\"と\"No\"のどちらの処理も実行するようになっているテストケースが正解となります。<ul><li class=\"lia\">正しい。(A＝1，B＝1)は\"No\"と判定され、(A＝7，B＝1)は\"Yes\"と判定されます。\"Yes\"と\"No\"のどちらも実行できるので判定条件網羅を満たします。</li><li class=\"lii\">(A＝4，B＝0)は\"Yes\"と判定され、(A＝8，B＝1)も\"Yes\"と判定されます。\"Yes\"のときの処理しか実行できないので誤りです。</li><li class=\"liu\">(A＝4，B＝1)は\"No\"と判定され、(A＝6，B＝1)も\"No\"と判定されます。\"No\"のときの処理しか実行できないので誤りです。</li><li class=\"lie\">(A＝7，B＝1)は\"Yes\"と判定され、(A＝1，B＝0)も\"Yes\"と判定されます。\"Yes\"のときの処理しか実行できないので誤りです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q23", "session": "支援士 R4秋", "gap": 5, "num": 23, "topic": "SDメモリカードの著作権保護技術", "subcat": "知的財産適用管理", "category": "情報セキュリティ", "mondai": "SDメモリカードに使用される著作権保護技術はどれか。", "mondai_html": "<div id=\"mondai\">SDメモリカードに使用される著作権保護技術はどれか。</div>", "choices": {"ア": "CPPM(Content Protection for Pre-Recorded Media)", "イ": "CPRM(Content Protection for Recordable Media)", "ウ": "DTCP(Digital Transmission Content Protection)", "エ": "HDCP(High-bandwidth Digital Content Protection)"}, "choices_html": {"ア": "CPPM(Content Protection for Pre-Recorded Media)", "イ": "CPRM(Content Protection for Recordable Media)", "ウ": "DTCP(Digital Transmission Content Protection)", "エ": "HDCP(High-bandwidth Digital Content Protection)"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">CPPMは、コンテンツをメディアに暗号化した状態で記録し、再生時に対応した機器で復号することで違法コピーを防止する技術です。メディア内の暗号鍵と再生機器（またはソフトウェア）の機器鍵がそろわないと復号できない仕組みになっています。\"for Pre-Recorded Media\"どおり再生専用メディア用の規格です。</li><li class=\"lii\">正しい。CPPMと概念的には同じ仕組みですが、\"for Recordable Media\"の言葉の通りこちらは記録可能メディアを対象とした規格です。SDメモリカードは書き換え可能メディアなので、著作権保護技術としてCPRMが使用されています。</li><li class=\"liu\">DTCPは、家庭内ネットワーク内において、著作権保護されたデジタルコンテンツを暗号化して伝送することでコピーや傍受を防ぐ技術です。</li><li class=\"lie\">HDMI端子が搭載されたデジタルAV機器に採用され、HDMI端子やDisplayPort端子から表示機器にデジタル信号を送るときに受信する経路を暗号化する方式です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q24", "session": "支援士 R4秋", "gap": 5, "num": 24, "topic": "投資利益率の高いシステム化案はどれか", "subcat": "サービスの設計・移行", "category": "情報セキュリティ", "mondai": "ある業務を新たにシステム化するに当たって，A～Dのシステム化案の初期費用，運用費及びシステム化によって削減される業務費を試算したところ，表のとおりであった。システムの利用期間を5年とするとき，最も投資利益率の高いシステム化案はどれか。ここで，投資利益率は次式によって算出する。また，利益の増加額は削減される業務費から投資額を減じたものとし，投資額は初期費用と運用費の合計とする。投資利益率＝利益の増加額÷投資額", "mondai_html": "<div id=\"mondai\">ある業務を新たにシステム化するに当たって，A～Dのシステム化案の初期費用，運用費及びシステム化によって削減される業務費を試算したところ，表のとおりであった。システムの利用期間を5年とするとき，最も投資利益率の高いシステム化案はどれか。ここで，投資利益率は次式によって算出する。また，利益の増加額は削減される業務費から投資額を減じたものとし，投資額は初期費用と運用費の合計とする。<br/><br/>　投資利益率＝利益の増加額÷投資額<div class=\"img_margin\"><img alt=\"24.png/image-size:494×182\" height=\"182\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/24.png\" style=\"max-width: 100%; height: auto;\" width=\"494\"/></div></div>", "choices": {"ア": "A", "イ": "B", "ウ": "C", "エ": "D"}, "choices_html": {"ア": "A", "イ": "B", "ウ": "C", "エ": "D"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">利益の増加額は、削減される業務費からシステムの費用(初期費用＋運用費)を差し引いた額となります。<br/><br/>[A案]<br/>5年間で削減される業務費　25×5年＝125<br/>5年間のシステムの費用　30＋(4×5年)＝50<br/>利益の増加額　125－50＝75<br/>よって、投資利益率は「75÷50＝1.5」となります。<br/><br/>[B案]<br/>5年間で削減される業務費　20×5年＝100<br/>5年間のシステムの費用　20＋(6×5年)＝50<br/>利益の増加額　100－50＝50<br/>よって、投資利益率は「50÷50＝1」となります。<br/><br/>[C案]<br/>5年間で削減される業務費　15×5年＝75<br/>5年間のシステムの費用　20＋(4×5年)＝40<br/>利益の増加額　75－40＝35<br/>よって、投資利益率は「35÷40＝0.875」となります。<br/><br/>[D案]<br/>5年間で削減される業務費　22×5年＝110<br/>5年間のシステムの費用　15＋(5×5年)＝40<br/>利益の増加額　110－40＝70<br/>よって、投資利益率は「70÷40＝1.75」となります。<br/><br/>したがって、最も投資利益率の高いシステム化案は「D」となります。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q25", "session": "支援士 R4秋", "gap": 5, "num": 25, "topic": "SaaSへのアクセスコントロールの監査", "subcat": "システム監査", "category": "情報セキュリティ", "mondai": "被監査企業がSaaSをサービス利用契約して業務を実施している場合，被監査企業のシステム監査人がSaaSの利用者環境からSaaSへのアクセスコントロールを評価できる対象のIDはどれか。", "mondai_html": "<div id=\"mondai\">被監査企業がSaaSをサービス利用契約して業務を実施している場合，被監査企業のシステム監査人がSaaSの利用者環境からSaaSへのアクセスコントロールを評価できる対象のIDはどれか。</div>", "choices": {"ア": "DBMSの管理者ID", "イ": "アプリケーションの利用者ID", "ウ": "サーバのOSの利用者ID", "エ": "ストレージデバイスの管理者ID"}, "choices_html": {"ア": "DBMSの管理者ID", "イ": "アプリケーションの利用者ID", "ウ": "サーバのOSの利用者ID", "エ": "ストレージデバイスの管理者ID"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SaaS</strong>(Software as a Service)は、専門の事業者が運用するソフトウェアの機能をネットワーク経由でサービスとして利用する形態です。SaaSの特徴を同じクラウドサービスであるPaaS、IaaSと比較すると次のようになります。<dl><dt>SaaS(Software as a Service)</dt><dd>アプリケーション(ソフトウェア)をサービスとして提供する</dd><dt>PaaS(Platform as a Service)</dt><dd>アプリケーションを稼働させるための基盤(プラットフォーム)をサービスとして提供する</dd><dt>IaaS(Infrastructure as a Service)</dt><dd>サーバ、CPU、ストレージなどのインフラをサービスとして提供する</dd></dl><div class=\"img_margin\"><img alt=\"25.png/image-size:363×335\" height=\"335\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/25.png\" style=\"max-width: 100%; height: auto;\" width=\"363\"/></div>上表のようにSaaSでは、OSやハードウェア、DBMSなどのミドルウェアを<em class=\"r\">直接操作することはありません</em>。サービスの利用者は、付与された利用者IDを使用してSaaS提供業者のWebアプリケーションにアクセスし、サービスを使用するだけです。<br/><br/>したがって、SaaSの利用者環境からのアクセスコントロールを確認するには「アプリケーションの利用者ID」が対象として適切です。</div>", "past_history": ["情報セキュリティ H25秋期 問25"], "hist_count": 2}, {"id": "sc_04_haru_q1", "session": "支援士 R4春", "gap": 6, "num": 1, "topic": "HTTPリクエストから推測できる攻撃", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "Webサーバのログを分析したところ，Webサーバへの攻撃と思われるHTTPリクエストヘッダーが記録されていた。次のHTTPリクエストヘッダーから推測できる，攻撃者が悪用しようとしていた可能性が高い脆弱性はどれか。ここで，HTTPリクエストヘッダー中の\"%20\"は空白を意味する。〔HTTPリクエストヘッダーの一部〕GET /cgi-bin/submit.cgi?user=;cat%20/etc/passwd HTTP/1.1Accept: */*Accept-Language: jaUA-CPU: x86Accept-Encoding: gzip，deflateUser-Agent: (省略)Host: test.example.comConnection: Keep-Alive", "mondai_html": "<div id=\"mondai\">Webサーバのログを分析したところ，Webサーバへの攻撃と思われるHTTPリクエストヘッダーが記録されていた。次のHTTPリクエストヘッダーから推測できる，攻撃者が悪用しようとしていた可能性が高い脆弱性はどれか。ここで，HTTPリクエストヘッダー中の\"%20\"は空白を意味する。<br/><br/>〔HTTPリクエストヘッダーの一部〕<br/><div class=\"code\">GET /cgi-bin/submit.cgi?user=;cat%20/etc/passwd HTTP/1.1<br/>Accept: */*<br/>Accept-Language: ja<br/>UA-CPU: x86<br/>Accept-Encoding: gzip，deflate<br/>User-Agent: (省略)<br/>Host: test.example.com<br/>Connection: Keep-Alive</div></div>", "choices": {"ア": "HTTPヘッダーインジェクション(HTTP Response Splitting)", "イ": "OSコマンドインジェクション", "ウ": "SQLインジェクション", "エ": "クロスサイトスクリプティング"}, "choices_html": {"ア": "HTTPヘッダーインジェクション(HTTP Response Splitting)", "イ": "OSコマンドインジェクション", "ウ": "SQLインジェクション", "エ": "クロスサイトスクリプティング"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">HTTPリクエストヘッダーのうちで注目すべき部分は<span class=\"code\">?user=;cat%20/etc/passwd</span>です。<br/><br/><span class=\"code\">cat</span>はUNIX系のOSにおいてファイルの内容を出力するコマンドであり、<span class=\"code\">/etc/passwd</span>はユーザーのアカウント情報（ユーザー名・パスワード等）が記録されているファイルへのパスです。このため、<span class=\"code\">cat%20/etc/passwd</span>はシステムが管理するユーザーのアカウント情報の取得を意図したものと判断できます。<br/><br/>仮にWebアプリケーション内でOSのシェルを起動する関数<sup>※</sup>を使用し、これにuserパラメータの値をそのまま実行時引数として渡した場合、OSのシェルには次のような文字列が与えられることになります。<br/><div class=\"pre\">本来実行されるコマンド名 ;cat /etc/passwd</div><span class=\"code\">;</span>は命令の区切りを意味するため、上記の文字列は次の2つの命令として解釈されます。<br/><div class=\"pre\">本来実行されるコマンド名<br/>cat /etc/passwd</div>この結果<span class=\"code\">cat /etc/passwd</span>が実行され、ブラウザの結果画面に秘密情報であるアカウント情報が表示されてしまうことになります。<br/><br/>この攻撃は、Webアプリケーションに任意のOSコマンドを実行させることを意図しているため、対応する脆弱性はOSコマンドインジェクションとなります。したがって「イ」が正解です。<ul><li class=\"lia\">HTTPヘッダーインジェクションは、利用者に返されるHTTPレスポンスの内容に、任意のヘッダーフィールドやボディ部を混入させる攻撃です。対象となるのはHTTPレスポンスヘッダーを動的に組み立てるWebアプリケーションです。</li><li class=\"lii\">正しい。OSコマンドを含むため、OSコマンドインジェクションの脆弱性を狙う攻撃です。<span class=\"code\">;</span>以外にも、<span class=\"code\">| &amp; ` ( )</span>などは別コマンドの実行に使われるものとして特に警戒する必要があります。</li><li class=\"liu\">SQLインジェクションの場合、攻撃コードにSQLの断片が含まれます。</li><li class=\"lie\">XSSの場合、攻撃コードにJavaScriptの断片が含まれます。</li></ul><sup>※</sup>Perlの<span class=\"code\">exec</span><span class=\"code\">open</span>、PHPの<span class=\"code\">exec</span><span class=\"code\">passthru</span><span class=\"code\">proc_open</span><span class=\"code\">shell_exec</span><span class=\"code\">system</span>、Pythonの<span class=\"code\">os.system</span><span class=\"code\">subprocess.call</span>などが該当します。</div>", "past_history": ["安全確保支援士 R2秋期 問1", "安全確保支援士 H30春期 問2"], "hist_count": 3}, {"id": "sc_04_haru_q2", "session": "支援士 R4春", "gap": 6, "num": 2, "topic": "SAMLの説明として最も適切なもの", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "SAML(Security Assertion Markup Language)の説明として，最も適切なものはどれか。", "mondai_html": "<div id=\"mondai\">SAML(Security Assertion Markup Language)の説明として，最も適切なものはどれか。</div>", "choices": {"ア": "Webサービスに関する情報を公開し，Webサービスが提供する機能などを検索可能にするための仕様", "イ": "権限がない利用者による読取り，改ざんから電子メールを保護して送信するための仕様", "ウ": "デジタル署名に使われる鍵情報を効率よく管理するためのWebサービスの仕様", "エ": "認証情報に加え，属性情報と認可情報を異なるドメインに伝達するためのWebサービスの仕様"}, "choices_html": {"ア": "Webサービスに関する情報を公開し，Webサービスが提供する機能などを検索可能にするための仕様", "イ": "権限がない利用者による読取り，改ざんから電子メールを保護して送信するための仕様", "ウ": "デジタル署名に使われる鍵情報を効率よく管理するためのWebサービスの仕様", "エ": "認証情報に加え，属性情報と認可情報を異なるドメインに伝達するためのWebサービスの仕様"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SAML</strong>(Security Assertion Markup Language)は、インターネット上でユーザーIDやパスワードなどの認証情報を安全に交換するために策定されたXMLベースのマークアップ言語です。<br/><br/>クッキー方式やリバースプロキシ方式でシングルサインオンを実現した場合、その認証が有効であるのは認証を受けたドメイン内に限られます。しかしSAMLを使用して他のドメインとの間で認証情報を交換することで、同一ドメインに留まらない大規模なサイトにおいてもシングルサインオンの仕組みやセキュアな認証情報管理を実現できます。<ul><li class=\"lia\">WSDL(Web Services Description Language)の説明です。</li><li class=\"lii\">S/MIME(Secure MIME)やPGP(Pretty Good Privacy)の説明です。</li><li class=\"liu\">TLS(Transport Layer Security)の説明です。</li><li class=\"lie\">正しい。SAMLの説明です。</li></ul></div>", "past_history": ["安全確保支援士 R2秋期 問2"], "hist_count": 2}, {"id": "sc_04_haru_q3", "session": "支援士 R4春", "gap": 6, "num": 3, "topic": "秘密情報を推定する攻撃はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "暗号化装置における暗号化処理時の消費電力を測定するなどして，当該装置内部の秘密情報を推定する攻撃はどれか。", "mondai_html": "<div id=\"mondai\">暗号化装置における暗号化処理時の消費電力を測定するなどして，当該装置内部の秘密情報を推定する攻撃はどれか。</div>", "choices": {"ア": "キーロガー", "イ": "サイドチャネル攻撃", "ウ": "スミッシング", "エ": "中間者攻撃"}, "choices_html": {"ア": "キーロガー", "イ": "サイドチャネル攻撃", "ウ": "スミッシング", "エ": "中間者攻撃"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>サイドチャネル攻撃</strong>は、暗号アルゴリズムを実装した攻撃対象の物理デバイスを観察し、そこから得られる物理量（処理時間や消費電流など）やエラーメッセージなどの「サイドチャネル情報」から、機密情報の不正取得や暗号鍵の推定等を試みる行為の総称です。サイドチャネル(Side Channel)には、非正規の入出力経路という意味があります。<br/><br/>サイドチャネル攻撃の例としては、タイミング攻撃、電力解析攻撃、故障利用攻撃、キャッシュ利用攻撃などが挙げられます。<ul><li class=\"lia\">キーロガーは、PCへのキーボードやマウス入力を逐一監視し、それを記録するソフトウェアやハードウェアです。</li><li class=\"lii\">正しい。サイドチャネル攻撃のうち、電力解析攻撃に該当します。</li><li class=\"liu\">スミッシングは、SMSに対してメッセージを送り付け、個人情報の窃取などを行う行為です。携帯電話／スマートフォンやタブレット端末のSMS(Short Message Service)とフィッシングを組み合せたものです。</li><li class=\"lie\">中間者攻撃は、クライアントに対してはサーバに、サーバに対してはクライアントになりすますことで通信をしている二者の間に介入し、通信内容の盗聴・改ざんなどを行う行為です。</li></ul></div>", "past_history": ["安全確保支援士 H29秋期 問8"], "hist_count": 2}, {"id": "sc_04_haru_q4", "session": "支援士 R4春", "gap": 6, "num": 4, "topic": "パスワードの総数を求める数式", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "パスワードに使用できる文字の種類の数をM，パスワードの文字数をnとするとき，設定できるパスワードの理論的な総数を求める数式はどれか。", "mondai_html": "<div id=\"mondai\">パスワードに使用できる文字の種類の数をM，パスワードの文字数をnとするとき，設定できるパスワードの理論的な総数を求める数式はどれか。</div>", "choices": {"ア": "Mn", "イ": "M！(M－n)！", "ウ": "M！n！(M－n)！", "エ": "(M＋n－1)！n！(M－n)！"}, "choices_html": {"ア": "Mn", "イ": "M！(M－n)！", "ウ": "M！n！(M－n)！", "エ": "(M＋n－1)！n！(M－n)！"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_4.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">まず数字4桁構成されるパスワードで考えてみると、<br/><ul class=\"none\"><li>文字種の数：\"0\"～\"9\"の10種類</li><li>文字数：4文字</li></ul>となり、この条件では\"0000\"～\"9999\"の10,000種類の組合せが存在します。同様に数字6文字であれば、<br/><ul class=\"none\"><li>文字種の数：\"0\"～\"9\"の10種類</li><li>文字数：6文字</li><li>パスワードの組合せ：1,000,000種類</li></ul>となります。これらの例よりパスワードの総数は、10×10×10×10＝10,000、10×10×10×10×10×10＝1,000,000\"というように、文字種の数<em class=\"r\">M</em>を文字数<em class=\"r\">n</em>回だけ乗じた数であるとわかります。したがって「M<sup>n</sup>」が適切な数式です。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_haru_q5", "session": "支援士 R4春", "gap": 6, "num": 5, "topic": "サイバーキルチェーン", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "標的型攻撃における攻撃者の行動をモデル化したものの一つにサイバーキルチェーンがあり，攻撃者の行動を7段階に分類している。標的とした会社に対する攻撃者の行動のうち，偵察の段階に分類されるものはどれか。", "mondai_html": "<div id=\"mondai\">標的型攻撃における攻撃者の行動をモデル化したものの一つにサイバーキルチェーンがあり，攻撃者の行動を7段階に分類している。標的とした会社に対する攻撃者の行動のうち，偵察の段階に分類されるものはどれか。</div>", "choices": {"ア": "攻撃者が，インターネットに公開されていない社内ポータルサイトから，会社の組織図，従業員情報，メールアドレスなどを入手する。", "イ": "攻撃者が，会社の役員が登録しているSNSサイトから，攻撃対象の人間関係，趣味などを推定する。", "ウ": "攻撃者が，取引先になりすまして，標的とした会社にマルウェアを添付した攻撃メールを送付する。", "エ": "攻撃者が，ボットに感染したPCを違隔操作して社内ネットワーク上のPCを次々にマルウェア感染させて，利用者IDとパスワードを入手する。"}, "choices_html": {"ア": "攻撃者が，インターネットに公開されていない社内ポータルサイトから，会社の組織図，従業員情報，メールアドレスなどを入手する。", "イ": "攻撃者が，会社の役員が登録しているSNSサイトから，攻撃対象の人間関係，趣味などを推定する。", "ウ": "攻撃者が，取引先になりすまして，標的とした会社にマルウェアを添付した攻撃メールを送付する。", "エ": "攻撃者が，ボットに感染したPCを違隔操作して社内ネットワーク上のPCを次々にマルウェア感染させて，利用者IDとパスワードを入手する。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>サイバーキルチェーン</strong>は、サイバー攻撃の手順を攻撃者の視点からいくつかの段階に分けモデル化したものです。攻撃の段階としては、偵察、武器化、配送、エクスプロイト、インストール、遠隔操作、目的の実行という7段階が一般的です。攻撃者の視点からサイバー攻撃を見ることで、各段階における防御策の立案に役立てることができます。<dl><dt>1. 偵察</dt><dd>標的に関する情報を収集して調査する</dd><dt>2. 武器化</dt><dd>攻撃のためのマルウェアを用意する</dd><dt>3. 配送（デリバリ）</dt><dd>メールやWebサイトを使って標的にマルウェアを送付／配信する、または標的のシステムに侵入する</dd><dt>4. エクスプロイト（攻撃）</dt><dd>標的にマルウェアを実行させる</dd><dt>5. インストール</dt><dd>標的のPCがマルウェアに感染する</dd><dt>6. 遠隔操作（C&amp;C）</dt><dd>マルウェアとC&amp;Cサーバを通信させて標的のサーバを遠隔操作する</dd><dt>7. 目的の実行</dt><dd>秘密情報を得る、サービス停止、改ざんなど攻撃者の目的を達成する</dd></dl><ul><li class=\"lia\">\"偵察\"では一般に公開されている情報を収集するので誤りです。内部情報を得ているならば、もはや内部侵入に成功していると言えます。</li><li class=\"lii\">正しい。\"偵察\"の段階に関する記述です。</li><li class=\"liu\">\"配送\"の段階に関する記述です。</li><li class=\"lie\">\"遠隔操作\"～\"目的実行\"の段階に関する記述です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_haru_q6", "session": "支援士 R4春", "gap": 6, "num": 6, "topic": "量子暗号の特徴はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "量子暗号の特徴として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">量子暗号の特徴として，適切なものはどれか。</div>", "choices": {"ア": "暗号化と復号の処理を，量子コンピュータを用いて瞬時に行うことができるので，従来のコンピュータでの処理に比べて大量のデータの秘匿を短時間で実現できる。", "イ": "共通鍵暗号方式であり，従来の情報の取扱量の最小単位であるビットの代わりに量子ビットを用いることによって，瞬時のデータ送受信が実現できる。", "ウ": "量子雑音を用いて疑似乱数を発生させて共通鍵を生成し，公開鍵暗号方式で共有することによって，解読が困難な秘匿通信が実現できる。", "エ": "量子通信路を用いて安全に共有した乱数列を使い捨ての暗号鍵として用いることによって，原理的に第三者に解読されない秘匿通信が実現できる。"}, "choices_html": {"ア": "暗号化と復号の処理を，量子コンピュータを用いて瞬時に行うことができるので，従来のコンピュータでの処理に比べて大量のデータの秘匿を短時間で実現できる。", "イ": "共通鍵暗号方式であり，従来の情報の取扱量の最小単位であるビットの代わりに量子ビットを用いることによって，瞬時のデータ送受信が実現できる。", "ウ": "量子雑音を用いて疑似乱数を発生させて共通鍵を生成し，公開鍵暗号方式で共有することによって，解読が困難な秘匿通信が実現できる。", "エ": "量子通信路を用いて安全に共有した乱数列を使い捨ての暗号鍵として用いることによって，原理的に第三者に解読されない秘匿通信が実現できる。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_6.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>量子暗号</strong>は、量子力学の性質を利用した暗号化技術で、量子鍵配送（QKD）とワンタイムパッドという2つの技術要素で構成されます。<br/><br/>量子鍵配送は、共通鍵暗号で必要となる鍵情報の光子に載せて送る仕組みで、盗聴の有無を量子力学的に検知することができる性質を持ちます。光子を送るので伝送媒体には光ファイバーが使用されます。一方、ワンタイムパッドは、平文と同じサイズの暗号化鍵を使用し、一度使った暗号鍵は二度と使わない仕組みです。この2つを利用することで、どんな計算技術でも将来にわたって解読が不可能であることが数学的に証明されています。<br/><ul><li class=\"lia\">量子暗号は、量子コンピュータ上で行われる計算処理を指しているわけではなく、共通鍵の安全な配送が主な役割です。暗号化と復号は古典コンピュータと同じ計算を行うので、従来に比べて大量のデータを処理可能とするものではありません。</li><li class=\"lii\">量子暗号は共通鍵暗号方式のひとつではなく、量子鍵配送とワンタイムパッドの組合せによって、盗聴の検出や解読に対する耐性を強化する技術です。データの送受信は量子ビットでは行わず、従来どおり古典ビットで行います。また、通信の高速化を目的としていません。</li><li class=\"liu\">鍵の共有に公開鍵暗号方式は使用しません。量子鍵配送では、光の特性を利用して安全に鍵を共有します。なお、量子雑音を利用した共通鍵（平文よりも短い）の生成と量子鍵配送を組み合わる方式は、量子雑音ストリーム暗号と呼ばれます。</li><li class=\"lie\">正しい。量子暗号は、通信ごとに使い捨ての鍵を使用すること、その鍵を量子通信路で安全に配送するという2つの要素を組み合わせた暗号化通信です。観察されると変化する光子の性質により盗聴を検知できるため、安全な鍵だけを受信することができます。また、送信側と受信側で同じ基底盤を使用しないと正しい復号が行えないため、理論的に第三者に解読されないことが保証されます。</li></ul></div>", "past_history": ["安全確保支援士 R6秋期 問9"], "hist_count": 2}, {"id": "sc_04_haru_q7", "session": "支援士 R4春", "gap": 6, "num": 7, "topic": "中小企業におけるセキュリティ宣言", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "安全・安心なIT社会を実現するために創設された制度であり，IPA\"中小企業の情報セキュリティ対策ガイドライン\"に沿った情報セキュリティ対策に取り組むことを中小企業が自己宣言するものはどれか。", "mondai_html": "<div id=\"mondai\">安全・安心なIT社会を実現するために創設された制度であり，IPA\"中小企業の情報セキュリティ対策ガイドライン\"に沿った情報セキュリティ対策に取り組むことを中小企業が自己宣言するものはどれか。</div>", "choices": {"ア": "ISMS適合性評価制度", "イ": "ITセキュリティ評価及び認証制度", "ウ": "MyJVN", "エ": "SECURITY ACTION"}, "choices_html": {"ア": "ISMS適合性評価制度", "イ": "ITセキュリティ評価及び認証制度", "ウ": "MyJVN", "エ": "SECURITY ACTION"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SECURITY ACTION</strong>(セキュリティアクション)は、IPAが推進する制度で、中小企業自らが情報セキュリティ対策に取組むことを<em class=\"r\">自己宣言</em>するものです（※認定・取得制度ではありません）。<br/>取組み目標に応じて「★一つ星」と「★★二つ星」のロゴマークがあり、使用申込を行うことで、ロゴマークをポスター、パンフレット、名刺、封筒、会社案内、ウェブサイト等に表示して、自らの取組みをアピールすることができます。<div class=\"img_margin\"><img alt=\"07.png/image-size:194×195\" height=\"195\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/07.png\" style=\"max-width: 100%; height: auto;\" width=\"194\"/></div><ul><li class=\"lia\">ISMS適合性評価制度は、JIS Q 27001に基づき、組織が構築した情報セキュリティマネジメントシステムの適合性を評価する制度です。</li><li class=\"lii\">ITセキュリティ評価及び認証制度(JISEC)は、IT関連製品のセキュリティ機能の適切性･確実性を、セキュリティ評価基準の国際標準であるISO/IEC 15408に基づいて第三者（評価機関）が評価し、その評価結果を認証機関が認証する制度です。</li><li class=\"liu\">MyJVNは、JVN iPediaの情報を、利用者が効率的に活用して頂けるように、脆弱性対策情報を効率的に収集したり、利用者のPC上にインストールされたソフトウェア製品のバージョンを容易にチェックする等の機能を提供する仕組み（フレームワーク）です（※MyJVNウェブサイトより引用）。</li><li class=\"lie\">正しい。SECURITY ACTIONは、中小企業自らが情報セキュリティ対策に取り組むことを自己宣言する制度です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_haru_q9", "session": "支援士 R4春", "gap": 6, "num": 9, "topic": "サイバーセキュリティ経営ガイドライン", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "経済産業省とIPAが策定した\"サイバーセキュリティ経営ガイドライン(Ver2.0)\"に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">経済産業省とIPAが策定した\"サイバーセキュリティ経営ガイドライン(Ver2.0)\"に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "経営者が，実施するサイバーセキュリティ対策を投資ではなくコストとして捉えることを重視し，コストパフォーマンスの良いサイバーセキュリティ対策をまとめたものである。", "イ": "経営者が認識すべきサイバーセキュリティに関する原則と，経営者がリーダーシップを発揮して取り組むべき項目を取りまとめたものである。", "ウ": "事業の規模やビジネスモデルによらず，全ての経営者が自社に適用すべきサイバーセキュリティ対策を定めたものである。", "エ": "製造業のサプライチェーンを構成する小規模事業者の経営者が，サイバー攻撃を受けた際に行う事後対応をまとめたものである。"}, "choices_html": {"ア": "経営者が，実施するサイバーセキュリティ対策を投資ではなくコストとして捉えることを重視し，コストパフォーマンスの良いサイバーセキュリティ対策をまとめたものである。", "イ": "経営者が認識すべきサイバーセキュリティに関する原則と，経営者がリーダーシップを発揮して取り組むべき項目を取りまとめたものである。", "ウ": "事業の規模やビジネスモデルによらず，全ての経営者が自社に適用すべきサイバーセキュリティ対策を定めたものである。", "エ": "製造業のサプライチェーンを構成する小規模事業者の経営者が，サイバー攻撃を受けた際に行う事後対応をまとめたものである。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">本ガイドラインでは、サイバーセキュリティを経営問題であると位置づけています。セキュリティ対策の実施を「コスト」とは捉えるのではなく、将来の事業活動・成長に必要なものと位置づけて「投資」と捉えることが重要としています。</li><li class=\"lii\">正しい。本ガイドラインは、経営者が認識する必要がある「3原則」、及び経営者がサイバーセキュリティ対策を実施する上での責任者となる担当幹部（CISO 等）に指示すべき「重要10項目」をまとめたものです。</li><li class=\"liu\">本ガイドラインの適用対象としては、大企業及び中小企業（小規模事業者を除く）が想定されているので、「全ての経営者」という表現は誤りとなります。</li><li class=\"lie\">原則として、小規模事業者の経営者は本ガイドラインの対象外です。小規模事業者においては、IPAが策定している「中小企業の情報セキュリティ対策ガイドライン」を活用することが推奨されています。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_haru_q10", "session": "支援士 R4春", "gap": 6, "num": 10, "topic": "CRYPTRECの活動内容はどれか", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "CRYPTRECの主な活動内容はどれか。", "mondai_html": "<div id=\"mondai\">CRYPTRECの主な活動内容はどれか。</div>", "choices": {"ア": "暗号技術の技術的検討並びに国際競争力の向上及び運用面での安全性向上に関する検討を行う。", "イ": "情報セキュリティ政策に係る基本戦略の立案，官民における統一的，横断的な情報セキュリティ政策の推進に係る企画などを行う。", "ウ": "組織の情報セキュリティマネジメントシステムについて評価し認証する制度を運用する。", "エ": "認証機関から貸与された暗号モジュール試験報告書作成支援ツールを用いて暗号モジュールの安全性についての評価試験を行う。"}, "choices_html": {"ア": "暗号技術の技術的検討並びに国際競争力の向上及び運用面での安全性向上に関する検討を行う。", "イ": "情報セキュリティ政策に係る基本戦略の立案，官民における統一的，横断的な情報セキュリティ政策の推進に係る企画などを行う。", "ウ": "組織の情報セキュリティマネジメントシステムについて評価し認証する制度を運用する。", "エ": "認証機関から貸与された暗号モジュール試験報告書作成支援ツールを用いて暗号モジュールの安全性についての評価試験を行う。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_10.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CRYPTREC</strong>(Cryptography Research and Evaluation Committees)は、電子政府推奨暗号の安全性を評価・監視し、暗号技術の適切な実装法・運用法を調査・検討するプロジェクトです。暗号技術評価委員会と暗号技術活用委員会の2つの委員会で構成されており、暗号技術評価委員会では暗号技術の安全性評価を中心とした技術的検討を、暗号技術活用委員会では暗号技術における国際競争力の向上及び運用面での安全性向上に関する検討をそれぞれ行っています（※参考：CRYPTREC公式サイト）。<br/><br/>暗号の安全性に関する情報を提供することを目的として、「共通鍵暗号」「公開鍵暗号」「ハッシュ関数」「擬似乱数生成系」の4種類の暗号技術に対して国内外の暗号研究者による評価を行い、評価レポートや推奨可能な暗号のリストを作成することが主な活動内容です。<ul><li class=\"lia\">正しい。CRYPTRECの活動内容です。</li><li class=\"lii\">国家サイバー統括室(NCO)の活動内容です。</li><li class=\"liu\">情報マネジメントシステム認定センター(ISMS-AC)の活動内容です。</li><li class=\"lie\">独立行政法人情報処理推進機構(IPA)により運用されている暗号モジュール試験及び認証制度(JCMVP)の活動内容です。</li></ul></div>", "past_history": ["安全確保支援士 R2秋期 問8", "情報セキュリティ H25春期 問11", "情報セキュリティ H26秋期 問8", "情報セキュリティ H28秋期 問8"], "hist_count": 5}, {"id": "sc_04_haru_q11", "session": "支援士 R4春", "gap": 6, "num": 11, "topic": "MITB攻撃に有効な対策はどれか", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "インターネットバンキングの利用時に被害をもたらすMITB(Man-in-the-Browser)攻撃に有効なインターネットバンクでの対策はどれか。", "mondai_html": "<div id=\"mondai\">インターネットバンキングの利用時に被害をもたらすMITB(Man-in-the-Browser)攻撃に有効なインターネットバンクでの対策はどれか。</div>", "choices": {"ア": "インターネットバンキングでの送金時に接続するWebサイトの正当性を確認できるよう，EV SSLサーバ証明書を採用する。", "イ": "ンターネットバンキングでの送金時に利用者が入力した情報と，金融機関が受信した情報とに差異がないことを検証できるよう，トランザクション署名を利用する。", "ウ": "インターネットバンキングでのログイン認証において，一定時間ごとに自動的に新しいパスワードに変更されるワンタイムパスワードを導入する。", "エ": "インターネットバンキング利用時の通信をSSLではなくTLSを利用して暗号化するようにWebサイトを設定する。"}, "choices_html": {"ア": "インターネットバンキングでの送金時に接続するWebサイトの正当性を確認できるよう，EV SSLサーバ証明書を採用する。", "イ": "ンターネットバンキングでの送金時に利用者が入力した情報と，金融機関が受信した情報とに差異がないことを検証できるよう，トランザクション署名を利用する。", "ウ": "インターネットバンキングでのログイン認証において，一定時間ごとに自動的に新しいパスワードに変更されるワンタイムパスワードを導入する。", "エ": "インターネットバンキング利用時の通信をSSLではなくTLSを利用して暗号化するようにWebサイトを設定する。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_11.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>MITB(Man-in-the-Browser)攻撃</strong>は、ユーザーのPCに侵入したマルウェアが、Webブラウザの内部処理に介入し、Webブラウザに表示される画面や、Webサーバの間でやり取りされる送受信データを不正に書き換える攻撃です。<br/><br/>インターネットバンキングへのログインを検知し、利用者のセッションを乗っ取って振込先口座番号をすり替え、不正送金を行うといった被害例が知られています。通信を改ざんする点はMan-in-the-Middle攻撃と同じですが、MITBではクライアントPC内部（暗号化前・復号後の段階で）で書換えが行われるため、Webサーバ側で不正処理を判別して拒否することが難しいという特徴があります。<div class=\"img_margin\"><img alt=\"11.png/image-size:540×267\" height=\"267\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/11.png\" style=\"max-width: 100%; height: auto;\" width=\"540\"/></div><strong>トランザクション署名</strong>(Transaction Signature)とは、マルウェアの影響を受けないハードウェアトークンが、振込先口座番号や振込金額といった取引内容を入力として専用の署名コードを生成し、そのコードを用いて取引の正当性を確認する仕組みです。<br/><br/>利用者は、Webブラウザに表示された取引内容と、トークンが表示する署名コードを入力して送信します。Webサーバ側では、入力された内容と署名が一致するかを検証し、正しい場合のみ処理が実行されます。マルウェアはトークンが生成する取引内容に基づく署名を偽造できないため、通信経路上で内容が改ざんされてもサーバ側で拒否され、MITB攻撃の被害を防止できます。<ul><li class=\"lia\">正規のWebサイトへのアクセスであっても被害は発生します。したがって、EV SSL証明書でも防止効果はありません。</li><li class=\"lii\">正しい。トランザクション署名はMITB攻撃への対策として有効です。</li><li class=\"liu\">ワンタイムパスワードは振込情報と紐づいていません。利用者が正しいワンタイムパスワードを入力すれば、書き換えられた送信データであっても、システムはその要求を正規の処理として受け付けてしまいます。したがって、有効な対策ではありません。</li><li class=\"lie\">MITB攻撃によるデータ書換えはPC内部で行われます。通信経路上で改ざんするわけではないため、TLSで暗号化をしても有効な対策とはなりません。</li></ul></div>", "past_history": ["安全確保支援士 R2秋期 問10", "安全確保支援士 H29春期 問11", "安全確保支援士 H30秋期 問9"], "hist_count": 4}, {"id": "sc_04_haru_q12", "session": "支援士 R4春", "gap": 6, "num": 12, "topic": "クラウドサービス区分", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "JIS X 9401:2016(情報技術－クラウドコンピューティング－概要及び用語)の定義によるクラウドサービス区分の一つであり，クラウドサービスカスタマが表中の項番1と2の責務を負い，クラウドサービスプロバイダが項番3～5の責務を負うものはどれか。", "mondai_html": "<div id=\"mondai\">JIS X 9401:2016(情報技術－クラウドコンピューティング－概要及び用語)の定義によるクラウドサービス区分の一つであり，クラウドサービスカスタマが表中の項番1と2の責務を負い，クラウドサービスプロバイダが項番3～5の責務を負うものはどれか。<div class=\"img_margin\"><img alt=\"12.png/image-size:515×247\" height=\"247\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/12.png\" style=\"max-width: 100%; height: auto;\" width=\"515\"/></div></div>", "choices": {"ア": "HaaS", "イ": "IaaS", "ウ": "PaaS", "エ": "SaaS"}, "choices_html": {"ア": "HaaS", "イ": "IaaS", "ウ": "PaaS", "エ": "SaaS"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_12.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">JIS X 9401:2016では、クラウドコンピューティングのサービスモデル「SaaS」「PaaS」「IaaS」について次のように区分しています。HaaSは、Hardware as a Serviceの略でIaaSとほぼ同義ですが、JIS X 9401:2016では定義されていません。<dl><dt>SaaS（Software as a Service）</dt><dd>サービス利用者が、クラウドサービス提供者のアプリケーションを利用することができる形態</dd><dt>PaaS（Platform as a Service）</dt><dd>サービス利用者が、クラウドサービス提供者によってサポートされる一つ以上のプログラミング言語と一つ以上の実行環境とを使って利用者が作った又は利用者が入手したアプリケーションを配置し、管理し、及び実行することができる形態</dd><dt>IaaS（Infrastructure as a Service）</dt><dd>サービス利用者が、クラウドサービス提供者の演算リソース、ストレージリソース又はネットワーキングリソースを供給及び利用することができる形態</dd></dl>3つのサービスモデルの特徴をまとめると以下のようになります。<div class=\"img_margin\"><img alt=\"12_1.png/image-size:511×190\" height=\"190\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/12_1.png\" style=\"max-width: 100%; height: auto;\" width=\"511\"/></div><div class=\"img_margin\"><img alt=\"12_2.png/image-size:363×335\" height=\"335\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/12_2.png\" style=\"max-width: 100%; height: auto;\" width=\"363\"/></div>項番3のDBMSはミドルウェアに分類されます。IaaSではミドルウェアをクラウドサービスカスタマ(利用者)側で用意するため、DBMSに対する\"修正プログラム適用\"と\"権限設定\"をクラウドサービスプロバイダ(提供者)側で行うのはSaaSまたはPaaSです。そして、アプリケーションに対する責務である項番1、2が利用者側に課されるのは、アプリケーションを利用者側で用意するPaaSまたはIaaSです。したがって、両方の条件に該当する「PaaS」が正解です。</div>", "past_history": ["安全確保支援士 R2秋期 問11", "安全確保支援士 H30秋期 問10"], "hist_count": 3}, {"id": "sc_04_haru_q13", "session": "支援士 R4春", "gap": 6, "num": 13, "topic": "DNSSECで実現できることはどれか", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "DNSSECで実現できることはどれか。", "mondai_html": "<div id=\"mondai\">DNSSECで実現できることはどれか。</div>", "choices": {"ア": "DNSキャッシュサーバが得た応答中のリソースレコードが，権威DNSサーバで管理されているものであり，改ざんされていないことの検証", "イ": "権威DNSサーバとDNSキャッシュサーバとの通信を暗号化することによる，ゾーン情報の漏えいの防止", "ウ": "長音\"ー\"と漢数字\"一\"などの似た文字をドメイン名に用いて，正規サイトのように見せかける攻撃の防止", "エ": "利用者のURLの入力誤りを悪用して，偽サイトに誘導する攻撃の検知"}, "choices_html": {"ア": "DNSキャッシュサーバが得た応答中のリソースレコードが，権威DNSサーバで管理されているものであり，改ざんされていないことの検証", "イ": "権威DNSサーバとDNSキャッシュサーバとの通信を暗号化することによる，ゾーン情報の漏えいの防止", "ウ": "長音\"ー\"と漢数字\"一\"などの似た文字をドメイン名に用いて，正規サイトのように見せかける攻撃の防止", "エ": "利用者のURLの入力誤りを悪用して，偽サイトに誘導する攻撃の検知"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>DNSSEC</strong>(DNS Security Extensions)は、DNSにおける応答の正当性を保証するための拡張仕様です。<br/><br/>DNSSECでは、次の手順によって応答レコードが改ざんされておらず、正当な管理者によって生成された応答レコードであることを検証します。<ol><li>DNSキャッシュサーバは、DNSコンテンツ(権威)サーバに対してドメイン問合せを行う（通常と同じ）</li><li>DNSコンテンツサーバは、ドメイン応答に自身の<em class=\"r\">デジタル署名</em>を付加してDNSキャッシュサーバに送信する</li><li>応答を受け取ったDNSキャッシュサーバは、DNSコンテンツサーバの公開鍵を使用してデジタル署名を検証し、内容の正当性を確認する</li></ol><div class=\"img_margin\"><img alt=\"13.png/image-size:508×132\" height=\"132\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/13.png\" style=\"max-width: 100%; height: auto;\" width=\"508\"/></div>DNSSECで実現できることは、権威DNSサーバの応答レコードの正当性、完全性の確認なので、「ア」が適切な記述です。<ul><li class=\"lia\">正しい。応答中に含まれるリソースレコードが改ざんされておらず、DNSサーバ上で管理されていることが確認できます。</li><li class=\"lii\">DNSSECには暗号化の仕組みがありません。ゾーン情報の暗号化には、DNS over TLS(DoT)やDNS over HTTPS(DoH)が用いられます。</li><li class=\"liu\">DNSSECでは防げません。利用者が混同するおそれのある類似ドメインに対しては、紛争処理機関に対してドメイン名紛争処理を申し立て、取消や移転処分を求めるのが有効です。なお、正当なドメインに似せたドメインを用いる攻撃は、ドッペルゲンガードメインと呼ばれます。</li><li class=\"lie\">DNSSECでは防げません。なお、URLの入力ミス・打ち間違いに乗じて偽サイトに誘導する行為は、タイポスクワッティングと呼ばれます。</li></ul></div>", "past_history": ["安全確保支援士 R2秋期 問15", "情報セキュリティ H27春期 問14", "情報セキュリティ H28秋期 問13", "安全確保支援士 H30春期 問16"], "hist_count": 5}, {"id": "sc_04_haru_q14", "session": "支援士 R4春", "gap": 6, "num": 14, "topic": "HSTSの動作はどれか", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "HTTP Strict Transport Security(HSTS)の動作はどれか。", "mondai_html": "<div id=\"mondai\">HTTP Strict Transport Security(HSTS)の動作はどれか。</div>", "choices": {"ア": "HTTP over TLS(HTTPS)によって接続しているとき，EV SSL証明書であることを利用者が容易に識別できるように，Webブラウザのアドレス表示部分を緑色に表示する。", "イ": "Webサーバからコンテンツをダウンロードするとき，どの文字列が秘密情報かを判定できないように圧縮する。", "ウ": "WebサーバとWebブラウザとの間のTLSのハンドシェイクにおいて，一度確立したセッションとは別の新たなセッションを確立するとき，既に確立したセッションを使って改めてハンドシェイクを行う。", "エ": "Webサイトにアクセスすると，Webブラウザは，以降の指定された期間，当該サイトには全てHTTPSによって接続する。"}, "choices_html": {"ア": "HTTP over TLS(HTTPS)によって接続しているとき，EV SSL証明書であることを利用者が容易に識別できるように，Webブラウザのアドレス表示部分を緑色に表示する。", "イ": "Webサーバからコンテンツをダウンロードするとき，どの文字列が秘密情報かを判定できないように圧縮する。", "ウ": "WebサーバとWebブラウザとの間のTLSのハンドシェイクにおいて，一度確立したセッションとは別の新たなセッションを確立するとき，既に確立したセッションを使って改めてハンドシェイクを行う。", "エ": "Webサイトにアクセスすると，Webブラウザは，以降の指定された期間，当該サイトには全てHTTPSによって接続する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>HSTS</strong>(HTTP Strict Transport Security)は、Webサイトに<em class=\"r\">HTTPS</em>で接続することをWebブラウザに強制するHTTPレスポンスヘッダーです。<br/><div class=\"pre\">//アクセスから365日間、サブドメインも含めてHTTPS接続を強制<br/>Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</div>WebサイトをHTTPS化した際には 301 HTTP リダイレクトを使用して、HTTPのアドレスにアクセスした利用者をHTTPSページに転送する設定を行うのが一般的ですが、初回のHTTPアクセスは暗号化されていないため、HTTPSページへのリダイレクト前に攻撃(リダイレクト先の書換えや中間者攻撃など)を受ける可能性が残されています。<br/><br/>HSTSをサポートしているWebサイトでは、HTTPでアクセスしようとしたWebブラウザに対して、(コンテンツを返さずに)レスポンスヘッダーでHSTSを通知します。HSTS通知を受け取ったWebブラウザは、HTTPSページにリダイレクトするとともに、この情報を記録しておき、以降の指定された期間、このサイトへの接続の全てをHTTPSとします。これにより、次回からはHTTPのアドレスにアクセスした場合でもWebブラウザが自動的にHTTPSのページを取得しに行くようになるため、セキュリティを高めることができます。<ul><li class=\"lia\">EV SSL証明書であってもなくてもアドレスバーの表示は変わりません。<br/>【参考】HTTPSへの移行期には、EV SSL証明書（SSL証明書のうち身元確認と厳格な審査を受けたもの）であれば、アドレスバーが安全を示す緑色になったり、アドレスバーに登録組織名が表示されたりといった違いがありました。</li><li class=\"lii\">圧縮サイドチャネル攻撃への対策です。固定長ブロック圧縮やランダムパディングの負荷などの手法があります。</li><li class=\"liu\">TLSのセッション再開の動作です。</li><li class=\"lie\">正しい。HSTSの動作です。</li></ul></div>", "past_history": ["安全確保支援士 R6春期 問13", "安全確保支援士 H30秋期 問12"], "hist_count": 3}, {"id": "sc_04_haru_q15", "session": "支援士 R4春", "gap": 6, "num": 15, "topic": "TLSに関する記述", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "TLSに関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">TLSに関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "TLSで使用するWebサーバのデジタル証明書にはIPアドレスの組込みが必須なので，WebサーバのIPアドレスを変更する場合は，デジタル証明書を再度取得する必要がある。", "イ": "TLSで使用する共通鍵の長さは，128ビット未満で任意に指定する。", "ウ": "TLSで使用する個人認証用のデジタル証明書は，ICカードにも格納することができ，利用するPCを特定のPCに限定する必要はない。", "エ": "TLSはWebサーバを経由した特定の利用者が通信するためのプロトコルであり，Webサーバへの事前の利用者登録が不可欠である。"}, "choices_html": {"ア": "TLSで使用するWebサーバのデジタル証明書にはIPアドレスの組込みが必須なので，WebサーバのIPアドレスを変更する場合は，デジタル証明書を再度取得する必要がある。", "イ": "TLSで使用する共通鍵の長さは，128ビット未満で任意に指定する。", "ウ": "TLSで使用する個人認証用のデジタル証明書は，ICカードにも格納することができ，利用するPCを特定のPCに限定する必要はない。", "エ": "TLSはWebサーバを経由した特定の利用者が通信するためのプロトコルであり，Webサーバへの事前の利用者登録が不可欠である。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>TLS</strong>(Transport Layer Security)は、OSI基本参照モデルのトランスポート層において、通信の暗号化、デジタル証明書を利用した改ざん検知、ノード認証などの機能を提供する統合セキュアプロトコルです。主にWebブラウザとWebサーバ間でデータを安全にやり取りするための業界標準プロトコルとして使用されています。<ul><li class=\"lia\">デジタル証明書では、証明書が有効なサーバ(コモンネーム)を記述するのにIPアドレスだけでなくFQDNも使用できます。FQDNで指定した場合はIPアドレスが変わっても再発行の必要はありません。</li><li class=\"lii\">TLSでは鍵長40～256ビットの共通鍵を使用して暗号化通信を行います。日本国内においても256ビットまでの鍵長を制限なく選択できます。ただし、TLS1.1以降では40ビットの鍵の使用は禁止されています。</li><li class=\"liu\">正しい。デジタル証明書の内容は電子データなので様々な媒体に格納することができます。ICカードに格納すれば認証情報を持ち運べるので、利用する端末が限定されることもありません。<br/>個人認証用のデジタル証明書は電子証明書と呼ばれ、公的認証サービスなどを利用すると電子証明書が記録されたICカードの発行をうけることができます。</li><li class=\"lie\">TLSは、インターネット上で安全に情報をやり取りするために開発されたプロトコルで、事前の利用者登録は必要ありません。また接続先もWebサーバに限られません。</li></ul></div>", "past_history": ["情報セキュリティ H22秋期 問15", "情報セキュリティ H24秋期 問14", "安全確保支援士 H30秋期 問15", "情報セキュリティ H18春期 問48"], "hist_count": 5}, {"id": "sc_04_haru_q16", "session": "支援士 R4春", "gap": 6, "num": 16, "topic": "メール受信の暗号化プロトコル", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "電子メールをスマートフォンで受信する際のメールサーバとスマートフォンとの間の通信をメール本文を含めて暗号化するプロトコルはどれか。", "mondai_html": "<div id=\"mondai\">電子メールをスマートフォンで受信する際のメールサーバとスマートフォンとの間の通信をメール本文を含めて暗号化するプロトコルはどれか。</div>", "choices": {"ア": "APOP", "イ": "IMAPS", "ウ": "POP3", "エ": "SMTP Submission"}, "choices_html": {"ア": "APOP", "イ": "IMAPS", "ウ": "POP3", "エ": "SMTP Submission"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>IMAPS</strong>(IMAP over SSL/TLS)は、メール受信プロトコルであるIMAP(Internet Message Access Protocol)にTLSを組み合わせ、TLSによって暗号化された通信コネクション上でメール受信を行うプロトコルです。バージョン番号を付けてIMAP4Sと表記されることもあります。<br/><br/>既存のプロトコル名の後ろに\"S\"が付いているものは、TLSにより暗号化されたものであることが多いです。HTTP<u>S</u>もその1つです。POP3にもTLS版であるPOP3<u>S</u>というプロトコルがあります。<ul><li class=\"lia\">Authenticated POPの略。メール受信前の認証におけるパスワード送信を暗号化(MD5ハッシュ化)することで安全性を高めたプロトコルです。暗号化されるのはパスワードだけなので、メール本文は暗号化されず平文のまま通信経路上を流れます。</li><li class=\"lii\">正しい。IMAPSは認証やメール本文の受信など、IMAP通信の全てをTLSによって暗号化するプロトコルです。</li><li class=\"liu\">POP3は、認証やメール本文の通信を平文で行うメール受信プロトコルです。</li><li class=\"lie\">SMTP Submissionは、ユーザー(メールソフト)からのメール送信を専門に受け付けるサブミッションポート(587/TCP)を用意し、SMTP-AUTH認証を経たユーザーからのメールだけを送信する仕組みです。メール受信用途ではなく、OP25Bの影響を受けずに外部のメールサーバを使用したメール送信を可能にする仕組みなので誤りです。</li></ul></div>", "past_history": ["安全確保支援士 R5秋期 問16"], "hist_count": 2}, {"id": "sc_04_haru_q17", "session": "支援士 R4春", "gap": 6, "num": 17, "topic": "IEEE 802.1XとRADIUSでの認証", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "利用者認証情報を管理するサーバ1台と複数のアクセスポイントで構成された無線LAN環境を実現したい。PCが無線LAN環境に接続するときの利用者認証とアクセス制御に，IEEE 802.1XとRADIUSを利用する場合の標準的な方法はどれか。", "mondai_html": "<div id=\"mondai\">利用者認証情報を管理するサーバ1台と複数のアクセスポイントで構成された無線LAN環境を実現したい。PCが無線LAN環境に接続するときの利用者認証とアクセス制御に，IEEE 802.1XとRADIUSを利用する場合の標準的な方法はどれか。</div>", "choices": {"ア": "PCにはIEEE 802.1Xのサプリカントを実装し，かつ，RADIUSクライアントの機能をもたせる。", "イ": "アクセスポイントにはIEEE 802.1Xのオーセンティケータを実装し，かつ，RADIUSクライアントの機能をもたせる。", "ウ": "アクセスポイントにはIEEE 802.1Xのサプリカントを実装し，かつ，RADIUSサーバの機能をもたせる。", "エ": "サーバにはIEEE 802.1Xのオーセンティケータを実装し，かつ，RADIUSサーバの機能をもたせる。"}, "choices_html": {"ア": "PCにはIEEE 802.1Xのサプリカントを実装し，かつ，RADIUSクライアントの機能をもたせる。", "イ": "アクセスポイントにはIEEE 802.1Xのオーセンティケータを実装し，かつ，RADIUSクライアントの機能をもたせる。", "ウ": "アクセスポイントにはIEEE 802.1Xのサプリカントを実装し，かつ，RADIUSサーバの機能をもたせる。", "エ": "サーバにはIEEE 802.1Xのオーセンティケータを実装し，かつ，RADIUSサーバの機能をもたせる。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>IEEE 802.1X</b>は、LAN内のユーザー認証の方式を定めたIEEE規格で、正当な端末以外がLANに参加することを防ぐ技術です。当初は有線LAN向けとして策定されましたが、その後にEAP(Extensible Authentication Protocol)として実装され、現在では無線LAN環境(IEEE 802.11)における標準の認証機構として利用されています。また、IEEE 802.1Xは「検疫ネットワーク」を実現するための中核技術となっています。<br/><br/>IEEE 802.1Xの認証システムでは、認証を受けるクライアントである「<b>サプリカント</b>(supplicant)」、RADIUSなどの「<b>認証サーバ</b>(authentication server)」、RADIUSクライアントの機能を持ち、認証サーバ間の認証プロセスを相互に中継する認証装置(認証スイッチ)である「<b>オーセンティケータ</b>(authenticator)」の3つの要素で構成されます。<div class=\"img_margin\"><img alt=\"17.png/image-size:409×277\" height=\"277\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/17.png\" style=\"max-width: 100%; height: auto;\" width=\"409\"/></div><ul><li class=\"lia\">RADIUSクライアントの機能はアクセスポイントにもたせます。</li><li class=\"lii\">正しい。アクセスポイントはPC端末からの接続要求を受けるオーセンティケータを実装し、かつ、認証サーバにRADIUSプロトコルで問合せを行うRADIUSクライアントの機能を持たせます。</li><li class=\"liu\">サプリカントはPC端末に実装し、RADIUSサーバの機能は認証サーバにもたせます。</li><li class=\"lie\">オーセンティケータはアクセスポイントに実装します。</li></ul></div>", "past_history": ["安全確保支援士 R6秋期 問17", "情報セキュリティ H25春期 問7", "安全確保支援士 H29春期 問17", "安全確保支援士 H30秋期 問17"], "hist_count": 5}, {"id": "sc_04_haru_q18", "session": "支援士 R4春", "gap": 6, "num": 18, "topic": "無線LANのアクセス制御方式", "subcat": "データ通信と制御", "category": "情報セキュリティ", "mondai": "IEEE 802.11a/b/g/nで採用されているアクセス制御方式はどれか。", "mondai_html": "<div id=\"mondai\">IEEE 802.11a/b/g/nで採用されているアクセス制御方式はどれか。</div>", "choices": {"ア": "CSMA/CA", "イ": "CSMA/CD", "ウ": "LAPB", "エ": "トークンパッシング方式"}, "choices_html": {"ア": "CSMA/CA", "イ": "CSMA/CD", "ウ": "LAPB", "エ": "トークンパッシング方式"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>IEEE 802.11</strong>は、無線LANの伝送方式を規定した標準規格です。<br/><br/><strong>CSMA/CA</strong>(搬送波感知多元接続／衝突回避方式)は、無線LANにおけるアクセス制御方式の一つで、IEEE 802.11a/b/g/nなどにおいて基本的な通信手順として使われています。CSMA/CDが「衝突の発生を許容し、衝突発生後に再び衝突が発生しないように制御する」のに対し、CSMA/CAは「できるだけ衝突を回避できる」ような仕組みになっていることが特徴です。<ul><li class=\"lia\">正しい。CSMA/CAは、IEEE 802.11シリーズで採用されているアクセス制御方式です。</li><li class=\"lii\">CSMA/CDは、有線LANで使用されるアクセス制御方式です。</li><li class=\"liu\">Link Access Procedure, Balancedの略。公衆回線網を通じてパケット通信を行うためのプロトコルであるITU-T X.25のパケット交換網で使用される伝送手順を制御するためのプロトコルです。</li><li class=\"lie\">トークンパッシング方式は、リング型有線LANで使用されるアクセス制御方式です。</li></ul></div>", "past_history": ["情報セキュリティ H25春期 問17", "安全確保支援士 H29春期 問20", "情報セキュリティ H20春期 問18"], "hist_count": 4}, {"id": "sc_04_haru_q19", "session": "支援士 R4春", "gap": 6, "num": 19, "topic": "PCの時刻合わせに使用されるプロトコル", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "インターネットに接続されたPCの時刻合わせに使用されるプロトコルはどれか。", "mondai_html": "<div id=\"mondai\">インターネットに接続されたPCの時刻合わせに使用されるプロトコルはどれか。</div>", "choices": {"ア": "NNTP", "イ": "RTCP", "ウ": "SNTP", "エ": "TFTP"}, "choices_html": {"ア": "NNTP", "イ": "RTCP", "ウ": "SNTP", "エ": "TFTP"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">Network News Transfer Protocolの略。インターネット上でニュースを閲覧、編集、配信等をすることができるプロトコルです。ここでいうインターネット上のニュースとは、現在でいえば電子掲示板のようなものを指しており、NetNewsと呼ばれる配信システム上でNNTPによるアクセスが行われます。<br/>NNTPは、インターネットが普及する前の1990年代前半に頻繁に使用されていましたが、現在ではほとんど使用されていません。</li><li class=\"lii\">RTP Control Protocolの略。IP電話で音声をやり取りするのに用いられるRTP(Real-time Transfer Protocol)とセットで使用され、特にRTPで送受信されるデータの品質管理に使われます。具体的には、RTPにより受信した音声データの品質を送信側のクライアントにフィードバックし、またはパケット情報等の送信された音声データに関する情報を音声データの受信側へ送信します。</li><li class=\"liu\">正しい。SNTP(Simple Network Time Protocol)は、時刻合わせのプロトコルNTPから、現在時刻を問い合わせる部分を抜き出して簡略化したサブセット的なプロトコルです。使用するポート番号はNTPと同じく123/UDPです。</li><li class=\"lie\">Trivial File Transfer Protocolの略。ファイルをネットワーク上で送受信するプロトコルです。FTP(File Transfer Protocol)に比べて、簡易的なプロトコルであり、暗号化機能や認証機能を持たない分、動作が軽く伝送効率が高いのが特徴です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_haru_q20", "session": "支援士 R4春", "gap": 6, "num": 20, "topic": "スパニングツリープロトコル", "subcat": "データ通信と制御", "category": "情報セキュリティ", "mondai": "複数台のレイヤー2スイッチで構成されるネットワークが複数の経路をもつ場合に，イーサネットフレームのループが発生することがある。そのループの発生を防ぐためのTCP/IPネットワークインタフェース層のプロトコルはどれか。", "mondai_html": "<div id=\"mondai\">複数台のレイヤー2スイッチで構成されるネットワークが複数の経路をもつ場合に，イーサネットフレームのループが発生することがある。そのループの発生を防ぐためのTCP/IPネットワークインタフェース層のプロトコルはどれか。</div>", "choices": {"ア": "IGMP", "イ": "RIP", "ウ": "SIP", "エ": "スパニングツリープロトコル"}, "choices_html": {"ア": "IGMP", "イ": "RIP", "ウ": "SIP", "エ": "スパニングツリープロトコル"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>スパニングツリープロトコル</strong>(Spanning Tree Protocol：STP)は、ループ状になっているネットワークをルートブリッジを根とした論理的な木構造のトポロジーとして扱うためのプロトコルです。IEEE802.1Dとして標準化されています。<br/><br/>フレームの転送経路を冗長化するためには、レイヤー2スイッチをループ(輪)状に構成する必要があります。しかしこのようなループ状の構成では、ブロードキャストフレームが延々と循環する「ブロードキャストストーム」が起こり、正常に通信を行うことができません。<div class=\"img_margin\"><img alt=\"20_1.png/image-size:366×185\" height=\"185\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/20_1.png\" style=\"max-width: 100%; height: auto;\" width=\"366\"/></div>スパニングツリープロトコルは、一部のスイッチ間リンクを遮断し、ループ構造のネットワークを論理的な木構造とすることで、フレームがループしないようにします。加えて、スイッチの障害を自動的に検知し、ネットワークを再構成する機能も持ちます。障害対策でスイッチを冗長化している際には、スパニングツリープロトコルを動作させておくのが必要不可欠です。<div class=\"img_margin\"><img alt=\"20_2.png/image-size:434×296\" height=\"296\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/20_2.png\" style=\"max-width: 100%; height: auto;\" width=\"434\"/></div><ul><li class=\"lia\">Internet Group Management Protocolの略。IPマルチキャストにおいて、参加するホストのグループを制御するためのプロトコルです。</li><li class=\"lii\">Routing Information Protocolの略。UDP/IP上で動作するルーティングプロトコルです。</li><li class=\"liu\">Session Initiation Protocolの略。2つ以上のクライアント間でセッションを確立するための汎用的なプロトコルです。</li><li class=\"lie\">正しい。スパニングツリープロトコルは、ネットワークにおいてループを防ぐための技術です。</li></ul></div>", "past_history": ["安全確保支援士 R2秋期 問20", "情報セキュリティ H21秋期 問19"], "hist_count": 3}, {"id": "sc_04_haru_q21", "session": "支援士 R4春", "gap": 6, "num": 21, "topic": "データリネージはどれか", "subcat": "データベース応用", "category": "情報セキュリティ", "mondai": "データウェアハウスのメタデータに関する記述のうち，データリネージはどれか。", "mondai_html": "<div id=\"mondai\">データウェアハウスのメタデータに関する記述のうち，データリネージはどれか。</div>", "choices": {"ア": "誰がどのデータを見てよいかを示す情報であり，適切なアクセス制御を目的として設定される。", "イ": "データが誰によって作られ管理されているかを示す情報であり，データ構造やデータ辞書を見ても意味が分からないときの問合せ先を表す。", "ウ": "データがどこから発生し，どのような変換及び加工を経て，現在の形になったかを示す情報であり，データの生成源の特定又は障害時の影響調査に利用できる。", "エ": "データ構造がどのように定義されているかを示す情報であり，Webサイトなどに公開して検索できるようにする。"}, "choices_html": {"ア": "誰がどのデータを見てよいかを示す情報であり，適切なアクセス制御を目的として設定される。", "イ": "データが誰によって作られ管理されているかを示す情報であり，データ構造やデータ辞書を見ても意味が分からないときの問合せ先を表す。", "ウ": "データがどこから発生し，どのような変換及び加工を経て，現在の形になったかを示す情報であり，データの生成源の特定又は障害時の影響調査に利用できる。", "エ": "データ構造がどのように定義されているかを示す情報であり，Webサイトなどに公開して検索できるようにする。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>データリネージ</strong>とは、データがどこで発生し、これまでどのような変換・加工を経て現在に至るのかという、そのデータに関する一連の履歴情報のことです。リネージ(lineage)は「系統・系譜・血統」を意味する言葉です。<br/><br/>データウェアハウスに保存されるデータは多種多様なシステムから統合されたものですが、データリネージの情報を利用することで、データ生成源やこれまでに実施されたデータ処理を特定することができます。これによりデータ管理が効率化されるほか、障害時の影響調査やデータのセキュリティなどにも役立てられます。<br/><br/>したがって「ウ」の記述が適切です。<ul><li class=\"lia\">アクセス権限に関する記述です。データリネージにはアクセス権を制御するような情報は含まれません。</li><li class=\"lii\">データ管理者情報に関する記述です。データリネージから誰によってデータが作られたかを追跡できる可能性はありますが、データに関する問合せ先を表すわけではありません。</li><li class=\"liu\">正しい。データリネージは、データの出発点から変換・加工の過程を追跡し、データの変遷を明確にする情報です。データリネージの情報を参照することで、その障害がどのデータを更新・加工等を行った時に発生したかといった、障害の原因の洗い出しに活用することもできます。</li><li class=\"lie\">データカタログやデータディクショナリに関する記述です。データ構造の定義情報はデータリネージに含まれません。また一般的に、データリネージはWebサイト等に公開し、検索できるようにするものではありません。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_haru_q22", "session": "支援士 R4春", "gap": 6, "num": 22, "topic": "フールプルーフ", "subcat": "システム方式設計", "category": "情報セキュリティ", "mondai": "システムに規定外の無効なデータが入力されたとき，誤入力であることを伝えるメッセージを表示して正しい入力を促すことによって，システムを異常終了させない設計は何というか。", "mondai_html": "<div id=\"mondai\">システムに規定外の無効なデータが入力されたとき，誤入力であることを伝えるメッセージを表示して正しい入力を促すことによって，システムを異常終了させない設計は何というか。</div>", "choices": {"ア": "フールプルーフ", "イ": "フェールセーフ", "ウ": "フェールソフト", "エ": "フォールトトレランス"}, "choices_html": {"ア": "フールプルーフ", "イ": "フェールセーフ", "ウ": "フェールソフト", "エ": "フォールトトレランス"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">正しい。フールプルーフは、不特定多数の人が操作するシステムに、入力データのチェックやエラーメッセージの表示などの機能を加えることで、人為的ミスによるシステムの誤動作を防ぐように設計する考え方です。</li><li class=\"lii\">フェールセーフは、システムの不具合や故障が発生したときでも、障害の影響範囲を最小限にとどめ、常に安全を最優先にして制御を行う考え方です。</li><li class=\"liu\">フェールソフトは、システムに障害が発生した時に、多少の性能の低下を許容し、システム全体の運転継続に必要な機能を維持させようとする考え方です。</li><li class=\"lie\">フォールトトレランスは、構成機器の二重化などによって、システムの一部に障害が発生しても全体としては停止することなく稼働を続け、その間に復旧を図るようにシステムを設計する方針です。</li></ul></div>", "past_history": ["情報セキュリティ H23特別 問22"], "hist_count": 2}, {"id": "sc_04_haru_q23", "session": "支援士 R4春", "gap": 6, "num": 23, "topic": "ソフトウェアライフサイクルプロセス", "subcat": "開発プロセス・手法", "category": "情報セキュリティ", "mondai": "JIS X 0160:2021(ソフトウェアライフサイクルプロセス)によれば，ライフサイクルモデルの目的及び成果を達成するために，ライフサイクルプロセスを修正するか，又は新しいライフサイクルプロセスを定義することを何というか。", "mondai_html": "<div id=\"mondai\">JIS X 0160:2021(ソフトウェアライフサイクルプロセス)によれば，ライフサイクルモデルの目的及び成果を達成するために，ライフサイクルプロセスを修正するか，又は新しいライフサイクルプロセスを定義することを何というか。</div>", "choices": {"ア": "シミュレーション", "イ": "修整(Tailoring)", "ウ": "統治(Governance)", "エ": "ベンチマーキング"}, "choices_html": {"ア": "シミュレーション", "イ": "修整(Tailoring)", "ウ": "統治(Governance)", "エ": "ベンチマーキング"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">シミュレーションは、一般的にはモデリング等の技法を用いて予想される事象の振る舞いを再現、実践等を行うことを指します。JIS X 0160:2021では、システム分析プロセスやソフトウェアの妥当性確認の手法・技法として、シミュレーションが挙げられています。</li><li class=\"lii\">正しい。修整(Tailoring)は、各プロジェクトの目的達成のため、組織やプロジェクトの性質やニーズに合わせて、JIS X 0160で定義されたソフトウェアライフサイクルプロセスからアクティビティを選定したり一部を修正することを表します。</li><li class=\"liu\">統治(Governance)は、一般的には、組織内での行動を監視ないしは管理する仕組みを指します。JIS X 0160:2021(ソフトウェアライフサイクルプロセス)内でも上記と同じ意味合いで用いられています。\t</li><li class=\"lie\">ベンチマーキングは、他社や他分野の優良製品または優良事例等を分析し、それを自社内の目標にしたり、改善を行ったりする活動を指します。JIS X 0160:2021(ソフトウェアライフサイクルプロセス)内では、ベンチマーキングという表現は使われておりません。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_haru_q24", "session": "支援士 R4春", "gap": 6, "num": 24, "topic": "ITサービスの可用性は何%か", "subcat": "サービスマネジメントプロセス", "category": "情報セキュリティ", "mondai": "サービス提供時間帯が毎日0～24時のITサービスにおいて，ある年の4月1日0時から6月30日24時までのサービス停止状況は表のとおりであった。システムバージョンアップ作業に伴う停止時間は，計画停止時間として顧客との間で合意されている。このとき，4月1日から6月30日までのITサービスのサービス可用性は何%か。ここで，可用性(%)は小数第3位を四捨五入するものとする。〔サービス停止状況〕", "mondai_html": "<div id=\"mondai\">サービス提供時間帯が毎日0～24時のITサービスにおいて，ある年の4月1日0時から6月30日24時までのサービス停止状況は表のとおりであった。システムバージョンアップ作業に伴う停止時間は，計画停止時間として顧客との間で合意されている。このとき，4月1日から6月30日までのITサービスのサービス可用性は何%か。ここで，可用性(%)は小数第3位を四捨五入するものとする。<br/><br/>〔サービス停止状況〕<div class=\"img_margin\"><img alt=\"24.png/image-size:542×82\" height=\"82\" src=\"https://www.sc-siken.com/kakomon/04_haru/img/24.png\" style=\"max-width: 100%; height: auto;\" width=\"542\"/></div></div>", "choices": {"ア": "95.52", "イ": "95.70", "ウ": "99.52", "エ": "99.63"}, "choices_html": {"ア": "95.52", "イ": "95.70", "ウ": "99.52", "エ": "99.63"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/04_haru/am2_24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">サービスの可用性は以下の式で算出されます。<br/><br/>　可用性＝(計画サービス時間－停止時間)÷計画サービス時間<br/>　計画サービス時間＝サービス提供時間－計画停止時間<br/><br/>この式に従って、まずは計画サービス時間を求めます。サービス提供時間帯は毎日0時～24時、各月の末日は、4月30日、5月31日、6月30日ですので、サービス提供時間は、<br/><br/>　24時間×(30日＋31日＋30日)＝2,184時間<br/><br/>そして、サービス停止時間のうち「システムバージョンアップ作業に伴う停止」は計画停止に該当しますので、サービス提供時間から差し引きます。<br/><br/>　2,184時間－84時間＝2,100時間<br/><br/>よって、計画サービス時間は2,100時間となります。<br/><br/>この時間からハードウェア故障の10時間を除いた2,090時間がサービス時間の実績値になります。以上より可用性(%)は、<br/><br/>　2,090時間÷2,100時間＝0.99523…＝99.523…%<br/>（小数第3位を四捨五入して）99.52%<br/><br/>したがって「ウ」が正解です。</div>", "past_history": ["安全確保支援士 H30春期 問24"], "hist_count": 2}, {"id": "sc_03_aki_q1", "session": "支援士 R3秋", "gap": 7, "num": 1, "topic": "AIの判定結果を誤らせる攻撃", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "AIによる画像認識において，認識させる画像の中に人間には知覚できないノイズや微小な変化を含めることによってAIアルゴリズムの特性を悪用し，判定結果を誤らせる攻撃はどれか。", "mondai_html": "<div id=\"mondai\">AIによる画像認識において，認識させる画像の中に人間には知覚できないノイズや微小な変化を含めることによってAIアルゴリズムの特性を悪用し，判定結果を誤らせる攻撃はどれか。</div>", "choices": {"ア": "Adaptively Chosen Message攻撃", "イ": "Adversarial Examples攻撃", "ウ": "Distributed Reflection Denial of Service攻撃", "エ": "Model Inversion攻撃"}, "choices_html": {"ア": "Adaptively Chosen Message攻撃", "イ": "Adversarial Examples攻撃", "ウ": "Distributed Reflection Denial of Service攻撃", "エ": "Model Inversion攻撃"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">Adaptively Chosen Message攻撃(適応的選択文書攻撃)は、攻撃者が任意に選んだ文書に対して真の署名者に署名をさせた後に、そこで得た情報を用いて攻撃者が別の文書の署名を偽造する攻撃です。署名者に署名させる文書に攻撃者が事前に選んだ文書を使用する場合は、Generic Chosen Message攻撃(一般選択文書攻撃)となります。</li><li class=\"lii\">正しい。<strong>Adversarial Examples攻撃</strong>(敵対的サンプル攻撃)は、入力画像に人間の目では認識できない程度の微細なノイズを加えることによって、AIの誤判定等を引き起こす攻撃です。<br/>画像に少量のピクセルの乱れを入れたり、音声波形にほんの少し別の波形を合成したりするなど本物のデータにわずかなノイズを加えることで、AIシステムは、本物と同一分類であるのに別分類と判断する場合があります。逆にまったく別分類であるのに、ノイズを加えたことでAIが同一分類と誤認する場合もあります。このような事態を引き起こす改変データは敵対的サンプルと呼ばれ、このデータを用いて意図的に不正な判断や誤作動をAIに起こさせる攻撃が敵対的サンプル攻撃です。</li><li class=\"liu\">DRDoS攻撃は、大量の応答パケットを攻撃対象に仕向けることでサービス停止を狙う、分散反射型のサービス停止攻撃です。</li><li class=\"lie\">モデル反転攻撃のことで、機械学習済みモデルの入出力から、特定のデータが訓練データの一部であったか否かの情報を得たり、学習に用いられた訓練データを復元したりする攻撃です。</li></ul></div>", "past_history": ["安全確保支援士 R6秋期 問2"], "hist_count": 2}, {"id": "sc_03_aki_q3", "session": "支援士 R3秋", "gap": 7, "num": 3, "topic": "PQCはどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "PQC(Post-Quantum Cryptography)はどれか。", "mondai_html": "<div id=\"mondai\">PQC(Post-Quantum Cryptography)はどれか。</div>", "choices": {"ア": "量子アニーリングマシンを用いて，回路サイズ，消費電力，処理速度を飛躍的に向上させた実装性能をもつ暗号方式", "イ": "量子コンピュータを用いた攻撃に対しても，安全性を保つことができる暗号方式", "ウ": "量子コンピュータを用いて効率的に素因数分解を行うアルゴリズムによって，暗号を解読する技術", "エ": "量子通信路を用いた鍵配送システムを利用し，大容量のデータを高速に送受信する技術"}, "choices_html": {"ア": "量子アニーリングマシンを用いて，回路サイズ，消費電力，処理速度を飛躍的に向上させた実装性能をもつ暗号方式", "イ": "量子コンピュータを用いた攻撃に対しても，安全性を保つことができる暗号方式", "ウ": "量子コンピュータを用いて効率的に素因数分解を行うアルゴリズムによって，暗号を解読する技術", "エ": "量子通信路を用いた鍵配送システムを利用し，大容量のデータを高速に送受信する技術"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">Post-Quantumとは、量子コンピュータ実現後の世界のことを示しています。現代において基礎技術となっている公開鍵暗号では、素因数分解や離散対数問題を解く際に天文学的な計算量を要することを安全性の根拠としていますが、量子コンピュータが実現するとこれらが効率的に解けるようになってしまいます。<br/><br/><strong>PQC</strong>(Post-Quantum Cryptography：耐量子暗号)は、量子コンピュータによる解読に対しても耐性をもつ暗号化方式を指します。量子コンピュータの登場を見据えて開発が進められています。<br/><br/>したがって「イ」が適切な記述です。<ul><li class=\"lia\">量子暗号(Quantum Cryptography)の説明です。</li><li class=\"lii\">正しい。PQCの説明です。</li><li class=\"liu\">ショアのアルゴリズムの説明です。</li><li class=\"lie\">量子鍵配送(QKD：Quantum Key Distribution)の説明です。</li></ul></div>", "past_history": ["安全確保支援士 R6秋期 問5"], "hist_count": 2}, {"id": "sc_03_aki_q4", "session": "支援士 R3秋", "gap": 7, "num": 4, "topic": "SAML認証の特徴はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "シングルサインオンの実装方式の一つであるSAML認証の特徴はどれか。", "mondai_html": "<div id=\"mondai\">シングルサインオンの実装方式の一つであるSAML認証の特徴はどれか。</div>", "choices": {"ア": "IdP(Identity Provider)がSP(Service Provider)の認証要求によって利用者認証を行い，認証成功後に発行されるアサーションをSPが検証し，問題がなければクライアントがSPにアクセスする。", "イ": "Webサーバに導入されたエージェントが認証サーバと連携して利用者認証を行い，クライアントは認証成功後に利用者に発行されるcookieを使用してSPにアクセスする。", "ウ": "認証サーバはKerberosプロトコルを使って利用者認証を行い，クライアントは認証成功後に発行されるチケットを使用してSPにアクセスする。", "エ": "リバースプロキシで利用者認証が行われ，クライアントは認証成功後にリバースプロキシ経由でSPにアクセスする。"}, "choices_html": {"ア": "IdP(Identity Provider)がSP(Service Provider)の認証要求によって利用者認証を行い，認証成功後に発行されるアサーションをSPが検証し，問題がなければクライアントがSPにアクセスする。", "イ": "Webサーバに導入されたエージェントが認証サーバと連携して利用者認証を行い，クライアントは認証成功後に利用者に発行されるcookieを使用してSPにアクセスする。", "ウ": "認証サーバはKerberosプロトコルを使って利用者認証を行い，クライアントは認証成功後に発行されるチケットを使用してSPにアクセスする。", "エ": "リバースプロキシで利用者認証が行われ，クライアントは認証成功後にリバースプロキシ経由でSPにアクセスする。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_4.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SAML</strong>(Security Assertion Markup Language：サムエル)は、XMLベースのメッセージのやり取りによって、複数のシステムやサービスの間で認証情報、属性情報、権限の認可情
