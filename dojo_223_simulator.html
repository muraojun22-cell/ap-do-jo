ml", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>マシンビジョン</strong>は、産業用機械に搭載されたカメラによって対象物を認識し、あらかじめ決められた処理を行うシステムです。工場で製造中のモノを画像として捉えて全自動で目視検査する、駐車場で車のナンバーをみて入出庫を管理するといった使われ方をしています。<br/><br/>マシンビジョンは、機械の目にあたるカメラ、カメラ信号をソフトウェアが処理できるようデジタル変換するフレームグラバー、光源、合否判定を行うAIなどのソフトウェアで構成されています。人間の目視検査では細かい部分までわからずダメな部分を見逃す可能性があるのに対し、マシンビジョンなら高精度でミスのない判別が可能となります。良品・不良品判定をはじめ、番号などの読み取りや傷や色の調査、大きさの測定、ゴミの分別などさまざまな目的で使用されています。<br/><br/>したがって「イ」が正解です。<ul><li class=\"lia\">XR(Extended Reality)に関する記述です。</li><li class=\"lii\">正しい。マシンビジョンの目的です。</li><li class=\"liu\">マシンビジョンは画像処理・物体認識など視覚的な情報を扱うものであり、データ分析による予測処理はその範疇に含まれません。</li><li class=\"lie\">マシンビジョンは機械が人に代わって視覚的な情報を扱う技術であり、設計情報の整理や伝達は担当しません。</li></ul></div>", "mondai_html": "スマートファクトリーで使用されるAIを用いたマシンビジョンの目的として，適切なものはどれか。", "choices_html": {"ア": "作業者が装着したVRゴーグルに作業プロセスを表示することによって，作業効率を向上させる。", "イ": "従来の人間の目視検査を自動化し，検査効率を向上させる。", "ウ": "需要予測を目的として，クラウドに蓄積した入出荷データを用いて機械学習を行い，生産数の最適化を行う。", "エ": "設計変更内容を，AIを用いて吟味して，製造現場に正確に伝達する。"}}, {"id": "05_aki_q76", "session": "R5秋", "gap": 3, "num": 76, "topic": "主な要因を明確にするのに適した図法", "subcat": "業務分析・データ利活用", "category": "ストラテジ系", "mondai": "発生した故障について，発生要因ごとの件数の記録を基に，故障発生件数で上位を占める主な要因を明確に表現するのに適している図法はどれか。", "choices": {"ア": "特性要因図", "イ": "パレート図", "ウ": "マトリックス図", "エ": "連関図"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 H31春期 問74"], "web_url": "https://www.ap-siken.com/kakomon/05_aki/q76.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">特性要因図は、現れた特性（結果）とそれに影響を及ぼしたと思われる要因の関係を体系的に表わした図です。多くの要因が複雑に絡みあっているときに、直接的な原因と間接的な原因に分別したり、真の問題点を明らかにしたりすることができます。</li><li class=\"lii\">正しい。<strong>パレート図</strong>は、分析対象の項目値を大きい順に並べた棒グラフと、累積構成比を表す折れ線グラフを組み合わせた複合グラフで、主に複数の分析対象の中から重要である要素を識別するために使用します。パレート図では棒グラフが項目値の大小を基準に並ぶので、上位を占める要因が一目瞭然です。<div class=\"img_margin\"><img alt=\"76.png/image-size:415×230\" height=\"230\" src=\"https://www.ap-siken.com/kakomon/05_aki/img/76.png\" style=\"max-width: 100%; height: auto;\" width=\"415\"/></div></li><li class=\"liu\">マトリックス図は、表の縦軸と横軸にいくつかの項目を設定し、交点に各項目同士の関連性・関連度合いなどを文字列や数値または記号などで表した分析図です。</li><li class=\"lie\">連関図は、複雑な要因の絡み合う事象について、その事象間の因果関係や相互関係を整理していくことで問題や原因を明らかにし、課題解決のための糸口を発見する手法です。</li></ul></div>", "mondai_html": "発生した故障について，発生要因ごとの件数の記録を基に，故障発生件数で上位を占める主な要因を明確に表現するのに適している図法はどれか。", "choices_html": {"ア": "特性要因図", "イ": "パレート図", "ウ": "マトリックス図", "エ": "連関図"}}, {"id": "05_aki_q80", "session": "R5秋", "gap": 3, "num": 80, "topic": "企業Bと労働者Cの関係を表す記述", "subcat": "労働関連・取引関連法規", "category": "ストラテジ系", "mondai": "図は，企業と労働者の関係を表している。企業Bと労働者Cの関係を表す記述として正しいものはどれか。", "choices": {"ア": "\"契約\"が請負契約で，企業Aが受託者，企業Bが委託者であるとき，企業Bと労働者Cとの間には，指揮命令関係が生じる。", "イ": "\"契約\"が出向にかかわる契約で，企業Aが企業Bに労働者Cを出向させたとき，企業Bと労働者Cとの間には指揮命令関係が生じる。", "ウ": "\"契約\"が労働者派遣契約で，企業Aが派遣元，企業Bが派遣先であるとき，企業Bと労働者Cの間にも，雇用関係が生じる。", "エ": "\"契約\"が労働者派遣契約で，企業Aが派遣元，企業Bが派遣先であるとき，企業Bに労働者Cが出向しているといえる。"}, "ans": "イ", "hist_count": 1, "past_history": ["基本情報技術者 H29秋期 問79"], "web_url": "https://www.ap-siken.com/kakomon/05_aki/q80.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">請負契約、労働者派遣契約および出向契約は、次のような労働契約です。<dl><dt>請負契約</dt><dd>受託者がある仕事を完成することを約束し、委託者がその仕事の結果に対してその報酬を支払うことを内容とする労務供給契約の一種。雇用契約、指揮命令関係ともに受託側企業と労働者の間にあります。<div class=\"img_margin\"><img alt=\"80_1.png/image-size:314×142\" height=\"142\" src=\"https://www.ap-siken.com/kakomon/05_aki/img/80_1.png\" style=\"max-width: 100%; height: auto;\" width=\"314\"/></div></dd><dt>労働者派遣契約</dt><dd>受託側企業の社員が委託側企業の指揮命令で働くことができるようにした労務供給契約。雇用契約は受託企業と労働者の間、指揮命令関係は委託側企業と労働者の間にあります。<div class=\"img_margin\"><img alt=\"80_2.png/image-size:289×147\" height=\"147\" src=\"https://www.ap-siken.com/kakomon/05_aki/img/80_2.png\" style=\"max-width: 100%; height: auto;\" width=\"289\"/></div></dd><dt>出向契約</dt><dd></dd>元の会社との雇用関係および身分を存続させたまま、長期間にわたり出向先企業の管理および指揮命令下で勤務する契約。派遣契約との相違は、人材の育成・援助・交流などを目的としてグループ企業間で行われる点。転籍出向と在籍出向がある。<div class=\"img_margin\"><img alt=\"80_3.png/image-size:299×147\" height=\"147\" src=\"https://www.ap-siken.com/kakomon/05_aki/img/80_3.png\" style=\"max-width: 100%; height: auto;\" width=\"299\"/></div></dl><ul><li class=\"lia\">契約が請負契約ならば、指揮命令関係が生じるのは受託者である企業Aと労働者Cの間です。</li><li class=\"lii\">正しい。契約が出向契約ならば、出向先である企業Bと労働者Cの間に指揮命令関係が生じます。</li><li class=\"liu\">契約が労働者派遣契約ならば、雇用関係が生じるのは派遣元である企業Aと労働者Cの間のみです。</li><li class=\"lie\">労働者派遣契約と出向は異なります。契約が労働者派遣契約ならば、労働者Cは派遣契約に基づき企業Bに派遣されていることになります。</li></ul></div>", "mondai_html": "図は，企業と労働者の関係を表している。企業Bと労働者Cの関係を表す記述として正しいものはどれか。<div class=\"img_margin\"><img alt=\"80.png/image-size:234×106\" height=\"106\" src=\"https://www.ap-siken.com/kakomon/05_aki/img/80.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"234\"/></div>", "choices_html": {"ア": "\"契約\"が請負契約で，企業Aが受託者，企業Bが委託者であるとき，企業Bと労働者Cとの間には，指揮命令関係が生じる。", "イ": "\"契約\"が出向にかかわる契約で，企業Aが企業Bに労働者Cを出向させたとき，企業Bと労働者Cとの間には指揮命令関係が生じる。", "ウ": "\"契約\"が労働者派遣契約で，企業Aが派遣元，企業Bが派遣先であるとき，企業Bと労働者Cの間にも，雇用関係が生じる。", "エ": "\"契約\"が労働者派遣契約で，企業Aが派遣元，企業Bが派遣先であるとき，企業Bに労働者Cが出向しているといえる。"}}, {"id": "05_haru_q65", "session": "R5春", "gap": 4, "num": 65, "topic": "RFIの説明はどれか", "subcat": "調達計画・実施", "category": "ストラテジ系", "mondai": "情報システムの調達の際に作成されるRFIの説明はどれか。", "choices": {"ア": "調達者から供給者候補に対して，システム化の目的や業務内容などを示し，必要な情報の提供を依頼すること", "イ": "調達者から供給者候補に対して，対象システムや調達条件などを示し，提案書の提出を依頼すること", "ウ": "調達者から供給者に対して，契約内容で取り決めた内容に関して，変更を要請すること", "エ": "調達者から供給者に対して，双方の役割分担などを確認し，契約の締結を要請すること"}, "ans": "ア", "hist_count": 5, "past_history": ["応用情報技術者 R3春期 問64", "応用情報技術者 H25春期 問66", "応用情報技術者 H27秋期 問65", "応用情報技術者 H30春期 問66", "基本情報技術者 H23特別 問64"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q65.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>RFI</strong>(Request for Information：情報提供依頼書)は、企業・組織がシステム調達や業務委託をする場合や、初めての取引となるベンダー企業に対して情報の提供を依頼すること、またはその際に提出される文書のことをいいます。<br/><br/>RFIを発行することによって相手方が保有する技術・経験や、情報技術動向、及び導入予定のシステムが技術的に実現可能であるかなどを確認することができます。この情報は要件定義や発注先候補の選定に利用されます。その後、自社の要求を取りまとめた<strong>RFP</strong>(Request for Proposal：提案依頼書)が発注先候補に対して発行されることになります。<ul><li class=\"lia\">正しい。RFIの説明です。</li><li class=\"lii\">RFP(Request for Proposal：提案依頼書)の説明です。</li><li class=\"liu\">RFC(Request for Change：変更依頼書)の説明です。</li><li class=\"lie\">契約締結依頼書の説明です。</li></ul></div>", "mondai_html": "情報システムの調達の際に作成されるRFIの説明はどれか。", "choices_html": {"ア": "調達者から供給者候補に対して，システム化の目的や業務内容などを示し，必要な情報の提供を依頼すること", "イ": "調達者から供給者候補に対して，対象システムや調達条件などを示し，提案書の提出を依頼すること", "ウ": "調達者から供給者に対して，契約内容で取り決めた内容に関して，変更を要請すること", "エ": "調達者から供給者に対して，双方の役割分担などを確認し，契約の締結を要請すること"}}, {"id": "04_aki_q80", "session": "R4秋", "gap": 5, "num": 80, "topic": "製造物責任法の対象となるもの", "subcat": "その他の法律・ガイドライン", "category": "ストラテジ系", "mondai": "ソフトウェアやデータに欠陥がある場合に，製造物責任法の対象となるものはどれか。", "choices": {"ア": "ROM化したソフトウェアを内蔵した組込み機器", "イ": "アプリケーションソフトウェアパッケージ", "ウ": "利用者がPCにインストールしたOS", "エ": "利用者によってネットワークからダウンロードされたデータ"}, "ans": "ア", "hist_count": 5, "past_history": ["応用情報技術者 H23特別 問79", "応用情報技術者 H24秋期 問80", "応用情報技術者 H26春期 問80", "応用情報技術者 H28春期 問80", "応用情報技術者 H29秋期 問80"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q80.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>製造物責任法</strong>(PL法)は、製造物の安全性上の欠陥により人の生命、身体、財産に被害が生じた場合に、消費者が製造業者に対して損害賠償を請求できることを定めた法律です。<br/><br/>製造物責任法では製造物を「製造又は加工された動産」と定義しています。したがって、<em class=\"m\">サービス、不動産、未加工のもの</em>は、この定義上の製造物には含まれず欠陥による被害が生じた場合でも<em class=\"r\">製造物責任法の対象外</em>となります。同じくコンピュータプログラムのような無体物も動産ではないため対象外となりますが、欠陥があるプログラムを組み込んだハードウェア(製造物)の使用によって損害が生じた場合は、その動産であるハードウェアに欠陥があるものとして製造物責任法の対象となります。また、欠陥による被害がその製造物自体の被害に留まった場合であれば、この法律の適用外となり民法による救済対象となります。<ul><li class=\"lia\">正しい。ソフトウェアは無体物であり対象外ですが、この場合は欠陥がある部品(ソフトウェア)を含むハードウェアに欠陥があるものとされるため対象となります。</li><li class=\"lii\">ソフトウェアは無体物であるため対象外です。</li><li class=\"liu\">OSもソフトウェア(=無体物)であるため対象外です。</li><li class=\"lie\">無体物であるため対象外です。</li></ul></div>", "mondai_html": "ソフトウェアやデータに欠陥がある場合に，製造物責任法の対象となるものはどれか。", "choices_html": {"ア": "ROM化したソフトウェアを内蔵した組込み機器", "イ": "アプリケーションソフトウェアパッケージ", "ウ": "利用者がPCにインストールしたOS", "エ": "利用者によってネットワークからダウンロードされたデータ"}}, {"id": "04_haru_q77", "session": "R4春", "gap": 6, "num": 77, "topic": "著作物の帰属先", "subcat": "知的財産権", "category": "ストラテジ系", "mondai": "A社は，B社と著作物の権利に関する特段の取決めをせず，A社の要求仕様に基づいて，販売管理システムのプログラム作成をB社に委託した。この場合のプログラム著作権の原始的帰属に関する記述のうち，適切なものはどれか。", "choices": {"ア": "A社とB社が話し合って帰属先を決定する。", "イ": "A社とB社の共有帰属となる。", "ウ": "A社に帰属する。", "エ": "B社に帰属する。"}, "ans": "エ", "hist_count": 4, "past_history": ["応用情報技術者 H22秋期 問78", "応用情報技術者 H24春期 問79", "基本情報技術者 H25秋期 問78", "基本情報技術者 H30春期 問79"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q77.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>著作権</strong>は「著作物を創作した者」に対して与えられる権利ですので、委託開発で作られたプログラムの著作権は、原則として委託者(発注者)ではなく制作者(受注者)に帰属します。<br/><br/>委託者側としては、制作にあたって色々なアイディアを出しているため、自分たちにも著作権があるのではと思われるかも知れませんが、著作権法が保護しているのはアイディアではなく現実に創作された著作物です。ソフトウェアやWebサイトなどを発注する際には、成果物の利用方法などを事前に検討した上で必ず契約書を作成し、その契約書の中で著作権の帰属について明記した規定を置くことが重要です。著作権譲渡特約や著作者人格権の不行使条項などがこれに該当します。<br/><br/>本問では、A社からB社にプログラム作成業務が委託されているので、著作権の原始的帰属先はプログラムを作成した<em class=\"r\">B社</em>となります。</div>", "mondai_html": "A社は，B社と著作物の権利に関する特段の取決めをせず，A社の要求仕様に基づいて，販売管理システムのプログラム作成をB社に委託した。この場合のプログラム著作権の原始的帰属に関する記述のうち，適切なものはどれか。", "choices_html": {"ア": "A社とB社が話し合って帰属先を決定する。", "イ": "A社とB社の共有帰属となる。", "ウ": "A社に帰属する。", "エ": "B社に帰属する。"}}, {"id": "05_haru_q61", "session": "R5春", "gap": 4, "num": 61, "topic": "ROIを説明したものはどれか", "subcat": "情報システム戦略", "category": "ストラテジ系", "mondai": "情報化投資計画において，投資価値の評価指標であるROIを説明したものはどれか。", "choices": {"ア": "売上増やコスト削減などによって創出された利益額を投資額で割ったもの", "イ": "売上高投資金額比，従業員当たりの投資金額などを他社と比較したもの", "ウ": "現金流入の現在価値から，現金流出の現在価値を差し引いたもの", "エ": "プロジェクトを実施しない場合の，市場での競争力を表したもの"}, "ans": "ア", "hist_count": 3, "past_history": ["応用情報技術者 H23秋期 問60", "応用情報技術者 H27秋期 問62", "基本情報技術者 H25春期 問61"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q61.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ROI</strong>(Return On Investment：投資利益率)は、投資回収期間に得られる効果金額を投資額で割ったもので、投資したお金に対してどのくらい効率的に利益を生み出しているかを示す指標です。ROIは投資の効率性を測る上で重要な指標であり、値が大きいほど投資効率が高いということになります。<br/><br/>　<b>ROI(%)＝利益÷投資額×100</b><br/><ul><li class=\"lia\">正しい。ROIの説明です。</li><li class=\"lii\">IT投資評価の手法の一つである他社比較(ベンチマーク)の説明です。</li><li class=\"liu\">NPV法(Net Present Value：正味現在価値法)の説明です。</li><li class=\"lie\">IT投資評価の手法の一つである機会損失の説明です。</li></ul></div>", "mondai_html": "情報化投資計画において，投資価値の評価指標であるROIを説明したものはどれか。", "choices_html": {"ア": "売上増やコスト削減などによって創出された利益額を投資額で割ったもの", "イ": "売上高投資金額比，従業員当たりの投資金額などを他社と比較したもの", "ウ": "現金流入の現在価値から，現金流出の現在価値を差し引いたもの", "エ": "プロジェクトを実施しない場合の，市場での競争力を表したもの"}}, {"id": "05_haru_q68", "session": "R5春", "gap": 4, "num": 68, "topic": "戦略マップの説明はどれか", "subcat": "ビジネス戦略と目標・評価", "category": "ストラテジ系", "mondai": "バランススコアカードで使われる戦略マップの説明はどれか。", "choices": {"ア": "切り口となる二つの要素をX軸，Y軸として，市場における自社又は自社製品のポジションを表現したもの", "イ": "財務，顧客，内部ビジネスプロセス，学習と成長という四つの視点を基に，課題，施策，目標の因果関係を表現したもの", "ウ": "市場の魅力度，自社の優位性という二つの軸から成る四つのセルに自社の製品や事業を分類して表現したもの", "エ": "どのような顧客層に対して，どのような経営資源を使用し，どのような製品・サービスを提供するのかを表現したもの"}, "ans": "イ", "hist_count": 3, "past_history": ["応用情報技術者 R7秋期 問68", "応用情報技術者 H25春期 問69", "基本情報技術者 H26秋期 問71"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q68.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>戦略マップ</strong>は、バランススコアカードに基づいたビジネス戦略の全体像を1枚の図にまとめたものです。バランススコアカードの4つの視点である財務、顧客、内部ビジネスプロセス、学習と成長のそれぞれの目標を達成するための戦略や必要となる要素を整理し、そこに各要素の因果関係を示す矢印を加えて作成します。<br/><br/>通常は、学習と成長 ⇒ 内部ビジネスプロセス ⇒ 顧客 ⇒ 財務 という流れとなり、個々の要素がどのように企業価値創造の結果である財務面につながっているのかが可視化されます。戦略マップは戦略の伝達や実行を支援する重要なツールとして活用されています。<br/><br/>したがって「イ」が正解です。<ul><li class=\"lia\">ポジショニングマップの説明です。</li><li class=\"lii\">正しい。戦略マップの説明です。</li><li class=\"liu\">ビジネススクリーンの説明です。ただし、一般的なビジネススクリーンは3×3の9象限です。</li><li class=\"lie\">ビジネスモデルキャンバスの説明です。</li></ul></div>", "mondai_html": "バランススコアカードで使われる戦略マップの説明はどれか。", "choices_html": {"ア": "切り口となる二つの要素をX軸，Y軸として，市場における自社又は自社製品のポジションを表現したもの", "イ": "財務，顧客，内部ビジネスプロセス，学習と成長という四つの視点を基に，課題，施策，目標の因果関係を表現したもの", "ウ": "市場の魅力度，自社の優位性という二つの軸から成る四つのセルに自社の製品や事業を分類して表現したもの", "エ": "どのような顧客層に対して，どのような経営資源を使用し，どのような製品・サービスを提供するのかを表現したもの"}}, {"id": "04_aki_q61", "session": "R4秋", "gap": 5, "num": 61, "topic": "BCPの説明はどれか", "subcat": "経営・組織論", "category": "ストラテジ系", "mondai": "BCPの説明はどれか。", "choices": {"ア": "企業の戦略を実現するために，財務，顧客，内部ビジネスプロセス，学習と成長という四つの視点から戦略を検討したもの", "イ": "企業の目標を達成するために，業務内容や業務の流れを可視化し，一定のサイクルをもって継続的に業務プロセスを改善するもの", "ウ": "業務効率の向上，業務コストの削減を目的に，業務プロセスを対象としてアウトソースを実施するもの", "エ": "事業の中断・阻害に対応し，事業を復旧し，再開し，あらかじめ定められたレベルに回復するように組織を導く手順を文書化したもの"}, "ans": "エ", "hist_count": 3, "past_history": ["応用情報技術者 R1秋期 問61", "応用情報技術者 H30春期 問62", "基本情報技術者 H23秋期 問61"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q61.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>BCP</strong>(Business Continuity Plan，事業継続計画)は、予期せぬ重大災害が発生した場合に、必要最低限の事業を継続しつつ、業務を早期に復旧・再開できるようにするための行動計画です。近年、地震、火災・爆発、大規模なシステム障害などが相次いでおり、その結果、基幹となる事業・業務の停止に追い込まれるケースが見られることからBCPの重要性が高まっています。<br/><br/>経済産業省や厚生労働省の資料では、BCPの発動から全面復旧に至るまでを以下の4段階のフェーズに分けています。<dl><dt>1.BCP発動フェーズ</dt><dd>災害や事故の発生（或いは発生の可能性）を検知してから、初期対応を実施し、BCP発動に至るまでのフェーズ</dd><dt>2.業務再開フェーズ</dt><dd>BCPを発動してから、バックアップサイト・手作業などの代替手段により業務を再開し、軌道に乗せるまでのフェーズ</dd><dt>3.業務回復フェーズ</dt><dd>最も緊急度の高い業務や機能が再開された後、さらに復旧する業務の範囲を拡大するフェーズ</dd><dt>4.全面復旧フェーズ</dt><dd>代替設備・手段から平常運用へ切り替えるフェーズ</dd></dl><ul><li class=\"lia\">BSC(バランススコアカード)の説明です。</li><li class=\"lii\">BPM(Business Process Management)の説明です。</li><li class=\"liu\">BPO(Business Process Outsourcing)の説明です。</li><li class=\"lie\">正しい。BCPの説明です。</li></ul></div>", "mondai_html": "BCPの説明はどれか。", "choices_html": {"ア": "企業の戦略を実現するために，財務，顧客，内部ビジネスプロセス，学習と成長という四つの視点から戦略を検討したもの", "イ": "企業の目標を達成するために，業務内容や業務の流れを可視化し，一定のサイクルをもって継続的に業務プロセスを改善するもの", "ウ": "業務効率の向上，業務コストの削減を目的に，業務プロセスを対象としてアウトソースを実施するもの", "エ": "事業の中断・阻害に対応し，事業を復旧し，再開し，あらかじめ定められたレベルに回復するように組織を導く手順を文書化したもの"}}, {"id": "04_aki_q78", "session": "R4秋", "gap": 5, "num": 78, "topic": "著作権の帰属先", "subcat": "知的財産権", "category": "ストラテジ系", "mondai": "A社は顧客管理システムの開発を，情報システム子会社であるB社に委託し，B社は要件定義を行った上で，ソフトウェア設計・プログラミング・ソフトウェアテストまでを，協力会社であるC社に委託した。C社では自社の社員Dにその作業を担当させた。このとき，開発したプログラムの著作権はどこに帰属するか。ここで，関係者の間には，著作権の帰属に関する特段の取決めはないものとする。", "choices": {"ア": "A社", "イ": "B社", "ウ": "C社", "エ": "社員D"}, "ans": "ウ", "hist_count": 3, "past_history": ["応用情報技術者 H25春期 問78", "応用情報技術者 H27春期 問79", "基本情報技術者 H22春期 問78"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q78.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">設問ではA社がB社にシステム開発を委託し、さらにB社からC社にプログラム開発を委託しているので、A社とB社の間、B社とC社の間には請負契約が成立していると考えることができます。<br/><br/>著作権法の原則では、著作権は著作物を創作した者に与えられますから、請負契約では、原則として<em class=\"r\">実際に開発を行う請負業者</em>がその成果物の著作権を得ることになります。また、法人の業務に従事する者が職務上作成する著作物に関する著作権は、個人ではなく法人に帰属します。<br/><br/>設問ではプログラム開発を担当したのはC社のD社員ですから、プログラムの著作権はD社員が在籍している「C社」に帰属することとなります。したがって「ウ」が正解です。</div>", "mondai_html": "A社は顧客管理システムの開発を，情報システム子会社であるB社に委託し，B社は要件定義を行った上で，ソフトウェア設計・プログラミング・ソフトウェアテストまでを，協力会社であるC社に委託した。C社では自社の社員Dにその作業を担当させた。このとき，開発したプログラムの著作権はどこに帰属するか。ここで，関係者の間には，著作権の帰属に関する特段の取決めはないものとする。", "choices_html": {"ア": "A社", "イ": "B社", "ウ": "C社", "エ": "社員D"}}, {"id": "04_aki_q79", "session": "R4秋", "gap": 5, "num": 79, "topic": "請負契約の指揮命令権と雇用契約", "subcat": "労働関連・取引関連法規", "category": "ストラテジ系", "mondai": "発注者と受注者の間でソフトウェア開発における請負契約を締結した。ただし，発注者の事業所で作業を実施することになっている。この場合，指揮命令権と雇用契約に関して，適切なものはどれか。", "choices": {"ア": "指揮命令権は発注者にあり，さらに，発注者の事業所での作業を実施可能にするために，受注者に所属する作業者は，新たな雇用契約を発注者と結ぶ。", "イ": "指揮命令権は発注者にあり，受注者に所属する作業者は，新たな雇用契約を発注者と結ぶことなく，発注者の事業所で作業を実施する。", "ウ": "指揮命令権は発注者にないが，発注者の事業所で作業を実施可能にするために，受注者に所属する作業者は，新たな雇用契約を発注者と結ぶ。", "エ": "指揮命令権は発注者になく，受注者に所属する作業者は，新たな雇用契約を発注者と結ぶことなく，発注者の事業所で作業を実施する。"}, "ans": "エ", "hist_count": 3, "past_history": ["応用情報技術者 H25春期 問80", "応用情報技術者 H26秋期 問80", "応用情報技術者 H29春期 問80"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q79.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>請負契約</strong>は、請負人が依頼された仕事を完成することを約束し、発注者がその仕事の結果に対して報酬を支払うことを内容とする労務供給契約の一種です。請負契約では、雇用契約、指揮命令関係のどちらも受注者とその従業員の間にあります。<div class=\"img_margin\"><img alt=\"79.png/image-size:314×142\" height=\"142\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/79.png\" style=\"max-width: 100%; height: auto;\" width=\"314\"/></div>指揮命令権は受注者にあり、作業者は既に受注者と雇用契約を結んでいるので、発注者と新たな雇用契約を結ぶ必要はありません。したがって「エ」の記述が適切です。<ul><li class=\"lia\">指揮命令権は発注者にある、作業者は発注者と新たな雇用契約を結ぶという2点が誤りです。</li><li class=\"lii\">指揮命令権は受注者にあるので誤りです。請負契約であるにもかかわらず、受注者の従業員に対して発注者が指揮命令を行っていると偽装請負とみなされ、職業安定法による処罰の対象となります。</li><li class=\"liu\">作業者は発注者と新たな雇用契約を結ぶという点が誤りです。</li><li class=\"lie\">正しい。指揮命令権と雇用契約のいずれも作業者と受注者の間にあります。</li></ul></div>", "mondai_html": "発注者と受注者の間でソフトウェア開発における請負契約を締結した。ただし，発注者の事業所で作業を実施することになっている。この場合，指揮命令権と雇用契約に関して，適切なものはどれか。", "choices_html": {"ア": "指揮命令権は発注者にあり，さらに，発注者の事業所での作業を実施可能にするために，受注者に所属する作業者は，新たな雇用契約を発注者と結ぶ。", "イ": "指揮命令権は発注者にあり，受注者に所属する作業者は，新たな雇用契約を発注者と結ぶことなく，発注者の事業所で作業を実施する。", "ウ": "指揮命令権は発注者にないが，発注者の事業所で作業を実施可能にするために，受注者に所属する作業者は，新たな雇用契約を発注者と結ぶ。", "エ": "指揮命令権は発注者になく，受注者に所属する作業者は，新たな雇用契約を発注者と結ぶことなく，発注者の事業所で作業を実施する。"}}, {"id": "04_haru_q79", "session": "R4春", "gap": 6, "num": 79, "topic": "偽装請負とされる事象", "subcat": "労働関連・取引関連法規", "category": "ストラテジ系", "mondai": "A社はB社に対して業務システムの設計，開発を委託し，A社とB社は請負契約を結んでいる。作業の実態から，偽装請負とされる事象はどれか。", "choices": {"ア": "A社の従業員が，B社を作業場所として，A社の責任者の指揮命令に従ってシステムの検証を行っている。", "イ": "A社の従業員が，B社を作業場所として，B社の責任者の指揮命令に従ってシステムの検証を行っている。", "ウ": "B社の従業員が，A社を作業場所として，A社の責任者の指揮命令に従って設計書を作成している。", "エ": "B社の従業員が，A社を作業場所として，B社の責任者の指揮命令に従って設計書を作成している。"}, "ans": "ウ", "hist_count": 3, "past_history": ["応用情報技術者 R2秋期 問80", "応用情報技術者 H21秋期 問79", "基本情報技術者 H25秋期 問79"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q79.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>請負契約</strong>は、請負人がある仕事を完成することを約束し、発注者がその仕事の結果に対してその報酬を支払うことを内容とする労務供給契約の一種であり、請負元が自社の社員に対して、請負事業の指揮命令をします。<br/><br/><strong>偽装請負</strong>とは、契約上では業務委託の形式をとっているのに、実態は労働者派遣のようになっている状態を言います。請負契約では発注側の作業スペースの一部で受託側の従業員が作業を行うこともありますが、原則的には業務遂行の指示や管理が受託側によって行われ、発注側から独立していることが条件となります。請負契約であるにもかかわらず、受託側従業員が発注側の指揮命令の下に業務を行っている場合には労働者派遣契約に相当すると見なされ、偽装請負として取り締まられる対象となります。<br/><br/>つまりこの問題では、請負業務を行っているB社の従業員がどちら側の指揮命令で業務を行っているかがポイントになります。<ul><li class=\"lia\">A社の従業員がA社の責任者の指揮命令のもとで業務を行っているので問題ありません。</li><li class=\"lii\">A社の従業員がB社の責任者の指揮命令の下で業務を行っていますが、業務の委託はA社からB社に行われているので偽装請負には該当しません。</li><li class=\"liu\">正しい。B社の従業員がA社の責任者の指揮命令の下で業務を行っているため、偽装請負にあたります。</li><li class=\"lie\">B社の従業員がB社の責任者の指揮命令の下で業務を行っているので問題ありません。</li></ul></div>", "mondai_html": "A社はB社に対して業務システムの設計，開発を委託し，A社とB社は請負契約を結んでいる。作業の実態から，偽装請負とされる事象はどれか。", "choices_html": {"ア": "A社の従業員が，B社を作業場所として，A社の責任者の指揮命令に従ってシステムの検証を行っている。", "イ": "A社の従業員が，B社を作業場所として，B社の責任者の指揮命令に従ってシステムの検証を行っている。", "ウ": "B社の従業員が，A社を作業場所として，A社の責任者の指揮命令に従って設計書を作成している。", "エ": "B社の従業員が，A社を作業場所として，B社の責任者の指揮命令に従って設計書を作成している。"}}, {"id": "03_aki_q63", "session": "R3秋", "gap": 7, "num": 63, "topic": "プログラムマネジメントの考え方", "subcat": "情報システム戦略", "category": "ストラテジ系", "mondai": "事業目標達成のためのプログラムマネジメントの考え方として，適切なものはどれか。", "choices": {"ア": "活動全体を複数のプロジェクトの結合体と捉え，複数のプロジェクトの連携，統合，相互作用を通じて価値を高め，組織全体の戦略の実現を図る。", "イ": "個々のプロジェクト管理を更に細分化することによって，プロジェクトに必要な技術や確保すべき経営資源の明確化を図る。", "ウ": "システムの開発に使用するプログラム言語や開発手法を早期に検討することによって，開発リスクを低減し，投資効果の最大化を図る。", "エ": "リスクを最小化するように支援する専門組織を設けることによって，組織全体のプロジェクトマネジメントの能力と品質の向上を図る。"}, "ans": "ア", "hist_count": 3, "past_history": ["応用情報技術者 R7秋期 問61", "応用情報技術者 H29春期 問62", "応用情報技術者 H31春期 問61"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q63.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>プログラムマネジメント</strong>とは、同時並行的に進められている複数のプロジェクトを組合せ、それらの相互関係を最適化することで、全体として使命をより良く達成するように導く活動です。ここで言う「プログラム」とは、相互に関連する複数のプロジェクトを要素としてもつ集合体を指します。PMBOKガイド第5版では「プログラムの戦略目標と成果価値を達成するためにプログラム全体の調和を保ちつつ一元的にマネジメントすること」と定義されています。<ul><li class=\"lia\">正しい。プログラムマネジメントの考え方です。</li><li class=\"lii\">プログラムマネジメントでは、個々のプロジェクトをグルーピングし統合的に管理します。</li><li class=\"liu\">プログラムマネジメントの「プログラム」は、プログラミング作業を指しているわけではありません。</li><li class=\"lie\">PMO(Project Management Office)の考え方です。</li></ul></div>", "mondai_html": "事業目標達成のためのプログラムマネジメントの考え方として，適切なものはどれか。", "choices_html": {"ア": "活動全体を複数のプロジェクトの結合体と捉え，複数のプロジェクトの連携，統合，相互作用を通じて価値を高め，組織全体の戦略の実現を図る。", "イ": "個々のプロジェクト管理を更に細分化することによって，プロジェクトに必要な技術や確保すべき経営資源の明確化を図る。", "ウ": "システムの開発に使用するプログラム言語や開発手法を早期に検討することによって，開発リスクを低減し，投資効果の最大化を図る。", "エ": "リスクを最小化するように支援する専門組織を設けることによって，組織全体のプロジェクトマネジメントの能力と品質の向上を図る。"}}, {"id": "03_aki_q70", "session": "R3秋", "gap": 7, "num": 70, "topic": "SFAを説明したものはどれか", "subcat": "経営管理システム", "category": "ストラテジ系", "mondai": "SFAを説明したものはどれか。", "choices": {"ア": "営業活動にITを活用して営業の効率と品質を高め，売上・利益の大幅な増加や，顧客満足度の向上を目指す手法・概念である。", "イ": "卸売業・メーカーが小売店の経営活動を支援することによって，自社との取引量の拡大につなげる手法・概念である。", "ウ": "企業全体の経営資源を有効かつ総合的に計画して管理し，経営の効率向上を図るための手法・概念である。", "エ": "消費者向けや企業間の商取引を，インターネットなどの電子的なネットワークを活用して行う手法・概念である。"}, "ans": "ア", "hist_count": 3, "past_history": ["応用情報技術者 H25春期 問70", "応用情報技術者 H27秋期 問69", "応用情報技術者 H30春期 問70"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q70.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SFA</strong>(Sales Force Automation)は、営業活動にモバイル技術やインターネット技術といったITを活用して、営業の質と効率を高め売上や利益の増加につなげようとする仕組み、またはそのシステムのことです。営業日報の管理に加えて商談管理機能(コンタクト管理、行動管理、評価・実績管理)があり、営業担当者個人の支援に加えて営業グループ内で情報の共有を促進するなど、営業活動全体を支援する機能が備わっています。<ul><li class=\"lia\">正しい。SFAの説明です。</li><li class=\"lii\">リテールサポートの説明です。</li><li class=\"liu\">ERP(Enterprise Resource Planning，企業資源計画)の説明です。</li><li class=\"lie\">EC(Electronic Commerce，電子商取引)の説明です。</li></ul></div>", "mondai_html": "SFAを説明したものはどれか。", "choices_html": {"ア": "営業活動にITを活用して営業の効率と品質を高め，売上・利益の大幅な増加や，顧客満足度の向上を目指す手法・概念である。", "イ": "卸売業・メーカーが小売店の経営活動を支援することによって，自社との取引量の拡大につなげる手法・概念である。", "ウ": "企業全体の経営資源を有効かつ総合的に計画して管理し，経営の効率向上を図るための手法・概念である。", "エ": "消費者向けや企業間の商取引を，インターネットなどの電子的なネットワークを活用して行う手法・概念である。"}}, {"id": "03_aki_q78", "session": "R3秋", "gap": 7, "num": 78, "topic": "処罰の対象とする法律はどれか", "subcat": "セキュリティ関連法規", "category": "ストラテジ系", "mondai": "企業が業務で使用しているコンピュータに，記憶媒体を介してマルウェアを侵入させ，そのコンピュータの記憶内容を消去した者を処罰の対象とする法律はどれか。", "choices": {"ア": "刑法", "イ": "製造物責任法", "ウ": "不正アクセス禁止法", "エ": "情報流通プラットフォーム対処法"}, "ans": "ア", "hist_count": 3, "past_history": ["基本情報技術者 H28秋期 問80", "情報セキュマネ R1秋期 問31", "情報セキュマネ H30春期 問32"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q78.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">電磁的記録を用いて業務で使用するコンピュータやデータを破壊する、または偽の情報や不正な指令を与えてコンピュータを不正に制御することで業務を妨害した場合、<em class=\"r\">刑法</em>の電子計算機損壊等業務妨害罪に該当します（5年以下の懲役または100万円以下の罰金）。<br/><br/>本問のようにマルウェアを侵入させてデータを破壊する以外にも、次に掲げる行為などがこの罪の処罰対象となります。<ul><li>DoS攻撃によるサービス妨害</li><li>メールボムによるメールサーバ妨害</li><li>Webページの改ざん</li></ul>さらに本問ではマルウェアを実行しているため、マルウェアの作成・提供・実行・取得を禁ずる刑法の不正指令電磁的記録に関する罪（通称：ウイルス作成罪）にも該当することになります。<br/><br/>したがって正解は「ア」の刑法です。<ul><li class=\"lia\">正しい。刑法で違法とされる行為は、フィッシング（電子計算機使用詐欺罪)、マルウェアの作成・提供・保管（不正指令電磁的記録に関する罪)、DoS攻撃（電子計算機損壊等業務妨害罪等）などがあります。</li><li class=\"lii\">製造物責任法は、製造物の安全性上の欠陥により人の生命、身体、財産に被害が生じた場合に、消費者が製造業者に対して損害賠償を請求できることを定めた法律です。</li><li class=\"liu\">不正アクセス禁止法は、インターネットなどのネットワークの通信において不正アクセスとそれを助長する行為を規制する法律です。</li><li class=\"lie\">情報流通プラットフォーム対処法（旧称：プロバイダ責任制限法）は、インターネット上のWebページ、SNS、電子掲示板のように不特定多数の者が閲覧する通信について、その情報を媒介する事業者に対し、情報流通で権利を侵害された者への対応を義務付ける法律です。</li></ul></div>", "mondai_html": "企業が業務で使用しているコンピュータに，記憶媒体を介してマルウェアを侵入させ，そのコンピュータの記憶内容を消去した者を処罰の対象とする法律はどれか。", "choices_html": {"ア": "刑法", "イ": "製造物責任法", "ウ": "不正アクセス禁止法", "エ": "情報流通プラットフォーム対処法"}}, {"id": "05_haru_q75", "session": "R5春", "gap": 4, "num": 75, "topic": "デシジョンツリーと期待値の算出", "subcat": "業務分析・データ利活用", "category": "ストラテジ系", "mondai": "ビッグデータ分析の手法の一つであるデシジョンツリーを活用してマーケティング施策の判断に必要な事象を整理し，発生確率の精度を向上させた上で二つのマーケティング施策a，bの選択を行う。マーケティング施策を実行した場合の利益増加額(売上増加額－費用)の期待値が最大となる施策と，そのときの利益増加額の期待値の組合せはどれか。", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 R1秋期 問74", "応用情報技術者 H30春期 問75"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q75.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">最初に、デシジョンツリーの途中にある意思決定の分岐点(\"□\"部分)で「追加費用を払うべきか否か」を決定してから、マーケティング施策を選ぶという2段階で計算します。<br/><br/>まず、マーケティング施策aの先にある下記の部分木に注目します。そして追加費用の良し悪しを得られる利益の期待値をもとに判断します。<div class=\"img_margin\"><img alt=\"75_1.png/image-size:277×135\" height=\"135\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/75_1.png\" style=\"max-width: 100%; height: auto;\" width=\"277\"/></div>[追加費用60億円]<br/>　200億円×0.3＋100億円×0.7－60億円<br/>＝60＋70－60＝70億円<br/><br/>[追加費用なし]<br/>　50億円<br/><br/>以上より、追加費用を払った方が得られる利益は高くなることがわかります。したがって、マーケティング施策aにおいて発生確率0.4の事象に推移した場合は、「追加費用を払う」を選択すべきであり、その際の利益の期待値は70億円であると決定します。<br/><br/>同様に、マーケティング施策bの先にある下記の部分木に注目し、先程と同じ手順で意思決定します。<div class=\"img_margin\"><img alt=\"75_2.png/image-size:274×132\" height=\"132\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/75_2.png\" style=\"max-width: 100%; height: auto;\" width=\"274\"/></div>[追加費用40億円]<br/>　150億円×0.4＋100億円×0.6－40億円<br/>＝60＋60－40＝80億円<br/><br/>[追加費用なし]<br/>　70億円<br/><br/>以上より、追加費用を払った方が得られる利益は高くなることがわかります。したがって、マーケティング施策bにおいて発生確率0.3の事象に推移した場合は、「追加費用を払う」を選択すべきであり、その際の利益の期待値は80億円であると決定します。<div class=\"img_margin\"><img alt=\"75_3.png/image-size:312×280\" height=\"280\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/75_3.png\" style=\"max-width: 100%; height: auto;\" width=\"312\"/></div>最後にマーケティング施策ごとの利益の期待値を算出し、期待値が多い施策を選択します。<br/><br/>[マーケティング施策a]<br/>　70億円×0.4＋120億円×0.6－30億円<br/>＝28＋72－30＝70億円<br/><br/>[マーケティング施策b]<br/>　80億円×0.3＋140億円×0.7－40億円<br/>＝24＋98－40＝82億円<br/><br/>したがって、期待値が最大となる施策は<em class=\"r\">b</em>、利益増加額の期待値は<em class=\"r\">82億円</em>となる「ウ」の組合せが適切です。</div>", "mondai_html": "ビッグデータ分析の手法の一つであるデシジョンツリーを活用してマーケティング施策の判断に必要な事象を整理し，発生確率の精度を向上させた上で二つのマーケティング施策a，bの選択を行う。マーケティング施策を実行した場合の利益増加額(売上増加額－費用)の期待値が最大となる施策と，そのときの利益増加額の期待値の組合せはどれか。<div class=\"img_margin\"><img alt=\"75.png/image-size:554×401\" height=\"401\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/75.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"554\"/></div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表・図\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/75a.png\" style=\"max-width: 100%; height: auto; display: inline-block; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}}, {"id": "04_haru_q72", "session": "R4春", "gap": 6, "num": 72, "topic": "かんばん方式を説明したもの", "subcat": "エンジニアリングシステム", "category": "ストラテジ系", "mondai": "\"かんばん方式\"を説明したものはどれか。", "choices": {"ア": "各作業の効率を向上させるために，仕様が統一された部品，半製品を調達する。", "イ": "効率よく部品調達を行うために，関連会社から部品を調達する。", "ウ": "中間在庫を極力減らすために，生産ラインにおいて，後工程が必要とする部品を自工程で生産できるように，必要な部品だけを前工程から調達する。", "エ": "より品質の高い部品を調達するために，部品の納入指定業者を複数定め，競争入札で部品を調達する。"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 H27春期 問72", "基本情報技術者 H29春期 問72"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q72.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>かんばん方式</strong>は、工程間の中間在庫の最少化を目的として\"かんばん\"と呼ばれる生産指示票を使う生産システムで、ジャストインタイム生産方式を実現するために重要な役割を果たす要素です。<br/><br/>前工程がムダに部品を多く造り、後工程に溜めてしまうという、それまでの非効率な生産を改善するために、かんばん方式では後工程の部品数が一定数以下になった時点で後工程が前工程から必要分を引き取り、前工程は引き取られた分だけを補充するという「後工程引き取り方式」で生産を行います。このとき後工程から前工程に渡される生産指示票を\"かんばん\"と呼ぶことから、このような生産方式を\"かんばん方式\"といいます。(現在ではITを利用した\"eかんばん\"に進化しています)<br/><br/>したがって「ウ」が正解です。</div>", "mondai_html": "\"かんばん方式\"を説明したものはどれか。", "choices_html": {"ア": "各作業の効率を向上させるために，仕様が統一された部品，半製品を調達する。", "イ": "効率よく部品調達を行うために，関連会社から部品を調達する。", "ウ": "中間在庫を極力減らすために，生産ラインにおいて，後工程が必要とする部品を自工程で生産できるように，必要な部品だけを前工程から調達する。", "エ": "より品質の高い部品を調達するために，部品の納入指定業者を複数定め，競争入札で部品を調達する。"}}, {"id": "03_aki_q65", "session": "R3秋", "gap": 7, "num": 65, "topic": "RFIを説明したものはどれか", "subcat": "調達計画・実施", "category": "ストラテジ系", "mondai": "RFIを説明したものはどれか。", "choices": {"ア": "サービス提供者と顧客との間で，提供するサービスの内容，品質などに関する保証範囲やペナルティについてあらかじめ契約としてまとめた文書", "イ": "システム化に当たって，現在の状況において利用可能な技術・製品，ベンダーにおける導入実績など実現手段に関する情報提供をベンダーに依頼する文書", "ウ": "システムの調達のために，調達側からベンダーに技術的要件，サービスレベル要件，契約条件などを提示し，指定した期限内で実現策の提案を依頼する文書", "エ": "要求定義との整合性を図り，利用者と開発要員及び運用要員の共有物とするために，業務処理の概要，入出力情報の一覧，データフローなどをまとめた文書"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 H21秋期 問67", "応用情報技術者 H24秋期 問65"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q65.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>RFI</strong>(Request for Information，情報提供依頼書)は、企業・組織がシステム調達や業務委託をする場合や、初めての取引となるベンダー企業に対して情報の提供を依頼すること、またはその際に提出される文書のことをいいます。RFIを発行することによって相手方が保有する技術・経験や、情報技術動向、及び導入予定のシステムが技術的に実現可能であるかなどを確認することができます。この情報は要件定義や発注先候補の選定に利用できます。その後、自社の要求を取りまとめたRFP(Request for Proposal：提案依頼書)が発注先候補に対して発行されることになります。<br/><br/>したがって「イ」がRFIの説明に該当します。<ul><li class=\"lia\">SLA(Service Level Agreement)の説明です。</li><li class=\"lii\">正しい。RFIの説明です。</li><li class=\"liu\">RFP(Request for Proposal：提案依頼書)の説明です。</li><li class=\"lie\">システム仕様書の説明です。</li></ul></div>", "mondai_html": "RFIを説明したものはどれか。", "choices_html": {"ア": "サービス提供者と顧客との間で，提供するサービスの内容，品質などに関する保証範囲やペナルティについてあらかじめ契約としてまとめた文書", "イ": "システム化に当たって，現在の状況において利用可能な技術・製品，ベンダーにおける導入実績など実現手段に関する情報提供をベンダーに依頼する文書", "ウ": "システムの調達のために，調達側からベンダーに技術的要件，サービスレベル要件，契約条件などを提示し，指定した期限内で実現策の提案を依頼する文書", "エ": "要求定義との整合性を図り，利用者と開発要員及び運用要員の共有物とするために，業務処理の概要，入出力情報の一覧，データフローなどをまとめた文書"}}, {"id": "03_aki_q68", "session": "R3秋", "gap": 7, "num": 68, "topic": "スケールメリットとシナジー効果", "subcat": "経営戦略手法", "category": "ストラテジ系", "mondai": "あるメーカーがビールと清涼飲料水を生産する場合，表に示すように6種類のケース(A～F)によって異なるコストが掛かる。このメーカーの両製品の生産活動におけるスケールメリットとシナジー効果についての記述のうち，適切なものはどれか。", "choices": {"ア": "スケールメリットはあるが，シナジー効果はない。", "イ": "スケールメリットはないが，シナジー効果はある。", "ウ": "スケールメリットとシナジー効果がともにある。", "エ": "スケールメリットとシナジー効果がともにない。"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 H25秋期 問66", "基本情報技術者 H30春期 問67"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q68.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">まず「スケールメリット」と「シナジー効果」について意味を確認します。<dl><dt>スケールメリット</dt><dd>規模の経済性ともいわれ、生産規模を拡大するほど生産性や経済効率が向上し、利益率が高くなることをいう。<br/>生産量が多いほど享受できる生産上の利点のこと</dd><dt>シナジー効果</dt><dd>相乗効果ともいわれ、2つ以上の要素が組み合わさることで、それぞれの単体で得られる効果の合計よりも大きな効果を得ることをいう。<br/>1＋1＝2にとどまらず3にも4にもなるような要素同士の組合せ効果のこと</dd></dl>表の各ケースを分析してみると次のことが確認できます。<ul><li>ビールは、ケースAよりケースBのほうが大量に生産するにもかかわらず、製品当たりのコストは割高になっているので<em class=\"m\">スケールメリットはない</em></li><li>清涼飲料水についても、ケースCよりケースDのほうが大量に生産するにもかかわらず、製品当たりのコストは割高になっているので<em class=\"m\">スケールメリットはない</em></li><li>ケースEでは、ビール20万本に清涼飲料水10万本を1,900万円のコストで生産可能となっている。これは両製品をそれぞれを単体で生産するケースA＋ケースCの2,000万円よりも割安になっているため<em class=\"m\">シナジー効果はある</em></li><li>ケースFでは、ビール40万本に清涼飲料水20万本を4,200万円のコストで生産可能となっている。これは両製品をそれぞれを単体で生産するケースB＋ケースDの4,400万円よりも割安になっているため<em class=\"m\">シナジー効果はある</em></li></ul>したがって、両製品の生産活動には「スケールメリットはないが、シナジー効果がある」が適切な分析結果です。</div>", "mondai_html": "あるメーカーがビールと清涼飲料水を生産する場合，表に示すように6種類のケース(A～F)によって異なるコストが掛かる。このメーカーの両製品の生産活動におけるスケールメリットとシナジー効果についての記述のうち，適切なものはどれか。<div class=\"img_margin\"><img alt=\"68.png/image-size:328×215\" height=\"215\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/68.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"328\"/></div>", "choices_html": {"ア": "スケールメリットはあるが，シナジー効果はない。", "イ": "スケールメリットはないが，シナジー効果はある。", "ウ": "スケールメリットとシナジー効果がともにある。", "エ": "スケールメリットとシナジー効果がともにない。"}}, {"id": "03_aki_q75", "session": "R3秋", "gap": 7, "num": 75, "topic": "マクシミン原理", "subcat": "業務分析・データ利活用", "category": "ストラテジ系", "mondai": "いずれも時価100円の株式A～Dのうち，一つの株式に投資したい。経済の成長を高，中，低の三つに区分したときのそれぞれの株式の予想値上がり幅は，表のとおりである。マクシミン原理に従うとき，どの株式に投資することになるか。", "choices": {"ア": "A", "イ": "B", "ウ": "C", "エ": "D"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 H29春期 問76", "基本情報技術者 H20春期 問77"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q75.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ゲーム理論</strong>(Game Theory)は、複数の人間による合理的な意思決定の方法を考える理論です。この問題のように将来の起こり得る状態は予想できても、その発生確率が不明である場合の意思決定の判断基準として用いられます。<strong>マクシミン原理</strong>は、各戦略を選択したときに得られる<em class=\"r\">最小利得が最も大きくなる戦略を選ぶ</em>という保守的な考え方です。<br/><br/>各株式の最小利得は次のようになります。<ol type=\"A\"><li>成長率・中のときの10円</li><li>成長率・中のときの5円</li><li>成長率・低のときの5円</li><li>成長率・低のときの－10円</li></ol>マクシミン原理に従う場合、それぞれの最小利得を比べたときに最も利益が大きくなる<em class=\"r\">A</em>に投資すると結論づけられます。したがって「ア」が正解です。</div>", "mondai_html": "いずれも時価100円の株式A～Dのうち，一つの株式に投資したい。経済の成長を高，中，低の三つに区分したときのそれぞれの株式の予想値上がり幅は，表のとおりである。マクシミン原理に従うとき，どの株式に投資することになるか。<div class=\"img_margin\"><img alt=\"75.png/image-size:323×160\" height=\"160\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/75.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"323\"/></div>", "choices_html": {"ア": "A", "イ": "B", "ウ": "C", "エ": "D"}}, {"id": "03_haru_q65", "session": "R3春", "gap": 8, "num": 65, "topic": "グリーン購入", "subcat": "調達計画・実施", "category": "ストラテジ系", "mondai": "国や地方公共団体などが，環境への配慮を積極的に行っていると評価されている製品・サービスを選んでいる。この取組を何というか。", "choices": {"ア": "CSR", "イ": "エコマーク認定", "ウ": "環境アセスメント", "エ": "グリーン購入"}, "ans": "エ", "hist_count": 2, "past_history": ["基本情報技術者 H25秋期 問66", "基本情報技術者 H30春期 問65"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q65.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>グリーン購入</strong>とは、製品やサービスを購入する際に、環境を考慮して、必要性をよく考え、環境への負荷ができるだけ少ないものを選んで購入することです。<br/><br/>我が国においては、2001年(平成13年)にグリーン購入法（国等による環境物品等の調達の推進等に関する法律）が施行されました。この法律は、国等の機関にグリーン購入を義務づけるとともに、地方公共団体や事業者・国民にもグリーン購入に努めることを求めています（環境省HPより引用）。<ul><li class=\"lia\">Corporate Social Responsibilityの略。企業活動において経済的成長だけでなく、環境や社会からの要請に対し、責任を果たすことが企業価値の向上につながるという考え方です。</li><li class=\"lii\">エコマーク認定は、生産から廃棄までを通じて環境への負荷が少なく、環境保全に役立つと認められた商品を認定する制度です。認定された商品はエコマークを表示することができます。</li><li class=\"liu\">環境アセスメント(環境影響評価)は、主として大規模開発事業等による環境への影響を事前に調査することによって、予測、評価を行う手続きのことです。</li><li class=\"lie\">正しい。グリーン購入は、環境負荷の少ない製品、環境保護に取組む企業から優先的に購入する調達方針です。</li></ul></div>", "mondai_html": "国や地方公共団体などが，環境への配慮を積極的に行っていると評価されている製品・サービスを選んでいる。この取組を何というか。", "choices_html": {"ア": "CSR", "イ": "エコマーク認定", "ウ": "環境アセスメント", "エ": "グリーン購入"}}, {"id": "03_haru_q70", "session": "R3春", "gap": 8, "num": 70, "topic": "バランススコアカード", "subcat": "ビジネス戦略と目標・評価", "category": "ストラテジ系", "mondai": "バランススコアカードの四つの視点とは，財務，学習と成長，内部ビジネスプロセスと，もう一つはどれか。", "choices": {"ア": "ガバナンス", "イ": "顧客", "ウ": "自社の強み", "エ": "遵法"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 H31春期 問68", "基本情報技術者 H22秋期 問69"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q70.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>バランススコアカード</b>(BSC:Balanced Score Card)は、企業のビジョンと戦略を実現するために、「財務」「<em class=\"r\">顧客</em>」「内部ビジネスプロセス」「学習と成長」という4つの視点から業績を評価・分析する手法です。<br/><br/>したがって残る一つは「イ」の顧客になります。<br/><br/>バランススコアカードのプロセスである各視点については以下の通りです。<dl><dt>財務の視点</dt><dd>株主や従業員などの利害関係者の期待に応えて良い業績を出すために、財務的にどのように行動すべきかの指標を設定する。</dd><dt>顧客の視点</dt><dd>企業のビジョンを達成するために、顧客に対してどのように行動すべきかの指標を設定する。</dd><dt>内部ビジネスプロセス(業務プロセス)の視点</dt><dd>財務的目標の達成や顧客満足度を向上させるために、優れた業務プロセスを構築するための指標を設定する。</dd><dt>学習と成長の視点</dt><dd>企業のビジョンを達成するために、組織や個人としてどのように変化（改善）し能力向上を図るかの指標を設定する。</dd></dl></div>", "mondai_html": "バランススコアカードの四つの視点とは，財務，学習と成長，内部ビジネスプロセスと，もう一つはどれか。", "choices_html": {"ア": "ガバナンス", "イ": "顧客", "ウ": "自社の強み", "エ": "遵法"}}, {"id": "03_haru_q77", "session": "R3春", "gap": 8, "num": 77, "topic": "キャッシュフロー計算書", "subcat": "会計・財務", "category": "ストラテジ系", "mondai": "キャッシュフロー計算書において，営業活動によるキャッシュフローに該当するものはどれか。", "choices": {"ア": "株式の発行による収入", "イ": "商品の仕入れによる支出", "ウ": "短期借入金の返済による支出", "エ": "有形固定資産の売却による収入"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 H23特別 問74", "基本情報技術者 H29春期 問77"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q77.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>キャッシュフロー計算書</strong>は、日本の会計基準における財務諸表であり、一会計期間における資金（現金及び現金同等物）の増減、つまり収入と支出を、営業活動・投資活動・財務活動に区分して表示する会計書類です。現金の流入出を示すので、キャッシュフロー計算書と呼ばれます。<dl><dt>営業活動によるキャッシュフロー</dt><dd>商品・サービスの販売による収入や仕入・管理による支出など、企業の本業に係る事項を記載する区分</dd><dt>投資活動によるキャッシュフロー</dt><dd>固定資産の取得・売却、有価証券の取得売却など、企業が行った投資活動に係る事項を記載する区分</dd><dt>財務活動によるキャッシュフロー</dt><dd>株式や社債の発行、自己株式の取得、社債の償還および借入金の返済および支払利息など、資金調達や返済に係る項目を記載する区分</dd></dl>これを踏まえて各事項を分類すると、<ul><li class=\"lia\">財務活動によるキャッシュフローに該当します。</li><li class=\"lii\">正しい。営業活動によるキャッシュフローに該当します。</li><li class=\"liu\">財務活動によるキャッシュフローに該当します。</li><li class=\"lie\">投資活動によるキャッシュフローに該当します。</li></ul></div>", "mondai_html": "キャッシュフロー計算書において，営業活動によるキャッシュフローに該当するものはどれか。", "choices_html": {"ア": "株式の発行による収入", "イ": "商品の仕入れによる支出", "ウ": "短期借入金の返済による支出", "エ": "有形固定資産の売却による収入"}}, {"id": "03_haru_q80", "session": "R3春", "gap": 8, "num": 80, "topic": "電子署名法に関する記述", "subcat": "セキュリティ関連法規", "category": "ストラテジ系", "mondai": "電子署名法に関する記述のうち，適切なものはどれか。", "choices": {"ア": "電子署名には，電磁的記録ではなく，かつ，コンピュータで処理できないものも含まれる。", "イ": "電子署名には，民事訴訟法における押印と同様の効力が認められる。", "ウ": "電子署名の認証業務を行うことができるのは，政府が運営する認証局に限られる。", "エ": "電子署名は共通鍵暗号技術によるものに限られる。"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 H27春期 問80", "情報セキュマネ H29春期 問31"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q80.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>電子署名法</strong>(電子署名及び認証業務に関する法律)は、デジタル署名などの電磁的記録に作成された署名（電子署名）の行われた電磁的記録が、手書きの署名や押印の付された文書と同等に通用する法的基盤を整備するために制定された法律です。この法律は、電子的な署名が紙に署名する行為と同等の法的効力を持つことを規定するとともに、電子署名の認証業務とそれを行う者の認定制度について定めています。<ul><li class=\"lia\">電子署名とは、電磁的記録に記録することができる情報であって、コンピュータにより情報処理されるものに限られます。よって、コンピュータ処理の対象とならないものは、電子署名に含まれません。</li><li class=\"lii\">正しい。民事訴訟法では、私文書に本人の署名または押印があるときは、本人が作成したものであることが推定されることになっています。電子署名法では、電磁的記録について本人による電子署名が行われているときにも、これと同じ法的効力が生じることが定められています。</li><li class=\"liu\">認証業務とは、利用者その他の者の求めに応じ、当該利用者が電子署名を行った者であることを証明する業務です。民間組織でも認証業務を行うことは可能で、認証業務のうち特定認証業務を行う者は主務大臣の認定を受けることができます。</li><li class=\"lie\">技術的中立性を保つため、電子署名については①情報の作成者と署名者が同じであること、②情報が改変されていないことの2点を確認できるものであれば良いとされています。<br/>ただし、特定認証業務の認定を受けようとする者は、安全性を確保するため、2,048ビット以上のRSA暗号、2,048ビット以上のElGamal暗号、224ビット以上の楕円曲線暗号（いずれも公開鍵暗号方式）のいずれかを使用しなければなりません（2021年現在）。</li></ul></div>", "mondai_html": "電子署名法に関する記述のうち，適切なものはどれか。", "choices_html": {"ア": "電子署名には，電磁的記録ではなく，かつ，コンピュータで処理できないものも含まれる。", "イ": "電子署名には，民事訴訟法における押印と同様の効力が認められる。", "ウ": "電子署名の認証業務を行うことができるのは，政府が運営する認証局に限られる。", "エ": "電子署名は共通鍵暗号技術によるものに限られる。"}}, {"id": "05_haru_q72", "session": "R5春", "gap": 4, "num": 72, "topic": "アグリゲーションサービス", "subcat": "e-ビジネス", "category": "ストラテジ系", "mondai": "アグリゲーションサービスに関する記述として，適切なものはどれか。", "choices": {"ア": "小売販売の会社が，店舗やECサイトなどあらゆる顧客接点をシームレスに統合し，どの顧客接点でも顧客に最適な購買体験を提供して，顧客の利便性を高めるサービス", "イ": "物品などの売買に際し，信頼のおける中立的な第三者が契約当事者の間に入り，代金決済等取引の安全性を確保するサービス", "ウ": "分散的に存在する事業者，個人や機能への一括的なアクセスを顧客に提供し，比較，まとめ，統一的な制御，最適な組合せなどワンストップでのサービス提供を可能にするサービス", "エ": "本部と契約した加盟店が，本部に対価を支払い，販売促進，確立したサービスや商品などを使う権利をもらうサービス"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 R3春期 問74"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q72.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>アグリゲーションサービス</strong>は、複数の企業が提供するオンラインサービスを集約し、複数のサイトにまたがるデータを一括して比較・表示できるようにしたサービスです。複数の銀行口座・証券口座に分散している資産及び利用履歴をまとめて表示するサービスなどがこれに該当します。利用者は、アグリゲーションサービスにアカウント情報を登録しておけば、複数のサービスにその都度ログインしなくてもデータを見られるメリットがあります。<ul><li class=\"lia\">オムニチャネルの説明です。</li><li class=\"lii\">エスクローサービスの説明です。</li><li class=\"liu\">正しい。アグリゲーションサービスの説明です。</li><li class=\"lie\">フランチャイズ契約の説明です。</li></ul></div>", "mondai_html": "アグリゲーションサービスに関する記述として，適切なものはどれか。", "choices_html": {"ア": "小売販売の会社が，店舗やECサイトなどあらゆる顧客接点をシームレスに統合し，どの顧客接点でも顧客に最適な購買体験を提供して，顧客の利便性を高めるサービス", "イ": "物品などの売買に際し，信頼のおける中立的な第三者が契約当事者の間に入り，代金決済等取引の安全性を確保するサービス", "ウ": "分散的に存在する事業者，個人や機能への一括的なアクセスを顧客に提供し，比較，まとめ，統一的な制御，最適な組合せなどワンストップでのサービス提供を可能にするサービス", "エ": "本部と契約した加盟店が，本部に対価を支払い，販売促進，確立したサービスや商品などを使う権利をもらうサービス"}}, {"id": "05_haru_q74", "session": "R5春", "gap": 4, "num": 74, "topic": "事業部制組織の特徴はどれか", "subcat": "経営・組織論", "category": "ストラテジ系", "mondai": "事業部制組織の特徴を説明したものはどれか。", "choices": {"ア": "ある問題を解決するために一定の期間に限って結成され，問題解決とともに解散する。", "イ": "業務を機能別に分け，各機能について部下に命令，指導を行う。", "ウ": "製品，地域などで構成された組織単位に，利益責任をもたせる。", "エ": "戦略的提携や共同開発など外部の経営資源を積極的に活用することによって，経営環境に対応していく。"}, "ans": "ウ", "hist_count": 1, "past_history": ["基本情報技術者 H22春期 問75"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q74.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>事業部制組織</strong>は、トップマネジメントの下に、製品別・商品別・地域別・市場別などの単位で事業部を設け、それぞれの事業部が一定の権限をもって意思決定を行う組織形態です。各事業部が収益と費用に責任をもつ独立採算制をとることが特徴です。<br/><br/>事業部制組織では、事業部ごとに営業・生産・総務・管理などの職能組織が置かれます。事業ごとに独立した組織体制をとることで、それぞれの市場ニーズに対応しやすくなります。例えば、自動車製造会社が乗用車部門、トラック部門、バス部門を設ける場合や、家電メーカーがエアコン部門、テレビ部門、冷蔵庫部門を設ける場合などが、これに該当します。<div class=\"img_margin\"><img alt=\"74.png/image-size:382×228\" height=\"228\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/74.png\" style=\"max-width: 100%; height: auto;\" width=\"382\"/></div><ul><li class=\"lia\">プロジェクト組織の説明です。</li><li class=\"lii\">職能別組織の説明です。</li><li class=\"liu\">正しい。事業部制組織の説明です。</li><li class=\"lie\">アライアンスの説明です。</li></ul></div>", "mondai_html": "事業部制組織の特徴を説明したものはどれか。", "choices_html": {"ア": "ある問題を解決するために一定の期間に限って結成され，問題解決とともに解散する。", "イ": "業務を機能別に分け，各機能について部下に命令，指導を行う。", "ウ": "製品，地域などで構成された組織単位に，利益責任をもたせる。", "エ": "戦略的提携や共同開発など外部の経営資源を積極的に活用することによって，経営環境に対応していく。"}}, {"id": "05_haru_q77", "session": "R5春", "gap": 4, "num": 77, "topic": "目標利益を得るために必要な売上高", "subcat": "会計・財務", "category": "ストラテジ系", "mondai": "会社の固定費が150百万円，変動費率が60％のとき，利益50百万円が得られる売上高は何百万円か。", "choices": {"ア": "333", "イ": "425", "ウ": "458", "エ": "500"}, "ans": "エ", "hist_count": 1, "past_history": ["基本情報技術者 H14秋期 問75"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q77.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">売上高、費用(固定費＋変動費)および利益の間には以下の関係があります。<br/><br/>　利益＝売上高－(固定費＋変動費)<br/><br/>変動費率は、売上高に対する変動費の割合ですから、目的の売上高をA円とすると変動費は「0.6A(円)」と表すことができます。<br/><br/>上記の式に当てはめると、<br/><br/>　50＝A－(150＋0.6A)<br/>　50＝A－150－0.6A<br/>　200＝0.4A<br/>　A＝500<br/><br/>したがって、目標利益を得るために必要な売上高は<em class=\"r\">500</em>百万円となります。<br/><br/>【別解】<br/>損益分岐点売上高の公式の類型に、目標利益達成売上高を求める公式があるので、こちらを使っても正解を導くことが可能です。<br/><br/>　目標利益達成売上高＝(固定費＋目標利益)÷(1－変動費率)<br/>　(150＋50)÷(1－0.6)＝200÷0.4＝500</div>", "mondai_html": "会社の固定費が150百万円，変動費率が60％のとき，利益50百万円が得られる売上高は何百万円か。", "choices_html": {"ア": "333", "イ": "425", "ウ": "458", "エ": "500"}}, {"id": "05_haru_q78", "session": "R5春", "gap": 4, "num": 78, "topic": "中小受託取引適正化法の禁止行為", "subcat": "労働関連・取引関連法規", "category": "ストラテジ系", "mondai": "ソフトウェア開発を，中小受託取引適正化法(以下，取適法)の対象となる中小受託事業者に委託する場合，取適法に照らして，禁止されている行為はどれか。", "choices": {"ア": "継続的な取引が行われているので，支払条件，支払期日などを記載した書面をあらかじめ交付し，個々の発注書面にはその事項の記載を省略する。", "イ": "顧客の求める仕様が確定していなかったので，発注の際に，中小受託事業者に仕様が未記載の書面を交付し，仕様が確定した時点では，内容を書面ではなく口頭で伝える。", "ウ": "顧客の都合で仕様変更の必要が生じたので，中小受託事業者と協議の上，発生する費用の増加分を製造委託等代金に加算することによって仕様変更に応じてもらう。", "エ": "振込手数料を中小受託事業者が負担する旨を発注前に書面で合意していたが，振込手数料は委託事業者が負担し，製造委託等代金は減額せず全額を支払う。"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 H31春期 問79"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q78.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>中小受託取引適正化法</strong>（旧称：下請法）は、委託事業者（発注側）と中小受託事業者（受注側）の公平な取引関係を確保し、受託側の利益保護と取引の公正化を図るための法律です。一定規模以上の委託事業者を「優越的地位にある」ものと位置付け、受託取引における委託事業者の不当な行為を規制することを狙いとしています。<br/><br/>具体的な規制内容として、委託事業者に対し、発注内容等の明示、書類等の作成・保存、代金の支払期日の設定、遅延利息の支払といった義務を課すとともに、受領拒否、返品、代金減額、支払遅延など11類型の禁止行為を定めています。<ul><li class=\"lia\">原則としては、製造委託等の都度、発注内容を記載した所定の書面を交付する必要がありますが、必要記載事項のうち、一定期間共通である事項（例：支払方法、検査期間等）をあらかじめ書面で中小受託事業者に通知している場合には、それらの事項は都度交付する書面に記載することは要しません。</li><li class=\"lii\">正しい。法定の発注書面には、品目、品種、数量、規格、仕様など、中小受託事業者の給付内容を明確に記載する必要があります。ただし、給付内容が定まっていないことにつき正当な理由がある場合には、発注書にはその旨と理由・定める予定期日を記載しておき、内容が定められた後、当該事項を「書面または電磁的方法」で明示する方法が認められます。口頭ではダメです。</li><li class=\"liu\">委託事業者が費用を負担せずに注文内容を変更する行為は、不当な給付内容の変更として禁止されています。しかし、協議を行い、増加費用を支払うことを約束した上で委託内容を変更することは禁止されていません。</li><li class=\"lie\">振込手数料を中小受託事業者側に負担させ、代金の額から差し引くことは、中小受託事業者との合意の有無にかかわらず、製造委託等代金の減額として禁止されています。書面合意があったとしても、振込手数料は委託事業者が負担する必要があります。<br/>【注意】本肢は法改正に伴って改題しています。改正前は、事前に合意していれば振込手数料を下請事業者に負担させることが認められていましたが、現行制度では禁止事項とされています。</li></ul></div>", "mondai_html": "ソフトウェア開発を，中小受託取引適正化法(以下，取適法)の対象となる中小受託事業者に委託する場合，取適法に照らして，禁止されている行為はどれか。", "choices_html": {"ア": "継続的な取引が行われているので，支払条件，支払期日などを記載した書面をあらかじめ交付し，個々の発注書面にはその事項の記載を省略する。", "イ": "顧客の求める仕様が確定していなかったので，発注の際に，中小受託事業者に仕様が未記載の書面を交付し，仕様が確定した時点では，内容を書面ではなく口頭で伝える。", "ウ": "顧客の都合で仕様変更の必要が生じたので，中小受託事業者と協議の上，発生する費用の増加分を製造委託等代金に加算することによって仕様変更に応じてもらう。", "エ": "振込手数料を中小受託事業者が負担する旨を発注前に書面で合意していたが，振込手数料は委託事業者が負担し，製造委託等代金は減額せず全額を支払う。振込手数料を中小受託事業者が負担する旨を発注前に書面で合意したので，委託事業者が負担した実費の範囲内で振込手数料を差し引いて製造委託等代金を支払う。"}}, {"id": "05_haru_q80", "session": "R5春", "gap": 4, "num": 80, "topic": "集団思考の説明はどれか", "subcat": "その他の法律・ガイドライン", "category": "ストラテジ系", "mondai": "技術者倫理の遵守を妨げる要因の一つとして，集団思考というものがある。集団思考の説明として，適切なものはどれか。", "choices": {"ア": "自分とは違った視点から事態を見ることができず，客観性に欠けること", "イ": "組織内の権威に無批判的に服従すること", "ウ": "正しいことが何かは知っているが，それを実行する勇気や決断力に欠けること", "エ": "強い連帯性をもつチームが自らへの批判的思考を欠いて，不合理な合意へと達すること"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H28秋期 問80"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q80.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>集団思考</strong>(グループシンク)とは、集団で意思決定を行う際に、集団の結束がマイナスに働いた結果、不合理な決定が下されてしまうことをいいます。不合理な判断がなされた例としてチャレンジャー号事件、ケネディ政権のピッグス湾侵攻作戦、ウォーターゲート事件を巡るニクソン大統領の判断ミスなどがよく挙げられます。<br/><br/>集団思考はチーム内の結束が強く、閉鎖的な体制などの欠陥を有し、チームに掛かるストレスが高いという状況が揃うと発生しやすい傾向にあると言われています。アメリカの心理学者であるアーヴィング・ジャニスが1982年に発表した「集団思考の8つの兆候」では、集団思考に陥りやすい集団が示す兆候を以下の3類型8項目に整理しています。<dl><dt>第1類型（グループの能力や道徳性に対する過大評価）</dt><dd>自分たちを不死身と見なす幻想<br/>集団に固有の道徳性についての再考の否定</dd><dt>第2類型（閉鎖的な関心）</dt><dd>集団の行動を合理的なものに見せようとする自己弁護<br/>集団外部への批判・偏見及び責任の転嫁</dd><dt>第3類型（均一性への圧力）</dt><dd>自身の意見が集団の総意から外れていないかをチェックする自己検閲<br/>沈黙を同意と見なすなどの全会一致の幻想<br/>反論するメンバーへの直接的な圧力<br/>集団の自己満足を妨げる情報が入ってくるのを阻止する意見監視員の出現</dd></dl>技術者が研究や設計などの業務を行う際は、集団の中で討議を行い意思決定をしていくことがほとんどです。技術者は集団における社会心理学的要素を十分に理解し、たとえ技術者倫理に則した自身の意見が組織の倫理と対立する場合であっても、常に技術者倫理側に立って行動することが求められます。<ul><li class=\"lia\">認知バイアスの説明です。</li><li class=\"lii\">権威主義的服従の説明です。</li><li class=\"liu\">平和主義者の説明です。</li><li class=\"lie\">正しい。集団思考の説明です。</li></ul></div>", "mondai_html": "技術者倫理の遵守を妨げる要因の一つとして，集団思考というものがある。集団思考の説明として，適切なものはどれか。", "choices_html": {"ア": "自分とは違った視点から事態を見ることができず，客観性に欠けること", "イ": "組織内の権威に無批判的に服従すること", "ウ": "正しいことが何かは知っているが，それを実行する勇気や決断力に欠けること", "エ": "強い連帯性をもつチームが自らへの批判的思考を欠いて，不合理な合意へと達すること"}}, {"id": "04_aki_q64", "session": "R4秋", "gap": 5, "num": 64, "topic": "投資効果が大きいシナリオはどれか", "subcat": "情報システム戦略", "category": "ストラテジ系", "mondai": "投資効果を正味現在価値法で評価するとき，最も投資効果が大きい(又は損失が小さい)シナリオはどれか。ここで，期間は3年間，割引率は5%とし，各シナリオのキャッシュフローは表のとおりとする。", "choices": {"ア": "A", "イ": "B", "ウ": "C", "エ": "投資をしない"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 H31春期 問64"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q64.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>正味現在価値法</strong>(NPV法)は、将来投資対象から得られる収益の現在価値と投資額の現在価値を比較して、投資判断を行う手法です。<br/><br/>\"今もらえる100万円\"と\"50年後にもらえる100万円\"だったら、今100万円もらいたいと感じるように、同じ額であっても受け取れるのが未来であるほどその価値は低くなります。現在価値は、この考え方を金銭の評価に応用したもので、将来得られる金額や利益を時間経過に応じた割引率で除することで、現時点における価値に置き換えて評価したものです。例えば割引率5％とすると、1年後に受け取る100万円は「100万円÷1.05」、2年後に受け取る100万円は「100万円÷1.05<sup>2</sup>」、n年後に受け取る100万円は「100万円÷1.05<sup>n</sup>」という具合に価値を割り引いて現在価値に換算します。これにより、同じ額でも将来に受け取るほどその価値が低く見積もられることとなります。<br/><br/>本来でしたらシナリオごとに具体的な計算を行うのですが、電卓がないとこの計算はなかなか骨の折れる作業です。そこで、設問では各シナリオの回収額の合計が同じになっていることに着目します。上記の理屈を踏まえると、回収合計額が同じならばより早く大きな金額を受け取れる方が現在価値の合計は高くなるはずなので、3つのシナリオの回収時期を見て現在価値が高くなる順に並べると、1年目の割合が高いB、3年間に平準化されているC、最終年の割合が多いAの順になります。<br/><br/>最後に、シナリオBの現在価値が投資額を上回っているかどうかについても検討しなければなりません。「現在価値＜投資額」ならば、投資価値がないと判断されるからです。シナリオBの現在価値は、<br/><br/>　120÷1.05＋80÷1.05<sup>2</sup>＋40÷1.05<sup>3</sup><br/>≒120÷1.05＋80÷1.1＋40÷1.15<br/>≒114.2＋72.7＋34.7<br/>＝221.6万円<br/><br/>少額ではありますが投資額の220万円を上回るので、\"投資をしない\"場合よりもシナリオBの方が有利と判断されます。以上より、最も投資効果が大きいシナリオは「B」とわかります。<br/><div class=\"pre\">//実際に計算してみると各シナリオの現在価値は以下の額になりました。<br/>var x = 1.05;<br/>//A<br/>40/x+80/(x*x)+120/(x*x*x)=214.3181081956592<br/>//B<br/>120/x+80/(x*x)+40/(x*x*x)=221.4015765036173<br/>//C<br/>80/x+80/(x*x)+80/(x*x*x)=217.85984234963826</div></div>", "mondai_html": "投資効果を正味現在価値法で評価するとき，最も投資効果が大きい(又は損失が小さい)シナリオはどれか。ここで，期間は3年間，割引率は5%とし，各シナリオのキャッシュフローは表のとおりとする。<div class=\"img_margin\"><img alt=\"64.png/image-size:439×174\" height=\"174\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/64.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"439\"/></div>", "choices_html": {"ア": "A", "イ": "B", "ウ": "C", "エ": "投資をしない"}}, {"id": "04_aki_q66", "session": "R4秋", "gap": 5, "num": 66, "topic": "請負型の契約が適切なフェーズ", "subcat": "調達計画・実施", "category": "ストラテジ系", "mondai": "\"情報システム・モデル取引・契約書＜第二版＞\"によれば，ウォーターフォールモデルによるシステム開発において，ユーザー(取得者)とベンダー(供給者)間で請負型の契約が適切であるとされるフェーズはどれか。", "choices": {"ア": "システム化計画フェーズから導入・受入支援フェーズまで", "イ": "要件定義フェーズから導入・受入支援フェーズまで", "ウ": "要件定義フェーズからシステム結合フェーズまで", "エ": "システム内部設計フェーズからシステム結合フェーズまで"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H26秋期 問66"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q66.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>情報システム・モデル取引・契約書</strong>は、ユーザーとベンダーのあるべき理想的なモデルを提示し、情報システムのライフサイクルプロセスの中で、『ユーザーとベンダーの間でどのようなことを決定し、どのようなことを情報共有すればよいか』についての統一的な指針を目指して策定されたガイドラインです。<br/><br/>このガイドラインでは一括請負契約方式ではなく、工程ごとに見積り・請負契約を行う「多段階契約」という方式を推奨しています。情報システム・モデル取引・契約書では、フェーズの分類と対応する契約類型を以下のように規定しています。<div class=\"img_margin\"><img alt=\"66a.png/image-size:460×410\" height=\"410\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/66a.png\" style=\"max-width: 100%; height: auto;\" width=\"460\"/></div>上記のうち「請負型」の契約が適切とされているフェーズは、システム方式設計(システム内部設計)～システム結合です。したがって「エ」が適切です。<br/><br/>参考URL: 情報システム・モデル取引・契約書＜第二版＞<br/><a href=\"https://www.ipa.go.jp/files/000087884.docx\" target=\"_blank\">https://www.ipa.go.jp/files/000087884.docx</a></div>", "mondai_html": "\"情報システム・モデル取引・契約書＜第二版＞\"によれば，ウォーターフォールモデルによるシステム開発において，ユーザー(取得者)とベンダー(供給者)間で請負型の契約が適切であるとされるフェーズはどれか。<div class=\"img_margin\"><img alt=\"66.png/image-size:557×169\" height=\"169\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/66.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"557\"/></div>", "choices_html": {"ア": "システム化計画フェーズから導入・受入支援フェーズまで", "イ": "要件定義フェーズから導入・受入支援フェーズまで", "ウ": "要件定義フェーズからシステム結合フェーズまで", "エ": "システム内部設計フェーズからシステム結合フェーズまで"}}, {"id": "04_aki_q68", "session": "R4秋", "gap": 5, "num": 68, "topic": "ターゲットリターン価格設定", "subcat": "マーケティング", "category": "ストラテジ系", "mondai": "ターゲットリターン価格設定の説明はどれか。", "choices": {"ア": "競合の価格を十分に考慮した上で価格を決定する。", "イ": "顧客層，時間帯，場所など市場セグメントごとに異なった価格を決定する。", "ウ": "目標とする投資収益率を実現するように価格を決定する。", "エ": "リサーチなどによる消費者の値頃感に基づいて価格を決定する。"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 H30春期 問69"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q68.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ターゲットリターン価格</strong>とは、コスト志向型の価格設定法で、目標とする投資収益率(ROI)を達成するために得るべき金額を計算し、それを原価に加えて販売価格とする方法です。目標収益法ともいいます。<br/><br/>　ターゲットリターン価格＝原価＋{(投下資本×目標収益率)÷販売数量}<ul><li class=\"lia\">実勢価格の説明です。</li><li class=\"lii\">差別価格の説明です。</li><li class=\"liu\">正しい。ターゲットリターン価格設定の説明です。</li><li class=\"lie\">知覚価値価格の説明です。</li></ul></div>", "mondai_html": "ターゲットリターン価格設定の説明はどれか。", "choices_html": {"ア": "競合の価格を十分に考慮した上で価格を決定する。", "イ": "顧客層，時間帯，場所など市場セグメントごとに異なった価格を決定する。", "ウ": "目標とする投資収益率を実現するように価格を決定する。", "エ": "リサーチなどによる消費者の値頃感に基づいて価格を決定する。"}}, {"id": "04_aki_q74", "session": "R4秋", "gap": 5, "num": 74, "topic": "SL理論の説明はどれか", "subcat": "経営・組織論", "category": "ストラテジ系", "mondai": "ハーシィ及びブランチャードが提唱したSL理論の説明はどれか。", "choices": {"ア": "開放の窓，秘密の窓，未知の窓，盲点の窓の四つの窓を用いて，自己理解と対人関係の良否を説明した理論", "イ": "教示的，説得的，参加的，委任的の四つに，部下の成熟度レベルによって，リーダーシップスタイルを分類した理論", "ウ": "共同化，表出化，連結化，内面化の四つのプロセスによって，個人と組織に新たな知識が創造されるとした理論", "エ": "生理的，安全，所属と愛情，承認と自尊，自己実現といった五つの段階で欲求が発達するとされる理論"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 R3春期 問75"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q74.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SL理論</strong>（状況対応リーダーシップ理論）は、いかなる状況にも効果的な唯一万能のリーダー行動は存在しないという主張の下、リーダーシップの有効性を状況との関係で捉え、状況要素のうち最も重要である部下や集団（フォロワー）の能力及び意欲の水準（レディネス）ごとに、有効性が高いリーダーシップのスタイルを示したモデルです。<div class=\"img_margin\"><img alt=\"74.png/image-size:419×247\" height=\"247\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/74.png\" style=\"max-width: 100%; height: auto;\" width=\"419\"/></div><ul><li class=\"lia\">自己分析に使用するジョハリの窓の説明です。</li><li class=\"lii\">正しい。SL理論の説明です。</li><li class=\"liu\">ナレッジマネジメントに使用するSECIモデルの説明です。</li><li class=\"lie\">マズローの自己実現理論（欲求の5段階説）の説明です。</li></ul></div>", "mondai_html": "ハーシィ及びブランチャードが提唱したSL理論の説明はどれか。", "choices_html": {"ア": "開放の窓，秘密の窓，未知の窓，盲点の窓の四つの窓を用いて，自己理解と対人関係の良否を説明した理論", "イ": "教示的，説得的，参加的，委任的の四つに，部下の成熟度レベルによって，リーダーシップスタイルを分類した理論", "ウ": "共同化，表出化，連結化，内面化の四つのプロセスによって，個人と組織に新たな知識が創造されるとした理論", "エ": "生理的，安全，所属と愛情，承認と自尊，自己実現といった五つの段階で欲求が発達するとされる理論"}}, {"id": "04_aki_q75", "session": "R4秋", "gap": 5, "num": 75, "topic": "デルファイ法の説明はどれか", "subcat": "業務分析・データ利活用", "category": "ストラテジ系", "mondai": "予測手法の一つであるデルファイ法の説明はどれか。", "choices": {"ア": "現状の指標の中に将来の動向を示す指標があることに着目して予測する。", "イ": "将来予測のためのモデル化した連立方程式を解いて予測する。", "ウ": "同時点における複数の観測データの統計比較分析によって将来を予測する。", "エ": "複数の専門家へのアンケートの繰返しによる回答の収束によって将来を予測する。"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H29秋期 問74"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q75.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>デルファイ法</strong>は、技術開発戦略の立案に必要となる将来の技術動向の予測などに用いられる技法であり、①複数の専門家からの意見収集、②得られた意見の統計的集約、③集約された意見のフィードバックという三手順を繰り返して回答を収束し、最終的な意見を得るものです。<br/><br/>したがって「エ」が適切です。<ul><li class=\"lia\">シナリオプランニングの説明です。</li><li class=\"lii\">回帰分析の説明です。</li><li class=\"liu\">統計的予測理論の説明です。</li><li class=\"lie\">正しい。デルファイ法の説明です。</li></ul></div>", "mondai_html": "予測手法の一つであるデルファイ法の説明はどれか。", "choices_html": {"ア": "現状の指標の中に将来の動向を示す指標があることに着目して予測する。", "イ": "将来予測のためのモデル化した連立方程式を解いて予測する。", "ウ": "同時点における複数の観測データの統計比較分析によって将来を予測する。", "エ": "複数の専門家へのアンケートの繰返しによる回答の収束によって将来を予測する。"}}, {"id": "04_aki_q76", "session": "R4秋", "gap": 5, "num": 76, "topic": "アイディアをグルーピングする技法", "subcat": "業務分析・データ利活用", "category": "ストラテジ系", "mondai": "引き出された多くの事実やアイディアを，類似するものでグルーピングしていく収束技法はどれか。", "choices": {"ア": "NM法", "イ": "ゴードン法", "ウ": "親和図法", "エ": "ブレーンストーミング"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 R7春期 問75"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q76.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">NM法は、類比思考法によるアイディア発想法で、①課題を決める、②キーワードを決める、③類比を発想する、④アナロジーの背景を探る、⑤テーマと背景を結び付けてアイデアを出す、⑥解決案にまとめる、という手順で行うものです。名称の由来は、この技法を考案した中山正和氏のイニシャルです。</li><li class=\"lii\">ゴードン法は、ブレーンストーミングと同じく多様なアイディアを発想するためのグループ討議法です。異なるのは議論の本来のテーマを知っているのが司会者だけという点です。参加者にはテーマよりも抽象的な課題について自由に討論してもらうことで視野を広げ、固定観念にとらわれない柔軟な発想を生まれやすくしています。</li><li class=\"liu\">正しい。親和図法(KJ法)は、あるテーマに基づいて集めたデータを相互の関連によってグループ化することで、項目を整理する手法です。複雑に絡み合った問題やまとまっていない意見、出されたアイディアなどを整理したりまとめたりするために用いられます。<div class=\"img_margin\"><img alt=\"76.png/image-size:380×162\" height=\"162\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/76.png\" style=\"max-width: 100%; height: auto;\" width=\"380\"/></div></li><li class=\"lie\">ブレーンストーミングは、多様なアイディアを幅広く集めるために、批判禁止・自由奔放・質より量・便乗歓迎というルールで行うグループ討議の手法です。</li></ul></div>", "mondai_html": "引き出された多くの事実やアイディアを，類似するものでグルーピングしていく収束技法はどれか。", "choices_html": {"ア": "NM法", "イ": "ゴードン法", "ウ": "親和図法", "エ": "ブレーンストーミング"}}, {"id": "04_haru_q63", "session": "R4春", "gap": 6, "num": 63, "topic": "BPOの説明はどれか", "subcat": "業務プロセス", "category": "ストラテジ系", "mondai": "BPOの説明はどれか。", "choices": {"ア": "災害や事故で被害を受けても，重要事業を中断させない，又は可能な限り中断期間を短くする仕組みを構築すること", "イ": "社内業務のうちコアビジネスでない事業に関わる業務の一部又は全部を，外部の専門的な企業に委託すること", "ウ": "製品の基準生産計画，部品表及び在庫情報を基に，資材の所要量と必要な時期を求め，これを基準に資材の手配，納入の管理を支援する生産管理手法のこと", "エ": "プロジェクトを，戦略との適合性や費用対効果，リスクといった観点から評価を行い，情報化投資のバランスを管理し，最適化を図ること"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 H24秋期 問62"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q63.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>BPO</strong>(Business Process Outsourcing)は、経営資源の集中、業務効率の向上、業務コストの削減などを目的に、業務プロセスを対象としてアウトソーシングを実施することです。企業内部の間接部門で行われていた労務管理、人事、経理、給与計算、データの入出力や処理などのバックオフィス業務の一部や、コールセンターの業務全体などを外部の専門業者に委託するケースがこれに該当します。<ul><li class=\"lia\">BCP(Business Continuity Plan：事業継続計画)の説明です。</li><li class=\"lii\">正しい。BPOの説明です。</li><li class=\"liu\">MRP(Material Requirements Planning)の説明です。</li><li class=\"lie\">IT投資マネジメントの説明です。</li></ul></div>", "mondai_html": "BPOの説明はどれか。", "choices_html": {"ア": "災害や事故で被害を受けても，重要事業を中断させない，又は可能な限り中断期間を短くする仕組みを構築すること", "イ": "社内業務のうちコアビジネスでない事業に関わる業務の一部又は全部を，外部の専門的な企業に委託すること", "ウ": "製品の基準生産計画，部品表及び在庫情報を基に，資材の所要量と必要な時期を求め，これを基準に資材の手配，納入の管理を支援する生産管理手法のこと", "エ": "プロジェクトを，戦略との適合性や費用対効果，リスクといった観点から評価を行い，情報化投資のバランスを管理し，最適化を図ること"}}, {"id": "04_haru_q74", "session": "R4春", "gap": 6, "num": 74, "topic": "ファシリテータの役割はどれか", "subcat": "業務分析・データ利活用", "category": "ストラテジ系", "mondai": "会議におけるファシリテータの役割として，適切なものはどれか。", "choices": {"ア": "技術面や法律面など，自らが専門とする特定の領域の議論に対してだけ，助言を行う。", "イ": "議長となり，経営層の意向に合致した結論を導き出すように議論をコントロールする。", "ウ": "中立公平な立場から，会議の参加者に発言を促したり，議論の流れを整理したりする。", "エ": "日程調整・資料準備・議事録作成など，会議運営の事務的作業に特化した支援を行う。"}, "ans": "ウ", "hist_count": 1, "past_history": ["基本情報技術者 H29春期 問75"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q74.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ファシリテータ</strong>(Facilitator)は、「進行役」として会議の支援を専門的に行う人のことです。会議中に自らの意見を主張したり、意思決定をしたりすることはせず、中立的な立場から議事の進行をコーディネートします。会議を設定する、発言を促す、話を整理する、話の脱線を防ぐことなどがファシリテータの役割です。ファシリテータを設けることで、参加者の活性化や相互理解および合意形成を促進する効果があります。<ul><li class=\"lia\">ファシリテータは会議中に自らの意見を主張することはありません。また議論の内容について習熟していることはファシリテータの必須条件ではありません。</li><li class=\"lii\">ファシリテータは中立的な立場であることが求められます。</li><li class=\"liu\">正しい。</li><li class=\"lie\">会議の進行役を務めるのがファシリテータの主な役割です。</li></ul></div>", "mondai_html": "会議におけるファシリテータの役割として，適切なものはどれか。", "choices_html": {"ア": "技術面や法律面など，自らが専門とする特定の領域の議論に対してだけ，助言を行う。", "イ": "議長となり，経営層の意向に合致した結論を導き出すように議論をコントロールする。", "ウ": "中立公平な立場から，会議の参加者に発言を促したり，議論の流れを整理したりする。", "エ": "日程調整・資料準備・議事録作成など，会議運営の事務的作業に特化した支援を行う。"}}, {"id": "04_haru_q76", "session": "R4春", "gap": 6, "num": 76, "topic": "最大利益が見込める設定価格", "subcat": "会計・財務", "category": "ストラテジ系", "mondai": "新製品の設定価格とその価格での予測需要との関係を表にした。最大利益が見込める新製品の設定価格はどれか。ここで，いずれの場合にも，次の費用が発生するものとする。 固定費：1,000,000円 変動費：600円／個", "choices": {"ア": "1,000", "イ": "1,200", "ウ": "1,400", "エ": "1,600"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H26秋期 問77"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q76.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">利益は\"売上－費用\"で計算できます。<br/><br/>この問題では、固定費と変動費が決められているので、<br/><br/>　利益＝価格×販売個数－固定費－変動費×販売個数<br/><br/>の式でそれぞれの場合の利益額を計算します。<ul><li class=\"lia\">　1000×80,000－1,000,000－600×80,000<br/>＝80,000,000－1,000,000－48,000,000<br/>＝31,000,000</li><li class=\"lii\">　1200×70,000－1,000,000－600×70,000<br/>＝84,000,000－1,000,000－42,000,000<br/>＝41,000,000</li><li class=\"liu\">　1400×60,000－1,000,000－600×60,000<br/>＝84,000,000－1,000,000－36,000,000<br/>＝47,000,000</li><li class=\"lie\">　1600×50,000－1,000,000－600×50,000<br/>＝80,000,000－1,000,000－30,000,000<br/>＝<b>49,000,000</b></li></ul>よって、最も利益額が大きいのは「エ」の設定価格で販売した場合です。</div>", "mondai_html": "新製品の設定価格とその価格での予測需要との関係を表にした。最大利益が見込める新製品の設定価格はどれか。ここで，いずれの場合にも，次の費用が発生するものとする。<br/>　　固定費：1,000,000円<br/>　　変動費：600円／個<div class=\"img_margin\"><img alt=\"76.png/image-size:289×128\" height=\"128\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/76.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"289\"/></div>", "choices_html": {"ア": "1,000", "イ": "1,200", "ウ": "1,400", "エ": "1,600"}}, {"id": "04_haru_q78", "session": "R4春", "gap": 6, "num": 78, "topic": "不正アクセス禁止法での規制行為", "subcat": "セキュリティ関連法規", "category": "ストラテジ系", "mondai": "不正アクセス禁止法で規定されている，\"不正アクセス行為を助長する行為の禁止\"規定によって規制される行為はどれか。", "choices": {"ア": "業務その他正当な理由なく，他人の利用者IDとパスワードを正規の利用者及びシステム管理者以外の者に提供する。", "イ": "他人の利用者IDとパスワードを不正に入手する目的で，フィッシングサイトを開設する。", "ウ": "不正アクセスの目的で，他人の利用者IDとパスワードを不正に入手する。", "エ": "不正アクセスの目的で，不正に入手した他人の利用者IDとパスワードをPCに保管する。"}, "ans": "ア", "hist_count": 1, "past_history": ["情報セキュマネ H30秋期 問32"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q78.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>不正アクセス禁止法</b>は、不正アクセス行為やそれを助長する行為を禁止する法律です。<br/><br/>不正アクセス行為とは、①アクセス制御機能をもつコンピュータに対し、②ネットワーク経由でアクセスし、③本人や管理者の承諾なく他人の認証情報を入力し、または認証を回避して、④アクセス制御によって制限されている機能を利用可能な状態する、という4つの要件を満たすものです。<br/><br/>不正アクセス禁止法で禁止されている行為は以下の5類型です。<ul><li>不正アクセス行為そのもの（3条）</li><li>業務その他正当な理由がある場合を除いて、第三者に他人の認証情報を提供する行為（5条）</li><li>不正アクセス行為のために、他人の認証情報を取得する行為（4条）</li><li>不正アクセス行為のために、他人の認証情報を保管する行為（6条）</li><li>管理者になりすまし、または管理者であると誤認させて認証情報の提供を要求する行為（7条）</li></ul>不正アクセス禁止法5条では、「何人も、業務その他正当な理由による場合を除いては、アクセス制御機能に係る他人の識別符号を、当該アクセス制御機能に係るアクセス管理者及び当該識別符号に係る利用権者以外の者に提供してはならない」と定め、業務その他正当な理由がある場合を除いて、他人のIDやパスワードを第三者に教えることを禁止しています。<br/><br/>したがって適切な記述は「ア」です。<ul><li class=\"lia\">正しい。不正アクセス行為を助長する行為の禁止(5条)で規制される行為です。</li><li class=\"lii\">フィッシング目的のサイト開設や、電子メールで利用権者に認証情報を入力させるのは、識別符号の入力を不正に要求する行為の禁止(7条)で規制される行為です。</li><li class=\"liu\">他人の識別符号を不正に取得する行為の禁止(4条)で規制される行為です。</li><li class=\"lie\">他人の識別符号を不正に保管する行為の禁止(6条)で規制される行為です。</li></ul></div>", "mondai_html": "不正アクセス禁止法で規定されている，\"不正アクセス行為を助長する行為の禁止\"規定によって規制される行為はどれか。", "choices_html": {"ア": "業務その他正当な理由なく，他人の利用者IDとパスワードを正規の利用者及びシステム管理者以外の者に提供する。", "イ": "他人の利用者IDとパスワードを不正に入手する目的で，フィッシングサイトを開設する。", "ウ": "不正アクセスの目的で，他人の利用者IDとパスワードを不正に入手する。", "エ": "不正アクセスの目的で，不正に入手した他人の利用者IDとパスワードをPCに保管する。"}}, {"id": "04_haru_q80", "session": "R4春", "gap": 6, "num": 80, "topic": "RoHS指令の目的", "subcat": "その他の法律・ガイドライン", "category": "ストラテジ系", "mondai": "欧州へ電子部品を輸出するには，RoHS指令への対応が必要である。このRoHS指令の目的として，適切なものはどれか。", "choices": {"ア": "家電製品から有用な部分や材料をリサイクルし，廃棄物を減量するとともに，資源の有効利用を推進する。", "イ": "機器が発生する電磁妨害が，無線通信機器及びその他の機器が意図する動作を妨げるレベルを超えないようにする。", "ウ": "大量破壊兵器の開発及び拡散，通常兵器の過剰備蓄に関わるおそれがある場合など，国際社会の平和と安全を脅かす輸出行為を防止する。", "エ": "電気電子製品の生産から処分までの全ての段階で，有害物質が環境及び人の健康に及ぼす危険を最小化する。"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 R7春期 問80"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q80.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>RoHS指令</strong>(ろーずしれい)は、EUが発効した電気電子機器の製造段階における特定有害物質の使用制限に関する規則です。特定有害物質とは、鉛、水銀、カドミウム、六価クロムなど合計10物質で、最終的に埋立てや焼却で処分されるときに人体への悪影響がないように、これらの含有率を最大許容濃度以下にすることを定めています。<br/><br/>EU加盟国の製造業者は本指令に従った製品を市場に出さなければならず、EU加盟国の輸入業者には、本指令に準拠する電気電子機器であるかどうかを適切に評価するための適合性評価手順を製造業者が実行していることを確認する義務があります。そのため、EUに電子部品を輸出する国内製造業者はRoHS指令に対応する必要があります。<br/><br/>したがって「エ」の記述が適切です。<ul><li class=\"lia\">WEEE指令の目的です。</li><li class=\"lii\">EMC指令の目的です。電気電子機器を欧州に輸出する際に適合させる必要があります。</li><li class=\"liu\">外国為替及び外国貿易法に基づく安全保障輸出管理（リスト規制やキャッチオール規制）の目的です。</li><li class=\"lie\">正しい。RoHS指令の目的です。</li></ul></div>", "mondai_html": "欧州へ電子部品を輸出するには，RoHS指令への対応が必要である。このRoHS指令の目的として，適切なものはどれか。", "choices_html": {"ア": "家電製品から有用な部分や材料をリサイクルし，廃棄物を減量するとともに，資源の有効利用を推進する。", "イ": "機器が発生する電磁妨害が，無線通信機器及びその他の機器が意図する動作を妨げるレベルを超えないようにする。", "ウ": "大量破壊兵器の開発及び拡散，通常兵器の過剰備蓄に関わるおそれがある場合など，国際社会の平和と安全を脅かす輸出行為を防止する。", "エ": "電気電子製品の生産から処分までの全ての段階で，有害物質が環境及び人の健康に及ぼす危険を最小化する。"}}, {"id": "03_aki_q62", "session": "R3秋", "gap": 7, "num": 62, "topic": "業務プロセスの改善活動", "subcat": "ビジネス戦略と目標・評価", "category": "ストラテジ系", "mondai": "物流業務において，10%の物流コストの削減の目標を立てて，図のような業務プロセスの改善活動を実施している。図中のcに相当する活動はどれか。", "choices": {"ア": "CSF(Critical Success Factor)の抽出", "イ": "KGI(Key Goal Indicator)の設定", "ウ": "KPI(Key Performance Indicator)の設定", "エ": "MBO(Management by Objectives)の導入"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 H25春期 問62"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q62.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">選択肢に登場する4つの用語の意味は次の通りです。<dl><dt>CSF（Critical Success Factor：重要成功要因）</dt><dd>目標・目的を達成する上で決定的な影響を与える要因のことで、重点的に資源を投下して取り組むべき重要な事項</dd><dt>KGI（Key Goal Indicator：重要目標達成指標）</dt><dd>企業目標やビジネス戦略の遂行によって達成すべき到達目標(Goal)を、測定可能な数値で表したもの</dd><dt>KPI（Key Performance Indicator：重要業績評価指標）</dt><dd>企業目標やビジネス戦略の実現に向けて行われるビジネスプロセスについて、その実施状況をモニタリングするために設定する指標</dd><dt>MBO（Management by Objectives：目標による管理）</dt><dd>個々のグル―プや担当者に自らの業務目標を設定、申告させ、その進捗や実行を各人が自ら主体的に管理する手法</dd></dl>物流コストの削減を目的に改善活動を開始し、aで設定した最終的な目標値(10%削減)に向かって継続的な改善活動を行うサイクルを表しています。bでは、10%削減の目標を実現するための重要となる手段を策定し、cでは、bで設定した目標達成のためのプロセスがどの程度達成できているかをモニタリングする指標を設定しています。<br/><br/>これを選択肢の記述に合わせると、<ul><li>a → KGIの設定</li><li>b → CSFの抽出</li><li>c → KPIの設定</li></ul>となるため正解は「ウ」です。</div>", "mondai_html": "物流業務において，10%の物流コストの削減の目標を立てて，図のような業務プロセスの改善活動を実施している。図中のcに相当する活動はどれか。<div class=\"img_margin\"><img alt=\"62.png/image-size:415×334\" height=\"334\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/62.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"415\"/></div>", "choices_html": {"ア": "CSF(Critical Success Factor)の抽出", "イ": "KGI(Key Goal Indicator)の設定", "ウ": "KPI(Key Performance Indicator)の設定", "エ": "MBO(Management by Objectives)の導入"}}, {"id": "03_aki_q79", "session": "R3秋", "gap": 7, "num": 79, "topic": "特定電子メール法", "subcat": "セキュリティ関連法規", "category": "ストラテジ系", "mondai": "企業が，\"特定電子メールの送信の適正化等に関する法律\"に定められた特定電子メールに該当する広告宣伝メールを送信する場合に関する記述のうち，適切なものはどれか。", "choices": {"ア": "SMSで送信する場合はオプトアウト方式を利用する。", "イ": "オプトイン方式，オプトアウト方式のいずれかを企業が自ら選択する。", "ウ": "原則としてオプトアウト方式を利用する。", "エ": "原則としてオプトイン方式を利用する。"}, "ans": "エ", "hist_count": 1, "past_history": ["情報セキュマネ H29秋期 問32"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q79.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">「オプトイン」と「オプトアウト」は次のような方式です。<dl><dt>オプトイン</dt><dd>事前に同意を得た相手だけにメールを送信する</dd><dt>オプトアウト</dt><dd>メールの送信は原則自由で、受け取りたくない受信者は個別に受信拒否通知を行う</dd></dl>平成20年に施行された<strong>特定電子メール法</strong>では、無差別かつ大量に短時間の内に送信される迷惑メールを規制するために、取引関係者などの一部の例外を除いて同意者以外の者への広告／迷惑メール送信を禁じています。さらに事業者が広告メールの配信を行う際は、メール配信に先だって相手に承諾を求め、同意を得なければならないことが定められています。つまり広告宣伝メールを配信する際には、原則として<em class=\"r\">オプトイン方式</em>を利用しなければなりません。<br/><br/>したがって「エ」が適切な記述です。</div>", "mondai_html": "企業が，\"特定電子メールの送信の適正化等に関する法律\"に定められた特定電子メールに該当する広告宣伝メールを送信する場合に関する記述のうち，適切なものはどれか。", "choices_html": {"ア": "SMSで送信する場合はオプトアウト方式を利用する。", "イ": "オプトイン方式，オプトアウト方式のいずれかを企業が自ら選択する。", "ウ": "原則としてオプトアウト方式を利用する。", "エ": "原則としてオプトイン方式を利用する。"}}, {"id": "03_haru_q67", "session": "R3春", "gap": 8, "num": 67, "topic": "PPMの軸の組合せ", "subcat": "経営戦略手法", "category": "ストラテジ系", "mondai": "プロダクトポートフォリオマネジメント(PPM)マトリックスのa，bに入れる語句の適切な組合せはどれか。", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "ウ", "hist_count": 1, "past_history": ["基本情報技術者 H22春期 問68"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q67.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>プロダクトポートフォリオマネジメント</b>(PPM)は、縦軸と横軸に「市場成長率」と「市場占有率」を設定したマトリクス図を4つの象限に区分し，市場における製品の位置付けを分析することで、経営資源の最適な配分を検討する手法です。<br/><br/>4つの象限は、市場内の位置付けから以下のような名称で呼ばれています。<dl><dt>花形(star) … [成長率：高、占有率：高]</dt><dd>占有率・成長率ともに高く、資金の流入も大きいが、成長に伴い占有率の維持には多額の資金の投入を必要とする分野</dd><dt>金のなる木(cash cow) … [成長率：低、占有率：高]</dt><dd>市場の成長がないため追加の投資が必須ではなく、市場占有率の高さから安定した資金・利益の流入が見込める分野</dd><dt>問題児(problem child) … [成長率：高、占有率：低]</dt><dd>成長率は高いが占有率は低いので、花形製品とするためには多額の投資が必要になる。投資が失敗し、そのまま成長率が下がれば負け犬になってしまうため、慎重な対応を必要とする分野</dd><dt>負け犬(dog) … [成長率：低、占有率：低]</dt><dd>成長率・占有率ともに低く、新たな投資による利益の増加も見込めないため市場からの撤退を検討するべき分野</dd></dl>設問の図では\"金のなる木\"の位置が\"a=低，b=高\"、および\"問題児\"の位置が\"a=高，b=低\"となっていることから、aが市場成長率、bが市場占有率であると判断できます。したがって正しい組合せは「ウ」です。</div>", "mondai_html": "プロダクトポートフォリオマネジメント(PPM)マトリックスのa，bに入れる語句の適切な組合せはどれか。<div class=\"img_margin\"><img alt=\"67.png/image-size:202×187\" height=\"187\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/67.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"202\"/></div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表・図\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/67a.png\" style=\"max-width: 100%; height: auto; display: inline-block; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}}, {"id": "03_haru_q68", "session": "R3春", "gap": 8, "num": 68, "topic": "フォロワー戦略はどれか", "subcat": "経営戦略手法", "category": "ストラテジ系", "mondai": "企業の競争戦略におけるフォロワー戦略はどれか。", "choices": {"ア": "上位企業の市場シェアを奪うことを目標に，製品，サービス，販売促進，流通チャネルなどのあらゆる面での差別化戦略をとる。", "イ": "潜在的な需要がありながら，大手企業が参入してこないような専門特化した市場に，限られた経営資源を集中する。", "ウ": "目標とする企業の戦略を観察し，迅速に模倣することで，開発や広告のコストを抑制し，市場での存続を図る。", "エ": "利潤，名声の維持・向上と最適市場シェアの確保を目標として，市場内の全ての顧客をターゲットにした全方位戦略をとる。"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 H24秋期 問67"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q68.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">アメリカの経営学者であるフィリップ・コトラーが提唱した競争地位戦略において、企業の業界内地位は大きく次の4つに分けられます。<dl><dt>リーダー企業</dt><dd>市場においてナンバー1のシェアを誇る企業</dd><dt>チャレンジャー企業</dt><dd>リーダーに次ぐシェアを保持し、リーダーに競争をしかける企業</dd><dt>ニッチャー企業</dt><dd>小さいながらも、特定の市場で独自の地位を築いている企業</dd><dt>フォロワー企業</dt><dd>リーダーやチャレンジャーの戦略を模倣して、市場での地位を維持している企業</dd></dl>フォロワー企業は、リーダー企業からの報復を招かないことに注意をして収益性を高めていく必要があります。フォロワー企業には、リーダー企業にとってあまり美味しくない市場(例えば、中低価格志向の市場)にターゲットを定め、選択と集中を進める戦略がよく見られます。<ul><li class=\"lia\">チャレンジャー企業のとる差別化戦略です。</li><li class=\"lii\">ニッチャー企業のとるニッチ戦略です。</li><li class=\"liu\">正しい。フォロワー企業の戦略です。</li><li class=\"lie\">リーダー企業のとる全方位戦略(フルライン戦略)です。</li></ul></div>", "mondai_html": "企業の競争戦略におけるフォロワー戦略はどれか。", "choices_html": {"ア": "上位企業の市場シェアを奪うことを目標に，製品，サービス，販売促進，流通チャネルなどのあらゆる面での差別化戦略をとる。", "イ": "潜在的な需要がありながら，大手企業が参入してこないような専門特化した市場に，限られた経営資源を集中する。", "ウ": "目標とする企業の戦略を観察し，迅速に模倣することで，開発や広告のコストを抑制し，市場での存続を図る。", "エ": "利潤，名声の維持・向上と最適市場シェアの確保を目標として，市場内の全ての顧客をターゲットにした全方位戦略をとる。"}}, {"id": "03_haru_q72", "session": "R3春", "gap": 8, "num": 72, "topic": "\"超スマート社会\"実現への取組み", "subcat": "ビジネスシステム", "category": "ストラテジ系", "mondai": "政府は，IoTを始めとする様々なICTが最大限に活用され，サイバー空間とフィジカル空間とが融合された\"超スマート社会\"の実現を推進してきた。必要なものやサービスが人々に過不足なく提供され，年齢や性別などの違いにかかわらず，誰もが快適に生活することができるとされる\"超スマート社会\"実現への取組は何と呼ばれているか。", "choices": {"ア": "e-Gov", "イ": "Society5.0", "ウ": "Web2.0", "エ": "ダイバーシティ社会"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 H30春期 問71"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q72.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>Society5.0</strong>は、狩猟社会、農耕社会、工業社会、情報社会に続く、5番目の新たな社会を指し、日本が目指すべき未来社会の姿として政府で提唱されています。<br/><br/>Society5.0は、サイバー空間（仮想空間）とフィジカル空間（現実空間）を高度に融合させたシステム（サイバーフィジカルシステム：CPS）により、経済発展と社会的課題の解決を両立する、人間中心の社会です。IoT(Internet of Things)で全ての人とモノがつながり、様々な知識や情報が共有され、今までにない新たな価値を生み出すことで、様々な課題や困難を克服します。社会の変革(イノベーション)を通じて、これまでの閉塞感を打破し、希望の持てる社会、世代を超えて互いに尊重し合あえる社会、一人一人が快適で活躍できる社会を目指しています。<div class=\"img_margin\"><img alt=\"72.png/image-size:478×318\" height=\"318\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/72.png\" style=\"max-width: 100%; height: auto;\" width=\"478\"/></div><ul><li class=\"lia\">e-Govは、各府省がインターネットを通じて提供する行政情報の総合的な検索・案内サービスの提供、各府省に対するオンライン申請・届出等の手続の窓口サービスの提供を行う政府のポータルサイトです。</li><li class=\"lii\">正しい。</li><li class=\"liu\">Web2.0は、2000年代中頃以降に起こったWebの利用形態の変容を表す言葉です。従来は情報の送り手と受け手が固定され、送り手から受け手への一方的な流れでしたが、巨大掲示板、SNS、ブログなどの登場により、インターネットは誰もが自由に情報を発信できる新たなフェーズに移行しました。</li><li class=\"lie\">ダイバーシティ社会は、性別、国籍、年齢、障害の有無、性的指向等の属性の違いを超え、多様な立場や価値観を認め合って、各々が生き生きと働き、活躍し、生活する社会です。</li></ul>参考URL: 内閣府 Society 5.0<br/>　<a href=\"http://www8.cao.go.jp/cstp/society5_0/index.html\" target=\"_blank\">http://www8.cao.go.jp/cstp/society5_0/index.html</a></div>", "mondai_html": "政府は，IoTを始めとする様々なICTが最大限に活用され，サイバー空間とフィジカル空間とが融合された\"超スマート社会\"の実現を推進してきた。必要なものやサービスが人々に過不足なく提供され，年齢や性別などの違いにかかわらず，誰もが快適に生活することができるとされる\"超スマート社会\"実現への取組は何と呼ばれているか。", "choices_html": {"ア": "e-Gov", "イ": "Society5.0", "ウ": "Web2.0", "エ": "ダイバーシティ社会"}}, {"id": "03_haru_q78", "session": "R3春", "gap": 8, "num": 78, "topic": "不正競争防止法で禁止されている行為", "subcat": "知的財産権", "category": "ストラテジ系", "mondai": "不正競争防止法で禁止されている行為はどれか。", "choices": {"ア": "競争相手に対抗するために，特定商品の小売価格を安価に設定する。", "イ": "自社製品を扱っている小売業者に，指定した小売価格で販売するよう指示する。", "ウ": "他社のヒット商品と商品名や形状は異なるが同等の機能をもつ商品を販売する。", "エ": "広く知られた他人の商品の表示に，自社の商品の表示を類似させ，他人の商品と誤認させて商品を販売する。"}, "ans": "エ", "hist_count": 1, "past_history": ["情報セキュマネ H30春期 問35"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q78.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>不正競争防止法</strong>は、事業者間の公正な競争等を確保するため、営業秘密侵害、原産地偽装、コピー商品の販売などの不正競争を規制する法律です。この法律では、公正さに欠ける不当な手段で市場競争を行う以下の10種類の行為を不正競争として規制しています。<ol><li>周知な表示を使用して混同を生じさせる行為</li><li>他人の著名な商品等表示を冒用する行為</li><li>他人の商品の形態を模倣した商品を提供する行為</li><li>営業秘密の侵害</li><li>限定提供データを不正取得する行為</li><li>技術的制限手段の無効化装置などの提供行為</li><li>ドメイン名の不正取得などの行為</li><li>原産地、品質等の誤認を惹起する行為</li><li>他人の信用を毀損する行為</li><li>代理人などの商標冒用行為</li></ol><ul><li class=\"lia\">公正な市場競争であり、特に問題となる行為ではありません。</li><li class=\"lii\">独占禁止法で禁止されている再販売価格維持行為です。</li><li class=\"liu\">不正競争防止法では問題ありません。ただし、特許権等の侵害に当たらないかを注意しなければなりません。</li><li class=\"lie\">正しい。他人のよく知られた商品表示と誤認させる行為は不正競争に該当し、不正競争防止法により禁止されています。</li></ul></div>", "mondai_html": "不正競争防止法で禁止されている行為はどれか。", "choices_html": {"ア": "競争相手に対抗するために，特定商品の小売価格を安価に設定する。", "イ": "自社製品を扱っている小売業者に，指定した小売価格で販売するよう指示する。", "ウ": "他社のヒット商品と商品名や形状は異なるが同等の機能をもつ商品を販売する。", "エ": "広く知られた他人の商品の表示に，自社の商品の表示を類似させ，他人の商品と誤認させて商品を販売する。"}}, {"id": "03_haru_q2", "session": "R3春", "gap": 8, "num": 2, "topic": "桁落ちによる誤差の説明", "subcat": "離散数学", "category": "テクノロジ系", "mondai": "桁落ちによる誤差の説明として，適切なものはどれか。", "choices": {"ア": "値のほぼ等しい二つの数値の差を求めたとき，有効桁数が減ることによって発生する誤差", "イ": "指定された有効桁数で演算結果を表すために，切捨て，切上げ，四捨五入などで下位の桁を削除することによって発生する誤差", "ウ": "絶対値の非常に大きな数値と小さな数値の加算や減算を行ったとき，小さい数値が計算結果に反映されないことによって発生する誤差", "エ": "無限級数で表される数値の計算処理を有限項で打ち切ったことによって発生する誤差"}, "ans": "ア", "hist_count": 7, "past_history": ["応用情報技術者 H25秋期 問2", "応用情報技術者 H31春期 問2", "基本情報技術者 H16春期 問5", "基本情報技術者 H22秋期 問2", "基本情報技術者 H27春期 問2", "ソフトウェア開発技術者 H17秋期 問3", "ソフトウェア開発技術者 H20秋期 問2"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>桁落ち</strong>(けたおち)は、計算誤差のひとつで、絶対値の差が非常に小さい2つの値の差を求めたときに、仮数部の大半が打ち消しあい、計算結果の有効桁数が少なくなることによって生じる誤差です。浮動小数点数の計算において、値がほぼ等しい値同士の減算や、絶対値がほぼ等しく正負が異なる値同士の加算によって生じることがあります。<br/><br/>コンピュータの内部では無理数など無限桁の数値も有限桁で表現しているため、有効桁数で表現できない差が\"00…0\"に丸められてしまい桁の欠落が生じます。桁落ちを防ぐ方法として\"分子の有理化\"があります。<br/><br/>例）有効桁数が8桁から2桁に減少する計算<br/>1.2345678－1.2345666＝0.0000012＝1.2×10<sup>-6</sup><ul><li class=\"lia\">正しい。桁落ちの説明です。</li><li class=\"lii\">丸め誤差の説明です。</li><li class=\"liu\">情報落ちの説明です。</li><li class=\"lie\">打ち切り誤差の説明です。</li></ul></div>", "mondai_html": "桁落ちによる誤差の説明として，適切なものはどれか。", "choices_html": {"ア": "値のほぼ等しい二つの数値の差を求めたとき，有効桁数が減ることによって発生する誤差", "イ": "指定された有効桁数で演算結果を表すために，切捨て，切上げ，四捨五入などで下位の桁を削除することによって発生する誤差", "ウ": "絶対値の非常に大きな数値と小さな数値の加算や減算を行ったとき，小さい数値が計算結果に反映されないことによって発生する誤差", "エ": "無限級数で表される数値の計算処理を有限項で打ち切ったことによって発生する誤差"}}, {"id": "05_haru_q21", "session": "R5春", "gap": 4, "num": 21, "topic": "NAND回路", "subcat": "ハードウェア", "category": "テクノロジ系", "mondai": "NAND素子を用いた次の組合せ回路の出力Zを表す式はどれか。ここで，\"・\"は論理積，\"＋\"は論理和，\" X \"はXの否定を表す。", "choices": {"ア": "X・Y", "イ": "X＋Y", "ウ": "X・Y", "エ": "X＋Y"}, "ans": "イ", "hist_count": 5, "past_history": ["応用情報技術者 H23特別 問24", "応用情報技術者 H26春期 問20", "基本情報技術者 H18春期 問16", "基本情報技術者 H24秋期 問22", "ソフトウェア開発技術者 H20秋期 問16"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>NAND回路</strong>は、NAND(Not AND)の名称どおりAND回路の逆を出力する回路で、2つの入力がともに\"1\"のときだけ\"0\"を出力し、それ以外の入力では\"1\"を出力します。<div class=\"img_margin\"><img alt=\"21_1.png/image-size:178×161\" height=\"161\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/21_1.png\" style=\"max-width: 100%; height: auto;\" width=\"178\"/></div>設問の回路に入力値XとYのすべての組合せ（X=0,Y=0・X=1,Y=0・X=0,Y=1・X=1, Y=1）を試すと、それぞれ以下の出力が得られます。<div class=\"img_margin\"><img alt=\"21_2.png/image-size:450×187\" height=\"187\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/21_2.png\" style=\"max-width: 100%; height: auto;\" width=\"450\"/></div>上記結果の入力値XとYおよび出力値Zの関係を整理すると、次の真理値表が得られます。<div class=\"img_margin\"><img alt=\"21_3.png/image-size:178×161\" height=\"161\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/21_3.png\" style=\"max-width: 100%; height: auto;\" width=\"178\"/></div>この真理値表より、設問の回路は2つの入力の論理和を得るOR回路と等価であることがわかるので、正解は「X＋Y」です。<br/><br/>【別解】<br/>回路図を論理式で表し、その論理式を変形することで答えを導く解く方法もあります。<br/><br/> Z＝<span class=\"dol\"><span class=\"ol\">X・X</span>・<span class=\"ol\">Y・Y</span></span><br/>　＝<span class=\"dol\"><span class=\"ol\">X・X</span></span>＋<span class=\"dol\"><span class=\"ol\">Y・Y</span></span>　<em class=\"g\">//ド・モルガンの法則を適用</em><br/>　＝X・X＋Y・Y　<em class=\"g\">//<span class=\"dol\"><span class=\"ol\">A</span></span>＝A</em><br/>　＝X＋Y　<em class=\"g\">//A・A＝A</em></div>", "mondai_html": "NAND素子を用いた次の組合せ回路の出力Zを表す式はどれか。ここで，\"・\"は論理積，\"＋\"は論理和，\"<span class=\"ol\">X</span>\"はXの否定を表す。<div class=\"img_margin\"><img alt=\"21.png/image-size:240×91\" height=\"91\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/21.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"240\"/></div>", "choices_html": {"ア": "X・Y", "イ": "X＋Y", "ウ": "<span class=\"ol\">X・Y</span>", "エ": "<span class=\"ol\">X＋Y</span> "}}, {"id": "05_haru_q46", "session": "R5春", "gap": 4, "num": 46, "topic": "モジュール結合度が最も弱いもの", "subcat": "ソフトウェア方式設計・詳細設計", "category": "テクノロジ系", "mondai": "モジュールの独立性を高めるには，モジュール結合度を低くする必要がある。モジュール間の情報の受渡し方法のうち，モジュール結合度が最も低いものはどれか。", "choices": {"ア": "共通域に定義したデータを関係するモジュールが参照する。", "イ": "制御パラメータを引数として渡し，モジュールの実行順序を制御する。", "ウ": "入出力に必要なデータ項目だけをモジュール間の引数として渡す。", "エ": "必要なデータを外部宣言して共有する。"}, "ans": "ウ", "hist_count": 5, "past_history": ["基本情報技術者 H18春期 問41", "基本情報技術者 H20春期 問44", "基本情報技術者 H28春期 問47", "ソフトウェア開発技術者 H17春期 問42", "ソフトウェア開発技術者 H20春期 問43"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q46.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>モジュール結合度</b>とは、モジュール同士の関連性の強さを表す概念です。関連する別のモジュールに変更があった場合、モジュール同士の結合度が弱いほどその影響を受けにくくなるので、モジュールの保守性は向上します。よって、モジュール結合度が弱いほど、そのモジュールの独立性は高いと言えます。<br/><br/>モジュール結合度の強弱は、モジュール間のデータの受渡し方法などにより6段階のレベルに分類されています。<dl><dt>データ結合（弱い↑）</dt><dd>処理に必要なデータだけを単一のパラメータとして受け渡している</dd><dt>スタンプ結合</dt><dd>処理に必要なデータだけをレコードや構造体などのデータ構造として受け渡している</dd><dt>制御結合</dt><dd>モジュールの動作を制御するための要素を受け渡している</dd><dt>外部結合</dt><dd>大域宣言された単一のデータを、複数のモジュールが参照している</dd><dt>共通結合</dt><dd>大域宣言されたレコードや構造体などのデータ構造を、複数のモジュールが参照している</dd><dt>内容結合（強い↓）</dt><dd>モジュールの内部を直接参照・使用している</dd></dl><ul><li class=\"lia\">共通結合に当たります。</li><li class=\"lii\">制御結合に当たります。</li><li class=\"liu\">正しい。最もモジュール結合度が弱いデータ結合に当たります。</li><li class=\"lie\">外部結合に当たります。</li></ul></div>", "mondai_html": "モジュールの独立性を高めるには，モジュール結合度を低くする必要がある。モジュール間の情報の受渡し方法のうち，モジュール結合度が最も低いものはどれか。", "choices_html": {"ア": "共通域に定義したデータを関係するモジュールが参照する。", "イ": "制御パラメータを引数として渡し，モジュールの実行順序を制御する。", "ウ": "入出力に必要なデータ項目だけをモジュール間の引数として渡す。", "エ": "必要なデータを外部宣言して共有する。"}}, {"id": "04_haru_q2", "session": "R4春", "gap": 6, "num": 2, "topic": "等しい集合はどれか", "subcat": "離散数学", "category": "テクノロジ系", "mondai": "全体集合S内に異なる部分集合AとBがあるとき， A ∩ B に等しいものはどれか。ここで，A∪BはAとBの和集合，A∩BはAとBの積集合， A はSにおけるAの補集合，A－BはAからBを除いた差集合を表す。", "choices": {"ア": "A－B", "イ": "(A∪B)－(A∩B)", "ウ": "(S－A)∪(S－B)", "エ": "S－(A∩B)"}, "ans": "ア", "hist_count": 5, "past_history": ["応用情報技術者 R1秋期 問2", "応用情報技術者 H24秋期 問1", "ソフトウェア開発技術者 H16春期 問4", "ソフトウェア開発技術者 H18春期 問4", "ソフトウェア開発技術者 H19秋期 問5"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">それぞれの集合演算の結果をベン図で表すと次のようになります。<br/><br/>[問題文 <span class=\"ol\">A</span>∩<span class=\"ol\">B</span>]<div class=\"img_margin\"><img alt=\"02.png/image-size:493×125\" height=\"125\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/02.png\" style=\"max-width: 100%; height: auto;\" width=\"493\"/></div><ul><li class=\"lia\"><span class=\"ol\">A</span>－B<div class=\"img_margin\"><img alt=\"02a.png/image-size:493×125\" height=\"125\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/02a.png\" style=\"max-width: 100%; height: auto;\" width=\"493\"/></div></li><li class=\"lii\">(<span class=\"ol\">A</span>∪<span class=\"ol\">B</span>)－(A∩B)<div class=\"img_margin\"><img alt=\"02i.png/image-size:493×125\" height=\"125\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/02i.png\" style=\"max-width: 100%; height: auto;\" width=\"493\"/></div></li><li class=\"liu\">(S－A)∪(S－B)<div class=\"img_margin\"><img alt=\"02u.png/image-size:493×125\" height=\"125\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/02u.png\" style=\"max-width: 100%; height: auto;\" width=\"493\"/></div></li><li class=\"lie\">S－(A∩B)<div class=\"img_margin\"><img alt=\"02e.png/image-size:493×125\" height=\"125\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/02e.png\" style=\"max-width: 100%; height: auto;\" width=\"493\"/></div></li></ul>したがって、<span class=\"ol\">A</span>∩<span class=\"ol\">B</span>と結果が等しいものは「<span class=\"ol\">A</span>－B」であるとわかります。</div>", "mondai_html": "全体集合S内に異なる部分集合AとBがあるとき，<span class=\"ol\">A</span>∩<span class=\"ol\">B</span>に等しいものはどれか。ここで，A∪BはAとBの和集合，A∩BはAとBの積集合，<span class=\"ol\">A</span>はSにおけるAの補集合，A－BはAからBを除いた差集合を表す。", "choices_html": {"ア": "
