公開鍵の鍵ペアを作成し、公開鍵をDNSKEYレコードとして公開しておく</li><li class=\"maru2\">ゾーンの管理者は、リソースレコードのデジタル署名を作成しておく</li><li class=\"maru3\">権威DNSサーバは、DNS問合せがあった際に応答パケットにデジタル署名を含めて返信する</li><li class=\"maru4\">リゾルバ側でデジタル署名を検証し、DNS応答の正当性・完全性を検証する</li></ol><div class=\"img_margin\"><img alt=\"13.png/image-size:508×132\" height=\"132\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/13.png\" style=\"max-width: 100%; height: auto;\" width=\"508\"/></div>DNSSECを実装することにより、攻撃者によるデータの偽装を検知することが出来るようになり、攻撃者が偽のDNS応答を送り付けるDNSキャッシュポイズニングのような攻撃を防ぐことができるようになります。なお、通信の暗号化は行いません。また、リソースレコードへのデジタル署名の際には公開鍵暗号方式（公開鍵と秘密鍵を使う方式）を利用して署名します。<ul><li class=\"lia\">DNSSECは、DNS応答の正当性・完全性を確保するための技術であり、暗号化を行うものでありません。</li><li class=\"lii\">デジタル署名の検証はリゾルバ側で行います。</li><li class=\"liu\">DNS問合せに対する応答をするのは、権威DNSサーバです。リゾルバではありません。また暗号化も行いません。</li><li class=\"lie\">正しい。リゾルバがリソースレコード受信時にデジタル署名を検証することで、データの作成元の正当性とデータの完全性を確認するものです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q14", "session": "支援士 R5秋", "gap": 3, "num": 14, "topic": "OAuth2.0", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "OAuth2.0に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">OAuth2.0に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "認可を行うためのプロトコルであり，認可サーバが，アクセスしてきた者が利用者(リソースオーナー)本人であるかどうかを確認するためのものである。", "イ": "認可を行うためのプロトコルであり，認可サーバが，利用者(リソースオーナー)の許可を得て，サービス(クライアント)に対し，適切な権限を付与するためのものである。", "ウ": "認証を行うためのプロトコルであり，認証サーバが，アクセスしてきた者が利用者(リソースオーナー)本人であるかどうかを確認するためのものである。", "エ": "認証を行うためのプロトコルであり，認証サーバが，利用者(リソースオーナー)の許可を得て，サービス(クライアント)に対し，適切な権限を付与するためのものである。"}, "choices_html": {"ア": "認可を行うためのプロトコルであり，認可サーバが，アクセスしてきた者が利用者(リソースオーナー)本人であるかどうかを確認するためのものである。", "イ": "認可を行うためのプロトコルであり，認可サーバが，利用者(リソースオーナー)の許可を得て，サービス(クライアント)に対し，適切な権限を付与するためのものである。", "ウ": "認証を行うためのプロトコルであり，認証サーバが，アクセスしてきた者が利用者(リソースオーナー)本人であるかどうかを確認するためのものである。", "エ": "認証を行うためのプロトコルであり，認証サーバが，利用者(リソースオーナー)の許可を得て，サービス(クライアント)に対し，適切な権限を付与するためのものである。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>OAuth2.0</strong>は、あるWebサービスが保有しているリソースを、その利用者ユーザー本人の許可のもと、別のWebサービスでも利用できるように<em class=\"r\">認可</em>して連携するための仕組みです。<br/><br/>OAuth2.0では認証は行わず、リソース単位で適切な権限を与えます。ユーザーが許可すると、サードパーティアプリケーションに対してWebサービス側からアクセストークン（委任状のようなもの）が発行され、サードパーティアプリケーションはユーザーに代わりそれを使用してWebサービス（API）にアクセスします。<div class=\"img_margin\"><img alt=\"14.png/image-size:609×333\" height=\"333\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/14.png\" style=\"max-width: 100%; height: auto;\" width=\"609\"/></div>良く見るものとしては、あるWebサービスに新規登録する際、ID/PWでの登録の他に『FacebookやGoogleアカウントでの新規登録もできます』と表示される画面があります。これにはOAuth2.0の仕組みが使われています。あるWebサービス（＝FacebookやGoogle）が保有しているリソースを、その利用者（＝あなた）が別のWebサービス（＝新規登録するWebサービス）でも利用できるように認可して連携するのです。注意が必要なのは、認証（利用者本人の確認を行うこと）は行わず、認可（利用者に正しい権限を与えること）のみであるという点です。認可も認証も行うものにはOpenID Connectがあります。<br/><br/>認証を行わないので「ウ」「エ」は誤り、行うのは本人確認ではなくリソース使用の認可なので「ア」は誤りです。したがって「イ」の記述適切です。</div>", "past_history": ["安全確保支援士 R7春期 問16"], "hist_count": 2}, {"id": "sc_05_aki_q15", "session": "支援士 R5秋", "gap": 3, "num": 15, "topic": "安全に遠隔ログインするためのプロトコル", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "通信の暗号化や利用者の認証の機能をもち，遠隔にあるコンピュータに安全にログインするためのプロトコルはどれか。", "mondai_html": "<div id=\"mondai\">通信の暗号化や利用者の認証の機能をもち，遠隔にあるコンピュータに安全にログインするためのプロトコルはどれか。</div>", "choices": {"ア": "L2TP", "イ": "LDAP", "ウ": "RADIUS", "エ": "SSH"}, "choices_html": {"ア": "L2TP", "イ": "LDAP", "ウ": "RADIUS", "エ": "SSH"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">Layer 2 Tunneling Protocolの略。OSI基本参照モデルの第2層におけるトンネリングプロトコルです。PPPなどのデータリンク層のフレームをIPヘッダーでカプセル化することで、ルータを越えた複数の拠点間でフレームのやり取りを実現します。暗号化の機能はないため必要に応じてIPsecと併用する必要があります。</li><li class=\"lii\">Lightweight Directory Access Protocolの略。ユーザーIDやパスワードなどのユーザー情報やネットワーク資源情報を一元管理するとともに、それらの情報を提供する「ディレクトリサービス」にアクセスするためのプロトコルです。</li><li class=\"liu\">Remote Authentication Dial In User Serviceの略。認証情報、認証手続および利用ログの記録（アカウンティング）をネットワーク上のサーバに一元化することを目的とした認証プロトコルです。</li><li class=\"lie\">正しい。<strong>SSH</strong>(Secure SHell)は、公開鍵暗号や認証の技術を用いて、遠隔地にあるコンピュータ（リモートコンピュータ）との間で安全にリモート通信をするためのプロトコルです。<br/>ネットワークを介して遠隔地のコンピュータを操作する「rlogin」や「rsh」などのUNIX系コマンドや「TELNET」などを安全に利用するための方式です。また、ポートフォワーディング機能を使って、FTP、POP、SMTPなどの暗号化機能をもたないプロトコルを安全に利用する手段としても使用されています。</li></ul></div>", "past_history": ["情報セキュリティ H21秋期 問20", "情報セキュリティ H26秋期 問11"], "hist_count": 3}, {"id": "sc_05_aki_q16", "session": "支援士 R5秋", "gap": 3, "num": 16, "topic": "メール受信の暗号化プロトコル", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "電子メールをスマートフォンのメールアプリケーションプログラムで受信する際のメールサーバとスマートフォンとの間の通信を，メール本文を含めて暗号化するプロトコルはどれか。", "mondai_html": "<div id=\"mondai\">電子メールをスマートフォンのメールアプリケーションプログラムで受信する際のメールサーバとスマートフォンとの間の通信を，メール本文を含めて暗号化するプロトコルはどれか。</div>", "choices": {"ア": "APOP", "イ": "IMAPS", "ウ": "POP3", "エ": "SMTP Submission"}, "choices_html": {"ア": "APOP", "イ": "IMAPS", "ウ": "POP3", "エ": "SMTP Submission"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>IMAPS</strong>(IMAP over SSL/TLS)は、メール受信プロトコルであるIMAP(Internet Message Access Protocol)にTLSを組み合わせ、TLSによって暗号化された通信コネクション上でメール受信を行うプロトコルです。バージョン番号を付けてIMAP4Sと表記されることもあります。<br/><br/>既存のプロトコル名の後ろに\"S\"が付いているものは、TLSにより暗号化されたものであることが多いです。HTTP<u>S</u>もその1つです。POP3にもTLS版であるPOP3<u>S</u>というプロトコルがあります。<ul><li class=\"lia\">Authenticated POPの略。メール受信前の認証におけるパスワード送信を暗号化(MD5ハッシュ化)することで安全性を高めたプロトコルです。暗号化されるのはパスワードだけなので、メール本文は暗号化されず平文のまま通信経路上を流れます。</li><li class=\"lii\">正しい。IMAPSは認証やメール本文の受信など、IMAP通信の全てをTLSによって暗号化するプロトコルです。</li><li class=\"liu\">POP3は、認証やメール本文の通信を平文で行うメール受信プロトコルです。</li><li class=\"lie\">SMTP Submissionは、ユーザー(メールソフト)からのメール送信を専門に受け付けるサブミッションポート(587/TCP)を用意し、SMTP-AUTH認証を経たユーザーからのメールだけを送信する仕組みです。メール受信用途ではなく、OP25Bの影響を受けずに外部のメールサーバを使用したメール送信を可能にする仕組みなので誤りです。</li></ul></div>", "past_history": ["安全確保支援士 R4春期 問16"], "hist_count": 2}, {"id": "sc_05_aki_q17", "session": "支援士 R5秋", "gap": 3, "num": 17, "topic": "ステートフルパケットインスペクション型FW", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "セキュリティ対策として，次の条件の下でデータベース(DB)サーバをDMZから内部ネットワークに移動するようなネットワーク構成の変更を計画している。このとき，ステートフルパケットインスペクション型のファイアウォール(FW)において，必要となるフィルタリングルールの変更のうちの一つはどれか。〔条件〕Webアプリケーション(WebAP)サーバを，インターネットに公開し，HTTPSでアクセスできるようにする。WebAPサーバ上のプログラムだけがDBサーバ上のDBに接続でき，ODBC(Open Database Connectivity)を使用して特定のポート間で通信する。SSHを使用して各サーバに接続できるのは，運用管理PCだけである。フィルタリングルールは，必要な通信だけを許可する設定にする。〔ネットワーク構成〕", "mondai_html": "<div id=\"mondai\">セキュリティ対策として，次の条件の下でデータベース(DB)サーバをDMZから内部ネットワークに移動するようなネットワーク構成の変更を計画している。このとき，ステートフルパケットインスペクション型のファイアウォール(FW)において，必要となるフィルタリングルールの変更のうちの一つはどれか。<br/><br/>〔条件〕<ul><li class=\"li1\">Webアプリケーション(WebAP)サーバを，インターネットに公開し，HTTPSでアクセスできるようにする。</li><li class=\"li2\">WebAPサーバ上のプログラムだけがDBサーバ上のDBに接続でき，ODBC(Open Database Connectivity)を使用して特定のポート間で通信する。</li><li class=\"li3\">SSHを使用して各サーバに接続できるのは，運用管理PCだけである。</li><li class=\"li4\">フィルタリングルールは，必要な通信だけを許可する設定にする。</li></ul><br/>〔ネットワーク構成〕<div class=\"img_margin\"><img alt=\"17.png/image-size:505×185\" height=\"185\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/17.png\" style=\"max-width: 100%; height: auto;\" width=\"505\"/></div></div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/17a.png\" style=\"max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">インターネットからWebAPサーバへのHTTP(S)を許可するルールを削除すると、公開WebAPサーバが外部からリクエストを受け付けることができなくなります。これにより、Webサービスを提供できなくなってしまうため不適切です。</li><li class=\"lii\">正しい。変更前は運用管理PCから各サーバへのSSH通信をFWで許可していましたが、変更後はDBサーバが内部ネットワークに移動するので、運用管理PCからDBサーバ宛ての通信を許可するルールは不要となります。フィルタリングルールは、必要な通信だけを許可する設定にするという条件より、このルールを削除しなければなりません。</li><li class=\"liu\">WebAPサーバとDBサーバはODBCによって通信するので、許可すべきサービスはSSHではなくODBCです。SSHだと不要なルールを追加することになるため不適切です。</li><li class=\"lie\">ODBCはデータベースにアクセスする際に使用するサービスなので、インターネットからWebAPサーバへのODBCを許可しても無意味です。不要なルールなので不適切です。</li></ul></div>", "past_history": ["安全確保支援士 R2秋期 問14"], "hist_count": 2}, {"id": "sc_05_aki_q18", "session": "支援士 R5秋", "gap": 3, "num": 18, "topic": "サブネットマスク", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "クラスCのネットワークを，50ノードずつ収納できる四つのサブネットに分割した場合のサブネットマスクはどれか。", "mondai_html": "<div id=\"mondai\">クラスCのネットワークを，50ノードずつ収納できる四つのサブネットに分割した場合のサブネットマスクはどれか。</div>", "choices": {"ア": "255.255.255.0", "イ": "255.255.255.64", "ウ": "255.255.255.128", "エ": "255.255.255.192"}, "choices_html": {"ア": "255.255.255.0", "イ": "255.255.255.64", "ウ": "255.255.255.128", "エ": "255.255.255.192"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">IPv4のクラスCネットワークは、アドレスの先頭24ビットがネットワークアドレス、残り8ビットがホストアドレス部です。ホスト部が8ビットなので1つのネットワークに収納できるホストの数は「2<sup>8</sup>＝256」が基本です。このネットワークが大きい場合には、ホストアドレス部の一部をネットワークアドレスに割り当てることで、ネットワークを複数の小さなネットワーク（サブネット）に分割することができます。これが「サブネット化」です。<br/><br/>ネットワークアドレスに追加するビット数に応じて、各サブネットに収納できるホスト数は次のように2分の1ずつ減っていきます。<ul><li>ネットワークアドレス部＋1ビット、ホストアドレス部7ビット<br/>⇒サブネット数は「2<sup>1</sup>＝2」、収納できるホストの数は「2<sup>7</sup>＝128」</li><li>ネットワークアドレス部＋2ビット、ホストアドレス部6ビット、<br/>⇒サブネット数は「2<sup>2</sup>＝4」、収納できるホストの数は「2<sup>6</sup>＝64」</li><li>ネットワークアドレス部+3ビット、ホストアドレス部5ビット、<br/>⇒サブネット数は「2<sup>3</sup>＝8」、収納できるホストの数は「2<sup>5</sup>＝32」</li></ul>50ノードずつ収納できる4つのサブネットに分割するためには、ホストアドレスのうち先頭2ビットをネットワークアドレスに割り当てる必要があります。したがって、サブネットマスクには先頭「24＋2＝26ビット」を\"1\"にした次の値を設定することになります。<br/><br/>　111111111 11111111 11111111 11000000<br/><br/>これを10進数表記にした「255.255.255.192」が正解です。<ul><li class=\"lia\">サブネットは1つなので条件を満たしません。</li><li class=\"lii\">下位1オクテットが 01000000 となり、サブネットマスクの途中に\"0\"が入るため、適切な形式ではありません。</li><li class=\"liu\">サブネットは2つなので条件を満たしません。</li><li class=\"lie\">正しい。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q19", "session": "支援士 R5秋", "gap": 3, "num": 19, "topic": "マルチキャストの宛先アドレス", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "複数ノードから成るグループにマルチキャストでデータを送るときに，宛先として使用できるIPアドレスはどれか。", "mondai_html": "<div id=\"mondai\">複数ノードから成るグループにマルチキャストでデータを送るときに，宛先として使用できるIPアドレスはどれか。</div>", "choices": {"ア": "10.0.1.1", "イ": "127.0.1.1", "ウ": "192.168.1.1", "エ": "239.0.1.1"}, "choices_html": {"ア": "10.0.1.1", "イ": "127.0.1.1", "ウ": "192.168.1.1", "エ": "239.0.1.1"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>マルチキャスト</strong>は、1回の送信で特定のグループに属する複数のホストにIPパケットを送信する方法です。1回で1つのホストに送信するユニキャストと、1回で同じネットワークセグメントに属するすべてのホストに同報送信するブロードキャストの中間に位置する送信方法と言えます。<div class=\"img_margin\"><img alt=\"19.png/image-size:556×180\" height=\"180\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/19.png\" style=\"max-width: 100%; height: auto;\" width=\"556\"/></div>現状、マルチキャストが使用される場面は決して多くはありませんが、①ルータを越えた先の複数のホストに対して同報通信できること、②関係ないホストへの通信が生じないこと、③通信パケットが適宜ルータで複製されるためネットワーク負荷を小さくできる利点から、音声・動画配信やビデオ会議などのストリーミングやルーティングプロトコルで用いられています。IP通信では、宛先IPアドレスを複数指定することはできないので、マルチキャスト通信ではマルチキャストのグループを示す特別なIPアドレス（クラスD：<em class=\"m\">224.0.0.0～239.255.255.255</em>）を宛先として使用します。<br/><br/>したがって、選択肢のうちクラスDのIPアドレスである「エ」が正解です。<ul><li class=\"lia\">クラスAのIPアドレスです。</li><li class=\"lii\">自分自身を指定するためのループバックアドレスです。</li><li class=\"liu\">クラスCのIPアドレスです。</li><li class=\"lie\">正しい。クラスDのIPアドレスなので、マルチキャストの宛先として使用できます。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q20", "session": "支援士 R5秋", "gap": 3, "num": 20, "topic": "ホストアドレスの重複を確認するプロトコル", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "DHCPのクライアントが，サーバから配布されたIPv4アドレスを，クライアント自身のホストアドレスとして設定する際に，そのアドレスが他のホストに使用されていないことを，クライアント自身でも確認することが推奨されている。この確認に使用するプロトコルとして，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">DHCPのクライアントが，サーバから配布されたIPv4アドレスを，クライアント自身のホストアドレスとして設定する際に，そのアドレスが他のホストに使用されていないことを，クライアント自身でも確認することが推奨されている。この確認に使用するプロトコルとして，適切なものはどれか。</div>", "choices": {"ア": "ARP", "イ": "DNS", "ウ": "ICMP", "エ": "RARP"}, "choices_html": {"ア": "ARP", "イ": "DNS", "ウ": "ICMP", "エ": "RARP"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ARP</strong>(Address Resolution Protocol)は、IPアドレスから同じLANに接続された機器のMACアドレスの情報を得られるプロトコルです。ARPでは通常他の端末にデータを送信する際に、宛先端末のMACアドレスを得るために使いますが、ARPの性質を活用して、同じセグメント内でIPアドレスの重複がないかを確認するために使われています。<br/><br/>IPアドレスの重複を確認する手順は次のとおりです。<ol><li>重複を確認したいIPアドレスを目標IPアドレスにセットしてARP要求を送る</li><li>すでにそのIPアドレスが設定されている端末があればARP応答がある。ARP応答がなければそのIPアドレスは使われていない</li></ol>このように自分自身に設定するIPアドレスを目的とするARP要求を<strong>GARP</strong>(Gratuitous ARP)といい、IPアドレスの重複チェックとネットワークの構成変更によりARPキャッシュを更新する場面で使われています。<ul><li class=\"lia\">正しい。GARPによりIPアドレスの重複を確認することができます。</li><li class=\"lii\">Domain Name Systemの略。ドメイン名とIPアドレスを紐づける仕組みです。</li><li class=\"liu\">Internet Control Message Protocolの略。インターネットプロトコル(IP)の通信制御を補完するプロトコルで、データ配送中のエラー通知や送達エラーを通知する機能を持ちます。</li><li class=\"lie\">Reverse Address Resolution Protocolの略。ARPとは逆に、LAN上のMACアドレスから対応する端末のIPアドレスの情報を得るプロトコルです。IPアドレスを知りたいクライアントが目標MACアドレスとして要求すると、RARPサーバがそのMACアドレスに関連付けられたIPアドレスを返します。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q21", "session": "支援士 R5秋", "gap": 3, "num": 21, "topic": "データディクショナリはどれか", "subcat": "データベース設計", "category": "情報セキュリティ", "mondai": "DBMSのデータディクショナリはどれか。", "mondai_html": "<div id=\"mondai\">DBMSのデータディクショナリはどれか。</div>", "choices": {"ア": "DBMS内部でのソートデータ，サブクエリを展開したデータなど，一時的なデータを格納したもの", "イ": "障害が発生した場合にバックアップを取った時点まで回復させるため，データベース自体の複製を格納したもの", "ウ": "データベースに関するユーザー情報，データ構造など，データベース管理情報を格納したもの", "エ": "ユーザーからの指示によるデータベースの読込み情報，書込み情報などを格納したもの"}, "choices_html": {"ア": "DBMS内部でのソートデータ，サブクエリを展開したデータなど，一時的なデータを格納したもの", "イ": "障害が発生した場合にバックアップを取った時点まで回復させるため，データベース自体の複製を格納したもの", "ウ": "データベースに関するユーザー情報，データ構造など，データベース管理情報を格納したもの", "エ": "ユーザーからの指示によるデータベースの読込み情報，書込み情報などを格納したもの"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>データディクショナリ</strong>(DD)は、データベースの特徴や属性やデータ定義情報など、データベース本体ではなく、データベースに付帯する情報（メタデータ）を格納するための文書やファイルのことを指します。データディクショナリは、次のような情報が格納されています。他のデータベースと同じく表とビューで構成されているので、SQL文でアクセスすることができます。<ul><li>概念スキーマ、外部スキーマ、内部スキーマとそれらの変換定義情報</li><li>表、ビュー、インデックス、その他オブジェクトの定義情報</li><li>参照制約、検査制約の定義情報</li><li>ユーザー情報</li><li>アクセス権と機密保護に関する情報</li></ul><ul><li class=\"lia\">一時ファイルの説明です。DBMS内部での一時データを格納するために使用されます。処理が終了すると自動的に削除されます。</li><li class=\"lii\">バックアップファイルの説明です。障害が発生した際に、バックアップファイルから復元するために使用します。</li><li class=\"liu\">正しい。データディクショナリの説明です。</li><li class=\"lie\">ログファイルの説明です。ユーザーが行った操作とその結果を保存します。主に何かあった際（＝サイバー攻撃や、悪意のある人による不正など）に証拠を確認するために使用します。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q22", "session": "支援士 R5秋", "gap": 3, "num": 22, "topic": "システムの耐障害性・信頼性を高める手法", "subcat": "開発プロセス・手法", "category": "情報セキュリティ", "mondai": "目的別のサービスが多数連携して動作する大規模な分散型のシステムでは，障害時の挙動を予知することが困難である。このようなシステムにおいて，ステージング環境や本番環境で意図的に障害を引き起こしてシステムの挙動を観察し，発見した問題を修正することを継続的に実施し，システムの耐障害性及びシステム運用の信頼性を高めていく手法はどれか。", "mondai_html": "<div id=\"mondai\">目的別のサービスが多数連携して動作する大規模な分散型のシステムでは，障害時の挙動を予知することが困難である。このようなシステムにおいて，ステージング環境や本番環境で意図的に障害を引き起こしてシステムの挙動を観察し，発見した問題を修正することを継続的に実施し，システムの耐障害性及びシステム運用の信頼性を高めていく手法はどれか。</div>", "choices": {"ア": "DevOps", "イ": "Infrastructure as Code", "ウ": "カオスエンジニアリング", "エ": "テスト駆動開発"}, "choices_html": {"ア": "DevOps", "イ": "Infrastructure as Code", "ウ": "カオスエンジニアリング", "エ": "テスト駆動開発"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">DevOps(デブオプス)は、開発を意味する Development と運用を意味する Operations を組み合わせた造語で、開発担当チームと運用担当チームが緊密に協力・連携し、自動化ツールなどを活用して柔軟かつスピーディにソフトウェア開発を進める手法です。</li><li class=\"lii\">IaC(Infrastructure as Code)は、インフラストラクチャ、すなわちシステムの動作基盤となるサーバ、ネットワーク、OS、ミドルウェアなどの設定をプログラムのようなコードとして管理することで、その変更やセットアップ作業をソフトウェアで自動化する手法です。</li><li class=\"liu\">正しい。<strong>カオスエンジニアリング</strong>(Chaos Engineering)は、システムが本番環境における不安定な状態に耐える能力へ自信を持つためにシステム上で実験を行う訓練方法です。Netflixが導入したことで注目されるようになった手法です。<br/>サービスが多数連携して動作する大規模な分散型のシステムの本番環境において、実際に小規模の障害（サーバダウンや応答遅延など）を意図的に発生させ、システムの挙動がどのように変化するのかを測定します。定常状態を保つことできれば、システムの挙動はより確実と言えます。定常状態を乱す脆弱性が発見された場合は、そのシステムの動作が顕著に現れる前に改善の目標を立てます。</li><li class=\"lie\">テスト駆動開発は、プロダクトコードと並行してテストコードを書き、小まめに実行して結果を見ながら開発するというテストファーストの開発手法です。テストをパスする最低限の実装を行うことで求める機能を明確化し、機能を維持したままコードを洗練していくという手順で開発を進めます。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q23", "session": "支援士 R5秋", "gap": 3, "num": 23, "topic": "スクラムのものはどれか", "subcat": "開発プロセス・手法", "category": "情報セキュリティ", "mondai": "アジャイル開発手法の説明のうち，スクラムのものはどれか。", "mondai_html": "<div id=\"mondai\">アジャイル開発手法の説明のうち，スクラムのものはどれか。</div>", "choices": {"ア": "コミュニケーション，シンプル，フィードバック，勇気，尊重の五つの価値を基礎とし，テスト駆動型開発，ペアプログラミング，リファクタリングなどのプラクティスを推奨する。", "イ": "推測(プロジェクト立上げ，適応的サイクル計画)，協調(並行コンポーネント開発)，学習(品質レビュー，最終QA／リリース)のライフサイクルをもつ。", "ウ": "プロダクトオーナーなどの役割，スプリントレビューなどのイベント，プロダクトバックログなどの作成物，及びルールから成る。", "エ": "モデルの全体像を作成した上で，優先度を付けた詳細なフィーチャリストを作成し，フィーチャを単位として計画し，フィーチャごとの設計と構築とを繰り返す。"}, "choices_html": {"ア": "コミュニケーション，シンプル，フィードバック，勇気，尊重の五つの価値を基礎とし，テスト駆動型開発，ペアプログラミング，リファクタリングなどのプラクティスを推奨する。", "イ": "推測(プロジェクト立上げ，適応的サイクル計画)，協調(並行コンポーネント開発)，学習(品質レビュー，最終QA／リリース)のライフサイクルをもつ。", "ウ": "プロダクトオーナーなどの役割，スプリントレビューなどのイベント，プロダクトバックログなどの作成物，及びルールから成る。", "エ": "モデルの全体像を作成した上で，優先度を付けた詳細なフィーチャリストを作成し，フィーチャを単位として計画し，フィーチャごとの設計と構築とを繰り返す。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>スクラム</strong>は、アジャイル開発の方法論の1つで、開発プロジェクトを数週間程度の短期間ごとに区切り、その期間内に分析、設計、実装、テストの一連の活動を行い、一部分の機能を完成させるという作業を繰り返しながら、段階的に動作可能なシステムを作り上げるフレームワークです。スクラム開発では開発反復の単位を「スプリント」といいます。<br/><br/>スクラムでは、スクラムチームを構成するプロダクトオーナー・開発チーム・スクラムマスターの役割、並びに5つのイベントと3つの作成物が定義されています。<div class=\"img_margin\"><img alt=\"23.png/image-size:513×194\" height=\"194\" src=\"https://www.sc-siken.com/kakomon/05_aki/img/23.png\" style=\"max-width: 100%; height: auto;\" width=\"513\"/></div><ul><li class=\"lia\">XP(エクストリームプログラミング)の説明です。</li><li class=\"lii\">適応型ソフトウェア開発(Adaptive Software Development：ASD)の説明です。</li><li class=\"liu\">正しい。スクラムの説明です。</li><li class=\"lie\">フィーチャ駆動開発(Feature Driven Development：FDD)の説明です。ユーザー機能駆動開発とも呼ばれます。</li></ul>参考URL:スクラムガイド(PDF)<br/><a href=\"https://scrumguides.org/docs/scrumguide/v2020/2020-Scrum-Guide-Japanese.pdf\" target=\"_blank\">https://scrumguides.org/docs/scrumguide/v2020/2020-Scrum-Guide-Japanese.pdf</a></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q24", "session": "支援士 R5秋", "gap": 3, "num": 24, "topic": "SMSで定期的に実施するもの", "subcat": "サービスマネジメント", "category": "情報セキュリティ", "mondai": "JIS Q 20000-1:2020(サービスマネジメントシステム要求事項)を適用している組織において，サービスマネジメントシステム(SMS)が次の要求事項に適合している状況にあるか否かに関する情報を提供するために，あらかじめ定めた間隔で組織が実施するものはどれか。〔要求事項〕SMSに関して，組織自体が規定した要求事項JIS Q 20000-1:2020の要求事項", "mondai_html": "<div id=\"mondai\">JIS Q 20000-1:2020(サービスマネジメントシステム要求事項)を適用している組織において，サービスマネジメントシステム(SMS)が次の要求事項に適合している状況にあるか否かに関する情報を提供するために，あらかじめ定めた間隔で組織が実施するものはどれか。<br/><br/>〔要求事項〕<ul><li>SMSに関して，組織自体が規定した要求事項</li><li>JIS Q 20000-1:2020の要求事項</li></ul></div>", "choices": {"ア": "監視，測定，分析及び評価", "イ": "サービスの報告", "ウ": "内部監査", "エ": "マネジメントレビュー"}, "choices_html": {"ア": "監視，測定，分析及び評価", "イ": "サービスの報告", "ウ": "内部監査", "エ": "マネジメントレビュー"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">①監視，測定，分析及び評価、②内部監査、③マネジメントレビュー、④サービスの報告は、JIS Q 20000-1:2020におけるパフォーマンス評価（PDCAの\"C\"）の一連のプロセスです。<dl><dt>監視，測定，分析及び評価</dt><dd>あらかじめ決められた時期・方法でSMSとサービスの監視・測定を行い、その結果を分析・評価する</dd><dt>内部監査</dt><dd>SMSが要求事項に適合しているか、効果的に実施され、維持されているかを監査する</dd><dt>マネジメントレビュー</dt><dd>SMSとサービスの適切性・妥当性・有効性が保たれているかを、トップマネジメントがレビューする</dd><dt>サービスの報告</dt><dd>上記の結果に基づき、SMSとサービスのパフォーマンスと有効性について報告する</dd></dl>したがって、要求事項への適合性を確認するプロセスは「ウ」の内部監査です。<ul><li class=\"lia\">監視、測定、分析及び評価は、SMSとサービスを監視・測定し、その結果を分析・評価するプロセスです。</li><li class=\"lii\">サービスの報告は、SMSとサービスのパフォーマンスや有効性に関する報告を行うプロセスです。</li><li class=\"liu\">正しい。内部監査は、SMSが要求事項に適合しているか、効果的に実施され、維持されているかを確認するために、組織があらかじめ定めた間隔で実施するプロセスです。</li><li class=\"lie\">マネジメントレビューは、SMSとサービスの適切性・妥当性・有効性が保たれているかを、トップマネジメントが定期的にレビューすることです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_aki_q25", "session": "支援士 R5秋", "gap": 3, "num": 25, "topic": "監査報告書で報告すべき指摘事項", "subcat": "システム監査", "category": "情報セキュリティ", "mondai": "データベースの直接修正に関して，監査人が，システム監査報告書で報告すべき指摘事項はどれか。ここで，直接修正とは，アプリケーションソフトウェアの機能を経由せずに，特権IDを使用してデータを追加，変更又は削除することをいう。", "mondai_html": "<div id=\"mondai\">データベースの直接修正に関して，監査人が，システム監査報告書で報告すべき指摘事項はどれか。ここで，直接修正とは，アプリケーションソフトウェアの機能を経由せずに，特権IDを使用してデータを追加，変更又は削除することをいう。</div>", "choices": {"ア": "更新ログ上は，アプリケーションソフトウェアの機能を経由したデータ更新として記録していた。", "イ": "事前のデータ変更申請の承認，及び事後のデータ変更結果の承認を行っていた。", "ウ": "直接修正の作業終了時には，直接修正用の特権IDを無効にしていた。", "エ": "利用部門からのデータ変更依頼票に基づいて，システム部門が直接修正を実施していた。"}, "choices_html": {"ア": "更新ログ上は，アプリケーションソフトウェアの機能を経由したデータ更新として記録していた。", "イ": "事前のデータ変更申請の承認，及び事後のデータ変更結果の承認を行っていた。", "ウ": "直接修正の作業終了時には，直接修正用の特権IDを無効にしていた。", "エ": "利用部門からのデータ変更依頼票に基づいて，システム部門が直接修正を実施していた。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_aki/am2_25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>特権ID</strong>とは、システム上のあらゆる作業を可能にする、最高レベルの操作権限を有するアカウントです。主にシステム管理者等がシステムの管理や設定変更を行うために使用されます。特権IDは、システムに対するあらゆる行為が許されるので、不正アクセスや内部不正を防止する観点から厳格に運用管理する必要があります。<ul><li class=\"lia\">正しい。操作ログの改ざんに当たり、特権IDの乱用として指摘事項に該当します。ログに事実とは異なる情報が残ることになり、また、誰がいつ操作したかが不明になってしまうため、完全性、真正性、責任追跡性、否認防止性を損なう行為と言えます。</li><li class=\"lii\">特権IDが乱用されないように、承認プロセスを整備しているので適切な運用管理と言えます。</li><li class=\"liu\">作業ごとに特権IDのアクセス権を払出し、使用後に無効化すれば、特権IDが乱用・誤用されるリスクを低減できるので適切な運用管理と言えます。</li><li class=\"lie\">特権IDを使って勝手に変更しているのであれば問題となりますが、他部門からの申請に基づく変更であり、組織の正当な変更プロセスに基づいて変更しているものなので問題ありません。</li></ul></div>", "past_history": ["安全確保支援士 H30春期 問25"], "hist_count": 2}, {"id": "sc_05_haru_q1", "session": "支援士 R5春", "gap": 4, "num": 1, "topic": "CRYPTREC暗号リスト", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "デジタル庁，総務省及び経済産業省が策定した\"電子政府における調達のために参照すべき暗号のリスト(CRYPTREC暗号リスト)\"に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">デジタル庁，総務省及び経済産業省が策定した\"電子政府における調達のために参照すべき暗号のリスト(CRYPTREC暗号リスト)\"に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "CRYPTREC暗号リストにある運用監視暗号リストとは，運用監視システムにおける利用実績が十分であると判断され，電子政府において利用を推奨する暗号技術のリストである。", "イ": "CRYPTREC暗号リストにある証明書失効リストとは，政府共用認証局が公開している，危殆化した暗号技術のリストである。", "ウ": "CRYPTREC暗号リストにある推奨候補暗号リストとは，安全性及び実装性能が確認され，今後，電子政府推奨暗号リストに掲載される可能性がある暗号技術のリストである。", "エ": "CRYPTREC暗号リストにある電子政府推奨暗号リストとは，互換性維持目的に限った継続利用を推奨する暗号技術のリストである。"}, "choices_html": {"ア": "CRYPTREC暗号リストにある運用監視暗号リストとは，運用監視システムにおける利用実績が十分であると判断され，電子政府において利用を推奨する暗号技術のリストである。", "イ": "CRYPTREC暗号リストにある証明書失効リストとは，政府共用認証局が公開している，危殆化した暗号技術のリストである。", "ウ": "CRYPTREC暗号リストにある推奨候補暗号リストとは，安全性及び実装性能が確認され，今後，電子政府推奨暗号リストに掲載される可能性がある暗号技術のリストである。", "エ": "CRYPTREC暗号リストにある電子政府推奨暗号リストとは，互換性維持目的に限った継続利用を推奨する暗号技術のリストである。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CRYPTREC暗号リスト</strong>とは、暗号技術検討会及び関連委員会(CRYPTREC)が、電子政府での利用を前提として、安全性と実装性能を確認した暗号方式を一覧化したものです。<br/><br/>情報セキュリティ政策会議が定めた「政府機関の情報セキュリティ対策のための統一基準」では、政府機関の情報システムで使用する暗号や電子署名のアルゴリズムとして、可能な限りCRYPTREC暗号リストに掲載されたアルゴリズムを採用する運用ルールを設ける必要があることが明記されています。民間企業においても採用する暗号アルゴリズムの選定に活用することができます。<br/><br/>CRYPTREC暗号リストは、電子政府推奨暗号リスト、推奨候補暗号リスト及び運用監視暗号リストの3つで構成されます。<dl><dt>電子政府推奨暗号リスト</dt><dd>CRYPTRECにより安全性及び実装性能が確認された暗号技術について、市場における利用実績が十分であるか今後の普及が見込まれると判断され、当該技術の利用を推奨するもののリスト</dd><dt>推奨候補暗号リスト</dt><dd>CRYPTRECにより安全性及び実装性能が確認され、今後、電子政府推奨暗号リストに掲載される可能性のある暗号技術のリスト</dd><dt>運用監視暗号リスト</dt><dd>実際に解読されるリスクが高まるなど、推奨すべき状態ではなくなった暗号技術のうち、互換性維持のために継続利用を容認するもののリスト。互換性維持以外の目的での利用は推奨しない</dd></dl><ul><li class=\"lia\">運用監視暗号リストは、危殆化により非推奨となった暗号方式の一覧です。</li><li class=\"lii\">CRYPTREC暗号リストには、証明書失効リストというカテゴリは存在しません。</li><li class=\"liu\">正しい。推奨候補暗号リストは、今後、電子政府推奨暗号リストに掲載される可能性のある暗号方式の一覧です。</li><li class=\"lie\">電子政府推奨暗号リストは、現在において利用が推奨されている暗号方式の一覧です。</li></ul></div>", "past_history": ["安全確保支援士 R7秋期 問1", "安全確保支援士 H31春期 問9"], "hist_count": 3}, {"id": "sc_05_haru_q2", "session": "支援士 R5春", "gap": 4, "num": 2, "topic": "Pass the Hash攻撃はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "Pass the Hash攻撃はどれか。", "mondai_html": "<div id=\"mondai\">Pass the Hash攻撃はどれか。</div>", "choices": {"ア": "パスワードのハッシュ値から導出された平文パスワードを使ってログインする。", "イ": "パスワードのハッシュ値だけでログインできる仕組みを悪用してログインする。", "ウ": "パスワードを固定し，利用者IDの文字列のハッシュ化を繰り返しながら様々な利用者IDを試してログインする。", "エ": "ハッシュ化されずに保存されている平文パスワードを使ってログインする。"}, "choices_html": {"ア": "パスワードのハッシュ値から導出された平文パスワードを使ってログインする。", "イ": "パスワードのハッシュ値だけでログインできる仕組みを悪用してログインする。", "ウ": "パスワードを固定し，利用者IDの文字列のハッシュ化を繰り返しながら様々な利用者IDを試してログインする。", "エ": "ハッシュ化されずに保存されている平文パスワードを使ってログインする。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>Pass the Hash攻撃</strong>は、端末上に残されているハッシュ化された認証情報をマルウェア等を使って窃取し、その認証情報をそのままサーバやサービスに提示して不正に認証を迂回する攻撃手法です。<br/><br/>かつてのWindowsのNTLM(New Technology LAN Manager)認証などでは、ハッシュ値をそのまま認証情報として使う仕組みがあり、端末内の資格情報キャッシュやメモリにハッシュ値が残っている場合、それが読み取られてこの攻撃を受けます。<br/><br/>したがって「イ」の記述が適切です。<ul><li class=\"lia\">辞書攻撃・総当たり・レインボーテーブル等のパスワードクラックです。</li><li class=\"lii\">正しい。Pass the Hash攻撃の説明です。</li><li class=\"liu\">パスワードスプレー攻撃に類似のパスワードクラックです。</li><li class=\"lie\">平文保存という脆弱性を突く攻撃であり、Pass the Hash攻撃ではありません。</li></ul></div>", "past_history": ["安全確保支援士 R3秋期 問2", "安全確保支援士 R7秋期 問2"], "hist_count": 3}, {"id": "sc_05_haru_q3", "session": "支援士 R5春", "gap": 4, "num": 3, "topic": "SAML認証の流れはどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "シングルサインオンの実装方式の一つであるSAML認証の流れとして，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">シングルサインオンの実装方式の一つであるSAML認証の流れとして，適切なものはどれか。</div>", "choices": {"ア": "IdP(Identity Provider)が利用者認証を行い，認証成功後に発行されるアサーションをSP(Service Provider)が検証し、問題がなければクライアントがSPにアクセスする。", "イ": "Webサーバに導入されたエージェントが認証サーバと連携して利用者認証を行い，クライアントは認証成功後に利用者に発行されるcookieを使用してSPにアクセスする。", "ウ": "認証サーバはKerberosプロトコルを使って利用者認証を行い，クライアントは認証成功後に発行されるチケットを使用してSPにアクセスする。", "エ": "リバースプロキシで利用者認証が行われ，クライアントは認証成功後にリバースプロキシ経由でSPにアクセスする。"}, "choices_html": {"ア": "IdP(Identity Provider)が利用者認証を行い，認証成功後に発行されるアサーションをSP(Service Provider)が検証し、問題がなければクライアントがSPにアクセスする。", "イ": "Webサーバに導入されたエージェントが認証サーバと連携して利用者認証を行い，クライアントは認証成功後に利用者に発行されるcookieを使用してSPにアクセスする。", "ウ": "認証サーバはKerberosプロトコルを使って利用者認証を行い，クライアントは認証成功後に発行されるチケットを使用してSPにアクセスする。", "エ": "リバースプロキシで利用者認証が行われ，クライアントは認証成功後にリバースプロキシ経由でSPにアクセスする。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SAML</strong>(Security Assertion Markup Language：サムエル)は、XMLベースのメッセージのやり取りによって、複数のシステムやサービスの間で認証情報、属性情報、権限の認可情報を交換するための仕様です。<br/><br/>標準化団体OASISによって策定されていて、2025年現在の最新バージョンは2005年にリリースのSAML2.0です。主に複数のドメインにまたがったセキュアなシングルサインオンを実現するための仕組みとして使用されています。<br/><br/>SAMLでは様々な方法によるシングルサインオンが規定されていますが、その一つの基本的な手順は以下のとおりです。<ol><li>利用者がSP(Service Provider)にアクセスする</li><li>SPはIdP(Identity Provider)にSAML認証要求を送り、既に認証を受けているかどうかを問い合わせる</li><li>IdPは認証済の利用者であるかどうかをSPに応答する（SAMLアサーション）</li><li>利用者が認証済であればSPにログインできる</li></ol><div class=\"img_margin\"><img alt=\"03.png/image-size:501×269\" height=\"269\" src=\"https://www.sc-siken.com/kakomon/05_haru/img/03.png\" style=\"max-width: 100%; height: auto;\" width=\"501\"/></div><ul><li class=\"lia\">正しい。SAML方式の説明です。</li><li class=\"lii\">クッキー方式の説明です。</li><li class=\"liu\">Kerberos方式の説明です。</li><li class=\"lie\">リバースプロキシ方式の説明です。</li></ul></div>", "past_history": ["安全確保支援士 R3秋期 問4", "安全確保支援士 R7春期 問2"], "hist_count": 3}, {"id": "sc_05_haru_q4", "session": "支援士 R5春", "gap": 4, "num": 4, "topic": "衝突発見困難性に関する記述", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "ハッシュ関数の性質の一つである衝突発見困難性に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">ハッシュ関数の性質の一つである衝突発見困難性に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "SHA-256の衝突発見困難性を示す，ハッシュ値が一致する二つの元のメッセージの発見に要する最大の計算量は，256の2乗である。", "イ": "SHA-256の衝突発見困難性を示す，ハッシュ値の元のメッセージの発見に要する最大の計算量は，2の256乗である。", "ウ": "衝突発見困難性とは，ハッシュ値が与えられたときに，元のメッセージの発見に要する計算量が大きいことによる，発見の困難性のことである。", "エ": "衝突発見困難性とは，ハッシュ値が一致する二つの元のメッセージの発見に要する計算量が大きいことによる，発見の困難性のことである。"}, "choices_html": {"ア": "SHA-256の衝突発見困難性を示す，ハッシュ値が一致する二つの元のメッセージの発見に要する最大の計算量は，256の2乗である。", "イ": "SHA-256の衝突発見困難性を示す，ハッシュ値の元のメッセージの発見に要する最大の計算量は，2の256乗である。", "ウ": "衝突発見困難性とは，ハッシュ値が与えられたときに，元のメッセージの発見に要する計算量が大きいことによる，発見の困難性のことである。", "エ": "衝突発見困難性とは，ハッシュ値が一致する二つの元のメッセージの発見に要する計算量が大きいことによる，発見の困難性のことである。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_4.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ハッシュ関数</strong>には解読攻撃への耐性を得るための次の特性が必須です。<dl><dt>衝突発見困難性（強衝突耐性）</dt><dd>ハッシュ値が一致する、すなわち、hash(M1)＝hash(M2)となるようなメッセージM1とM2を探索することが困難であること</dd><dt>第二原像計算困難性（弱衝突耐性）</dt><dd>既知のメッセージM1に対するハッシュ値が与えられた時に、ハッシュ値が一致する、すなわち、hash(M1)＝hash(M2)となるようなメッセージM2を探索することが困難であること</dd><dt>原像計算困難性</dt><dd>ハッシュ値から元の入力値を探すことが困難であること、すなわち、hash(M)から元のメッセージMを探索することが困難であること</dd></dl><ul><li class=\"lia\">SHA-256は256ビットのハッシュ値を出力します。衝突が発生する確率は1／2<sup>256</sup>なので、誕生日のパラドックス<sup>※</sup>により平均して2<sup>128</sup>回の試行で同じハッシュ値を出力する異なる入力を発見できることになります。</li><li class=\"lii\">nビットのハッシュ関数に対する原像攻撃では、攻撃が成功するまでの試行回数は2<sup>n</sup>に比例します。ただし、同じハッシュ値を出力する入力値は1つ以上あるので2<sup>256</sup>回の試行で必ず元のメッセージを探索できるわけではありません。</li><li class=\"liu\">原像計算困難性の説明です。</li><li class=\"lie\">正しい。衝突発見困難性の説明です。</li></ul></div>", "past_history": ["安全確保支援士 R3春期 問3", "情報セキュリティ H26秋期 問2", "情報セキュリティ H28春期 問5", "安全確保支援士 H29秋期 問4", "安全確保支援士 H31春期 問4"], "hist_count": 6}, {"id": "sc_05_haru_q5", "session": "支援士 R5春", "gap": 4, "num": 5, "topic": "カミンスキー攻撃への対策はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "DNSに対するカミンスキー攻撃(Kaminsky's attack)への対策はどれか。", "mondai_html": "<div id=\"mondai\">DNSに対するカミンスキー攻撃(Kaminsky's attack)への対策はどれか。</div>", "choices": {"ア": "DNSキャッシュサーバと権威DNSサーバとの計2台の冗長構成とすることによって，過負荷によるサーバダウンのリスクを大幅に低減させる。", "イ": "SPF(Sender Policy Framework)を用いてDNSリソースレコードを認証することによって，電子メールの送信元ドメインが詐称されていないかどうかを確認する。", "ウ": "問合せ時の送信元ポート番号をランダム化することによって，DNSキャッシュサーバに偽の情報がキャッシュされる確率を大幅に低減させる。", "エ": "プレースホルダを用いたエスケープ処理を行うことによって，不正なSQL構文によるDNSリソースレコードの書換えを防ぐ。"}, "choices_html": {"ア": "DNSキャッシュサーバと権威DNSサーバとの計2台の冗長構成とすることによって，過負荷によるサーバダウンのリスクを大幅に低減させる。", "イ": "SPF(Sender Policy Framework)を用いてDNSリソースレコードを認証することによって，電子メールの送信元ドメインが詐称されていないかどうかを確認する。", "ウ": "問合せ時の送信元ポート番号をランダム化することによって，DNSキャッシュサーバに偽の情報がキャッシュされる確率を大幅に低減させる。", "エ": "プレースホルダを用いたエスケープ処理を行うことによって，不正なSQL構文によるDNSリソースレコードの書換えを防ぐ。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>カミンスキー攻撃</strong>は、キャッシュに存在しないサブドメインへのDNSクエリ発行を利用して、従来より効率良くDNSキャッシュポイズニング攻撃を成功させる方法です。この攻撃手法の存在を発見したセキュリティ研究家のダン・カミンスキー氏にちなんで、カミンスキー攻撃と呼ばれています。<div class=\"img_margin\"><img alt=\"05.png/image-size:355×183\" height=\"183\" src=\"https://www.sc-siken.com/kakomon/05_haru/img/05.png\" style=\"max-width: 100%; height: auto;\" width=\"355\"/></div>DNSキャッシュポイズニングは、キャッシュサーバの再帰問合せに対して、攻撃者が正規の権威サーバよりも前に応答を返し、DNSサーバに偽のキャッシュ情報を登録させることで攻撃が成立します。しかしながら、DNSの仕様により有効期限内のキャッシュが存在する間は再帰問合せは行われないので、攻撃のタイミングはキャッシュの有効期限が切れる数十分から数時間に1回に限られます。すなわち、単にキャッシュの有効期限が切れるのを待っているだけでは、攻撃の機会は実際にはそれほど多くないという現実があります。<br/><br/>そこでカミンスキー攻撃では、攻撃者がキャッシュに存在しないサブドメイン(a.example.com、b.example.com、…)のDNSクエリを発行し、キャッシュサーバに再帰問合せを強制することで、攻撃成立の機会を大幅に増やします。この攻撃手法の発見により、DNSキャッシュポイズニング攻撃が実際に発生する可能性があることが証明されました。<br/><br/>DNSクエリのポートは仕様上UDP/53と規定されていますが、ポート番号が53番に固定されていると攻撃が成立しやすくなります。応答パケットの偽装を難しくするには、ランダムに選択したポート番号を通信に使用する<strong>ソースポートランダマイゼーション</strong>やDNSSECの導入が有効な対策となります。<ul><li class=\"lia\">DoS攻撃への対策です。</li><li class=\"lii\">スパムメールへの対策です。</li><li class=\"liu\">正しい。カミンスキー攻撃への対策です。</li><li class=\"lie\">SQLインジェクションへの対策です。</li></ul></div>", "past_history": ["安全確保支援士 R7春期 問4", "安全確保支援士 H29秋期 問6"], "hist_count": 3}, {"id": "sc_05_haru_q6", "session": "支援士 R5春", "gap": 4, "num": 6, "topic": "デジタル証明書に関する記述", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "デジタル証明書に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">デジタル証明書に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "S/MIMEやTLSで利用するデジタル証明書の規格は，ITU-T X.400で標準化されている。", "イ": "TLSにおいて，デジタル証明書は，通信データの暗号化のための鍵交換や通信相手の認証に利用されている。", "ウ": "認証局が発行するデジタル証明書は，申請者の秘密鍵に対して認証局がデジタル署名したものである。", "エ": "ルート認証局は，下位の認証局の公開鍵にルート認証局の公開鍵でデジタル署名したデジタル証明書を発行する。"}, "choices_html": {"ア": "S/MIMEやTLSで利用するデジタル証明書の規格は，ITU-T X.400で標準化されている。", "イ": "TLSにおいて，デジタル証明書は，通信データの暗号化のための鍵交換や通信相手の認証に利用されている。", "ウ": "認証局が発行するデジタル証明書は，申請者の秘密鍵に対して認証局がデジタル署名したものである。", "エ": "ルート認証局は，下位の認証局の公開鍵にルート認証局の公開鍵でデジタル署名したデジタル証明書を発行する。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_6.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">デジタル証明書は、ITU-T勧告のX.509として標準化されています。ITU-T X.400は電子メール交換について定めたOSI標準の規格ですが、IPベースの電子メール（RFC 5322など）が普及したためほぼ利用されていません。</li><li class=\"lii\">正しい。デジタル証明書はTLSで、①サーバ認証、②クライアント認証（オプション)、③共有秘密鍵（暗号化鍵）の安全な生成、の3つの目的に利用されます。</li><li class=\"liu\">秘密鍵ではありません。デジタル証明書は、申請者の公開鍵に対して認証局のデジタル署名を付与したものです。</li><li class=\"lie\">公開鍵ではありません。デジタル証明書は、証明対象の公開鍵と関連情報をまとめたデータに、認証局がデジタル署名を付して作成されます。デジタル署名の作成に使用するのは秘密鍵ですから、下位認証局のデジタル証明書を発行する際に用いるのはルート認証局自身の秘密鍵です。</li></ul></div>", "past_history": ["安全確保支援士 R7春期 問6", "情報セキュリティ H24春期 問3", "情報セキュリティ H26秋期 問4", "情報セキュリティ H28春期 問8", "安全確保支援士 H29秋期 問10"], "hist_count": 6}, {"id": "sc_05_haru_q7", "session": "支援士 R5春", "gap": 4, "num": 7, "topic": "CTR(Counter)モードに関する記述", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "ブロック暗号の暗号利用モードの一つであるCTR(Counter)モードに関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">ブロック暗号の暗号利用モードの一つであるCTR(Counter)モードに関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "暗号化と復号の処理において，出力は，入力されたブロックと鍵ストリームとの排他的論理和である。", "イ": "暗号化の処理において，平文のデータ長がブロック長の倍数でないときにパディングが必要である。", "ウ": "ビット誤りがある暗号文を復号すると，ビット誤りのあるブロック全体と次のブロックの対応するビットが平文ではビット誤りになる。", "エ": "複数ブロックの暗号化の処理は並列に実行できないが，複数ブロックの復号の処理は並列に実行できる。"}, "choices_html": {"ア": "暗号化と復号の処理において，出力は，入力されたブロックと鍵ストリームとの排他的論理和である。", "イ": "暗号化の処理において，平文のデータ長がブロック長の倍数でないときにパディングが必要である。", "ウ": "ビット誤りがある暗号文を復号すると，ビット誤りのあるブロック全体と次のブロックの対応するビットが平文ではビット誤りになる。", "エ": "複数ブロックの暗号化の処理は並列に実行できないが，複数ブロックの復号の処理は並列に実行できる。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ブロック暗号</strong>は、固定長のビット列ごとにまとめて暗号化する仕組みです。実際に暗号化対象となる平文の長さは異なるため、任意の平文を暗号化するためには、ブロック暗号を繰り返し適用することで暗号化を行っていきます。ブロック暗号を用いてどのように暗号文を得るのかの方法を定めたものが「暗号利用モード」です。実際にプログラム上などで暗号方式を指定する際には、仮にAESであれば「AES-128-CBC」といった形で指定します。最後の「CBC」が暗号利用モードの指定です。<br/><br/>ブロック暗号の暗号利用モードには、この設問で問われているCTRの他にも、ECB、CBC、CFB、OFBなどがあります。<dl><dt>ECB（Electronic CodeBook）</dt><dd>平文ブロックごとに暗号化したものを、そのままを暗号文ブロックとする（解析される危険性があるため非推奨）</dd><dt>CBC（Cipher Block Chaining）</dt><dd>ひとつ前の暗号文ブロックと平文ブロックの排他的論理和をとり、排他的論理和の値に暗号化を行って暗号文ブロックを得る</dd><dt>CFB（Cipher FeedBack）</dt><dd>ひとつ前の暗号文ブロックをさらに暗号化し、それと平文ブロックの排他的論理和を行って暗号文ブロックを得る</dd><dt>OFB（Output FeedBack）</dt><dd>暗号アルゴリズムの出力と平文ブロックの排他的論理和を行って暗号文ブロックを得る</dd><dt>CTR（CounTeR）</dt><dd>1ずつ増加していくカウンターを利用した鍵ストリームと、平文ブロックの排他的論理和をとって暗号文ブロックを得る<div class=\"img_margin\"><img alt=\"07.png/image-size:555×271\" height=\"271\" src=\"https://www.sc-siken.com/kakomon/05_haru/img/07.png\" style=\"max-width: 100%; height: auto;\" width=\"555\"/></div></dd></dl><ul><li class=\"lia\">正しい。CTRモードでは、暗号化のたびに異なる値(ノンスと呼ぶ)とブロックごとに1ずつ増加していくカウンターを基に、疑似乱数生成器などによって鍵ストリームを作成します。そして、この鍵ストリームと平文ブロックとの排他的論理和を取って暗号文ブロックを得ます。</li><li class=\"lii\">CTRモードの平文ブロックは、鍵ストリームとの排他的論理和を取るだけで、ブロック暗号による暗号化自体は行いません。したがって、平文ブロックを暗号化する際にパディングを付加してデータ長を揃える必要はありません。</li><li class=\"liu\">CTRモードの各暗号文ブロックは、他のブロックが関連付けられておらず互いに独立しています。したがって、ビット誤りが発生しているブロックが他のブロックに影響を与えることはありません。復号時にビット誤りのあるブロック全体と次ブロックの対応するビットがエラーになるのは、ひとつ前の暗号文ブロックが暗号化に利用されるCBCモードとCFBモードです。</li><li class=\"lie\">CTRモードでは、各ブロックは独立しているため、暗号化と復号化のどちらも並行して処理することができます。送受信間で共有したカウンターから鍵ストリームを作成し、これと平文ブロックの排他的論理和を取ることで暗号文ブロックを得ます。逆に暗号文ブロックと鍵ストリームの排他的論理和を取ると平文ブロックが得られます。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q8", "session": "支援士 R5春", "gap": 4, "num": 8, "topic": "ISMAP管理基準が基礎としているもの", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "政府情報システムのためのセキュリティ評価制度に用いられる\"ISMAP管理基準\"が基礎としているものはどれか。", "mondai_html": "<div id=\"mondai\">政府情報システムのためのセキュリティ評価制度に用いられる\"ISMAP管理基準\"が基礎としているものはどれか。</div>", "choices": {"ア": "FIPS 140-3(暗号モジュールのセキュリティ要求事項)", "イ": "ISO/IEC 27018:2019(個人識別情報(PII)プロセッサとして作動するパブリッククラウドにおけるPIIの保護のための実施基準)", "ウ": "JIS Q 15001:2017(個人情報保護マネジメントシステム－要求事項)", "エ": "日本セキュリティ監査協会\"クラウド情報セキュリティ管理基準(平成28年度版)\""}, "choices_html": {"ア": "FIPS 140-3(暗号モジュールのセキュリティ要求事項)", "イ": "ISO/IEC 27018:2019(個人識別情報(PII)プロセッサとして作動するパブリッククラウドにおけるPIIの保護のための実施基準)", "ウ": "JIS Q 15001:2017(個人情報保護マネジメントシステム－要求事項)", "エ": "日本セキュリティ監査協会\"クラウド情報セキュリティ管理基準(平成28年度版)\""}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">政府情報システムのためのセキュリティ評価制度（ISMAP：Information System Security Management and Assessment Program）は、政府調達において要求されるセキュリティ水準を確保した<em class=\"r\">クラウドサービス</em>をあらかじめ評価・登録しておく制度です。<br/><br/>国が政府情報システムを整備する際に、クラウドサービスの利用を第一候補とする方針（クラウド・バイ・デフォルト原則）を受け、政府機関等におけるクラウドサービスの導入に当たって、統一的な安全性評価基準のもとで情報セキュリティ対策が十分に行われているサービスを円滑に導入できるように立ち上げられたものです。<br/><br/>この評価制度では、❶クラウドサービス登録申請者に対する要求事項、❷情報セキュリティ管理／運用の基準となる管理基準（ISMAP管理基準と呼ばれます)、❸監査機関登録申請者に対する要求事項などが定められています。登録を目指すクラウドサービス事業者は、❸の登録を受けた監査機関によって、❷の管理基準に基づいた情報セキュリティ対策実施状況の監査を受けます。そして❶の要求事項についての審査を経て、ISMAPクラウドサービスリスト又はISMAP-LIU（ISMAP-Low Impact Use：リスクの小さな業務・情報の処理に用いるSaaS対象）と呼ばれるリストに登録されます。このリストは公開されており政府調達で利用されるだけでなく、民間事業者もこのリストを利用することができます。<ul><li class=\"lia\">FIPS 140-3は、NISTが作成した<em class=\"r\">暗号モジュール</em>のセキュリティ要件に関する米国連邦政府標準規格です。これは、ISO/IEC 19790:2012で規定された\"情報技術－セキュリティ技術－暗号モジュールのセキュリティ要求事項\"のベースとなっています。</li><li class=\"lii\">ISO/IEC 27018:2019は、一般の企業や組織が共有して利用するパブリッククラウド上で、クラウドサービス事業者が管理する<em class=\"r\">個人情報保護</em>に関する国際規格です。</li><li class=\"liu\">JIS Q 15001は、様々な組織が<em class=\"r\">個人情報保護</em>を目的として、個人情報マネジメントシステムの確立・実施・維持・継続的な改善を行うための要求事項を定めた規格です。</li><li class=\"lie\">正しい。ISMAP管理基準は、日本セキュリティ監査協会が策定した\"クラウド情報セキュリティ管理基準(平成28年度版)\"、NISC（現在はNCOに改組）が策定した\"政府機関等の情報セキュリティ対策のための統一規格群(平成30年度版)\"及び\"SP800-53 rev.4\"など、いくつかの規格や基準をベースに策定されています。日本セキュリティ監査協会は、情報セキュリティ監査制度の運営を目的とした経済産業省が創設した特定非営利活動法人です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q9", "session": "支援士 R5春", "gap": 4, "num": 9, "topic": "フレームワークコアを構成する機能", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "NIST\"サイバーセキュリティフレームワーク：重要インフラのサイバーセキュリティを改善するためのフレームワーク1.1版\"における\"フレームワークコア\"を構成する機能はどれか。", "mondai_html": "<div id=\"mondai\">NIST\"サイバーセキュリティフレームワーク：重要インフラのサイバーセキュリティを改善するためのフレームワーク1.1版\"における\"フレームワークコア\"を構成する機能はどれか。</div>", "choices": {"ア": "観察，状況判断，意思決定，行動", "イ": "識別，防御，検知，対応，復旧", "ウ": "準備，検知と分析，封じ込め/根絶/復旧，事件後の対応", "エ": "責任，戦略，パフォーマンス，適合，人間行動"}, "choices_html": {"ア": "観察，状況判断，意思決定，行動", "イ": "識別，防御，検知，対応，復旧", "ウ": "準備，検知と分析，封じ込め/根絶/復旧，事件後の対応", "エ": "責任，戦略，パフォーマンス，適合，人間行動"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">NISTが策定している\"サイバーセキュリティフレームワーク（CSF）\"は、サイバーセキュリティ体制を整えるための代表的なツールです。<strong>CSF</strong>は、①フレームワークコア（コア)、②フレームワークインプリメンテーションティア（ティア)、③フレームワークプロファイル（プロファイル）の３つの要素から構成されており、その内容はそれぞれ次のとおりです。<dl><dt>コア</dt><dd>サイバーセキュリティ体制を構築・維持するために必要とされる5つの機能（<em class=\"r\">識別・防御・検知・対応・復旧</em>）が定義され、5つの機能はさらに細分化したカテゴリに分類されている</dd><dt>ティア</dt><dd>サイバーセキュリティリスクに対する対応状況を4段階で評価する指標で、ティア1→ティア4の順で高評価となる</dd><dt>プロファイル</dt><dd>組織として考慮すべき点を踏まえて、コアで定義した機能・カテゴリについて調整・整理し、組織のサイバーセキュリティ対策の現在とあるべき未来の姿を明らかにする</dd></dl><ul><li class=\"lia\">意思決定と行動のためのフレームワークであるOODA（ウーダ）ループのサイクルです。PDCAと似ていますが、PDCAではフェーズの始まりがPlan（計画）であることから、明確な目標が立てやすい安定した環境下でのフレームワークに適しているのに対して、OODAではフェーズの始まりが抱えている課題の状況を注意深く把握するObserve（観察）であるので、変化の速い環境下でのフレームワークに適しています。</li><li class=\"lii\">正しい。CSFのフレームワークコアを構成する5つの機能です。</li><li class=\"liu\">NISTコンピュータセキュリティインシデント対応ガイド（sp800-61）で示される、インシデント対応プロセスの4つのフェーズです。</li><li class=\"lie\">ITガバナンスのための6つの原則のうちの5つです。ここに\"取得\"を加えた、責任・戦略・取得・パフォーマンス・適合・人間行動の6つが、ITに係る意思決定のための望ましい行動とされています（JIS Q 38500参照）。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q10", "session": "支援士 R5春", "gap": 4, "num": 10, "topic": "フォールスポジティブに該当するもの", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "WAFにおけるフォールスポジティブに該当するものはどれか。", "mondai_html": "<div id=\"mondai\">WAFにおけるフォールスポジティブに該当するものはどれか。</div>", "choices": {"ア": "HTMLの特殊文字\"<\"を検出したときに通信を遮断するようにWAFを設定した場合，\"<\"などの数式を含んだ正当なHTTPリクエストが送信されたとき，WAFが攻撃として検知し，遮断する。", "イ": "HTTPリクエストのうち，RFCなどに仕様が明確に定義されておらず，Webアプリケーションソフトウェアの開発者が独自の仕様で追加したフィールドについてはWAFが検査しないという仕様を悪用して，攻撃の命令を埋め込んだHTTPリクエストが送信されたとき，WAFが遮断しない。", "ウ": "HTTPリクエストのパラメータ中に許可しない文字列を検出したときに通信を遮断するようにWAFを設定した場合，許可しない文字列をパラメータ中に含んだ不正なHTTPリクエストが送信されたとき，WAFが攻撃として検知し，遮断する。", "エ": "悪意のある通信を正常な通信と見せかけ，HTTPリクエストを分割して送信されたとき，WAFが遮断しない。"}, "choices_html": {"ア": "HTMLの特殊文字\"<\"を検出したときに通信を遮断するようにWAFを設定した場合，\"<\"などの数式を含んだ正当なHTTPリクエストが送信されたとき，WAFが攻撃として検知し，遮断する。", "イ": "HTTPリクエストのうち，RFCなどに仕様が明確に定義されておらず，Webアプリケーションソフトウェアの開発者が独自の仕様で追加したフィールドについてはWAFが検査しないという仕様を悪用して，攻撃の命令を埋め込んだHTTPリクエストが送信されたとき，WAFが遮断しない。", "ウ": "HTTPリクエストのパラメータ中に許可しない文字列を検出したときに通信を遮断するようにWAFを設定した場合，許可しない文字列をパラメータ中に含んだ不正なHTTPリクエストが送信されたとき，WAFが攻撃として検知し，遮断する。", "エ": "悪意のある通信を正常な通信と見せかけ，HTTPリクエストを分割して送信されたとき，WAFが遮断しない。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_10.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>フォールスポジティブ</strong>は、対をなす<strong>フォールスネガティブ</strong>とともにマルウェア対策ソフトやIDS・IPSにおける誤検知のパターンを表す言葉です。<dl><dt>フォールスネガティブ（False Negative）</dt><dd>本来は検知すべき悪意のある活動を、誤って害のないものとして分類すること。いわゆる検知漏れ。多くなるほどコンピュータに影響を与え得る攻撃を通過させてしまう可能性が高くなる。</dd><dt>フォールスポジティブ（False Positive）</dt><dd>本来は通過させるべき害のない活動を、誤って悪意のあるものとして分類すること。いわゆる過剰検知。多くなるほど正常な操作の阻害回数や管理者の負担が増える。</dd></dl>2つの発生数にはトレードオフの傾向がありますが、フィルタリングルールの調整によってどちらも最小になるように改善し続けることが求められます。<br/><br/>上記の性質を踏まえると「ア」がフォールスポジティブに該当すると判断できます。<ul><li class=\"lia\">正しい。正当なリクエストを悪意のあるものとして検知してしまった事例なのでフォールスポジティブに該当します。</li><li class=\"lii\">遮断すべき攻撃を通過させてしまったのでフォールスネガティブに該当します。</li><li class=\"liu\">適切な処理であり誤検知ではありません。</li><li class=\"lie\">遮断すべき攻撃を通過させてしまったのでフォールスネガティブに該当します。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q11", "session": "支援士 R5春", "gap": 4, "num": 11, "topic": "タイミング攻撃の対策", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "サイドチャネル攻撃の手法であるタイミング攻撃の対策として，最も適切なものはどれか。", "mondai_html": "<div id=\"mondai\">サイドチャネル攻撃の手法であるタイミング攻撃の対策として，最も適切なものはどれか。</div>", "choices": {"ア": "演算アルゴリズムに処理を追加して，秘密情報の違いによって演算の処理時間に差異が出ないようにする。", "イ": "故障を検出する機構を設けて，検出したら秘密情報を破壊する。", "ウ": "コンデンサを挿入して，電力消費量が時間的に均一になるようにする。", "エ": "保護層を備えて，内部のデータが不正に書き換えられないようにする。"}, "choices_html": {"ア": "演算アルゴリズムに処理を追加して，秘密情報の違いによって演算の処理時間に差異が出ないようにする。", "イ": "故障を検出する機構を設けて，検出したら秘密情報を破壊する。", "ウ": "コンデンサを挿入して，電力消費量が時間的に均一になるようにする。", "エ": "保護層を備えて，内部のデータが不正に書き換えられないようにする。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_11.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>サイドチャネル攻撃</strong>は、対象の動作状況を観察し、漏洩電磁波・電力消費等のサイドチャネル情報から暗号鍵推定等を行う非破壊型解析攻撃の総称です。サイドチャネル(Side Channel)には、非正規の入出力経路という意味があります。<br/><br/>具体的な攻撃方法としては、故障利用攻撃、タイミング攻撃や電力解析攻撃、電磁波解析攻撃などがあります。<br/><br/><strong>タイミング攻撃</strong>は、暗号処理のタイミングが暗号鍵の論理値に依存して変化することに着目し、暗号化や復号に要する時間の差異を統計的に解析して暗号鍵を推定する手法です。暗号アルゴリズムの実装方法に対する攻撃方法なので、次のような対策が有効となります。<ul><li>すべての演算がデータによらず一定時間で終わるようにする</li><li>時間計測を正確に行えないようにする</li><li>ブラインド署名のアルゴリズムの応用</li></ul><ul><li class=\"lia\">正しい。どの処理でも同じ処理時間で終わるように、または同じ演算でも処理時間が異なるように演算アルゴリズムを工夫することで、タイミング攻撃を防ぐことができます。</li><li class=\"lii\">故障利用攻撃(フォルトアタック)への対策です。</li><li class=\"liu\">電力解析攻撃への対策です。</li><li class=\"lie\">破壊を伴う攻撃への対策です。</li></ul></div>", "past_history": ["安全確保支援士 R7春期 問14", "情報セキュリティ H24春期 問8", "情報セキュリティ H25秋期 問6", "情報セキュリティ H28秋期 問10"], "hist_count": 5}, {"id": "sc_05_haru_q12", "session": "支援士 R5春", "gap": 4, "num": 12, "topic": "シグネチャ型IPSの特徴はどれか", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "インラインモードで動作するシグネチャ型IPSの特徴はどれか。", "mondai_html": "<div id=\"mondai\">インラインモードで動作するシグネチャ型IPSの特徴はどれか。</div>", "choices": {"ア": "IPSが監視対象の通信経路を流れる全ての通信パケットを経路外からキャプチャできるように通信経路上のスイッチのミラーポートに接続され，通常時の通信から外れた通信を不正と判断して遮断する。", "イ": "IPSが監視対象の通信経路を流れる全ての通信パケットを経路外からキャプチャできるように通信経路上のスイッチのミラーポートに接続され，定義した異常な通信と合致する通信を不正と判断して遮断する。", "ウ": "IPSが監視対象の通信を通過させるように通信経路上に設置され，通常時の通信から外れた通信を不正と判断して遮断する。", "エ": "IPSが監視対象の通信を通過させるように通信経路上に設置され，定義した異常な通信と合致する通信を不正と判断して遮断する。"}, "choices_html": {"ア": "IPSが監視対象の通信経路を流れる全ての通信パケットを経路外からキャプチャできるように通信経路上のスイッチのミラーポートに接続され，通常時の通信から外れた通信を不正と判断して遮断する。", "イ": "IPSが監視対象の通信経路を流れる全ての通信パケットを経路外からキャプチャできるように通信経路上のスイッチのミラーポートに接続され，定義した異常な通信と合致する通信を不正と判断して遮断する。", "ウ": "IPSが監視対象の通信を通過させるように通信経路上に設置され，通常時の通信から外れた通信を不正と判断して遮断する。", "エ": "IPSが監視対象の通信を通過させるように通信経路上に設置され，定義した異常な通信と合致する通信を不正と判断して遮断する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_12.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">IDSやIPSでは、ヘッダー情報やペイロード部分など全内容の確認・トラフィック状況の監視などで不正侵入かどうかを判断します。その判断方法の違いによってシグネチャ型とアノマリ型に分類されます。<dl><dt>シグネチャ型</dt><dd>不正侵入に現れる特徴的なパターンをあらかじめシグネチャファイルに登録しておき、<em class=\"m\">登録したパターンにマッチした</em>通信を異常と判断する。あらたに発生した登録されていない異常パターンなどが見逃される偽陰性に注意する必要がある</dd><dt>アノマリ型</dt><dd>TCP/IPプロトコルの標準仕様が記載されたRFC等で規定される手順を踏まない通信や、トラフィック量の急激な増加や通常とは異なるアクセスなど、<em class=\"m\">正常な状態から逸脱している</em>通信を異常と判断する。しきい値の設定によっては、誤って異常となる疑陽性が発生するので注意が必要である</dd></dl>またIPSは、設置場所の違いによりプロミスキャスモードとインラインモードに分類されます。<dl><dt>プロミスキャスモード（ステルスモード）</dt><dd>通信経路上にある<em class=\"m\">スイッチのミラーポート</em>にIPSを接続することで、本来の経路上を流れる全てのパケットのコピーを監視する。異常な通信を検知しても遮断することはできないので、基本的にはNIDSと同様に監視が主な役割となる</dd><dt>インラインモード</dt><dd>IPSをそのまま<em class=\"m\">監視対象の通信経路上</em>に設置します。異常を検知した場合はすぐに通信が遮断され、異常パケットの進入を防げるが、プロミスキャスモードに比べ、IPSの処理性能や信頼性がネットワークの性能に与える影響が大きい</dd></dl>インラインモードは、通信経路を遮るように設置して通過するパケットを検査する方式、シグネチャ型は、異常な通信パターンを登録しておき、それに合致したときに処置を行う方式なので「エ」が正しい記述です。<ul><li class=\"lia\">プロミスキャスモードで動作するアノマリ型IPSです。</li><li class=\"lii\">プロミスキャスモードで動作するシグネチャ型IPSです。</li><li class=\"liu\">インラインモードで動作するアノマリ型IPSです。</li><li class=\"lie\">正しい。インラインモードで動作するシグネチャ型IPSです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q13", "session": "支援士 R5春", "gap": 4, "num": 13, "topic": "証拠保全の順番", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "マルウェア感染の調査対象のPCに対して，電源を切る前に全ての証拠保全を行いたい。ARPキャッシュを取得した後に保全すべき情報のうち，最も優先して保全すべきものはどれか。", "mondai_html": "<div id=\"mondai\">マルウェア感染の調査対象のPCに対して，電源を切る前に全ての証拠保全を行いたい。ARPキャッシュを取得した後に保全すべき情報のうち，最も優先して保全すべきものはどれか。</div>", "choices": {"ア": "調査対象のPCで動的に追加されたルーティングテーブル", "イ": "調査対象のPCに増設されたHDDにある個人情報を格納したテキストファイル", "ウ": "調査対象のPCのVPN接続情報を記録しているVPNサーバ内のログ", "エ": "調査対象のPCのシステムログファイル"}, "choices_html": {"ア": "調査対象のPCで動的に追加されたルーティングテーブル", "イ": "調査対象のPCに増設されたHDDにある個人情報を格納したテキストファイル", "ウ": "調査対象のPCのVPN接続情報を記録しているVPNサーバ内のログ", "エ": "調査対象のPCのシステムログファイル"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">デジタルフォレンジックスにおける証拠保全では、コンピュータの電源切断や時間経過に伴って消失する揮発性データを優先して保全する必要があります。すなわち、揮発性の高いものから揮発性の低いものへの順に保全を行うのが原則です。<br/><br/>特定非営利法人デジタルフォレンジック協会「証拠保全ガイドライン第10版」によれば、\"証拠収集における揮発性と順序\"は次のとおりです。<ol><li>レジスタ、キャッシュ【優先度：高↑】</li><li>ルーティングテーブル、ARPキャッシュ、プロセステーブル、カーネル統計、メモリ</li><li>テンポラリファイルシステム</li><li>ディスク</li><li>当該システムと関連する遠隔ロギングと監視データ</li><li>物理設定、ネットワークトポロジ</li><li>アーカイブ用メディア【優先度：低↓】</li></ol>選択肢それぞれの情報を上記に対応付けると、優先順位は次のようになります。<ol><li>ルーティングテーブル</li><li>システムログファイル（ディスク）</li><li>個人情報を格納したテキストファイル（ディスク）</li><li>VPNサーバ内のログ（当該システムと関連する遠隔ロギングと監視データ）</li></ol>最も優先度が高いのは、永続的なファイルではなく一時的な情報である\"ルーティングテーブル\"です。したがって「ア」が正解です。</div>", "past_history": ["安全確保支援士 R7春期 問15"], "hist_count": 2}, {"id": "sc_05_haru_q14", "session": "支援士 R5春", "gap": 4, "num": 14, "topic": "無線LANの情報セキュリティ対策", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "無線LANの暗号化通信を実装するための規格に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">無線LANの暗号化通信を実装するための規格に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "EAPは，クライアントPCとアクセスポイントとの間で，あらかじめ登録した共通鍵による暗号化通信を実装するための規格である。", "イ": "RADIUSは，クライアントPCとアクセスポイントとの間で公開鍵暗号方式による暗号化通信を実装するための規格である。", "ウ": "SSIDは，クライアントPCで利用する秘密鍵であり，公開鍵暗号方式による暗号化通信を実装するための規格で規定されている。", "エ": "WPA3-Enterpriseは，IEEE802.1Xの規格に沿った利用者認証及び動的に配布される暗号化鍵を用いた暗号化通信を実装するための方式である。"}, "choices_html": {"ア": "EAPは，クライアントPCとアクセスポイントとの間で，あらかじめ登録した共通鍵による暗号化通信を実装するための規格である。", "イ": "RADIUSは，クライアントPCとアクセスポイントとの間で公開鍵暗号方式による暗号化通信を実装するための規格である。", "ウ": "SSIDは，クライアントPCで利用する秘密鍵であり，公開鍵暗号方式による暗号化通信を実装するための規格で規定されている。", "エ": "WPA3-Enterpriseは，IEEE802.1Xの規格に沿った利用者認証及び動的に配布される暗号化鍵を用いた暗号化通信を実装するための方式である。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">EAP(Extensible Authentication Protocol)は、PPPの機能を拡張した認証プロトコルです。EAPはデジタル証明書、メッセージダイジェスト、OTPなど様々な認証方式をサポートしていますが、暗号化通信の機能は規定されていません。</li><li class=\"lii\">RADIUS(Remote Authentication Dial In User Service)は、認証および利用ログの記録を単一のサーバに一元化することを目的としたプロトコルで、暗号化通信の機能はありません。</li><li class=\"liu\">SSID(Service Set Identifier)は、無線LANの規格であるIEEE802.11シリーズにおいて「混信」を避けるためにアクセスポイントと端末に設定するネットワーク識別子です。</li><li class=\"lie\">正しい。WPA3にはパーソナルモードとエンタープライズモードが規定されており、<strong>WPA3-Enterprise</strong>は、認証にIEEE802.1Xを用いる方式です。IEEE802.1Xでは、クライアント－アクセスポイント－認証サーバの3者間で認証情報がやり取りされます。認証に成功すると、認証サーバはPMK(Pairwise Master Key)と呼ばれる暗号化鍵の種を動的に生成し、アクセスポイントと認証された端末に配布します。暗号化鍵は、このPMKから生成されるのでセッションごとに異なる仕組みになっています。<br/>ちなみに<strong>WPA3-personal</strong>は、個人や小規模企業などの認証サーバを用意できないネットワーク向けの方式で、端末に設定された事前共有鍵(PSK)を用いて認証を行います。</li></ul></div>", "past_history": ["安全確保支援士 R3秋期 問15", "情報セキュリティ H22秋期 問14", "情報セキュリティ H26春期 問13", "安全確保支援士 H29秋期 問17", "安全確保支援士 H31春期 問13", "情報セキュリティ H18春期 問49", "情報セキュリティ H20春期 問48"], "hist_count": 8}, {"id": "sc_05_haru_q15", "session": "支援士 R5春", "gap": 4, "num": 15, "topic": "DKIMの説明はどれか", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "DKIM(DomainKeys Identified Mail)の説明はどれか。", "mondai_html": "<div id=\"mondai\">DKIM(DomainKeys Identified Mail)の説明はどれか。</div>", "choices": {"ア": "送信側メールサーバにおいてデジタル署名を電子メールのヘッダーに付加し，受信側メールサーバにおいてそのデジタル署名を公開鍵によって検証する仕組み", "イ": "送信側メールサーバにおいて利用者が認証された場合，電子メールの送信が許可される仕組み", "ウ": "電子メールのヘッダーや配送経路の情報から得られる送信元情報を用いて，電子メール送信元のIPアドレスを検証する仕組み", "エ": "ネットワーク機器において，内部ネットワークから外部のメールサーバのTCPポート番号25への直接の通信を禁止する仕組み"}, "choices_html": {"ア": "送信側メールサーバにおいてデジタル署名を電子メールのヘッダーに付加し，受信側メールサーバにおいてそのデジタル署名を公開鍵によって検証する仕組み", "イ": "送信側メールサーバにおいて利用者が認証された場合，電子メールの送信が許可される仕組み", "ウ": "電子メールのヘッダーや配送経路の情報から得られる送信元情報を用いて，電子メール送信元のIPアドレスを検証する仕組み", "エ": "ネットワーク機器において，内部ネットワークから外部のメールサーバのTCPポート番号25への直接の通信を禁止する仕組み"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>DKIM</strong>(DomainKeys Identified Mail)は、送信する電子メールのヘッダーと本文から生成されたデジタル署名を送信側メールサーバで付加し、受信者が、送信側ドメインのDNSサーバに登録されている公開鍵を使用してデジタル署名の検証を行うことで、正当なメールサーバから送られてきたメールであることを確認する仕組みです。スパムメール対策の技術のひとつとして利用されています。<div class=\"img_margin\"><img alt=\"15.png/image-size:577×280\" height=\"280\" src=\"https://www.sc-siken.com/kakomon/05_haru/img/15.png\" style=\"max-width: 100%; height: auto;\" width=\"577\"/></div>したがって「ア」が正解です。<ul><li class=\"lia\">正しい。DKIMの説明です。</li><li class=\"lii\">SMTP-AUTHの説明です。</li><li class=\"liu\">SPF(Sender Policy Framework)の説明です。</li><li class=\"lie\">OP25B(Outbound Port 25 Blocking)の説明です。</li></ul></div>", "past_history": ["安全確保支援士 R1秋期 問12", "情報セキュリティ H22春期 問14", "情報セキュリティ H23秋期 問14", "情報セキュリティ H25春期 問16", "情報セキュリティ H26秋期 問15", "安全確保支援士 H30春期 問12"], "hist_count": 7}, {"id": "sc_05_haru_q16", "session": "支援士 R5春", "gap": 4, "num": 16, "topic": "OP25Bを導入する目的はどれか", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "インターネットサービスプロバイダ(ISP)が，OP25Bを導入する目的の一つはどれか。", "mondai_html": "<div id=\"mondai\">インターネットサービスプロバイダ(ISP)が，OP25Bを導入する目的の一つはどれか。</div>", "choices": {"ア": "ISP管理外のネットワークに対するISP管理下のネットワークからのICMPパケットによるDDoS攻撃を遮断する。", "イ": "ISP管理外のネットワークに向けてISP管理下のネットワークから送信されるスパムメールを制限する。", "ウ": "ISP管理下のネットワークに対するISP管理外のネットワークからのICMPパケットによるDDoS攻撃を遮断する。", "エ": "ISP管理下のネットワークに向けてISP管理外のネットワークから送信されるスパムメールを制限する。"}, "choices_html": {"ア": "ISP管理外のネットワークに対するISP管理下のネットワークからのICMPパケットによるDDoS攻撃を遮断する。", "イ": "ISP管理外のネットワークに向けてISP管理下のネットワークから送信されるスパムメールを制限する。", "ウ": "ISP管理下のネットワークに対するISP管理外のネットワークからのICMPパケットによるDDoS攻撃を遮断する。", "エ": "ISP管理下のネットワークに向けてISP管理外のネットワークから送信されるスパムメールを制限する。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>OP25B</strong>(Outbound Port 25 Blocking)は、外部のメールサーバと直接TCPコネクションを確立することで送信されるスパムメールをISP側で防ぐための対策です。<br/><br/>正規のメールは、契約するISPのメールサーバを経由して送信されるため、SMTPの接続先としてISPのメールサーバがセットされています。しかし、スパムメールの送信を続ければ、いずれはISPのブラックリストに登録されてしまいますから、スパムメールの送信には外部の脆弱性のあるメールサーバと直接接続してメールを送信する手段が使われます。このようなスパムメールの送信を防止するための対策がOP25Bであり、その名のとおり、<ul><li><em class=\"r\">ISP管理下</em>の動的IPアドレスから</li><li>ISPのメールサーバを経由せずに<em class=\"r\">外向き</em>(インターネット方向)に発信される</li><li><em class=\"r\">SMTP</em>通信(ポート<em class=\"r\">25</em>番)</li></ul>という3つのすべてに合致する通信をISP側で遮断する仕組みです。<br/><br/>したがって適切な記述は「イ」です。<ul><li class=\"lia\">遮断するのはSMTP通信です。</li><li class=\"lii\">正しい。</li><li class=\"liu\">遮断するのは外向き(Outbound)のSMTP通信のみです。</li><li class=\"lie\">遮断するのは外向き(Outbound)のSMTP通信のみです。</li></ul></div>", "past_history": ["安全確保支援士 R3春期 問14", "安全確保支援士 R7春期 問17", "安全確保支援士 H29春期 問15", "安全確保支援士 H31春期 問14"], "hist_count": 5}, {"id": "sc_05_haru_q17", "session": "支援士 R5春", "gap": 4, "num": 17, "topic": "SQLインジェクション対策", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "SQLインジェクション対策について，Webアプリケーションプログラムの実装における対策と，Webアプリケーションプログラムの実装以外の対策の組みとして，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">SQLインジェクション対策について，Webアプリケーションプログラムの実装における対策と，Webアプリケーションプログラムの実装以外の対策の組みとして，適切なものはどれか。</div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表\" src=\"https://www.sc-siken.com/kakomon/05_haru/img/17.png\" style=\"max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>プレースホルダ</strong>は、SQL文の中でユーザーの入力値を使用する部分に置かれる記号のことです。その記号の部分には、実行時にSQL文の特殊文字がエスケープされた値が割り当てられるので、不正なSQL文が実行されるのを防ぐことができます。このようにSQL文のひな型を用意しておき、実行時に値を割り当てることで、SQLインジェクションを防止する仕組みを<strong>バインド機構</strong>と言います。<br/><div class=\"pre\"><em class=\"g\">//PHPにおけるプレースホルダの一例</em><br/>$uid = $_POST[\"userid\"];<br/>$sql = 'SELECT * FROM USER WHERE uid = ?' <em class=\"g\">//?がプレースホルダ</em><br/>$pdo = new PDO($dbh, $user, $password);<br/>$stmt = $pdo-&gt;prepare($sql);<br/>$stmt-&gt;execute([$uid]); <em class=\"g\">//?に値を割り当てて実行</em></div>また、データベースを扱うWebアプリケーションに必要以上の権限が与えられていると、不正なSQL文が実行されるリスクが増すので、最小権限をもつアカウントで処理させることも重要な対策となります。<ul><li class=\"lia\">OSコマンドインジェクション対策です。</li><li class=\"lii\">セッションハイジャック対策です。</li><li class=\"liu\">ディレクトリトラバーサル対策です。</li><li class=\"lie\">正しい。SQLインジェクション対策です。</li></ul></div>", "past_history": ["安全確保支援士 R1秋期 問17", "情報セキュリティ H21秋期 問14", "情報セキュリティ H24春期 問16", "情報セキュリティ H25秋期 問15", "情報セキュリティ H27春期 問17", "情報セキュリティ H28秋期 問17", "安全確保支援士 H30春期 問17"], "hist_count": 8}, {"id": "sc_05_haru_q18", "session": "支援士 R5春", "gap": 4, "num": 18, "topic": "回線に関する計算", "subcat": "ネットワーク方式", "category": "情報セキュリティ", "mondai": "1台のサーバと複数台のクライアントが，1Gビット／秒のLANで接続されている。業務のピーク時には，クライアント1台につき1分当たり6Mバイトのデータをサーバからダウンロードする。このとき，同時使用してもピーク時に業務を滞りなく遂行できるクライアント数は何台までか。ここで，LANの伝送効率は50%，サーバ及びクライアント内の処理時間は無視できるものとし，1Gビット／秒＝109ビット／秒，1Mバイト＝106バイトとする。", "mondai_html": "<div id=\"mondai\">1台のサーバと複数台のクライアントが，1Gビット／秒のLANで接続されている。業務のピーク時には，クライアント1台につき1分当たり6Mバイトのデータをサーバからダウンロードする。このとき，同時使用してもピーク時に業務を滞りなく遂行できるクライアント数は何台までか。ここで，LANの伝送効率は50%，サーバ及びクライアント内の処理時間は無視できるものとし，1Gビット／秒＝10<sup>9</sup>ビット／秒，1Mバイト＝10<sup>6</sup>バイトとする。</div>", "choices": {"ア": "10", "イ": "625", "ウ": "1,250", "エ": "5,000"}, "choices_html": {"ア": "10", "イ": "625", "ウ": "1,250", "エ": "5,000"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">LANの伝送効率が50%なので、サーバとクライアントが接続されているLANの最大伝送量は、<br/><br/>　1Gビット／秒×0.5＝500Mビット／秒<br/><br/>これを伝送するデータの単位に合わせて、ビット単位からバイト単位に変換にします（逆に伝送するデータの単位をビットに合わせても問題ありません）。<br/><br/>　500Mビット／秒÷8＝62.5Mバイト<br/><br/>一方、クライアント1台がサーバからダウンロードするデータ量は6Mバイト／分なので、これを毎秒単位に直します。<br/><br/>　6Mバイト÷60秒＝0.1Mバイト／秒<br/><br/>LANの伝送可能量をクライアント1台あたりのネットワーク負荷で割ると、問題なく同時使用できるクライアント数を求めることができます。<br/><br/>　62.5Mバイト／0.1Mバイト＝<em class=\"r\">625</em>台<br/><br/>したがって「イ」が正解です。</div>", "past_history": ["情報セキュリティ H22秋期 問17", "安全確保支援士 H29秋期 問19", "情報セキュリティ H20春期 問20"], "hist_count": 4}, {"id": "sc_05_haru_q19", "session": "支援士 R5春", "gap": 4, "num": 19, "topic": "スパニングツリープロトコル", "subcat": "データ通信と制御", "category": "情報セキュリティ", "mondai": "スパニングツリープロトコルが適用されている複数のブリッジから成るネットワークにおいて，任意の一つのリンクの両端のブリッジのうち，ルートブリッジまでの経路コストが小さいブリッジの側にあるポートを何と呼ぶか。", "mondai_html": "<div id=\"mondai\">スパニングツリープロトコルが適用されている複数のブリッジから成るネットワークにおいて，任意の一つのリンクの両端のブリッジのうち，ルートブリッジまでの経路コストが小さいブリッジの側にあるポートを何と呼ぶか。</div>", "choices": {"ア": "クセスポート(Access Port)", "イ": "代表ポート(Designated Port)", "ウ": "トランクポート(Trunk Port)", "エ": "ルートポート(Root Port)"}, "choices_html": {"ア": "クセスポート(Access Port)", "イ": "代表ポート(Designated Port)", "ウ": "トランクポート(Trunk Port)", "エ": "ルートポート(Root Port)"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>スパニングツリープロトコル</strong>(STP)は、ループ状になっているネットワークをルートブリッジを根とした論理的なツリー構造のトポロジーとして扱うためのプロトコルで、IEEE802.1Dとして標準化されています。<br/><br/>ネットワークを構成する場合、トラブル発生時に機能停止を引き起こさないようスイッチやブリッジなどの中継器を用いて迂回路を設け冗長性を持たせることが必要です。しかし、迂回路を設けたことでループとなる通信経路が発生すると、ブロードキャストストーム（ループ内の中継機器間でブロードキャストフレームが増幅されループ内を周回し続ける）などの問題が発生し、ネットワーク障害を起こすことになります。こうした問題を回避するために、ループ状構造が含まれているネットワーク構造を、ルートブリッジ（スイッチ、以下同じ）を根とした論理的なツリー構造として扱えるようにしたのがスパニングツリープロトコルです。<br/><br/>スパニングツリーを形成するために決定されるのが、ツリー構造の根となるルートブリッジ、枝を形成するためのルートポート、代表ポートです。<dl><dt>ルートポート（Root Port）</dt><dd>ルートブリッジ以外のブリッジにおいて、ルートブリッジまでの経路コストが最小となるポートのこと。経路コストは使用している経路の帯域幅によって求められ、帯域幅が大きいほどコストは小さくなる</dd><dt>代表ポート（Designated Port）</dt><dd>ブリッジや機器を接続する各リンクにおいて、ルートブリッジまでの経路コストが最小となるポートのこと</dd></dl>スパニングツリー内のブリッジの中で、ルートポートでも代表ポートでもないポートは非代表ポート（Non Designated Port）となり、ツリー構造を乱さないために、平常時にはフレーム転送を行わないブロッキング状態となります。しかし、障害発生時には経路コストを基にスパニングツリーを再構成し、ブロックポートを転送可能とすることで回線ダウンを防ぐ仕組みになっています。<div class=\"img_margin\"><img alt=\"19.png/image-size:434×296\" height=\"296\" src=\"https://www.sc-siken.com/kakomon/05_haru/img/19.png\" style=\"max-width: 100%; height: auto;\" width=\"434\"/></div><ul><li class=\"lia\">アクセスポートは、VLANにおいて1つのVLANにのみ接続するポートです。スパニングツリーには直接関係しません。</li><li class=\"lii\">正しい。代表ポートは、ブリッジや機器を接続するリンクにおいて、経路コストが最小となる側のブリッジのポートが代表ポートとなります。</li><li class=\"liu\">トランクポートは、複数のVLANに割り当てられているポートのことです。各VLANを識別するためのVLANタグを用いてフレーム転送を行います。スパニングツリーには直接関係しません。</li><li class=\"lie\">ルートポートは、ルートブリッジ以外のブリッジのポートのうち、ルートブリッジまでの経路コストが最小であるポートです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q20", "session": "支援士 R5春", "gap": 4, "num": 20, "topic": "2種類のブロードキャストアドレス", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "サブネット192.168.10.0/24において使用できる2種類のブロードキャストアドレス192.168.10.255と255.255.255.255とに関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">サブネット192.168.10.0/24において使用できる2種類のブロードキャストアドレス192.168.10.255と255.255.255.255とに関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "192.168.10.255と255.255.255.255とは，ともにサブネット内のブロードキャストに使用される。", "イ": "192.168.10.255はサブネットの外からのブロードキャストだけに使用され，サブネット内のブロードキャストには使用できない。", "ウ": "255.255.255.255は互換性のために残されており，ブロードキャストには192.168.10.255を使用することが推奨されている。", "エ": "255.255.255.255はサブネットの外へのブロードキャストだけに使用され，サブネット内のブロードキャストには使用できない。"}, "choices_html": {"ア": "192.168.10.255と255.255.255.255とは，ともにサブネット内のブロードキャストに使用される。", "イ": "192.168.10.255はサブネットの外からのブロードキャストだけに使用され，サブネット内のブロードキャストには使用できない。", "ウ": "255.255.255.255は互換性のために残されており，ブロードキャストには192.168.10.255を使用することが推奨されている。", "エ": "255.255.255.255はサブネットの外へのブロードキャストだけに使用され，サブネット内のブロードキャストには使用できない。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">【解説の要点】<br/>ブロードキャストは、自分が属するネットワークセグメントの外には届きません。もしそんなことを許せば、世界中の端末に同時通報をすることになり、ネットワーク負荷がとんでもないことになるからです。<br/><br/>サブネットを指定したブロードキャスト（192.168.10.255）は自分がどのネットワークセグメントに属しているかがわかっているときに使われます。一方、255.255.255.255 は自ネットワークに対するブロードキャストを表す特別なアドレスで、DHCPサーバへの要求時など自分のIPアドレス情報がわかっていないときに使用します。<br/><br/>したがって「ア」が適切です。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q21", "session": "支援士 R5春", "gap": 4, "num": 21, "topic": "SQLのGRANT文", "subcat": "データ操作", "category": "情報セキュリティ", "mondai": "次のSQL文をA表の所有者が発行したときの、利用者BへのA表に関する権限の付与を説明したものはどれか。GRANT ALL PRIVILEGES ON A TO B WITH GRANT OPTION", "mondai_html": "<div id=\"mondai\">次のSQL文をA表の所有者が発行したときの、利用者BへのA表に関する権限の付与を説明したものはどれか。<br/><div class=\"img_margin\">GRANT ALL PRIVILEGES ON A TO B WITH GRANT OPTION</div></div>", "choices": {"ア": "SELECT権限，UPDATE権限，INSERT権限，DELETE権限などの全ての権限，及びそれらの付与権を付与する。", "イ": "SELECT権限，UPDATE権限，INSERT権限，DELETE権限などの全ての権限を付与するが，それらの付与権は付与しない。", "ウ": "SELECT権限，UPDATE権限，INSERT権限，DELETE権限は付与しないが，それらの付与権だけを付与する。", "エ": "SELECT権限及びSELECT権限の付与権を付与するが，UPDATE権限，INSERT権限，DELETE権限，及びそれらの付与権は付与しない。"}, "choices_html": {"ア": "SELECT権限，UPDATE権限，INSERT権限，DELETE権限などの全ての権限，及びそれらの付与権を付与する。", "イ": "SELECT権限，UPDATE権限，INSERT権限，DELETE権限などの全ての権限を付与するが，それらの付与権は付与しない。", "ウ": "SELECT権限，UPDATE権限，INSERT権限，DELETE権限は付与しないが，それらの付与権だけを付与する。", "エ": "SELECT権限及びSELECT権限の付与権を付与するが，UPDATE権限，INSERT権限，DELETE権限，及びそれらの付与権は付与しない。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>GRANT文</strong>は、指定したユーザーに表などのデータベースオブジェクトに対する権限を付与するSQL文です。<br/><div class=\"pre\">GRANT オブジェクトの権限 ON オブジェクト名<br/>　　TO { ユーザー名 | ロール名 | PUBLIC }<br/>　　[ WITH GRANT OPTION ]</div>\"ALL PRIVILEGES\"は全ての権限を意味し、標準SQLでは、SELECT・DELETE・INSERT・REFERENCES・USAGE・TRIGGER・UNDER・EXECUTEを包含します。また、オプションである\"WITH GRANT OPTION\"を指定した場合、別のユーザーに対して権限を付与する権限も付与することになります。<br/><br/>したがって、設問のGRANT文は「Bに対してA表に対するすべての権限を付与する、別のユーザーに対してA表のすべての権限を付与できるようにする」という意味になります。<ul><li class=\"lia\">正しい。</li><li class=\"lii\">WITH GRANT OPTIONが指定されているので、別のユーザーに権限を付与する権限も与えます。</li><li class=\"liu\">ALL PRIVILEGESが指定されているので、すべての権限を与えます。</li><li class=\"lie\">ALL PRIVILEGESが指定されているので、すべての権限を与えます。また権限の付与権も与えます。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q22", "session": "支援士 R5春", "gap": 4, "num": 22, "topic": "IoT機器のペネトレーションテスト", "subcat": "システム結合・適格性テスト", "category": "情報セキュリティ", "mondai": "IoT機器のペネトレーションテスト(Penetration Test)の説明として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">IoT機器のペネトレーションテスト(Penetration Test)の説明として，適切なものはどれか。</div>", "choices": {"ア": "開発の最終段階に，IoT機器と通信対象となるサーバ及びネットワーク全体の動作が仕様書どおりであることをテストする。", "イ": "回路図，ソースコードなどのシステムの内部構造を参照して，仕様確認のためのテストを行う。", "ウ": "恒温恒湿器を用いて，要求仕様で定められた温湿度条件で動作するかどうか，耐久性はどうかをテストする。", "エ": "ネットワーク，バス，デバッグインタフェースなどの脆弱性を利用して，IoT機器への攻撃と侵入を試みるテストを行う。"}, "choices_html": {"ア": "開発の最終段階に，IoT機器と通信対象となるサーバ及びネットワーク全体の動作が仕様書どおりであることをテストする。", "イ": "回路図，ソースコードなどのシステムの内部構造を参照して，仕様確認のためのテストを行う。", "ウ": "恒温恒湿器を用いて，要求仕様で定められた温湿度条件で動作するかどうか，耐久性はどうかをテストする。", "エ": "ネットワーク，バス，デバッグインタフェースなどの脆弱性を利用して，IoT機器への攻撃と侵入を試みるテストを行う。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ペネトレーションテスト</strong>は、サイバー攻撃による不具合を防ぐためにネットワークに接続されている機器や情報システムに対して、攻撃者目線での検証を行うテストです。侵入テストとも呼ばれます。<br/><br/>近年、家庭の住宅設備や家電、個人が日常的に使うウェアラブル機器などIoT機器が日常生活に深く浸透しており、IoT機器を踏み台としたサイバー攻撃が年々増加しています。情報システム開発だけでなくIoT機器開発においても綿密なセキュリティ対策の検討が必要であり、適切なペネトレーションテストの実施は必須となります。<ul><li class=\"lia\">IoT機器とサーバ及びネットワーク間のインタフェースとなるAPIの動作確認を行うAPIテストの説明です。</li><li class=\"lii\">内部構造をもとにテストを行う構造テストの説明です。</li><li class=\"liu\">温度と湿度を一定に保つ高温高湿器で行う動作確認や耐久性テストの説明です。</li><li class=\"lie\">正しい。ペネトレーションテストの説明です。</li></ul><br/>【参考】<br/>2023年3月にIPAがIoT機器に対する脅威分析・脆弱性への対応などを解説した手引き「<a href=\"https://www.ipa.go.jp/security/iot/ug65p90000019832-att/ssf7ph0000002vih.pdf\" target=\"_blank\">IoT開発におけるセキュリティ設計の手引き</a>」を発表しており、この中でセキュリティ検討の上で参考となるIoT関連のセキュリティガイドが紹介されています。<br/><br/>紹介されているセキュリティガイドの一つに、インターネットに関連した標準や方針を提供している国際的非営利組織ISOC（Internet SOCiety）が公開している、IoTデバイスとそのデータを安全に保つための一連の戦略的原則をまとめたフレームワーク「IoT Security and Privacy Trust Framework」があります。このフレームワークではIoT機器のセキュリティ関連のアップデート、IoT機器と利用するサーバ間での暗号化についての言及などの他、「脆弱性の影響を容認できるレベルに減少させる為に、IoTサポートサイトは定期的なモニタリングと継続的なサイトセキュリティとサーバ設定の改善を行わなければならない。少なくとも年2回はペネトレーションテストの実施を行う」ことを義務としています。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q23", "session": "支援士 R5春", "gap": 4, "num": 23, "topic": "プログラムの著作権管理", "subcat": "知的財産適用管理", "category": "情報セキュリティ", "mondai": "プログラムの著作権管理上，不適切な行為はどれか。", "mondai_html": "<div id=\"mondai\">プログラムの著作権管理上，<u>不適切な行為</u>はどれか。</div>", "choices": {"ア": "公開されているプロトコルに基づいて，他社が販売しているソフトウェアと同等の機能をもつソフトウェアを独自に開発して販売した。", "イ": "使用，複製及び改変する権利を付与するというソースコード使用許諾契約を締結した上で，許諾対象のソフトウェアを改変して製品に組み込み、当該許諾契約の範囲内で製品を販売した。", "ウ": "ソフトウェアハウスと使用許諾契約を締結し，契約上は複製権の許諾は受けていないが，使用許諾を受けたソフトウェアにはプロテクトが掛けられていたので，そのプロテクトを外し，バックアップのために複製した。", "エ": "他人のソフトウェアを正当な手段で入手し，試験又は研究のために逆コンパイルを行った。"}, "choices_html": {"ア": "公開されているプロトコルに基づいて，他社が販売しているソフトウェアと同等の機能をもつソフトウェアを独自に開発して販売した。", "イ": "使用，複製及び改変する権利を付与するというソースコード使用許諾契約を締結した上で，許諾対象のソフトウェアを改変して製品に組み込み、当該許諾契約の範囲内で製品を販売した。", "ウ": "ソフトウェアハウスと使用許諾契約を締結し，契約上は複製権の許諾は受けていないが，使用許諾を受けたソフトウェアにはプロテクトが掛けられていたので，そのプロテクトを外し，バックアップのために複製した。", "エ": "他人のソフトウェアを正当な手段で入手し，試験又は研究のために逆コンパイルを行った。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">結果として実現された機能が同じであっても、その創作方法に独自性があれば別個の著作物として認められます。自らの著作物を自ら販売しているだけなので、著作権の侵害には当たりません。なお、公開されているプロトコルも著作権の保護対象ではありません。</li><li class=\"lii\">使用、複製及び改変する権利を付与した使用許諾契約を締結した上で、かつ許諾契約の範囲内での販売であるので著作権の侵害には当たりません。</li><li class=\"liu\">正しい。著作物に技術的利用制限手段が施されている場合、それを回避する行為は、著作権を侵害する行為とみなされます。技術的利用制限手段に係る研究または技術の開発の目的上正当な範囲内で行われる場合などは侵害には当たりませんが、バックアップのための複製は正当な事由に該当しないので、著作権を侵害する行為となります。</li><li class=\"lie\">逆コンパイルやリバースエンジニアリングは、プログラムの調査解析を目的とする利用であり、プログラムの実行等によってその機能を享受する目的ではないため、著作権侵害には当たりません。近時の著作権法の改正により、①技術の実用化試験、②情報解析、③AI開発等の情報処理の過程における利用、などのように、著作物に表現された思想や感情の享受を目的にしない場合には、必要と認められる限度において、著作物を許諾なく利用することができるようになっています。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q24", "session": "支援士 R5春", "gap": 4, "num": 24, "topic": "問題管理において実施する活動", "subcat": "サービスマネジメントプロセス", "category": "情報セキュリティ", "mondai": "サービスマネジメントにおける問題管理において実施する活動はどれか。", "mondai_html": "<div id=\"mondai\">サービスマネジメントにおける問題管理において実施する活動はどれか。</div>", "choices": {"ア": "インシデントの発生後に暫定的にサービスを復旧させ，業務を継続できるようにする。", "イ": "ンシデントの発生後に未知の根本原因を特定し，恒久的な解決策を策定する。", "ウ": "インシデントの発生に備えて，復旧のための設計をする。", "エ": "インシデントの発生を記録し，関係する部署に状況を連絡する。"}, "choices_html": {"ア": "インシデントの発生後に暫定的にサービスを復旧させ，業務を継続できるようにする。", "イ": "ンシデントの発生後に未知の根本原因を特定し，恒久的な解決策を策定する。", "ウ": "インシデントの発生に備えて，復旧のための設計をする。", "エ": "インシデントの発生を記録し，関係する部署に状況を連絡する。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>問題管理</strong>は、インシデントや障害の根本原因を突き止め、再発防止のための恒久的な解決策を提示することを目的とするプロセスです。問題管理の主な活動は以下の通りです。<ul><li>インシデントの根本原因と潜在的な予防処置を特定する</li><li>サービスへの影響を低減または除去するための処置を特定する</li><li>問題の恒久的解決のための変更要求を提起する</li><li>既知の誤りを記録し、ワークアラウンド(回避策)を提供する</li></ul>したがって、根本原因の究明とその解決策の提示を行っている「イ」が正解です。<ul><li class=\"lia\">インシデント管理の役割です。</li><li class=\"lii\">正しい。問題管理の役割です。</li><li class=\"liu\">ITサービス継続性管理の役割です。</li><li class=\"lie\">サービスデスクの役割です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_05_haru_q25", "session": "支援士 R5春", "gap": 4, "num": 25, "topic": "リスクに基づく監査計画の策定", "subcat": "システム監査", "category": "情報セキュリティ", "mondai": "システム監査基準(平成30年)に基づくシステム監査において，リスクに基づく監査計画の策定(リスクアプローチ)で考慮すべき事項として、適切なものはどれか。", "mondai_html": "<div id=\"mondai\">システム監査基準(平成30年)に基づくシステム監査において，リスクに基づく監査計画の策定(リスクアプローチ)で考慮すべき事項として、適切なものはどれか。</div>", "choices": {"ア": "監査対象の不備を見逃して監査の結論を誤る監査リスクを完全に回避する監査計画を策定する。", "イ": "情報システムリスクの大小にかかわらず、全ての監査対象に対して一律に監査資源を配分する。", "ウ": "情報システムリスクは，情報システムに係るリスクと，情報の管理に係るリスクの二つに大別されることに留意する。", "エ": "情報システムリスクは常に一定ではないことから，情報システムリスクの特性の変化及び変化がもたらす影響に留意する。"}, "choices_html": {"ア": "監査対象の不備を見逃して監査の結論を誤る監査リスクを完全に回避する監査計画を策定する。", "イ": "情報システムリスクの大小にかかわらず、全ての監査対象に対して一律に監査資源を配分する。", "ウ": "情報システムリスクは，情報システムに係るリスクと，情報の管理に係るリスクの二つに大別されることに留意する。", "エ": "情報システムリスクは常に一定ではないことから，情報システムリスクの特性の変化及び変化がもたらす影響に留意する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/05_haru/am2_25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">システム監査は、時間、要員、費用等の制約のもとで実施されるため、監査リスク（監査の結論を誤る可能性）を完全に回避することはできません。この点を念頭において、監査計画の策定においては、監査リスクを合理的に低い水準に抑えることができるアプローチをとることが求められます。</li><li class=\"lii\">全ての情報システムリスクに対して同じ監査資源（時間、要員、費用等）を投入するのは非効率的です。リスクの影響度が大きい監査対象領域には重点的に監査資源を配分し、影響が小さい監査対象領域には相応の資源配分を行うことで、効果的かつ効率的な監査を実施することができます。</li><li class=\"liu\">情報システムリスクは、①情報システムに係るリスク、②情報に係るリスク、③情報システム及び情報の管理に係るリスク、の3つに大別されます。①はITシステムと業務プロセスの不整合によるリスク、②は情報の機密性・完全性・可用性が損なわれるリスク、③はリスク対処のための体制や手続きに関するリスク（統制リスク）です。</li><li class=\"lie\">正しい。システム構成や利用形態、またはビジネスや環境などの外部状況の変化によって、情報システムリスクは変化することがあります。システム監査人は、その特性の変化及び変化がもたらす影響に留意する必要があります。</li></ul></div>", "past_history": ["安全確保支援士 R7秋期 問25"], "hist_count": 2}, {"id": "sc_04_aki_q1", "session": "支援士 R4秋", "gap": 5, "num": 1, "topic": "メッセージ認証符号", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "送信者から受信者にメッセージ認証符号(MAC:Message Authentication Code)を付与したメッセージを送り，さらに受信者が第三者に転送した。そのときのMACに関する記述のうち，適切なものはどれか。ここで，共通鍵は送信者と受信者だけが知っており，送信者と受信者のそれぞれの公開鍵は3人とも知っているとする。", "mondai_html": "<div id=\"mondai\">送信者から受信者にメッセージ認証符号(MAC:Message Authentication Code)を付与したメッセージを送り，さらに受信者が第三者に転送した。そのときのMACに関する記述のうち，適切なものはどれか。ここで，共通鍵は送信者と受信者だけが知っており，送信者と受信者のそれぞれの公開鍵は3人とも知っているとする。</div>", "choices": {"ア": "MACは，送信者がメッセージと共通鍵を用いて生成する。MACを用いると，受信者がメッセージの完全性を確認できる。", "イ": "MACは，送信者がメッセージと共通鍵を用いて生成する。MACを用いると，第三者が送信者の真正性を確認できる。", "ウ": "MACは，送信者がメッセージと受信者の公開鍵を用いて生成する。MACを用いると，第三者がメッセージの完全性を確認できる。", "エ": "MACは，送信者がメッセージと送信者の公開鍵を用いて生成する。MACを用いると，受信者が送信者の真正性を確認できる。"}, "choices_html": {"ア": "MACは，送信者がメッセージと共通鍵を用いて生成する。MACを用いると，受信者がメッセージの完全性を確認できる。", "イ": "MACは，送信者がメッセージと共通鍵を用いて生成する。MACを用いると，第三者が送信者の真正性を確認できる。", "ウ": "MACは，送信者がメッセージと受信者の公開鍵を用いて生成する。MACを用いると，第三者がメッセージの完全性を確認できる。", "エ": "MACは，送信者がメッセージと送信者の公開鍵を用いて生成する。MACを用いると，受信者が送信者の真正性を確認できる。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>メッセージ認証符号</strong>(MAC:Message Authentication Code)は、やり取りされるメッセージと、送信者と受信者が持つ共通鍵をもとに生成される固定長のビット列で、受信者側でメッセージ生成元の認証とメッセージの完全性を確認するために使われます。以下の2つの方式が代表的です。<dl><dt>CMAC（Cipher-based MAC）</dt><dd>メッセージをブロック暗号アルゴリズムで暗号化し、暗号文の最後のブロックをMACとして利用する</dd><dt>HMAC（Hash function-based MAC）</dt><dd>メッセージと共通鍵を組み合わせたものをハッシュ化したものをMACとして利用する</dd></dl>MACを用いたメッセージ認証の手順は次のとおりです。なお、メッセージ自体は暗号化されていないため、受信者側での復号は不要です。<ol><li>送信者は、メッセージを共通鍵で暗号化することでMACを生成し、メッセージとともに送信する</li><li>受信者は、受け取ったメッセージと共通鍵を使用して同様の方法でMACを生成し、受信したMACと自分が生成したMACを比較する</li><li>メッセージ、鍵、アルゴリズムが同じであれば、生成されるMACは同じになるので、両者が一致すればメッセージの破損・改ざんがないことを確認できる</li></ol><ul><li class=\"lia\">正しい。MACを用いると、共通鍵を共有している人の間でやり取りされるメッセージの完全性を確認することができます。</li><li class=\"lii\">MACの検証に成功すれば、そのメッセージは同一の共通鍵を持っている人から送信されたと判断できるので、送信者の真正性を確認することができます。本問では、送信者と受信者のみが共通鍵を持っているため、受信者は送信者の真正性を確認できます。しかし、共通鍵を持たない第三者はMACの検証ができないため、転送されたメッセージが送信者と受信者のどちらによって作成されたものなのかを判断することはできません。</li><li class=\"liu\">MACの生成に使用するのは、公開鍵ではなく共通鍵です。また、MACの生成に受信者の公開鍵を使った場合、ペアとなる秘密鍵を持つ受信者は検証できますが、第三者は受信者の秘密鍵を持たないため検証できません。</li><li class=\"lie\">MACの生成に使用するのは、公開鍵ではなく共通鍵です。また、受信者は送信者の秘密鍵を持たないため、送信者の真正性を検証することはできません。</li></ul></div>", "past_history": ["安全確保支援士 R6春期 問2"], "hist_count": 2}, {"id": "sc_04_aki_q2", "session": "支援士 R4秋", "gap": 5, "num": 2, "topic": "PKIを構成するRAの役割はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "PKI(公開鍵基盤)を構成するRA(Registration Authority)の役割はどれか。", "mondai_html": "<div id=\"mondai\">PKI(公開鍵基盤)を構成するRA(Registration Authority)の役割はどれか。</div>", "choices": {"ア": "デジタル証明書にデジタル署名を付与する。", "イ": "デジタル証明書に紐づけられた属性証明書を発行する。", "ウ": "デジタル証明書の失効リストを管理し，デジタル証明書の有効性を確認する。", "エ": "本人確認を行い，デジタル証明書の発行申請の承認又は却下を行う。"}, "choices_html": {"ア": "デジタル証明書にデジタル署名を付与する。", "イ": "デジタル証明書に紐づけられた属性証明書を発行する。", "ウ": "デジタル証明書の失効リストを管理し，デジタル証明書の有効性を確認する。", "エ": "本人確認を行い，デジタル証明書の発行申請の承認又は却下を行う。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>RA</strong>(Registration Authority)はPKI(公開鍵基盤)の構成要素の一つで、秘密鍵と公開鍵の鍵対とその保有者の身元確認を行い、デジタル証明書の発行申請に対して承認または却下を行う機関です。登録局とも呼ばれます。<br/><br/>PKIの中心となる役割を果たすのはデジタル証明書を発行する認定局(CA：Certificate Authority)ですが、一般に認定局は、デジタル証明書の審査を行うRA、RAから依頼されたデジタル証明書の発行及び失効を行う発行局(IA：Issuing Authority)、発行局で発行及び失効されたデジタル証明書・失効リスト(CRL：Certificate Revocation List)や認証実施規定等を公開するリポジトリなどで構成されています。<ul><li class=\"lia\">発行局(IA：Issuing Authority)の役割です。確認が行われたデジタル証明書にデジタル署名を付与するのは認定局(CA）ですが、認定局内の業務分担にまで細分化して考える場合は発行局(IA)となります。</li><li class=\"lii\">属性認証局(AA：Attribute Authority)の役割です。電子商取引を行う場合など、デジタル証明書の保有者本人の身元確認だけでなく、保有者が持つ肩書、権利や資格などの属性確認が必要になることがあります。この本人の属性を証明する属性証明書を発行するのが属性認証局(AA)です。</li><li class=\"liu\">検証局(VA：Validation Authority)の役割です。失効リストを確認する方法の一つに、リアルタイムでデジタル証明書の有効性を確認するプロトコルOCSP(Online Certificate Status Protocol)を用いる方法があります。この場合、利用者からの問い合わせに応答するOCSPレスポンダを認定局(CA)に設置する、もしくは失効リストを管理し、レスポンダの機能を実装した検証局(VA：Validation Authority)を設置してOCSP問い合わせに対応します。</li><li class=\"lie\">正しい。登録局(RA)の役割は、認証局の業務のうち、デジタル証明書の発行申請書に記載された申請者の本人確認を行い、審査結果に基づき申請の承認または却下を行うことです。承認された申請情報を登録する役割も担います。</li></ul></div>", "past_history": ["安全確保支援士 R6春期 問3", "安全確保支援士 R7秋期 問4"], "hist_count": 3}, {"id": "sc_04_aki_q3", "session": "支援士 R4秋", "gap": 5, "num": 3, "topic": "認証，属性及び認可のフレームワーク", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "標準化団体OASISが，Webサイトなどを運営するオンラインビジネスパートナー間で認証，属性及び認可の情報を安全に交換するために策定したものはどれか。", "mondai_html": "<div id=\"mondai\">標準化団体OASISが，Webサイトなどを運営するオンラインビジネスパートナー間で認証，属性及び認可の情報を安全に交換するために策定したものはどれか。</div>", "choices": {"ア": "SAML", "イ": "SOAP", "ウ": "XKMS", "エ": "XML Signature"}, "choices_html": {"ア": "SAML", "イ": "SOAP", "ウ": "XKMS", "エ": "XML Signature"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">正しい。<strong>SAML</strong>(Security Assertion Markup Language：サムエル)は、XMLベースのメッセージのやり取りによって、複数のシステムやサービスの間で認証情報、属性情報、権限の認可情報を交換するための仕様です。標準化団体OASISによって策定されていて、2022年現在の最新バージョンは2005年にリリースのSAML2.0です。主に複数のドメインにまたがったセキュアなシングルサインオンを実現するための仕組みとして使用されています。</li><li class=\"lii\">SOAPは、ネットワークを介して、他のコンピュータ上にあるアプリケーションやサービスを遠隔呼出しするためのXMLベースのRPCプロトコルです。</li><li class=\"liu\">XML Key Management Specificationの略。W3Cで標準化された、PKIの機能をWebサービスとして利用するための方法が規定された仕様です。</li><li class=\"lie\">XML Signature(XML署名)は、XML文書にデジタル署名を埋め込むための標準化仕様です。</li></ul></div>", "past_history": ["安全確保支援士 R6春期 問4", "情報セキュリティ H24秋期 問11", "情報セキュリティ H26秋期 問10", "情報セキュリティ H28春期 問4", "安全確保支援士 H29秋期 問3", "安全確保支援士 H31春期 問3"], "hist_count": 7}, {"id": "sc_04_aki_q4", "session": "支援士 R4秋", "gap": 5, "num": 4, "topic": "Smurf攻撃の特徴はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "DoS攻撃の一つであるSmurf攻撃はどれか。", "mondai_html": "<div id=\"mondai\">DoS攻撃の一つであるSmurf攻撃はどれか。</div>", "choices": {"ア": "TCP接続要求であるSYNパケットを攻撃対象に大量に送り付ける。", "イ": "偽装したICMPの要求パケットを送って，大量の応答パケットが攻撃対象に送られるようにする。", "ウ": "サイズの大きいUDPパケットを攻撃対象に大量に送り付ける。", "エ": "サイズの大きい電子メールや大量の電子メールを攻撃対象に送り付ける。"}, "choices_html": {"ア": "TCP接続要求であるSYNパケットを攻撃対象に大量に送り付ける。", "イ": "偽装したICMPの要求パケットを送って，大量の応答パケットが攻撃対象に送られるようにする。", "ウ": "サイズの大きいUDPパケットを攻撃対象に大量に送り付ける。", "エ": "サイズの大きい電子メールや大量の電子メールを攻撃対象に送り付ける。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_4.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>Smurf攻撃</strong>(スマーフアタック)は、ネットワークの疎通確認に使用される\"ICMP echo request(ping)\"の仕組みを悪用して、相手のコンピュータやネットワークに大量のパケットを送りつける反射型のDoS攻撃です。<br/><br/>攻撃者は、以下の手順で攻撃対象のサービスを妨害します。<ol><li class=\"maru1\">送信元IPアドレスを攻撃対象のコンピュータに偽装した\"ICMP echo request\"を、攻撃対象が属するネットワークにブロードキャストで大量に送りつける</li><li class=\"maru2\">\"ICMP echo request\"を受け取ったネットワーク内の端末が、一斉に攻撃対象に\"echo reply\"パケットで応答する</li><li class=\"maru3\">大量の応答パケットの発生により、攻撃対象のコンピュータおよびネットワークが過負荷状態になり正常なサービスが阻害される</li></ol><ul><li class=\"lia\">SYN Flood攻撃の説明です。</li><li class=\"lii\">正しい。Smurf攻撃の説明です。</li><li class=\"liu\">UDP Flood攻撃の説明です。</li><li class=\"lie\">メールボム攻撃の説明です。</li></ul></div>", "past_history": ["安全確保支援士 R3春期 問4", "情報セキュリティ H23秋期 問9", "情報セキュリティ H25春期 問14", "情報セキュリティ H26秋期 問12", "情報セキュリティ H28春期 問7", "安全確保支援士 H29秋期 問7", "安全確保支援士 H31春期 問6"], "hist_count": 8}, {"id": "sc_04_aki_q5", "session": "支援士 R4秋", "gap": 5, "num": 5, "topic": "想定できる攻撃はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "送信元IPアドレスがA，送信元ポート番号が80/tcp，宛先IPアドレスが未使用のIPアドレス空間内のIPアドレスであるSYN/ACKパケットを大量に観測した場合，推定できる攻撃はどれか。", "mondai_html": "<div id=\"mondai\">送信元IPアドレスがA，送信元ポート番号が80/tcp，宛先IPアドレスが未使用のIPアドレス空間内のIPアドレスであるSYN/ACKパケットを大量に観測した場合，推定できる攻撃はどれか。</div>", "choices": {"ア": "IPアドレスAを攻撃先とするサービス妨害攻撃", "イ": "IPアドレスAを攻撃先とするパスワードリスト攻撃", "ウ": "IPアドレスAを攻撃元とするサービス妨害攻撃", "エ": "IPアドレスAを攻撃元とするパスワードリスト攻撃"}, "choices_html": {"ア": "IPアドレスAを攻撃先とするサービス妨害攻撃", "イ": "IPアドレスAを攻撃先とするパスワードリスト攻撃", "ウ": "IPアドレスAを攻撃元とするサービス妨害攻撃", "エ": "IPアドレスAを攻撃元とするパスワードリスト攻撃"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">SYN/ACKパケットは、TCPのコネクション確立要求であるSYNパケットを受けた端末が、要求元に対して返信するパケットです。<div class=\"img_margin\"><img alt=\"05.png/image-size:467×338\" height=\"338\" src=\"https://www.sc-siken.com/kakomon/04_aki/img/05.png\" style=\"max-width: 100%; height: auto;\" width=\"467\"/></div>未使用のIPアドレス空間（ダークネット）を宛先とするSYN/ACKパケットを観測したということは、Aが、未使用領域に属するIPアドレスからのコネクション確立要求（SYNパケット）を受け、それに対する応答を行ったことを示しています。未使用空間のIPアドレスはどこにも割り当てられていませんから、SYNパケットの送信元IPアドレスをもつホストは実際には存在しません。当然ながら、SYN/ACKに対する応答（ACKパケット）が返ってくることもありません。これらの事実より、SYNパケットの送信元IPアドレスは偽装されており、Aが受信したSYNパケットは本来の目的以外で発信されたパケットであると判断できます。<br/><br/>SYNパケットを使用したDoS攻撃に「SYN flood攻撃」があります。これは、TCPのSYNパケットを大量に送りつけることで攻撃対象のサービス停止を狙う攻撃です。DoS攻撃の多くは攻撃元を悟られないために送信元IPアドレスを偽装しています。設問の事例では、何者かが送信元IPアドレスを偽装したSYNパケットをAに対して送りつけているので、Aへのサービス妨害攻撃を想定できます。<br/><br/>したがって「ア」が正解です。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_04_aki_q6", "session": "支援士 R4秋", "gap": 5, "num": 6, "topic": "パスワードスプレー攻撃はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "パスワードスプレー攻撃に該当するものはどれか。", "mondai_html": "<div id=\"mondai\">パスワードスプレー攻撃に該当するものはどれか。</div>", "choices": {"ア": "攻撃対象とする利用者IDを一つ定め，辞書及び人名リストに掲載されている単語及び人名並びにそれらの組合せを順にパスワードとして入力して，ログインを試行する。", "イ": "攻撃対象とする利用者IDを一つ定め，パスワードを総当たりして，ログインを試行する。", "ウ": "攻撃の時刻と攻撃元IPアドレスとを変え，かつ，アカウントロックを回避しながらよく用いられるパスワードを複数の利用者IDに同時に試し，ログインを試行する。", "エ": "不正に取得したある他のサイトの利用者IDとパスワードとの組みの一覧表を用いて，ログインを試行する。"}, "choices_html": {"ア": "攻撃対象とする利用者IDを一つ定め，辞書及び人名リストに掲載されている単語及び人名並びにそれらの組合せを順にパスワードとして入力して，ログインを試行する。", "イ": "攻撃対象とする利用者IDを一つ定め，パスワードを総当たりして，ログインを試行する。", "ウ": "攻撃の時刻と攻撃元IPアドレスとを変え，かつ，アカウントロックを回避しながらよく用いられるパスワードを複数の利用者IDに同時に試し，ログインを試行する。", "エ": "不正に取得したある他のサイトの利用者IDとパスワードとの組みの一覧表を用いて，ログインを試行する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/04_aki/am2_6.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>パスワードスプレー攻撃</strong>は、よく用いられるパスワードを1個または数個用意し、アカウントロックを回避しつつ複数の利用者IDに同時に試すことを繰り返して不正ログインを試みる攻撃です。別名、ローアンドスロー攻撃とも呼ばれます。<br/><br/>ログイン機構ではブルートフォース攻撃を防止するために、一定時間に一定回数以上のログイン失敗があるとアカウントにロックが掛かり、それ以上ログイン試行ができない仕様になっていることが普通です。パスワードスプレー攻撃では、攻撃元のIPアドレスを複数用意する、ログインできなければ一定の間隔を置いて再試行するなどの工作をし、一見すると正規ユーザーの認証失敗のように見せることで、不正アクセスとして検知することを難しくしています。<br/><br/>パスワードスプレー攻撃の防御策は、他のパスワード攻撃への対策と同様に、推測されにくい安全なパスワード設定を行う（それを促すためのパスワードポリシーの設定)、多要素認証を行うことなどです。また攻撃を受けた痕跡を検知するためにアクセスログを収集し分析することも大切です。管理者の分析と対応を支援する仕組みには、集められたログデータを収集・分析して異常を検知し通知するSIEM(Security Information And Event Management)や、クラウドサービスへのアクセスや利用状況を可視化・分析するCASB(Cloud Access Security Broker)などがあります。<ul><li class=\"lia\">辞書攻撃の説明です。</li><li class=\"lii\">ブルートフォース攻撃の説明です。これとは逆にパスワードを固定し、利用者IDを変えてログイン試行を繰り返すのがリバースブルートフォース攻撃ですが、アカウントロックを避けるために時間をかけて不正ログインを試みるという点でパスワードスプレー攻撃とは異なっています。</li><li class=\"liu\">正しい。パスワードスプレー攻撃に該当します。</li><li class=\
