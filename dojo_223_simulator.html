<dd>アンケート、回顧法、思考発話法</dd><dt>専門家だけで実施する手法</dt><dd>認知的ウォークスルー法、ヒューリスティック評価法</dd></dl>したがって正しい組合せは「ウ」です。<div class=\"img_margin\"><img alt=\"24a.png/image-size:432×101\" height=\"101\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/24a.png\" style=\"max-width: 100%; height: auto;\" width=\"432\"/></div></div>", "mondai_html": "ユーザーインタフェースのユーザビリティを評価するときの，利用者が参加する手法と専門家だけで実施する手法の適切な組みはどれか。<div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表・図\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/24.png\" style=\"max-width: 100%; height: auto; display: inline-block; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}}, {"id": "04_haru_q44", "session": "R4春", "gap": 6, "num": 44, "topic": "VDIシステムの導入", "subcat": "情報セキュリティ対策", "category": "テクノロジ系", "mondai": "内部ネットワークのPCからインターネット上のWebサイトを参照するときに，DMZに設置したVDI(Virtual Desktop Infrastructure)サーバ上のWebブラウザを利用すると，未知のマルウェアがPCにダウンロードされるのを防ぐというセキュリティ上の効果が期待できる。この効果を生み出すVDIサーバの動作の特徴はどれか。", "choices": {"ア": "Webサイトからの受信データを受信処理した後，IPsecでカプセル化し，PCに送信する。", "イ": "Webサイトからの受信データを受信処理した後，実行ファイルを削除し，その他のデータをPCに送信する。", "ウ": "Webサイトからの受信データを受信処理した後，生成したデスクトップ画面の画像データだけをPCに送信する。", "エ": "Webサイトからの受信データを受信処理した後，不正なコード列が検知されない場合だけPCに送信する。"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 R1秋期 問41", "応用情報技術者 H30春期 問41"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q44.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>VDI</strong>(Virtual Desktop Infrastructure)は、サーバ内にクライアントごとの仮想マシンを用意して仮想デスクトップ環境を構築する技術です。利用者はネットワークを通じてVDIサーバ上の仮想デスクトップ環境に接続し、クライアントPCにはVDIサーバからの操作結果画面のみが転送される仕組みになっています。<div class=\"img_margin\"><img alt=\"44.png/image-size:433×290\" height=\"290\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/44.png\" style=\"max-width: 100%; height: auto;\" width=\"433\"/></div>この仕組みにより、クライアントがインターネット上のサイトと直接的な通信を行わなくなるので、クライアントPCをインターネットから分離できます。もし利用者の操作により不正なマルウェアをダウンロードしてしまったとしても、それが保存されるのはVDIサーバ上の仮想環境ですので、クライアントPCへの感染を防げます。汚染された仮想環境を削除してしまえば内部ネットワークへの影響もありません。<br/><br/>VDIサーバからPCに送信されるのは「デスクトップ画面の画像データ」のみです。したがって正解は「ウ」です。</div>", "mondai_html": "内部ネットワークのPCからインターネット上のWebサイトを参照するときに，DMZに設置したVDI(Virtual Desktop Infrastructure)サーバ上のWebブラウザを利用すると，未知のマルウェアがPCにダウンロードされるのを防ぐというセキュリティ上の効果が期待できる。この効果を生み出すVDIサーバの動作の特徴はどれか。", "choices_html": {"ア": "Webサイトからの受信データを受信処理した後，IPsecでカプセル化し，PCに送信する。", "イ": "Webサイトからの受信データを受信処理した後，実行ファイルを削除し，その他のデータをPCに送信する。", "ウ": "Webサイトからの受信データを受信処理した後，生成したデスクトップ画面の画像データだけをPCに送信する。", "エ": "Webサイトからの受信データを受信処理した後，不正なコード列が検知されない場合だけPCに送信する。"}}, {"id": "04_haru_q45", "session": "R4春", "gap": 6, "num": 45, "topic": "ファジングに該当するものはどれか", "subcat": "セキュリティ技術評価", "category": "テクノロジ系", "mondai": "ファジングに該当するものはどれか。", "choices": {"ア": "サーバにFINパケットを送信し，サーバからの応答を観測して，稼働しているサービスを見つけ出す。", "イ": "サーバのOSやアプリケーションソフトウェアが生成したログやコマンド履歴などを解析して，ファイルサーバに保存されているファイルの改ざんを検知する。", "ウ": "ソフトウェアに，問題を引き起こしそうな多様なデータを入力し，挙動を監視して，脆弱性を見つけ出す。", "エ": "ネットワーク上を流れるパケットを収集し，そのプロトコルヘッダーやペイロードを解析して，あらかじめ登録された攻撃パターンと一致するものを検出する。"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 R1秋期 問44", "応用情報技術者 H30春期 問42"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q45.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ファジング</strong>(fuzzing)とは、検査対象のソフトウェア製品に「ファズ（英名：fuzz）」と呼ばれる問題を引き起こしそうなデータを大量に送り込み、その応答や挙動を監視することで(未知の)脆弱性を検出する検査手法です。<div class=\"img_margin\"><img alt=\"45.png/image-size:454×224\" height=\"224\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/45.png\" style=\"max-width: 100%; height: auto;\" width=\"454\"/></div>ファジングは、ファズデータの生成、検査対象への送信、挙動の監視を自動で行うファジングツール(ファザー)と呼ばれるソフトウェアを使用して行います。開発ライフサイクルにファジングを導入することで「バグや脆弱性の低減」「テストの自動化・効率化によるコスト削減」が期待できるため、大手企業の一部で徐々に活用され始めています。<ul><li class=\"lia\">ポートスキャンの説明です。</li><li class=\"lii\">ログ分析の説明です。</li><li class=\"liu\">正しい。ファジングの説明です。</li><li class=\"lie\">パターンマッチングの説明です。</li></ul></div>", "mondai_html": "ファジングに該当するものはどれか。", "choices_html": {"ア": "サーバにFINパケットを送信し，サーバからの応答を観測して，稼働しているサービスを見つけ出す。", "イ": "サーバのOSやアプリケーションソフトウェアが生成したログやコマンド履歴などを解析して，ファイルサーバに保存されているファイルの改ざんを検知する。", "ウ": "ソフトウェアに，問題を引き起こしそうな多様なデータを入力し，挙動を監視して，脆弱性を見つけ出す。", "エ": "ネットワーク上を流れるパケットを収集し，そのプロトコルヘッダーやペイロードを解析して，あらかじめ登録された攻撃パターンと一致するものを検出する。"}}, {"id": "03_aki_q20", "session": "R3秋", "gap": 7, "num": 20, "topic": "パッシブ方式RFタグの説明", "subcat": "ハードウェア", "category": "テクノロジ系", "mondai": "RFIDのパッシブ方式RFタグの説明として，適切なものはどれか。", "choices": {"ア": "アンテナで受け取った電力を用いて通信する。", "イ": "可視光でデータ通信する。", "ウ": "静電容量の変化を捉えて位置を検出する。", "エ": "赤外線でデータ通信する。"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 H25春期 問22", "応用情報技術者 H28秋期 問20"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>RFID</strong>(Radio Frequency IDentification)は、ID情報を埋め込んだRFタグ(ICタグ)から電磁界や電波を用いて情報のやり取りを行うための技術です。RFタグは電池の内蔵の有無によって「パッシブタグ」と「アクティブタグ」に分類されます。<dl><dt>パッシブタグ(受動タグ)</dt><dd>電池を内蔵せず、リーダー／ライターが発信する電波をエネルギー源として利用して駆動するタグ。リーダー／ライターの電波の一部を反射するときにID情報をのせて返すことで自身の電力で電波を発信しなくとも情報をやり取りすることができる。交信範囲は広くても数十センチメートルという制限があるが安価(10円以下)に製造できる。</dd><dt>アクティブタグ(能動タグ)</dt><dd>電池を内蔵し、自らの電力で電波を発信するタグ。交信範囲は数十メートルから数百メートルと広いがパッシブタグと比較すると価格が高い。</dd></dl><ul><li class=\"lia\">正しい。パッシブタグの説明です。</li><li class=\"lii\">可視光通信の説明です。</li><li class=\"liu\">タッチパネルの説明です。</li><li class=\"lie\">IrDA(Infrared Data Association)の説明です。</li></ul></div>", "mondai_html": "RFIDのパッシブ方式RFタグの説明として，適切なものはどれか。", "choices_html": {"ア": "アンテナで受け取った電力を用いて通信する。", "イ": "可視光でデータ通信する。", "ウ": "静電容量の変化を捉えて位置を検出する。", "エ": "赤外線でデータ通信する。"}}, {"id": "03_aki_q26", "session": "R3秋", "gap": 7, "num": 26, "topic": "関係Xを求める関係演算はどれか", "subcat": "データ操作", "category": "テクノロジ系", "mondai": "関係Rと関係Sに対して，関係Xを求める関係演算はどれか。", "choices": {"ア": "IDで結合", "イ": "差", "ウ": "直積", "エ": "和"}, "ans": "エ", "hist_count": 2, "past_history": ["応用情報技術者 H25秋期 問30", "応用情報技術者 H30春期 問27"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q26.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">結合(join)は、2つの表が共通して持つ属性(列)を基準に結合を行い、新しい表をつくりだす演算です。両方の関係に存在する結合属性は一方のみが表示されます。<br/>RとSをID列で(自然)結合した結果は次のようになります。<div class=\"img_margin\"><img alt=\"26a.png/image-size:301×80\" height=\"80\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/26a.png\" style=\"max-width: 100%; height: auto;\" width=\"301\"/></div></li><li class=\"lii\">差(difference)は、2つの関係があるとき、一方の関係に属する行から他方の関係に属する行を取り除いた表を返す演算です。<br/>RとSの差演算(R－S)及び(S－R)は次の結果を返します。<div class=\"img_margin\"><img alt=\"26i.png/image-size:403×77\" height=\"77\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/26i.png\" style=\"max-width: 100%; height: auto;\" width=\"403\"/></div></li><li class=\"liu\">直積(cartesian product)は、関係Rと関係Sの行の全ての組合せを返す演算です。演算後の行数は「Rの行数×Sの行数」になります。<br/>RとSの直積演算(R×S)は次の結果を返します。<div class=\"img_margin\"><img alt=\"26u.png/image-size:361×148\" height=\"148\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/26u.png\" style=\"max-width: 100%; height: auto;\" width=\"361\"/></div></li><li class=\"lie\">正しい。和(union)は、関係Rまたは関係Sに含まれるすべての行で構成される表を返す演算です。重複する行は除外されます。<br/>RとSの和演算(R∪S)は次の結果を返します。<div class=\"img_margin\"><img alt=\"26e.png/image-size:181×106\" height=\"106\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/26e.png\" style=\"max-width: 100%; height: auto;\" width=\"181\"/></div><em class=\"m\">設問の関係Xと同じになります</em>。</li></ul></div>", "mondai_html": "関係Rと関係Sに対して，関係Xを求める関係演算はどれか。<div class=\"img_margin\"><img alt=\"26.png/image-size:510×128\" height=\"128\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/26.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"510\"/></div>", "choices_html": {"ア": "IDで結合", "イ": "差", "ウ": "直積", "エ": "和"}}, {"id": "03_aki_q36", "session": "R3秋", "gap": 7, "num": 36, "topic": "IPv6で実現できるセキュリティ機能", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "IPv6において，拡張ヘッダーを利用することによって実現できるセキュリティ機能はどれか。", "choices": {"ア": "URLフィルタリング機能", "イ": "暗号化通信機能", "ウ": "情報漏えい検知機能", "エ": "マルウェア検知機能"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 R1秋期 問36", "応用情報技術者 H28秋期 問36"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q36.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">IPv6の拡張ヘッダーは、IPv6ヘッダーとTCP/UDPヘッダーの間に挿入される、フラグやオプション情報を追加するための可変長のフィールドです。<div class=\"img_margin\"><img alt=\"36_1.png/image-size:390×80\" height=\"80\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/36_1.png\" style=\"max-width: 100%; height: auto;\" width=\"390\"/></div>拡張ヘッダーには次のような種類があります。<div class=\"img_margin\"><img alt=\"36_2.png/image-size:410×247\" height=\"247\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/36_2.png\" style=\"max-width: 100%; height: auto;\" width=\"410\"/></div>このうち、認証及び暗号化がセキュリティ機能を実現するものです。したがって「イ」が正解です。<br/><br/>AHとESPはIPsecの仕様に含まれるプロトコルです。IPv6環境ではネットワーク層(インターネット層)で暗号化を行うIPsecの実装が必須になっています。</div>", "mondai_html": "IPv6において，拡張ヘッダーを利用することによって実現できるセキュリティ機能はどれか。", "choices_html": {"ア": "URLフィルタリング機能", "イ": "暗号化通信機能", "ウ": "情報漏えい検知機能", "エ": "マルウェア検知機能"}}, {"id": "03_aki_q43", "session": "R3秋", "gap": 7, "num": 43, "topic": "AHとESPを含むプロトコル", "subcat": "セキュリティ実装技術", "category": "テクノロジ系", "mondai": "OSI基本参照モデルのネットワーク層で動作し，\"認証ヘッダー(AH)\"と\"暗号ペイロード(ESP)\"の二つのプロトコルを含むものはどれか。", "choices": {"ア": "IPsec", "イ": "S/MIME", "ウ": "SSH", "エ": "XML暗号"}, "ans": "ア", "hist_count": 2, "past_history": ["情報セキュマネ H29春期 問28", "基本情報技術者 H31春期 問43"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q43.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>IPsec</strong>(IP Security)は、IP(Internet Protocol)を拡張してセキュリティを高めたプロトコルで、改ざんの検知、通信データの暗号化、送信元の認証などの機能をOSI基本参照モデルのネットワーク層レベル(TCP/IPモデルではIP層)で提供します。IPsecを用いれば上層のアプリケーションに依存せずに暗号化通信を行えるため、VPNの構築に利用されます。<br/>IPsecはプロトコル群の総称であり、認証、暗号化、鍵交換などの複数のプロトコルを含みます。そのうち、認証を担うプロトコルが<b>AH</b>(Authentication Header)、認証と暗号化を担うプロトコルが<b>ESP</b>(Encapsulated Security Payload)です。<br/><br/>どの規格もデータの暗号化を担いますが、ネットワーク層で動作するのはIPsecだけです。したがって「ア」が正解です。<ul><li class=\"lia\">正しい。</li><li class=\"lii\">Secure MIMEの略。公開鍵暗号技術を使用して「認証」「改ざん検出」「暗号化」などの機能を電子メールソフトに提供する規格です。</li><li class=\"liu\">Secure Shellの略。公開鍵暗号や認証の技術を用いて、遠隔地にあるコンピュータ（リモートコンピュータ）との間で安全にリモート通信をするためのプロトコルです。</li><li class=\"lie\">XML暗号は、XML文書の一部分を暗号化するための規格です。</li></ul></div>", "mondai_html": "OSI基本参照モデルのネットワーク層で動作し，\"認証ヘッダー(AH)\"と\"暗号ペイロード(ESP)\"の二つのプロトコルを含むものはどれか。", "choices_html": {"ア": "IPsec", "イ": "S/MIME", "ウ": "SSH", "エ": "XML暗号"}}, {"id": "03_aki_q49", "session": "R3秋", "gap": 7, "num": 49, "topic": "バーンダウンチャートはどれか", "subcat": "開発プロセス・手法", "category": "テクノロジ系", "mondai": "アジャイル開発におけるプラクティスの一つであるバーンダウンチャートはどれか。ここで，図中の破線は予定又は予想を，実線は実績を表す。", "choices": {}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 H29秋期 問50", "応用情報技術者 H31春期 問49"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q49.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>バーンダウンチャート</strong>は、縦軸に「残作業量」、横軸に「時間」を設定した折れ線グラフです。実績をプロットしていくことで、残作業量や予定との差異を視覚的に把握できるようになっています。<br/><br/>バーンダウンチャートでは、最初に作業開始時の最大作業量から目標となるリリース日もしくはイテレーション終了日までを直線で結び、理想的な作業進行を表す予定線を描いておきます。イテレーションや作業日の終わりに実績をプロットし、実績が予定線より上であれば計画より遅れている、予定線より下であれば計画より進んでいる、と判断します。プロジェクトの進行に伴い残作業量は減っていくため、基本的には右肩下がりのグラフになります。<br/><br/>バーンダウンチャートを作成すると、プロジェクトの進捗状況をチーム内で明確に共有できます。これにより、メンバー間で認識をそろえながら、計画の見直しや作業配分の調整など、必要な対策を適切なタイミングで実施できるようになります。<div class=\"img_margin\"><img alt=\"49.png/image-size:388×274\" height=\"274\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/49.png\" style=\"max-width: 100%; height: auto;\" width=\"388\"/></div><ul><li class=\"lia\">正しい。バーンダウンチャートです。</li><li class=\"lii\">故障率曲線です。</li><li class=\"liu\">バグ管理図です。</li><li class=\"lie\">要員ヒストグラムです。</li></ul></div>", "mondai_html": "アジャイル開発におけるプラクティスの一つであるバーンダウンチャートはどれか。ここで，図中の破線は予定又は予想を，実線は実績を表す。", "choices_html": {"ア": "<img alt=\"49a.png/image-size:223×160\" height=\"160\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/49a.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"223\"/>", "イ": "<img alt=\"49i.png/image-size:222×161\" height=\"161\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/49i.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"222\"/>", "ウ": "<img alt=\"49u.png/image-size:221×159\" height=\"159\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/49u.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"221\"/>", "エ": "<img alt=\"49e.png/image-size:219×157\" height=\"157\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/49e.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"219\"/>"}}, {"id": "03_haru_q3", "session": "R3春", "gap": 8, "num": 3, "topic": "音声サンプリング", "subcat": "情報に関する理論", "category": "テクノロジ系", "mondai": "サンプリング周波数40kHz，量子化ビット数16ビットでA/D変換したモノラル音声の1秒間のデータ量は，何kバイトとなるか。ここで， 1kバイトは1,000バイトとする。", "choices": {"ア": "20", "イ": "40", "ウ": "80", "エ": "640"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 H23秋期 問4", "応用情報技術者 H30春期 問4"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">アナログデータからデジタルデータへの変換では、標本化、量子化、符号化の3段階の処理を行います。<dl><dt>標本化</dt><dd>時間的に連続したアナログ信号(振幅、周波数、電圧など)を一定の時間間隔で測定する</dd><dt>量子化</dt><dd>標本化で得られた数値を整数などの離散値で近似する</dd><dt>符号化</dt><dd>量子化した整数値を2進数のビットに対応付ける</dd></dl><strong>サンプリング周波数</strong>とは、標本化において、1秒間にアナログ音声からデータを取得する回数を示します。また量子化ビット数は、量子化において、1回ごとの取得データを何ビットで表現するかを示します。<br/><br/>つまり、この問題のA/D変換は以下の条件で行うことになります。<ul><li>サンプリング周波数40kHz → 1秒間に40,000回データを取得する</li><li>量子化ビット数16ビット → 各々のサンプリングデータを16ビットで表現する</li></ul>1秒間のデータ量は「サンプリング回数×量子化ビット数」で求められるので、<br/><br/>　40,000回×16ビット＝640,000ビット＝640kビット<br/><br/>単位をバイトに変換して、<br/><br/>　640kビット÷8＝<em class=\"r\">80kバイト</em><br/><br/>したがって正解は「ウ」です。</div>", "mondai_html": "サンプリング周波数40kHz，量子化ビット数16ビットでA/D変換したモノラル音声の1秒間のデータ量は，何kバイトとなるか。ここで， 1kバイトは1,000バイトとする。", "choices_html": {"ア": "20", "イ": "40", "ウ": "80", "エ": "640"}}, {"id": "03_haru_q9", "session": "R3春", "gap": 8, "num": 9, "topic": "MIPSの計算", "subcat": "プロセッサ", "category": "テクノロジ系", "mondai": "表に示す命令ミックスによるコンピュータの処理性能は，何MIPSか。", "choices": {"ア": "11", "イ": "25", "ウ": "40", "エ": "90"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 H25春期 問9", "ソフトウェア開発技術者 H19春期 問17"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>MIPS</strong>(million instructions per second：ミップス)は、CPU性能の指標で1秒間の命令実行回数を百万単位で表したものです。例えば2MIPSであれば、1秒間に200万回の命令を実行できるという意味になります。<br/><br/>まず、3種類の命令を実行するのに必要な実行速度にその出現頻度を重み付けすることで、1命令あたりの平均実行時間を求めます。 <br/><br/>　10×0.5＋40×0.3＋40×0.2<br/>＝5＋12＋8＝25ナノ秒<br/><br/>次に、25ナノ秒の命令を1秒間に何回実行できるかを計算します。<br/><br/>　1秒÷25ナノ秒＝40,000,000回<br/><br/>MIPSは命令実行回数を百万単位で表したものなので、このコンピュータのMIPSは以下のように求めることができます。<br/><br/>　40,000,000回÷1,000,000回＝40MIPS<br/><br/>したがって「ウ」が正解です。</div>", "mondai_html": "表に示す命令ミックスによるコンピュータの処理性能は，何MIPSか。<div class=\"img_margin\"><img alt=\"09.png/image-size:351×104\" height=\"104\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/09.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"351\"/></div>", "choices_html": {"ア": "11", "イ": "25", "ウ": "40", "エ": "90"}}, {"id": "03_haru_q11", "session": "R3春", "gap": 8, "num": 11, "topic": "グリッドコンピューティング", "subcat": "システムの構成", "category": "テクノロジ系", "mondai": "グリッドコンピューティングの説明はどれか。", "choices": {"ア": "OSを実行するプロセッサ，アプリケーションを実行するプロセッサというように，それぞれの役割が決定されている複数のプロセッサによって処理を分散する方式である。", "イ": "PCから大型コンピュータまで，ネットワーク上にある複数のプロセッサに処理を分散して，大規模な一つの処理を行う方式である。", "ウ": "カーネルプロセスとユーザープロセスを区別せずに，同等な複数のプロセッサに処理を分散する方式である。", "エ": "プロセッサ上でスレッド(プログラムの実行単位)レベルの並列化を実現し，プロセッサの利用効率を高める方式である。"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 H27春期 問8", "ソフトウェア開発技術者 H18秋期 問22"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q11.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>グリッドコンピューティング</strong>は、インターネットなどのネットワーク上にある計算資源（CPUなどの計算能力や、ハードディスクなどの情報格納領域）を結びつけ、ひとつの複合したコンピュータシステムとしてサービスを提供する仕組みです。統合されるコンピュータ数によっては、スーパーコンピュータ並まで処理性能を高めることも可能となります。<br/><br/>したがって「イ」が適切な説明です。<ul><li class=\"lia\">非対称型マルチプロセッサシステムに関する記述です。</li><li class=\"lii\">正しい。グリッドコンピューティングに関する記述です。</li><li class=\"liu\">対称型マルチプロセッサシステムに関する記述です。</li><li class=\"lie\">マルチスレッドに関する記述です。</li></ul></div>", "mondai_html": "グリッドコンピューティングの説明はどれか。", "choices_html": {"ア": "OSを実行するプロセッサ，アプリケーションを実行するプロセッサというように，それぞれの役割が決定されている複数のプロセッサによって処理を分散する方式である。", "イ": "PCから大型コンピュータまで，ネットワーク上にある複数のプロセッサに処理を分散して，大規模な一つの処理を行う方式である。", "ウ": "カーネルプロセスとユーザープロセスを区別せずに，同等な複数のプロセッサに処理を分散する方式である。", "エ": "プロセッサ上でスレッド(プログラムの実行単位)レベルの並列化を実現し，プロセッサの利用効率を高める方式である。"}}, {"id": "03_haru_q15", "session": "R3春", "gap": 8, "num": 15, "topic": "密結合マルチプロセッサの性能", "subcat": "システムの構成", "category": "テクノロジ系", "mondai": "密結合マルチプロセッサの性能が，1台当たりのプロセッサ性能とプロセッサ数の積に 等しくならない 要因として，最も適切なものはどれか。", "choices": {"ア": "主記憶へのアクセスの競合", "イ": "通信回線を介したプロセッサ間通信", "ウ": "プロセッサのディスパッチ処理", "エ": "割込み処理"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 H25春期 問14", "ソフトウェア開発技術者 H19秋期 問29"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>密結合マルチプロセッサシステム</strong>は、複数のCPUが1つの主記憶を共有し、単一のOSで制御されるマルチプロセッサシステムです。<div class=\"img_margin\"><img alt=\"15.png/image-size:200×150\" height=\"150\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/15.png\" style=\"max-width: 100%; height: auto;\" width=\"200\"/></div>このシステムでは複数のCPUで主記憶を共有するため、並列処理の過程で複数のCPUが同一のメモリ領域にアクセスすると、競合によりアクセス遅延が生じます。プロセッサ数が増えるとメモリアクセスの競合が発生する数も増加するので、プロセッサ数を増やしていっても処理性能の向上は頭打ちになります。またメモリと各CPUの間の転送能力もシステム全体のボトルネックとなり得ます。<br/><br/>したがって、密結合マルチプロセッサシステムにおいて性能向上を阻む要因となるのは「主記憶へのアクセスの競合」になります。</div>", "mondai_html": "密結合マルチプロセッサの性能が，1台当たりのプロセッサ性能とプロセッサ数の積に<b>等しくならない</b>要因として，最も適切なものはどれか。", "choices_html": {"ア": "主記憶へのアクセスの競合", "イ": "通信回線を介したプロセッサ間通信", "ウ": "プロセッサのディスパッチ処理", "エ": "割込み処理"}}, {"id": "03_haru_q16", "session": "R3春", "gap": 8, "num": 16, "topic": "ターンアラウンドタイムの算出", "subcat": "システムの評価指標", "category": "テクノロジ系", "mondai": "ジョブの多重度が1で，到着順にジョブが実行されるシステムにおいて，表に示す状態のジョブA～Cを処理するとき，ジョブCが到着してから実行が終了するまでのターンアラウンドタイムは何秒か。ここで， OSのオーバーヘッドは考慮しないものとする。", "choices": {"ア": "11", "イ": "12", "ウ": "13", "エ": "14"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 H23秋期 問17", "応用情報技術者 H29秋期 問15"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>ターンアラウンドタイム</b>とは、利用者がシステムに処理要求を開始してから、すべての結果を受け取るまでに要する時間のことです。<br/><br/>設問の条件に従い、ジョブA～Cが実行される様子を図で表すと次のようになります。<div class=\"img_margin\"><img alt=\"16a.png/image-size:422×104\" height=\"104\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/16a.png\" style=\"max-width: 100%; height: auto;\" width=\"422\"/></div>ジョブCの到着は処理開始時点から3秒後、ジョブCの完了は処理開始時点から14秒後なので、ターンアラウンドタイムは「14秒－3秒＝<em class=\"r\">11秒</em>」になります。</div>", "mondai_html": "ジョブの多重度が1で，到着順にジョブが実行されるシステムにおいて，表に示す状態のジョブA～Cを処理するとき，ジョブCが到着してから実行が終了するまでのターンアラウンドタイムは何秒か。ここで， OSのオーバーヘッドは考慮しないものとする。<div class=\"img_margin\"><img alt=\"16.png/image-size:269×131\" height=\"131\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/16.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"269\"/></div>", "choices_html": {"ア": "11", "イ": "12", "ウ": "13", "エ": "14"}}, {"id": "03_haru_q17", "session": "R3春", "gap": 8, "num": 17, "topic": "プリエンプションで遷移する状態", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "リアルタイムOSにおいて，実行中のタスクがプリエンプションによって遷移する状態はどれか。", "choices": {"ア": "休止状態", "イ": "実行可能状態", "ウ": "終了状態", "エ": "待ち状態"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 R7春期 問14", "応用情報技術者 H29秋期 問16"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>プリエンプション</strong>(Preemption)とは、実行状態にあるタスクがCPUの使用権を奪われ<em class=\"r\">実行可能状態</em>に移されることをいいます。<div class=\"img_margin\"><img alt=\"17.png/image-size:288×154\" height=\"154\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/17.png\" style=\"max-width: 100%; height: auto;\" width=\"288\"/></div>プリエンプションは、以下のいずれかの状態になると発生します。<ul><li>実行状態のタスクより優先度の高いタスクが実行可能状態になる</li><li>実行状態のタスクに割り当てられたCPU使用時間が終了する</li></ul>プリエンプションによって遷移する状態は「実行可能状態」です。したがって「イ」が正解です。<br/><br/>OSがCPUやシステム資源を管理し、CPU使用時間や優先度などによって複数のタスクを実行状態や実行可能状態へ切替えながら実行していくマルチタスク方式をプリエンプション方式といいます。</div>", "mondai_html": "リアルタイムOSにおいて，実行中のタスクがプリエンプションによって遷移する状態はどれか。", "choices_html": {"ア": "休止状態", "イ": "実行可能状態", "ウ": "終了状態", "エ": "待ち状態"}}, {"id": "03_haru_q26", "session": "R3春", "gap": 8, "num": 26, "topic": "Webサイトの経路情報", "subcat": "UX/UIデザイン", "category": "テクノロジ系", "mondai": "利用者が現在閲覧しているWebページに表示する，Webサイトのトップページからそのページまでの経路情報を何と呼ぶか。", "choices": {"ア": "サイトマップ", "イ": "スクロールバー", "ウ": "ナビゲーションバー", "エ": "パンくずリスト"}, "ans": "エ", "hist_count": 2, "past_history": ["応用情報技術者 H30秋期 問24", "基本情報技術者 H27秋期 問24"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q26.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>パンくずリスト</strong>(Breadcrumbs list)は、比較的大規模なWebサイトで、利用者が現在どこの階層のページにいるのかをユーザーに知らせ、現在位置を見失わないようにする目的で設置されるユーザーインタフェース(UI)部品です。各文字列がそれぞれのページへのハイパーリンクとして機能し、Webサイトのナビゲーションを補助する役割を持っています。<br/>この「パンくずリスト」という名前は、童話「ヘンゼルとグレーテル」で主人公の男の子が森で迷わないように、通った道にパンくずを置いて行った話に由来しています。<br/><br/>当Webサイト(PC版)の左上のタイトルロゴ下に配置されているのが、正に\"パンくずリスト\"です。<div class=\"img_margin\"><img alt=\"26.png/image-size:482×222\" height=\"222\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/26.png\" style=\"max-width: 100%; height: auto;\" width=\"482\"/></div><ul><li class=\"lia\">サイトマップは、Webサイトにあるコンテンツを項目立てて一覧表示したものです。利用者がどのようなコンテンツがあるのかを素早く認識でき、目的の情報にたどり着きやすくなる利点があります。</li><li class=\"lii\">スクロールバーは、ウィンドウやHTML要素のサイズに収まらないページを閲覧するために使用されるUI部品です。</li><li class=\"liu\">ナビゲーションバーは、Webサイトがどのようなコンテンツがあるかを知らせ、コンテンツへの誘導を促すメニューの役割をもつUI部品です。サイト内で共通してページの固定位置に設置することで利用者を迷わせないメリットがあります。</li><li class=\"lie\">正しい。</li></ul></div>", "mondai_html": "利用者が現在閲覧しているWebページに表示する，Webサイトのトップページからそのページまでの経路情報を何と呼ぶか。", "choices_html": {"ア": "サイトマップ", "イ": "スクロールバー", "ウ": "ナビゲーションバー", "エ": "パンくずリスト"}}, {"id": "03_haru_q39", "session": "R3春", "gap": 8, "num": 39, "topic": "リスクベース認証の特徴はどれか", "subcat": "情報セキュリティ", "category": "テクノロジ系", "mondai": "リスクベース認証の特徴はどれか。", "choices": {"ア": "いかなる利用条件でのアクセスの要求においても，ハードウェアトークンとパスワードを併用するなど，常に二つの認証方式を併用することによって，不正アクセスに対する安全性を高める。", "イ": "いかなる利用条件でのアクセスの要求においても認証方法を変更せずに，同一の手順によって普段どおりにシステムにアクセスできるようにし，可用性を高める。", "ウ": "普段と異なる利用条件でのアクセスと判断した場合には，追加の本人認証をすることによって，不正アクセスに対する安全性を高める。", "エ": "利用者が認証情報を忘れ，かつ，Webブラウザに保存しているパスワード情報も使用できないリスクを想定して，緊急と判断した場合には，認証情報を入力せずに，利用者は普段どおりにシステムを利用できるようにし，可用性を高める。"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 H28秋期 問40", "応用情報技術者 H31春期 問37"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q39.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>リスクベース認証</strong>は、利用者のログイン行動や環境を分析し、普段使われているものとは異なる利用環境（IPアドレス・ISP・OS・Webブラウザなど）からの認証要求があった場合に、通常の認証に追加する形で別の認証を求める方式です。<br/><br/>この方式は、不正ログインのリスクが高いアクセスに対してだけ追加の認証を行うため、一定の利便性を保ちつつ、不正アクセスに対するセキュリティを高めることができます。追加認証としては、ワンタイムパスワード、秘密の質問、SMS認証、生体認証などが用いられます。<br/><br/>したがって適切な記述は「ウ」です。<ul><li class=\"lia\">二要素認証の説明です。</li><li class=\"lii\">RADIUS認証の説明です。</li><li class=\"liu\">正しい。リスクベース認証の説明です。</li><li class=\"lie\">災害などの緊急時に認証なしで使えるようにする仕組みとして、公衆無線LAN（00000JAPANなど）の開放機能や\"救済パスワード\"がありますが、これらはリスクベース認証ではありません。</li></ul></div>", "mondai_html": "リスクベース認証の特徴はどれか。", "choices_html": {"ア": "いかなる利用条件でのアクセスの要求においても，ハードウェアトークンとパスワードを併用するなど，常に二つの認証方式を併用することによって，不正アクセスに対する安全性を高める。", "イ": "いかなる利用条件でのアクセスの要求においても認証方法を変更せずに，同一の手順によって普段どおりにシステムにアクセスできるようにし，可用性を高める。", "ウ": "普段と異なる利用条件でのアクセスと判断した場合には，追加の本人認証をすることによって，不正アクセスに対する安全性を高める。", "エ": "利用者が認証情報を忘れ，かつ，Webブラウザに保存しているパスワード情報も使用できないリスクを想定して，緊急と判断した場合には，認証情報を入力せずに，利用者は普段どおりにシステムを利用できるようにし，可用性を高める。"}}, {"id": "03_haru_q48", "session": "R3春", "gap": 8, "num": 48, "topic": "命令網羅", "subcat": "ソフトウェア構築", "category": "テクノロジ系", "mondai": "あるプログラムについて，流れ図で示される部分に関するテストを，命令網羅で実施する場合，最小のテストケース数は幾つか。ここで，各判定条件は流れ図に示された部分の先行する命令の結果から影響を受けないものとする。", "choices": {"ア": "3", "イ": "6", "ウ": "8", "エ": "18"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 H22春期 問48", "ソフトウェア開発技術者 H18秋期 問44"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q48.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">ホワイトボックステストにおける網羅性のレベルには以下の5種類があります。<dl><dt>命令網羅</dt><dd>すべての命令を少なくとも1回は実行する。</dd><dt>判定条件網羅</dt><dd>判定条件の真偽を少なくとも1回は実行する。</dd><dt>条件網羅</dt><dd>判定条件が複数ある場合に、それぞれの条件が真・偽の場合を組み合わせたテストケースを設計する。</dd><dt>判定条件・条件網羅</dt><dd>判定条件網羅と条件網羅を組み合わせてテストケースを設計する。</dd><dt>複数条件網羅</dt><dd>判定条件のすべての可能な結果の組合せを網羅し、かつ、すべての命令を少なくとも1回は実行するようにテストケースを作成する。</dd></dl>命令網羅は、すべてのプログラム中の全ての命令を少なくとも1回は実行するようにテストケースを設計することです。問題文の流れ図のテストを命令網羅で実行すると以下のようになり、テストケースが最低<em class=\"r\">3つ</em>あれば全ての命令を検証することができます。したがって「ア」が適切です。<div class=\"img_margin\"><img alt=\"48a.png/image-size:149×291\" height=\"291\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/48a.png\" style=\"max-width: 100%; height: auto;\" width=\"149\"/></div></div>", "mondai_html": "あるプログラムについて，流れ図で示される部分に関するテストを，命令網羅で実施する場合，最小のテストケース数は幾つか。ここで，各判定条件は流れ図に示された部分の先行する命令の結果から影響を受けないものとする。<div class=\"img_margin\"><img alt=\"48.png/image-size:162×299\" height=\"299\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/48.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"162\"/></div>", "choices_html": {"ア": "3", "イ": "6", "ウ": "8", "エ": "18"}}, {"id": "03_haru_q50", "session": "R3春", "gap": 8, "num": 50, "topic": "ペアプログラミングの説明はどれか", "subcat": "開発プロセス・手法", "category": "テクノロジ系", "mondai": "アジャイル開発などで導入されている\"ペアプログラミング\"の説明はどれか。", "choices": {"ア": "開発工程の初期段階に要求仕様を確認するために，プログラマと利用者がペアとなり，試作した画面や帳票を見て，相談しながらプログラムの開発を行う。", "イ": "効率よく開発するために，2人のプログラマがペアとなり，メインプログラムとサブプログラムを分担して開発を行う。", "ウ": "短期間で開発するために，2人のプログラマがペアとなり，交互に作業と休憩を繰り返しながら長時間にわたって連続でプログラムの開発を行う。", "エ": "品質の向上や知識の共有を図るために，2人のプログラマがペアとなり，その場で相談したりレビューしたりしながら，一つのプログラムの開発を行う。"}, "ans": "エ", "hist_count": 2, "past_history": ["応用情報技術者 H26秋期 問49", "応用情報技術者 H30春期 問49"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q50.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ペアプログラミング</strong>は、2人1組で1つのプログラムの実装を行い、1人が実際のコードをコンピュータに打ち込み、もう1人はそれをチェックしながら補佐するという役割を随時交代しながら作業を進めていく手法です。プログラムをコンピュータに打ち込む人を「ドライバ」、それを補佐する人を「ナビゲータ」といいます。<br/><br/>ペアプログラミングには以下のようなメリットがあるとされています。<ol><li>2人の共同作業なので個々で行うよりも怠けにくい</li><li>2人で実装を行う相乗効果でよりよいコードに仕上がることが期待できる</li><li>他の人からの問い合わせにも空いている1人が対応できるので作業効率が向上する</li><li>共同作業を行うことでメンバーに対する理解が進みチームワークが向上する</li></ol>適切な役割分担になっている「エ」が正解です。</div>", "mondai_html": "アジャイル開発などで導入されている\"ペアプログラミング\"の説明はどれか。", "choices_html": {"ア": "開発工程の初期段階に要求仕様を確認するために，プログラマと利用者がペアとなり，試作した画面や帳票を見て，相談しながらプログラムの開発を行う。", "イ": "効率よく開発するために，2人のプログラマがペアとなり，メインプログラムとサブプログラムを分担して開発を行う。", "ウ": "短期間で開発するために，2人のプログラマがペアとなり，交互に作業と休憩を繰り返しながら長時間にわたって連続でプログラムの開発を行う。", "エ": "品質の向上や知識の共有を図るために，2人のプログラマがペアとなり，その場で相談したりレビューしたりしながら，一つのプログラムの開発を行う。"}}, {"id": "05_haru_q12", "session": "R5春", "gap": 4, "num": 12, "topic": "有機ELディスプレイの説明", "subcat": "入出力装置", "category": "テクノロジ系", "mondai": "有機ELディスプレイの説明として，適切なものはどれか。", "choices": {"ア": "電圧をかけて発光素子を発光させて表示する。", "イ": "電子ビームが発光体に衝突して生じる発光で表示する。", "ウ": "透過する光の量を制御することで表示する。", "エ": "放電によって発生した紫外線で，蛍光体を発光させて表示する。"}, "ans": "ア", "hist_count": 1, "past_history": ["応用情報技術者 H27秋期 問11"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q12.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>有機ELディスプレイ</b>は、発光材料として電圧を加えると発光する有機化合物を使用するディスプレイです。自発的な発光によりバックライトを必要としないので、薄く、軽量で、省エネルギー性に優れています。<br/><br/>最近では、テレビ画面やPC用のディスプレイだけでなく、携帯電話ゲーム機のディスプレイ、デジタルサイネージ(電子看板)などにも使われています。<br/><br/>有機ELディスプレイを液晶ディスプレイと比較した場合、以下のようなメリット・デメリットがあります。<dl><dt>メリット</dt><dd>視野角が広い、発光そのものに必要な電圧が低い、高コントラスト比、高い応答性、非常に薄くすることが可能、曲面ディスプレイが可能</dd><dt>デメリット</dt><dd>価格が高い、寿命が短い、大型化が難しい</dd></dl><ul><li class=\"lia\">正しい。有機ELディスプレイの説明です。</li><li class=\"lii\">CRT(ブラウン管)ディスプレイの説明です。</li><li class=\"liu\">液晶ディスプレイの説明です。</li><li class=\"lie\">プラズマディスプレイの説明です。</li></ul></div>", "mondai_html": "有機ELディスプレイの説明として，適切なものはどれか。", "choices_html": {"ア": "電圧をかけて発光素子を発光させて表示する。", "イ": "電子ビームが発光体に衝突して生じる発光で表示する。", "ウ": "透過する光の量を制御することで表示する。", "エ": "放電によって発生した紫外線で，蛍光体を発光させて表示する。"}}, {"id": "05_haru_q17", "session": "R5春", "gap": 4, "num": 17, "topic": "FIFO方式", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "仮想記憶システムにおいて，ページ置換えアルゴリズムとしてFIFOを採用して，仮想ページ参照列1，4，2，4，1，3を3ページ枠の実記憶に割り当てて処理を行った。表の割当てステップ\"3\"までは，仮想ページ参照列中の最初の1，4，2をそれぞれ実記憶に割り当てた直後の実記憶ページの状態を示している。残りをすべて参照した直後の実記憶の状態を示す太枠部分に該当するものはどれか。", "choices": {}, "ans": "ウ", "hist_count": 1, "past_history": ["基本情報技術者 H18秋期 問27"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>FIFO</strong>は、First In First Outの略で、早く入力されたデータから順に出力する「先入れ先出し」のことです。ページ置換えアルゴリズムとしてFIFOを採用する場合、ページインしてから最も時間が経過しているページが置換え対象として選択されます。<br/><br/>設問の表では、最初の3つ（1，4，2）を割り当てたところまでは終わっているので、4つ目以降の割当てを考えていきます。<br/><br/>【ステップ4：ページ4】<br/>ページ4は実記憶上に存在しているので、ページの入替えは発生しません。<br/><span class=\"bb min\">1</span><span class=\"bb min\">4</span><span class=\"bb min\">2</span><br/><br/>【ステップ5：ページ1】<br/>ページ1は実記憶上に存在しているので、ページの入替えは発生しません。<br/><span class=\"bb min\">1</span><span class=\"bb min\">4</span><span class=\"bb min\">2</span><br/><br/>【ステップ6：ページ3】<br/>ページ3は実記憶上に存在しないのでページの入替えが発生します。FIFOにより置換え対象として選択されるのは、ロードされているページ1，4，2のうち最も早くページインしたページ1となります。よって、ページ1をページアウトし、ページ3をページインする処理が行われます。<br/><span class=\"bb min\">3</span><span class=\"bb min\">4</span><span class=\"bb min\">2</span><br/><br/>したがって、割当てステップ6が終了した後の実記憶の状態は「ウ」になります。<div class=\"img_margin\"><img alt=\"17_1.png/image-size:285×182\" height=\"182\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/17_1.png\" style=\"max-width: 100%; height: auto;\" width=\"285\"/></div></div>", "mondai_html": "仮想記憶システムにおいて，ページ置換えアルゴリズムとしてFIFOを採用して，仮想ページ参照列1，4，2，4，1，3を3ページ枠の実記憶に割り当てて処理を行った。表の割当てステップ\"3\"までは，仮想ページ参照列中の最初の1，4，2をそれぞれ実記憶に割り当てた直後の実記憶ページの状態を示している。残りをすべて参照した直後の実記憶の状態を示す太枠部分に該当するものはどれか。<div class=\"img_margin\"><img alt=\"17.png/image-size:351×202\" height=\"202\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/17.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"351\"/></div>", "choices_html": {"ア": "<img alt=\"17a.png/image-size:157×33\" height=\"33\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/17a.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"157\"/>", "イ": "<img alt=\"17i.png/image-size:156×32\" height=\"32\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/17i.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"156\"/>", "ウ": "<img alt=\"17u.png/image-size:157×32\" height=\"32\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/17u.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"157\"/>", "エ": "<img alt=\"17e.png/image-size:157×32\" height=\"32\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/17e.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"157\"/>"}}, {"id": "05_haru_q19", "session": "R5春", "gap": 4, "num": 19, "topic": "ハッシュ表の探索時間", "subcat": "アルゴリズム", "category": "テクノロジ系", "mondai": "ハッシュ表の理論的な探索時間を示すグラフはどれか。ここで，複数のデータが同じハッシュ値になることはないものとする。", "choices": {}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H26春期 問19"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ハッシュ表</strong>は、キー(key)とそれに対応する値(value)の組を格納するデータ構造です。<br/><br/>ハッシュ表では、キーと値の組を格納する際、キーにハッシュ関数を使用して、格納する場所（インデックス）を一意に決め、そこに格納します。あるキーに対する値を取り出すときも、キーにハッシュ関数を使用することで格納場所を特定し、一発で目的のデータを参照することが可能です。ハッシュ関数からハッシュ値を計算する速度はほぼ一定なので、ハッシュ表に格納されているデータの数にかかわらず、探索時間はほぼ一定（定数時間）となります。<br/><br/>ハッシュ表探索では、表中のデータの数が増えても探索時間は変わらないので、適切な関係を表すグラフは「エ」です。</div>", "mondai_html": "ハッシュ表の理論的な探索時間を示すグラフはどれか。ここで，複数のデータが同じハッシュ値になることはないものとする。", "choices_html": {"ア": "<img alt=\"19a.png/image-size:176×190\" height=\"190\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/19a.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"176\"/>", "イ": "<img alt=\"19i.png/image-size:174×191\" height=\"191\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/19i.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"174\"/>", "ウ": "<img alt=\"19u.png/image-size:176×191\" height=\"191\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/19u.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"176\"/>", "エ": "<img alt=\"19e.png/image-size:174×192\" height=\"192\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/19e.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"174\"/>"}}, {"id": "05_haru_q27", "session": "R5春", "gap": 4, "num": 27, "topic": "ストアドプロシージャ", "subcat": "データベース設計", "category": "テクノロジ系", "mondai": "クライアントサーバシステムにおけるストアドプロシージャの記述として， 誤っているもの はどれか。", "choices": {"ア": "アプリケーションから一つずつSQL文を送信する必要がなくなる。", "イ": "クライアント側のCALL文によって実行される。", "ウ": "サーバとクライアントの間での通信トラフィックを軽減することができる。", "エ": "データの変更を行うときに，あらかじめDBMSに定義しておいた処理を自動的に起動・実行するものである。"}, "ans": "エ", "hist_count": 1, "past_history": ["ソフトウェア開発技術者 H18秋期 問67"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q27.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ストアドプロシージャ</strong>(Stored Procedure)は、データベースに対する一連の処理をまとめた手続きにして、データベース管理システムに保存したもので、利用者は通常のクエリを発行する代わりに、データベース管理システム内の手続きを呼び出すことによって目的の処理を実行させることができます。<br/><br/>クライアントからサーバに対してのストアドプロシージャ1回の要求で、データベースに複数のクエリを発行することができるので、クライアントから直に同数のクエリを発行する場合と比較して、クライアントとサーバ間の通信負荷の軽減が期待できます。<br/><br/>設問では「<b>誤っているもの</b>」が問われているため、選択肢の中で内容が誤っている記述を選ぶことが正解となります。<ul><li class=\"lia\">適切です。1回の要求で複数のSQL文を実行させることができます。</li><li class=\"lii\">適切です。CALL文は、ストアドプロシージャを実行するためのSQLコマンドです。</li><li class=\"liu\">適切です。クライアントから送信されるクエリ数が減少するので、通信トラフィックを軽減することができます。</li><li class=\"lie\"><b>誤った説明なので正解です</b>。本記述は、トリガーを説明した文です。<br/>ストアドプロシージャは、\"自動的に\"ではなくクライアント側からの呼出し要求に応じて実行されます。</li></ul></div>", "mondai_html": "クライアントサーバシステムにおけるストアドプロシージャの記述として，<u>誤っているもの</u>はどれか。", "choices_html": {"ア": "アプリケーションから一つずつSQL文を送信する必要がなくなる。", "イ": "クライアント側のCALL文によって実行される。", "ウ": "サーバとクライアントの間での通信トラフィックを軽減することができる。", "エ": "データの変更を行うときに，あらかじめDBMSに定義しておいた処理を自動的に起動・実行するものである。"}}, {"id": "05_haru_q29", "session": "R5春", "gap": 4, "num": 29, "topic": "データモデルに入れる多重度はどれか", "subcat": "データベース設計", "category": "テクノロジ系", "mondai": "UMLを用いて表した図のデータモデルのa，bに入れる多重度はどれか。 〔条件〕 部門には1人以上の社員が所属する。 社員はいずれか一つの部門に所属する。 社員が部門に所属した履歴を所属履歴として記録する。", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "エ", "hist_count": 1, "past_history": ["基本情報技術者 H30秋期 問26"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q29.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>多重度</strong>とは、あるクラスのインスタンス1つにつき、他方のクラスのインスタンスがいくつ関連するかという数を示します。クラス図における多重度の表記法とその意味は以下のとおりです。<div class=\"img_margin\"><img alt=\"29_1.png/image-size:270×173\" height=\"173\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/29_1.png\" style=\"max-width: 100%; height: auto;\" width=\"270\"/></div>〔<span class=\"bb\">a</span>について〕<br/>部門クラスのインスタンスから見た所属履歴の数が入ります。<br/>所属社員1人につき1つの所属履歴が記録されます。1つの部門には1人以上の社員が所属するので、1つの部門と関連する所属履歴も1つ以上ということになります。したがって<span class=\"bb\">a</span>には「1..*」が入ります。<br/><br/>〔<span class=\"bb\">b</span>について〕<br/>社員クラスのインスタンスから見た所属履歴の数が入ります。<br/>社員はいずれか一つの部門に所属しますが、部署異動の可能性を考えれば、1人の社員には1つまたは複数の所属履歴が存在することになります。したがって<span class=\"bb\">b</span>には「1..*」が入ります。<br/><br/>以上より、正しい組合せは「エ」になります。</div>", "mondai_html": "UMLを用いて表した図のデータモデルのa，bに入れる多重度はどれか。<br/><br/>〔条件〕<ul><li class=\"li1\">部門には1人以上の社員が所属する。</li><li class=\"li2\">社員はいずれか一つの部門に所属する。</li><li class=\"li3\">社員が部門に所属した履歴を所属履歴として記録する。</li></ul><div class=\"img_margin\"><img alt=\"29.png/image-size:463×97\" height=\"97\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/29.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"463\"/></div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表・図\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/29a.png\" style=\"max-width: 100%; height: auto; display: inline-block; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}}, {"id": "05_haru_q30", "session": "R5春", "gap": 4, "num": 30, "topic": "SQLの参照動作はどれか", "subcat": "データ操作", "category": "テクノロジ系", "mondai": "図のような関係データベースの\"注文\"表と\"注文明細\"表がある。\"注文\"表の行を削除すると，対応する\"注文明細\"表の行が，自動的に削除されるようにしたい。参照制約定義の削除規則(ON DELETE)に指定する語句はどれか。ここで，図中の実線の下線は主キーを，破線の下線は外部キーを表す。", "choices": {"ア": "CASCADE", "イ": "INTERSECT", "ウ": "RESTRICT", "エ": "UNIQUE"}, "ans": "ア", "hist_count": 1, "past_history": ["応用情報技術者 R1秋期 問27"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q30.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">参照制約が設定されているデータベースでは、主キーを含む行が削除されたり、更新されたりすると、参照関係が崩れることがあります。DBMSでは、参照整合性が損なわれるデータ操作が行われたときに、どのような形で参照整合性を回復するかを、外部キー制約のON DELETEやON UPDATEに指定しておくことができます。指定できる動作は次の5種類です。<dl><dt>CASCADE</dt><dd>参照先のデータが更新・削除されると、対応する外部キーの値も自動的に更新・削除される</dd><dt>RESTRICT</dt><dd>参照制約違反となるデータの更新・削除を拒否する</dd><dt>NO ACTION（デフォルトの動作）</dt><dd>処理の終了時に参照整合性を確認し、違反していれば更新・削除を拒否する</dd><dt>SET NULL</dt><dd>参照先のデータが更新・削除されると、対応する外部キーの値にNULLが設定される</dd><dt>SET DEFAULT</dt><dd>参照先のデータが更新・削除されると、対応する外部キーの値にデフォルト値が設定される</dd></dl>本問では、\"注文明細\"表から参照されている\"注文\"表の行が削除されたときに、対応する\"注文明細\"表の行を自動的に削除したいので、\"注文明細\"表の外部キー属性の定義に「ON DELETE <em class=\"r\">CASCADE</em>」と記述することになります。<div class=\"pre\">CREATE TABLE 注文明細 (<br/>…<br/>FOREIGN KEY (注文番号) REFERENCES 注文(注文番号)<br/>　ON DELETE CASCADE<br/>…<br/>)</div><ul><li class=\"lia\">正しい。CASCADEは、参照される側の行が削除・更新された場合、それを参照する側の行も同時に削除・更新する指定です。</li><li class=\"lii\">INTERSECTは、複数の表から両方に共通する行を抽出する集合演算を行うSQL文です。積集合を求めるのに使います。</li><li class=\"liu\">RESTRICTは、参照制約性を損なう削除や更新処理の要求に対して、データ更新または削除を禁止する指定です。</li><li class=\"lie\">UNIQUEは、データベースにデータを追加したり更新する際に、列や列のグループに格納される値が表内のすべての行で一意となるように制限する指定です。</li></ul></div>", "mondai_html": "図のような関係データベースの\"注文\"表と\"注文明細\"表がある。\"注文\"表の行を削除すると，対応する\"注文明細\"表の行が，自動的に削除されるようにしたい。参照制約定義の削除規則(ON DELETE)に指定する語句はどれか。ここで，図中の実線の下線は主キーを，破線の下線は外部キーを表す。<div class=\"img_margin\"><img alt=\"30.png/image-size:324×114\" height=\"114\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/30.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"324\"/></div>", "choices_html": {"ア": "CASCADE", "イ": "INTERSECT", "ウ": "RESTRICT", "エ": "UNIQUE"}}, {"id": "05_haru_q32", "session": "R5春", "gap": 4, "num": 32, "topic": "送信したパケットの数は幾つか", "subcat": "ネットワーク方式", "category": "テクノロジ系", "mondai": "100Mビット／秒のLANと1Gビット／秒のLANがある。ヘッダーを含めて1,250バイトのパケットをN個送付するときに，100Mビット／秒のLANの送信時間が1Gビット／秒のLANより9ミリ秒多く掛かった。Nは幾らか。ここで，いずれのLANにおいても，パケットの送信間隔(パケットの送信が完了してから次のパケットを送信開始するまでの時間)は1ミリ秒であり，パケット送信間隔も送信時間に含める。", "choices": {"ア": "10", "イ": "80", "ウ": "100", "エ": "800"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 R7秋期 問30"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q32.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">転送したデータ量、パケットの送信間隔は両方とも同じなので、9ミリ秒の差は単純に通信速度の違いのみによって生まれたことになります。送信時間、回線速度および転送量の間には、<br/><br/>　送信時間＝<span class=\"frac\"><span>転送データ量</span>回線速度</span><br/><br/>の関係があるので、転送データ量をAとして両者の送信時間を表すと、<ul><li>100Mビット／秒のLAN … A÷100Mビット</li><li>1Gビット／秒のLAN … A÷1Gビット</li></ul>となります。この2つの式と9ミリ秒を加味して方程式にし、転送データ量Aを求めます。<br/><br/>　A÷100Mビット＝A÷1Gビット＋0.009秒<br/>　10A＝A＋9,000,000<br/>　9A＝9,000,000<br/>　A＝1,000,000ビット＝125,000バイト<br/><br/>1パケットは1,250バイトなので、パケット数Nは、<br/><br/>　125,000バイト÷1,250バイト＝100個<br/><br/>したがって「ウ」が正解です。</div>", "mondai_html": "100Mビット／秒のLANと1Gビット／秒のLANがある。ヘッダーを含めて1,250バイトのパケットをN個送付するときに，100Mビット／秒のLANの送信時間が1Gビット／秒のLANより9ミリ秒多く掛かった。Nは幾らか。ここで，いずれのLANにおいても，パケットの送信間隔(パケットの送信が完了してから次のパケットを送信開始するまでの時間)は1ミリ秒であり，パケット送信間隔も送信時間に含める。", "choices_html": {"ア": "10", "イ": "80", "ウ": "100", "エ": "800"}}, {"id": "05_haru_q33", "session": "R5春", "gap": 4, "num": 33, "topic": "宛先情報の送出順序はどれか", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "1個のTCPパケットをイーサネットに送出したとき，イーサネットフレームに含まれる宛先情報の，送出順序はどれか。", "choices": {"ア": "宛先IPアドレス，宛先MACアドレス，宛先ポート番号", "イ": "宛先IPアドレス，宛先ポート番号，宛先MACアドレス", "ウ": "宛先MACアドレス，宛先IPアドレス，宛先ポート番号", "エ": "宛先MACアドレス，宛先ポート番号，宛先IPアドレス"}, "ans": "ウ", "hist_count": 1, "past_history": ["基本情報技術者 H25秋期 問37"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q33.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">アプリケーションから送信されたデータは、OSI基本参照モデル（TCP/IP階層モデル）の各層ごとのヘッダーが付加されて次の階層に渡されていきます。アプリケーション層で生成されたデータは、トランスポート層では<em class=\"r\">ポート番号</em>を含む「TCPヘッダー」、ネットワーク層では<em class=\"r\">IPアドレス</em>を含む「IPヘッダー」、データリンク層では<em class=\"r\">MACアドレス</em>を含む「MACヘッダー」がそれぞれ付加されます。<div class=\"img_margin\"><img alt=\"33.png/image-size:404×249\" height=\"249\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/33.png\" style=\"max-width: 100%; height: auto;\" width=\"404\"/></div>イーサネットフレームは、データリンク層で通信を行うためのMACヘッダーを付加したデータなので、ヘッダーの送出順序は上の図のとおり、ヘッダーの付加が新しいものから順に、宛先MACアドレス・宛先IPアドレス・宛先ポート番号となっています。したがって「ウ」が正解です。</div>", "mondai_html": "1個のTCPパケットをイーサネットに送出したとき，イーサネットフレームに含まれる宛先情報の，送出順序はどれか。", "choices_html": {"ア": "宛先IPアドレス，宛先MACアドレス，宛先ポート番号", "イ": "宛先IPアドレス，宛先ポート番号，宛先MACアドレス", "ウ": "宛先MACアドレス，宛先IPアドレス，宛先ポート番号", "エ": "宛先MACアドレス，宛先ポート番号，宛先IPアドレス"}}, {"id": "05_haru_q36", "session": "R5春", "gap": 4, "num": 36, "topic": "C&Cサーバが果たす役割はどれか", "subcat": "情報セキュリティ", "category": "テクノロジ系", "mondai": "ボットネットにおいてC&Cサーバが担う役割はどれか。", "choices": {"ア": "遠隔操作が可能なマルウェアに，情報収集及び攻撃活動を指示する。", "イ": "攻撃の踏み台となった複数のサーバからの通信を制御して遮断する。", "ウ": "電子商取引事業者などへの偽のデジタル証明書の発行を命令する。", "エ": "不正なWebコンテンツのテキスト，画像及びレイアウト情報を一元的に管理する。"}, "ans": "ア", "hist_count": 1, "past_history": ["基本情報技術者 H29秋期 問36"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q36.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>C&amp;Cサーバ</strong>(コマンド・コントロール・サーバ)は、マルウェアが侵入に成功したコンピュータ群(ボットネット)の動作を制御するために用いられる外部の指令サーバです。<br/><br/>マルウェアはC&amp;Cサーバからの指令を受けて、乗っ取ったコンピュータで悪意のある活動を行います。単純に外部から内部ネットワークに存在するマルウェアに対して通信を試みてもFWなどで遮断されてしまうため、マルウェア側からC&amp;Cサーバに対して定期的に問い合わせを行い、その応答を使って指令を行う仕組みが用いられています。この仕組みを「コネクトバック通信」といいます。<br/><br/>したがって、C&amp;Cサーバの役割を説明した記述は「ア」です。<div class=\"img_margin\"><img alt=\"36.png/image-size:393×247\" height=\"247\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/36.png\" style=\"max-width: 100%; height: auto;\" width=\"393\"/></div></div>", "mondai_html": "ボットネットにおいてC&Cサーバが担う役割はどれか。", "choices_html": {"ア": "遠隔操作が可能なマルウェアに，情報収集及び攻撃活動を指示する。", "イ": "攻撃の踏み台となった複数のサーバからの通信を制御して遮断する。", "ウ": "電子商取引事業者などへの偽のデジタル証明書の発行を命令する。", "エ": "不正なWebコンテンツのテキスト，画像及びレイアウト情報を一元的に管理する。"}}, {"id": "05_haru_q43", "session": "R5春", "gap": 4, "num": 43, "topic": "公衆無線LANのセキュリティ対策と効果", "subcat": "情報セキュリティ対策", "category": "テクノロジ系", "mondai": "公衆無線LANのアクセスポイントを設置するときのセキュリティ対策とその効果の組みとして，適切なものはどれか。", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "エ", "hist_count": 1, "past_history": ["基本情報技術者 H30秋期 問44"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q43.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">MACアドレスフィルタリングは、無線LANのアクセスポイントに正当な機器のMACアドレスを登録しておくことで、正当な機器以外からのアクセスを拒否する機能です。しかし、MACアドレスを正当なものに偽装している端末からの接続を遮断することはできません。</li><li class=\"lii\">SSIDを暗号化することはできません。SSIDを秘匿にするためにはアクセスポイントにSSIDステルスの設定を行います。これにより、アクセスポイントから発せられるビーコンにSSIDの情報が含まれなくなるため、第三者にアクセスポイントのSSIDを知られてしまう危険性を低くできます。</li><li class=\"liu\">ドメイン名は公開されていて、悪意のあるアクセスポイントのSSIDとして他者のドメインを設定することも可能なので、対策として意味がありません。不正なアクセスポイントの設置に対しては、SSIDや暗号化キーを類推できないものにすることがある程度の対策になります。</li><li class=\"lie\">正しい。無線LANのプライバシーセパレータ機能(アクセスポイントアイソレーションについての記述です。<br/><strong>プライバシーセパレータ</strong>は、同一の無線LANに接続された子機同士の通信を禁止する機能です。店舗内Wi-fiや公衆無線LANサービスのように見知らぬ他人同士が同じ無線LANに接続する場面で、利用者のセキュリティ保護のために設定されます。<div class=\"img_margin\"><img alt=\"43a.png/image-size:290×208\" height=\"208\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/43a.png\" style=\"max-width: 100%; height: auto;\" width=\"290\"/></div></li></ul></div>", "mondai_html": "公衆無線LANのアクセスポイントを設置するときのセキュリティ対策とその効果の組みとして，適切なものはどれか。<div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表・図\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/43.png\" style=\"max-width: 100%; height: auto; display: inline-block; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}}, {"id": "05_haru_q44", "session": "R5春", "gap": 4, "num": 44, "topic": "サブミッションポートの導入目的", "subcat": "セキュリティ実装技術", "category": "テクノロジ系", "mondai": "スパムメール対策として，サブミッションポート(ポート番号587)を導入する目的はどれか。", "choices": {"ア": "DNSサーバにSPFレコードを問い合わせる。", "イ": "DNSサーバに登録されている公開鍵を使用して，デジタル署名を検証する。", "ウ": "POP before SMTPを使用して，メール送信者を認証する。", "エ": "SMTP-AUTHを使用して，メール送信者を認証する。"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H28春期 問44"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q44.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">スパムメールは、追跡やブロックのリスクを避けるために、自身のISPのメールサーバを介さずに直接外部のメールサーバとコネクションを確立して、送信されることが普通です。このようなスパムメールの送信をブロックするため、ISPでは、ISP外部のメールサーバと直接コネクションを確立しようとする外向きの通信をブロックする<b>OP25B</b>（Outbound Port 25 Blocking）という対策を行っています。OP25Bが実施されていると、たとえ正当な利用者であっても、通常の\"25/TCP\"のSMTP通信を使って外部のメールサーバと直接コネクションを確立することができなくなります。これにより、外出先で自分が契約しているISPのメールサーバから送信できないなどの問題が生じます。<br/><br/><strong>サブミッションポート</strong>は、SMTPを拡張したプロトコルであり、利用者のメールソフト(メーラー)からメールサーバに対して、メールの送信を依頼するときに使用する<em class=\"r\">送信専用のポート番号</em>です。通常のメール送信に使われるSMTP(25/TCP)と異なり、<b>SMTP-AUTH</b>による送信者認証が用意されているため、メールサーバは認証を受けた利用者からのメールのみを送信することが可能となります。これによりスパマーの悪用を防ぎつつ、外部のメールサーバを使用したメール送信を可能にしています。<br/><br/>したがって、サブミッションポートの導入目的は「SMTP-AUTHによる送信者認証」が適切です。</div>", "mondai_html": "スパムメール対策として，サブミッションポート(ポート番号587)を導入する目的はどれか。", "choices_html": {"ア": "DNSサーバにSPFレコードを問い合わせる。", "イ": "DNSサーバに登録されている公開鍵を使用して，デジタル署名を検証する。", "ウ": "POP before SMTPを使用して，メール送信者を認証する。", "エ": "SMTP-AUTHを使用して，メール送信者を認証する。"}}, {"id": "04_aki_q3", "session": "R4秋", "gap": 5, "num": 3, "topic": "ロットが合格と判定される確率", "subcat": "応用数学", "category": "テクノロジ系", "mondai": "製品100個を1ロットとして生産する。一つのロットからサンプルを3個抽出して検査し，3個とも良品であればロット全体を合格とする。100個中に10個の不良品を含むロットが合格と判定される確率は幾らか。", "choices": {"ア": "178245", "イ": "405539", "ウ": "89110", "エ": "8797"}, "ans": "ア", "hist_count": 1, "past_history": ["応用情報技術者 H27春期 問3"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">ロットが合格と判定されるのは、90個の良品の中から3つを選んだとき、母数の組合せは100個から3つを選ぶ組合せ数なので、合格となる確率は「90個から3つを選ぶ組合せ数÷100個から3つを選ぶ組合せ数」で求めることができます。組合せ数は以下の公式を使って計算します。<br/><br/>【組合せ数の公式】<br/>n個のものからr個を取り出す取り出す組合せ数は、<br/>　<sub>n</sub>C<sub>r</sub>＝<span class=\"frac\"><span>n!</span>(n－r)!r!</span><br/>例）8色のカラーボールから3色のボールを選ぶ方法は、<br/>　<sub>8</sub>C<sub>3</sub>＝<span class=\"frac\"><span>8×7×6</span>3×2×1</span>＝56通り<br/><br/>90個の良品の中から3個を取り出す組合せ数は<sub>90</sub>C<sub>3</sub>、100個の製品の中から3個を取り出す組合せ数は<sub>100</sub>C<sub>3</sub>なので、<br/><br/>　<sub>90</sub>C<sub>3</sub>÷<sub>100</sub>C<sub>3</sub><br/>＝<span class=\"frac\"><span>90×89×88</span>3×2×1</span>÷<span class=\"frac\"><span>100×99×98</span>3×2×1</span><br/>＝<span class=\"frac\"><span>90×89×88</span><s>3×2×1</s></span>×<span class=\"frac\"><span><s>3×2×1</s></span>100×99×98</span><br/>＝<span class=\"frac\"><span>704880</span>970200</span>（約分を繰り返す※）<b><span class=\"frac\"><span>178</span>245</span></b><br/><br/>試験本番で大きな数を約分していくことは大変なので、<span class=\"frac\"><span>704880</span>970200</span>≒<span class=\"frac\"><span>70.5</span>97</span>≒0.723として、選択肢それぞれを小数化して一番近いものを選択すればOKです。<br/><br/>※<span class=\"frac\"><span>90×89×88</span>100×99×98</span>＝<span class=\"frac\"><span>9×10×89×8×11</span>10×10×9×11×98</span><br/>分子と分母両方にある9、10、11で約分して、<span class=\"frac\"><span>89×8</span>10×98</span><br/>さらに分解して、<span class=\"frac\"><span>89×2×2×2</span>2×5×49×2</span><br/>分子と分母両方にある2×2で約分して、<span class=\"frac\"><span>89×2</span>5×49</span>＝<span class=\"frac\"><span>178</span>245</span></div>", "mondai_html": "製品100個を1ロットとして生産する。一つのロットからサンプルを3個抽出して検査し，3個とも良品であればロット全体を合格とする。100個中に10個の不良品を含むロットが合格と判定される確率は幾らか。", "choices_html": {"ア": "<span class=\"frac\"><span>178</span>245</span>", "イ": "<span class=\"frac\"><span>405</span>539</span>", "ウ": "<span class=\"frac\"><span>89</span>110</span>", "エ": "<span class=\"frac\"><span>87</span>97</span>"}}, {"id": "04_aki_q8", "session": "R4秋", "gap": 5, "num": 8, "topic": "GPUを用いる利点", "subcat": "プロセッサ", "category": "テクノロジ系", "mondai": "ディープラーニングの学習にGPUを用いる利点として，適切なものはどれか。", "choices": {"ア": "各プロセッサコアが独立して異なるプログラムを実行し，異なるデータを処理できる。", "イ": "行列演算ユニットを用いて，行列演算を高速に実行できる。", "ウ": "浮動小数点演算ユニットをコプロセッサとして用い，浮動小数点演算ができる。", "エ": "分岐予測を行い，パイプラインの利用効率を高めた処理を実行できる。"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 R3春期 問10"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>GPU</strong>(Graphics Processing Unit)は、コンピュータにおいて画像処理を専門に担当するハードウェア部品です。動画再生や3DCGのレンダリングなどの定型的かつ大量の演算が要求される処理において、CPUの補助演算装置として機能します。<br/><br/>最近では、膨大な計算を必要とする科学シミュレーションや機械学習の分野でもGPUを利用すること（GPGPU）も増えています。ディープラーニングでは、システムに学習をさせるときに行列演算を含む大量の並列演算が必要なので、同じ種類の計算を大量に行うことに特化したGPUが活用されています。<ul><li class=\"lia\">マルチコアCPUを用いる利点です。</li><li class=\"lii\">正しい。GPU(Graphics Processing Unit)を用いる利点です。</li><li class=\"liu\">FPU(Floating Point Unit、浮動小数点演算装置)を用いる利点です。</li><li class=\"lie\">GPUは、CPUと違って命令制御関連の機能が弱いので、分岐予測やアウトオブオーダー実行などの命令スケジューリングには向きません。</li></ul></div>", "mondai_html": "ディープラーニングの学習にGPUを用いる利点として，適切なものはどれか。", "choices_html": {"ア": "各プロセッサコアが独立して異なるプログラムを実行し，異なるデータを処理できる。", "イ": "行列演算ユニットを用いて，行列演算を高速に実行できる。", "ウ": "浮動小数点演算ユニットをコプロセッサとして用い，浮動小数点演算ができる。", "エ": "分岐予測を行い，パイプラインの利用効率を高めた処理を実行できる。"}}, {"id": "04_aki_q14", "session": "R4秋", "gap": 5, "num": 14, "topic": "MTBFとMTTRと稼働率の関係", "subcat": "システムの評価指標", "category": "テクノロジ系", "mondai": "あるシステムにおいて，MTBFとMTTRがともに1.5倍になったとき，アベイラビリティ(稼働率)は何倍になるか。", "choices": {"ア": "23", "イ": "1.5", "ウ": "2.25", "エ": "変わらない"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H28秋期 問14"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">稼働率は、ある期間中にシステムが稼働していた時間の割合であり、<span class=\"frac\"><span>MTBF</span>MTBF＋MTTR</span>で求めることができます。<br/><br/>MTBFとMTTRをそれぞれ1.5倍にして式の変化を見ます。<br/><br/>　<span class=\"frac\"><span>1.5×MTBF</span>1.5×MTBF＋1.5×MTTR</span><br/>＝<span class=\"frac\"><span>1.5×MTBF</span>1.5(MTBF＋MTTR)</span><br/>＝<span class=\"frac\"><span>MTBF</span>MTBF＋MTTR</span>　<em class=\"g\">//1.5で約分する</em><br/><br/>最初と同じ式になるため、稼働率は以前と変わらないことがわかります。したがって「エ」が正解です。<dl><dt>MTBF(Mean Time Between Failures)</dt><dd>システムが修理され正常に稼働し始めてから、次回故障するまでの平均故障間隔のこと</dd><dt>MTTR(Mean Time To Repair)</dt><dd>システムの故障を修理するために要した平均修復時間のこと</dd></dl></div>", "mondai_html": "あるシステムにおいて，MTBFとMTTRがともに1.5倍になったとき，アベイラビリティ(稼働率)は何倍になるか。", "choices_html": {"ア": "<span class=\"frac\"><span>2</span>3</span>", "イ": "1.5", "ウ": "2.25", "エ": "変わらない"}}, {"id": "04_aki_q22", "session": "R4秋", "gap": 5, "num": 22, "topic": "フラッシュメモリの特徴はどれか", "subcat": "ハードウェア", "category": "テクノロジ系", "mondai": "フラッシュメモリの特徴として，適切なものはどれか。", "choices": {"ア": "書込み回数は無制限である。", "イ": "書込み時は回路基板から外して，専用のROMライターで書き込まなければならない。", "ウ": "定期的にリフレッシュしないと，データが失われる。", "エ": "データの書換え時には，あらかじめ前のデータを消去してから書込みを行う。"}, "ans": "エ", "hist_count": 1, "past_history": ["基本情報技術者 H22秋期 問26"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">フラッシュメモリのメモリセルは、書換えを繰り返すことでデータ保持能力が低下していきます。したがって無限に書換えができるわけではなく、一般には、数万回から数百万回が書換え回数の上限とされています</li><li class=\"lii\">フラッシュメモリは電気的に書換えを行うので、書込み時にメモリを回路基板から外す必要はありません。USBメモリを思い浮かべればわかると思います。なお、メモリを回路基板から外して専用の装置で書込みや消去をするものとして、UV-EPROM(紫外線消去型EPROM)があります。</li><li class=\"liu\">フラッシュメモリは、電源を切ってもデータが消えない不揮発性メモリなので、DRAMとは異なり、データを定期的に更新するリフレッシュ動作は不要です。</li><li class=\"lie\">正しい。フラッシュメモリは、あらかじめブロック単位で前のデータを消去してから書込むことでデータの書換えを行います。</li></ul></div>", "mondai_html": "フラッシュメモリの特徴として，適切なものはどれか。", "choices_html": {"ア": "書込み回数は無制限である。", "イ": "書込み時は回路基板から外して，専用のROMライターで書き込まなければならない。", "ウ": "定期的にリフレッシュしないと，データが失われる。", "エ": "データの書換え時には，あらかじめ前のデータを消去してから書込みを行う。"}}, {"id": "04_aki_q31", "session": "R4秋", "gap": 5, "num": 31, "topic": "DHCPサーバが設置されたLAN環境", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "IPアドレスの自動設定をするためにDHCPサーバが設置されたLAN環境の説明のうち，適切なものはどれか。", "choices": {"ア": "DHCPによる自動設定を行うPCでは，IPアドレスは自動設定できるが，サブネットマスクやデフォルトゲートウェイアドレスは自動設定できない。", "イ": "DHCPによる自動設定を行うPCと，IPアドレスが固定のPCを混在させることはできない。", "ウ": "DHCPによる自動設定を行うPCに，DHCPサーバのアドレスを設定しておく必要はない。", "エ": "一度IPアドレスを割り当てられたPCは，その後電源が切られた期間があっても必ず同じIPアドレスを割り当てられる。"}, "ans": "ウ", "hist_count": 1, "past_history": ["情報セキュマネ H28秋期 問47"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q31.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>DHCP</strong>(Dynamic Host Configuration Protocol)は、TCP/IPネットワークで、ネットワークに接続するノードへのIPアドレスの割り当てをアドレスプールから自動的に行うプロトコルです。<ul><li class=\"lia\">DHCPはサブネットマスクやデフォルトゲートウェイも自動で設定します。</li><li class=\"lii\">固定IPアドレスを自動割り当ての範囲から除外することで混在が可能です。</li><li class=\"liu\">正しい。IPアドレスの割り当てを要求するPCは、まず自ネットワークに「DHCP発見パケット」をブロードキャストします。「DHCP発見パケット」を受け取ったDHCPサーバは、使用可能なIPアドレスとサブネットマスクなどのネットワーク設定をクライアントに通知します。IPアドレスの自動割り当ては、このような手順で行われるため、DHCPサーバのアドレスをあらかじめPCに設定しておく必要はありません。</li><li class=\"lie\">電源がONになった際に、DHCPサーバとPCの間でIPアドレス割り当てのやり取りが行われます。DHCPによって割り当てられるIPアドレスは空いているものからランダムに選ばれるため前回と同じとは限りません。</li></ul></div>", "mondai_html": "IPアドレスの自動設定をするためにDHCPサーバが設置されたLAN環境の説明のうち，適切なものはどれか。", "choices_html": {"ア": "DHCPによる自動設定を行うPCでは，IPアドレスは自動設定できるが，サブネットマスクやデフォルトゲートウェイアドレスは自動設定できない。", "イ": "DHCPによる自動設定を行うPCと，IPアドレスが固定のPCを混在させることはできない。", "ウ": "DHCPによる自動設定を行うPCに，DHCPサーバのアドレスを設定しておく必要はない。", "エ": "一度IPアドレスを割り当てられたPCは，その後電源が切られた期間があっても必ず同じIPアドレスを割り当てられる。"}}, {"id": "04_aki_q38", "session": "R4秋", "gap": 5, "num": 38, "topic": "証明書の失効を確認するプロトコル", "subcat": "情報セキュリティ", "category": "テクノロジ系", "mondai": "デジタル証明書が失効しているかどうかをオンラインで確認するためのプロトコルはどれか。", "choices": {"ア": "CHAP", "イ": "LDAP", "ウ": "OCSP", "エ": "SNMP"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 H26秋期 問38"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q38.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>OCSP</strong>(Online Certificate Status Protocol)は、デジタル証明書の失効情報をオンライン確認し、デジタル証明書の有効性をリアルタイムで検証するプロトコルです。<br/><br/>クライアントは、確認対象となるデジタル証明書のシリアル番号をOCSPレスポンダに送信し、有効性検証の結果を受け取ります。この仕組みを利用することで、クライアント自身がCRLを取得・検証する手間を省くことができます。<ul><li class=\"lia\">Challenge Handshake Authentication Protocolの略。チャレンジレスポンス方式を使用した安全性の高い認証方式で、PPP接続で利用されます。</li><li class=\"lii\">Lightweight Directory Access Protocolの略。ディレクトリサービス(LANなどのコンピュータネットワーク上にあるユーザー情報、接続されているプリンターなどの資源を記憶し、検索しやすいようにまとめたもの)に対するアクセスを提供するプロトコルです。</li><li class=\"liu\">正しい。OCSPはデジタル証明書が失効しているかどうかをオンラインで確認するためのプロトコルです。</li><li class=\"lie\">Simple Network Management Protocolの略。TCP/IPネットワーク上でネットワーク上の機器の情報を収集して、監視や制御を行うためのプロトコルです。</li></ul></div>", "mondai_html": "デジタル証明書が失効しているかどうかをオンラインで確認するためのプロトコルはどれか。", "choices_html": {"ア": "CHAP", "イ": "LDAP", "ウ": "OCSP", "エ": "SNMP"}}, {"id": "04_aki_q41", "session": "R4秋", "gap": 5, "num": 41, "topic": "リスクアセスメントの構成プロセス", "subcat": "情報セキュリティ管理", "category": "テクノロジ系", "mondai": "JIS Q 31000:2019(リスクマネジメント－指針)におけるリスクアセスメントを構成するプロセスの組合せはどれか。", "choices": {"ア": "リスク特定，リスク評価，リスク受容", "イ": "リスク特定，リスク分析，リスク評価", "ウ": "リスク分析，リスク対応，リスク受容", "エ": "リスク分析，リスク評価，リスク対応"}, "ans": "イ", "hist_count": 1, "past_history": ["基本情報技術者 H29秋期 問43"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q41.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">リスクマネジメントの指針を示した規格であるJIS Q 31000では、リスクアセスメントを「リスク特定，リスク分析及びリスク評価を網羅するプロセス全体を指す」と定義しています。<br/><br/>したがって、正しい組合せは「リスク特定，リスク分析，リスク評価」の3つです。<dl><dt>リスク特定</dt><dd>組織の目的の達成を助ける又は妨害する可能性のあるリスクを発見し，認識し，記述する</dd><dt>リスク分析</dt><dd>必要に応じてリスクのレベルを含め，リスクの性質及び特徴を理解する</dd><dt>リスク評価</dt><dd>リスク分析の結果と確立されたリスク基準との比較をし，追加する行為の決定を裏付ける</dd></dl><div class=\"img_margin\"><img alt=\"41.png/image-size:375×171\" height=\"171\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/41.png\" style=\"max-width: 100%; height: auto;\" width=\"375\"/></div></div>", "mondai_html": "JIS Q 31000:2019(リスクマネジメント－指針)におけるリスクアセスメントを構成するプロセスの組合せはどれか。", "choices_html": {"ア": "リスク特定，リスク評価，リスク受容", "イ": "リスク特定，リスク分析，リスク評価", "ウ": "リスク分析，リスク対応，リスク受容", "エ": "リスク分析，リスク評価，リスク対応"}}, {"id": "04_aki_q43", "session": "R4秋", "gap": 5, "num": 43, "topic": "無線LANセキュリティ", "subcat": "セキュリティ実装技術", "category": "テクノロジ系", "mondai": "家庭内で，PCを無線LANとブロードバンドルータを介してインターネットに接続するとき，期待できるセキュリティ上の効果の記述のうち，適切なものはどれか。", "choices": {"ア": "IPマスカレード機能による，インターネットからの不正侵入に対する防止効果", "イ": "PPPoE機能による，経路上の盗聴に対する防止効果", "ウ": "WPA機能による，不正なWebサイトへの接続に対する防止効果", "エ": "WPS機能による，インターネットからのマルウェア感染に対する防止効果"}, "ans": "ア", "hist_count": 1, "past_history": ["応用情報技術者 H26春期 問43"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q43.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">ブロードバンドルータは、家庭内の複数内の端末が同時にインターネットに接続できるように、<strong>IPマスカレード</strong>(NAPT)の機能を備えています。<br/><br/>ブロードバンドルータは、LAN内のPCがインターネットに接続する際に、①PCのプライベートIPアドレスとポート番号の組合せをグローバルIPアドレスとポート番号の組合せに変換し、その対応を変換テーブルに記録しておきます。その後、インターネットから応答パケットを受け取ると、②変換テーブルの中から応答パケットの宛先ポート番号を探し、適切なプライベートIPアドレスとポート番号の組合せに戻して送信元PCに応答パケットを届けます。この一連のアドレスとポート番号の変更がIPマスカレードの動作です。<br/><br/>②の動作において該当するポート番号が変換テーブル内に存在しないときは、適切な変換先が見つからないのでルータは応答パケットを破棄することになります。つまり、外部から適当なパケットを送り付けても内部LANには到達しないということです。この仕組みにより、外部からポートスキャンや不正侵入を試みる攻撃が来たとしても、PCが守られるセキュリティ効果が期待できます。<ul><li class=\"lia\">正しい。</li><li class=\"lii\">PPP over EthernetはPPPをイーサネット上で利用できるようにしたものです。ブロードバンドルータからプロバイダの認証と接続を行うときに使用されていますが、通信経路の暗号化機能は持っていません。</li><li class=\"liu\">WPA(Wi-Fi Protected Access)は、無線LANの暗号化規格です。コンテンツフィルタリング機能やURLフィルタリング機能はありません。</li><li class=\"lie\">WPS(Wi-Fi Protected Setup)は、無線LANの親機と子機の接続設定やセキュリティ設定を容易に行うために策定された規格です。マルウェア感染を防止する機能はありません。</li></ul></div>", "mondai_html": "家庭内で，PCを無線LANとブロードバンドルータを介してインターネットに接続するとき，期待できるセキュリティ上の効果の記述のうち，適切なものはどれか。", "choices_html": {"ア": "IPマスカレード機能による，インターネットからの不正侵入に対する防止効果", "イ": "PPPoE機能による，経路上の盗聴に対する防止効果", "ウ": "WPA機能による，不正なWebサイトへの接続に対する防止効果", "エ": "WPS機能による，インターネットからのマルウェア感染に対する防止効果"}}, {"id": "04_aki_q49", "session": "R4秋", "gap": 5, "num": 49, "topic": "\"テスト駆動開発\"の説明はどれか", "subcat": "開発プロセス・手法", "category": "テクノロジ系", "mondai": "エクストリームプログラミング(XP：Extreme Programming)における\"テスト駆動開発\"の特徴はどれか。", "choices": {"ア": "最初のテストで，なるべく多くのバグを摘出する。", "イ": "テストケースの改善を繰り返す。", "ウ": "テストでのカバレージを高めることを目的とする。", "エ": "プログラムを書く前にテストケースを記述する。"}, "ans": "エ", "hist_count": 1, "past_history": ["応用情報技術者 H28春期 問50"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q49.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>エクストリームプログラミング</strong>(XP:Extreme Programming)は、1990年代後半、Kent Beck氏らによって提唱されたソフトウェア開発手法で、アジャイルソフトウェア開発と称される一連の手法の先駆けとなったものです。『プログラマーは人間である』という思想のもと、叩き台となるプログラムを早期に開発し、短いサイクルで頻繁にテストとリリースを繰り返すことで、顧客の要求への対応力と生産性を高め、リスクを軽減することを目的としています。<br/><br/><strong>テスト駆動開発</strong>(TDD：Test Driven Development)は、XPのプラクティスのひとつで、求める機能を明確化するためにプログラムを記述するよりも前にテストケースを作成する手法です。作成したテストをパスする最低限の実装を行った後で、機能を維持したまま（テストが通る状態のまま）コードを洗練していくという手順で開発を進めます。開発中にありがちな余分なコードの追加を防ぐ、素早く動くコードを作成できる、エラーを早期に発見できるなどの利点があるとされています。テストファーストプログラミングとも呼ばれます。<br/><br/>したがって「エ」が正解です。<div class=\"img_margin\"><img alt=\"49.png/image-size:377×332\" height=\"332\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/49.png\" style=\"max-width: 100%; height: auto;\" width=\"377\"/></div></div>", "mondai_html": "エクストリームプログラミング(XP：Extreme Programming)における\"テスト駆動開発\"の特徴はどれか。", "choices_html": {"ア": "最初のテストで，なるべく多くのバグを摘出する。", "イ": "テストケースの改善を繰り返す。", "ウ": "テストでのカバレージを高めることを目的とする。", "エ": "プログラムを書く前にテストケースを記述する。"}}, {"id": "04_haru_q5", "session": "R4春", "gap": 6, "num": 5, "topic": "リストを配列で実現した場合の特徴", "subcat": "データ構造", "category": "テクノロジ系", "mondai": "リストには，配列で実現する場合とポインタで実現する場合とがある。リストを配列で実現した場合の特徴として，適切なものはどれか。ここで，配列を用いたリストは配列に要素を連続して格納することによってリストを構成し，ポインタを用いたリストは要素と次の要素へのポインタを用いることによってリストを構成するものとする。", "choices": {"ア": "リストにある実際の要素数にかかわらず，リストに入れられる要素の最大個数に対応した領域を確保し，実際には使用されない領域が発生する可能性がある。", "イ": "リストの中間要素を参照するには，リストの先頭から順番に要素をたどっていくことから，要素数に比例した時間が必要となる。", "ウ": "リストの要素を格納する領域の他に，次の要素を指し示すための領域が別途必要となる。", "エ": "リストへの挿入位置が分かる場合には，リストにある実際の要素数にかかわらず，要素の挿入を一定時間で行うことができる。"}, "ans": "ア", "hist_count": 1, "past_history": ["基本情報技術者 H25秋期 問6"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">正しい。配列で実現するリストの特徴です。配列を用いる場合は最大の要素数を格納できるだけのメモリ領域をあらかじめ確保する必要があります。1,000要素分確保しても実際の格納数が10要素程度だとすると、残りの990要素分のメモリ領域が無駄になってしまいます。</li><li class=\"lii\">ポインタで実現するリストの特徴です。配列リストでは要素をメモリ上の連続した領域に格納するので、添字と一要素のデータサイズから参照すべきメモリアドレスをすぐに計算することができます。したがって、要素の格納位置にかかわらず参照時間は一定になります。</li><li class=\"liu\">ポインタで実現するリストの特徴です。配列リストでは連続したメモリ領域に添字順に要素を格納するので、次の要素の位置を容易に計算することができます。したがって、ポインタリストのように次の要素へのポインタを保持しておく必要はありません。</li><li class=\"lie\">配列リストに要素を挿入する場合、挿入位置より後ろに格納されている要素を1つずつ後ろの領域へ移動しなくてはなりません。また削除する場合は削除位置より後ろに格納されている要素を1つずつ前に移動する必要があります。挿入や削除の対象要素が配列リストの前方であるほど、後方に存在する要素が多くなるので処理に時間がかかることになります。</li></ul></div>", "mondai_html": "リストには，配列で実現する場合とポインタで実現する場合とがある。リストを配列で実現した場合の特徴として，適切なものはどれか。ここで，配列を用いたリストは配列に要素を連続して格納することによってリストを構成し，ポインタを用いたリストは要素と次の要素へのポインタを用いることによってリストを構成するものとする。", "choices_html": {"ア": "リストにある実際の要素数にかかわらず，リストに入れられる要素の最大個数に対応した領域を確保し，実際には使用されない領域が発生する可能性がある。", "イ": "リストの中間要素を参照するには，リストの先頭から順番に要素をたどっていくことから，要素数に比例した時間が必要となる。", "ウ": "リストの要素を格納する領域の他に，次の要素を指し示すための領域が別途必要となる。", "エ": "リストへの挿入位置が分かる場合には，リストにある実際の要素数にかかわらず，要素の挿入を一定時間で行うことができる。"}}, {"id": "04_haru_q6", "session": "R4春", "gap": 6, "num": 6, "topic": "再入可能プログラムの特徴はどれか", "subcat": "プログラミング", "category": "テクノロジ系", "mondai": "再入可能プログラムの特徴はどれか。", "choices": {"ア": "主記憶上のどこのアドレスに配置しても，実行することができる。", "イ": "手続の内部から自分自身を呼び出すことができる。", "ウ": "必要な部分を補助記憶装置から読み込みながら動作する。主記憶領域の大きさに制限があるときに，有効な手法である。", "エ": "複数のタスクからの呼出しに対して，並行して実行されても，それぞれのタスクに正しい結果を返す。"}, "ans": "エ", "hist_count": 1, "past_history": ["基本情報技術者 H27春期 問7"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q6.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>再入可能</strong>(リエントラント)プログラムとは、複数のタスクから同時に呼び出されても、それぞれに正しい値を返すことができるプログラム構造のことを表します。これを実現するには、プログラムをデータ部分と内容が共通である手続き部分に分離し、データ部分をタスクごとに用意する必要があります。<ul><li class=\"lia\">再配置可能プログラムの特徴です。</li><li class=\"lii\">再帰プログラムの特徴です。</li><li class=\"liu\">オーバーレイの説明です。</li><li class=\"lie\">正しい。再入可能プログラムの特徴です。</li></ul></div>", "mondai_html": "再入可能プログラムの特徴はどれか。", "choices_html": {"ア": "主記憶上のどこのアドレスに配置しても，実行することができる。", "イ": "手続の内部から自分自身を呼び出すことができる。", "ウ": "必要な部分を補助記憶装置から読み込みながら動作する。主記憶領域の大きさに制限があるときに，有効な手法である。", "エ": "複数のタスクからの呼出しに対して，並行して実行されても，それぞれのタスクに正しい結果を返す。"}}, {"id": "04_haru_q11", "session": "R4春", "gap": 6, "num": 11, "topic": "RAID5の実効データ容量", "subcat": "システムの構成", "category": "テクノロジ系", "mondai": "8Tバイトの磁気ディスク装置6台を，予備ディスク(ホットスペアディスク)1台込みのRAID5構成にした場合，実効データ容量は何Tバイトになるか。", "choices": {"ア": "24", "イ": "32", "ウ": "40", "エ": "48"}, "ans": "イ", "hist_count": 1, "past_history": ["ソフトウェア開発技術者 H19秋期 問21"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q11.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>RAID5</strong>は、データ本体とともにパリティという誤り訂正符号を複数のディスクに分散して書き込む方式で、耐障害性、アクセスの高速化、大容量化のすべてを実現することができます。<div class=\"img_margin\"><img alt=\"11.png/image-size:307×160\" height=\"160\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/11.png\" style=\"max-width: 100%; height: auto;\" width=\"307\"/></div>RAIDにおける予備ディスク(ホットスペアディスク)とは、故障したディスクの代替として使用するために用意しておくディスクです。あらかじめ通電状態で待機させておき、他のディスクに故障が発生したときには、故障したディスクを切り離して予備ディスクに故障したディスクのデータを復元し障害発生前の状態に復旧します。この問題では6台のうち1台を予備とするのでRAIDは5台で構成することになります。<br/>パリティの容量ですが、RAIDを構成するディスク台数に関係なくパリティの保存には常にディスク1台分の容量を要すると決まっているので、データの保存に使える実効容量はディスク4台分、すなわち「8Tバイト×4台＝32Tバイト」となります。<br/><br/>したがって正解は「イ」になります。</div>", "mondai_html": "8Tバイトの磁気ディスク装置6台を，予備ディスク(ホットスペアディスク)1台込みのRAID5構成にした場合，実効データ容量は何Tバイトになるか。", "choices_html": {"ア": "24", "イ": "32", "ウ": "40", "エ": "48"}}, {"id": "04_haru_q16", "session": "R4春", "gap": 6, "num": 16, "topic": "ジョブ管理で必要となるデータ量", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "ジョブ群と実行の条件が次のとおりであるとき，一時ファイルを作成する磁気ディスクに必要な容量は最低何Mバイトか。 〔ジョブ群〕 〔実行の条件〕 ジョブの実行多重度を2とする。 各ジョブの処理時間は同一であり，他のジョブの影響は受けない。 各ジョブは開始時に50Mバイトの一時ファイルを新たに作成する。 の関係があれば，ジョブXの開始時に作成した一時ファイルは，直後のジョブYで参照し，ジョブYの終了時にその一時ファイルを削除する。直後のジョブが複数個ある場合には，最初に生起されるジョブだけが先行ジョブの一時ファイルを参照する。 はジョブXの終了時に，ジョブY，ZのようにジョブXと矢印で結ばれる全てのジョブが，上から記述された順に優先して生起されることを示す。 は先行するジョブX，Y両方が終了したときにジョブZが生起されることを示す。 ジョブの生起とは実行待ち行列への追加を意味し，各ジョブは待ち行列の順に実行される。 OSのオーバーヘッドは考慮しない。", "choices": {"ア": "100", "イ": "150", "ウ": "200", "エ": "250"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 R1秋期 問17"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">一時ファイルはジョブの開始時に作成され、直後のジョブが終了した時点で削除されます。問題文の条件に従ってジョブの実行状況を追跡すると次のようになります。<ol><li>ジョブAが生起し、実行開始される。<br/>→<em class=\"r\">50</em>Mバイトの一時ファイルを作成</li><li>ジョブAが終了する。一時ファイルは直後のジョブが参照するため削除しない。</li><li>ジョブB、ジョブCの順に生起する。多重度は2なのでどちらも実行開始される。条件(4)より、ジョブAの一時ファイルは先に生起するジョブBだけが参照する（ジョブCは参照しない）。<br/>→「50×2＝<em class=\"r\">100</em>Mバイト」の一時ファイルを作成</li><li>ジョブB、ジョブCが終了する。ジョブAの一時ファイルが削除される。</li><li>ジョブD、ジョブEの順に生起する。多重度は2なのでどちらも実行開始される。ジョブBの一時ファイルは、先に生起するジョブDだけが参照する（ジョブEは参照しない）。<br/>→「50×2で<em class=\"r\">100</em>Mバイト」の一時ファイルを作成</li><li>ジョブD、ジョブEが終了する。ジョブB、ジョブCの一時ファイルが削除される。</li><li>ジョブFが生起し、実行開始される。<br/>→<em class=\"r\">50</em>Mバイトの一時ファイルを作成</li><li>ジョブFが終了する。ジョブD、ジョブEの一時ファイルが削除される。後続のジョブがないためジョブFの一時ファイルも削除される。</li></ol><div class=\"img_margin\"><img alt=\"16_4.png/image-size:479×208\" height=\"208\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/16_4.png\" style=\"max-width: 100%; height: auto;\" width=\"479\"/></div>一時ファイルの容量が最も多くなるのは、4つの一時ファイルが同時に存在するジョブD・E実行中で、その容量は200Mバイトです。したがって、一時ファイルを作成する磁気ディスクには少なくとも「200Mバイト」の容量が必要です。</div>", "mondai_html": "ジョブ群と実行の条件が次のとおりであるとき，一時ファイルを作成する磁気ディスクに必要な容量は最低何Mバイトか。<br/><br/>〔ジョブ群〕<div class=\"img_margin\"><img alt=\"16.png/image-size:471×95\" height=\"95\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/16.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"471\"/></div>〔実行の条件〕<ul><li class=\"li1\">ジョブの実行多重度を2とする。</li><li class=\"li2\">各ジョブの処理時間は同一であり，他のジョブの影響は受けない。</li><li class=\"li3\">各ジョブは開始時に50Mバイトの一時ファイルを新たに作成する。</li><li class=\"li4\"><img alt=\"16_1.png/image-size:60×20\" height=\"20\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/16_1.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"60\"/>の関係があれば，ジョブXの開始時に作成した一時ファイルは，直後のジョブYで参照し，ジョブYの終了時にその一時ファイルを削除する。直後のジョブが複数個ある場合には，最初に生起されるジョブだけが先行ジョブの一時ファイルを参照する。</li><li class=\"li5\"><img alt=\"16_2.png/image-size:62×42\" height=\"42\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/16_2.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"62\"/>はジョブXの終了時に，ジョブY，ZのようにジョブXと矢印で結ばれる全てのジョブが，上から記述された順に優先して生起されることを示す。</li><li class=\"li6\"><img alt=\"16_3.png/image-size:61×42\" height=\"42\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/16_3.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"61\"/>は先行するジョブX，Y両方が終了したときにジョブZが生起されることを示す。</li><li class=\"li7\">ジョブの生起とは実行待ち行列への追加を意味し，各ジョブは待ち行列の順に実行される。</li><li class=\"li8\">OSのオーバーヘッドは考慮しない。</li></ul>", "choices_html": {"ア": "100", "イ": "150", "ウ": "200", "エ": "250"}}, {"id": "04_haru_q17", "session": "R4春", "gap": 6, "num": 17, "topic": "排他的制御に利用するOSの機能", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "一つのI 2 Cバスに接続された二つのセンサーがある。それぞれのセンサー値を読み込む二つのタスクで排他的に制御したい。利用するリアルタイムOSの機能として，適切なものはどれか。", "choices": {"ア": "キュー", "イ": "セマフォ", "ウ": "マルチスレッド", "エ": "ラウンドロビン"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 R7秋期 問16"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>セマフォ</strong>は、並行動作している複数のタスク間で共通して使用する資源へのアクセスを制御するメカニズムです。<br/><br/>資源を使用するにはセマフォを取得する必要があり、あるタスクがセマフォを取得するとセマフォは1つ減り、逆に資源が解放されると1つ増えます。セマフォが1以上であれば資源は使用可能で、0のときは資源へのアクセスは待たされます。この仕組みによって、同時更新が問題となる処理部分の排他制御を行います。<br/><br/>セマフォは、整数型の共有変数（セマフォ変数）と、その変数を扱うP操作（取得)・V操作（解放）によって管理されます。<ul><li class=\"lia\">キューは、先入れ先出し（FIFO）のデータ構造です。排他制御の機能はありません。</li><li class=\"lii\">正しい。セマフォは、タスク間の排他制御に用いる機構です。読込み前にセマフォを取得し、読み終えたら解放することで競合やデータの破損を防げます。</li><li class=\"liu\">マルチスレッドは、OSから見た実行単位であるプロセスを複数の処理単位（スレッド）に細分化し、並行処理を行う仕組みです。</li><li class=\"lie\">ラウンドロビンは、実行可能状態となった順に従ってタスクに一定のCPU時間（タイムクウォンタム）を与えていくタスクスケジューリング方式です。</li></ul></div>", "mondai_html": "一つのI<sup>2</sup>Cバスに接続された二つのセンサーがある。それぞれのセンサー値を読み込む二つのタスクで排他的に制御したい。利用するリアルタイムOSの機能として，適切なものはどれか。", "choices_html": {"ア": "キュー", "イ": "セマフォ", "ウ": "マルチスレッド", "エ": "ラウンドロビン"}}, {"id": "04_haru_q18", "session": "R4春", "gap": 6, "num": 18, "topic": "フラグメンテーションに関する記述", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "フラグメンテーションに関する記述のうち，適切なものはどれか。", "choices": {"ア": "可変長ブロックのメモリプール管理方式では，様々な大きさのメモリ領域の獲得や返却を行ってもフラグメンテーションは発生しない。", "イ": "固定長ブロックのメモリプール管理方式では，可変長ブロックのメモリプール管理方式よりもメモリ領域の獲得と返却を速く行えるが，フラグメンテーションが発生しやすい。", "ウ": "フラグメンテーションの発生によって，合計としては十分な空きメモリ領域があるにもかかわらず，必要とするメモリ領域を獲得できなくなることがある。", "エ": "メモリ領域の獲得と返却の頻度が高いシステムでは，フラグメンテーションの発生を防止するため，メモリ領域が返却されるたびにガーベジコレクションを行う必要がある。"}, "ans": "ウ", "hist_count": 1, "past_history": ["基本情報技術者 H13秋期 問33"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>フラグメンテーション</strong>とは、記憶領域の断片化のことで、主記憶や補助記憶装置の記憶領域内に小さな未使用領域が不連続に存在する状態のことです。フラグメンテーションが発生すると、合計としては十分な記憶領域があるにもかかわらず、必要とする連続した記憶領域を確保できなくなってしまいます。この状態になるとファイルやデータを分割して記録しなければならなくなり、アクセス効率が低下します。フラグメンテーションは、記憶領域を可変長で区画してプログラムに割り当てる可変長方式で発生します。<ul><li class=\"lia\">可変長方式では、様々なサイズのメモリ領域の確保と解放を繰り返すので、記憶領域の断片化(フラグメンテーション)が生じます。</li><li class=\"lii\">固定長方式では、割り当てる区画の大きさが決まっていてメモリ領域の確保と解放を繰り返しても細切れになる領域が生じる余地がないため、フラグメンテーションは発生しません。</li><li class=\"liu\">正しい。フラグメンテーションが発生すると、連続した未使用領域が確保しにくくなります。</li><li class=\"lie\">フラグメンテーションを解消するには、ガーベジコレクション、メモリコンパクション、デフラグメンテーションなどを実行することになりますが、これらの処理は比較的時間がかかるのでその都度行うのは不適切です。</li></ul></div>", "mondai_html": "フラグメンテーションに関する記述のうち，適切なものはどれか。", "choices_html": {"ア": "可変長ブロックのメモリプール管理方式では，様々な大きさのメモリ領域の獲得や返却を行ってもフラグメンテーションは発生しない。", "イ": "固定長ブロックのメモリプール管理方式では，可変長ブロックのメモリプール管理方式よりもメモリ領域の獲得と返却を速く行えるが，フラグメンテーションが発生しやすい。", "ウ": "フラグメンテーションの発生によって，合計としては十分な空きメモリ領域があるにもかかわらず，必要とするメモリ領域を獲得できなくなることがある。", "エ": "メモリ領域の獲得と返却の頻度が高いシステムでは，フラグメンテーションの発生を防止するため，メモリ領域が返却されるたびにガーベジコレクションを行う必要がある。"}}, {"id": "04_haru_q31", "session": "R4春", "gap": 6, "num": 31, "topic": "IPv6アドレスの表記として適切なもの", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "IPv6アドレスの表記として，適切なものはどれか。", "choices": {"ア": "2001:db8::3ab::ff01", "イ": "2001:db8::3ab:ff01", "ウ": "2001:db8.3ab:ff01", "エ": "2001.db8.3ab.ff01"}, "ans": "イ", "hist_count": 1, "past_history": ["応用情報技術者 R1秋期 問34"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q31.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">IPv6アドレスのアドレス長は128ビットで、IPv4(32ビット)の4倍です。IPv4では32ビットを8ビットごとに区切り、それぞれを10進数で表したものを\".\"で連結していましたが、IPv6では128ビットを<em class=\"r\">16ビット</em>ごとに区切り、それぞれを<em class=\"r\">16進数</em>で表したものを\"<em class=\"r\">:</em>\"で連結して記述します。<div class=\"img_margin\"><img alt=\"31.png/image-size:395×40\" height=\"40\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/31.png\" style=\"max-width: 100%; height: auto;\" width=\"395\"/></div>また、記述量を減らすために以下の2つの規則に従った短縮表記が可能となっています。<ul><li class=\"li1\">各16ビットセクションの先行する 0 を省略する。例えば、0012 は 12 になる。ただし、16ビットセクションが 0000 のときは 0 とする。</li><li class=\"li2\">0 の16ビットセクションが連続する場合は、連続する2個のコロン(::)で表す。例えば、2001:0db8<u>:0000:0000:0000:</u>ff00:0042:8329 は 2001:db8<u>::</u>ff00:42:8329 と表す。ただし、:: は1か所にだけ使用できる。</li></ul><ul><li class=\"lia\">\"::\"が2か所に使用されているので誤りです。</li><li class=\"lii\">正しい。IPv6表記として適切です。</li><li class=\"liu\">\".\"で連結している箇所があるので誤りです。</li><li class=\"lie\">各16ビットセクションを\".\"で連結しているので誤りです。</li></ul></div>", "mondai_html": "IPv6アドレスの表記として，適切なものはどれか。", "choices_html": {"ア": "2001:db8::3ab::ff01", "イ": "2001:db8::3ab:ff01", "ウ": "2001:db8.3ab:ff01", "エ": "2001.db8.3ab.ff01"}}, {"id": "04_haru_q33", "session": "R4春", "gap": 6, "num": 33, "topic": "UDPを使用しているもの", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "UDPを使用しているものはどれか。", "choices": {"ア": "FTP", "イ": "NTP", "ウ": "POP3", "エ": "TELNET"}, "ans": "イ", "hist_count": 1, "past_history": ["基本情報技術者 H25春期 問36"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q33.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>UDP</strong>(User Datagram Protocol)は、TCP/IPネットワークの通信処理で使われる伝送制御プロトコルのひとつで、コネクションを確立して通信の信頼性の確保を行うTCPと異なり「コネクションレス型」の通信を実現する伝送制御プロトコルです。送受されるパケットにコネクションの情報がない分だけTCPと比べデータ比率は高まることになるため、途中でデータが抜け落ちても問題が少ない音声や画像のストリーム形式での配信などで使用されています。<ul><li class=\"lia\">File Transfer Protocolの略。TCPのポート20と21番を使用します。</li><li class=\"lii\">正しい。NTP(Network Time Protocol)は、UDPのポート123番を使用します。</li><li class=\"liu\">Post Office Protocol Version 3の略。TCPのポート110番を使用します。</li><li class=\"lie\">Telecommunication networkの略。TCPのポート23番を使用します。</li></ul></div>", "mondai_html": "UDPを使用しているものはどれか。", "choices_html": {"ア": "FTP", "イ": "NTP", "ウ": "POP3", "エ": "TELNET"}}, {"id": "04_haru_q34", "session": "R4春", "gap": 6, "num": 34, "topic": "接続可能なホストの最大数", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "IPv4で 192.168.30.32/28 のネットワークに接続可能なホストの最大数はどれか。", "choices": {"ア": "14", "イ": "16", "ウ": "28", "エ": "30"}, "ans": "ア", "hist_count": 1, "past_history": ["基本情報技術者 H26春期 問35"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q34.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">設問のIPアドレス\"192.168.30.32\"の後方に付加されている\"/28\"は「アドレスプレフィックス」といい、先頭から何ビットまでがネットワークアドレスであるかを示す表記法です。<br/><br/>\"/28\"は、先頭から28ビット目までがネットワークアドレスであることを表しているので、ホストアドレスに割り当てることができるのは残る4ビットになります。4ビットで表現できるビット列は0000～1111の16種類ありますが、全てが0の\"0000\"と全てが1の\"1111\"は、それぞれネットワークアドレス、ブロードキャストアドレスとして予約されているためホストアドレスとして割り当てることはできません。<br/><br/>したがってホストの最大数は「16－2＝14」が適切です。</div>", "mondai_html": "IPv4で 192.168.30.32/28 のネットワークに接続可能なホストの最大数はどれか。", "choices_html": {"ア": "14", "イ": "16", "ウ": "28", "エ": "30"}}, {"id": "04_haru_q43", "session": "R4春", "gap": 6, "num": 43, "topic": "リスクレベルの定義はどれか", "subcat": "情報セキュリティ管理", "category": "テクノロジ系", "mondai": "JIS Q 27000:2019(情報セキュリティマネジメントシステム－用語)における\"リスクレベル\"の定義はどれか。", "choices": {"ア": "脅威によって付け込まれる可能性のある，資産又は管理策の弱点", "イ": "結果とその起こりやすさの組合せとして表現される，リスクの大きさ", "ウ": "対応すべきリスクに付与する優先順位", "エ": "リスクの重大性を評価するために目安とする条件"}, "ans": "イ", "hist_count": 1, "past_history": ["情報セキュマネ H31春期 問6"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q43.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">脆弱性の定義です。</li><li class=\"lii\">正しい。リスクレベルの定義です。リスクは影響度と発生確率の積で大きさを見積もります。</li><li class=\"liu\">この記述に対応する用語はありません。</li><li class=\"lie\">リスク基準の定義です。</li></ul></div>", "mondai_html": "JIS Q 27000:2019(情報セキュリティマネジメントシステム－用語)における\"リスクレベル\"の定義はどれか。", "choices_html": {"ア": "脅威によって付け込まれる可能性のある，資産又は管理策の弱点", "イ": "結果とその起こりやすさの組合せとして表現される，リスクの大きさ", "ウ": "対応すべきリスクに付与する優先順位", "エ": "リスクの重大性を評価するために目安とする条件"}}, {"id": "04_haru_q47", "session": "R4春", "gap": 6, "num": 47, "topic": "判定条件網羅のテストケース", "subcat": "ソフトウェア構築", "category": "テクノロジ系", "mondai": "次の流れ図において，判定条件網羅(分岐網羅)を満たす最少のテストケースはどれか。", "choices": {"ア": "(1) A＝0，B＝0　(2) A＝1，B＝1", "イ": "(1) A＝1，B＝0　(2) A＝1，B＝1", "ウ": "(1) A＝0，B＝0　(2) A＝1，B＝1　(3) A＝1，B＝0", "エ": "(1) A＝0，B＝0　(2) A＝0，B＝1　(3) A＝1，B＝0"}, "ans": "イ", "hist_count": 1, "past_history": ["基本情報技術者 H14秋期 問50"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q47.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>ホワイトボックステスト</b>における網羅性のレベルである「判定条件網羅」とは、プログラム中の分岐の判定条件において、結果が真となる場合、偽となる場合を少なくとも1回は実行するようにテストケースを設計することです。<ul><li class=\"lia\">(1)は、1つ目の分岐ではA=0・B=0なのでNo、2つ目の分岐もA=0・C=2なのでNoです。(2)は、1つ目の分岐でA=1・B=1なのでNo、2つ目の分岐もA=1・C=2なのでNoです。<br/>どちらの判定条件においても「Yes」に分岐しないので誤りです。<div class=\"img_margin\"><img alt=\"47a.png/image-size:300×100\" height=\"100\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/47a.png\" style=\"max-width: 100%; height: auto;\" width=\"300\"/></div></li><li class=\"lii\">正しい。(1)は、1つ目の分岐ではA=1・B=0なのでYes、2つ目の分岐もA=1・C=1なのでYesです。(2)は、1つ目の分岐でA=1・B=1なのでNo、2つ目の分岐もA=1・C=2なのでNoです。<br/>分岐網羅を満たしており、無駄がないので最少のテストケースとなります。<div class=\"img_margin\"><img alt=\"47i.png/image-size:300×100\" height=\"100\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/47i.png\" style=\"max-width: 100%; height: auto;\" width=\"300\"/></div></li><li class=\"liu\">(1)は、1つ目の分岐ではA=0・B=0なのでNo、2つ目の分岐もA=0・C=2なのでNoです。(2)は、1つ目の分岐でA=1・B=1なのでNo、2つ目の分岐もA=1・C=2なのでNoです。(3)は、1つ目の分岐ではA=1・B=0なのでYes、2つ目の分岐もA=1・C=1なのでYesです。<br/>分岐網羅を満たしますが、テストケース(1)と(2)は冗長です。どちらか1つあれば十分なので最少ではありません。<div class=\"img_margin\"><img alt=\"47u.png/image-size:300×132\" height=\"132\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/47u.png\" style=\"max-width: 100%; height: auto;\" width=\"300\"/></div></li><li class=\"lie\">(1)は、1つ目の分岐ではA=0・B=0なのでNo、2つ目の分岐もA=0・C=2なのでNoです。(2)は、1つ目の分岐でA=0・B=1なのでNo、2つ目の分岐もA=0・C=2なのでNoです。(3)は、1つ目の分岐ではA=1・B=0なのでYes、2つ目の分岐もA=1・C=1なのでYesです。<br/>分岐網羅を満たしますが、テストケース(1)と(2)は冗長です。どちらか1つあれば十分なので最少ではありません。<div class=\"img_margin\"><img alt=\"47e.png/image-size:300×132\" height=\"132\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/47e.png\" style=\"max-width: 100%; height: auto;\" width=\"300\"/></div></li></ul>なお、網羅性のレベルには判定条件網羅の他にも次のようなものあります。<dl><dt>命令網羅(網羅性:低い↑)</dt><dd>すべての命令を少なくとも1回は実行するテストケースを設計する。</dd><dt>分岐網羅(判定条件網羅)</dt><dd>判定条件の真偽を少なくとも1回は実行するテストケースを設計する。</dd><dt>条件網羅</dt><dd>判定条件が複数ある場合に、それぞれの条件が真・偽の場合を組み合わせたテストケースを設計する。</dd><dt>判定条件・条件網羅</dt><dd>判定条件網羅と条件網羅を組み合わせてテストケースを設計する。</dd><dt>複数条件網羅(網羅性:高↓)</dt><dd>判定条件のすべての可能な結果の組合せを網羅し、かつ、すべての命令を少なくとも1回は実行するようにテストケースを作成する。</dd></dl></div>", "mondai_html": "次の流れ図において，判定条件網羅(分岐網羅)を満たす最少のテストケースはどれか。<div class=\"img_margin\"><img alt=\"47.png/image-size:244×351\" height=\"351\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/47.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"244\"/></div>", "choices_html": {"ア": "(1) A＝0，B＝0　(2) A＝1，B＝1", "イ": "(1) A＝1，B＝0　(2) A＝1，B＝1", "ウ": "(1) A＝0，B＝0　(2) A＝1，B＝1　(3) A＝1，B＝0", "エ": "(1) A＝0，B＝0　(2) A＝0，B＝1　(3) A＝1，B＝0"}}, {"id": "03_aki_q3", "session": "R3秋", "gap": 7, "num": 3, "topic": "ディープラーニングに関連が深いもの", "subcat": "情報に関する理論", "category": "テクノロジ系", "mondai": "AIにおけるディープラーニングに最も関連が深いものはどれか。", "choices": {"ア": "ある特定の分野に特化した知識を基にルールベースの推論を行うことによって，専門家と同じレベルの問題解決を行う。", "イ": "試行錯誤しながら条件を満たす解に到達する方法であり，場合分けを行い深さ優先で探索し，解が見つからなければ一つ前の場合分けの状態に後戻りする。", "ウ": "神経回路網を模倣した方法であり，多層に配置された素子とそれらを結ぶ信号線で構成されたモデルにおいて，信号線に付随するパラメータを調整することによって入力に対して適切な解が出力される。", "エ": "生物の進化を模倣した方法であり，与えられた問題の解の候補を記号列で表現して，それらを遺伝子に見立てて突然変異，交配，とう汰を繰り返して逐次的により良い解に近づける。"}, "ans": "ウ", "hist_count": 1, "past_history": ["応用情報技術者 H30春期 問1"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ディープラーニング</strong>(DeepLearning)は、人間や動物の<em class=\"r\">脳神経</em>をモデル化したアルゴリズム(ニューラルネットワーク)を多層化したものを用意し、それに「十分な量のデータを与えることで、人間の力なしに自動的に特徴点やパターンを学習させる」ことをいいます。<br/><br/>ディープラーニングでは、脳の神経細胞であるニューロンの信号伝達をパーセプトロンというアルゴリズムで模倣し、それを大量かつ幾層にもに繋ぎ合わせた疑似的な脳神経網ネットワークを使用して学習を行います。<div class=\"img_margin\"><img alt=\"03.png/image-size:510×299\" height=\"299\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/03.png\" style=\"max-width: 100%; height: auto;\" width=\"510\"/></div>このネットワークに大量の学習用データ(入力値と正しい解の組み)を与え、損失関数や勾配法、誤差逆伝播法などの数学的なアプローチを用いて、出力と正しい解の差異が最小になるように中間層のパラメータ(重みとしきい値)を自動調整していきます。この仕組みにより、入力に対して最適解を出力するシステム(学習モデル)を得るのがディープラーニングです。学習させるデータが多いほど判定の精度も高まっていきます。<ul><li class=\"lia\">エキスパートシステムに関する記述です。</li><li class=\"lii\">木構造やグラフ構造に対する「深さ優先探索」に関する記述です。</li><li class=\"liu\">正しい。ディープラーニングに関する記述です。</li><li class=\"lie\">コンピュータの制御に偶発的な要素を取り入れる「遺伝的アルゴリズム」に関する記述です。</li></ul></div>", "mondai_html": "AIにおけるディープラーニングに最も関連が深いものはどれか。", "choices_html": {"ア": "ある特定の分野に特化した知識を基にルールベースの推論を行うことによって，専門家と同じレベルの問題解決を行う。", "イ": "試行錯誤しながら条件を満たす解に到達する方法であり，場合分けを行い深さ優先で探索し，解が見つからなければ一つ前の場合分けの状態に後戻りする。", "ウ": "神経回路網を模倣した方法であり，多層に配置された素子とそれらを結ぶ信号線で構成されたモデルにおいて，信号線に付随するパラメータを調整することによって入力に対して適切な解が出力される。", "エ": "生物の進化を模倣した方法であり，与えられた問題の解の候補を記号列で表現して，それらを遺伝子に見立てて突然変異，交配，とう汰を繰り返して逐次的により良い解に近づける。"}}, {"id": "03_aki_q11", "session": "R3秋", "gap": 7, "num": 11, "topic": "磁気ディスク装置", "subcat": "入出力装置", "category": "テクノロジ系", "mondai": "表に示す仕様の磁気ディスク装置において，1,000バイトのデータの読取りに要する平均時間は何ミリ秒か。こ
