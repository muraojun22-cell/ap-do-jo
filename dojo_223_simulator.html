<span class=\"ol\">A</span>－B", "イ": "(<span class=\"ol\">A</span>∪<span class=\"ol\">B</span>)－(A∩B)", "ウ": "(S－A)∪(S－B)", "エ": "S－(A∩B)"}}, {"id": "03_aki_q15", "session": "R3秋", "gap": 7, "num": 15, "topic": "1分当たりの最大処理件数", "subcat": "システムの評価指標", "category": "テクノロジ系", "mondai": "1件のデータを処理する際に，読取りには40ミリ秒，CPU処理には30ミリ秒，書込みには50ミリ秒掛かるプログラムがある。このプログラムで，n件目の書込みと並行してn＋1件目のCPU処理とn＋2件目の読取りを実行すると，1分当たりの最大データ処理件数は幾つか。ここで，OSのオーバーヘッドは考慮しないものとする。", "choices": {"ア": "500", "イ": "666", "ウ": "750", "エ": "1,200"}, "ans": "エ", "hist_count": 5, "past_history": ["応用情報技術者 R1秋期 問15", "応用情報技術者 H25秋期 問15", "応用情報技術者 H27春期 問13", "ソフトウェア開発技術者 H17春期 問31", "ソフトウェア開発技術者 H19春期 問33"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">並列処理の流れを整理して図で表すと次のようになります。<div class=\"img_margin\"><img alt=\"15.png/image-size:529×210\" height=\"210\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/15.png\" style=\"max-width: 100%; height: auto;\" width=\"529\"/></div>上図の赤枠部分を見るとわかるように、50ミリ秒を要する書込み処理が並列処理のボトルネックとなり、1分間に処理できる書込み件数がそのまま最大データ処理件数に相当することがわかります。<br/><br/>1分は「60秒×1,000ミリ秒＝60,000ミリ秒」なので、1分当たりの最大データ処理件数は、<br/><br/>　60,000ミリ秒÷50ミリ秒＝1,200件<br/><br/>したがって「エ」の<em class=\"r\">1,200件</em>が適切です。</div>", "mondai_html": "1件のデータを処理する際に，読取りには40ミリ秒，CPU処理には30ミリ秒，書込みには50ミリ秒掛かるプログラムがある。このプログラムで，n件目の書込みと並行してn＋1件目のCPU処理とn＋2件目の読取りを実行すると，1分当たりの最大データ処理件数は幾つか。ここで，OSのオーバーヘッドは考慮しないものとする。", "choices_html": {"ア": "500", "イ": "666", "ウ": "750", "エ": "1,200"}}, {"id": "03_aki_q21", "session": "R3秋", "gap": 7, "num": 21, "topic": "ウォッチドッグタイマーの機能", "subcat": "ハードウェア", "category": "テクノロジ系", "mondai": "組込みシステムにおける，ウォッチドッグタイマーの機能はどれか。", "choices": {"ア": "あらかじめ設定された一定時間内にタイマーがクリアされなかった場合，システム異常とみなしてシステムをリセット又は終了する。", "イ": "システム異常を検出した場合，タイマーで設定された時間だけ待ってシステムに通知する。", "ウ": "システム異常を検出した場合，マスカブル割込みでシステムに通知する。", "エ": "システムが一定時間異常であった場合，上位の管理プログラムを呼び出す。"}, "ans": "ア", "hist_count": 5, "past_history": ["応用情報技術者 R1秋期 問21", "応用情報技術者 H21春期 問23", "応用情報技術者 H25春期 問23", "応用情報技術者 H26秋期 問22", "応用情報技術者 H29秋期 問22"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ウォッチドッグタイマー</strong>(Watchdog Timer)とは、システムに異常が発生したことを検知し、それを通知する目的で設定されるタイマーです。ウォッチドッグには、英語で番犬という意味があります。<br/><br/>タイマーには適切な時間がセットされていて、システムが正常なときは一定間隔でタイマーの経過時間をリセットしています。しかし、システムに異常が起こるとリセットが行われなくなり、タイマーのカウントが増加し続けることになります。<br/>「設定した時間内にリセットが行われなかったのは、システムに異常が起きている」と考えられるので、ウォッチドッグタイマーに設定された時間が経過した場合は<em class=\"r\">ノンマスカブル割込み</em>を発生させ、システムに異常を通知するという仕組みになっています。<ul><li class=\"lia\">正しい。</li><li class=\"lii\">システム異常を検知した場合、即座にシステムに通知します。</li><li class=\"liu\">システムへの通知はノンマスカブル割込みで行われます。</li><li class=\"lie\">割込みを発生させてシステムに通知します。</li></ul><dl><dt>マスカブル割込み</dt><dd>その発生を抑制できる割込みのこと。ノンマスカブル割込みは発生を抑制できない割込みということになる。</dd></dl></div>", "mondai_html": "組込みシステムにおける，ウォッチドッグタイマーの機能はどれか。", "choices_html": {"ア": "あらかじめ設定された一定時間内にタイマーがクリアされなかった場合，システム異常とみなしてシステムをリセット又は終了する。", "イ": "システム異常を検出した場合，タイマーで設定された時間だけ待ってシステムに通知する。", "ウ": "システム異常を検出した場合，マスカブル割込みでシステムに通知する。", "エ": "システムが一定時間異常であった場合，上位の管理プログラムを呼び出す。"}}, {"id": "03_haru_q5", "session": "R3春", "gap": 8, "num": 5, "topic": "データの出力順序は何通りあるか", "subcat": "データ構造", "category": "テクノロジ系", "mondai": "A，B，Cの順序で入力されるデータがある。各データについてスタックへの挿入と取出しを1回ずつ行うことができる場合，データの出力順序は何通りあるか。", "choices": {"ア": "3", "イ": "4", "ウ": "5", "エ": "6"}, "ans": "ウ", "hist_count": 5, "past_history": ["応用情報技術者 R7春期 問5", "応用情報技術者 H24春期 問6", "応用情報技術者 H28春期 問5", "ソフトウェア開発技術者 H15春期 問10", "ソフトウェア開発技術者 H19秋期 問9"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">A，B，Cの出力順序としては「3!＝6種類」があります。それぞれが出力可能であるかを検証します。<dl><dt>A，B，C</dt><dd>push(A) → pop → push(B) → pop → push(C) → pop の順序で出力可能です。<div class=\"img_margin\"><img alt=\"05_1.png/image-size:406×133\" height=\"133\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/05_1.png\" style=\"max-width: 100%; height: auto;\" width=\"406\"/></div></dd><dt>A，C，B</dt><dd>push(A) → pop → push(B) → push(C) → pop → pop の順序で出力可能です。<div class=\"img_margin\"><img alt=\"05_2.png/image-size:406×133\" height=\"133\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/05_2.png\" style=\"max-width: 100%; height: auto;\" width=\"406\"/></div></dd><dt>B，A，C</dt><dd>push(A) → push(B) → pop → pop → push(C) → pop の順序で出力可能です。<div class=\"img_margin\"><img alt=\"05_3.png/image-size:406×133\" height=\"133\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/05_3.png\" style=\"max-width: 100%; height: auto;\" width=\"406\"/></div></dd><dt>B，C，A</dt><dd>push(A) → push(B) → pop → push(C) → pop → pop の順序で出力可能です。<div class=\"img_margin\"><img alt=\"05_4.png/image-size:406×133\" height=\"133\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/05_4.png\" style=\"max-width: 100%; height: auto;\" width=\"406\"/></div></dd><dt>C，A，B</dt><dd>push(A) → push(B) → push(C) → pop → pop ❌<br/>※Cの出力後、Bより先にAを出力することができないため無理な順序です。<div class=\"img_margin\"><img alt=\"05_5.png/image-size:346×133\" height=\"133\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/05_5.png\" style=\"max-width: 100%; height: auto;\" width=\"346\"/></div></dd><dt>C，B，A</dt><dd>push(A) → push(B) → push(C) → pop → pop → pop の順序で出力可能です。<div class=\"img_margin\"><img alt=\"05_6.png/image-size:406×133\" height=\"133\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/05_6.png\" style=\"max-width: 100%; height: auto;\" width=\"406\"/></div></dd></dl>以上より、データの出力順序は5通りになります。したがって「ウ」が正解です。<br/><br/>スタックの構造上、後からpushされた要素を出力した後、その要素より2つ以上前にpushされた要素を続けて出力することはできません。</div>", "mondai_html": "A，B，Cの順序で入力されるデータがある。各データについてスタックへの挿入と取出しを1回ずつ行うことができる場合，データの出力順序は何通りあるか。<div class=\"img_margin\"><img alt=\"05.png/image-size:164×110\" height=\"110\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/05.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"164\"/></div>", "choices_html": {"ア": "3", "イ": "4", "ウ": "5", "エ": "6"}}, {"id": "05_haru_q9", "session": "R5春", "gap": 4, "num": 9, "topic": "パイプライン制御", "subcat": "プロセッサ", "category": "テクノロジ系", "mondai": "全ての命令が5ステージで完了するように設計された，パイプライン制御のCPUがある。20命令を実行するには何サイクル必要となるか。ここで，全ての命令は途中で停止することなく実行でき，パイプラインの各ステージは1サイクルで動作を完了するものとする。", "choices": {"ア": "20", "イ": "21", "ウ": "24", "エ": "25"}, "ans": "ウ", "hist_count": 4, "past_history": ["応用情報技術者 H28秋期 問8", "基本情報技術者 H17秋期 問17", "ソフトウェア開発技術者 H16春期 問19", "ソフトウェア開発技術者 H19春期 問16"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>パイプライン制御</b>は、CPUが実行する命令を、命令読出し(フェッチ)、解読(デコード)、アドレス計算、オペランド呼出し、実行 というような複数のステージに分け、各ステージを少しずつずらしつつ独立した処理機構で並列に実行することで、処理時間全体を短縮させるCPUの高速化技法です。<div class=\"img_margin\"><img alt=\"09_1.png/image-size:455×279\" height=\"279\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/09_1.png\" style=\"max-width: 100%; height: auto;\" width=\"455\"/></div>設問には5ステージとあるので、1命令が5つのステージに分割されているとわかります。下図のようにそれぞれのサイクルは並列実行されるため、20命令を実行するのに必要なサイクル数は<em class=\"r\">24サイクル</em>となります。<div class=\"img_margin\"><img alt=\"09_2.png/image-size:538×415\" height=\"415\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/09_2.png\" style=\"max-width: 100%; height: auto;\" width=\"538\"/></div>また、パイプラインの処理時間を求める公式<span class=\"code\">(I＋D－1)×P</span>を用いても計算することができます。<dl><dt>パイプラインの処理時間を求める公式</dt><dd><strong>(I＋D－1)×P</strong><br/>I：命令数<br/>D：パイプラインの深さ（命令の分割数）<br/>P：パイプラインのピッチ（各ステージの実行時間）</dd></dl>本問だと、命令数(I)が20、パイプラインの深さ(D)が5、パイプラインのピッチが1サイクルなので、<br/><br/>　(20＋5－1)×1＝24サイクル<br/><br/>したがって「ウ」が正解です。</div>", "mondai_html": "全ての命令が5ステージで完了するように設計された，パイプライン制御のCPUがある。20命令を実行するには何サイクル必要となるか。ここで，全ての命令は途中で停止することなく実行でき，パイプラインの各ステージは1サイクルで動作を完了するものとする。", "choices_html": {"ア": "20", "イ": "21", "ウ": "24", "エ": "25"}}, {"id": "05_haru_q14", "session": "R5春", "gap": 4, "num": 14, "topic": "CPUと磁気ディスク装置の使用率", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "CPUと磁気ディスク装置で構成されるシステムで，表に示すジョブA，Bを実行する。この二つのジョブが実行を終了するまでのCPUの使用率と磁気ディスク装置の使用率との組み合わせのうち，適切なものはどれか。ここで，ジョブA，Bはシステムの動作開始時点ではいずれも実行可能状態にあり，A，Bの順で実行される。CPU及び磁気ディスク装置は，ともに一つの要求だけを発生順に処理する。ジョブA，Bとも，CPUの処理を終了した後，磁気ディスク装置の処理を実行する。", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "イ", "hist_count": 4, "past_history": ["応用情報技術者 H21春期 問17", "応用情報技術者 H24秋期 問15", "応用情報技術者 H29春期 問13", "ソフトウェア開発技術者 H17秋期 問32"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">各1つのCPUと磁気ディスク装置を使い、ジョブA→Bの順で処理をすると、CPUと磁気ディスクの使用状況は下の図で示すようになります。<div class=\"img_margin\"><img alt=\"14_1.png/image-size:544×80\" height=\"80\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/14_1.png\" style=\"max-width: 100%; height: auto;\" width=\"544\"/></div>2つのジョブが終了するまでに要する時間は25秒で、そのうち色が付いている部分が各機器を使用している時間です。<ul><li>CPUの使用率　15秒÷25秒＝0.60</li><li>磁気ディスク装置の使用率　17秒÷25秒＝0.68</li></ul>したがって「イ」の組合せが正解です。</div>", "mondai_html": "CPUと磁気ディスク装置で構成されるシステムで，表に示すジョブA，Bを実行する。この二つのジョブが実行を終了するまでのCPUの使用率と磁気ディスク装置の使用率との組み合わせのうち，適切なものはどれか。ここで，ジョブA，Bはシステムの動作開始時点ではいずれも実行可能状態にあり，A，Bの順で実行される。CPU及び磁気ディスク装置は，ともに一つの要求だけを発生順に処理する。ジョブA，Bとも，CPUの処理を終了した後，磁気ディスク装置の処理を実行する。<div class=\"img_margin\"><img alt=\"14.png/image-size:375×94\" height=\"94\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/14.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"375\"/></div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表・図\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/14a.png\" style=\"max-width: 100%; height: auto; display: inline-block; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}}, {"id": "05_haru_q16", "session": "R5春", "gap": 4, "num": 16, "topic": "システムの稼働率", "subcat": "システムの評価指標", "category": "テクノロジ系", "mondai": "3台の装置X～Zを接続したシステムA，Bの稼働率に関する記述のうち，適切なものはどれか。ここで，3台の装置の稼働率は，いずれも0より大きく1より小さいものとし，並列に接続されている部分は，どちらか一方が稼働していればよいものとする。", "choices": {"ア": "各装置の稼働率の値によって，AとBの稼働率のどちらが高いかは変化する。", "イ": "常にAとBの稼働率は等しい。", "ウ": "常にAの稼働率はBより高い。", "エ": "常にBの稼働率はAより高い。"}, "ans": "エ", "hist_count": 4, "past_history": ["応用情報技術者 H21春期 問16", "応用情報技術者 H22秋期 問17", "応用情報技術者 H25春期 問16", "応用情報技術者 H30秋期 問14"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">稼働率がそれぞれR<sub>a</sub>、R<sub>b</sub>の機器がある場合、2つが直列接続されているときの全体としての稼働率は<span class=\"code\">R<sub>a</sub>×R<sub>b</sub></span>、並列で接続されているときの稼働率は<span class=\"code\">1－(1－R<sub>a</sub>)(1－R<sub>b</sub>)</span>の式で表すことができます。<br/><br/>3つの装置X～Zの稼働率をそれぞれx～zとすると、システムA、Bの稼働率は次の式で表せます。<br/><br/>【システムA】<br/>　(1－(1－x)(1－y))・z<br/>＝(1－(1－x－y＋xy))・z<br/>＝(x＋y－xy)・z<br/>＝<strong>xz＋yz－xyz</strong><br/><br/>【システムB】<br/>　1－(1－x・z)(1－y)<br/>＝1－(1－y－xz＋xyz)<br/>＝<strong>xz＋y－xyz</strong><br/><br/>2つの式を比較すると「xz－xyz」の部分は同じで、異なるのは「yz」と「y」の項だけです。3台の装置の稼働率は、いずれも0より大きく1より小さいので、常に「yz＜y」の関係となり、結果として以下の式が成り立ちます。<br/><br/>　xz＋yz－xyz＜xz＋y－xyz<br/>（Aの稼働率＜Bの稼働率）<br/>　<br/>したがって、「常にBの稼働率が高い」という記述が適切です。</div>", "mondai_html": "3台の装置X～Zを接続したシステムA，Bの稼働率に関する記述のうち，適切なものはどれか。ここで，3台の装置の稼働率は，いずれも0より大きく1より小さいものとし，並列に接続されている部分は，どちらか一方が稼働していればよいものとする。<div class=\"img_margin\"><img alt=\"16.png/image-size:410×100\" height=\"100\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/16.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"410\"/></div>", "choices_html": {"ア": "各装置の稼働率の値によって，AとBの稼働率のどちらが高いかは変化する。", "イ": "常にAとBの稼働率は等しい。", "ウ": "常にAの稼働率はBより高い。", "エ": "常にBの稼働率はAより高い。"}}, {"id": "04_aki_q2", "session": "R4秋", "gap": 5, "num": 2, "topic": "カルノー図と等価な論理式", "subcat": "離散数学", "category": "テクノロジ系", "mondai": "A，B，C，Dを論理変数とするとき，次のカルノー図と等価な論理式はどれか。ここで，・は論理積，＋は論理和， X はXの否定を表す。", "choices": {"ア": "A・B・C・D＋B・D", "イ": "A・B・C・D＋B・D", "ウ": "A・B・D＋B・D", "エ": "A・B・D＋B・D"}, "ans": "エ", "hist_count": 4, "past_history": ["応用情報技術者 R7秋期 問1", "応用情報技術者 H26秋期 問1", "ソフトウェア開発技術者 H17秋期 問5", "ソフトウェア開発技術者 H19春期 問5"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>カルノー図</strong>は、行・列それぞれの論理変数の組合せの結果が\"真\"となる場合に\"1\"を、\"偽\"となる場合に\"0\"を、その該当セルに書きこむことで論理式を図式化したものです。論理回路を簡略化するために用いられます。<br/><br/>設問のカルノー図の\"1\"と\"0\"、4つの論理変数は下図のように対応します。<div class=\"img_margin\"><img alt=\"02_1.png/image-size:329×169\" height=\"169\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/02_1.png\" style=\"max-width: 100%; height: auto;\" width=\"329\"/></div>カルノー図から論理式を導くには、図中の値が\"1\"のセルをグループ化して共通項を取り出すという手順を踏みます。このグループ化は次の4つのルールに従って行います。<ol><li>値が\"1\"のセルすべてを長方形で囲むこと</li><li>グループに含まれるセルの数は2<sup>n</sup>（1, 2, 4, 8, …）であること</li><li>カルノー図の上下左右の端は連続していると考える</li><li>1つのセルが複数のグループに属してもよい</li></ol>このルールに従って設問のカルノー図をグループ化すると、下図のように2つの長方形ですべての\"1\"を囲むことができます。<div class=\"img_margin\"><img alt=\"02_2.png/image-size:250×145\" height=\"145\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/02_2.png\" style=\"max-width: 100%; height: auto;\" width=\"250\"/></div>次にグループごとに論理変数の組から共通項を取り出して、その論理積を作ります。<dl><dt>赤枠で囲ったグループ</dt><dd>論理変数の組は <span class=\"ol\">A</span> <span class=\"ol\">B</span> <span class=\"ol\">C</span> <span class=\"ol\">D</span> と <span class=\"ol\">A</span> <span class=\"ol\">B</span> C <span class=\"ol\">D</span> なので、共通項は <span class=\"ol\">A</span> <span class=\"ol\">B</span> <span class=\"ol\">D</span>、論理積は <em class=\"r\"><span class=\"ol\">A</span>・<span class=\"ol\">B</span>・<span class=\"ol\">D</span></em></dd><dt>青枠で囲ったグループ</dt><dd>論理変数の組は <span class=\"ol\">A</span> B <span class=\"ol\">C</span> D、<span class=\"ol\">A</span> B C D、A B <span class=\"ol\">C</span> D、A B C D なので、共通項はB D、論理積は<em class=\"r\">B・D</em></dd></dl>最後に、グループごとの論理積同士を論理和でつなぐことで、図と等価な論理式が得られます。<br/><br/>赤枠グループの論理積は「<span class=\"ol\">A</span>・<span class=\"ol\">B</span>・<span class=\"ol\">D</span>」、青枠グループの論理積は「B・D」であり、この2つを論理和（＋）でつなぐと「<span class=\"ol\">A</span>・<span class=\"ol\">B</span>・<span class=\"ol\">D</span>＋B・D」になります。したがって「エ」が正解です。</div>", "mondai_html": "A，B，C，Dを論理変数とするとき，次のカルノー図と等価な論理式はどれか。ここで，・は論理積，＋は論理和，<span class=\"ol\">X</span>はXの否定を表す。<div class=\"img_margin\"><img alt=\"02.png/image-size:235×154\" height=\"154\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/02.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"235\"/></div>", "choices_html": {"ア": "A・B・<span class=\"ol\">C</span>・D＋<span class=\"ol\">B</span>・<span class=\"ol\">D</span>", "イ": "<span class=\"ol\">A</span>・<span class=\"ol\">B</span>・<span class=\"ol\">C</span>・<span class=\"ol\">D</span>＋B・D", "ウ": "A・B・D＋<span class=\"ol\">B</span>・<span class=\"ol\">D</span>", "エ": "<span class=\"ol\">A</span>・<span class=\"ol\">B</span>・<span class=\"ol\">D</span>＋B・D"}}, {"id": "04_aki_q16", "session": "R4秋", "gap": 5, "num": 16, "topic": "デッドロックの発生を防ぐ方法", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "二つのタスクが共用する二つの資源を排他的に使用するとき，デッドロックが発生するおそれがある。このデッドロックの発生を防ぐ方法はどれか。", "choices": {"ア": "一方のタスクの優先度を高くする。", "イ": "資源獲得の順序を両方のタスクで同じにする。", "ウ": "資源獲得の順序を両方のタスクで逆にする。", "エ": "両方のタスクの優先度を同じにする。"}, "ans": "イ", "hist_count": 4, "past_history": ["応用情報技術者 R7秋期 問18", "応用情報技術者 H31春期 問18", "ソフトウェア開発技術者 H18春期 問26", "ソフトウェア開発技術者 H20秋期 問25"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>デッドロック</strong>は、共有資源を使用する2つ以上のプロセスが、互いに相手プロセスが必要とする資源を排他的に使用していて、互いのプロセスが相手の使用している資源の解放を待っている状態です。デッドロックが発生すると双方のプロセスが永遠に待ち状態になってしまい、処理の続行ができなくなってしまいます。<div class=\"img_margin\"><img alt=\"16.png/image-size:312×159\" height=\"159\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/16.png\" style=\"max-width: 100%; height: auto;\" width=\"312\"/></div><ul><li class=\"lia\">一方のタスクの優先度を上げても、他方のタスクが保持している資源はそのことで解放されないため、デッドロックは防止できません。</li><li class=\"lii\">正しい。デッドロックの発生を防ぐには、共有資源の使用順序を同じにします。仮にタスクAが「X→Y→Z」という順で資源を獲得をするなら、タスクBも同じく「X→Y→Z」で資源を獲得するようにします。</li><li class=\"liu\">デッドロックは、複数のタスク間で資源獲得の順番が異なるときに起こります。資源の取得順を逆にすれば、デッドロックが発生しやすくなります。</li><li class=\"lie\">タスクの優先度を揃えても、デッドロックの発生を防ぐことはできません。</li></ul></div>", "mondai_html": "二つのタスクが共用する二つの資源を排他的に使用するとき，デッドロックが発生するおそれがある。このデッドロックの発生を防ぐ方法はどれか。", "choices_html": {"ア": "一方のタスクの優先度を高くする。", "イ": "資源獲得の順序を両方のタスクで同じにする。", "ウ": "資源獲得の順序を両方のタスクで逆にする。", "エ": "両方のタスクの優先度を同じにする。"}}, {"id": "04_aki_q34", "session": "R4秋", "gap": 5, "num": 34, "topic": "IPの上位階層のプロトコル", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "IPの上位階層のプロトコルとして，コネクションレスのデータグラム通信を実現し，信頼性のための確認応答や順序制御などの機能をもたないプロトコルはどれか。", "choices": {"ア": "ICMP", "イ": "PPP", "ウ": "TCP", "エ": "UDP"}, "ans": "エ", "hist_count": 4, "past_history": ["応用情報技術者 H23秋期 問37", "応用情報技術者 H26秋期 問33", "ソフトウェア開発技術者 H16春期 問62", "ソフトウェア開発技術者 H19秋期 問51"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q34.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>UDP</strong>(User Datagram Protocol)は、IPの上位層として使われる伝送制御プロトコルの一つで、<em class=\"r\">コネクションレス型</em>の通信を提供するプロトコルです。コネクションレスとは通信する相手との接続を確認せずに、一方的にデータを送り付けるという意味です。<br/><br/>同じく伝送制御プロトコルであるTCP(Transmission Control Protocol)が、通信の信頼性を保証するために3ウェイハンドシェイク、誤り制御、再送制御、順序制御、輻輳制御などの機能を有しているのに対して、UDPはこれらを一切持ちません。しかし、その分TCPと比べて処理が軽くデータグラム中のデータ比率も高まるため、応答性を重視するDNSやDHCP、NTPなどのプロトコルや、途中でデータが抜け落ちても問題が少ない音声や画像のストリーミング配信などで用いられています。<ul><li class=\"lia\">Internet Control Message Protocolの略。インターネットプロトコル(IP)の通信制御を補完するプロトコルで、データ配送中のエラー通知や送達エラーを通知する機能を持ちます。</li><li class=\"lii\">Point-to-Point Protocolの略。電話回線を通じてコンピュータをネットワークに接続するダイヤルアップ接続で使われる、2点間を接続してデータ通信を行うための通信プロトコルです。</li><li class=\"liu\">Transmission Control Protocolの略。TCP/IPのネットワークにおいて送達管理や、伝送管理などの機能を持つコネクション型のプロトコルです。SYNパケットとACKパケットのやり取りによってコネクション確立を行う3ウェイハンドシェイクを行います。</li><li class=\"lie\">正しい。UDPはコネクションレス型の伝送制御プロトコルです。</li></ul></div>", "mondai_html": "IPの上位階層のプロトコルとして，コネクションレスのデータグラム通信を実現し，信頼性のための確認応答や順序制御などの機能をもたないプロトコルはどれか。", "choices_html": {"ア": "ICMP", "イ": "PPP", "ウ": "TCP", "エ": "UDP"}}, {"id": "04_aki_q46", "session": "R4秋", "gap": 5, "num": 46, "topic": "ウォークスルー", "subcat": "ソフトウェア方式設計・詳細設計", "category": "テクノロジ系", "mondai": "仕様書やソースコードといった成果物について，作成者を含めた複数人で，記述されたシステムやソフトウェアの振る舞いを机上でシミュレートして，問題点を発見する手法はどれか。", "choices": {"ア": "ウォークスルー", "イ": "サンドイッチテスト", "ウ": "トップダウンテスト", "エ": "並行シミュレーション"}, "ans": "ア", "hist_count": 4, "past_history": ["応用情報技術者 H25秋期 問46", "基本情報技術者 H13春期 問50", "基本情報技術者 H18春期 問43", "基本情報技術者 H23特別 問47"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q46.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ウォークスルー</strong>は、設計上の誤りを早期に発見することを目的として、各工程の終了時点で、作成者を含めた複数の関係者が設計書やソースコードを検査するデザインレビューの手法です。①原則として管理者には参加させない、②誤りの発見を目的としその場で解決策を議論しない、③事前に資料を配布しておくことで短時間で効率よく行うなどの特徴があります。<ul><li class=\"lia\">正しい。ウォークスルーは、開発メンバーが行う設計書やソースコードの検査です。</li><li class=\"lii\">サンドイッチテスト(折衷テスト)は、トップダウンテストとボトムアップテストを組み合わせて行う結合テストです。最上位モジュールと最下位モジュールの両方から開始し、1段ずつ結合しながら中間モジュールに至るまでテストを進めます。</li><li class=\"liu\">トップダウンテストは、結合テストのときに上位のモジュールから下位のモジュールへと順に結合しながらテストをしていく手法です。</li><li class=\"lie\">並行シミュレーションは、別途用意したテスト用のプログラムと検証対象のプログラムに同じデータを入力して出力値を比較する手法です。</li></ul></div>", "mondai_html": "仕様書やソースコードといった成果物について，作成者を含めた複数人で，記述されたシステムやソフトウェアの振る舞いを机上でシミュレートして，問題点を発見する手法はどれか。", "choices_html": {"ア": "ウォークスルー", "イ": "サンドイッチテスト", "ウ": "トップダウンテスト", "エ": "並行シミュレーション"}}, {"id": "04_haru_q28", "session": "R4春", "gap": 6, "num": 28, "topic": "正規形と特徴の組合せ", "subcat": "データベース設計", "category": "テクノロジ系", "mondai": "第1，第2，第3正規形とリレーションの特徴a，b，cの組合せのうち，適切なものはどれか。 どの非キー属性も，主キーの真部分集合に対して関数従属しない。 どの非キー属性も，主キーに推移的に関数従属しない。 繰返し属性が存在しない。", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "ウ", "hist_count": 4, "past_history": ["応用情報技術者 H24春期 問27", "応用情報技術者 H30秋期 問28", "ソフトウェア開発技術者 H17秋期 問64", "ソフトウェア開発技術者 H20秋期 問62"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q28.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">第1、第2、第3正規形の条件は以下の通りです。ここで、関数従属とは一方の属性集合の値 (の集合) がもう一方の属性集合の値 (の集合) を一意に決定する関係のことをいいます。<dl><dt>第1正規形</dt><dd>全ての属性が単一値である状態</dd><dt>第2正規形</dt><dd>第1正規形を満たし、かつ、主キーに部分関数従属する（主キーの真部分集合に関数従属する）属性が存在しない状態</dd><dt>第3正規形</dt><dd>第2正規形を満たし、かつ、主キーからの推移的関数従属が存在しない状態</dd></dl>第1正規形がc，第2正規形がa，第3正規形がbなので、正しい組合せは「ウ」です。</div>", "mondai_html": "第1，第2，第3正規形とリレーションの特徴a，b，cの組合せのうち，適切なものはどれか。<br/><br/><ol type=\"a\"><li>どの非キー属性も，主キーの真部分集合に対して関数従属しない。</li><li>どの非キー属性も，主キーに推移的に関数従属しない。</li><li>繰返し属性が存在しない。</li></ol><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表・図\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/28.png\" style=\"max-width: 100%; height: auto; display: inline-block; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}}, {"id": "03_aki_q16", "session": "R3秋", "gap": 7, "num": 16, "topic": "ページング方式で処理能力が低下する現象", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "ページング方式の仮想記憶において，ページ置換えの発生頻度が高くなり，システムの処理能力が急激に低下することがある。このような現象を何と呼ぶか。", "choices": {"ア": "スラッシング", "イ": "スワップアウト", "ウ": "フラグメンテーション", "エ": "ページフォールト"}, "ans": "ア", "hist_count": 4, "past_history": ["応用情報技術者 R6秋期 問17", "応用情報技術者 H24春期 問21", "応用情報技術者 H29秋期 問17", "ソフトウェア開発技術者 H17秋期 問23"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">仮想記憶システムにおいて、主記憶の容量が十分でない状態で同時に実行されるプログラム数が増えると、ページング処理が頻繁に発生し、システムのオーバーヘッド（間接的な負荷）が増加します。これによって、アプリケーション処理に割り当てられるCPU時間が減少し、システムの処理能力が低下する現象を<strong>スラッシング</strong>(Thrashing)といいます。<ul><li class=\"lia\">正しい。スラッシングは、ページング処理の多発により処理効率が著しく低下する現象です。</li><li class=\"lii\">スワップアウトは、主記憶を効率的に利用するために、主記憶上で長い間待ち状態となっているプログラムを実行状態のまま補助記憶上の領域に退避させることです。</li><li class=\"liu\">フラグメンテーションは、主記憶や補助記憶装置の記憶領域の中に使用されない領域の断片が多く存在した状態になる現象です。連続したメモリ領域を確保しにくくなるのでアクセス効率が低下します。</li><li class=\"lie\">ページフォールトは、ページング方式において要求されたページが主記憶上に存在しないときに発生する割込みです。</li></ul></div>", "mondai_html": "ページング方式の仮想記憶において，ページ置換えの発生頻度が高くなり，システムの処理能力が急激に低下することがある。このような現象を何と呼ぶか。", "choices_html": {"ア": "スラッシング", "イ": "スワップアウト", "ウ": "フラグメンテーション", "エ": "ページフォールト"}}, {"id": "03_aki_q31", "session": "R3秋", "gap": 7, "num": 31, "topic": "ブロードキャストフレーム", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "イーサネットで用いられるブロードキャストフレームによるデータ伝送の説明として，適切なものはどれか。", "choices": {"ア": "同一セグメント内の全てのノードに対して，送信元が一度の送信でデータを伝送する。", "イ": "同一セグメント内の全てのノードに対して，送信元が順番にデータを伝送する。", "ウ": "同一セグメント内の選択された複数のノードに対して，送信元が一度の送信でデータを伝送する。", "エ": "同一セグメント内の選択された複数のノードに対して，送信元が順番にデータを伝送する。"}, "ans": "ア", "hist_count": 4, "past_history": ["応用情報技術者 H25秋期 問34", "応用情報技術者 H30秋期 問33", "基本情報技術者 H19秋期 問57", "ソフトウェア開発技術者 H17秋期 問59"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q31.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ブロードキャスト</strong>とは、あるネットワークに属するすべてのノードに対してデータを<em class=\"r\">同時伝送</em>することです。<br/><br/>ブロードキャストを行うには、IPアドレスのホスト部のビットをすべて「1」にしたアドレスを宛先に設定します。このホスト部が全て1のフレームを「ブロードキャストフレーム」といいます。1つのノードから送信されたブロードキャストフレームは、ブリッジで複製されセグメント内の全てのノードに向けて送信されます。<br/><br/>送信対象は「同一セグメント内の全てのノード」、送信タイミングは「一度に全部」なので「ア」の記述が適切です。<br/><br/>なお、選択された複数のノードに対して1度の送信でパケットを送信することを「マルチキャスト」、単一の相手に対して送信することを「ユニキャスト」といいます。<div class=\"img_margin\"><img alt=\"31.png/image-size:556×180\" height=\"180\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/31.png\" style=\"max-width: 100%; height: auto;\" width=\"556\"/></div></div>", "mondai_html": "イーサネットで用いられるブロードキャストフレームによるデータ伝送の説明として，適切なものはどれか。", "choices_html": {"ア": "同一セグメント内の全てのノードに対して，送信元が一度の送信でデータを伝送する。", "イ": "同一セグメント内の全てのノードに対して，送信元が順番にデータを伝送する。", "ウ": "同一セグメント内の選択された複数のノードに対して，送信元が一度の送信でデータを伝送する。", "エ": "同一セグメント内の選択された複数のノードに対して，送信元が順番にデータを伝送する。"}}, {"id": "03_aki_q32", "session": "R3秋", "gap": 7, "num": 32, "topic": "ARPの説明はどれか", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "TCP/IPネットワークにおけるARPの説明として，適切なものはどれか。", "choices": {"ア": "IPアドレスからMACアドレスを得るプロトコルである。", "イ": "IPネットワークにおける誤り制御のためのプロトコルである。", "ウ": "ゲートウェイ間のホップ数によって経路を制御するプロトコルである。", "エ": "端末に対して動的にIPアドレスを割り当てるためのプロトコルである。"}, "ans": "ア", "hist_count": 4, "past_history": ["応用情報技術者 H24春期 問33", "応用情報技術者 H28秋期 問32", "基本情報技術者 H19春期 問52", "ソフトウェア開発技術者 H20秋期 問53"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q32.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ARP</strong>(Address Resolution Protocol)は、IPアドレスから対応する機器のMACアドレスを取得するプロトコルです。ARPが、IPアドレスからMACアドレスを取得する手順は以下のとおりです。<ol><li>要求パケットに、MACアドレスを得たいIPアドレスと、送信元のIPアドレス・MACアドレスを格納して、同一セグメント内にブロードキャストする。</li><li>要求パケットを受け取った各ノードは、解決目的のIPアドレスを確認し、自分のIPアドレスであれば、自分のMACアドレスを送信元に伝える。</li></ol><div class=\"img_margin\"><img alt=\"32.png/image-size:404×179\" height=\"179\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/32.png\" style=\"max-width: 100%; height: auto;\" width=\"404\"/></div><ul><li class=\"lia\">正しい。ARPの説明です。</li><li class=\"lii\">TCP(Transmission Control Protocol)の説明です。</li><li class=\"liu\">RIP(Routing Information Protocol)の説明です。</li><li class=\"lie\">DHCP(Dynamic Host Configuration Protocol)の説明です。</li></ul></div>", "mondai_html": "TCP/IPネットワークにおけるARPの説明として，適切なものはどれか。", "choices_html": {"ア": "IPアドレスからMACアドレスを得るプロトコルである。", "イ": "IPネットワークにおける誤り制御のためのプロトコルである。", "ウ": "ゲートウェイ間のホップ数によって経路を制御するプロトコルである。", "エ": "端末に対して動的にIPアドレスを割り当てるためのプロトコルである。"}}, {"id": "03_haru_q1", "session": "R3春", "gap": 8, "num": 1, "topic": "相補演算", "subcat": "離散数学", "category": "テクノロジ系", "mondai": "任意のオペランドに対するブール演算Aの結果とブール演算Bの結果が互いに否定の関係にあるとき，AはBの(又は，BはAの)相補演算であるという。排他的論理和の相補演算はどれか。", "choices": {}, "ans": "ア", "hist_count": 4, "past_history": ["応用情報技術者 H24春期 問1", "応用情報技術者 H30秋期 問1", "基本情報技術者 H14春期 問9", "ソフトウェア開発技術者 H17春期 問3"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>相補演算</strong>とは、集合演算によって得られる結果が互いにもう一方の演算の補集合となっている関係、すなわちAと<span class=\"ol\">A</span>，X AND YとNOT (X AND Y)のような関係になっているものをいいます。<br/>排他的論理和(XOR)は、2つの入力値が異なれば真、同じであれば偽を返す論理演算で、演算結果は次のような真理値表となります。<div class=\"img_margin\"><img alt=\"01_1.png/image-size:320×150\" height=\"150\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/01_1.png\" style=\"max-width: 100%; height: auto;\" width=\"320\"/></div>排他的論理和の相補演算になるのは、XORの補集合(XORのベン図の白い部分)が結果として得られる演算なので、答えとして適切なのは「等価演算」ということになります。<div class=\"img_margin\"><img alt=\"01_2.png/image-size:320×150\" height=\"150\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/01_2.png\" style=\"max-width: 100%; height: auto;\" width=\"320\"/></div></div>", "mondai_html": "任意のオペランドに対するブール演算Aの結果とブール演算Bの結果が互いに否定の関係にあるとき，AはBの(又は，BはAの)相補演算であるという。排他的論理和の相補演算はどれか。", "choices_html": {"ア": "<img alt=\"01a.png/image-size:129×28\" height=\"28\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/01a.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"129\"/>", "イ": "<img alt=\"01i.png/image-size:145×28\" height=\"28\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/01i.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"145\"/>", "ウ": "<img alt=\"01u.png/image-size:129×28\" height=\"28\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/01u.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"129\"/>", "エ": "<img alt=\"01e.png/image-size:146×28\" height=\"28\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/01e.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"146\"/>"}}, {"id": "03_haru_q6", "session": "R3春", "gap": 8, "num": 6, "topic": "2分木の探索順", "subcat": "データ構造", "category": "テクノロジ系", "mondai": "配列A[1]，A[2]，…，A[n]で，A[1]を根とし，A[i]の左側の子をA[2i]，右側の子をA[2i＋1]とみなすことによって，2分木を表現する。このとき，配列を先頭から順に調べていくことは，2分木の探索のどれに当たるか。", "choices": {"ア": "行きがけ順(先行順)深さ優先探索", "イ": "帰りがけ順(後行順)深さ優先探索", "ウ": "通りがけ順(中間順)深さ優先探索", "エ": "幅優先探索"}, "ans": "エ", "hist_count": 4, "past_history": ["応用情報技術者 H26秋期 問4", "応用情報技術者 H29秋期 問5", "ソフトウェア開発技術者 H17秋期 問10", "ソフトウェア開発技術者 H19春期 問10"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q6.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">仮に配列[1, 2, 3, 4, 5, 6, 7]があったとき、設問のルールにより表される2分木は次の構造になります。<div class=\"img_margin\"><img alt=\"06_1.png/image-size:294×150\" height=\"150\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/06_1.png\" style=\"max-width: 100%; height: auto;\" width=\"294\"/></div>この木構造において配列を先頭から順に1，2，…と調べていくと、以下の順序で要素を調べていくことなります。<div class=\"img_margin\"><img alt=\"06_2.png/image-size:255×139\" height=\"139\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/06_2.png\" style=\"max-width: 100%; height: auto;\" width=\"255\"/></div>根から近い順に階層ごとに探索することになるため「幅優先探索」が適切となります。よって「エ」が正解です。<br/><br/>なお、深さ優先探索は、根から開始して左の（右の）部分木優先で最も深い葉まで到達してから、一つ前の節まで戻り他方の部分木の探索を行うことを繰り返す方法です。先行順、後行順、中間順は参照するタイミングが違うだけです。<ul><li>行きがけ順(先行順) … 訪問したタイミングで調べる<div class=\"img_margin\"><img alt=\"06_3.png/image-size:247×171\" height=\"171\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/06_3.png\" style=\"max-width: 100%; height: auto;\" width=\"247\"/></div></li><li>帰りがけ順(後行順) … 移動する子がなくなったタイミングで調べる<div class=\"img_margin\"><img alt=\"06_4.png/image-size:247×171\" height=\"171\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/06_4.png\" style=\"max-width: 100%; height: auto;\" width=\"247\"/></div></li><li>通りがけ順(中間順) … 左の子に移動できなくなったタイミングで調べる<div class=\"img_margin\"><img alt=\"06_5.png/image-size:247×171\" height=\"171\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/06_5.png\" style=\"max-width: 100%; height: auto;\" width=\"247\"/></div></li></ul></div>", "mondai_html": "配列A[1]，A[2]，…，A[n]で，A[1]を根とし，A[i]の左側の子をA[2i]，右側の子をA[2i＋1]とみなすことによって，2分木を表現する。このとき，配列を先頭から順に調べていくことは，2分木の探索のどれに当たるか。", "choices_html": {"ア": "行きがけ順(先行順)深さ優先探索", "イ": "帰りがけ順(後行順)深さ優先探索", "ウ": "通りがけ順(中間順)深さ優先探索", "エ": "幅優先探索"}}, {"id": "05_haru_q1", "session": "R5春", "gap": 4, "num": 1, "topic": "ビット演算の応用", "subcat": "離散数学", "category": "テクノロジ系", "mondai": "0以上255以下の整数nに対して， と定義する。next(n)と等しい式はどれか。ここで，x AND y 及び x OR y は，それぞれxとyを2進数表現にして，桁ごとの論理積及び論理和をとったものとする。", "choices": {"ア": "(n＋1) AND 255", "イ": "(n＋1) AND 256", "ウ": "(n＋1) OR 255", "エ": "(n＋1) OR 256"}, "ans": "ア", "hist_count": 3, "past_history": ["応用情報技術者 H22春期 問1", "応用情報技術者 H27秋期 問1", "応用情報技術者 H31春期 問1"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">next(n)は、引数nが0～254の場合には引数に1を加えた値を返し、255では0を返します。<br/><br/>この問題で考えなければならないポイントは、次の2点です。<ul><li class=\"li1\">1ずつ加算がおこなわれるか。</li><li class=\"li2\">next(255)のときに結果が 0 となるか。</li></ul>この点を検証するためにnext(1)とnext(255)の結果をそれぞれ考えてみます。<ul><li class=\"lia\">正しい。ビットマスクの255を2進数で表すと「11111111」で、このビット列との論理積(AND)は(n＋1)の下位8ビットだけを取り出すように作用します。引数が255の場合には、最上位ビットの演算結果が0になるので関数は0を返します。<div class=\"img_margin\"><img alt=\"01a.png/image-size:435×120\" height=\"120\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/01a.png\" style=\"max-width: 100%; height: auto;\" width=\"435\"/></div></li><li class=\"lii\">ビットマスクの256を2進数で表すと「1 00000000」です。どの引数を与えても下位8ビットの演算結果が常に0になってしまうため誤りです。<div class=\"img_margin\"><img alt=\"01i.png/image-size:435×120\" height=\"120\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/01i.png\" style=\"max-width: 100%; height: auto;\" width=\"435\"/></div></li><li class=\"liu\">ビットマスクの255を2進数で表すと「11111111」で、このビット列と論理和(OR)演算を行った結果の下位8ビットは常に「11111111」になります。0≦n＜255では常に255、255では511が返るため誤りです。<div class=\"img_margin\"><img alt=\"01u.png/image-size:435×120\" height=\"120\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/01u.png\" style=\"max-width: 100%; height: auto;\" width=\"435\"/></div></li><li class=\"lie\">ビットマスクの256を2進数で表すと「1 00000000」で、このビット列と論理和(OR)演算を行った結果の最上位ビットは常に1になります。どの引数を与えても常に256以上の値が返るため誤りです。<div class=\"img_margin\"><img alt=\"01e.png/image-size:435×120\" height=\"120\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/01e.png\" style=\"max-width: 100%; height: auto;\" width=\"435\"/></div></li></ul></div>", "mondai_html": "0以上255以下の整数nに対して，<div class=\"img_margin\"><img alt=\"01.png/image-size:220×38\" height=\"38\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/01.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"220\"/></div>と定義する。next(n)と等しい式はどれか。ここで，x AND y 及び x OR y は，それぞれxとyを2進数表現にして，桁ごとの論理積及び論理和をとったものとする。", "choices_html": {"ア": "(n＋1) AND 255", "イ": "(n＋1) AND 256", "ウ": "(n＋1) OR 255", "エ": "(n＋1) OR 256"}}, {"id": "05_haru_q5", "session": "R5春", "gap": 4, "num": 5, "topic": "メモリ管理のデータ構造", "subcat": "データ構造", "category": "テクノロジ系", "mondai": "要求に応じて可変量のメモリを割り当てるメモリ管理方式がある。要求量以上の大きさをもつ空き領域のうちで最小のものを割り当てる最適適合(best-fit)アルゴリズムを用いる場合，空き領域を管理するためのデータ構造として，メモリ割当て時の平均処理時間が最も短いものはどれか。", "choices": {"ア": "空き領域のアドレスをキーとする2分探索木", "イ": "空き領域の大きさが小さい順の片方向連結リスト", "ウ": "空き領域の大きさをキーとする2分探索木", "エ": "アドレスに対応したビットマップ"}, "ans": "ウ", "hist_count": 3, "past_history": ["応用情報技術者 H31春期 問5", "ソフトウェア開発技術者 H15春期 問12", "ソフトウェア開発技術者 H18春期 問11"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">空き領域のアドレスをキーとして探索しても、求める空き領域を見つけることはできません。</li><li class=\"lii\">先頭から順にさがしていくので、要求量が小さい場合は早く探索できますが、要求量が大きくなるほどリストをたどる回数が増え非効率になります。N個の領域から探索する場合の平均探索回数は<span class=\"frac\"><span>N＋1</span>2</span>回です。</li><li class=\"liu\">正しい。空き領域の大きさがキーになっていれば、探索範囲を2分の1に絞ることを繰り返して、効率よく目的の空き領域を探索することができます。N個の領域から探索する場合の平均探索回数は log<sub>2</sub>N 回で「イ」よりも少なくなります。</li><li class=\"lie\">ビットマップインデックスは取り得る値が少ない場合に有効な方法ですが、●以上や●以下などの範囲を指定して検索することはできません。</li></ul></div>", "mondai_html": "要求に応じて可変量のメモリを割り当てるメモリ管理方式がある。要求量以上の大きさをもつ空き領域のうちで最小のものを割り当てる最適適合(best-fit)アルゴリズムを用いる場合，空き領域を管理するためのデータ構造として，メモリ割当て時の平均処理時間が最も短いものはどれか。", "choices_html": {"ア": "空き領域のアドレスをキーとする2分探索木", "イ": "空き領域の大きさが小さい順の片方向連結リスト", "ウ": "空き領域の大きさをキーとする2分探索木", "エ": "アドレスに対応したビットマップ"}}, {"id": "05_haru_q10", "session": "R5春", "gap": 4, "num": 10, "topic": "キャッシュメモリ制御方式", "subcat": "メモリ", "category": "テクノロジ系", "mondai": "キャッシュメモリへの書込み動作には，ライトスルー方式とライトバック方式がある。それぞれの特徴のうち，適切なものはどれか。", "choices": {"ア": "ライトスルー方式では，データをキャッシュメモリだけに書き込むので，高速に書込みができる。", "イ": "ライトスルー方式では，データをキャッシュメモリと主記憶の両方に同時に書き込むので，主記憶の内容は常にキャッシュメモリの内容と一致する。", "ウ": "ライトバック方式では，データをキャッシュメモリと主記憶の両方に同時に書き込むので，速度が遅い。", "エ": "ライトバック方式では，読出し時にキャッシュミスが発生してキャッシュメモリの内容が追い出されるときに，主記憶に書き戻す必要が生じることはない。"}, "ans": "イ", "hist_count": 3, "past_history": ["応用情報技術者 R3春期 問12", "応用情報技術者 H24秋期 問11", "ソフトウェア開発技術者 H17春期 問17"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q10.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">\"ライトバック\"と\"ライトスルー\"は、キャッシュメモリと主記憶との間で同期をとるための方式です。両者の特徴は次のとおりです。<dl><dt>ライトバック（write back）</dt><dd>CPUから書込み命令が出たときにキャッシュメモリだけに書き込み、主記憶への書き込みはキャッシュメモリからデータが追い出されるときに行う方式。処理速度は速いが、データの整合性を保つための追加制御が必要になる</dd><dt>ライトスルー（write through）</dt><dd>CPUから書き込む命令が出たときにキャッシュメモリと同時に主記憶にも書き込む方式。データの整合性は容易に得られるが、処理速度は遅い</dd></dl><ul><li class=\"lia\">ライトバック方式の説明です。ライトスルー方式は、キャッシュメモリと主記憶の両方に同時に書き込みます。</li><li class=\"lii\">正しい。ライトスルー方式ではキャッシュメモリと主記憶の間で常にデータが一致しています。</li><li class=\"liu\">ライトスルー方式の説明です。ライトバック方式は一旦はキャッシュにだけ書き込むのでライトスルー方式よりも高速です。</li><li class=\"lie\">ライトバック方式ではミスヒットによりキャッシュメモリの内容が変更される際に、その追い出されるデータを主記憶に書き戻さなければなりません。</li></ul></div>", "mondai_html": "キャッシュメモリへの書込み動作には，ライトスルー方式とライトバック方式がある。それぞれの特徴のうち，適切なものはどれか。", "choices_html": {"ア": "ライトスルー方式では，データをキャッシュメモリだけに書き込むので，高速に書込みができる。", "イ": "ライトスルー方式では，データをキャッシュメモリと主記憶の両方に同時に書き込むので，主記憶の内容は常にキャッシュメモリの内容と一致する。", "ウ": "ライトバック方式では，データをキャッシュメモリと主記憶の両方に同時に書き込むので，速度が遅い。", "エ": "ライトバック方式では，読出し時にキャッシュミスが発生してキャッシュメモリの内容が追い出されるときに，主記憶に書き戻す必要が生じることはない。"}}, {"id": "05_haru_q34", "session": "R5春", "gap": 4, "num": 34, "topic": "トランスポート層に位置するもの", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "IPネットワークのプロトコルのうち，OSI基本参照モデルのトランスポート層に位置するものはどれか。", "choices": {"ア": "HTTP", "イ": "ICMP", "ウ": "SMTP", "エ": "UDP"}, "ans": "エ", "hist_count": 3, "past_history": ["応用情報技術者 H21秋期 問36", "応用情報技術者 H25秋期 問35", "ソフトウェア開発技術者 H19春期 問52"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q34.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>UDP</strong>(User Datagram Protocol)は、TCP/IPの通信処理で使われる伝送制御プロトコルのひとつで、TCPと同じくOSI基本参照モデルの<em class=\"r\">トランスポート層</em>に位置します。<br/><br/>UDPは、TCPと異なり\"コネクションレス型\"の通信であり、通信制御に係る処理が少ない分だけ効率的な通信が可能になっています。この利点を活かして、信頼性よりも即時性や効率性が求められるストリーミング配信や、DNS、NTP、SNMPなどのプロトコルにおいて使用されています。<ul><li class=\"lia\">HyperText Transfer Protocolの略。WebブラウザとWebサーバ間のHTMLの送受信に使われるプロトコルで、アプリケーション層に位置します。</li><li class=\"lii\">Internet Control Message Protocolの略。インターネット制御通知のプロトコルで、ネットワーク層に位置します。</li><li class=\"liu\">Simple Mail Transfer Protocolの略。メール転送のためのプロトコルで、アプリケーション層に位置します。</li><li class=\"lie\">正しい。UDPはトランスポート層のプロトコルです。</li></ul></div>", "mondai_html": "IPネットワークのプロトコルのうち，OSI基本参照モデルのトランスポート層に位置するものはどれか。", "choices_html": {"ア": "HTTP", "イ": "ICMP", "ウ": "SMTP", "エ": "UDP"}}, {"id": "05_haru_q49", "session": "R5春", "gap": 4, "num": 49, "topic": "特許権者からの実施許諾", "subcat": "知的財産適用管理", "category": "テクノロジ系", "mondai": "日本国特許庁において特許Aを取得した特許権者から，実施許諾を受けることが必要な場合はどれか。", "choices": {"ア": "特許Aと同じ技術を家庭内で個人的に利用するだけの場合", "イ": "特許Aと同じ技術を利用して日本国内で製品を製造し，その全てを日本国外に輸出する場合", "ウ": "特許Aの出願日から25年を越えた後に，特許Aと同じ技術を新たに事業化する場合", "エ": "特許Aの出願日より前から特許Aと同じ技術を独自に開発し，特許Aの出願日に日本国内でその技術を用いた製品を製造販売していたことが証明できる場合"}, "ans": "イ", "hist_count": 3, "past_history": ["応用情報技術者 R2秋期 問50", "応用情報技術者 H24秋期 問50", "応用情報技術者 H29春期 問50"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q49.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">特許権の侵害となるのは特許発明を業として実施する場合です。事業でない個人的な使用や家庭内での使用であれば、特許権者から実施許諾を受ける必要はありません。</li><li class=\"lii\">正しい。特許法では発明の実施を、生産、使用、譲渡等、輸出、輸入又は譲渡等の申出をする行為と定義しています。よって、特許技術を使用した製品を輸出する場合、特許権者から実施許諾を受けなければなりません。</li><li class=\"liu\">特許権の存続期間は出願日から20年、存続期間延長登録制度を利用しても最長5年しか延長できないので、出願日から25年を超えた特許については、特許権者から実施許諾を受けなくても事業に使用することができます。</li><li class=\"lie\">特許出願に係る発明の内容を知らずに、特許出願の際に現にその技術を用いた事業をしている者は、その特許出願に関する通常実施権(先使用権)が認められます。このケースで説明されている条件を満たせば先使用権が認められるため、特許権者から実施許諾を受ける必要はありません。</li></ul></div>", "mondai_html": "日本国特許庁において特許Aを取得した特許権者から，実施許諾を受けることが必要な場合はどれか。", "choices_html": {"ア": "特許Aと同じ技術を家庭内で個人的に利用するだけの場合", "イ": "特許Aと同じ技術を利用して日本国内で製品を製造し，その全てを日本国外に輸出する場合", "ウ": "特許Aの出願日から25年を越えた後に，特許Aと同じ技術を新たに事業化する場合", "エ": "特許Aの出願日より前から特許Aと同じ技術を独自に開発し，特許Aの出願日に日本国内でその技術を用いた製品を製造販売していたことが証明できる場合"}}, {"id": "04_aki_q20", "session": "R4秋", "gap": 5, "num": 20, "topic": "アクチュエーターの機能はどれか", "subcat": "ハードウェア", "category": "テクノロジ系", "mondai": "アクチュエーターの機能として，適切なものはどれか。", "choices": {"ア": "アナログ電気信号を，コンピュータが処理可能なデジタル信号に変える。", "イ": "キーボード，タッチパネルなどに使用され，コンピュータに情報を入力する。", "ウ": "コンピュータが出力した電気信号を力学的な運動に変える。", "エ": "物理量を検出して，電気信号に変える。"}, "ans": "ウ", "hist_count": 3, "past_history": ["応用情報技術者 H28春期 問23", "応用情報技術者 H31春期 問21", "基本情報技術者 H29秋期 問22"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>アクチュエーター</strong>(Actuator)は、機械や電気回路の構成要素のうち、入力された電気信号を力学的な運動に変換する駆動機構です。<br/><br/>電気エネルギーを回転運動へ変換するDC（直流）モーターやAC（交流）モーター、空気圧エネルギーや油圧エネルギーをシリンダの運動に変換する空気圧シリンダ（バスや電車の開閉に用いられている）や油圧シリンダ（油圧ジャッキや工業機械などで用いられている)、ロボットの関節などに用いられるサーボモーターなど様々な種類があります。IoT関連だと、電子錠システムにおける回転ラッチのようなハンドルやレバー、ロボットの関節部、電子弁などコンピュータからの指示を受けて伸縮・屈伸・回転する部分が該当します。<br/><br/>したがって、電気信号を力学的運動に変える「ウ」がアクチュエーターの役割になります。<ul><li class=\"lia\">A/Dコンバータ(アナログ・デジタル変換器)の説明です。</li><li class=\"lii\">静電センサーの説明です。アクチュエーターは入力デバイスではありません。</li><li class=\"liu\">正しい。アクチュエーターの説明です。</li><li class=\"lie\">センサーの説明です。</li></ul></div>", "mondai_html": "アクチュエーターの機能として，適切なものはどれか。", "choices_html": {"ア": "アナログ電気信号を，コンピュータが処理可能なデジタル信号に変える。", "イ": "キーボード，タッチパネルなどに使用され，コンピュータに情報を入力する。", "ウ": "コンピュータが出力した電気信号を力学的な運動に変える。", "エ": "物理量を検出して，電気信号に変える。"}}, {"id": "04_aki_q23", "session": "R4秋", "gap": 5, "num": 23, "topic": "論理回路図", "subcat": "ハードウェア", "category": "テクノロジ系", "mondai": "入力XとYの値が同じときにだけ，出力Zに1を出力する回路はどれか。", "choices": {}, "ans": "ウ", "hist_count": 3, "past_history": ["基本情報技術者 H19秋期 問17", "基本情報技術者 H22春期 問26", "基本情報技術者 H26春期 問22"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">「入力XとYの値が同じときにだけ，出力Zに1を出力する」ということは、裏を返せば「入力XとYの値が異なるときには1を出力しない」ということです。このため、(X，Y)が(0，0)と(1，1)のときに1を出力するかどうかだけでなく、それ以外の(1，0)と(0，1)のときに出力が0になっているかどうかも確認する必要があります。<br/><br/>それぞれの論理回路に(0，0)、(1，0)、(0，1)、(1，1)の4つを入力して得られる結果は次のようになります。XとYが同じときに1を出力しているもの、XとYが異なるときに1を出力していないものには○を、そうではないものには×を付けてあります。<ul><li class=\"lia\"><img alt=\"23_1.png/image-size:449×178\" height=\"178\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/23_1.png\" style=\"max-width: 100%; height: auto;\" width=\"449\"/></li><li class=\"lii\"><img alt=\"23_2.png/image-size:449×178\" height=\"178\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/23_2.png\" style=\"max-width: 100%; height: auto;\" width=\"449\"/></li><li class=\"liu\"><img alt=\"23_3.png/image-size:449×178\" height=\"178\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/23_3.png\" style=\"max-width: 100%; height: auto;\" width=\"449\"/></li><li class=\"lie\"><img alt=\"23_4.png/image-size:449×178\" height=\"178\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/23_4.png\" style=\"max-width: 100%; height: auto;\" width=\"449\"/></li></ul>したがって、設問の条件に合致した出力をする論理回路は「ウ」です。</div>", "mondai_html": "入力XとYの値が同じときにだけ，出力Zに1を出力する回路はどれか。", "choices_html": {"ア": "<img alt=\"23a.png/image-size:251×82\" height=\"82\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/23a.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"251\"/>", "イ": "<img alt=\"23i.png/image-size:250×82\" height=\"82\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/23i.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"250\"/>", "ウ": "<img alt=\"23u.png/image-size:257×83\" height=\"83\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/23u.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"257\"/>", "エ": "<img alt=\"23e.png/image-size:258×83\" height=\"83\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/23e.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"258\"/>"}}, {"id": "04_aki_q26", "session": "R4秋", "gap": 5, "num": 26, "topic": "データ項目の命名規約", "subcat": "データベース設計", "category": "テクノロジ系", "mondai": "データ項目の命名規約を設ける場合，次の命名規約だけでは 回避できない事象 はどれか。 〔命名規約〕 データ項目名の末尾には必ず\"名\"，\"コード\"，\"数\"，\"金額\"，\"年月日\"などの区分語を付与し，区分語ごとに定めたデータ型にする。 データ項目名と意味を登録した辞書を作成し，異音同義語や同音異義語が発生しないようにする。", "choices": {"ア": "データ項目\"受信年月日\"のデータ型として，日付型と文字列型が混在する。", "イ": "データ項目\"受注金額\"の取り得る値の範囲がテーブルによって異なる。", "ウ": "データ項目\"賞与金額\"と同じ意味で\"ボーナス金額\"というデータ項目がある。", "エ": "データ項目\"取引先\"が，\"取引先コード\"か\"取引先名\"か，判別できない。"}, "ans": "イ", "hist_count": 3, "past_history": ["基本情報技術者 H24秋期 問28", "基本情報技術者 H27春期 問29", "基本情報技術者 H30秋期 問27"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q26.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">「データ項目の末尾には必ず区分語を付与し，区分ごとに定めたデータ型にする」ので、末尾が\"年月日\"のデータ型は常に同じになります。よって、回避できる問題です。</li><li class=\"lii\">正しい。データ型については命名規約に定義されていますが、そのデータ型の値の範囲については定義されていないため、この命名規約では回避できない事象です。</li><li class=\"liu\">「辞書の作成によって異音同義語や同音異義語が発生しないようにする」ので回避できる問題です。</li><li class=\"lie\">「データ項目名の末尾には必ず\"名\"，\"コード\"，\"数\"，\"金額\"，\"年月日\"などの区分語を付与する」ので、\"取引先\"というデータ項目は存在しえません。よって、回避できる問題です。</li></ul></div>", "mondai_html": "データ項目の命名規約を設ける場合，次の命名規約だけでは<u>回避できない事象</u>はどれか。<br/><br/>〔命名規約〕<ul><li class=\"li1\">データ項目名の末尾には必ず\"名\"，\"コード\"，\"数\"，\"金額\"，\"年月日\"などの区分語を付与し，区分語ごとに定めたデータ型にする。</li><li class=\"li2\">データ項目名と意味を登録した辞書を作成し，異音同義語や同音異義語が発生しないようにする。</li></ul>", "choices_html": {"ア": "データ項目\"受信年月日\"のデータ型として，日付型と文字列型が混在する。", "イ": "データ項目\"受注金額\"の取り得る値の範囲がテーブルによって異なる。", "ウ": "データ項目\"賞与金額\"と同じ意味で\"ボーナス金額\"というデータ項目がある。", "エ": "データ項目\"取引先\"が，\"取引先コード\"か\"取引先名\"か，判別できない。"}}, {"id": "04_aki_q39", "session": "R4秋", "gap": 5, "num": 39, "topic": "JPCERT/CCが作成したものはどれか", "subcat": "情報セキュリティ管理", "category": "テクノロジ系", "mondai": "組織的なインシデント対応体制の構築や運用を支援する目的でJPCERTコーディネーションセンターが作成したものはどれか。", "choices": {"ア": "CSIRTマテリアル", "イ": "ISMSユーザーズガイド", "ウ": "証拠保全ガイドライン", "エ": "組織における内部不正防止ガイドライン"}, "ans": "ア", "hist_count": 3, "past_history": ["基本情報技術者 H30秋期 問40", "情報セキュマネ H29春期 問3", "情報セキュマネ H30秋期 問1"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q39.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CSIRTマテリアル</strong>は、組織的なインシデント対応体制である「組織内CSIRT」の構築を支援する目的で作成されたガイドラインです。構想フェーズ、構築フェーズ、運用フェーズの3部構成になっていて、ITセキュリティに対応するための情報およびノウハウが提示されています。CSIRTマテリアルはJPCERT/CCのWebサイトで閲覧可能です。<ul><li class=\"lia\">正しい。CSIRTマテリアルは、組織内CSIRT(インシデント対応チーム)の構築を支援する目的でJPCERT/CCが作成したガイドラインです。</li><li class=\"lii\">ISMSユーザーズガイドは、ISMS認証基準の要求事項について一定の範囲でその意味するところを説明しているガイドです。JIPDECによって作成されています。</li><li class=\"liu\">証拠保全ガイドラインは、電磁的証拠の保全手続きの参考として、様々な事案について広く利用できるように策定された指針です。デジタル・フォレンジック研究会によって作成されています。</li><li class=\"lie\">組織における内部不正防止ガイドラインは、組織が管理する情報と情報システムに対する内部不正の防止、および不正行為発生時の早期発見と拡大防止のための体制の整備を推進するための指針です。IPAによって作成されています。</li></ul></div>", "mondai_html": "組織的なインシデント対応体制の構築や運用を支援する目的でJPCERTコーディネーションセンターが作成したものはどれか。", "choices_html": {"ア": "CSIRTマテリアル", "イ": "ISMSユーザーズガイド", "ウ": "証拠保全ガイドライン", "エ": "組織における内部不正防止ガイドライン"}}, {"id": "04_haru_q8", "session": "R4春", "gap": 6, "num": 8, "topic": "プロセッサの高速化技法", "subcat": "プロセッサ", "category": "テクノロジ系", "mondai": "プロセッサの高速化技法の一つとして，同時に実行可能な複数の動作を，コンパイルの段階でまとめて一つの複合命令とし，高速化を図る方式はどれか。", "choices": {"ア": "CISC", "イ": "MIMD", "ウ": "RISC", "エ": "VLIW"}, "ans": "エ", "hist_count": 3, "past_history": ["応用情報技術者 R7秋期 問8", "応用情報技術者 H30春期 問9", "ソフトウェア開発技術者 H15春期 問16"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>VLIW</strong>(Very Long Instruction Word)とは、プログラムのコンパイル段階で、依存関係のない複数の操作をまとめて1つの複合命令にまとめ、同時に並列処理させる手法です。1つのサイクルで多くの演算を行うことができるため、高速なデータ処理が求められる分野で効果を発揮します。「Very Long」の名前のとおり命令がとても長く、最低128ビットといったサイズになります。<br/><br/>通常のパイプライン処理では、CPUが実行中に命令の依存関係などを判断して進めますが、VLIWではあらかじめ並列実行できる形にしてあるため、CPU側のオーバーヘッド減少と高速化が望めます。その一方で、ソースコードからプログラムを生成するコンパイラの設計はその分難しくなります。<br/><br/>したがって「エ」が正解です。<ul><li class=\"lia\">Complex Instruction Set Computerの略。複雑で多機能な命令セットでコンピュータを構成する設計方法です。</li><li class=\"lii\">Multiple Instruction, Multiple Dataの略。複数の命令とそれに対応するデータを、それぞれが独立している複数のプロセッサに振り分けて並列処理をする方式です。</li><li class=\"liu\">Reduced Instruction Set Computerの略。CPUに与える命令を短く固定長化し、専用の論理回路で高速に実行できるようにした命令セットでコンピュータを構成する設計方法です。</li><li class=\"lie\">正しい。VLIWは、複数の処理を1つの非常に長い命令にまとめて並列実行する高速化技法です。</li></ul></div>", "mondai_html": "プロセッサの高速化技法の一つとして，同時に実行可能な複数の動作を，コンパイルの段階でまとめて一つの複合命令とし，高速化を図る方式はどれか。", "choices_html": {"ア": "CISC", "イ": "MIMD", "ウ": "RISC", "エ": "VLIW"}}, {"id": "04_haru_q38", "session": "R4春", "gap": 6, "num": 38, "topic": "チャレンジレスポンス方式", "subcat": "情報セキュリティ", "category": "テクノロジ系", "mondai": "チャレンジレスポンス認証方式に該当するものはどれか。", "choices": {"ア": "固定パスワードを，TLSによる暗号通信を使い，クライアントからサーバに送信して，サーバで検証する。", "イ": "端末のシリアル番号を，クライアントで秘密鍵を使って暗号化し，サーバに送信して，サーバで検証する。", "ウ": "トークンという装置が自動的に表示する，認証のたびに異なる数字列をパスワードとしてサーバに送信して，サーバで検証する。", "エ": "利用者が入力したパスワードと，サーバから受け取ったランダムなデータとをクライアントで演算し，その結果をサーバに送信して，サーバで検証する。"}, "ans": "エ", "hist_count": 3, "past_history": ["応用情報技術者 R1秋期 問38", "応用情報技術者 H26春期 問38", "応用情報技術者 H28秋期 問38"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q38.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>チャレンジレスポンス方式</strong>は、通信経路上に固定パスワードを流さないようにすることで、盗聴によるパスワードの漏えいやリプレイアタックを防止する認証方式です。<br/><br/>チャレンジレスポンス方式では以下の手順で認証を行います。<ul><li class=\"li1\">サーバは、クライアントから要求があるたびに異なる乱数値(チャレンジ)を生成して保持するとともに、クライアントへ送る。</li><li class=\"li2\">クライアントは、利用者が入力したパスワードと(1)でサーバから送られた\"チャレンジ\"から所定の方法でレスポンスを計算する。</li><li class=\"li3\">クライアントは、(2)で生成した\"レスポンス\"と利用者が入力した利用者IDをサーバに送る。</li><li class=\"li4\">サーバは、クライアントから受け取った利用者IDで利用者情報を検索して、取り出したパスワードと(1)で保持していた\"チャレンジ\"を用いてクライアントと同じ手順でレスポンスを生成する（レスポンス照合データ）。</li><li class=\"li5\">サーバは、\"レスポンス照合データ\"とクライアントから受け取った\"レスポンス\"を比較し、両者が一致すれば認証成功とする。</li></ul><div class=\"img_margin\"><img alt=\"38.png/image-size:448×378\" height=\"378\" src=\"https://www.ap-siken.com/kakomon/04_haru/img/38.png\" style=\"max-width: 100%; height: auto;\" width=\"448\"/></div><ul><li class=\"lia\">チャレンジレスポンス方式では、固定パスワードとサーバから送信された乱数(チャレンジ)を組み合わせたものをハッシュ化又は暗号化してサーバに返信します。</li><li class=\"lii\">端末のシリアル番号は送信しません。端末ごとに固有の番号を使用するといつも同じ認証データが使われることになるので、リプレイアタックを受ける可能性があります。</li><li class=\"liu\">時刻同期式ワンタイムパスワードの説明です。チャレンジレスポンス方式ではトークンは不要です。</li><li class=\"lie\">正しい。チャレンジレスポンス認証方式の特徴です。</li></ul></div>", "mondai_html": "チャレンジレスポンス認証方式に該当するものはどれか。", "choices_html": {"ア": "固定パスワードを，TLSによる暗号通信を使い，クライアントからサーバに送信して，サーバで検証する。", "イ": "端末のシリアル番号を，クライアントで秘密鍵を使って暗号化し，サーバに送信して，サーバで検証する。", "ウ": "トークンという装置が自動的に表示する，認証のたびに異なる数字列をパスワードとしてサーバに送信して，サーバで検証する。", "エ": "利用者が入力したパスワードと，サーバから受け取ったランダムなデータとをクライアントで演算し，その結果をサーバに送信して，サーバで検証する。"}}, {"id": "03_aki_q9", "session": "R3秋", "gap": 7, "num": 9, "topic": "メモリインターリーブ", "subcat": "メモリ", "category": "テクノロジ系", "mondai": "メモリインターリーブの説明として，適切なものはどれか。", "choices": {"ア": "主記憶と外部記憶を一元的にアドレス付けし，主記憶の物理容量を超えるメモリ空間を提供する。", "イ": "主記憶と磁気ディスク装置との間にバッファメモリを置いて，双方のアクセス速度の差を補う。", "ウ": "主記憶と入出力装置との間でCPUとは独立にデータ転送を行う。", "エ": "主記憶を複数のバンクに分けて，CPUからのアクセス要求を並列的に処理できるようにする。"}, "ans": "エ", "hist_count": 3, "past_history": ["応用情報技術者 H30春期 問11", "ソフトウェア開発技術者 H15春期 問18", "ソフトウェア開発技術者 H19春期 問19"], "web_url": "https://www.ap-siken.com/kakomon/03_aki/q9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>メモリインターリーブ</strong>は、物理上はひとつである主記憶領域を、同時アクセス可能な複数の論理的な領域（バンク）に分け、それぞれのバンクに対してデータの読み書きを並列で行うことにより、メモリアクセスの高速化を図る技術です。メモリインターリーブでは、奇数アドレスはバンク1、偶数アドレスはバンク2というように、連続したアドレスを複数のバンクに割り振っていきます。通常は、連続するアドレスに次々とアクセスされることが多いため、見かけ上並列アクセスしているようになり、実効アクセス時間が短くなります。「主記憶に並列アクセス」ときたらメモリインターリーブです。<br/><div class=\"img_margin\"><img alt=\"09.png/image-size:265×226\" height=\"226\" src=\"https://www.ap-siken.com/kakomon/03_aki/img/09.png\" style=\"max-width: 100%; height: auto;\" width=\"265\"/></div><ul><li class=\"lia\">仮想記憶の説明です。</li><li class=\"lii\">ディスクバッファの説明です。</li><li class=\"liu\">DMA制御方式の説明です。</li><li class=\"lie\">正しい。メモリインターリーブの説明です。</li></ul></div>", "mondai_html": "メモリインターリーブの説明として，適切なものはどれか。", "choices_html": {"ア": "主記憶と外部記憶を一元的にアドレス付けし，主記憶の物理容量を超えるメモリ空間を提供する。", "イ": "主記憶と磁気ディスク装置との間にバッファメモリを置いて，双方のアクセス速度の差を補う。", "ウ": "主記憶と入出力装置との間でCPUとは独立にデータ転送を行う。", "エ": "主記憶を複数のバンクに分けて，CPUからのアクセス要求を並列的に処理できるようにする。"}}, {"id": "03_haru_q18", "session": "R3春", "gap": 8, "num": 18, "topic": "主記憶管理に関する記述", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "プログラム実行時の主記憶管理に関する記述として，適切なものはどれか。", "choices": {"ア": "主記憶の空き領域を結合して一つの連続した領域にすることを，可変区画方式という。", "イ": "プログラムが使用しなくなったヒープ領域を回収して再度使用可能にすることを，ガーベジコレクションという。", "ウ": "プログラムの実行中に主記憶内でモジュールの格納位置を移動させることを，動的リンキングという。", "エ": "プログラムの実行中に必要になった時点でモジュールをロードすることを，動的再配置という。"}, "ans": "イ", "hist_count": 3, "past_history": ["応用情報技術者 H24秋期 問17", "応用情報技術者 H28秋期 問16", "ソフトウェア開発技術者 H15春期 問29"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">可変区画方式は、実行するプログラムの大きさに応じて主記憶を区画して割り当てる方式です。可変区画方式で区画の割当てと解放を繰り返していくと、主記憶上に不連続な未使用領域が発生します。この主記憶の細かな空き領域を結合して一つの連続した領域にすることをメモリコンパクション(またはデフラグ)といいます。</li><li class=\"lii\">正しい。<strong>ガーベジコレクション</strong>(Garbage Collection)は、プログラムが動的に確保したメモリ領域を回収して、再度使用可能にすることをいいます。ガーベジには「ゴミ」の意があり、メモリ中の使えない部分を集める作業になぞらえています。</li><li class=\"liu\">動的再配置の説明です。</li><li class=\"lie\">動的リンキングの説明です。</li></ul></div>", "mondai_html": "プログラム実行時の主記憶管理に関する記述として，適切なものはどれか。", "choices_html": {"ア": "主記憶の空き領域を結合して一つの連続した領域にすることを，可変区画方式という。", "イ": "プログラムが使用しなくなったヒープ領域を回収して再度使用可能にすることを，ガーベジコレクションという。", "ウ": "プログラムの実行中に主記憶内でモジュールの格納位置を移動させることを，動的リンキングという。", "エ": "プログラムの実行中に必要になった時点でモジュールをロードすることを，動的再配置という。"}}, {"id": "03_haru_q21", "session": "R3春", "gap": 8, "num": 21, "topic": "RFIDの活用事例", "subcat": "ハードウェア", "category": "テクノロジ系", "mondai": "RFIDの活用事例として，適切なものはどれか。", "choices": {"ア": "紙に印刷されたデジタルコードをリーダーで読み取ることによる情報の入力", "イ": "携帯電話とヘッドフォンとの間の音声データ通信", "ウ": "赤外線を利用した近距離データ通信", "エ": "微小な無線チップによる人又は物の識別及び管理"}, "ans": "エ", "hist_count": 3, "past_history": ["応用情報技術者 H30春期 問20", "基本情報技術者 H23秋期 問24", "基本情報技術者 H28春期 問22"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>RFID</strong>(Radio Frequency IDentification)は、ID情報を埋め込んだRFタグ(ICタグ)と電磁界や電波を用いることで、数cm～数mの範囲で情報のやり取りを行う技術です。<br/><br/>特徴として「見えなくても読める」ことが挙げられ、RFタグが目に見えない隠れた位置にあっても、タグ表面がホコリ、泥などで汚れていても読み取り可能です。この利点を活かし乗車カード（Suica, PASMOなど)、電子マネー、電子荷札、野生動物の調査、自動レジ、家畜の管理などに利用されています。<ul><li class=\"lia\">OMR(Optical Mark Reader，光学式マーク読取装置)やバーコードリーダーの活用事例です。</li><li class=\"lii\">Bluetoothの活用事例です。</li><li class=\"liu\">IrDA(Infrared Data Association)の活用事例です。RFIDは赤外線ではなく電波を用います。</li><li class=\"lie\">正しい。RFIDの活用事例です。</li></ul></div>", "mondai_html": "RFIDの活用事例として，適切なものはどれか。", "choices_html": {"ア": "紙に印刷されたデジタルコードをリーダーで読み取ることによる情報の入力", "イ": "携帯電話とヘッドフォンとの間の音声データ通信", "ウ": "赤外線を利用した近距離データ通信", "エ": "微小な無線チップによる人又は物の識別及び管理"}}, {"id": "03_haru_q27", "session": "R3春", "gap": 8, "num": 27, "topic": "XML形式で記述する画像フォーマット", "subcat": "マルチメディア技術", "category": "テクノロジ系", "mondai": "W3Cで仕様が定義され，矩形や円，直線，文字列などの図形オブジェクトをXML形式で記述し，Webページでの図形描画にも使うことができる画像フォーマットはどれか。", "choices": {"ア": "OpenGL", "イ": "PNG", "ウ": "SVG", "エ": "TIFF"}, "ans": "ウ", "hist_count": 3, "past_history": ["応用情報技術者 R7春期 問23", "応用情報技術者 H24秋期 問34", "応用情報技術者 H29秋期 問25"], "web_url": "https://www.ap-siken.com/kakomon/03_haru/q27.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SVG</strong>(Scalable Vector Graphics)は、ベクター形式による2次元の画像、図形、テキストなどをXML形式で記述する画像フォーマットです。<div class=\"img_margin\"><img alt=\"27.png/image-size:472×153\" height=\"153\" src=\"https://www.ap-siken.com/kakomon/03_haru/img/27.png\" style=\"max-width: 100%; height: auto;\" width=\"472\"/></div>SVGは画像をテキストベースで定義するため、次のような特徴があります。<ul><li>拡大・縮小による画質の劣化が生じない（スマートフォンなどの高解像度ディスプレイに最適）</li><li>画像編集専用ソフトウェアを用いずに、テキストエディタでも直接編集が可能</li><li>JavaScriptなどのスクリプト言語を用いて動的な制御が可能</li></ul>SVGは、比較的構造が単純で再利用されやすい画像や、インタラクティブ性を必要とする画像に多く活用されています。具体的には、アイコン、ロゴ、ボタン、チャート、グラフ、地図、ダイアグラムなどが挙げられます。これらの用途では、ラスター画像（JPEGやPNGなど）に比べてデータサイズが小さく、通信量や表示速度の観点からも有利です。HTML5でインラインSVGがサポートされたことにより、WebページでのSVGの活用が広がっています。<ul><li class=\"lia\">Open Graphics Libraryの略。Linux、FreeBSDなどのPC UNIXに加え、Windows、Mac OS X等クロスプラットフォームで使用できる2D／3DCGを扱うためのAPIです。</li><li class=\"lii\">Portable Network Graphicsの略。圧縮による画質の劣化のない可逆圧縮の画像ファイルフォーマットで、GIFよりも圧縮率が高く、現在ではほぼすべてのブラウザでサポートされているためWebページの画像フォーマットとして使用されます。</li><li class=\"liu\">正しい。SVGは、XML形式で記述する画像フォーマットです。</li><li class=\"lie\">Tagged Image File Formatの略。画像データを解像度・色数・カラーモデルなどが異なる複数の形式で1つのファイルに格納できるファイル形式です。</li></ul></div>", "mondai_html": "W3Cで仕様が定義され，矩形や円，直線，文字列などの図形オブジェクトをXML形式で記述し，Webページでの図形描画にも使うことができる画像フォーマットはどれか。", "choices_html": {"ア": "OpenGL", "イ": "PNG", "ウ": "SVG", "エ": "TIFF"}}, {"id": "05_haru_q2", "session": "R5春", "gap": 4, "num": 2, "topic": "正規分布のグラフ", "subcat": "応用数学", "category": "テクノロジ系", "mondai": "平均が60，標準偏差が10の正規分布を表すグラフはどれか。", "choices": {}, "ans": "ア", "hist_count": 2, "past_history": ["基本情報技術者 H14春期 問6", "ソフトウェア開発技術者 H18秋期 問4"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>正規分布</strong>は、平均値を中心に左右対称の山のようなカーブを描く確率分布で、平均と標準偏差だけで分布に関する全ての特性が規定できるという特徴があります。<br/><br/><strong>標準偏差</strong>は、データの分布のばらつきを表す尺度で、正規分布では平均値と標準偏差(σ[シグマ])、および度数の間に次の関係が成り立っています。<ul><li>平均±σの範囲に全体の約68%が含まれる</li><li>平均±2σの範囲に全体の約95%が含まれる</li><li>平均±3σの範囲に全体の約99%が含まれる</li></ul>選択肢のグラフのうち、グラフが左右対称となっていない「ウ」と「エ」は明らかに不適切とわかります。「ア」と「イ」はどちらも平均が<b>60</b>ですが、標準偏差±σの範囲「60±10＝<b>50～70</b>」を正しく表しているのは「ア」のグラフです。<div class=\"img_margin\"><img alt=\"02.png/image-size:242×288\" height=\"288\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/02.png\" style=\"max-width: 100%; height: auto;\" width=\"242\"/></div></div>", "mondai_html": "平均が60，標準偏差が10の正規分布を表すグラフはどれか。", "choices_html": {"ア": "<img alt=\"02a.png/image-size:191×139\" height=\"139\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/02a.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"191\"/>", "イ": "<img alt=\"02i.png/image-size:188×139\" height=\"139\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/02i.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"188\"/>", "ウ": "<img alt=\"02u.png/image-size:192×140\" height=\"140\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/02u.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"192\"/>", "エ": "<img alt=\"02e.png/image-size:188×140\" height=\"140\" src=\"https://www.ap-siken.com/kakomon/05_haru/img/02e.png\" style=\"max-width: 100%; height: auto; vertical-align: middle;\" width=\"188\"/>"}}, {"id": "05_haru_q6", "session": "R5春", "gap": 4, "num": 6, "topic": "線形探索法", "subcat": "アルゴリズム", "category": "テクノロジ系", "mondai": "従業員番号と氏名の対がn件格納されている表に線形探索法を用いて，与えられた従業員番号から氏名を検索する。この処理における平均比較回数を求める式はどれか。ここで，検索する従業員番号はランダムに出現し，探索は常に表の先頭から行う。また，与えられた従業員番号がこの表に存在しない確率をaとする。", "choices": {"ア": "(n＋1)na2", "イ": "(n＋1)(1－a)2", "ウ": "(n＋1)(1－a)2＋n2", "エ": "(n＋1)(1－a)2＋na"}, "ans": "エ", "hist_count": 2, "past_history": ["応用情報技術者 H26春期 問6", "ソフトウェア開発技術者 H20秋期 問12"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q6.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">データ数がnの線形リストを先頭から探索する場合、最小探索回数は1回、最大探索回数はn回なので、目的のデータがある場合の平均探索回数は<em class=\"r\"><span class=\"frac\"><span>n＋1</span>2</span></em>回です。一方、目的のデータが存在しない場合は、リストの最後まで検索することになるので探索回数は常にn回となります。<br/><br/>データが存在しない確率がaなので、データが存在する確率は(1－a)です。したがって、設問の探索処理における平均探索回数は、以下の2つを足し合わせた式で表すことができます。<dl><dt>対象がリストに存在する場合の平均探索回数×対象が存在する確率</dt><dd><span class=\"frac\"><span>n＋1</span>2</span>×(1－a)</dd><dt>対象がリストに存在しない場合の探索回数×対象が存在しない確率</dt><dd>n×a</dd></dl>つまり、<br/>　平均比較回数＝<span class=\"frac\"><span>n＋1</span>2</span>×(1－a)＋n×a<br/>となり、この数式を整えると、<span class=\"frac\"><span>(n＋1)(1－a)</span>2</span>＋na になります。</div>", "mondai_html": "従業員番号と氏名の対がn件格納されている表に線形探索法を用いて，与えられた従業員番号から氏名を検索する。この処理における平均比較回数を求める式はどれか。ここで，検索する従業員番号はランダムに出現し，探索は常に表の先頭から行う。また，与えられた従業員番号がこの表に存在しない確率をaとする。", "choices_html": {"ア": "<span class=\"frac\"><span>(n＋1)na</span>2</span>", "イ": "<span class=\"frac\"><span>(n＋1)(1－a)</span>2</span>", "ウ": "<span class=\"frac\"><span>(n＋1)(1－a)</span>2</span>＋<span class=\"frac\"><span>n</span>2</span>", "エ": "<span class=\"frac\"><span>(n＋1)(1－a)</span>2</span>＋na"}}, {"id": "05_haru_q15", "session": "R5春", "gap": 4, "num": 15, "topic": "信頼性を高める技術", "subcat": "システムの構成", "category": "テクノロジ系", "mondai": "コンピュータシステムの信頼性を高める技術に関する記述として，適切なものはどれか。", "choices": {"ア": "フェールセーフは，構成部品の信頼性を高めて，故障が起きないようにする技術である。", "イ": "フェールソフトは，ソフトウェアに起因するシステムフォールトに対処するための技術である。", "ウ": "フォールトアボイダンスは，構成部品に故障が発生しても運用を継続できるようにする技術である。", "エ": "フォールトトレランスは，システムを構成する重要部品を多重化して，故障に備える技術である。"}, "ans": "エ", "hist_count": 2, "past_history": ["ソフトウェア開発技術者 H15春期 問38", "ソフトウェア開発技術者 H19春期 問36"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">フェールセーフは、システムの不具合や故障が発生したときに、障害の影響範囲を最小限にとどめ、安全を最優先にして制御を行う考え方です。本記述はフォールトアボイダンスを説明した文です。</li><li class=\"lii\">フェールソフトは、システムに障害が発生したときに、多少の性能低下を許容しつつ、システム全体の運転継続に必要な機能を維持させる考え方です。ソフトウェアに起因する障害ではなく、ハードウェアに起因する障害に対処するための技術なので間違った説明です。</li><li class=\"liu\">フォールトアボイダンスは、システムを構成する部品の信頼性を高めることで、故障自体の発生率を下げる技術です。本記述はフェールソフトを説明した文です。</li><li class=\"lie\">正しい。フォールトトレランスは、システムの構成部品を多重化し、システムの一部に障害が発生しても全体としては停止することなく稼働を続け、その間に復旧を図るようにシステムを設計する技術です。</li></ul></div>", "mondai_html": "コンピュータシステムの信頼性を高める技術に関する記述として，適切なものはどれか。", "choices_html": {"ア": "フェールセーフは，構成部品の信頼性を高めて，故障が起きないようにする技術である。", "イ": "フェールソフトは，ソフトウェアに起因するシステムフォールトに対処するための技術である。", "ウ": "フォールトアボイダンスは，構成部品に故障が発生しても運用を継続できるようにする技術である。", "エ": "フォールトトレランスは，システムを構成する重要部品を多重化して，故障に備える技術である。"}}, {"id": "05_haru_q18", "session": "R5春", "gap": 4, "num": 18, "topic": "仮想記憶方式に関する記述", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "仮想記憶方式に関する記述のうち，適切なものはどれか。", "choices": {"ア": "LRUアルゴリズムは，使用後の経過時間が最長のページを置換対象とするページ置換アルゴリズムである。", "イ": "アドレス変換をインデックス方式で行う場合は，主記憶に存在する全ページ分のページテーブルが必要になる。", "ウ": "ページフォールトが発生した場合は，ガーベジコレクションが必要である。", "エ": "ページングが繰り返されるうちに多数の小さな空きメモリ領域が発生することを，フラグメンテーションという。"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 H28春期 問18", "ソフトウェア開発技術者 H20春期 問23"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">正しい。<strong>LRU</strong>(Least Recently Used)は、最も長い期間使用されていないページを置換え対象とするアルゴリズムです。</li><li class=\"lii\">インデックス方式では、小さなページテーブルをいくつか用いて使用中の仮想空間の領域だけをカバーし、本当に必要なときだけ追加のページテーブルを作成する多段ページテーブルを用いるので、必要最低限のページテーブルだけで済みます。</li><li class=\"liu\">ページフォールトが発生した場合は、置換え対象を決定した後、ページアウト／ページインが行われます。</li><li class=\"lie\">フラグメンテーション(メモリの断片化)は、様々なサイズ(可変長)のメモリの取得や解放が繰り返されることによって発生します。ページング方式の交換単位となるページは固定長なので、フラグメンテーションが発生することはありません。</li></ul></div>", "mondai_html": "仮想記憶方式に関する記述のうち，適切なものはどれか。", "choices_html": {"ア": "LRUアルゴリズムは，使用後の経過時間が最長のページを置換対象とするページ置換アルゴリズムである。", "イ": "アドレス変換をインデックス方式で行う場合は，主記憶に存在する全ページ分のページテーブルが必要になる。", "ウ": "ページフォールトが発生した場合は，ガーベジコレクションが必要である。", "エ": "ページングが繰り返されるうちに多数の小さな空きメモリ領域が発生することを，フラグメンテーションという。"}}, {"id": "05_haru_q25", "session": "R5春", "gap": 4, "num": 25, "topic": "コンピュータグラフィックス技法", "subcat": "マルチメディア応用", "category": "テクノロジ系", "mondai": "コンピュータグラフィックスに関する記述のうち，適切なものはどれか。", "choices": {"ア": "テクスチャマッピングは，全てのピクセルについて，視線と全ての物体との交点を計算し，その中から視点に最も近い交点を選択することによって，陰面消去を行う。", "イ": "メタボールは，反射・透過方向への視線追跡を行わず，与えられた空間中のデータから輝度を計算する。", "ウ": "ラジオシティ法は，拡散反射面間の相互反射による効果を考慮して拡散反射面の輝度を決める。", "エ": "レイトレーシングは，形状が定義された物体の表面に，別に定義された模様を張り付けて画像を作成する。"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 R3秋期 問25", "応用情報技術者 H22秋期 問27"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">テクスチャマッピングは、多数のポリゴン(多角形)の組合せで構成させる3DCG表面に壁紙のようなものを貼り付け、擬似的な凹凸や表面模様などを付加することで質感の向上をもたらす技法です。本記述は、陰面消去方法のひとつであるZバッファ法を説明した文です。</li><li class=\"lii\">メタボールは、物体を球や楕円体の集合として擬似的にモデル化することで、滑らかな物体を表現する技術です。本記述は、レイキャスティング法を説明した文です。</li><li class=\"liu\">正しい。<strong>ラジオシティ</strong>は、各ポリゴンに光のエネルギー量を持たせて形状の相互反射を計算することで、間接光（やわらかい光の回り込み）などを表現する技術です。照明工学の分野で発達した技術を3DCGのレンダリングに応用したものです。</li><li class=\"lie\">レイトレーシングは、3DCGを作成する時に必要となる陰影をつけるときに使われる手法で、観察者(物体を見ている目)から光源の経路を逆に追跡し、算術演算によって物体表面の輝度を求める手法です。本記述は、テクスチャマッピングを説明した文です。</li></ul></div>", "mondai_html": "コンピュータグラフィックスに関する記述のうち，適切なものはどれか。", "choices_html": {"ア": "テクスチャマッピングは，全てのピクセルについて，視線と全ての物体との交点を計算し，その中から視点に最も近い交点を選択することによって，陰面消去を行う。", "イ": "メタボールは，反射・透過方向への視線追跡を行わず，与えられた空間中のデータから輝度を計算する。", "ウ": "ラジオシティ法は，拡散反射面間の相互反射による効果を考慮して拡散反射面の輝度を決める。", "エ": "レイトレーシングは，形状が定義された物体の表面に，別に定義された模様を張り付けて画像を作成する。"}}, {"id": "05_haru_q41", "session": "R5春", "gap": 4, "num": 41, "topic": "TPMに該当するものはどれか", "subcat": "情報セキュリティ対策", "category": "テクノロジ系", "mondai": "TPM(Trusted Platform Module)に該当するものはどれか。", "choices": {"ア": "PCなどの機器に搭載され，鍵生成，ハッシュ演算及び暗号処理を行うセキュリティチップ", "イ": "受信した電子メールが正当な送信者から送信されたものであることを保証する送信ドメイン認証技術", "ウ": "ファイアウォール，侵入検知，マルウェア対策など，複数のセキュリティ機能を統合したネットワーク監視装置", "エ": "ログデータを一元的に管理し，セキュリティイベントの監視者への通知及び相関分析を行うシステム"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 R2秋期 問44", "応用情報技術者 H30春期 問45"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q41.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>TPM</strong>(Trusted Platform Module)は、PCのマザーボード上に直付けされるセキュリティチップで、暗号化と復号、鍵ペアの生成と管理、ハッシュ値の計算、乱数生成、デジタル署名の生成・検証などの機能を有します。<br/><br/>TPMによって提供されるセキュリティ機能には以下のようなものがあります。<ul><li>OSやアプリケーションの改ざん検知</li><li>端末認証</li><li>プラットフォームの整合性の検証</li><li>ストレージ全体の暗号化</li></ul>したがって「ア」が適切です。<ul><li class=\"lia\">正しい。TPMの説明です。</li><li class=\"lii\">SPF(Sender Policy Framework)の説明です。</li><li class=\"liu\">UTM(Unified Threat Management，統合脅威管理)の説明です。</li><li class=\"lie\">SIEM(Security Information and Event Management)の説明です。</li></ul></div>", "mondai_html": "TPM(Trusted Platform Module)に該当するものはどれか。", "choices_html": {"ア": "PCなどの機器に搭載され，鍵生成，ハッシュ演算及び暗号処理を行うセキュリティチップ", "イ": "受信した電子メールが正当な送信者から送信されたものであることを保証する送信ドメイン認証技術", "ウ": "ファイアウォール，侵入検知，マルウェア対策など，複数のセキュリティ機能を統合したネットワーク監視装置", "エ": "ログデータを一元的に管理し，セキュリティイベントの監視者への通知及び相関分析を行うシステム"}}, {"id": "05_haru_q42", "session": "R5春", "gap": 4, "num": 42, "topic": "デジタルフォレンジックスの手順", "subcat": "情報セキュリティ対策", "category": "テクノロジ系", "mondai": "デジタルフォレンジックスの手順は収集，検査，分析及び報告から成る。このとき，デジタルフォレンジックスの手順に含まれるものはどれか。", "choices": {"ア": "サーバとネットワーク機器のログをログ管理サーバに集約し，リアルタイムに相関分析することによって，不正アクセスを検出する。", "イ": "サーバのハードディスクを解析し，削除されたログファイルを復元することによって，不正アクセスの痕跡を発見する。", "ウ": "電子メールを外部に送る際に，本文及び添付ファイルを暗号化することによって，情報漏えいを防ぐ。", "エ": "プログラムを実行する際に，プログラムファイルのハッシュ値と脅威情報を突き合わせることによって，プログラムがマルウェアかどうかを検査する。"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 R7秋期 問44", "応用情報技術者 H31春期 問39"], "web_url": "https://www.ap-siken.com/kakomon/05_haru/q42.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>デジタルフォレンジックス</strong>は、インシデントの発生時に関連するデジタル機器上の電磁的記録を確実かつ正確に収集・取得し、保全するとともに、分析・解析を行い、法的紛争やトラブルにおける立証に役立てる活動です。<br/><br/>IPAが公開している「インシデント対応へのフォレンジック技法の統合に関するガイド」によれば、デジタルフォレンジックスの手順は、収集・検査・分析・報告の4つのフェーズから成ります。<ul><li><b>収集</b>：特定の事象に関連するデータの識別、ラベル付け、記録、および収集を行い、その完全性を保護する</li><li><b>検査</b>：収集されたデータの種類に適したフォレンジックツールやフォレンジック技法を実行することにより、データの完全性を保護しながら、収集されたデータから関連する情報を識別し、抽出する</li><li><b>分析</b>：検査結果を分析することにより、収集と検査を行う契機となった疑問を解決するのに役立つ情報を導き出す</li><li><b>報告</b>：分析フェーズによって得られた結果を報告する</li></ul>選択肢のうち、セキュリティインシデントの痕跡を集めている「イ」が、デジタルフォレンジックスの手順のうち「収集・検査」に該当します。<ul><li class=\"lia\">SIEM(Security Information and Event Management)に関する記述です。</li><li class=\"lii\">正しい。デジタルフォレンジックスに関する記述です。</li><li class=\"liu\">DLP(Data Loss Prevention)に関する記述です。</li><li class=\"lie\">EDR(Endpoint Detection and Response)に関する記述です。</li></ul></div>", "mondai_html": "デジタルフォレンジックスの手順は収集，検査，分析及び報告から成る。このとき，デジタルフォレンジックスの手順に含まれるものはどれか。", "choices_html": {"ア": "サーバとネットワーク機器のログをログ管理サーバに集約し，リアルタイムに相関分析することによって，不正アクセスを検出する。", "イ": "サーバのハードディスクを解析し，削除されたログファイルを復元することによって，不正アクセスの痕跡を発見する。", "ウ": "電子メールを外部に送る際に，本文及び添付ファイルを暗号化することによって，情報漏えいを防ぐ。", "エ": "プログラムを実行する際に，プログラムファイルのハッシュ値と脅威情報を突き合わせることによって，プログラムがマルウェアかどうかを検査する。"}}, {"id": "04_aki_q1", "session": "R4秋", "gap": 5, "num": 1, "topic": "2進数の表現", "subcat": "離散数学", "category": "テクノロジ系", "mondai": "aを正の整数とし，b＝a 2 とする。aを2進数で表現するとnビットであるとき，bを2進数で表現すると最大で何ビットになるか。", "choices": {"ア": "n＋1", "イ": "2n", "ウ": "n2", "エ": "2n"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 H25春期 問1", "ソフトウェア開発技術者 H18秋期 問1"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li>aが2ビット → 2ビットで表現できる最大値は3<br/>b＝3<sup>2</sup>＝9<br/>9までの数値を2進数で表現するには4ビットが必要なので、bは最大で4ビットとなります。<br/>つまり、a＝2のときb＝4</li><li>aが3ビット → 3ビットで表現できる最大値は7<br/>b＝7<sup>2</sup>＝49<br/>49までの数値を2進数で表現するには6ビットが必要なので、bは最大で6ビットとなります。<br/>つまり、a＝3のときb＝6</li><li>aが4ビット → 4ビットで表現できる最大値は15<br/>b＝15<sup>2</sup>＝225<br/>225までの数値を2進数で表現するには8ビットが必要なので、bは最大で8ビットとなります。<br/>つまり、a＝4のときb＝8</li><li>aが5ビット → 5ビットで表現できる最大値は31<br/>b＝31<sup>2</sup>＝961<br/>961までの数値を2進数で表現するには10ビットが必要なので、bは最大で10ビットとなります。<br/>つまり、a＝5のときb＝10</li></ul>一般化すると b＝2a の関係式が成立するので、aがnであるときのbを表す式は「2n」になります。</div>", "mondai_html": "aを正の整数とし，b＝a<sup>2</sup>とする。aを2進数で表現するとnビットであるとき，bを2進数で表現すると最大で何ビットになるか。", "choices_html": {"ア": "n＋1", "イ": "2n", "ウ": "n<sup>2</sup>", "エ": "2<sup>n</sup>"}}, {"id": "04_aki_q9", "session": "R4秋", "gap": 5, "num": 9, "topic": "ライトスルーの説明", "subcat": "メモリ", "category": "テクノロジ系", "mondai": "キャッシュメモリのライトスルーの説明として，適切なものはどれか。", "choices": {"ア": "CPUがメモリに書込み動作をするとき，キャッシュメモリだけにデータを書き込む。", "イ": "CPUがメモリに書込み動作をするとき，キャッシュメモリと主記憶の両方に同時にデータを書き込む。", "ウ": "主記憶のデータの変更は，キャッシュメモリから当該データが追い出される時に行う。", "エ": "主記憶へのアクセス頻度が少ないので，バスの占有率が低い。"}, "ans": "イ", "hist_count": 2, "past_history": ["応用情報技術者 H29春期 問10", "基本情報技術者 H15秋期 問23"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">キャッシュメモリと主記憶の同期をとるための方式として、ライトバックとライトスルーがあります。<dl><dt>ライトバック(write back)</dt><dd>CPUから書込み命令が出たときにキャッシュメモリだけに書き込み、主記憶への書込みはキャッシュメモリからデータが追い出されるときに行う方式<br/>⇒速度は向上するがデータの整合性を保つための制御が余分に必要になる<br/></dd><dt>ライトスルー(write through)</dt><dd>CPUから書込み命令が出たときにキャッシュメモリと同時に主記憶にも書き込む方式<br/>⇒データの整合性は得られるが処理速度は低下する</dd></dl><ul><li class=\"lia\">書込み命令が出たときにキャッシュメモリだけにデータを書き込むのは、ライトバック方式です。</li><li class=\"lii\">正しい。ライトスルー方式では、書込み命令が出たときにキャッシュメモリと主記憶の両方に同時にデータを書き込みます。</li><li class=\"liu\">キャッシュメモリから当該データが追い出される時に主記憶への書込みを行うのは、ライトバック方式です。</li><li class=\"lie\">主記憶への書込む頻度はライトスルー＞ライトバックなので、両者の方式を比較したとき、主記憶へのアクセス頻度が少ないのはライトバック方式です。</li></ul></div>", "mondai_html": "キャッシュメモリのライトスルーの説明として，適切なものはどれか。", "choices_html": {"ア": "CPUがメモリに書込み動作をするとき，キャッシュメモリだけにデータを書き込む。", "イ": "CPUがメモリに書込み動作をするとき，キャッシュメモリと主記憶の両方に同時にデータを書き込む。", "ウ": "主記憶のデータの変更は，キャッシュメモリから当該データが追い出される時に行う。", "エ": "主記憶へのアクセス頻度が少ないので，バスの占有率が低い。"}}, {"id": "04_aki_q17", "session": "R4秋", "gap": 5, "num": 17, "topic": "ページング方式", "subcat": "オペレーティングシステム", "category": "テクノロジ系", "mondai": "ほとんどのプログラムの大きさがページサイズの半分以下のシステムにおいて，ページサイズを半分にしたときに予想されるものはどれか。ここで，このシステムは主記憶が不足しがちで，多重度やスループットなどはシステム性能の限界で運用しているものとする。", "choices": {"ア": "ページサイズが小さくなるので，領域管理などのオーバーヘッドが減少する。", "イ": "ページ内に余裕がなくなるので，ページ置換えによってシステム性能が低下する。", "ウ": "ページ内の無駄な空き領域が減少するので，主記憶不足が緩和される。", "エ": "ページフォールトの回数が増加するので，システム性能が低下する。"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 H22秋期 問19", "ソフトウェア開発技術者 H18春期 問23"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ページング方式</strong>とは、仮想記憶管理方式の一つで、仮想アドレス空間を「ページ」と呼ばれる<strong>固定長</strong>の区画に分割するとともに主記憶のアドレス空間（実アドレス空間）も同じように固定長に分割して、このページ単位で主記憶と仮想記憶（補助記憶装置）のアドレス変換を行う方式です。<ul><li class=\"lia\">ページサイズを半分にすると、同じ容量を管理するために必要なページ数は2倍になります。OSが管理するページテーブルのエントリ数も2倍になるため、システムのオーバーヘッドは増加します。</li><li class=\"lii\">ほとんどのプログラムはページサイズの半分以下なので、多くは1つのページに収まります。ページサイズが小さくなると、その分だけ主記憶上に展開できるプログラムが増えます。これにより、主記憶が不足しがちなシステムではページフォールトの回数が減って、システムの性能は向上します。</li><li class=\"liu\">正しい。ページ内の無駄な空き領域が減ることで、主記憶に載せられるページ数が増えます。これまで無駄になっていた主記憶の容量を有効に使うことができるので、主記憶不足が緩和されます。</li><li class=\"lie\">ページサイズが半分になると、その分だけ主記憶に展開できるプログラムが増えます。その結果、ページフォールトの回数が減って、システムの性能は向上します。</li></ul></div>", "mondai_html": "ほとんどのプログラムの大きさがページサイズの半分以下のシステムにおいて，ページサイズを半分にしたときに予想されるものはどれか。ここで，このシステムは主記憶が不足しがちで，多重度やスループットなどはシステム性能の限界で運用しているものとする。", "choices_html": {"ア": "ページサイズが小さくなるので，領域管理などのオーバーヘッドが減少する。", "イ": "ページ内に余裕がなくなるので，ページ置換えによってシステム性能が低下する。", "ウ": "ページ内の無駄な空き領域が減少するので，主記憶不足が緩和される。", "エ": "ページフォールトの回数が増加するので，システム性能が低下する。"}}, {"id": "04_aki_q24", "session": "R4秋", "gap": 5, "num": 24, "topic": "顧客コードは少なくとも何桁必要か", "subcat": "UX/UIデザイン", "category": "テクノロジ系", "mondai": "顧客に，A～Zの英大文字26種類を用いた顧客コードを割り当てたい。現在の顧客総数は8,000人であって，毎年，前年対比で2割ずつ顧客が増えていくものとする。3年後まで全顧客にコードを割り当てられるようにするためには，顧客コードは少なくとも何桁必要か。", "choices": {"ア": "3", "イ": "4", "ウ": "5", "エ": "6"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 H26秋期 問23", "基本情報技術者 H29春期 問23"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">3年後の予想顧客総数は、現在の顧客総数を1.2倍することを3回（3年分）繰り返すことで求めることができます。<br/><br/>　8,000人×1.2×1.2×1.2＝13,824人<br/><br/>26種類の文字を使ったn桁で表せるコードの総数は26<sup>n</sup>個なので、選択肢それぞれの桁数に設定したときの最大顧客数は次のように計算できます。<br/><ul class=\"none\"><li>3桁 → 26<sup>3</sup>＝17,576<br/>※この段階で3年後の予想顧客総数(13,824人)を上回っているため、正解は<em class=\"r\">3桁</em>とわかります。</li><li>4桁 → 26<sup>4</sup>＝456,976</li><li>5桁 → 26<sup>5</sup>＝11,881,376</li><li>6桁 → 26<sup>6</sup>＝308,915,776</li></ul>設問では「少なくとも何桁必要か」と訊いているので、正解は「ア」になります。</div>", "mondai_html": "顧客に，A～Zの英大文字26種類を用いた顧客コードを割り当てたい。現在の顧客総数は8,000人であって，毎年，前年対比で2割ずつ顧客が増えていくものとする。3年後まで全顧客にコードを割り当てられるようにするためには，顧客コードは少なくとも何桁必要か。", "choices_html": {"ア": "3", "イ": "4", "ウ": "5", "エ": "6"}}, {"id": "04_aki_q25", "session": "R4秋", "gap": 5, "num": 25, "topic": "H.264/MPEG-4 AVCに関する記述", "subcat": "マルチメディア技術", "category": "テクノロジ系", "mondai": "H.264/MPEG-4 AVCに関する記述はどれか。", "choices": {"ア": "インターネットで動画や音声データのストリーミング配信を制御するための通信方式", "イ": "テレビ会議やテレビ電話で双方向のビデオ配信を制御するための通信方式", "ウ": "テレビの電子番組案内で使用される番組内容のメタデータを記述する方式", "エ": "ワンセグやインターネットで用いられる動画データの圧縮符号化方式"}, "ans": "エ", "hist_count": 2, "past_history": ["応用情報技術者 R1秋期 問25", "基本情報技術者 H30春期 問25"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>H.264/MPEG-4 AVC</strong>は、ワンセグ放送などの低速・低画質のものからデジタルハイビジョンTVクラスの高ビットレート用途に至るまで、幅広く利用されることを想定した動画の圧縮符号化に関する規格です。<br/>1回ごとの差分情報の量を小さくするなどの改良を行うことで、従来から使用されてきたMPEG-2と比較して2倍以上の圧縮効率を実現しており、ワンセグ、テレビ会議システム、インターネット放送、Blu-Ray Disc、YouTube等の動画共有サービスなど様々な場面で使用されています。<br/><br/>この規格の名称表記についてですが、ITU-Tが「H.264」、ISO/IECが「MPEG-4 AVC (ISO/IEC 14496-10)」として同じ内容をそれぞれ勧告・規定し、共同策定となったため「H.264/MPEG-4 AVC」または「MPEG-4 AVC/H.264」と両規格を併記することが多いようです。AVC(Advanced Video Coding，高度動画圧縮符号化)とは、MPEG-4規格書のPart10のタイトルであり\"MPEG-4 Part10：AVC\"の略称です。<ul><li class=\"lia\">RTSP(Real Time Streaming Protocol)の説明です。</li><li class=\"lii\">SIP(Session Initiation Protocol)の説明です。</li><li class=\"liu\">電子番組表(Electronic Program Guide：EPG)や電子コンテンツガイド(Electronic Content Guide：ECG)の説明です。</li><li class=\"lie\">正しい。H.264/MPEG-4 AVCは動画圧縮方式の1つです。</li></ul></div>", "mondai_html": "H.264/MPEG-4 AVCに関する記述はどれか。", "choices_html": {"ア": "インターネットで動画や音声データのストリーミング配信を制御するための通信方式", "イ": "テレビ会議やテレビ電話で双方向のビデオ配信を制御するための通信方式", "ウ": "テレビの電子番組案内で使用される番組内容のメタデータを記述する方式", "エ": "ワンセグやインターネットで用いられる動画データの圧縮符号化方式"}}, {"id": "04_aki_q29", "session": "R4秋", "gap": 5, "num": 29, "topic": "前進復帰可能なトランザクション", "subcat": "トランザクション処理", "category": "テクノロジ系", "mondai": "チェックポイントを取得するDBMSにおいて，図のような時間経過でシステム障害が発生した。前進復帰(ロールフォワード)によって障害回復できるトランザクションだけを全て挙げたものはどれか。", "choices": {"ア": "T1", "イ": "T2 と T3", "ウ": "T4 と T5", "エ": "T5"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 H27秋期 問30", "ソフトウェア開発技術者 H17春期 問68"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q29.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><b>ロールフォワード</b>(前進復帰)は、データベースシステムに障害が起こったとき、トランザクションの更新後ログを使用することで過去に処理したトランザクションを再現し、システム障害の直前までデータベースの状態を回復させる処理です。<br/><br/>システム障害から復帰すると、データベースの状態はチェックポイント時点のデータに戻ります。トランザクションには、処理がすべて実行されるか・全く実行されないかのどちらか終了する性質（原子性）と、一旦正常終了したトランザクションの結果は、その後システムに障害が発生しても失われない性質（永続性）が要求されますから、復帰後はこの性質を満たすためにロールフォワードやロールバックが行われます。<br/><br/>図の5つのトランザクションは、復帰後の対処によって3つのグループに分かれます。<dl><dt>T1</dt><dd>チェックポイント前にコミットされているので、コミットの内容は復帰後のデータベースに反映されている。よって、何もしない。</dd><dt>T2、T3</dt><dd>トランザクション処理中に障害が起こったので、原子性に基づき、データベースをトランザクション開始前の状態に戻す。よって、ロールバックを行う。</dd><dt>T4、T5</dt><dd>チェックポイント後、障害発生前にコミットがあったので、永続性に基づき、失われたコミットの内容を復帰後のデータベースに反映させる。よって、ロールフォワードを行う。</dd></dl><div class=\"img_margin\"><img alt=\"29a.png/image-size:336×217\" height=\"217\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/29a.png\" style=\"max-width: 100%; height: auto;\" width=\"336\"/></div>以上より、前進復帰の対象となるのは「最後のチェックポイントからシステム障害発生までの間」にコミットされたトランザクションとなります。したがって正解は「T4とT5」です。</div>", "mondai_html": "チェックポイントを取得するDBMSにおいて，図のような時間経過でシステム障害が発生した。前進復帰(ロールフォワード)によって障害回復できるトランザクションだけを全て挙げたものはどれか。<div class=\"img_margin\"><img alt=\"29.png/image-size:471×256\" height=\"256\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/29.png\" style=\"max-width: 100%; height: auto; display: block; margin: 10px 0;\" width=\"471\"/></div>", "choices_html": {"ア": "T1", "イ": "T2 と T3", "ウ": "T4 と T5", "エ": "T5"}}, {"id": "04_aki_q32", "session": "R4秋", "gap": 5, "num": 32, "topic": "ウェルノウンポート番号", "subcat": "通信プロトコル", "category": "テクノロジ系", "mondai": "TCP/IPネットワークで，データ転送用と制御用とに異なるウェルノウンポート番号が割り当てられているプロトコルはどれか。", "choices": {"ア": "FTP", "イ": "POP3", "ウ": "SMTP", "エ": "SNMP"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 R7春期 問33", "基本情報技術者 H26秋期 問33"], "web_url": "https://www.ap-siken.com/kakomon/04_aki/q32.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ウェルノウンポート番号</strong>とは、16ビットのポート番号 0～65535 のうち、よく利用される特定のアプリケーション用に予約されている 0～1023 までの番号のことです。ウェルノウン(well-known)は、英語で「よく知られている、有名な」という意味の形容詞です。システムポートとも呼ばれます。<br/><br/>情報処理技術者試験でも出題可能性がある、下記のプロトコルとポート番号の組みについては押さえておきましょう。<ul><li>HTTP　80/TCP</li><li>HTTPS　443/TCP</li><li>FTP　20/TCP、21/TCP</li><li>SSH　22/TCP</li><li>SMTP　25/TCP</li><li>POP3　110/TCP</li><li>DNS　53/TCP、53/UDP</li><li>NTP　123/UDP</li></ul><ul><li class=\"lia\">正しい。FTPではデータの転送用に「20/TCP」、制御用に「21/TCP」が割り当てられています。<br/>制御用(21/TCP)は、ファイルをダウンロードするGET(RETR)やアップロードのPUT(STOR)などのコマンド送信と、その応答をやり取りするためのコネクション、データ転送用(20/TCP)は、制御用のコネクションとは別にデータの転送処理が発生する度に確立されるコネクションです。<div class=\"img_margin\"><img alt=\"32.png/image-size:517×111\" height=\"111\" src=\"https://www.ap-siken.com/kakomon/04_aki/img/32.png\" style=\"max-width: 100%; height: auto;\" width=\"517\"/></div></li><li class=\"lii\">POP3が使用するポートは「110/TCP」だけです。</li><li class=\"liu\">SMTPでは通常のメール転送用に「25/TCP」、メールソフトからメールサーバに届けるときの送信専用の宛先ポート(サブミッションポート)に「587/TCP」を使用します。</li><li class=\"lie\">SNMPではマネージャ側からエージェントに通知するときに「161/UDP」、逆にエージェント側からマネージャに通知するときに「162/UDP」を使用します。</li></ul></div>", "mondai_html": "TCP/IPネットワークで，データ転送用と制御用とに異なるウェルノウンポート番号が割り当てられているプロトコルはどれか。", "choices_html": {"ア": "FTP", "イ": "POP3", "ウ": "SMTP", "エ": "SNMP"}}, {"id": "04_haru_q14", "session": "R4春", "gap": 6, "num": 14, "topic": "MTTRを短くするのに役立つもの", "subcat": "システムの評価指標", "category": "テクノロジ系", "mondai": "MTBFを長くするよりも，MTTRを短くするのに役立つものはどれか。", "choices": {"ア": "エラーログ取得機能", "イ": "記憶装置のビット誤り訂正機能", "ウ": "命令再試行機能", "エ": "予防保全"}, "ans": "ア", "hist_count": 2, "past_history": ["応用情報技術者 R2秋期 問14", "応用情報技術者 H29秋期 問13"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>MTTR</strong>(Mean Time To Repair)は、システムの障害から回復するために要した平均修復時間なので、障害からの回復時間を短くできる施策を選びます。MTTRを短くする施策には、エラーログの取得、命令トレース機能、遠隔保守、保守部門の分散配置などがあります。<ul><li class=\"lia\">正しい。エラーログには障害原因に関連する情報が記録されていることがあります。障害発生時にエラーログを分析することは、障害原因を迅速に特定する手段として有効です。このためエラーログ取得機能はMTTRを短くするのに役立ちます。</li><li class=\"lii\">記憶装置の誤り訂正機能があれば、障害の原因となるビット誤りを自動で解消できるので、MTBFを長くするのに役立ちます。</li><li class=\"liu\">命令が何らかの原因によりエラーになっても、再試行機能による再試行が成功すればシステムが停止せずに済みます。よって、MTBFを長くするために役立ちます。</li><li class=\"lie\">予防保全では異常がないかをチェックしたり経年劣化した部品を故障前に交換したりするので、障害発生を未然に防ぐ効果があります。よって、MTBFを長くするのに役立ちます。</li></ul></div>", "mondai_html": "MTBFを長くするよりも，MTTRを短くするのに役立つものはどれか。", "choices_html": {"ア": "エラーログ取得機能", "イ": "記憶装置のビット誤り訂正機能", "ウ": "命令再試行機能", "エ": "予防保全"}}, {"id": "04_haru_q15", "session": "R4春", "gap": 6, "num": 15, "topic": "稼働率の計算", "subcat": "システムの評価指標", "category": "テクノロジ系", "mondai": "2台のプリンターがあり，それぞれの稼働率が0.7と0.6である。この2台のプリンターのいずれか一方が稼動していて，他方が故障している確率は幾らか。ここで，2台のプリンターの稼動状態は独立であり，プリンター以外の要因は考慮しないものとする。", "choices": {"ア": "0.18", "イ": "0.28", "ウ": "0.42", "エ": "0.46"}, "ans": "エ", "hist_count": 2, "past_history": ["応用情報技術者 H21秋期 問17", "応用情報技術者 H26秋期 問14"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">片方の機器だけが稼働している割合は、全体から両方の機器が稼働している割合と両方の機器が故障している割合を引くことで求めることができます。<br/><br/>式で表すと以下のとおりです。<br/><br/>　<b>片方のみが稼働している割合＝1－両方が稼働している割合－両方が故障している割合</b><br/><br/>この式を使って答えを求めます。<dl><dt>両方が稼働している割合</dt><dd>0.7×0.6＝0.42</dd><dt>両方が故障している割合</dt><dd>故障率＝1－稼働率なので、{(1－0.7)×(1－0.6)}＝0.3×0.4＝0.12</dd><dt>片方だけが稼働している割合</dt><dd>1－0.42－0.12＝0.46</dd></dl>したがって、プリンターのいずれか一方が稼動していて、他方が故障している確率は「0.46」です。</div>", "mondai_html": "2台のプリンターがあり，それぞれの稼働率が0.7と0.6である。この2台のプリンターのいずれか一方が稼動していて，他方が故障している確率は幾らか。ここで，2台のプリンターの稼動状態は独立であり，プリンター以外の要因は考慮しないものとする。", "choices_html": {"ア": "0.18", "イ": "0.28", "ウ": "0.42", "エ": "0.46"}}, {"id": "04_haru_q24", "session": "R4春", "gap": 6, "num": 24, "topic": "ユーザビリティの評価手法", "subcat": "ユーザーインタフェース技術", "category": "テクノロジ系", "mondai": "ユーザーインタフェースのユーザビリティを評価するときの，利用者が参加する手法と専門家だけで実施する手法の適切な組みはどれか。", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "ウ", "hist_count": 2, "past_history": ["応用情報技術者 R1秋期 問24", "応用情報技術者 R7春期 問22"], "web_url": "https://www.ap-siken.com/kakomon/04_haru/q24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">ユーザビリティに関する標準規格であるJIS Z 8521では、ユーザビリティ(使用性)を「ある製品が，指定された利用者によって，指定された利用の状況下で，指定された目的を達成するために用いられる際の，有効さ，効率及び利用者の満足度の度合い」と定義しています。端的にいえばユーザビリティとは「利用者にとっての使いやすさ」のことです。<br/><br/>それぞれのユーザビリティ評価手法は次のようなものです。<dl><dt>アンケート（質問紙法）</dt><dd>専門家が用意した質問用紙を多数の利用者に配布し、記入したもらった回答を分析することで評価する手法</dd><dt>回顧法</dt><dd>被験者にタスクを実行してもらい、専門家がその行動を観察し、事後の質問への回答とともに分析する手法</dd><dt>思考発話法</dt><dd>被験者にタスクを実行してもらい、その操作を行っている間、考えたことや感じたことを口に出してもらうことで利用者の感じ方や思考を分析する手法</dd><dt>認知的ウォークスルー法</dt><dd>複数の専門家が、設計仕様書や紙のプロトタイプを見ながら、対象となるユーザーの行動をシミュレーションしていくことで問題点を明らかにしていく手法。人の認知過程を基準にする</dd><dt>ヒューリスティック評価法</dt><dd>複数の専門家が、設計仕様書や紙のプロトタイプを見ながら、既知の経験則に照らし合わせて問題点を明らかにする手法。ヒューリスティックとは「経験則」の意で、専門家の経験則を基準にする</dd></dl>5つの評価手法を\"利用者が参加する手法\"と\"専門家だけで実施する手法\"に分類すると次のようになります。<dl><dt>利用者が参加する手法</dt>
