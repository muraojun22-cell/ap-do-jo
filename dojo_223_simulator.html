報を交換するための仕様です。<br/><br/>標準化団体OASISによって策定されていて、2025年現在の最新バージョンは2005年にリリースのSAML2.0です。主に複数のドメインにまたがったセキュアなシングルサインオンを実現するための仕組みとして使用されています。<br/><br/>SAMLでは様々な方法によるシングルサインオンが規定されていますが、その一つの基本的な手順は以下のとおりです。<ol><li>利用者がSP(Service Provider)にアクセスする</li><li>SPはIdP(Identity Provider)にSAML認証要求を送り、既に認証を受けているかどうかを問い合わせる</li><li>IdPは認証済の利用者であるかどうかをSPに応答する（SAMLアサーション）</li><li>利用者が認証済であればSPにログインできる</li></ol><div class=\"img_margin\"><img alt=\"04.png/image-size:501×269\" height=\"269\" src=\"https://www.sc-siken.com/kakomon/03_aki/img/04.png\" style=\"max-width: 100%; height: auto;\" width=\"501\"/></div><ul><li class=\"lia\">正しい。SAML方式の説明です。</li><li class=\"lii\">クッキー方式の説明です。</li><li class=\"liu\">Kerberos方式の説明です。</li><li class=\"lie\">リバースプロキシ方式の説明です。</li></ul></div>", "past_history": ["安全確保支援士 R5春期 問3", "安全確保支援士 R7春期 問2"], "hist_count": 3}, {"id": "sc_03_aki_q5", "session": "支援士 R3秋", "gap": 7, "num": 5, "topic": "サイバーキルチェーン", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "サイバーキルチェーンに関する説明として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">サイバーキルチェーンに関する説明として，適切なものはどれか。</div>", "choices": {"ア": "委託先の情報セキュリティリスクが委託元にも影響するという考え方を基にしたリスク分析のこと", "イ": "攻撃者がクライアントとサーバとの間の通信を中継し，あたかもクライアントとサーバが直接通信しているかのように装うことによって情報を盗聴するサイバー攻撃手法のこと", "ウ": "攻撃者の視点から，攻撃の手口を偵察から目的の実行までの段階に分けたもの", "エ": "取引データを複数の取引ごとにまとめ，それらを時系列につなげたチェーンに保存することによって取引データの改ざんを検知可能にしたもの"}, "choices_html": {"ア": "委託先の情報セキュリティリスクが委託元にも影響するという考え方を基にしたリスク分析のこと", "イ": "攻撃者がクライアントとサーバとの間の通信を中継し，あたかもクライアントとサーバが直接通信しているかのように装うことによって情報を盗聴するサイバー攻撃手法のこと", "ウ": "攻撃者の視点から，攻撃の手口を偵察から目的の実行までの段階に分けたもの", "エ": "取引データを複数の取引ごとにまとめ，それらを時系列につなげたチェーンに保存することによって取引データの改ざんを検知可能にしたもの"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>サイバーキルチェーン</strong>は、サイバー攻撃の手順を攻撃者の視点からいくつかの段階に分けモデル化したものです。攻撃の段階としては、偵察、武器化、配送、エクスプロイト、インストール、遠隔操作、目的の実行という7段階が一般的です。攻撃者の視点からサイバー攻撃を見ることで、各段階における防御策の立案に役立てることができます。<dl><dt>1. 偵察</dt><dd>標的に関する情報を収集して調査する</dd><dt>2. 武器化</dt><dd>攻撃のためのマルウェアを用意する</dd><dt>3. 配送（デリバリ）</dt><dd>メールやWebサイトを使って標的にマルウェアを送付／配信する、または標的のシステムに侵入する</dd><dt>4. エクスプロイト（攻撃）</dt><dd>標的にマルウェアを実行させる</dd><dt>5. インストール</dt><dd>標的のPCがマルウェアに感染する</dd><dt>6. 遠隔操作（C&amp;C）</dt><dd>マルウェアとC&amp;Cサーバを通信させて標的のサーバを遠隔操作する</dd><dt>7. 目的の実行</dt><dd>秘密情報を得る、サービス停止、改ざんなど攻撃者の目的を達成する</dd></dl><ul><li class=\"lia\">サプライチェーンリスクに関する説明です。</li><li class=\"lii\">中間者攻撃に関する説明です。</li><li class=\"liu\">正しい。サイバーキルチェーンの説明です。</li><li class=\"lie\">ブロックチェーンに関する説明です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_aki_q6", "session": "支援士 R3秋", "gap": 7, "num": 6, "topic": "ステートフルパケットインスペクション", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "ファイアウォールにおけるステートフルパケットインスペクションの特徴はどれか。", "mondai_html": "<div id=\"mondai\">ファイアウォールにおけるステートフルパケットインスペクションの特徴はどれか。</div>", "choices": {"ア": "IPアドレスの変換が行われることによって，内部のネットワーク構成を外部から隠蔽できる。", "イ": "暗号化されたパケットのデータ部を復号して，許可された通信かどうかを判断できる。", "ウ": "過去に通過したリクエストパケットに対応付けられる戻りのパケットを通過させることができる。", "エ": "パケットのデータ部をチェックして，アプリケーション層での不正なアクセスを防止できる。"}, "choices_html": {"ア": "IPアドレスの変換が行われることによって，内部のネットワーク構成を外部から隠蔽できる。", "イ": "暗号化されたパケットのデータ部を復号して，許可された通信かどうかを判断できる。", "ウ": "過去に通過したリクエストパケットに対応付けられる戻りのパケットを通過させることができる。", "エ": "パケットのデータ部をチェックして，アプリケーション層での不正なアクセスを防止できる。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_6.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ステートフルインスペクション</strong>は、ダイナミックパケットフィルター方式とも呼ばれ、ファイアウォールを通過する個々のセッションの状態を管理し、その情報に基づき動的にポートを開閉することで詳細なアクセス制御を行うファイアウォールの方式です。ステートフル(stateful)とは、システムが一連のセッション状態を保持し、個々の通信とセッション情報を照らし合わせて処理を決定する方式や考え方をいいます。<br/><br/>静的なフィルタリングテーブルでは、1つの通信に対して発信パケットと戻りパケットの両方を登録しておかなければなりませんが、ステートフルインスペクション方式の初期フィルタリングテーブルには、通信の開始時に使われるパケットのみを通過許可ルールとして設定しておきます。<br/>実際に通信要求があると、接続要求に対する応答、それに付随するコネクションなどの通信を許可する一時的なルールが自動的にフィルタリングテーブルに追加されます。さらに通信後のセッション終了に伴い、追加された一時的ルールは破棄されます。<br/><br/>この仕組みにより、ルール設定の平易化、およびフィルタリングテーブルの不備を悪用した不正アクセスや順序関係の矛盾したパケットの通過を防止するセキュリティ効果が期待できます。したがって適切な記述は「ウ」です。<ul><li class=\"lia\">NAT機能及びNAPT機能の特徴です。</li><li class=\"lii\">復号機能は持ちません。</li><li class=\"liu\">正しい。ステートフルパケットインスペクションの特徴です。</li><li class=\"lie\">アプリケーションゲートウェイ型ファイアウォールやWAFの特徴です。パケットフィルター型はデータ部のチェックを行いません。</li></ul></div>", "past_history": ["安全確保支援士 R1秋期 問5", "情報セキュリティ H24秋期 問6", "情報セキュリティ H26春期 問6", "情報セキュリティ H28秋期 問5", "安全確保支援士 H30春期 問6"], "hist_count": 6}, {"id": "sc_03_aki_q7", "session": "支援士 R3秋", "gap": 7, "num": 7, "topic": "FIPS PUB 140-3の記述内容はどれか", "subcat": "セキュリティ技術評価", "category": "情報セキュリティ", "mondai": "FIPS PUB 140-3の記述内容はどれか。", "mondai_html": "<div id=\"mondai\">FIPS PUB 140-3の記述内容はどれか。</div>", "choices": {"ア": "暗号モジュールのセキュリティ要求事項", "イ": "情報セキュリティマネジメントシステムの要求事項", "ウ": "デジタル証明書や証明書失効リストの技術仕様", "エ": "無線LANセキュリティの技術仕様"}, "choices_html": {"ア": "暗号モジュールのセキュリティ要求事項", "イ": "情報セキュリティマネジメントシステムの要求事項", "ウ": "デジタル証明書や証明書失効リストの技術仕様", "エ": "無線LANセキュリティの技術仕様"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>FIPS 140</strong>(Federal Information Processing Standardization 140)は、米国連邦政府機関が利用するハードウェア及びソフトウェア両方を含む\"暗号モジュール\"に関するセキュリティ要件を規定した米国連邦政府標準規格です。NIST（米国国立標準技術研究所）が制定しており、2021年1月現在の最新版は「FIPS 140-3」です。FIPS 140-3では、レベル1からレベル4までの4段階のセキュリティレベルを11の領域で規定しています。<br/><br/>したがって正しい記述は「ア」です。<ul><li class=\"lia\">正しい。FIPS PUB 140-3の記述内容です。</li><li class=\"lii\">JIS Q 27001の記述内容です。</li><li class=\"liu\">ITU-T X.509の記述内容です。</li><li class=\"lie\">IEEE802.11iの記述内容です。</li></ul></div>", "past_history": ["安全確保支援士 R6春期 問10", "情報セキュリティ H22秋期 問3", "情報セキュリティ H24秋期 問8", "情報セキュリティ H26秋期 問5", "安全確保支援士 H29春期 問7", "安全確保支援士 H30秋期 問5"], "hist_count": 7}, {"id": "sc_03_aki_q8", "session": "支援士 R3秋", "gap": 7, "num": 8, "topic": "CRLの運用を説明したものはどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "X.509におけるCRL(Certificate Revocation List)に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">X.509におけるCRL(Certificate Revocation List)に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "PKIの利用者のWebブラウザは，認証局の公開鍵がWebブラウザに組み込まれていれば，CRLを参照しなくてもよい。", "イ": "RFC 5280では，認証局は，発行したデジタル証明書のうち失効したものについては，シリアル番号を失効後1年間CRLに記載するよう義務付けている。", "ウ": "認証局は，発行した全てのデジタル証明書の有効期限をCRLに記載する。", "エ": "認証局は，有効期限内のデジタル証明書のシリアル番号をCRLに登録することがある。"}, "choices_html": {"ア": "PKIの利用者のWebブラウザは，認証局の公開鍵がWebブラウザに組み込まれていれば，CRLを参照しなくてもよい。", "イ": "RFC 5280では，認証局は，発行したデジタル証明書のうち失効したものについては，シリアル番号を失効後1年間CRLに記載するよう義務付けている。", "ウ": "認証局は，発行した全てのデジタル証明書の有効期限をCRLに記載する。", "エ": "認証局は，有効期限内のデジタル証明書のシリアル番号をCRLに登録することがある。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>X.509</strong>は、ITU-Tが1988年に勧告したデジタル証明書及びCRLの標準仕様で、ISO/IEC 9594-8として国際規格化されています。<strong>CRL</strong>(Certificate Revocation List：証明書失効リスト)は、秘密鍵の漏洩・紛失、証明書の被発行者の規則違反などの理由で、公開鍵基盤(PKI)において失効した公開鍵証明書のシリアル番号のリストです。<ul><li class=\"lia\">ブラウザに組み込まれている公開鍵の有効性を検証するためにはCRLを参照しなくてはなりません。</li><li class=\"lii\">CRLでの公開期限は失効状態になったデジタル証明書の有効期限が切れるまでです。RFC 5280によれば「CRLのエントリは、失効した証明書の有効期間を超えて定期的に発行されるCRLに記載されるまで、CRLから削除してはならない」とあります。</li><li class=\"liu\">CRLはデジタル証明書の有効期限を記述するものではありません。</li><li class=\"lie\">正しい。名前の変更、被認証者と認証機関との関係の変更、秘密鍵の危殆化や漏えいなどの理由で認証の役に立たなくなった証明書は、無効化するために有効期限内であってもCRLに登録されます。</li></ul></div>", "past_history": ["安全確保支援士 R1秋期 問6", "安全確保支援士 R6春期 問6", "情報セキュリティ H23特別 問6", "情報セキュリティ H27春期 問6", "情報セキュリティ H28秋期 問7", "安全確保支援士 H30春期 問8"], "hist_count": 7}, {"id": "sc_03_aki_q9", "session": "支援士 R3秋", "gap": 7, "num": 9, "topic": "JIS Q 27017に記載されている管理策", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "JIS Q 27002:2014には記載されていないが，JIS Q 27017:2016において記載されている管理策はどれか。", "mondai_html": "<div id=\"mondai\">JIS Q 27002:2014には記載されていないが，JIS Q 27017:2016において記載されている管理策はどれか。</div>", "choices": {"ア": "クラウドサービス固有の情報セキュリティ管理策", "イ": "事業継続マネジメントシステムにおける管理策", "ウ": "情報セキュリティガバナンスにおける管理策", "エ": "制御システム固有のサイバーセキュリティ管理策"}, "choices_html": {"ア": "クラウドサービス固有の情報セキュリティ管理策", "イ": "事業継続マネジメントシステムにおける管理策", "ウ": "情報セキュリティガバナンスにおける管理策", "エ": "制御システム固有のサイバーセキュリティ管理策"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>JIS Q 27017</strong>は、情報セキュリティマネジメントシステム（JIS Q 27002）のサブセットで、クラウドサービス固有の情報セキュリティ管理策及び実施の手引きが規定されたJIS規格です。<br/><br/>本規格では、クラウドサービスカスタマ(利用者)及びクラウドサービスプロバイダ(提供者)のための情報セキュリティ管理策の実施を支援する指針を提示しています。業務でクラウドサービスに係る場合にはJIS Q 27002の管理策に加えて、JIS Q 27017からも適切な管理策を取捨選択して情報セキュリティマネジメントシステムを構築しなければなりません。<br/><br/>したがって「ア」が正解です。<ul><li class=\"lia\">正しい。JIS Q 27017にはクラウドサービス固有の情報セキュリティ管理策が示されています。</li><li class=\"lii\">事業継続マネジメントシステムの要求事項を示した規格は、JIS Q 22301です。</li><li class=\"liu\">情報セキュリティガバナンスの枠組みを示した規格は、JIS Q 27014です。</li><li class=\"lie\">産業用オートメーション及び制御システムを対象としたサイバーセキュリティのマネジメントシステムをCSMS(Cyber Security Management System)といいます。CSMSの要求事項はIEC 62443-2-1に示されています。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_aki_q10", "session": "支援士 R3秋", "gap": 7, "num": 10, "topic": "Secure属性を付けたときの動作", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "cookieにSecure属性を設定しなかったときと比較した，設定したときの動作として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">cookieにSecure属性を設定しなかったときと比較した，設定したときの動作として，適切なものはどれか。</div>", "choices": {"ア": "cookieに設定された有効期間を過ぎると，cookieが無効化される。", "イ": "JavaScriptによるcookieの読出しが禁止される。", "ウ": "URL内のスキームがhttpsのときだけ，Webブラウザからcookieが送出される。", "エ": "WebブラウザがアクセスするURL内のパスとcookieに設定されたパスのプレフィックスが一致するときだけ，WebブラウザからCookieが送出される。"}, "choices_html": {"ア": "cookieに設定された有効期間を過ぎると，cookieが無効化される。", "イ": "JavaScriptによるcookieの読出しが禁止される。", "ウ": "URL内のスキームがhttpsのときだけ，Webブラウザからcookieが送出される。", "エ": "WebブラウザがアクセスするURL内のパスとcookieに設定されたパスのプレフィックスが一致するときだけ，WebブラウザからCookieが送出される。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_10.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>Secure属性</strong>は、cookieの動作を制御する属性のひとつで、これが付与されたcookieは<em class=\"r\">HTTPS</em>による暗号化通信、すなわちアクセス先のURLが「https://～」である場合のみWebブラウザからサーバに送信されるようになります。平文でやり取りされるHTTP通信「http://～」ではcookie送信を禁止することで、cookie情報の漏えい、セッションIDの盗聴によるセッションハイジャックなど被害を防ぎます。<br/><br/>したがって適切な動作は「ウ」です。<br/><br/>また、cookieを発行する際に指定できる属性には\"Secure\"の他に以下の属性があります。<ul><li><b>Domain</b> - cookieを送信するドメインを指定する</li><li><b>Path</b> - cookieを送信するURLディレクトリを指定する</li><li><b>Expires</b> - cookieの有効期限を指定する</li><li><b>HttpOnly</b> - JavaScriptからのアクセスを禁止する</li><li><b>SameSite</b> - サイトをまたがるリクエストの際のcookie送信を制御する</li></ul><ul><li class=\"lia\">Expires属性の動作です。</li><li class=\"lii\">HttpOnly属性の動作です。</li><li class=\"liu\">正しい。Secure属性の動作です。</li><li class=\"lie\">Path属性の動作です。</li></ul></div>", "past_history": ["安全確保支援士 R1秋期 問11", "情報セキュリティ H28秋期 問9", "安全確保支援士 H30春期 問11"], "hist_count": 4}, {"id": "sc_03_aki_q11", "session": "支援士 R3秋", "gap": 7, "num": 11, "topic": "TCP23番ポートへの攻撃が多い理由", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "ネットワークカメラなどのIoT機器ではTCP23番ポートへの攻撃が多い理由はどれか。", "mondai_html": "<div id=\"mondai\">ネットワークカメラなどのIoT機器ではTCP23番ポートへの攻撃が多い理由はどれか。</div>", "choices": {"ア": "TCP23番ポートはIoT機器の操作用プロトコルで使用されており，そのプロトコルを用いると，初期パスワードを使って不正ログインが容易に成功し，不正にIoT機器を操作できることが多いから", "イ": "TCP23番ポートはIoT機器の操作用プロトコルで使用されており，そのプロトコルを用いると，マルウェアを添付した電子メールをIoT機器に送信するという攻撃ができることが多いから", "ウ": "TCP23番ポートはIoT機器へのメール送信用プロトコルで使用されており，そのプロトコルを用いると，初期パスワードを使って不正ログインが容易に成功し，不正にIoT機器を操作できることが多いから", "エ": "TCP23番ポートはIoT機器へのメール送信用プロトコルで使用されており，そのプロトコルを用いると，マルウェアを添付した電子メールをIoT機器に送信するという攻撃ができることが多いから"}, "choices_html": {"ア": "TCP23番ポートはIoT機器の操作用プロトコルで使用されており，そのプロトコルを用いると，初期パスワードを使って不正ログインが容易に成功し，不正にIoT機器を操作できることが多いから", "イ": "TCP23番ポートはIoT機器の操作用プロトコルで使用されており，そのプロトコルを用いると，マルウェアを添付した電子メールをIoT機器に送信するという攻撃ができることが多いから", "ウ": "TCP23番ポートはIoT機器へのメール送信用プロトコルで使用されており，そのプロトコルを用いると，初期パスワードを使って不正ログインが容易に成功し，不正にIoT機器を操作できることが多いから", "エ": "TCP23番ポートはIoT機器へのメール送信用プロトコルで使用されており，そのプロトコルを用いると，マルウェアを添付した電子メールをIoT機器に送信するという攻撃ができることが多いから"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_11.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">TCP23番ポートは <strong>Telnet</strong> というサービスに割り当てられているポート番号です。Telnetは遠隔地からネットワークを通じて別のコンピュータをリモート操作するためのプロトコルです。<br/><br/>IoT機器の中には外部からのメンテナンス等のためにTelnetでサービスを待ち受けていることが多く、また、機器にログインするためのID・パスワードの組みが初期値のまま、若しくは安易な文字列(root,admin,userなど)に設定されているケースが少なくありません。IoT機器を狙うマルウェアは、この脆弱性に付け込み感染を広げようとします。家庭用ルータやネットワークカメラに感染するマルウェア「Mirai」も同様の手口によって巨大ボットネットワークを構築していました。<br/><br/>TCP23番ポートへの攻撃が多い理由は、TCP23番ポート(Telnet)でサービスを待ち受けており、初期パスワード等で安易に不正ログインできる可能性が高いからです。したがって「ア」の記述が適切です。<br/><br/>なお、メール送信プロトコル(SMTP)のポート番号はTCP25番ポートです。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_aki_q12", "session": "支援士 R3秋", "gap": 7, "num": 12, "topic": "デジタルフォレンジックス", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "外部から侵入されたサーバ及びそのサーバに接続されていた記憶媒体を調査対象としてデジタルフォレンジックスを行うことになった。まず，稼働状態にある調査対象サーバや記憶媒体などから表に示すa～dのデータを証拠として保全する。保全の順序のうち，最も適切なものはどれか。", "mondai_html": "<div id=\"mondai\">外部から侵入されたサーバ及びそのサーバに接続されていた記憶媒体を調査対象としてデジタルフォレンジックスを行うことになった。まず，稼働状態にある調査対象サーバや記憶媒体などから表に示すa～dのデータを証拠として保全する。保全の順序のうち，最も適切なものはどれか。<div class=\"img_margin\"><img alt=\"12.png/image-size:482×153\" height=\"153\" src=\"https://www.sc-siken.com/kakomon/03_aki/img/12.png\" style=\"max-width: 100%; height: auto;\" width=\"482\"/></div></div>", "choices": {"ア": "a → c → d → b", "イ": "b → c → a → d", "ウ": "c → a → d → b", "エ": "d → c → a → b"}, "choices_html": {"ア": "a → c → d → b", "イ": "b → c → a → d", "ウ": "c → a → d → b", "エ": "d → c → a → b"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_12.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">デジタルフォレンジックスにおける証拠収集では、証拠の滅失を避けるために、原則として揮発性の高い情報から順に処理します。RFC3227の日本語訳「証拠収集とアーカイビングのためのガイドライン」によれば、典型的なシステムにおける揮発性の順は次のとおりです。<div class=\"img_margin\"><img alt=\"12a.png/image-size:525×253\" height=\"253\" src=\"https://www.sc-siken.com/kakomon/03_aki/img/12a.png\" style=\"max-width: 100%; height: auto;\" width=\"525\"/></div>設問の表に示された各データを上表に対応させると、a＝遠隔ログ、b＝アーカイブメディア、c＝ディスク上のファイル、d＝ルーティングテーブルに該当します。これを揮発性の高い順に並べた「d → c → a → b」が適切な保全順序になります。したがって「エ」が正解です。<br/><br/>参考URL: RFC3227 証拠収集とアーカイビングのためのガイドライン<br/><a href=\"https://www.nic.ad.jp/ja/tech/ipa/RFC3227JA.html\" target=\"_blank\">https://www.nic.ad.jp/ja/tech/ipa/RFC3227JA.html</a></div>", "past_history": ["安全確保支援士 H29秋期 問16"], "hist_count": 2}, {"id": "sc_03_aki_q13", "session": "支援士 R3秋", "gap": 7, "num": 13, "topic": "テンペスト攻撃を説明したもの", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "テンペスト攻撃を説明したものはどれか。", "mondai_html": "<div id=\"mondai\">テンペスト攻撃を説明したものはどれか。</div>", "choices": {"ア": "故意に暗号化演算を誤動作させ，正しい処理結果との差異を解析する。", "イ": "処理時間の差異を計測して解析する。", "ウ": "処理中に機器から放射される電磁波を観測して解析する。", "エ": "チップ内の信号線などに探針を直接当て，処理中のデータを観測して解析する。"}, "choices_html": {"ア": "故意に暗号化演算を誤動作させ，正しい処理結果との差異を解析する。", "イ": "処理時間の差異を計測して解析する。", "ウ": "処理中に機器から放射される電磁波を観測して解析する。", "エ": "チップ内の信号線などに探針を直接当て，処理中のデータを観測して解析する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>テンペスト攻撃</strong>は、モニターやキーボード、ネットワークケーブルなどから放射されている微弱な電磁波を傍受し解析することで元の情報の再現を試みる攻撃手法です。一般に知られている実験では、ブラウン管ディスプレイやケーブルから発生する電磁波を3m離れた地点で傍受して、表示されている画像を再現した例があります。<ul><li class=\"lia\">故障利用攻撃の説明です。</li><li class=\"lii\">タイミング攻撃の説明です。</li><li class=\"liu\">正しい。テンペスト攻撃の説明です。</li><li class=\"lie\">プロ―ビングの説明です。</li></ul></div>", "past_history": ["情報セキュリティ H23秋期 問11", "情報セキュリティ H26春期 問11", "情報セキュリティ H27秋期 問14", "安全確保支援士 H30春期 問13"], "hist_count": 5}, {"id": "sc_03_aki_q14", "session": "支援士 R3秋", "gap": 7, "num": 14, "topic": "ルートキットの特徴はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "ルートキットの特徴はどれか。", "mondai_html": "<div id=\"mondai\">ルートキットの特徴はどれか。</div>", "choices": {"ア": "OSなどに不正に組み込んだツールの存在を隠す。", "イ": "OSの中核であるカーネル部分の脆弱性を分析する。", "ウ": "コンピュータがマルウェアに感染していないことをチェックする。", "エ": "コンピュータやルータのアクセス可能な通信ポートを外部から調査する。"}, "choices_html": {"ア": "OSなどに不正に組み込んだツールの存在を隠す。", "イ": "OSの中核であるカーネル部分の脆弱性を分析する。", "ウ": "コンピュータがマルウェアに感染していないことをチェックする。", "エ": "コンピュータやルータのアクセス可能な通信ポートを外部から調査する。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_14.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ルートキット</strong>(rootkit)は、システムへのアクセスを確保した攻撃者が、その後の不正な活動を行いやすくするために作動中のプロセスやファイル、ログやシステムデータを隠ぺいするためのソフトウェア群です。ユーザーやシステム管理者に見られたとしてもrootkitが侵入の痕跡を隠ぺいすることで攻撃者はroot権限(管理者権限)を確保し続ける可能性が高まります。<ul><li class=\"lia\">正しい。ルートキットの説明です。</li><li class=\"lii\">脆弱性検査ツールの説明です。</li><li class=\"liu\">ウィルス対策ソフトの説明です。</li><li class=\"lie\">ポートスキャナーの説明です。</li></ul></div>", "past_history": ["情報セキュリティ H21春期 問12", "情報セキュリティ H23秋期 問13", "情報セキュリティ H25秋期 問11", "情報セキュリティ H27春期 問12", "情報セキュリティ H28秋期 問12", "安全確保支援士 H30春期 問15"], "hist_count": 7}, {"id": "sc_03_aki_q16", "session": "支援士 R3秋", "gap": 7, "num": 16, "topic": "EAP-TLSが行う認証はどれか", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "IEEE802.1Xで使われるEAP-TLSが行う認証はどれか。", "mondai_html": "<div id=\"mondai\">IEEE802.1Xで使われるEAP-TLSが行う認証はどれか。</div>", "choices": {"ア": "CHAPを用いたチャレンジレスポンスによる利用者認証", "イ": "あらかじめ登録した共通鍵によるサーバ認証と，時刻同期のワンタイムパスワードによる利用者認証", "ウ": "デジタル証明書による認証サーバとクライアントの相互認証", "エ": "利用者IDとパスワードによる利用者認証"}, "choices_html": {"ア": "CHAPを用いたチャレンジレスポンスによる利用者認証", "イ": "あらかじめ登録した共通鍵によるサーバ認証と，時刻同期のワンタイムパスワードによる利用者認証", "ウ": "デジタル証明書による認証サーバとクライアントの相互認証", "エ": "利用者IDとパスワードによる利用者認証"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>IEEE802.1X</strong>は、有線LANまたは無線LANにおける利用者認証の規格です。IEEE802.1Xでは、サプリカント(利用者端末)と認証サーバの認証に様々な方式を選択できるように、認証プロトコルにEAP(Extensible Authentication Protocol)を使います。<br/><br/><strong>EAP-TLS</strong>は、EAPでサポートされている方式の1つで、サーバおよびクライアント認証にTLSの機構を用いたものです。TLSではサーバとクライアントの間で<em class=\"r\">デジタル証明書を用いた相互認証</em>を行うため、適切な記述は「ウ」になります。<div class=\"img_margin\"><img alt=\"16.png/image-size:555×288\" height=\"288\" src=\"https://www.sc-siken.com/kakomon/03_aki/img/16.png\" style=\"max-width: 100%; height: auto;\" width=\"555\"/></div><ul><li class=\"lia\">EAP-MD5の認証です。</li><li class=\"lii\">EAP-TTLSなどの認証です。</li><li class=\"liu\">正しい。EAP-TLSの認証です。</li><li class=\"lie\">利用者IDとパスワードを使うのはEAP-PEAPの認証です。</li></ul></div>", "past_history": ["安全確保支援士 R1秋期 問16", "情報セキュリティ H23特別 問2", "情報セキュリティ H24秋期 問2", "情報セキュリティ H27春期 問2", "情報セキュリティ H28秋期 問14"], "hist_count": 6}, {"id": "sc_03_aki_q18", "session": "支援士 R3秋", "gap": 7, "num": 18, "topic": "L2ネットワークをカプセル化するプロトコル", "subcat": "ネットワーク管理", "category": "情報セキュリティ", "mondai": "レイヤー3ネットワーク内に論理的なレイヤー2ネットワークをカプセル化によって構築するプロトコルはどれか。", "mondai_html": "<div id=\"mondai\">レイヤー3ネットワーク内に論理的なレイヤー2ネットワークをカプセル化によって構築するプロトコルはどれか。</div>", "choices": {"ア": "IEEE802.1ad(QinQ)", "イ": "IPsec", "ウ": "PPPoE", "エ": "VXLAN"}, "choices_html": {"ア": "IEEE802.1ad(QinQ)", "イ": "IPsec", "ウ": "PPPoE", "エ": "VXLAN"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">IEEE802.1ad(QinQ)は、多くの利用者が共用する広域イーサネット等において、VLAN IDの重複とVLAN数の不足(最大4,094個)を克服するために、MACフレームのヘッダーにVLANタグを二重で付ける技術です。元のVALNタグをカスタマータグ、回線事業者の方で付けるVLANタグをサービスタグと言います。</li><li class=\"lii\">IPsecは、ネットワーク層(レイヤー3)でデータの暗号化を行うプロトコルです。</li><li class=\"liu\">PPPoE(PPP over Ethernet)は、電話回線やISDNでインターネットを接続する際に使われるPPPをイーサネット上で利用できるようにしたものです。</li><li class=\"lie\">正しい。VXLANは、イーサネットフレーム全体をIP/UDPヘッダーとVXLANヘッダーでカプセル化することで、レイヤー3ネットワーク上に論理的なレイヤー2ネットワークを構築するトンネリングプロトコルです。離れたサブネットに属する複数のレイヤー2ネットワークをつなぐ、共通のレイヤー2ネットワークを構築するために使用されます。VXLANセグメント同士はカプセル化を行うVTEP(Virtual Tunnel End Point)を経由して通信を行います。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_aki_q19", "session": "支援士 R3秋", "gap": 7, "num": 19, "topic": "二つのセグメント間の伝送制御", "subcat": "データ通信と制御", "category": "情報セキュリティ", "mondai": "イーサネットにおいて，ルータで接続された二つのセグメント間でのコリジョンの伝搬と、宛先MACアドレスの全てのビットが1であるブロードキャストフレームの中継について，適切な組合せはどれか。", "mondai_html": "<div id=\"mondai\">イーサネットにおいて，ルータで接続された二つのセグメント間でのコリジョンの伝搬と、宛先MACアドレスの全てのビットが1であるブロードキャストフレームの中継について，適切な組合せはどれか。</div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表\" src=\"https://www.sc-siken.com/kakomon/03_aki/img/19.png\" style=\"max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>コリジョン</strong>とは、同一の伝送路上で別々の端末から発信された信号同士が衝突する現象です。コリジョンの伝搬が発生する範囲は「コリジョンドメイン」と呼ばれ、物理層で動作するリピータやハブを介して接続されたネットワークがその範囲となります。<br/><br/><strong>ブロードキャストフレーム</strong>は、あるネットワークに属するすべてのノードに対してデータを同報通信するためフレームです。ブロードキャストフレームが届く範囲は「ブロードキャストドメイン」と呼ばれ、リピータやハブ、データリンク層のブリッジで構成されたネットワークがその範囲となります。<div class=\"img_margin\"><img alt=\"19_1.png/image-size:458×353\" height=\"353\" src=\"https://www.sc-siken.com/kakomon/03_aki/img/19_1.png\" style=\"max-width: 100%; height: auto;\" width=\"458\"/></div>コリジョンは「ハブで構成された範囲」まで、ブロードキャストフレームは「ブリッジで構成される範囲」までしか届かないので、どちらもルータで隔てられた別のネットワークセグメントまでは届きません。<div class=\"img_margin\"><img alt=\"19_2.png/image-size:452×121\" height=\"121\" src=\"https://www.sc-siken.com/kakomon/03_aki/img/19_2.png\" style=\"max-width: 100%; height: auto;\" width=\"452\"/></div>したがって正しい組合せは「ア」です。</div>", "past_history": ["安全確保支援士 R7春期 問18", "情報セキュリティ H23特別 問16", "安全確保支援士 H29秋期 問18"], "hist_count": 4}, {"id": "sc_03_aki_q20", "session": "支援士 R3秋", "gap": 7, "num": 20, "topic": "利用可能なホスト数は最大幾つか", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "クラスBのIPアドレスで，サブネットマスクが16進数の FFFFFF80 である場合，利用可能なホスト数は最大幾つか。", "mondai_html": "<div id=\"mondai\">クラスBのIPアドレスで，サブネットマスクが16進数の FFFFFF80 である場合，利用可能なホスト数は最大幾つか。</div>", "choices": {"ア": "126", "イ": "127", "ウ": "254", "エ": "255"}, "choices_html": {"ア": "126", "イ": "127", "ウ": "254", "エ": "255"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">16進数のサブネットマスク\"FFFFFF80\"を8ビットずつ区切り10進数で表すと以下のように表記になります。<br/><br/>　FF.FF.FF.80 → 255.255.255.128<br/><br/>このサブネットマスクを2進数に変換すると、先頭から25ビット目までがネットワークアドレス部、残りの7ビットがホストアドレス部であることがわかります。7ビットで表現できるビットパターンは2<sup>7</sup>個ですが、ホストアドレス部のビットが全て\"1\"の「ブロードキャストアドレス」と、全て\"0\"の「ネットワークアドレス」はホストアドレスには使えないため、この2つを除いた数が利用可能なホスト数となります。<br/><br/>　2<sup>7</sup>－2＝128－2＝<em class=\"r\">126</em><br/><br/>したがって「ア」が正解です。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_aki_q21", "session": "支援士 R3秋", "gap": 7, "num": 21, "topic": "参照制約", "subcat": "データベース設計", "category": "情報セキュリティ", "mondai": "次の表において，\"在庫\"表の製品番号に参照制約が定義されているとき，その参照制約によって拒否される可能性のある操作はどれか。ここで，実線の下線は主キーを，破線の下線は外部キーを表す。在庫（在庫管理番号,製品番号, 在庫量）製品（製品番号, 製品名, 型, 単価）", "mondai_html": "<div id=\"mondai\">次の表において，\"在庫\"表の製品番号に参照制約が定義されているとき，その参照制約によって拒否される可能性のある操作はどれか。ここで，実線の下線は主キーを，破線の下線は外部キーを表す。<br/><br/>　在庫（<u>在庫管理番号</u>, <span class=\"bbdash\">製品番号</span>, 在庫量）<br/>　製品（<u>製品番号</u>, 製品名, 型, 単価）</div>", "choices": {"ア": "\"在庫\"表の行削除", "イ": "\"在庫\"表の表削除", "ウ": "\"在庫\"表への行追加", "エ": "\"製品\"表への行追加"}, "choices_html": {"ア": "\"在庫\"表の行削除", "イ": "\"在庫\"表の表削除", "ウ": "\"在庫\"表への行追加", "エ": "\"製品\"表への行追加"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>参照制約</strong>とは、関係データベースにおける整合性制約のひとつで、「あるテーブルで利用しようとする値が、別のテーブルで候補キー（または主キー）として存在していなければならない」というルールです。<br/><br/>設問の例では、\"在庫\"表が参照元、\"製品\"表が参照先に当たります。このため、\"在庫\"表の製品番号の参照制約により、\"在庫\"表の\"製品番号\"列の値が、\"製品\"表の主キー（\"製品番号\"列）の値として存在している必要があります。これは、\"製品\"表に存在しない製品を、\"在庫\"表に登録できないことを意味しています。<br/><br/>参照制約がある場合、行の追加と削除に制限が加えられます。具体的には、次の2つの場面が問題となります。<dl><dt>参照元表への行の追加</dt><dd>参照先の表に存在しない値を含む行が追加された場合、参照制約を満たせなくなる</dd><dt>参照先表の行の削除</dt><dd>別表から参照されている値を含む行が削除された場合、参照制約を満たせなくなる</dd></dl><ul><li class=\"lia\">\"在庫\"表は参照する側の表なので、削除に関しては制限されません。</li><li class=\"lii\">\"在庫\"表は参照する側の表なので、削除に関しては制限されません。</li><li class=\"liu\">正しい。\"在庫\"表に行を追加する際に、\"製品番号\"列の値として\"製品\"表に存在しない値を指定すると、参照制約問題が発生して操作が拒否されます。</li><li class=\"lie\">\"製品\"表は参照される側の表なので、追加に関しては制限されません。</li></ul></div>", "past_history": ["安全確保支援士 H31春期 問21"], "hist_count": 2}, {"id": "sc_03_aki_q22", "session": "支援士 R3秋", "gap": 7, "num": 22, "topic": "探索的テスト", "subcat": "ソフトウェア構築", "category": "情報セキュリティ", "mondai": "テスト担当者が，ソフトウェアを動作させてその動きを学習しながら，自身の経験に基づいて以降のテストを動的に計画して進めるテストの方法はどれか。", "mondai_html": "<div id=\"mondai\">テスト担当者が，ソフトウェアを動作させてその動きを学習しながら，自身の経験に基づいて以降のテストを動的に計画して進めるテストの方法はどれか。</div>", "choices": {"ア": "実験計画法", "イ": "状態遷移テスト", "ウ": "探索的テスト", "エ": "モデルベースドテスト"}, "choices_html": {"ア": "実験計画法", "イ": "状態遷移テスト", "ウ": "探索的テスト", "エ": "モデルベースドテスト"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>探索的テスト</strong>とは、1983年に Cem Kaner 博士によって提唱されたテスト手法の1つで、ソフトウェアの理解とテスト設計とテスト実行を同時に行うテストです。あらかじめテスト項目を作成せず、ソフトウェアを実行した結果を観察することで思考を深めて、更なるテストを実行していくことが特徴です。短時間ででき、テスト効率が高いとされていますが、テスト担当者に高度なスキルが要求されます。<br/><br/>したがって「ウ」が正解です。<ul><li class=\"lia\">実験計画法は、確認すべき複数の要因をうまく組み合わせることによって、なるべく少ない実験回数で効率的に実験を実施する手法です。</li><li class=\"lii\">状態遷移テストは、次々と変化していくソフトウェア状態の状態遷移図で表し、そのすべての状態と経路を網羅するようにテストケースを作成する手法です。</li><li class=\"liu\">正しい。</li><li class=\"lie\">モデルベースドテストは、テスト設計モデルを用いてテストケースを設計する技術の総称です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_aki_q23", "session": "支援士 R3秋", "gap": 7, "num": 23, "topic": "ブルーレイディスクのコンテンツ保護技術", "subcat": "知的財産適用管理", "category": "情報セキュリティ", "mondai": "ブルーレイディスクで使われているコンテンツ保護技術はどれか。", "mondai_html": "<div id=\"mondai\">ブルーレイディスクで使われているコンテンツ保護技術はどれか。</div>", "choices": {"ア": "AACS", "イ": "CPRM", "ウ": "CSS", "エ": "WMRM"}, "choices_html": {"ア": "AACS", "イ": "CPRM", "ウ": "CSS", "エ": "WMRM"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">正しい。AACS(Advanced Access Content System)は、ブルーレイディスク用のコンテンツ保護技術で、コンテンツをタイトルキーで暗号化し、タイトルキーをメディアキーで暗号化し、メディアキーをデバイスキー(AACSキー)で暗号化するという3段階の暗号化でコピーガードを行います（鍵長128ビット）。</li><li class=\"lii\">Content Protection for Recordable Mediaの略。DVD-RAMやSDカードのコンテンツ保護技術で、コンテンツをメディアに暗号化した状態で記録し、再生時に対応した機器で復号することで違法コピーを防止する技術です。メディア内の暗号鍵と再生機器（またはソフトウェア）の機器鍵がそろわないと復号できない仕組みになっています（鍵長56ビット）。</li><li class=\"liu\">Content Scramble Systemの略。DVD-Video用のコンテンツ保護技術で、コンテンツをタイトルキーで暗号化し、タイトルキーをディスクキーで暗号化し、ディスクキーをマスターキーで暗号化するという3段階の暗号化でコピーガードを行います（鍵長40ビット）。</li><li class=\"lie\">Windows Media Rights Managerの略。マイクロソフト社が開発したストリーミング配信におけるコンテンツ保護技術です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_aki_q24", "session": "支援士 R3秋", "gap": 7, "num": 24, "topic": "フェールソフトの例はどれか", "subcat": "システム方式設計", "category": "情報セキュリティ", "mondai": "情報システムの設計のうち，フェールソフトの考え方を適用した例はどれか。", "mondai_html": "<div id=\"mondai\">情報システムの設計のうち，フェールソフトの考え方を適用した例はどれか。</div>", "choices": {"ア": "UPSを設置することによって，停電時に手順どおりにシステムを停止できるようにする。", "イ": "制御プログラムの障害時に，システムの暴走を避け，安全に停止できるようにする。", "ウ": "ハードウェアの障害時に，パフォーマンスは低下するが，構成を縮小して運転を続けられるようにする。", "エ": "利用者の誤操作や誤入力を未然に防ぐことによって，システムの誤動作を防止できるようにする。"}, "choices_html": {"ア": "UPSを設置することによって，停電時に手順どおりにシステムを停止できるようにする。", "イ": "制御プログラムの障害時に，システムの暴走を避け，安全に停止できるようにする。", "ウ": "ハードウェアの障害時に，パフォーマンスは低下するが，構成を縮小して運転を続けられるようにする。", "エ": "利用者の誤操作や誤入力を未然に防ぐことによって，システムの誤動作を防止できるようにする。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>フェールソフト</strong>(fail soft)は、システムの一部に障害が発生したときに、多少の性能の低下を許容し、システム全体の運転継続に必要な機能を維持させようとする考え方です。性能を落とした状態で稼働を継続することを縮退運転といいます。<br/><br/>フェールソフトの実践例としてフォールバック(縮退運転)やフェールオーバー(継ぎ目なしの切替え運転)があります。選択肢のうち「ウ」の記述は、障害時の縮退運転に関するものなのでフェールソフトの事例として適切です。<ul><li class=\"lia\">供給電源の低下を検知した際に、システムが安全に停止できるまで一定の時間を稼ぐ手法をフェールセーフ・シャットダウンといいます。よって、フェールセーフ制御の一例となります。</li><li class=\"lii\">フェールセーフの例です。</li><li class=\"liu\">正しい。フェールソフトの例です。</li><li class=\"lie\">フールプルーフの例です。</li></ul></div>", "past_history": ["安全確保支援士 R1秋期 問24", "情報セキュリティ H25春期 問24", "安全確保支援士 H29秋期 問24"], "hist_count": 4}, {"id": "sc_03_aki_q25", "session": "支援士 R3秋", "gap": 7, "num": 25, "topic": "クラウドサービス導入プロセスの監査", "subcat": "システム監査", "category": "情報セキュリティ", "mondai": "クラウドサービスの導入検討プロセスに対するシステム監査において，クラウドサービス上に保存されている情報の保全及び消失の予防に関するチェックポイントとして，最も適切なものはどれか。", "mondai_html": "<div id=\"mondai\">クラウドサービスの導入検討プロセスに対するシステム監査において，クラウドサービス上に保存されている情報の保全及び消失の予防に関するチェックポイントとして，最も適切なものはどれか。</div>", "choices": {"ア": "クラウドサービスの障害時における最大許容停止時間が検討されているか。", "イ": "クラウドサービスの利用者IDと既存の社内情報システムの利用者IDの一元管理の可否が検討されているか。", "ウ": "クラウドサービスを提供する事業者が信頼できるか，事業者の事業継続性に懸念がないか，及びサービスが継続して提供されるかどうかが検討されているか。", "エ": "クラウドサービスを提供する事業者の施設内のネットワークに，暗号化通信が採用されているかどうかが検討されているか。"}, "choices_html": {"ア": "クラウドサービスの障害時における最大許容停止時間が検討されているか。", "イ": "クラウドサービスの利用者IDと既存の社内情報システムの利用者IDの一元管理の可否が検討されているか。", "ウ": "クラウドサービスを提供する事業者が信頼できるか，事業者の事業継続性に懸念がないか，及びサービスが継続して提供されるかどうかが検討されているか。", "エ": "クラウドサービスを提供する事業者の施設内のネットワークに，暗号化通信が採用されているかどうかが検討されているか。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_aki/am2_25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">クラウドサービス上にデータを保存している場合、急なサービス提供停止により重要なデータが消失してしまうというリスクがあります。そのためクラウドサービスを選定する際には、導入・運用コストなどの検討とあわせて、サービス提供事業者が「そのサービスを長期に渡り提供し続けてくれるどうか」や「利用終了時のデータの取扱い」という点を考慮する必要があります。<br/><br/>したがって「ウ」が適切なチェックポイントです。<ul><li class=\"lia\">可用性に関するチェックポイントです。</li><li class=\"lii\">完全性に関するチェックポイントです。</li><li class=\"liu\">正しい。</li><li class=\"lie\">機密性に関するチェックポイントです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q1", "session": "支援士 R3春", "gap": 8, "num": 1, "topic": "リフレクタ攻撃に悪用されるサービス", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "リフレクタ攻撃に悪用されることの多いサービスの例はどれか。", "mondai_html": "<div id=\"mondai\">リフレクタ攻撃に悪用されることの多いサービスの例はどれか。</div>", "choices": {"ア": "DKIM，DNSSEC，SPF", "イ": "DNS，Memcached，NTP", "ウ": "FTP，L2TP，Telnet", "エ": "IPsec，SSL，TLS"}, "choices_html": {"ア": "DKIM，DNSSEC，SPF", "イ": "DNS，Memcached，NTP", "ウ": "FTP，L2TP，Telnet", "エ": "IPsec，SSL，TLS"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_1.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>リフレクタ攻撃</strong>とは、送信元IPアドレスを攻撃対象のサーバに偽装した問い合わせパケットを利用して、大量の応答パケットを攻撃対象に集中させ、過負荷状態にすることでサービス停止に追い込むDDoS攻撃です。攻撃者が発したパケットが踏み台となるサーバで反射（リフレクション／リフレクタ）されて攻撃対象に送り付けられる様子から、リフレクタ攻撃と呼ばれます。また、問い合わせパケットよりも応答パケットの方が大きくなるプロトコルを使用して、小さなクエリパケットを増幅させて大きな攻撃パケットに変える特徴からアンプ攻撃ということもあります。<br/><br/>リフレクタ攻撃では、IPアドレスの偽装が容易なコネクションレス型である<em class=\"r\">UDP</em>のプロトコルが攻撃に利用されます。したがって、いずれもUDPのプトロコルであるDNS、Memcached、NTPの組が攻撃に悪用されるサービスとなります。リフレクタ攻撃の例としては、DNSを利用するDNS amp（最大増幅率50倍程度)、NTPを利用するNTPリフレクション攻撃（最大増幅率500倍程度)、分散型メモリキャッシュシステム「Memcached」が使うプロトコルを利用するMemcachedリフレクション攻撃（最大増幅率500,000倍程度）などがあります。<br/><ul><li class=\"lia\">DKIMとSPFスパムメールの防止に使われる仕組み、DNSSECはキャッシュポイズニング対策のための仕組みです。</li><li class=\"lii\">正しい。リフレクタ攻撃に悪用されることの多いサービスの組合せです。</li><li class=\"liu\">3つともTCPを使用するプロトコルで、IPアドレスの偽装が困難なのでリフレクタ攻撃には使われません。</li><li class=\"lie\">3つとも暗号化通信、ノード認証、改ざん検知などの機能を含むセキュリティプロトコルです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q2", "session": "支援士 R3春", "gap": 8, "num": 2, "topic": "OCSPを利用する目的はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "PKIを構成するOCSPを利用する目的はどれか。", "mondai_html": "<div id=\"mondai\">PKIを構成するOCSPを利用する目的はどれか。</div>", "choices": {"ア": "誤って破棄してしまった秘密鍵の再発行処理の進捗状況を問い合わせる。", "イ": "デジタル証明書から生成した鍵情報の交換がOCSPクライアントとOCSPレスポンダの間で失敗した際，認証状態を確認する。", "ウ": "デジタル証明書の失効情報を問い合わせる。", "エ": "有効期限が切れたデジタル証明書の更新処理の進捗状況を確認する。"}, "choices_html": {"ア": "誤って破棄してしまった秘密鍵の再発行処理の進捗状況を問い合わせる。", "イ": "デジタル証明書から生成した鍵情報の交換がOCSPクライアントとOCSPレスポンダの間で失敗した際，認証状態を確認する。", "ウ": "デジタル証明書の失効情報を問い合わせる。", "エ": "有効期限が切れたデジタル証明書の更新処理の進捗状況を確認する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_2.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>OCSP</strong>(Online Certificate Status Protocol)は、リアルタイムでデジタル証明書の失効情報を検証し、有効性を確認するプロトコルです。<br/>クライアントは、確認対象となるデジタル証明書のシリアル番号をOCSPレスポンダに送信し、有効性検証の結果を受け取ります。この仕組みを利用することで、クライアント自身がCRLを取得・検証する手間を省くことができます。<br/><br/>したがって「ウ」が正しい記述です。</div>", "past_history": ["情報セキュリティ H25春期 問3", "情報セキュリティ H26秋期 問1", "情報セキュリティ H28春期 問3", "安全確保支援士 H29秋期 問2", "安全確保支援士 H31春期 問2"], "hist_count": 6}, {"id": "sc_03_haru_q5", "session": "支援士 R3春", "gap": 8, "num": 5, "topic": "サイドチャネル攻撃に該当するもの", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "サイドチャネル攻撃はどれか。", "mondai_html": "<div id=\"mondai\">サイドチャネル攻撃はどれか。</div>", "choices": {"ア": "暗号化装置における暗号化処理時の消費電力などの測定や統計処理によって，当該装置内部の秘密情報を推定する攻撃", "イ": "攻撃者が任意に選択した平文とその平文に対応した暗号文から数学的手法を用いて暗号鍵を推測し，同じ暗号鍵を用いて作成された暗号文を解読する攻撃", "ウ": "操作中の人の横から，入力操作の内容を観察することによって，利用者IDとパスワードを盗み取る攻撃", "エ": "無線LANのアクセスポイントを不正に設置し，チャネル間の干渉を発生させることによって，通信を妨害する攻撃"}, "choices_html": {"ア": "暗号化装置における暗号化処理時の消費電力などの測定や統計処理によって，当該装置内部の秘密情報を推定する攻撃", "イ": "攻撃者が任意に選択した平文とその平文に対応した暗号文から数学的手法を用いて暗号鍵を推測し，同じ暗号鍵を用いて作成された暗号文を解読する攻撃", "ウ": "操作中の人の横から，入力操作の内容を観察することによって，利用者IDとパスワードを盗み取る攻撃", "エ": "無線LANのアクセスポイントを不正に設置し，チャネル間の干渉を発生させることによって，通信を妨害する攻撃"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_5.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>サイドチャネル攻撃</strong>は、対象の動作状況を観察し、漏洩電磁波・電力消費等のサイドチャネル情報から暗号鍵推定等を行う非破壊型解析攻撃の総称です。サイドチャネル(Side Channel)には、非正規の入出力経路という意味があります。<br/><br/>具体的な攻撃方法としては、故障利用攻撃、タイミング攻撃や電力解析攻撃、電磁波解析攻撃などがあります。<dl><dt>故障利用攻撃</dt><dd>デバイスに限定的な障害を故意に与え、デバイスの計算誤りから秘密情報を解析する手法</dd><dt>タイミング攻撃</dt><dd>暗号処理のタイミングが暗号鍵の論理値に依存して変化することに着目し、暗号化や復号に要する時間の差異を統計的に解析して暗号鍵を推定する手法</dd><dt>電力解析攻撃</dt><dd>消費電力の変化に着目して鍵や処理内容の解析を試みる手法</dd><dt>電磁波解析攻撃（テンペスト攻撃）</dt><dd>機器が発する電磁波を測定することによって秘密情報の取得を試みる手法</dd></dl><ul><li class=\"lia\">正しい。サイドチャネル攻撃の一つである電力解析攻撃の説明です。</li><li class=\"lii\">関連平文攻撃の説明です。</li><li class=\"liu\">ショルダーハッキングの説明です。</li><li class=\"lie\">ジャミング(Jamming)の説明です。</li></ul></div>", "past_history": ["情報セキュリティ H26秋期 問13", "安全確保支援士 H31春期 問7"], "hist_count": 3}, {"id": "sc_03_haru_q6", "session": "支援士 R3春", "gap": 8, "num": 6, "topic": "ステートフルインスペクション方式", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "ステートフルパケットインスペクション方式のファイアウォールの特徴はどれか。", "mondai_html": "<div id=\"mondai\">ステートフルパケットインスペクション方式のファイアウォールの特徴はどれか。</div>", "choices": {"ア": "WebクライアントとWebサーバとの間に配置され，リバースプロキシサーバとして動作する方式であり，Webクライアントからの通信を目的のWebサーバに中継する際に，受け付けたパケットに不正なデータがないかどうかを検査する。", "イ": "アプリケーションプロトコルごとにプロキシソフトウェアを用意する方式であり，クライアントからの通信を目的のサーバに中継する際に，通信に不正なデータがないかどうかを検査する。", "ウ": "特定のアプリケーションプロトコルだけを通過させるゲートウェイソフトウェアを利用する方式であり，クライアントからのコネクションの要求を受け付け，目的のサーバに改めてコネクションを要求することによって，アクセスを制御する。", "エ": "パケットフィルタリングを拡張した方式であり，過去に通過したパケットから通信セッションを認識し，受け付けたパケットを通信セッションの状態に照らし合わせて通過させるか遮断するかを判断する。"}, "choices_html": {"ア": "WebクライアントとWebサーバとの間に配置され，リバースプロキシサーバとして動作する方式であり，Webクライアントからの通信を目的のWebサーバに中継する際に，受け付けたパケットに不正なデータがないかどうかを検査する。", "イ": "アプリケーションプロトコルごとにプロキシソフトウェアを用意する方式であり，クライアントからの通信を目的のサーバに中継する際に，通信に不正なデータがないかどうかを検査する。", "ウ": "特定のアプリケーションプロトコルだけを通過させるゲートウェイソフトウェアを利用する方式であり，クライアントからのコネクションの要求を受け付け，目的のサーバに改めてコネクションを要求することによって，アクセスを制御する。", "エ": "パケットフィルタリングを拡張した方式であり，過去に通過したパケットから通信セッションを認識し，受け付けたパケットを通信セッションの状態に照らし合わせて通過させるか遮断するかを判断する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_6.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ステートフルインスペクション方式</strong>は、ダイナミックパケットフィルター方式とも呼ばれ、ファイアウォールを通過する個々のセッションの状態を管理し、その情報に基づき動的にポートを開閉することで詳細なアクセス制御を行うファイアウォールです。<br/>個々のセッションごとに過去の通信を保持しているため「順序の矛盾した攻撃パケットを遮断することができる」ことや、常に最小限の許可ルールが追加されるため「アクセス制御リストの設定不備を突く攻撃を受けにくい」という優れた点があり、多くのファイアウォール製品に採用されています。<br/><br/><b>ステートフル</b>(stateful)とは、システムが一連のセッション状態を保持し、個々の通信とセッション情報を照らし合わせて処理を決定する方式や考え方をいいます。<ul><li class=\"lia\">Web Application Firewall(WAF)の特徴です。</li><li class=\"lii\">アプリケーションゲートウェイ方式の特徴です。</li><li class=\"liu\">サーキットレベルゲートウェイ方式の特徴です。</li><li class=\"lie\">正しい。ステートフルインスペクション方式(又はダイナミックパケットフィルター方式)の特徴です。</li></ul></div>", "past_history": ["情報セキュリティ H27秋期 問3", "安全確保支援士 H29秋期 問9", "安全確保支援士 H31春期 問17"], "hist_count": 4}, {"id": "sc_03_haru_q7", "session": "支援士 R3春", "gap": 8, "num": 7, "topic": "AESにおける鍵長の条件", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "NISTが制定した，AESにおける鍵長の条件はどれか。", "mondai_html": "<div id=\"mondai\">NISTが制定した，AESにおける鍵長の条件はどれか。</div>", "choices": {"ア": "128ビット，192ビット，256ビットから選択する。", "イ": "256ビット未満で任意に指定する。", "ウ": "暗号化処理単位のブロック長よりも32ビット長くする。", "エ": "暗号化処理単位のブロック長よりも32ビット短くする。"}, "choices_html": {"ア": "128ビット，192ビット，256ビットから選択する。", "イ": "256ビット未満で任意に指定する。", "ウ": "暗号化処理単位のブロック長よりも32ビット長くする。", "エ": "暗号化処理単位のブロック長よりも32ビット短くする。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>AES</strong>(Advanced Encryption Standard)は、アメリカ合衆国の次世代暗号方式として規格化された共通鍵暗号方式です。2022年現在、WPA2やTLSの暗号化方式として標準的に使われています。<br/><br/>AESは、ブロックと呼ばれる固定長のデータを単位として暗号化を行う「ブロック暗号」に分類され、ブロック長は常に128ビット、使用する鍵の長さは<em class=\"m\">128/192/256ビットから選択可能</em>となっています。<br/><br/>したがって正しい記述は「ア」です。</div>", "past_history": ["情報セキュリティ H22秋期 問4", "情報セキュリティ H24春期 問4"], "hist_count": 3}, {"id": "sc_03_haru_q8", "session": "支援士 R3春", "gap": 8, "num": 8, "topic": "CVE識別子の説明はどれか", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "JVN(Japan Vulnerability Notes)などの脆弱性対策ポータルサイトで採用されているCVE(Common Vulnerabilities and Exposures)識別子の説明はどれか。", "mondai_html": "<div id=\"mondai\">JVN(Japan Vulnerability Notes)などの脆弱性対策ポータルサイトで採用されているCVE(Common Vulnerabilities and Exposures)識別子の説明はどれか。</div>", "choices": {"ア": "コンピュータで必要なセキュリティ設定項目を識別するための識別子", "イ": "脆弱性が悪用されて改ざんされたWebサイトのスクリーンショットを識別するための識別子", "ウ": "製品に含まれる脆弱性を識別するための識別子", "エ": "セキュリティ製品を識別するための識別子"}, "choices_html": {"ア": "コンピュータで必要なセキュリティ設定項目を識別するための識別子", "イ": "脆弱性が悪用されて改ざんされたWebサイトのスクリーンショットを識別するための識別子", "ウ": "製品に含まれる脆弱性を識別するための識別子", "エ": "セキュリティ製品を識別するための識別子"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_8.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CVE</strong>(共通脆弱性識別子)は、情報セキュリティに関して一般公表されている脆弱性ごとに割り振られる識別子です。各脆弱性に一意の識別番号を付けることにより、ベンダーやセキュリティ機関で共通の脆弱性情報を参照することを可能としています。<br/><br/>CVEは、JVN(Japan Vulnerability Notes)などの脆弱性情報を取り扱うサイトで公開されており、ベンダーやセキュリティ機関で共通の脆弱性情報を参照することが可能です。識別子の形式は<span class=\"code\">CVE-&lt;西暦年号&gt;-&lt;4桁以上の数字&gt;</span>です。例えば CVE-2021-44228 は、Log4jというJavaのロギングライブラリに関する脆弱性を指します。<br/><br/>したがって正しい記述は「ウ」になります。<br/><br/>脆弱性対策関連情報には似たような英語略字の用語があります。次の5つは押さえておきましょう。<ul><li>CVE … 共通脆弱性識別子</li><li>CCE … 共通セキュリティ設定一覧</li><li>CWE … 共通脆弱性タイプ一覧</li><li>CPE … 共通プラットフォーム一覧</li><li>CVSS … 共通脆弱性評価システム</li></ul><ul><li class=\"lia\">CCE(Common Configuration Enumeration)の説明です。</li><li class=\"lii\">該当する識別子は存在しません。</li><li class=\"liu\">正しい。CVEの説明です。</li><li class=\"lie\">CPE(Common Platform Enumeration)の説明です。</li></ul></div>", "past_history": ["情報セキュリティ H25秋期 問5", "情報セキュリティ H27春期 問7", "安全確保支援士 H29春期 問10", "安全確保支援士 H30秋期 問2"], "hist_count": 5}, {"id": "sc_03_haru_q9", "session": "支援士 R3春", "gap": 8, "num": 9, "topic": "J-CSIPの説明はどれか", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "サイバー情報共有イニシアティブ(J-CSIP)の説明として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">サイバー情報共有イニシアティブ(J-CSIP)の説明として，適切なものはどれか。</div>", "choices": {"ア": "サイバー攻撃対策に関する情報セキュリティ監査を参加組織間で相互に実施して，監査結果を共有する取組み", "イ": "参加組織がもつデータを相互にバックアップして，サイバー攻撃から保護する取組み", "ウ": "セキュリティ製品のサイバー攻撃に対する有効性に関する情報を参加組織が取りまとめ，その情報を活用できるように公開する取組み", "エ": "標的型サイバー攻撃などに関する情報を参加組織間で共有し，高度なサイバー攻撃対策につなげる取組み"}, "choices_html": {"ア": "サイバー攻撃対策に関する情報セキュリティ監査を参加組織間で相互に実施して，監査結果を共有する取組み", "イ": "参加組織がもつデータを相互にバックアップして，サイバー攻撃から保護する取組み", "ウ": "セキュリティ製品のサイバー攻撃に対する有効性に関する情報を参加組織が取りまとめ，その情報を活用できるように公開する取組み", "エ": "標的型サイバー攻撃などに関する情報を参加組織間で共有し，高度なサイバー攻撃対策につなげる取組み"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>サイバー情報共有イニシアティブ</strong>（J-CSIP：Initiative for Cyber Security Information sharing Partnership of Japan ）は、公的機関であるIPAを情報ハブ（集約点）の役割として、重要インフラで利用される機器の製造業者、電力業界、ガス業界、化学業界、石油業界、資源開発業界、自動車業界、クレジット業界においてサイバー攻撃の情報共有を行い、高度なサイバー攻撃対策に繋げていく取り組みです。<div class=\"img_margin\"><img alt=\"09_1.png/image-size:228×68\" height=\"68\" src=\"https://www.sc-siken.com/kakomon/03_haru/img/09_1.png\" style=\"max-width: 100%; height: auto;\" width=\"228\"/></div>具体的には、IPAと各参加組織（あるいは参加組織を束ねる業界団体）間で締結した秘密保持契約（NDA）のもと、参加組織およびそのグループ企業において検知されたサイバー攻撃等の情報をIPAに集約。情報提供元に関する情報や機微情報の匿名化を行い、IPAによる分析情報を付加した上で、情報提供元の承認を得て共有可能な情報とし、参加組織間での情報共有を行っています。<br/><br/>したがって「エ」が適切な説明です。<div class=\"img_margin\"><img alt=\"09_2.png/image-size:570×293\" height=\"293\" src=\"https://www.sc-siken.com/kakomon/03_haru/img/09_2.png\" style=\"max-width: 100%; height: auto;\" width=\"570\"/></div>参考URL: サイバー情報共有イニシアティブ（J-CSIP（ジェイシップ））<br/>　<a href=\"https://www.ipa.go.jp/security/J-CSIP/\" target=\"_blank\">https://www.ipa.go.jp/security/J-CSIP/</a><br/>※J-CSIPの説明及び組織構成画像はIPAの上記URLより引用</div>", "past_history": ["安全確保支援士 H30春期 問10"], "hist_count": 2}, {"id": "sc_03_haru_q10", "session": "支援士 R3春", "gap": 8, "num": 10, "topic": "DNS CAAレコードのセキュリティ効果", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "DNSにおいてDNS CAA(Certification Authority Authorization)レコードを使うことによるセキュリティ上の効果はどれか。", "mondai_html": "<div id=\"mondai\">DNSにおいてDNS CAA(Certification Authority Authorization)レコードを使うことによるセキュリティ上の効果はどれか。</div>", "choices": {"ア": "WebサイトにアクセスしたときのWebブラウザに鍵マークが表示されていれば当該サイトが安全であることを，利用者が確認できる。", "イ": "Webサイトにアクセスする際のURLを短縮することによって，利用者のURLの誤入力を防ぐ。", "ウ": "電子メールを受信するサーバでスパムメールと誤検知されないようにする。", "エ": "不正なサーバ証明書の発行を防ぐ。"}, "choices_html": {"ア": "WebサイトにアクセスしたときのWebブラウザに鍵マークが表示されていれば当該サイトが安全であることを，利用者が確認できる。", "イ": "Webサイトにアクセスする際のURLを短縮することによって，利用者のURLの誤入力を防ぐ。", "ウ": "電子メールを受信するサーバでスパムメールと誤検知されないようにする。", "エ": "不正なサーバ証明書の発行を防ぐ。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_10.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>CAAレコード</strong>は、ドメインに対する証明書の発行を承認された認証局のコモンネームを指定するDNSリソースレコードです。CAAレコードを使用することで、意図しない認証局から証明書が不正発行されるリスクを軽減することができます。RFC 8659として標準化されています。<br/><div class=\"pre\">ca.example.comに証明書の発行を許可するCAAレコードの設定例<br/>example.jp. IN CAA 0 issue \"ca.example.com\"</div>認証局は証明書の発行前にドメインのCAAレコードを確認することが義務付けられています。<ul><li class=\"lia\">Webブラウザが提供する機能であり、CAAレコードの効果ではありません。</li><li class=\"lii\">CAAレコードの効果ではありません。</li><li class=\"liu\">SPFレコードの効果です。</li><li class=\"lie\">正しい。CAAレコードの効果です。</li></ul></div>", "past_history": ["安全確保支援士 R6春期 問15"], "hist_count": 2}, {"id": "sc_03_haru_q12", "session": "支援士 R3春", "gap": 8, "num": 12, "topic": "攻撃と対策の適切な組合せ", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "安全なWebアプリケーションの作り方について，攻撃と対策の適切な組合せはどれか。", "mondai_html": "<div id=\"mondai\">安全なWebアプリケーションの作り方について，攻撃と対策の適切な組合せはどれか。</div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表\" src=\"https://www.sc-siken.com/kakomon/03_haru/img/12.png\" style=\"max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_12.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">Webアプリケーションに対するそれぞれの攻撃手法を確認しておきましょう。<dl><dt>SQLインジェクション</dt><dd>入力データとしてデータベースへの命令文を構成するデータを入力し、Webアプリケーションが想定していないSQL文を意図的に実行させることでデータベースを攻撃する行為。</dd><dt>クロスサイトスクリプティング</dt><dd>動的にWebページを生成するアプリケーションのセキュリティ上の不備を意図的に利用し、サイト間を横断して悪意のあるスクリプトを混入させることでユーザーのクッキーを盗むなどの攻撃を行う行為。</dd><dt>クロスサイトリクエストフォージェリ</dt><dd>悪意のあるスクリプトが埋め込まれたWebページを訪問者に閲覧させて，別のWebサイトで，その訪問者が意図しない操作を行わせる攻撃手法。会員制サイトでログイン状態であるときに会員情報の変更や商品の注文画面への直接リンクを踏ませる(またはスクリプトでリダイレクトする)などの意図しない不正な処理要求を行わせる行為がこれに該当する。</dd><dt>セッションハイジャック</dt><dd>認証が完了してセッションを開始しているブラウザとWebサーバの間の通信において、CookieやセッションIDなどのセッション情報を盗むことで、対象セッションを通信当事者以外が乗っ取る攻撃手法。</dd></dl><ul><li class=\"lia\">正しい。<strong>プレースホルダ</strong>は、SQL文中のユーザー入力を割り当てる部分に特殊文字(?など)を使用したひな形を用意し、後から実際の値を割り当てる機構です。後から割り当てる値は、SQL文の特殊文字がエスケープされた完全な数値または文字列として扱われるため安全に実行することができます。</li><li class=\"lii\">スタイルシートには\"expression\"文のようにJavaScriptを直接記述できる部分があるため、不用意に別ドメインのCSSを読込むと悪意のあるスクリプトによってXSSの被害を受ける可能性があります。またスタイルシートの\"import\"文によってスクリプトファイルがダウンロードさせてしまうおそれもあります。<br/>これらの脅威は2021年現在はブラウザによりブロックされることがほとんどです。しかし、スタイルシートはWebページのデザインを指定する言語ですが、設定できる範囲は広く、悪意を持って使用すれば任意の要素を消したり、出現させたりというようにページの表示を改ざんすることも可能です（CSSインジェクション）。この観点からも信用できない外部CSSは読む込むべきではないと言えます。</li><li class=\"liu\">GETメソッドを使用すると、URLから秘密情報を読みとられたり改ざんされたりという可能性が高くなるのでPOSTメソッドを使用すべきです。<br/>GETやPOSTというのはWebブラウザからサーバへのパラメータの受け渡し型の違いです。GETメソッドは、\"hoge.php?mode=new&amp;uid=34632847\"というようにURLの後ろにパラメータを付加して送信する方式、POSTメソッドは、パラメータをメッセージボディにセットしサーバに渡す方式です。</li><li class=\"lie\">セッションIDを利用者ごとに固定すると、セッションハイジャックのターゲットになりやすいので危険です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q13", "session": "支援士 R3春", "gap": 8, "num": 13, "topic": "ビヘイビア法を説明したもの", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "マルウェアの検出手法であるビヘイビア法を説明したものはどれか。", "mondai_html": "<div id=\"mondai\">マルウェアの検出手法であるビヘイビア法を説明したものはどれか。</div>", "choices": {"ア": "あらかじめ特徴的なコードをパターンとして登録したマルウェア定義ファイルを用いてマルウェア検査対象と比較し，同じパターンがあればマルウェアとして検出する。", "イ": "マルウェアに感染していないことを保証する情報をあらかじめ検査対象に付加しておき，検査時に不整合があればマルウェアとして検出する。", "ウ": "マルウェアの感染が疑わしい検査対象のハッシュ値と，安全な場所に保管されている原本のハッシュ値を比較し，マルウェアとして検出する。", "エ": "マルウェアの感染や発病によって生じるデータ読込みの動作，書込み動作，通信などを監視して，マルウェアとして検出する。"}, "choices_html": {"ア": "あらかじめ特徴的なコードをパターンとして登録したマルウェア定義ファイルを用いてマルウェア検査対象と比較し，同じパターンがあればマルウェアとして検出する。", "イ": "マルウェアに感染していないことを保証する情報をあらかじめ検査対象に付加しておき，検査時に不整合があればマルウェアとして検出する。", "ウ": "マルウェアの感染が疑わしい検査対象のハッシュ値と，安全な場所に保管されている原本のハッシュ値を比較し，マルウェアとして検出する。", "エ": "マルウェアの感染や発病によって生じるデータ読込みの動作，書込み動作，通信などを監視して，マルウェアとして検出する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ビヘイビア法</strong>は、実際に検査対象のプログラムを動作させ、その挙動を監視して不正な行動があればマルウェアと判定する手法です。behaviorは「振る舞い」という意味です。<br/><br/>マルウェアの実際の感染・発病動作を監視して検出する手法の総称であり、書込み・複製・破壊等のプログラムの挙動だけではなく、ネットワークの異常通信など感染・発病動作によって起こる環境の様々な変化を察知する手法もこの手法に分類されます。検査対象プログラムが実際に行う危険な行為をルールベースで監視するため、未知のマルウェアであっても検出できる可能性があり、最も本質的な検出方法と言えます。ダイナミックヒューリスティック法と呼ばれることもあります。<br/><br/>この他にもマルウェア検出技術には次のようなものがあります。<dl><dt>コンペア法</dt><dd>検査対象ファイルと安全な場所に保管してあるファイル原本を比較して、異なっていればマルウェアとして判定する手法</dd><dt>パターンマッチング法</dt><dd>シグネチャコードと呼ばれる既知のマルウェアに特徴的なコードパターンをデータベース化し、検査対象のファイルがそのパターンを有していればマルウェアと判定する手法</dd><dt>チェックサム法</dt><dd>あらかじめファイル原本に正当性を保証する情報（チェックサムやデジタル署名など）を付加しておき、検査対象ファイルで再計算した値が異なっていればマルウェアとして判定する手法。インテグリティチェック法とも呼ばれる</dd><dt>ヒューリスティック法</dt><dd>マルウェアのとるであろう動作を事前に登録しておき、検査対象コードに含まれる一連の動作と比較して検出する手法</dd></dl>選択肢の記述は、それぞれ次の検出技術に対応します。<ul><li class=\"lia\">パターンマッチング法の説明です。</li><li class=\"lii\">チェックサム法の説明です。</li><li class=\"liu\">コンペア法の説明です。</li><li class=\"lie\">正しい。ビヘイビア法の説明です。</li></ul></div>", "past_history": ["情報セキュリティ H21秋期 問8", "情報セキュリティ H23特別 問9", "情報セキュリティ H25春期 問13"], "hist_count": 4}, {"id": "sc_03_haru_q15", "session": "支援士 R3春", "gap": 8, "num": 15, "topic": "HSTSの説明はどれか", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "HSTS(HTTP Strict Transport Security)の説明はどれか。", "mondai_html": "<div id=\"mondai\">HSTS(HTTP Strict Transport Security)の説明はどれか。</div>", "choices": {"ア": "HSTSを利用するWebサイトにWebブラウザがHTTPでアクセスした場合，Webブラウザから当該サイトへのその後のアクセスを強制的にHTTP over TLS(HTTPS)にする。", "イ": "HSTSを利用するWebサイトにWebブラウザがHTTPでアクセスした場合，Webページの文書やスクリプトについて，あるオリジンから読み込まれたリソースから他のオリジンのリソースにアクセスできないように制限する。", "ウ": "HTTPSで通信が保護されている場合にだけ，cookieの属性によらず強制的にcookieを送信する。", "エ": "信頼性が高いサーバ証明書を有するWebサイトとのHTTPS通信では，Webブラウザに鍵マークを表示する。"}, "choices_html": {"ア": "HSTSを利用するWebサイトにWebブラウザがHTTPでアクセスした場合，Webブラウザから当該サイトへのその後のアクセスを強制的にHTTP over TLS(HTTPS)にする。", "イ": "HSTSを利用するWebサイトにWebブラウザがHTTPでアクセスした場合，Webページの文書やスクリプトについて，あるオリジンから読み込まれたリソースから他のオリジンのリソースにアクセスできないように制限する。", "ウ": "HTTPSで通信が保護されている場合にだけ，cookieの属性によらず強制的にcookieを送信する。", "エ": "信頼性が高いサーバ証明書を有するWebサイトとのHTTPS通信では，Webブラウザに鍵マークを表示する。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_15.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>HSTS</strong>(HTTP Strict Transport Security)は、Webサイトに<em class=\"r\">HTTPS</em>で接続することをWebブラウザに強制するHTTPレスポンスヘッダーです。<br/><div class=\"pre\">//アクセスから365日間、サブドメインも含めてHTTPS接続を強制<br/>Strict-Transport-Security: max-age=31536000; includeSubDomains; preload</div>WebサイトをHTTPS化した際には 301 HTTP リダイレクトを使用して、HTTPのアドレスにアクセスした利用者をHTTPSページに転送する設定を行うのが一般的ですが、初回のHTTPアクセスは暗号化されていないため、HTTPSページへのリダイレクト前に攻撃(リダイレクト先の書換えや中間者攻撃など)を受ける可能性が残されています。<br/><br/>HSTSをサポートしているWebサイトでは、HTTPでアクセスしようとしたWebブラウザに対して、(コンテンツを返さずに)レスポンスヘッダーでHSTSを通知します。HSTS通知を受け取ったWebブラウザは、HTTPSページにリダイレクトするとともに、この情報を記録しておき、以降の指定された期間、このサイトへの接続の全てをHTTPSとします。これにより、次回からはHTTPのアドレスにアクセスした場合でもWebブラウザが自動的にHTTPSのページを取得しに行くようになるため、セキュリティを高めることができます。<br/><br/>したがって「ア」が適切な説明です。<ul><li class=\"lia\">正しい。HSTSの説明です。</li><li class=\"lii\">Webブラウザが提供するセキュリティ機能である「同一オリジンポリシー」の説明です。</li><li class=\"liu\">cookieの属性によらず強制的にcookieを送信させる仕組みはありません。</li><li class=\"lie\">Webブラウザの動作です。有効なサーバ証明書でありHTTPSが有効であれば信頼性にかかわらず鍵マークが表示されます。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q16", "session": "支援士 R3春", "gap": 8, "num": 16, "topic": "VDIシステムの導入", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "内部ネットワーク上のPCからインターネット上のWebサイトを参照するときは，DMZ上のVDI(Virtual Desktop Infrastructure)サーバ上の仮想マシンにPCからログインし，仮想マシン上のWebブラウザを必ず利用するシステムを導入する。インターネット上のWebサイトから内部ネットワークにあるPCへのマルウェアの侵入，及びPCからインターネット上のWebサイトへのPC内のファイルの流出を防止するのに効果がある条件はどれか。", "mondai_html": "<div id=\"mondai\">内部ネットワーク上のPCからインターネット上のWebサイトを参照するときは，DMZ上のVDI(Virtual Desktop Infrastructure)サーバ上の仮想マシンにPCからログインし，仮想マシン上のWebブラウザを必ず利用するシステムを導入する。インターネット上のWebサイトから内部ネットワークにあるPCへのマルウェアの侵入，及びPCからインターネット上のWebサイトへのPC内のファイルの流出を防止するのに効果がある条件はどれか。</div>", "choices": {"ア": "PCとVDIサーバ間は，VDIの画面転送プロトコル及びファイル転送を利用する。", "イ": "PCとVDIサーバ間は，VDIの画面転送プロトコルだけを利用する。", "ウ": "VDIサーバが，プロキシサーバとしてHTTP通信を中継する。", "エ": "VDIサーバが，プロキシサーバとしてVDIの画面転送プロトコルだけを中継する。"}, "choices_html": {"ア": "PCとVDIサーバ間は，VDIの画面転送プロトコル及びファイル転送を利用する。", "イ": "PCとVDIサーバ間は，VDIの画面転送プロトコルだけを利用する。", "ウ": "VDIサーバが，プロキシサーバとしてHTTP通信を中継する。", "エ": "VDIサーバが，プロキシサーバとしてVDIの画面転送プロトコルだけを中継する。"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_16.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>VDI</strong>(Virtual Desktop Infrastructure)は、サーバ内にクライアントごとの仮想マシンを用意して仮想デスクトップ環境を構築する技術です。<br/><br/>VDIには、Webブラウザなどの特定の機能だけをVDIサーバ上で代理実行するものから、OSを含むアプリケーションの実行とデータ保存をすべてVDIサーバ上で行い、クライアントには操作入力と画面表示だけを行わせるものまで様々なレベルがあります。どの方式についてもVDIサーバ上の仮想マシンにおける実行結果をフィードバックするために、VDIサーバからクライアントPCへの画面転送が行われる点は同じです。<ul><li class=\"lia\">ファイル転送を許した場合、PC上のファイルがHTTP通信を介してインターネット上に流出する可能性があります。また、マルウェアがVDIサーバ上の仮想マシンに侵入した場合、ファイル転送によりPCにも侵入するおそれもあります。</li><li class=\"lii\">正しい。画面転送だけを許可すれば、PC上のファイルがHTTP通信を介してインターネット上に流出する可能性を排除できます。また、マルウェアがVDIサーバ上の仮想マシンに侵入したとしても、PCへのマルウェアの侵入を防止できます。</li><li class=\"liu\">HTTP通信を中継するだけでは、マルウェアがPCに侵入したり、PCから外部にデータが流出したりするのを防止できません。</li><li class=\"lie\">VDIサーバとインターネット上のWebサイトの間はHTTP通信が行われます。よって、プロキシサーバとして画面転送プロトコルだけを中継するという記述は誤りです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q17", "session": "支援士 R3春", "gap": 8, "num": 17, "topic": "無線通信を暗号化するもの", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "RFC 8110に基づいたものであり，公衆無線LANなどでパスフレーズなどでの認証なしに，端末とアクセスポイントとの間の無線通信を暗号化するものはどれか。", "mondai_html": "<div id=\"mondai\">RFC 8110に基づいたものであり，公衆無線LANなどでパスフレーズなどでの認証なしに，端末とアクセスポイントとの間の無線通信を暗号化するものはどれか。</div>", "choices": {"ア": "Enhanced Open", "イ": "FIDO2", "ウ": "WebAuthn", "エ": "WPA3"}, "choices_html": {"ア": "Enhanced Open", "イ": "FIDO2", "ウ": "WebAuthn", "エ": "WPA3"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">パスワードなしで利用できる公衆無線LANでは平文で通信が行われるので、通信傍受の危険があります。<strong>Enhanced Open</strong>はWi-Fi Allianceが定義したセキュリティ規格で、端末とアクセスポイントの認証プロセスでDiffie-Hellman鍵交換を実行し、得られた独自の鍵を利用して暗号化通信を行う仕組みです（認証は行わない）。SSIDを指定するだけで使える公衆無線LANの利便性を保ったまま無線通信が保護されます。<ul><li class=\"lia\">正しい。Enhanced Openは、パスワードでの認証なしに、公衆無線LANにおける端末とアクセスポイントとの間の無線通信を暗号化する仕組みです。</li><li class=\"lii\">FIDO2は、日常的に使っているパソコンやスマホとPIN・生体認証・認証デバイスを組み合わせてパスワードレスの認証を行う仕組みです。</li><li class=\"liu\">WebAuthnはWebサイトで登録や認証を行う際に、公開鍵暗号を利用してパスワードレスの認証を行う方式です。FIDO2の構成要素で、FIDO認証のサポートを可能にするためにブラウザやWebサービスに組込むAPIを定義しています。</li><li class=\"lie\">Wi-Fi Protected Access 3の略。端末とアクセスポイントとの間の無線通信を暗号化する方式ですが、パスフレーズや認証サーバでの認証が必要です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q18", "session": "支援士 R3春", "gap": 8, "num": 18, "topic": "NFVに関する記述", "subcat": "ネットワーク方式", "category": "情報セキュリティ", "mondai": "ETSI(欧州電気通信標準化機構)が提唱するNFV(Network Functions Virtualisation)に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">ETSI(欧州電気通信標準化機構)が提唱するNFV(Network Functions Virtualisation)に関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "ONF(Open Networking Foundation)が提唱するSDN(Software-Defined Networking)を用いて，仮想化を実現する。", "イ": "OpenFlowコントローラーやOpenFlowスイッチなどのOpenFlowプロトコルの専用機器だけを使ってネットワークを構築する。", "ウ": "ルータ，ファイアウォールなどのネットワーク機能を，汎用サーバを使った仮想マシン上のソフトウェアで実現する。", "エ": "ロードバランサー，スイッチ，ルータなどの専用機器を使って，VLAN，VPNなどの仮想ネットワークを実現する。"}, "choices_html": {"ア": "ONF(Open Networking Foundation)が提唱するSDN(Software-Defined Networking)を用いて，仮想化を実現する。", "イ": "OpenFlowコントローラーやOpenFlowスイッチなどのOpenFlowプロトコルの専用機器だけを使ってネットワークを構築する。", "ウ": "ルータ，ファイアウォールなどのネットワーク機能を，汎用サーバを使った仮想マシン上のソフトウェアで実現する。", "エ": "ロードバランサー，スイッチ，ルータなどの専用機器を使って，VLAN，VPNなどの仮想ネットワークを実現する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>NFV</strong>(Network Functions Virtualisation，ネットワーク機能の仮想化)は、仮想化技術を利用して、従来はルータ、スイッチ、ファイアウォール、ロードバランサーなどの専用機器で行われていた機能を、汎用サーバ内の仮想マシン上で動くソフトウェアとして実装するアーキテクチャです。複数のネットワーク機器の機能を1つの物理サーバに集約できるため、コスト削減や信頼性向上などのメリットがあります。<div class=\"img_margin\"><img alt=\"18.png/image-size:392×265\" height=\"265\" src=\"https://www.sc-siken.com/kakomon/03_haru/img/18.png\" style=\"max-width: 100%; height: auto;\" width=\"392\"/></div>したがって「ウ」が適切です。<ul><li class=\"lia\">SDNがデータ転送をネットワーク機器で、転送制御をソフトウェアで行うという考え方で、実際のデータ転送はネットワーク機器が行います。一方、NFVではネットワーク機器を使用しません。</li><li class=\"lii\">汎用サーバでネットワーク機能を実現するので、OpenFlowプロトコルの専用機器は使用しません。</li><li class=\"liu\">正しい。</li><li class=\"lie\">VLAN、VPNなどの仮想ネットワークの構築もできますが、専用機器ではなく汎用サーバを使用します。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q19", "session": "支援士 R3春", "gap": 8, "num": 19, "topic": "リンクアグリゲーション", "subcat": "データ通信と制御", "category": "情報セキュリティ", "mondai": "スイッチングハブ同士を接続する際に，複数のポートを束ねて一つの論理ポートとして扱う技術はどれか。", "mondai_html": "<div id=\"mondai\">スイッチングハブ同士を接続する際に，複数のポートを束ねて一つの論理ポートとして扱う技術はどれか。</div>", "choices": {"ア": "MIME", "イ": "MIMO", "ウ": "マルチパート", "エ": "リンクアグリゲーション"}, "choices_html": {"ア": "MIME", "イ": "MIMO", "ウ": "マルチパート", "エ": "リンクアグリゲーション"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>リンクアグリゲーション</strong>は、最大8本までの装置間の物理回線を仮想的な1本の回線として扱う技術で、IEEE802.3adとして標準化されています。例えば、100Mbpsの物理回線を2本束ねれば200Mbpsの通信帯域幅を確保できることになります。これにより通信の安定や高速化を望めるほか、1本の回線に障害が発生しても別の回線で通信ができるので耐障害性が向上する利点があります。<br/><br/>主にスイッチ間通信における通信帯域の拡張や冗長性の確保の目的で使用されます。<ul><li class=\"lia\">Multipurpose Internet Mail Extensionの略。ASCII文字しか使用できないSMTPを利用したメールで、日本語などの2バイトコードや画像・動画・音声データを送信するための仕組みです。</li><li class=\"lii\">Multiple Input Multiple Outputの略。無線通信において送信データを複数のストリームに分割し、それぞれを複数のアンテナで送受信することで高速に伝送する技術です。無線LANの規格IEEE802.11n以降で採用されています。</li><li class=\"liu\">マルチパートは、1通の電子メールの中にテキスト・画像・音声などの複数のメディア形式を格納するときの記述方法です。</li><li class=\"lie\">正しい。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q20", "session": "支援士 R3春", "gap": 8, "num": 20, "topic": "ループバックアドレス", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "IPv4ネットワークにおけるIPアドレス 127.0.0.1 に関する記述として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">IPv4ネットワークにおけるIPアドレス 127.0.0.1 に関する記述として，適切なものはどれか。</div>", "choices": {"ア": "DHCPが使用できないときに自動生成されるIPアドレスとして使用される。", "イ": "全ホストに対するブロードキャストアドレスとして使用される。", "ウ": "単一のコンピュータ上で動作するプログラム同士が通信する際に使用される。", "エ": "デフォルトゲートウェイのアドレスとして使用される。"}, "choices_html": {"ア": "DHCPが使用できないときに自動生成されるIPアドレスとして使用される。", "イ": "全ホストに対するブロードキャストアドレスとして使用される。", "ウ": "単一のコンピュータ上で動作するプログラム同士が通信する際に使用される。", "エ": "デフォルトゲートウェイのアドレスとして使用される。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">リンクローカルアドレスの説明です。DHCPが使用できないときにIPアドレスを自動設定する機能をAPIPA(Automatic Private IP Addressing)といい、\"169.254.x.y\"というIPアドレスが割り当てられます。</li><li class=\"lii\">ブロードキャストアドレスは、ホスト部のビットをすべて1にしたIPアドレスです。自ネットワークのネットワークアドレスがわからない場合にはリミテッドブロードキャストアドレス\"255.255.255.255\"を使うことになります。</li><li class=\"liu\">正しい。\"127.0.0.1\"は、ループバックアドレスと呼ばれ、現在使用しているコンピュータを指す特別なIPアドレスです。自コンピュータ内で動作しているプログラムと通信をする場合に、送信元であるコンピュータ自身を宛先にするためのアドレスとして使います。なお、IPv6では\"::1\"がループバックアドレスとして定義されています。</li><li class=\"lie\">デフォルトゲートウェイのアドレスは、そのサブネットワークで未使用のIPアドレスから任意に設定します。\"192.168.50.0/24\"のネットワークであれば、ホストアドレスの先頭である\"192.168.50.1\"や、末尾である\"192.168.50.254\"などが使われることが多いです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q21", "session": "支援士 R3春", "gap": 8, "num": 21, "topic": "バッチ処理の設計ガイドライン", "subcat": "トランザクション処理", "category": "情報セキュリティ", "mondai": "複数のバッチ処理を並行して動かすとき，デッドロックの発生をできるだけ回避したい。バッチ処理の設計ガイドラインのうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">複数のバッチ処理を並行して動かすとき，デッドロックの発生をできるだけ回避したい。バッチ処理の設計ガイドラインのうち，適切なものはどれか。</div>", "choices": {"ア": "参照するレコードにも，専有ロックを掛けるように設計する。", "イ": "大量データに同じ処理を行うバッチ処理は，まとめて一つのトランザクションとして処理するように設計する。", "ウ": "トランザクション開始直後に，必要なレコード全てに専有ロックを掛ける。ロックに失敗したレコードには，しばらく待って再度ロックを掛けるように設計する。", "エ": "複数レコードを更新するときの順番を決めておき，全てのバッチ処理がこれに従って処理するように設計する。"}, "choices_html": {"ア": "参照するレコードにも，専有ロックを掛けるように設計する。", "イ": "大量データに同じ処理を行うバッチ処理は，まとめて一つのトランザクションとして処理するように設計する。", "ウ": "トランザクション開始直後に，必要なレコード全てに専有ロックを掛ける。ロックに失敗したレコードには，しばらく待って再度ロックを掛けるように設計する。", "エ": "複数レコードを更新するときの順番を決めておき，全てのバッチ処理がこれに従って処理するように設計する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>デッドロック</strong>とは、共有資源を使用する2つ以上のプロセスが、互いに相手プロセスが必要とする資源を排他的に使用していて、互いのプロセスが相手が使用している資源の解放を待っている状態です。デッドロックが発生するとプロセスは永遠に待ち状態になってしまうため、処理の続行ができなくなってしまいます。<div class=\"img_margin\"><img alt=\"21.png/image-size:312×159\" height=\"159\" src=\"https://www.sc-siken.com/kakomon/03_haru/img/21.png\" style=\"max-width: 100%; height: auto;\" width=\"312\"/></div><ul><li class=\"lia\">共有ロックがかけられた資源は、参照を目的とする他のプロセスから共有ロックを許します。しかし専有ロックがかけられた資源は、他のプロセスからのいかなるロックも受け付けずアンロックを待たせます。参照のためだけに専有ロックを使用するとデッドロックが発生しやすくなるため共有ロックを使用すべきです。</li><li class=\"lii\">トランザクションの処理量が多くなると、1つのトランザクションが同時にロックをかける資源数が増えるためデッドロックが発生しやすくなります。</li><li class=\"liu\">並行処理するプロセス間で資源の競合が生じた場合、すぐにデッドロックが発生してしまいます。</li><li class=\"lie\">正しい。デッドロックは、複数の資源が別々のプロセスによって排他的に使用され、かつ、その専有順序が異なる場合に発生するため、あらかじめ資源の使用順序を決めておくことが防止策になります。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q22", "session": "支援士 R3春", "gap": 8, "num": 22, "topic": "システム／ソフトウェアの品質特性", "subcat": "ソフトウェア方式設計・詳細設計", "category": "情報セキュリティ", "mondai": "JIS X 25010:2013(システム及びソフトウェア製品の品質要求及び評価(SQuaRE)－システム及びソフトウェア品質モデル)で定義されたシステム及び／又はソフトウェア製品の品質特性に関する説明のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">JIS X 25010:2013(システム及びソフトウェア製品の品質要求及び評価(SQuaRE)－システム及びソフトウェア品質モデル)で定義されたシステム及び／又はソフトウェア製品の品質特性に関する説明のうち，適切なものはどれか。</div>", "choices": {"ア": "機能適合性とは，明示された状況下で使用するとき，明示的ニーズ及び暗黙のニーズを満足させる機能を，製品又はシステムが提供する度合いのことである。", "イ": "信頼性とは，明記された状態(条件)で使用する資源の量に関係する性能の度合いのことである。", "ウ": "性能効率性とは，明示された利用状況において，有効性，効率性及び満足性をもって明示された目標を達成するために，明示された利用者が製品又はシステムを利用することができる度合いのことである。", "エ": "保守性とは，明示された時間帯で，明示された条件下に，システム，製品又は構成要素が明示された機能を実行する度合いのことである。"}, "choices_html": {"ア": "機能適合性とは，明示された状況下で使用するとき，明示的ニーズ及び暗黙のニーズを満足させる機能を，製品又はシステムが提供する度合いのことである。", "イ": "信頼性とは，明記された状態(条件)で使用する資源の量に関係する性能の度合いのことである。", "ウ": "性能効率性とは，明示された利用状況において，有効性，効率性及び満足性をもって明示された目標を達成するために，明示された利用者が製品又はシステムを利用することができる度合いのことである。", "エ": "保守性とは，明示された時間帯で，明示された条件下に，システム，製品又は構成要素が明示された機能を実行する度合いのことである。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>JIS X 25010:2013</strong>は、ソフトウェア品質特性を定義した国際規格ISO/IEC 25010のJIS版で、JIS X 0129-1の後継規格に当たります。JIS X 25010:2013では、JIS X 0129-1で6つだった品質特性が、機能適合性、性能効率性、互換性、使用性、信頼性、セキュリティ、保守性、移植性の8つに拡張されています。<br/><br/>それぞれの定義は以下の通りです。<dl><dt>機能適合性</dt><dd>明示された状況下で使用するとき、明示的ニーズ及び暗黙のニーズを満足させる機能を、製品又はシステムが提供する度合い。</dd><dt>性能効率性</dt><dd>明記された状態(条件)で使用する資源の量に関係する性能の度合い。</dd><dt>互換性</dt><dd>同じハードウェア環境又はソフトウェア環境を共有する間、製品、システム又は構成要素が他の製品、システム又は構成要素の情報を交換することができる度合い、及び／又はその要求された機能を実行することができる度合い。</dd><dt>使用性</dt><dd>明示された利用状況において、有効性、効率性及び満足性をもって明示された目標を達成するために、明示された利用者が製品又はシステムを利用することができる度合い。</dd><dt>信頼性</dt><dd>明示された時間帯で、明示された条件下に、システム、製品又は構成要素が明示された機能を実行する度合い。</dd><dt>セキュリティ</dt><dd>人間又は他の製品若しくはシステムが、認められた権限の種類及び水準に応じたデータアクセスの度合いをもてるように、製品又はシステムが情報及びデータを保護する度合い。</dd><dt>保守性</dt><dd>意図した保守者によって、製品又はシステムが修正することができる有効性及び効率性の度合い。</dd><dt>移植性</dt><dd>一つのハードウェア、ソフトウェア又は他の運用環境若しくは利用環境からその他の環境に、システム、製品又は構成要素を移すことができる有効性及び効率性の度合い。</dd></dl><ul><li class=\"lia\">正しい。機能適合性の定義です。</li><li class=\"lii\">記述は性能効率性の定義です。</li><li class=\"liu\">記述は使用性の定義です。</li><li class=\"lie\">記述は信頼性の定義です。</li></ul><div class=\"img_margin\"><img alt=\"22.png/image-size:570×215\" height=\"215\" src=\"https://www.sc-siken.com/kakomon/03_haru/img/22.png\" style=\"max-width: 100%; height: auto;\" width=\"570\"/></div></div>", "past_history": ["安全確保支援士 H29春期 問22"], "hist_count": 2}, {"id": "sc_03_haru_q23", "session": "支援士 R3春", "gap": 8, "num": 23, "topic": "\"テスト駆動開発\"の説明はどれか", "subcat": "開発プロセス・手法", "category": "情報セキュリティ", "mondai": "エクストリームプログラミング(XP:eXtreme Programming)における\"テスト駆動開発\"の特徴はどれか。", "mondai_html": "<div id=\"mondai\">エクストリームプログラミング(XP:eXtreme Programming)における\"テスト駆動開発\"の特徴はどれか。</div>", "choices": {"ア": "最初のテストで，なるべく多くのバグを摘出する。", "イ": "テストケースの改善を繰り返す。", "ウ": "テストでのカバレージを高めることを目的とする。", "エ": "プログラムを書く前にテストコードを記述する。"}, "choices_html": {"ア": "最初のテストで，なるべく多くのバグを摘出する。", "イ": "テストケースの改善を繰り返す。", "ウ": "テストでのカバレージを高めることを目的とする。", "エ": "プログラムを書く前にテストコードを記述する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>エクストリームプログラミング</strong>(XP:eXtreme Programming)は、1990年代後半、Kent Beck氏らによって提唱されたソフトウェア開発手法で、アジャイルソフトウェア開発と称される一連の手法の先駆けとなったものです。『プログラマーは人間である』という思想のもと、叩き台となるプログラムを早期に開発し、短いサイクルで頻繁にテストとリリースを繰り返すことで、顧客の要求への対応力と生産性を高め、リスクを軽減することを目的としています。<br/><br/><strong>テスト駆動開発</strong>は、XPのプラクティスのうちの1つで、求める機能を明確化するために、プログラムを記述するよりも前にテストケースを作成する開発手法です。そのテストをパスする最低限の実装を行った後で、機能を維持したままコードを洗練していくという手順で開発を進めます。<br/><br/>したがって「エ」が正解です。<div class=\"img_margin\"><img alt=\"23.png/image-size:377×332\" height=\"332\" src=\"https://www.sc-siken.com/kakomon/03_haru/img/23.png\" style=\"max-width: 100%; height: auto;\" width=\"377\"/></div></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q24", "session": "支援士 R3春", "gap": 8, "num": 24, "topic": "ディスク障害からの回復方法", "subcat": "サービスの運用", "category": "情報セキュリティ", "mondai": "ディスク障害時に，フルバックアップを取得してあるテープからディスクにデータを復元した後，フルバックアップ取得時以降の更新後コピーをログから反映させてデータベースを回復する方法はどれか。", "mondai_html": "<div id=\"mondai\">ディスク障害時に，フルバックアップを取得してあるテープからディスクにデータを復元した後，フルバックアップ取得時以降の更新後コピーをログから反映させてデータベースを回復する方法はどれか。</div>", "choices": {"ア": "チェックポイントリスタート", "イ": "リブート", "ウ": "ロールバック", "エ": "ロールフォワード"}, "choices_html": {"ア": "チェックポイントリスタート", "イ": "リブート", "ウ": "ロールバック", "エ": "ロールフォワード"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>ロールフォワード</strong>は、前進復帰と訳され、データベースシステムに障害が起こったときに、<em class=\"r\">更新後ログ</em>を用いて今まで処理したトランザクションを再現し、システム障害直前までデータベース情報を復帰させる処理です。<br/><br/>ディスクの媒体障害が発生した際には、新しいディスクに入れ替えた後にフルバックアップデータからデータを復元し、続いてバックアップ時点から障害発生時点までのトランザクションの内容をロールフォワード処理でデータベースに適用します。<ul><li class=\"lia\">チェックポイントリスタートは、トランザクション障害やシステム障害から復帰するときに、直前のチェックポイント(データベース処理とディスク内容の同期ポイント)まで戻ってから再開する方法です。</li><li class=\"lii\">リブートは、システム障害などから回復するためにマシンを再起動することです。</li><li class=\"liu\">ロールバックは、トランザクション障害やシステム障害の発生でトランザクションが正常に終了しなかった場合に、<em class=\"r\">更新前ログ</em>を用いてデータベースをトランザクション開始直前の状態に戻す処理です。</li><li class=\"lie\">正しい。ロールフォワードは、更新後ログを用いてコミット済のトランザクションを再現し、データベースを障害発生直前の状態に回復する作業です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_03_haru_q25", "session": "支援士 R3春", "gap": 8, "num": 25, "topic": "指摘事項として記載すべきもの", "subcat": "システム監査", "category": "情報セキュリティ", "mondai": "ソフトウェア開発プロセスにおけるセキュリティを確保するための取組について，JIS Q 27001:2014(情報セキュリティマネジメントシステム－要求事項)の附属書Aの管理策に照らして監査を行った。判明した状況のうち，監査人が監査報告書に指摘事項として記載すべきものはどれか。", "mondai_html": "<div id=\"mondai\">ソフトウェア開発プロセスにおけるセキュリティを確保するための取組について，JIS Q 27001:2014(情報セキュリティマネジメントシステム－要求事項)の附属書Aの管理策に照らして監査を行った。判明した状況のうち，監査人が監査報告書に指摘事項として記載すべきものはどれか。</div>", "choices": {"ア": "ソフトウェア開発におけるセキュリティ機能の試験は，開発期間が終了した後に実施している。", "イ": "ソフトウェア開発は，セキュリティ確保に配慮した開発環境において行っている。", "ウ": "ソフトウェア開発を外部委託している場合，外部委託先による開発活動の監督・監視において，セキュリティ確保の観点を考慮している。", "エ": "パッケージソフトウェアを活用した開発において，セキュリティ確保の観点から，パッケージソフトウェアの変更は必要な変更に限定している。"}, "choices_html": {"ア": "ソフトウェア開発におけるセキュリティ機能の試験は，開発期間が終了した後に実施している。", "イ": "ソフトウェア開発は，セキュリティ確保に配慮した開発環境において行っている。", "ウ": "ソフトウェア開発を外部委託している場合，外部委託先による開発活動の監督・監視において，セキュリティ確保の観点を考慮している。", "エ": "パッケージソフトウェアを活用した開発において，セキュリティ確保の観点から，パッケージソフトウェアの変更は必要な変更に限定している。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/03_haru/am2_25.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">正しい。「セキュリティ機能の試験は，開発期間中に実施しなければならない」としているため、指摘事項に該当します。</li><li class=\"lii\">「組織は，全てのシステム開発ライフサイクルを含む，システムの開発及び統合の取組みのためのセキュリティに配慮した開発環境を確立し，適切に保護しなければならない」としているため、問題ありません。</li><li class=\"liu\">「組織は，外部委託したシステム開発活動を監督し，監視しなければならない」としているため、問題ありません。セキュリティに配慮した情報システム実装体制は外部委託先にも適用されます。</li><li class=\"lie\">「パッケージソフトウェアの変更は，抑止しなければならず，必要な変更だけに限らなければならない」としているため、問題ありません。パッケージソフトウェアをカスタマイズする過程でバグやセキュリティホールが生じる可能性があるため、変更は必要最小限に抑えるべきです。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_02_aki_q3", "session": "支援士 R2秋", "gap": 9, "num": 3, "topic": "エクスプロイトコードの説明はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "エクスプロイトコードの説明はどれか。", "mondai_html": "<div id=\"mondai\">エクスプロイトコードの説明はどれか。</div>", "choices": {"ア": "攻撃コードとも呼ばれ，ソフトウェアの脆弱性を悪用するコードのことであり，使い方によっては脆弱性の検証に役立つこともある。", "イ": "マルウェア定義ファイルとも呼ばれ，マルウェアを特定するための特徴的なコードのことであり，マルウェア対策ソフトによるマルウェアの検知に用いられる。", "ウ": "メッセージとシークレットデータから計算されるハッシュコードのことであり，メッセージの改ざん検知に用いられる。", "エ": "ログインのたびに変化する認証コードのことであり，窃取されても再利用できないので不正アクセスを防ぐ。"}, "choices_html": {"ア": "攻撃コードとも呼ばれ，ソフトウェアの脆弱性を悪用するコードのことであり，使い方によっては脆弱性の検証に役立つこともある。", "イ": "マルウェア定義ファイルとも呼ばれ，マルウェアを特定するための特徴的なコードのことであり，マルウェア対策ソフトによるマルウェアの検知に用いられる。", "ウ": "メッセージとシークレットデータから計算されるハッシュコードのことであり，メッセージの改ざん検知に用いられる。", "エ": "ログインのたびに変化する認証コードのことであり，窃取されても再利用できないので不正アクセスを防ぐ。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_3.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>エクスプロイトコード</strong>(Exploit Code)とは、ソフトウェアの脆弱性を悪用した不正な動作を再現するために作成されたスクリプトやプログラムを指す言葉です。<br/><br/>このようなプログラムは、善意の第三者や製品開発元の間で安全に流通している状況であれば問題ありませんが、世の中に出回ると攻撃方法の詳細が広く知られることになり、攻撃者によって個人や組織への攻撃に悪用されてしまう可能性があります。実際に様々な脆弱性に対して攻撃が成功するように、複数のエクスプロイトコードをまとめた<b>エクスプロイトキット</b>というツールも存在し、攻撃に利用されているのが現状です。<br/><br/>エクスプロイトコードは、多くの場合、悪意を持ったマルウェアのことを指しますが、セキュリティ向上目的での研究材料や脆弱性検査のために作成された実証用コードという意味でも用いられます。<br/><br/>したがって「ア」が正解です。<ul><li class=\"lia\">正しい。エクスプロイトコードの説明です。</li><li class=\"lii\">シグネチャコードの説明です。</li><li class=\"liu\">メッセージ認証符号(MAC：Message Authentication Code)の説明です。</li><li class=\"lie\">ワンタイムパスワードやログイン認証コードの説明です。</li></ul></div>", "past_history": ["安全確保支援士 H30春期 問4"], "hist_count": 2}, {"id": "sc_02_aki_q4", "session": "支援士 R2秋", "gap": 9, "num": 4, "topic": "サイドチャネル攻撃の説明はどれか", "subcat": "情報セキュリティ", "category": "情報セキュリティ", "mondai": "サイドチャネル攻撃の説明はどれか。", "mondai_html": "<div id=\"mondai\">サイドチャネル攻撃の説明はどれか。</div>", "choices": {"ア": "暗号アルゴリズムを実装した攻撃対象の物理デバイスから得られる物理量(処理時間や消費電流など)やエラーメッセージから，攻撃対象の秘密情報を得る。", "イ": "企業などの秘密情報を窃取するソーシャルエンジニアリングの手法の一つであり，不用意に捨てられた秘密情報の印刷物をオフィスの紙ごみの中から探し出す。", "ウ": "通信を行う2者間に割り込んで，両者が交換する情報を自分のものとすり替えることによって，その後の通信を気付かれることなく盗聴する。", "エ": "データベースを利用するWebサイトに入力パラメータとしてSQL文の断片を送信することによって，データベースを改ざんする。"}, "choices_html": {"ア": "暗号アルゴリズムを実装した攻撃対象の物理デバイスから得られる物理量(処理時間や消費電流など)やエラーメッセージから，攻撃対象の秘密情報を得る。", "イ": "企業などの秘密情報を窃取するソーシャルエンジニアリングの手法の一つであり，不用意に捨てられた秘密情報の印刷物をオフィスの紙ごみの中から探し出す。", "ウ": "通信を行う2者間に割り込んで，両者が交換する情報を自分のものとすり替えることによって，その後の通信を気付かれることなく盗聴する。", "エ": "データベースを利用するWebサイトに入力パラメータとしてSQL文の断片を送信することによって，データベースを改ざんする。"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_4.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>サイドチャネル攻撃</strong>は、対象の動作状況を観察し、漏洩電磁波・電力消費等のサイドチャネル情報から暗号鍵推定等を行う非破壊型解析攻撃の総称です。サイドチャネル(Side Channel)には、非正規の入出力経路という意味があります。<br/><br/>具体的な攻撃方法としては、故障利用攻撃、タイミング攻撃や電力解析攻撃、電磁波解析攻撃などがあります。<dl><dt>故障利用攻撃</dt><dd>デバイスに限定的な障害を故意に与え、デバイスの計算誤りから秘密情報を解析する手法</dd><dt>タイミング攻撃</dt><dd>暗号処理のタイミングが暗号鍵の論理値に依存して変化することに着目し、暗号化や復号に要する時間の差異を統計的に解析して暗号鍵を推定する手法</dd><dt>電力解析攻撃</dt><dd>消費電力の変化に着目して鍵や処理内容の解析を試みる手法</dd><dt>電磁波解析攻撃（テンペスト攻撃）</dt><dd>機器が発する電磁波を測定することによって秘密情報の取得を試みる手法</dd></dl><ul><li class=\"lia\">正しい。サイドチャネル攻撃の説明です。</li><li class=\"lii\">スキャベンジングの説明です。</li><li class=\"liu\">MITM攻撃(Man in the middle attack：中間者攻撃)の説明です。</li><li class=\"lie\">SQLインジェクションの説明です。</li></ul></div>", "past_history": ["情報セキュリティ H25春期 問5", "情報セキュリティ H27春期 問5", "安全確保支援士 H29春期 問3"], "hist_count": 4}, {"id": "sc_02_aki_q7", "session": "支援士 R2秋", "gap": 9, "num": 7, "topic": "サイバー・フィジカル・セキュリティ対策", "subcat": "情報セキュリティ管理", "category": "情報セキュリティ", "mondai": "経済産業省が\"サイバー・フィジカル・セキュリティ対策フレームワーク(Version1.0)\"を策定した主な目的の一つはどれか。", "mondai_html": "<div id=\"mondai\">経済産業省が\"サイバー・フィジカル・セキュリティ対策フレームワーク(Version1.0)\"を策定した主な目的の一つはどれか。</div>", "choices": {"ア": "ICTを活用し，場所や時間を有効に活用できる柔軟な働き方(テレワーク)の形態を示し，テレワークの形態に応じた情報セキュリティ対策の考え方を示すこと", "イ": "新たな産業社会において付加価値を創造する活動が直面するリスクを適切に捉えるためのモデルを構築し，求められるセキュリティ対策の全体像を整理すること", "ウ": "クラウドサービスの利用者と提供者が，セキュリティ管理策の実施について容易に連携できるように，実施の手引を利用者向けと提供者向けの対で記述すること", "エ": "データセンターの利用者と事業者に対して\"データセンターの適切なセキュリティ\"とは何かを考え，共有すべき知見を提供すること"}, "choices_html": {"ア": "ICTを活用し，場所や時間を有効に活用できる柔軟な働き方(テレワーク)の形態を示し，テレワークの形態に応じた情報セキュリティ対策の考え方を示すこと", "イ": "新たな産業社会において付加価値を創造する活動が直面するリスクを適切に捉えるためのモデルを構築し，求められるセキュリティ対策の全体像を整理すること", "ウ": "クラウドサービスの利用者と提供者が，セキュリティ管理策の実施について容易に連携できるように，実施の手引を利用者向けと提供者向けの対で記述すること", "エ": "データセンターの利用者と事業者に対して\"データセンターの適切なセキュリティ\"とは何かを考え，共有すべき知見を提供すること"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_7.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">サイバー・フィジカル・セキュリティ対策フレームワーク(CPSF)は、Society5.0が目指す、サイバー空間(仮想空間)とフィジカル空間(現実空間)を高度に融合させた社会で生まれる新たな形のサプライチェーン全体についてのサイバーセキュリティ確保を目的として策定されたフレームワークです。サイバー空間とフィジカル空間が高度に融合した産業社会を、「企業間のつながり」、「フィジカル空間とサイバー空間のつながり」、「サイバー空間におけるつながり」という3つの切り口から捉え、サプライチェーンの信頼性を確保する観点から、それぞれの切り口において守るべきもの、直面するリスク源、対応の方針等を整理しています。<br/><br/>したがって「イ」が適切な説明です。<ul><li class=\"lia\">総務省\"テレワークセキュリティガイドライン\"の策定目的です。</li><li class=\"lii\">正しい。\"サイバー・フィジカル・セキュリティ対策フレームワーク\"の策定目的です。</li><li class=\"liu\">経済産業省\"クラウドサービス利用のための情報セキュリティマネジメントガイドライン\"と、総務省\"クラウドサービス提供における情報セキュリティ対策ガイドライン\"の策定目的です。</li><li class=\"lie\">\"データセンターセキュリティガイドブック\"の策定目的です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_02_aki_q9", "session": "支援士 R2秋", "gap": 9, "num": 9, "topic": "3Dセキュアに関する記述", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "3Dセキュアは，ネットショッピングでのオンライン決済におけるクレジットカードの不正使用を防止する対策の一つである。3Dセキュアに関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">3Dセキュアは，ネットショッピングでのオンライン決済におけるクレジットカードの不正使用を防止する対策の一つである。3Dセキュアに関する記述のうち，適切なものはどれか。</div>", "choices": {"ア": "クレジットカードのPIN(Personal Identification Number:暗証番号)を入力させ，検証することによって，なりすましによる不正使用を防止する。", "イ": "クレジットカードのセキュリティコード(カードの裏面又は表面に記載された3桁又は4桁の番号)を入力させ，検証することによって，クレジットカードの不正使用を防止する。", "ウ": "クレジットカードの有効期限を入力させ，検証することによって，期限切れクレジットカードの不正使用を防止する。", "エ": "クレジットカード発行会社にあらかじめ登録したパスワードなど，本人しか分からない情報を入力させ，検証することによって，なりすましによるクレジットカードの不正使用を防止する。"}, "choices_html": {"ア": "クレジットカードのPIN(Personal Identification Number:暗証番号)を入力させ，検証することによって，なりすましによる不正使用を防止する。", "イ": "クレジットカードのセキュリティコード(カードの裏面又は表面に記載された3桁又は4桁の番号)を入力させ，検証することによって，クレジットカードの不正使用を防止する。", "ウ": "クレジットカードの有効期限を入力させ，検証することによって，期限切れクレジットカードの不正使用を防止する。", "エ": "クレジットカード発行会社にあらかじめ登録したパスワードなど，本人しか分からない情報を入力させ，検証することによって，なりすましによるクレジットカードの不正使用を防止する。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_9.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>3Dセキュア</strong>は、インターネットショッピングでクレジットカード決済を行う際に、発行会社に事前登録済のパスワードの入力を求めることによって本人認証を行う方式です。オンラインでクレジットカードを使用する際には、カード番号、有効期限(月／年)、セキュリティコードの入力を求められますが、これらはすべてカード面に記載されているため、カードが第三者の手に渡った場合にはセキュリティ効果は望めません。しかし、3Dセキュアでは本人しか知り得ない情報で追加認証を行うので、クレジットカードを盗まれてしまった場面等でも第三者による不正利用を防止できます。<br/><br/>したがって「エ」が正解です。<br/><br/>なお、クレジットカードの暗証番号(PIN)は従来のサインに代えてカード使用時に入力する4桁の数字ですが、3Dセキュアで使用するパスワードとは異なります。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_02_aki_q12", "session": "支援士 R2秋", "gap": 9, "num": 12, "topic": "cookieのSecure属性", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "WebサーバがHTTP over TLS(HTTPS)通信の応答でcookieにSecure属性を設定するときのWebサーバ及びWebブラウザの処理はどれか。", "mondai_html": "<div id=\"mondai\">WebサーバがHTTP over TLS(HTTPS)通信の応答でcookieにSecure属性を設定するときのWebサーバ及びWebブラウザの処理はどれか。</div>", "choices": {"ア": "Webサーバでは，cookie発行時に\"Secure=\"に続いて時間を設定し，Webブラウザは，指定された時間を参照し，指定された時間を過ぎている場合にそのcookieを削除する。", "イ": "Webサーバでは，cookie発行時に\"Secure=\"に続いてホスト名を設定し，Webブラウザは，指定されたホスト名を参照し，指定されたホストにそのcookieを送信する。", "ウ": "Webサーバでは，cookie発行時に\"Secure\"を設定し，Webブラウザは，それを参照し，HTTPS通信時だけそのcookieを送信する。", "エ": "Webサーバでは，cookie発行時に\"Secure\"を設定し，Webブラウザは，それを参照し，Webブラウザの終了時にcookieの他の属性によらず，そのcookieを削除する。"}, "choices_html": {"ア": "Webサーバでは，cookie発行時に\"Secure=\"に続いて時間を設定し，Webブラウザは，指定された時間を参照し，指定された時間を過ぎている場合にそのcookieを削除する。", "イ": "Webサーバでは，cookie発行時に\"Secure=\"に続いてホスト名を設定し，Webブラウザは，指定されたホスト名を参照し，指定されたホストにそのcookieを送信する。", "ウ": "Webサーバでは，cookie発行時に\"Secure\"を設定し，Webブラウザは，それを参照し，HTTPS通信時だけそのcookieを送信する。", "エ": "Webサーバでは，cookie発行時に\"Secure\"を設定し，Webブラウザは，それを参照し，Webブラウザの終了時にcookieの他の属性によらず，そのcookieを削除する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_12.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>Secure属性</strong>は、個々のcookieの動作を制御する属性の1つで、これが設定されたcookieは「HTTP<em class=\"r\">S</em>通信の場合のみ、WebブラウザからWebサーバに送信される」ようになります。cookieには認証情報等が含まれているので、盗聴の可能性がある非暗号化通信では窃取されてしまうおそれがあります。Secure属性を設定しておけば、HTTPのURLでアクセスしたときにcookieが送信されないので安全です。<br/><br/>したがって適切な記述は「ウ」です。<br/><br/>なお、cookieを発行する際に指定できる属性には\"Secure\"の他に以下の属性があります。<ul><li><b>Domain</b> - cookieを送信するドメインを指定する</li><li><b>Path</b> - cookieを送信するURLディレクトリを指定する</li><li><b>Expires</b> - cookieの有効期限を指定する</li><li><b>HttpOnly</b> - JavaScriptからのアクセスを禁止する</li><li><b>SameSite</b> - サイトをまたがるリクエストの際のcookie送信を制御する</li></ul><ul><li class=\"lia\">Secure属性は、cookieの有効期限とは関係ありません。記述はExpires属性についてのものです。</li><li class=\"lii\">記述はDomain属性についてのものです。</li><li class=\"liu\">正しい。Secure属性についての記述です。</li><li class=\"lie\">Secure属性はcookieの有効期限とは関係ありません。ブラウザを閉じるときにcookieを消したいときは、Expires属性を設定しないか、値として0を設定します。</li></ul></div>", "past_history": ["情報セキュリティ H26春期 問10", "情報セキュリティ H27秋期 問13"], "hist_count": 3}, {"id": "sc_02_aki_q13", "session": "支援士 R2秋", "gap": 9, "num": 13, "topic": "デジタルフォレンジックス", "subcat": "情報セキュリティ対策", "category": "情報セキュリティ", "mondai": "デジタルフォレンジックスに該当するものはどれか。", "mondai_html": "<div id=\"mondai\">デジタルフォレンジックスに該当するものはどれか。</div>", "choices": {"ア": "画像や音楽などのデジタルコンテンツに著作権者などの情報を埋め込む。", "イ": "コンピュータやネットワークのセキュリティ上の弱点を発見するテスト手法の一つであり，システムを実際に攻撃して侵入を試みる。", "ウ": "巧みな話術や盗み聞き，盗み見などの手段によって，ネットワーク管理者や利用者などから，パスワードなどのセキュリティ上重要な情報を入手する。", "エ": "犯罪に関する証拠となり得るデータを保全し，調査，分析，その後の訴訟などに備える。"}, "choices_html": {"ア": "画像や音楽などのデジタルコンテンツに著作権者などの情報を埋め込む。", "イ": "コンピュータやネットワークのセキュリティ上の弱点を発見するテスト手法の一つであり，システムを実際に攻撃して侵入を試みる。", "ウ": "巧みな話術や盗み聞き，盗み見などの手段によって，ネットワーク管理者や利用者などから，パスワードなどのセキュリティ上重要な情報を入手する。", "エ": "犯罪に関する証拠となり得るデータを保全し，調査，分析，その後の訴訟などに備える。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_13.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>デジタルフォレンジックス</strong>は、インシデントの発生時に関連するデジタル機器上の電磁的記録を確実かつ正確に収集・取得し、保全するとともに、分析・解析を行い、法的紛争やトラブルにおける立証に役立てる活動です。<br/><br/>PCやサーバ、スマートフォン、ネットワーク機器など証拠保全の対象となる機器を特定し、そこに残された電子的な痕跡を法的要件を満たす形で取得・保全を行いますが、適切な方法で取得・保全を行うためには高度な専門的技術が必要とされます。<br/><br/>電磁的記録を適切に保全することは、サイバー攻撃への対策となるだけではなく、犯罪や内部不正などの法的紛争に対処する観点からも重要であり、デジタルフォレンジックスに対するニーズは高まってきています。<br/><br/>したがって正解は「エ」です。<ul><li class=\"lia\">ステガノグラフィの説明です。</li><li class=\"lii\">ペネトレーションテストの説明です。</li><li class=\"liu\">ソーシャルエンジニアリングの説明です。</li><li class=\"lie\">正しい。デジタルフォレンジックスの説明です。</li></ul></div>", "past_history": ["情報セキュリティ H24秋期 問12", "情報セキュリティ H26秋期 問14", "情報セキュリティ H28春期 問14"], "hist_count": 4}, {"id": "sc_02_aki_q17", "session": "支援士 R2秋", "gap": 9, "num": 17, "topic": "IP25Bに該当するものはどれか", "subcat": "セキュリティ実装技術", "category": "情報セキュリティ", "mondai": "インターネットサービスプロバイダ(ISP)が，スパムメール対策として導入するIP25Bに該当するものはどれか。", "mondai_html": "<div id=\"mondai\">インターネットサービスプロバイダ(ISP)が，スパムメール対策として導入するIP25Bに該当するものはどれか。</div>", "choices": {"ア": "自社ISPのネットワークの動的IPアドレスから他社ISPの管理するメールサーバへのSMTP通信を制限する。", "イ": "自社ISPのメールサーバで受信した電子メールのうち，スパムメールのシグネチャに一致する電子メールを隔離する。", "ウ": "他社ISPのネットワークの動的IPアドレスから自社ISPのメールサーバへのSMTP通信を制限する。", "エ": "他社ISPのメール不正中継の脆弱性をもつメールサーバから自社ISPのメールサーバに送信された電子メールを隔離する。"}, "choices_html": {"ア": "自社ISPのネットワークの動的IPアドレスから他社ISPの管理するメールサーバへのSMTP通信を制限する。", "イ": "自社ISPのメールサーバで受信した電子メールのうち，スパムメールのシグネチャに一致する電子メールを隔離する。", "ウ": "他社ISPのネットワークの動的IPアドレスから自社ISPのメールサーバへのSMTP通信を制限する。", "エ": "他社ISPのメール不正中継の脆弱性をもつメールサーバから自社ISPのメールサーバに送信された電子メールを隔離する。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_17.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><ul><li class=\"lia\">OP25Bの説明です。</li><li class=\"lii\">迷惑メールフィルタリングにおける「シグネチャマッチング方式」の説明です。</li><li class=\"liu\">正しい。IP25Bの説明です。OP25Bが不審なメール送信を拒否するのに対し、IP25Bでは不審な送信元からのメール受信を拒否します。</li><li class=\"lie\">RBL(Real-time Blackhole List)を使用したスパムメール対策です。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_02_aki_q18", "session": "支援士 R2秋", "gap": 9, "num": 18, "topic": "DHCP DISCOVERのアドレス", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "図のように，サブネット192.168.1.0/24にPCを接続し，サブネット192.168.2.0/24にあるDHCPサーバによってPCのIPアドレスの設定を行いたい。このとき，PCからDHCPサーバに対する最初の問合せの宛先IPアドレスとして，適切なものはどれか。ここで，PCからDHCPサーバに対する最初の問合せにはブロードキャスト通信が使われ，更に次の条件を満たす。〔条件〕ルータではDHCPリレーエージェントが動作している。PCは自分自身のサブネット情報を知らない。", "mondai_html": "<div id=\"mondai\">図のように，サブネット192.168.1.0/24にPCを接続し，サブネット192.168.2.0/24にあるDHCPサーバによってPCのIPアドレスの設定を行いたい。このとき，PCからDHCPサーバに対する最初の問合せの宛先IPアドレスとして，適切なものはどれか。ここで，PCからDHCPサーバに対する最初の問合せにはブロードキャスト通信が使われ，更に次の条件を満たす。<br/><br/>〔条件〕<ul><li class=\"li1\">ルータではDHCPリレーエージェントが動作している。</li><li class=\"li2\">PCは自分自身のサブネット情報を知らない。</li></ul><div class=\"img_margin\"><img alt=\"18.png/image-size:260×178\" height=\"178\" src=\"https://www.sc-siken.com/kakomon/02_aki/img/18.png\" style=\"max-width: 100%; height: auto;\" width=\"260\"/></div></div>", "choices": {"ア": "192.168.1.0", "イ": "192.168.1.255", "ウ": "192.168.2.255", "エ": "255.255.255.255"}, "choices_html": {"ア": "192.168.1.0", "イ": "192.168.1.255", "ウ": "192.168.2.255", "エ": "255.255.255.255"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/02_aki/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">DHCPクライアントからDHCPサーバへの最初のメッセージは、DHCPDISCOVERと呼ばれ、ブロードキャスト送信となります。<div class=\"img_margin\"><img alt=\"18_1.png/image-size:401×480\" height=\"480\" src=\"https://www.sc-siken.com/kakomon/02_aki/img/18_1.png\" style=\"max-width: 100%; height: auto;\" width=\"401\"/></div>DHCPクライアントは、DHCPDISCOVERメッセージの送信時点では自身の属するネットワークが明らかになっていなので、宛先IPアドレスを「255.255.255.255」にしてブロードキャストします。これは同一セグメントに属する全てのコンピュータに対して同じメッセージを送信することを意味します。また送信元IPアドレスは未割当てなので「0.0.0.0」に設定します。<div class=\"img_margin\"><img alt=\"18_2.png/image-size:451×134\" height=\"134\" src=\"https://www.sc-siken.com/kakomon/02_aki/img/18_2.png\" style=\"max-width: 100%; height: auto;\" width=\"451\"/></div>したがって「エ」が適切です。<br/><br/>なお、DHCPリレーエージェント機能は、異なるネットワークセグメントに存在する（ブロードキャストが届かない）DHCPクライアントとDHCPサーバとの間の通信を中継する機能です。設問のようにクライアント－サーバ間にルータ（またはL3SW）が介在する場合には、DHCPリレーエージェントを利用する必要があります。<br/>DHCPリレーエージェントが動作しているルータがブロードキャストのDHCPメッセージを受け取ると、そのメッセージをDHCPサーバに対してユニキャストで送信します。そしてDHCPサーバからの応答を受け取ると、DHCPクライアントに対してその応答を送信します。これにより異なるネットワークセグメントに属するDHCPクライアントとDHCPサーバとの間の通信を実現します。<div class=\"img_margin\"><img alt=\"18_3.png/image-size:535×230\" height=\"230\" src=\"https://www.sc-siken.com/kakomon/02_aki/img/18_3
