の命令文を含む入力値を与えることで不正なOSコマンドを実行させ、ファイルの不正操作、外部プログラムの実行、パスワードの不正取得などを行う攻撃です。<ul><li class=\"lia\">HTTPヘッダーインジェクションは、動的にHTTPヘッダーを生成するシステムにおいて、HTTPヘッダー内に改行コードなどを不正挿入することによって、不正なヘッダー情報を挿入したり、任意の記述をメッセージボディに挿入したりする攻撃です。</li><li class=\"lii\">正しい。OSコマンドインジェクションは、入力値としてOSコマンドとして解釈される文字列を紛れ込ませることにより、システムに不正なOSコマンドを実行させる攻撃です。</li><li class=\"liu\">クロスサイトリクエストフォージェリは、Webサイトに設置されたハイパーリンクや実行されるスクリプトなどを通じて、別のサイトで閲覧者に意図しない不正操作を行わせる攻撃です。引き起こされる被害例としては、会員情報の変更、商品の購入などがあります。</li><li class=\"lie\">セッションハイジャックは、TCPコネクションやクライアント－サーバ間の正規のセッションを奪い取る行為です。</li></ul></div>", "past_history": ["安全確保支援士 R5秋期 問1", "情報セキュリティ H23秋期 問16", "情報セキュリティ H26春期 問15", "安全確保支援士 H29春期 問12"], "hist_count": 5}, {"id": "sc_30_aki_q18", "session": "支援士 H30秋", "gap": 12, "num": 18, "topic": "3ウェイハンドシェイクを表す図", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "TCPのコネクション確立方式である3ウェイハンドシェイクを表す図はどれか。", "mondai_html": "<div id=\"mondai\">TCPのコネクション確立方式である3ウェイハンドシェイクを表す図はどれか。</div>", "choices": {"ア": "（画像参照）", "イ": "（画像参照）", "ウ": "（画像参照）", "エ": "（画像参照）"}, "choices_html": {"ア": "<span id=\"select_a\"><img alt=\"18a.png/image-size:170×138\" height=\"138\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/18a.png\" style=\"max-width: 100%; height: auto;\" width=\"170\"/></span>", "イ": "<span id=\"select_i\"><img alt=\"18i.png/image-size:170×209\" height=\"209\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/18i.png\" style=\"max-width: 100%; height: auto;\" width=\"170\"/></span>", "ウ": "<span id=\"select_u\"><img alt=\"18u.png/image-size:171×146\" height=\"146\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/18u.png\" style=\"max-width: 100%; height: auto;\" width=\"171\"/></span>", "エ": "<span id=\"select_e\"><img alt=\"18e.png/image-size:170×231\" height=\"231\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/18e.png\" style=\"max-width: 100%; height: auto;\" width=\"170\"/></span>"}, "ans": "ア", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_18.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>3ウェイハンドシェイク</strong>とは、TCPが通信開始に先立ち3回（1往復半）のパケット送信を経てTCPコネクションを確立する手順を表したものです。<br/><br/>TCPがコネクションを確立する手順は次のようになっています。<ol><li>要求元から要求先に対して<b>SYN</b>パケットを送信する(接続要求)。</li><li>SYNパケットを受信した要求先は、要求元の接続を許可することを示す<b>SYN ACK</b>パケットを送信する(接続許可)。</li><li>SYN ACKパケットを受信した要求元は接続開始を表す<b>ACK</b>パケットを要求先に送信し、相手との通信を開始する(コネクション確立)。</li></ol>したがって正しい手順の図は「ア」です。<div class=\"img_margin\"><img alt=\"18.png/image-size:467×318\" height=\"318\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/18.png\" style=\"max-width: 100%; height: auto;\" width=\"467\"/></div></div>", "past_history": ["情報セキュリティ H22秋期 問20", "情報セキュリティ H28秋期 問19"], "hist_count": 3}, {"id": "sc_30_aki_q19", "session": "支援士 H30秋", "gap": 12, "num": 19, "topic": "クラスDのIPアドレスに関する記述", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "クラスDのIPアドレス(224.0.0.0～239.255.255.255)に関する記述として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">クラスDのIPアドレス(224.0.0.0～239.255.255.255)に関する記述として，適切なものはどれか。</div>", "choices": {"ア": "DHCPサーバが見つからないときの自動設定アドレスに使用される。", "イ": "IETFでの実験用アドレスとして予約されており，一般には使用されない。", "ウ": "UDPなどを用いるマルチキャスト通信で使用される。", "エ": "小規模なネットワークでプライベートアドレスとして使用される。"}, "choices_html": {"ア": "DHCPサーバが見つからないときの自動設定アドレスに使用される。", "イ": "IETFでの実験用アドレスとして予約されており，一般には使用されない。", "ウ": "UDPなどを用いるマルチキャスト通信で使用される。", "エ": "小規模なネットワークでプライベートアドレスとして使用される。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_19.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">クラスDのIPアドレスは、特定のグループに所属する全てのホストに同時送信を行う「マルチキャスト」で使用されるアドレスです。<br/>ビット列の割り振りは、32ビットのうち先頭4ビットがクラスDを表す「1110」で、アドレスの残りの28ビットが送信対象となるグループ番号を指定する部分として使われます。<div class=\"img_margin\"><img alt=\"19.png/image-size:392×78\" height=\"78\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/19.png\" style=\"max-width: 100%; height: auto;\" width=\"392\"/></div><ul><li class=\"lia\">リンクローカルアドレスの説明です。DHCPサーバが見つからないときに、APIPA(Automatic Private IP Addressing)の機能の働きにより割り振られるIPアドレスです。※IPv4の場合 169.254.*.*</li><li class=\"lii\">クラスEのIPアドレス(240.0.0.0～255.255.255.255)の説明です。</li><li class=\"liu\">正しい。</li><li class=\"lie\">クラスCのIPアドレスの説明です。クラスDのIPアドレスは、プライベートアドレスとしてホストに割り当てることができません。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_30_aki_q20", "session": "支援士 H30秋", "gap": 12, "num": 20, "topic": "無線LANの周波数帯域の組合せ", "subcat": "通信プロトコル", "category": "情報セキュリティ", "mondai": "日本国内において，無線LANの規格IEEE 802.11n及びIEEE 802.11acで使用される周波数帯域の組合せとして，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">日本国内において，無線LANの規格IEEE 802.11n及びIEEE 802.11acで使用される周波数帯域の組合せとして，適切なものはどれか。</div><div class=\"img_margin select_table_margin\" style=\"margin: 12px 0; text-align: center;\"><img alt=\"選択肢の表\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/20.png\" style=\"max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 4px;\" /></div>", "choices": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "choices_html": {"ア": "選択肢 ア", "イ": "選択肢 イ", "ウ": "選択肢 ウ", "エ": "選択肢 エ"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_20.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">次の表は、無線LANの標準規格であるIEEE 802.11シリーズの主な特徴を比較したものです。<div class=\"img_margin\"><img alt=\"20a.png/image-size:535×190\" height=\"190\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/20a.png\" style=\"max-width: 100%; height: auto;\" width=\"535\"/></div>11nは2.4GHz帯と5GHz帯の両方に対応していますが、11acは5GHz帯のみとなります。したがって適切な組合せは「ウ」です。</div>", "past_history": [], "hist_count": 1}, {"id": "sc_30_aki_q21", "session": "支援士 H30秋", "gap": 12, "num": 21, "topic": "SQL文の実行結果の説明に関する記述", "subcat": "データ操作", "category": "情報セキュリティ", "mondai": "次のSQL文の実行結果の説明に関する記述のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">次のSQL文の実行結果の説明に関する記述のうち，適切なものはどれか。<div class=\"img_margin left\"><img alt=\"21.png/image-size:235×112\" height=\"112\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/21.png\" style=\"max-width: 100%; height: auto;\" width=\"235\"/></div></div>", "choices": {"ア": "このビューには，8823行までを記録できる。", "イ": "このビューの作成者は，このビューに対するSELECT権限をもたない。", "ウ": "実表\"取引先\"が削除されても，このビューに対する利用者の権限は残る。", "エ": "利用者\"8823\"は，実表\"取引先\"の所在地が'東京'の行を参照できるようになる。"}, "choices_html": {"ア": "このビューには，8823行までを記録できる。", "イ": "このビューの作成者は，このビューに対するSELECT権限をもたない。", "ウ": "実表\"取引先\"が削除されても，このビューに対する利用者の権限は残る。", "エ": "利用者\"8823\"は，実表\"取引先\"の所在地が'東京'の行を参照できるようになる。"}, "ans": "エ", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_21.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>GRANT文</strong>は、特定のユーザーに表などのデータベースオブジェクトに対する権限を付与するSQL文です。<br/><div class=\"pre\">GRANT オブジェクトの権限 ON オブジェクト名<br/>　　TO { ユーザー名 | ロール名 | PUBLIC }<br/>　　[ WITH GRANT OPTION ]</div>設問のGRANT文は、「ユーザー\"8823\"に対して、ビュー\"東京取引先\"に対するSELECT権限(参照・検索権限)を与える」という意味になります。ビュー\"東京取引先\"は、実表\"取引先\"から所在地の値が東京である行を抽出したものなので、ユーザー\"8823\"はビュー\"東京取引先\"を参照することで、所在地が東京の行を参照できるようになります。<br/><br/>したがって「エ」が正解です。<ul><li class=\"lia\">8823は行数ではなく、権限の付与対象となるユーザー名を表しています。また一般に1つの表・ビューに含まれるレコード数を制限するような機能はDBMSにはありません。</li><li class=\"lii\">ビューの作成者(所有者)になるには、作成するビューの基となる全ての実表またはビューに対する行の選択、挿入、更新または削除の権限が必要です。ビューの作成者には、元の表に対してそのビューの作成者が持っているすべての権限が自動的に付与されます。したがってビューの作成者はSELECT権限を持ちます。</li><li class=\"liu\">実表が削除された場合、それを参照しているビューも強制的に削除されます。実表やビューが削除されると同時にその資源に対する権限も削除されます。</li><li class=\"lie\">正しい。</li></ul></div>", "past_history": [], "hist_count": 1}, {"id": "sc_30_aki_q22", "session": "支援士 H30秋", "gap": 12, "num": 22, "topic": "ソフトウェア結合テストの方式", "subcat": "ソフトウェア結合・適格性テスト", "category": "情報セキュリティ", "mondai": "図のような階層構造で設計及び実装した組込みシステムがある。このシステムの開発プロジェクトにおいて，デバイスドライバ層の単体テスト工程が未終了で，アプリケーション層及びミドルウェア層の単体テストが先に終了した。この段階で行うソフトウェア結合テストの方式として，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">図のような階層構造で設計及び実装した組込みシステムがある。このシステムの開発プロジェクトにおいて，デバイスドライバ層の単体テスト工程が未終了で，アプリケーション層及びミドルウェア層の単体テストが先に終了した。この段階で行うソフトウェア結合テストの方式として，適切なものはどれか。<div class=\"img_margin\"><img alt=\"22.png/image-size:138×111\" height=\"111\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/22.png\" style=\"max-width: 100%; height: auto;\" width=\"138\"/></div></div>", "choices": {"ア": "サンドイッチテスト", "イ": "トップダウンテスト", "ウ": "ビッグバンテスト", "エ": "ボトムアップテスト"}, "choices_html": {"ア": "サンドイッチテスト", "イ": "トップダウンテスト", "ウ": "ビッグバンテスト", "エ": "ボトムアップテスト"}, "ans": "イ", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_22.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\">単体テストが未終了のデバイスドライバ層は、システムの構造上、ミドルウェア層から呼び出される立場にあります。呼び出される側(下位)のモジュールが完成していない状態で、呼び出す側(上位)のモジュールのインタフェースをテストしたいときには、スタブを用意して<em class=\"r\">トップダウンテスト</em>方式の結合テストを行います。<strong>スタブ</strong>とは、未完成の下位モジュールの代わりに上位モジュールからの呼び出しに対して適切な値を返す役割を持つテスト用モジュールです。<div class=\"img_margin\"><img alt=\"22_1.png/image-size:540×188\" height=\"188\" src=\"https://www.sc-siken.com/kakomon/30_aki/img/22_1.png\" style=\"max-width: 100%; height: auto;\" width=\"540\"/></div><ul><li class=\"lia\">サンドイッチテスト(折衷テスト)は、トップダウンテストとボトムアップテストを組み合わせて行う結合テストです。最上位モジュールと最下位モジュールの両方から開始し、1段ずつ結合しながら中間モジュールに至るまでテストを進めます。</li><li class=\"lii\">正しい。上位モジュールが完成、下位モジュールが未完成なので、トップダウンテストを行う場面です。</li><li class=\"liu\">ビッグバンテストは、すべてのモジュールを結合させて一度に動作を検証する結合テストです。</li><li class=\"lie\">ボトムアップテストは、上位モジュールが未完成のときに下位モジュールのインタフェースを検証する結合テストです。</li></ul></div>", "past_history": ["安全確保支援士 R7秋期 問22"], "hist_count": 2}, {"id": "sc_30_aki_q23", "session": "支援士 H30秋", "gap": 12, "num": 23, "topic": "SOAでサービスを設計する際の注意点", "subcat": "開発プロセス・手法", "category": "情報セキュリティ", "mondai": "SOAでサービスを設計する際の注意点のうち，適切なものはどれか。", "mondai_html": "<div id=\"mondai\">SOAでサービスを設計する際の注意点のうち，適切なものはどれか。</div>", "choices": {"ア": "可用性を高めるために，ステートフルなインタフェースとする。", "イ": "業務からの独立性を確保するために，サービスの名称は抽象的なものとする。", "ウ": "業務の変化に対応しやすくするために，サービス間の関係は疎結合にする。", "エ": "セキュリティを高めるために，一度開発したサービスの設計は再利用しない。"}, "choices_html": {"ア": "可用性を高めるために，ステートフルなインタフェースとする。", "イ": "業務からの独立性を確保するために，サービスの名称は抽象的なものとする。", "ウ": "業務の変化に対応しやすくするために，サービス間の関係は疎結合にする。", "エ": "セキュリティを高めるために，一度開発したサービスの設計は再利用しない。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_23.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>SOA</strong>(Service Oriented Architecture)は、ソフトウェアで実現されている業務上の一処理に相当する機能や部品を独立したサービスとし、それらを組み合わせ連携させることで全体のシステムを構築するという手法、またはそのことを指す言葉です。<br/>SOAでは、機能の変更や拡張をサービス(機能)単位でのフレキシブルなシステムの組み換えを可能とし、業務環境の変化に柔軟に対応することを目標としているため、個々のサービスが部品として独立し、サービス間の関係が疎結合(分離している)であることが重要です。<br/><br/>したがって正しい記述は「ウ」になります。<ul><li class=\"lia\">サービスは、ある共有の状態を参照して動作するのではなく、受け渡された値のみによって機能を提供するステートレスなインタフェースでなくてはなりません。</li><li class=\"lii\">個々のサービスが1つの業務部品として扱われるため、サービスの名称は実世界の業務に合わせる形になります。</li><li class=\"liu\">正しい。サービス同士の独立性を高めるため関係を疎結合にします。</li><li class=\"lie\">ソフトウェアを部品化して再利用することが推奨されます。</li></ul></div>", "past_history": ["情報セキュリティ H22秋期 問23", "情報セキュリティ H25春期 問23"], "hist_count": 3}, {"id": "sc_30_aki_q24", "session": "支援士 H30秋", "gap": 12, "num": 24, "topic": "JIS Q 20000-1が要求している事項", "subcat": "サービスマネジメントプロセス", "category": "情報セキュリティ", "mondai": "ITサービスマネジメントの情報セキュリティ管理プロセスに対して，JIS Q 20000-1(サービスマネジメントシステム要求事項)が要求している事項はどれか。", "mondai_html": "<div id=\"mondai\">ITサービスマネジメントの情報セキュリティ管理プロセスに対して，JIS Q 20000-1(サービスマネジメントシステム要求事項)が要求している事項はどれか。</div>", "choices": {"ア": "CMDBに記録されているCIの原本を，セキュリティが保たれた物理的又は電子的に格納庫で管理しなければならない。", "イ": "潜在的な問題を低減させるために，予防処置をとらなければならない。", "ウ": "変更要求が情報セキュリティ基本方針及び管理策に与える潜在的影響を評価しなければならない。", "エ": "変更要求の受入れについての意思決定では，リスク，事業利益及び技術的実現可能性を考慮しなければならない。"}, "choices_html": {"ア": "CMDBに記録されているCIの原本を，セキュリティが保たれた物理的又は電子的に格納庫で管理しなければならない。", "イ": "潜在的な問題を低減させるために，予防処置をとらなければならない。", "ウ": "変更要求が情報セキュリティ基本方針及び管理策に与える潜在的影響を評価しなければならない。", "エ": "変更要求の受入れについての意思決定では，リスク，事業利益及び技術的実現可能性を考慮しなければならない。"}, "ans": "ウ", "web_url": "https://www.sc-siken.com/kakomon/30_aki/am2_24.html", "kaisetsu_html": "<div class=\"ansbg R3tfxFm5\" id=\"kaisetsu\"><strong>JIS Q 20000</strong>は、組織がサービスマネジメントシステムを計画、確立、導入、運用、監視、レビュー、維持するためのサービス提供者に対する要求事項を規定した規格です。<br/><br/>この規格の中の「6.6情報セキュリティ管理」では、次に挙げる2つを特定するために変更要求を評価しなければならない旨の記述があります。<ul><li>新たな情報セキュリティリスク、又は変化した情報セキュリティリスク</li><li>既存の情報セキュリティ基本方針及び<em class=\"r\">管理策への潜在的影響</em></li></ul>上記のうち赤字で示した部分が「ウ」の記述と一致するため、これが正しい答えとなります。<ul><li class=\"lia\">統合的制御プロセスの「9.1構成管理」に対する要求事項です。</li><li class=\"lii\"> let currentMode = localStorage.getItem('dojo_active_mode') || 'am1';
let ALL_QUESTIONS = (currentMode === 'am1' ? AM1_QUESTIONS : AM2_QUESTIONS);

let currentList = [];
let currentIndex = 0;
let isRandom = false;

let historyData = {};
try {
  const saved = localStorage.getItem('ap_dojo_history_223');
  if (saved) historyData = JSON.parse(saved);
} catch(e) {}

function saveHistory() {
  try {
    localStorage.setItem('ap_dojo_history_223', JSON.stringify(historyData));
  } catch(e) {}
  updateScoreDisplay();
}

// ユーザー設定の永続化（リロード後も保持）
function saveFilterPreferences() {
  try {
    localStorage.setItem('dojo_active_mode', currentMode);
    localStorage.setItem('dojo_session_filter_' + currentMode, document.getElementById("sessionFilter").value);
    localStorage.setItem('dojo_cat_filter_' + currentMode, document.getElementById("catFilter").value);
    localStorage.setItem('dojo_status_filter', document.getElementById("statusFilter").value);
    localStorage.setItem('dojo_is_random', isRandom.toString());
  } catch(e) {}
}

// 下スワイプ更新（Pull-to-refresh）防止
let touchStartY = 0;
document.addEventListener('touchstart', function(e) {
  touchStartY = e.touches[0].clientY;
}, { passive: false });

document.addEventListener('touchmove', function(e) {
  const touchY = e.touches[0].clientY;
  const touchDiff = touchY - touchStartY;
  if (window.scrollY <= 0 && touchDiff > 0) {
    if (e.cancelable) {
      e.preventDefault();
    }
  }
}, { passive: false });

function showToast(msg) {
  const toast = document.getElementById("toastBox");
  toast.innerText = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

function updateScoreDisplay() {
  // 現在のモードに属する問題の履歴のみを集計
  const currentPool = (currentMode === 'am1' ? AM1_QUESTIONS : AM2_QUESTIONS);
  const qIds = new Set(currentPool.map(q => q.id));
  
  let solved = 0;
  let correct = 0;
  for (let qId of qIds) {
    const h = historyData[qId];
    if (h) {
      solved++;
      if (h.isCorrect) correct++;
    }
  }
  const pct = solved > 0 ? Math.round((correct / solved) * 100) : 0;
  document.getElementById("scoreText").innerText = `正答率: ${correct}/${solved} (${pct}%)`;
}

function switchMode(newMode) {
  if (currentMode === newMode) return;
  currentMode = newMode;
  
  document.getElementById("modeBtnAm1").classList.toggle("active", newMode === 'am1');
  document.getElementById("modeBtnAm2").classList.toggle("active", newMode === 'am2');
  
  ALL_QUESTIONS = (newMode === 'am1' ? AM1_QUESTIONS : AM2_QUESTIONS);
  
  populateFilterOptions();
  
  // 保持していたセッション/分野の選択を復元（存在すれば）
  const savedSession = localStorage.getItem('dojo_session_filter_' + currentMode);
  if (savedSession && document.querySelector(`#sessionFilter option[value="${savedSession}"]`)) {
    document.getElementById("sessionFilter").value = savedSession;
  }
  const savedCat = localStorage.getItem('dojo_cat_filter_' + currentMode);
  if (savedCat && document.querySelector(`#catFilter option[value="${savedCat}"]`)) {
    document.getElementById("catFilter").value = savedCat;
  }

  saveFilterPreferences();
  filterQuestions(true, false);
  showToast(newMode === 'am1' ? "午前1 に切り替えました" : "午前2 に切り替えました");
}

function filterQuestions(resetIndex = true, isSilent = false) {
  saveFilterPreferences();

  const sFilter = document.getElementById("sessionFilter").value;
  const cFilter = document.getElementById("catFilter").value;
  const stFilter = document.getElementById("statusFilter").value;

  currentList = ALL_QUESTIONS.filter(q => {
    if (sFilter !== "all" && q.session !== sFilter) return false;
    if (cFilter !== "all" && q.category !== cFilter && q.subcat !== cFilter) return false;
    
    const h = historyData[q.id];
    if (stFilter === "unsolved" && h) return false;
    if (stFilter === "unsolved_or_wrong" && (h && h.isCorrect)) return false;
    if (stFilter === "wrong" && (!h || h.isCorrect)) return false;
    if (stFilter === "correct" && (!h || !h.isCorrect)) return false;
    if (stFilter === "legend" && (q.hist_count || 1) < 5) return false;
    return true;
  });

  if (currentList.length === 0) {
    alert("条件に該当する問題がありませんでした。すべての問題を表示します。");
    document.getElementById("statusFilter").value = "all";
    saveFilterPreferences();
    return filterQuestions(true, true);
  }

  if (isRandom) shuffle(currentList);
  if (resetIndex) {
    currentIndex = 0;
  } else {
    if (currentIndex >= currentList.length) currentIndex = 0;
  }

  loadQuestion(currentIndex);
  updateScoreDisplay();

  if (resetIndex && !isSilent) {
    const sel = document.getElementById("statusFilter");
    const label = sel.options[sel.selectedIndex].text;
    showToast(`${label} で再開（全 ${currentList.length} 問）`);
  }
}

// フィルター選択時の即座反映＆再選択での再開イベント登録
function setupFilterEvents() {
  const filters = ["sessionFilter", "catFilter", "statusFilter"];
  filters.forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("change", () => filterQuestions(true));
    el.addEventListener("input", () => filterQuestions(true));
    // 同じものを選択して閉じた場合（blur）も確実に再開
    el.addEventListener("blur", () => filterQuestions(true, true));
  });
}

function toggleRandom() {
  isRandom = !isRandom;
  document.getElementById("randomBtn").innerText = isRandom ? "🔀 順番: ランダム" : "🔀 順番: 通常";
  document.getElementById("randomBtn").style.background = isRandom ? "var(--tag-bg)" : "";
  saveFilterPreferences();
  if (isRandom) shuffle(currentList);
  currentIndex = 0;
  loadQuestion(currentIndex);
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function loadQuestion(idx) {
  if (idx < 0 || idx >= currentList.length) return;
  const q = currentList[idx];
  const stFilter = document.getElementById("statusFilter").value;
  
  // 「不正解のみ」または「未回答or不正解」の時、不正解だった問題は再挑戦モード（まっさらな状態で解ける）にする
  const isRetryFilter = (stFilter === "wrong" || stFilter === "unsolved_or_wrong");
  const h = historyData[q.id];
  const shouldRetryFresh = isRetryFilter && (h && !h.isCorrect);

  document.getElementById("progressText").innerText = `問 ${idx + 1} / ${currentList.length}`;
  document.getElementById("qNumber").innerText = `第 ${idx + 1} 問 【${q.session} 問${q.num}】`;

  const statusDiv = document.getElementById("qStatusBadge");

  if (shouldRetryFresh) {
    statusDiv.innerHTML = `<span class="q-status-badge status-wrong">🔄 再解答</span>`;
  } else if (!h) {
    statusDiv.innerHTML = `<span class="q-status-badge status-unanswered">未解答</span>`;
  } else if (h.isCorrect) {
    statusDiv.innerHTML = `<span class="q-status-badge status-correct">✓ 正解済</span>`;
  } else {
    statusDiv.innerHTML = `<span class="q-status-badge status-wrong">✕ 誤答</span>`;
  }

  const tagsDiv = document.getElementById("qTags");
  tagsDiv.innerHTML = `
    <span class="badge badge-session">${q.session} (${q.gap}回前)</span>
    <span class="badge badge-cat">${q.category || ''} &gt; ${q.subcat || ''}</span>
    <span class="badge badge-freq">★通算実績: ${q.hist_count || 1}回出題</span>
  `;

  document.getElementById("qBody").innerHTML = q.mondai_html || q.mondai || "（問題文テキスト）";
  document.getElementById("webLink").href = q.web_url;

  const list = document.getElementById("choicesList");
  list.innerHTML = "";
  const keys = ["ア", "イ", "ウ", "エ"];
  const cData = q.choices_html || q.choices || {};

  keys.forEach(k => {
    if (!cData[k]) return;
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="choice-key">${k}</span><span class="choice-text">${cData[k]}</span>`;
    btn.onclick = () => selectChoice(k, q.ans, btn, q.id);
    list.appendChild(btn);
  });

  const panel = document.getElementById("answerPanel");

  // 再解答モード（shouldRetryFresh）の時は、過去の選択や解説を隠して真っ新な状態で解かせる
  if (h && !shouldRetryFresh) {
    showExplanation(h.isCorrect, h.selected, q.ans);
    const allBtns = document.querySelectorAll(".choice-btn");
    allBtns.forEach(b => {
      b.disabled = true;
      const key = b.querySelector(".choice-key").innerText;
      if (key === h.selected) {
        b.classList.add(h.isCorrect ? "selected-correct" : "selected-wrong");
      }
      if (!h.isCorrect && key === q.ans) {
        b.classList.add("correct-highlight");
      }
    });
  } else {
    panel.style.display = "none";
  }

  // 上下すべての前へ・次へボタンの有効/無効を連動
  document.querySelectorAll(".nav-prev-btn").forEach(btn => btn.disabled = (idx === 0));
  document.querySelectorAll(".nav-next-btn").forEach(btn => btn.disabled = (idx === currentList.length - 1));
}

function selectChoice(selectedKey, correctKey, btn, qId) {
  const allBtns = document.querySelectorAll(".choice-btn");
  allBtns.forEach(b => b.disabled = true);

  const isCorrect = (selectedKey === correctKey);
  historyData[qId] = { selected: selectedKey, isCorrect: isCorrect, time: Date.now() };
  saveHistory();

  const statusDiv = document.getElementById("qStatusBadge");
  statusDiv.innerHTML = isCorrect ? 
    `<span class="q-status-badge status-correct">✓ 正解済</span>` : 
    `<span class="q-status-badge status-wrong">✕ 誤答</span>`;

  if (isCorrect) {
    btn.classList.add("selected-correct");
  } else {
    btn.classList.add("selected-wrong");
    allBtns.forEach(b => {
      if (b.querySelector(".choice-key").innerText === correctKey) {
        b.classList.add("correct-highlight");
      }
    });
  }

  showExplanation(isCorrect, selectedKey, correctKey);
}

function showExplanation(isCorrect, selectedKey, correctKey) {
  const q = currentList[currentIndex];
  const panel = document.getElementById("answerPanel");
  const title = document.getElementById("ansResult");
  const kContent = document.getElementById("kaisetsuContent");
  const hList = document.getElementById("historyList");

  panel.style.display = "block";
  if (selectedKey !== undefined) {
    title.className = `ans-title ${isCorrect ? 'correct' : 'wrong'}`;
    title.innerText = isCorrect ? "🎉 正解です！" : `❌ 不正解です（あなたの回答: ${selectedKey} ／ 正解: ${q.ans}）`;
  } else {
    title.className = "ans-title correct";
    title.innerText = `💡 正解: 【 ${q.ans} 】`;
  }

  kContent.innerHTML = q.kaisetsu_html || "<p>解説がありません。</p>";

  hList.innerHTML = "";
  if (q.past_history && q.past_history.length > 0) {
    q.past_history.forEach(h => {
      const li = document.createElement("li");
      li.innerText = h;
      hList.appendChild(li);
    });
  } else {
    hList.innerHTML = "<li>出題歴情報なし</li>";
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function nextQuestion() {
  if (currentIndex < currentList.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function exportHistory() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(historyData));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `dojo_history_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function importHistory(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(event) {
    try {
      const imported = JSON.parse(event.target.result);
      historyData = Object.assign(historyData, imported);
      saveHistory();
      alert("解答記録を正常に読み込みました！");
      filterQuestions(false);
    } catch(err) {
      alert("ファイル読み込みに失敗しました。正しいバックアップファイルを選択してください。");
    }
  };
  reader.readAsText(file);
}

function resetHistory() {
  if (confirm(`これまでの解答記録を全てリセットしますか？`)) {
    historyData = {};
    saveHistory();
    filterQuestions(true);
    showToast("記録をリセットしました");
  }
}

function init() {
  // 保存されたモードの復元
  currentMode = localStorage.getItem('dojo_active_mode') || 'am1';
  document.getElementById("modeBtnAm1").classList.toggle("active", currentMode === 'am1');
  document.getElementById("modeBtnAm2").classList.toggle("active", currentMode === 'am2');
  
  ALL_QUESTIONS = (currentMode === 'am1' ? AM1_QUESTIONS : AM2_QUESTIONS);
  
  populateFilterOptions();
  
  // 保存されたフィルター設定の復元（リロード対策）
  const savedSession = localStorage.getItem('dojo_session_filter_' + currentMode);
  if (savedSession && document.querySelector(`#sessionFilter option[value="${savedSession}"]`)) {
    document.getElementById("sessionFilter").value = savedSession;
  }
  
  const savedCat = localStorage.getItem('dojo_cat_filter_' + currentMode);
  if (savedCat && document.querySelector(`#catFilter option[value="${savedCat}"]`)) {
    document.getElementById("catFilter").value = savedCat;
  }
  
  const savedStatus = localStorage.getItem('dojo_status_filter');
  if (savedStatus && document.querySelector(`#statusFilter option[value="${savedStatus}"]`)) {
    document.getElementById("statusFilter").value = savedStatus;
  }

  const savedRandom = localStorage.getItem('dojo_is_random');
  if (savedRandom !== null) {
    isRandom = (savedRandom === 'true');
    document.getElementById("randomBtn").innerText = isRandom ? "🔀 順番: ランダム" : "🔀 順番: 通常";
    document.getElementById("randomBtn").style.background = isRandom ? "var(--tag-bg)" : "";
  }
  
  setupFilterEvents();
  filterQuestions(true, true);
}

init();
</script>
</body>
</html>
